 पूछकर आरंभ होता है। **कोटि (order)** उपस्थित सर्वोच्च अवकलज है — कोई\nd²y/dx² हो तो द्वितीय कोटि। **घात (degree)** वह घातांक है जिस पर वह सर्वोच्च अवकलज उठाया गया है, और घात\nगिनी ही तभी जाती है जब समीकरण अपने अवकलजों में बहुपदीय हो। अतः (d²y/dx²)³ + y = 0 की कोटि 2 और घात 3 है;\nपर sin(dy/dx) = y की कोटि 1 है और **घात परिभाषित नहीं**, क्योंकि ज्या बहुपद नहीं है। वह अंतिम स्थिति एक\nप्रिय एक-अंकीय प्रश्न है।\n\nइस पाठ्यक्रम में हल ठीक दो प्रकार का होता है, और यह पहचानना कि आप किसे देख रहे हैं, पूरा खेल है।\n\n**चर पृथक्करणीय (variables separable)** सबसे पहले आज़माने की चीज़ है। यदि आप समीकरण को इस तरह फेंट सकें कि\nसारे y और dy एक ओर और सारे x तथा dx दूसरी ओर बैठ जाएँ, तो आप दोनों पक्षों का समाकलन कर देते हैं और काम पूरा।\ndy/dx = xy पृथक होकर dy/y = x dx बनता है, जिससे ln y = x²/2 + C। जो कुछ (x का फलन) × (y का फलन) में\nगुणनखंडित होता है, वह पृथक हो जाएगा।\n\n**रैखिक प्रथम कोटि** दूसरा प्रकार है, और उसका एक निश्चित नुस्ख़ा है। समीकरण को dy/dx + Py = Q के आकार में\nलाइए, जहाँ P और Q में केवल x हो। **समाकलन गुणक** e^∫P dx निकालिए, उससे पूरे समीकरण को गुणा कीजिए, और बायाँ\nपक्ष एक अकेले गुणनफल के अवकलज में सिमट जाता है — गुणक का पूरा प्रयोजन यही है। फिर एक बार समाकलन कीजिए। सूत्र\ny × IF = ∫Q × IF dx रटने योग्य है, पर उसका कारण भी, क्योंकि बोर्ड कभी P और Q अलग-अलग पहचानने को कहता है।\n\nदो व्यावहारिक सलाह। **सदा पहले पृथक्करण देखिए** — वह तेज़ है, और कुछ समीकरण जो रैखिक लगते हैं, पृथक हो जाते\nहैं। और जब प्रश्न \"x = 0 पर y = 1\" जैसी अतिरिक्त शर्त दे, तो वह C तय करने के लिए है: पहले व्यापक हल निकालिए,\nफिर सबसे अंत में मान रखिए। जहाँ विशिष्ट हल माँगा गया हो वहाँ व्यापक हल देने पर कलन पूर्ण होते हुए भी अंक\nकटते हैं।\n\nपाठ्यक्रम-विस्तार पर ध्यान दें: समघातीय अवकल समीकरण और प्रतिस्थापन y = vx युक्तिसंगत पाठ्यक्रम में हटाए गए\nहैं। उन पर काम करने से पहले इस अध्याय का §1 देखिए — यदि वे आपके वर्ष के लिए बाहर हैं, तो यह बड़ी बचत है,\nऔर इससे यह अध्याय प्रश्नपत्र में प्रति-घंटा-अंक के हिसाब से सर्वोत्तम में आ जाता है।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: अवकल समीकरण कक्षा 12](https://www.youtube.com/results?search_query=differential+equations+class+12+maths+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/math/differential-equations) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 2, अध्याय 9 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh203.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — NCERT प्रश्नावलियाँ, फिर Exemplar अध्याय 9। समाकलन-गुणक वाले प्रकार का\n  अभ्यास तब तक कीजिए जब तक चारों चरण बिना सोचे न हो जाएँ; उसका आना लगभग निश्चित है।","m10":"\"5 किलोमीटर चलो\" अपूर्ण सूचना है। \"5 किलोमीटर उत्तर की ओर चलो\" काम की सूचना है। कुछ राशियों को अर्थ पाने के\nलिए दिशा चाहिए और कुछ को नहीं, और **सदिश** तथा **अदिश** का पूरा भेद यही है। दूरी, द्रव्यमान, ताप और चाल\nअदिश हैं — प्रत्येक एक संख्या। विस्थापन, बल, वेग और त्वरण सदिश हैं — एक संख्या **और** एक दिशा।\n\nसदिश को एक तीर की तरह खींचिए: उसकी लंबाई परिमाण है, उसका संकेत करना दिशा। तीर कहाँ बैठा है इससे कोई अंतर\nनहीं पड़ता, अतः आप उसे स्वतंत्र रूप से सरका सकते हैं — और इसी से आप सदिशों को नाक-से-पूँछ जोड़ पाते हैं।\n3 km पूर्व चलिए, फिर 4 km उत्तर, और आपका विस्थापन आरंभ से अंत तक का एक अकेला तीर है — 5 km, उत्तर-पूर्व की\nओर। ध्यान दीजिए कि 3 + 4 ने 5 दिया, क्योंकि दिशाएँ भिन्न थीं। यही एक बात भीतर उतारनी है: **सदिश संख्याओं\nकी तरह नहीं जुड़ते**, जब तक वे एक ही दिशा में न हों।\n\nनिर्देशांकों में सदिश 3î + 4ĵ + 0k̂ लिखा जाता है, अर्थात् x के अनुदिश तीन इकाई, y के अनुदिश चार, z के\nअनुदिश कुछ नहीं। **परिमाण** त्रि-विमीय पाइथागोरस है, √(3² + 4²) = 5। **मात्रक सदिश** वही तीर लंबाई 1 तक\nसिकोड़ा हुआ है — परिमाण से भाग देकर मिलता है — और उसका एकमात्र काम बिना आकार के दिशा ढोना है। जब भी प्रश्न\n\"की दिशा में\" पूछे, उसे मात्रक सदिश चाहिए।\n\nफिर अध्याय के दो गुणन, जो वास्तव में भिन्न संक्रियाएँ हैं और संयोग से नाम बाँटती हैं; इन्हें अलग रखना ही\nअधिकांश काम है।\n\n**अदिश गुणनफल (dot product)** a·b = |a||b|cos θ एक **संख्या** देता है। यह नापता है कि एक सदिश का कितना भाग\nदूसरे के अनुदिश है। इसके काम के दो संकेत: यह तब सबसे बड़ा है जब सदिश समांतर हों, और वह **ठीक शून्य है जब वे\nलंबवत हों** — क्योंकि cos 90° = 0। वह शून्य-कसौटी इस अध्याय के किसी भी एक तथ्य से अधिक अंक देती है; \"सिद्ध\nकीजिए कि ये लंबवत हैं\" वाला लगभग हर प्रश्न एक अदिश गुणनफल है। निर्देशांकों में यह सुंदर रूप से सरल है:\nमेल खाते घटक गुणा कीजिए और जोड़ दीजिए। इसका भौतिक अर्थ कार्य है — बल का विस्थापन के साथ अदिश गुणनफल — और\nइसीलिए बल का केवल वही घटक गिना जाता है जो गति के अनुदिश हो।\n\n**सदिश गुणनफल (cross product)** एक **सदिश** देता है, जिसका परिमाण |a||b|sin θ है और दिशा दोनों के लंबवत,\nदक्षिण-हस्त नियम से मिलती है। इसके संकेत दर्पण-छवि हैं: यह शून्य है जब सदिश **समांतर** हों (sin 0° = 0), और\nसबसे बड़ा जब लंबवत हों। इसका परिमाण उस **समांतर चतुर्भुज का क्षेत्रफल** है जो दो सदिश घेरते हैं — अतः उसका\nआधा त्रिभुज का क्षेत्रफल है, और बोर्ड के क्षेत्रफल-प्रश्न इसी तरह बनाए जाते हैं। सदिश गुणनफल होने के कारण\nयह क्रमविनिमेय नहीं है: a × b = −(b × a), वही आकार, उलटी दिशा।\n\nदोनों को उनके शून्यों से अलग रखिए, क्योंकि प्रश्न इसी तरह पहचाने जाते हैं: **अदिश गुणनफल शून्य = लंबवत;\nसदिश गुणनफल शून्य = समांतर।** इसे उलट दीजिए और पूरे प्रश्न चले जाएँगे।\n\nअंतिम विचार, **प्रक्षेप (projection)**, अदिश गुणनफल का अपना काम करना है। b पर a का प्रक्षेप (a·b)/|b| है —\nb की दिशा में डाली गई a की छाया कितनी लंबी है। यह सीधे पूछा जाता है, और यही वह मानसिक चित्र भी है जिससे\nअदिश गुणनफल मनमाना नहीं, अपरिहार्य लगने लगता है।\n\nयह अध्याय छोटा है, अच्छे अंक देता है, और अगले अध्याय की नींव है। इसे प्रारंभिक समझकर हलका न लीजिए; इसके बिना\nत्रि-विमीय ज्यामिति अनुपयोगी है।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: सदिश बीजगणित कक्षा 12](https://www.youtube.com/results?search_query=vector+algebra+class+12+maths+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/math/precalculus/x9e81a4f98389efdf:vectors) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 2, अध्याय 10 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh204.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — NCERT प्रश्नावलियाँ, फिर Exemplar अध्याय 10। यदि दोनों गुणनफलों का ज्यामितीय\n  अर्थ अभी नहीं बैठा, तो HC Verma *Concepts of Physics* भाग 1 अध्याय 2 §2.5–2.9 उन्हें बलों और बल-आघूर्णों\n  से समझाता है, जो बहुत विद्यार्थियों को बीजगणित से अधिक मूर्त लगता है।","m11":"यह अध्याय अध्याय 10 को काम पर लगाना है। यह अंतरिक्ष में रेखाओं और समतलों के बारे में ज्यामितीय प्रश्नों का\nउत्तर देता है — दो विषमतलीय रेखाओं के बीच की दूरी, वह कोण जिस पर रेखा समतल से मिलती है, रेखा किसी पृष्ठ को\nकहाँ भेदती है — और उत्तर चित्र खींचकर नहीं, अदिश तथा सदिश गुणनफलों से देता है, जो सौभाग्य की बात है, क्योंकि\nतीन विमाओं में चित्र खींचना कठिन है।\n\nपकड़े रखने वाला एक विचार यह है कि **रेखा = एक बिंदु + एक दिशा**, और **समतल = एक बिंदु + एक लंब**। बाकी सब\nइसी से निकलता है।\n\n**रेखा** यह कहकर बताई जाती है कि \"यहाँ से चलो, फिर उस ओर बढ़ो\": r = a + λb, जहाँ a रेखा पर किसी ज्ञात बिंदु\nका स्थिति सदिश है, b उसकी दिशा है, और λ वह घुंडी है जिसे घुमाकर आप उस पर सरकते हैं। रेखा का हर बिंदु λ का\nकोई मान है। कार्तीय रूप (x − x₁)/a = (y − y₁)/b = (z − z₁)/c वही कथन है — अंश बताते हैं कि आप ज्ञात बिंदु से\nकितना हटे हैं, हर दिशा हैं, और तीनों अनुपात बराबर रखना केवल यह कहता है कि आप तीनों अक्षों पर समानुपाती हटे।\nयदि प्रश्न दिशा के बजाय दो बिंदु दे, तो उन्हें घटा दीजिए: दिशा एक से दूसरे तक का तीर है।\n\n**समतल** भिन्न तरीके से बताया जाता है, और यही वह चरण है जिस पर वास्तव में सोचना चाहिए। आप समतल को उसके\n**भीतर** की किसी दिशा से निर्दिष्ट नहीं कर सकते — भीतर अनंत दिशाएँ हैं। जो समतल को अद्वितीय रूप से बाँधता\nहै वह उसके **लंबवत** दिशा है, जिसे **अभिलंब (normal)** कहते हैं। अतः समतल है \"वे सब बिंदु जिनका किसी ज्ञात\nबिंदु से विस्थापन n के लंबवत है\", जो अदिश-गुणनफल की भाषा में (r − a)·n = 0 है, और पुनर्व्यवस्थित करने पर\nr·n = d। कार्तीय रूप ax + by + cz = d में संख्याएँ a, b, c अभिलंब के घटक ही **हैं** — उन्हें सीधे पढ़ लीजिए।\nयह एक प्रेक्षण समतल के अधिकांश प्रश्नों को सदिश-गणित में बदल देता है।\n\nअब हर मानक प्रश्न इन्हीं विचारों के साथ कोई अदिश या सदिश गुणनफल जुड़ा हुआ है, और प्रतिरूप देख लेना उपयोगी है:\n\n- **दो रेखाओं के बीच कोण** — उनकी दिशाओं के बीच का कोण, अतः दोनों b का अदिश गुणनफल।\n- **दो समतलों के बीच कोण** — उनके **अभिलंबों** के बीच का कोण, अतः दोनों n का अदिश गुणनफल।\n- **रेखा और समतल के बीच कोण** — यहाँ जाल है। रेखा की दिशा का समतल के अभिलंब से अदिश गुणनफल आपको अभिलंब से\n  कोण देता है, समतल से नहीं। आपको चाहिए उसका पूरक, अतः जहाँ cos लगता, वहाँ **sin θ** लगाइए। हर वर्ष कोई यह\n  अंक गँवाता है।\n- **लंबवत रेखाएँ** — दिशाओं का अदिश गुणनफल शून्य। **समांतर रेखाएँ** — दिशाओं का सदिश गुणनफल शून्य।\n- **समांतर समतल** — वही अभिलंब (किसी अदिश गुणक तक)।\n\n**दूरियाँ** दूसरा परिवार हैं, और वहाँ काम सदिश गुणनफल करता है, क्योंकि सदिश गुणनफल लंबवत भाग नापता है। बिंदु\nसे रेखा की न्यूनतम दूरी, और दो **विषमतलीय (skew)** रेखाओं के बीच की न्यूनतम दूरी — वे रेखाएँ जो न मिलती हैं\nन समांतर हैं, और जो केवल तीन विमाओं में हो सकती हैं — दोनों सूत्र पत्रक के मानक सूत्रों से निकलती हैं।\nविषमतलीय रेखाओं के लिए अंश एक अदिश त्रिक गुणनफल है और हर |b₁ × b₂|, और पूरी बात दोनों के लंबवत उस एक दिशा\nपर रेखाओं के बीच के अंतराल का प्रक्षेप है। सूत्र के रूप में जानने योग्य; छाया के रूप में समझने योग्य।\n\nव्यावहारिक सलाह: यह अध्याय असामान्य रूप से सूत्र-बहुल है, और इससे पार जाने का सबसे तेज़ रास्ता बारह सूत्र\nरटना नहीं, बल्कि यह पहचानना है कि आप पाँच-छह **स्थितियों** में से किस में हैं। प्रश्न पढ़िए और पूछिए: यह\nरेखा है या समतल, कोण है या दूरी? सूत्र उसी से निकल आता है। और सदिश तथा कार्तीय रूप के बीच धाराप्रवाह\nआ-जा सकिए — प्रश्न अक्सर एक देकर दूसरा माँगते हैं, और वह रूपांतरण घटक पढ़ लेने भर है।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: त्रि-विमीय ज्यामिति कक्षा 12](https://www.youtube.com/results?search_query=three+dimensional+geometry+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/search?page_search_query=lines%20planes%20three%20dimensional%20geometry) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 2, अध्याय 11 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh205.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — NCERT प्रश्नावलियाँ बोर्ड की भाषा से सबसे मेल खाती हैं; फिर विषमतलीय रेखा\n  और बिंदु-के-प्रतिबिंब वाले प्रकारों के लिए Exemplar अध्याय 11।","m12":"एक कारख़ाना कुर्सियाँ और मेज़ें बना सकता है। हर कुर्सी में 2 घंटे बढ़ईगीरी और 1 घंटा पॉलिश लगती है; हर मेज़\nमें 3 घंटे बढ़ईगीरी और 1 घंटा पॉलिश। इस सप्ताह 60 घंटे बढ़ईगीरी और 24 घंटे पॉलिश उपलब्ध हैं। कुर्सी पर\n₹200 और मेज़ पर ₹300 लाभ है। कितनी-कितनी बनानी चाहिए?\n\nयह **रैखिक प्रोग्रामन** की समस्या है, और पूरा अध्याय यही है। इसका ढाँचा देखिए: आप कुछ अधिकतम करना चाहते हैं\n(लाभ) उन सीमाओं के भीतर जिन्हें आप पार नहीं कर सकते (उपलब्ध घंटे)। \"रैखिक\" का अर्थ है सब कुछ समानुपाती है —\nदोगुनी कुर्सियों में दोगुने घंटे और दोगुना लाभ, कोई थोक-छूट या पैमाने की बचत नहीं। वही मान्यता इस समस्या को\nचित्र खींचकर हल करने योग्य बनाती है।\n\nविधि के चार चरण हैं और वे कभी नहीं बदलते।\n\n**चरण 1 — चर नाम दीजिए।** मानिए x कुर्सियों की संख्या और y मेज़ों की। अपने उत्तर में यह स्पष्ट लिखिए; इसके\nलिए अंक मिलते हैं।\n\n**चरण 2 — प्रतिबंधों को असमिकाओं के रूप में लिखिए।** बढ़ईगीरी: 2x + 3y ≤ 60। पॉलिश: x + y ≤ 24। और, चूँकि\nआप ऋणात्मक संख्या में कुर्सियाँ नहीं बना सकते, x ≥ 0 तथा y ≥ 0। ये अंतिम दो भूलना आसान है और वे मायने रखते\nहैं — वे ही आपको एक चतुर्थांश में सीमित करते हैं।\n\n**चरण 3 — चित्र बनाइए।** हर असमिका एक अर्ध-तल है: सीमा-रेखा खींचिए, फिर तय कीजिए कौन-सा पक्ष उसे संतुष्ट\nकरता है (मूल बिंदु से जाँचना आमतौर पर सबसे तेज़ है)। जो क्षेत्र **सभी** को एक साथ संतुष्ट करता है वह\n**सुसंगत क्षेत्र (feasible region)** है, और उसका हर बिंदु वास्तव में संभव उत्पादन-योजना है। उसे छायांकित\nकीजिए और उसके कोने अंकित कीजिए।\n\n**चरण 4 — कोनों पर मान निकालिए।** यहाँ वह प्रमेय है जो इसे काम करने देती है, और इसका कारण जानना उपयोगी है,\nकेवल उपयोग करना नहीं। लाभ फलन Z = 200x + 300y की समोच्च रेखाएँ सरल और समांतर हैं। ऐसी रेखा को बहुभुज पर\nसरकाइए और बाहर निकलते समय वह अंतिम बिंदु जिसे वह छूती है, सदैव एक **कोना** होता है — कभी किसी भुजा का मध्य\nनहीं, कभी भीतरी भाग नहीं। अतः Z का अधिकतम और न्यूनतम सुसंगत क्षेत्र के शीर्षों पर ही होना चाहिए। आपको अनंत\nबिंदु जाँचने की आवश्यकता नहीं; आप चार-पाँच जाँचते हैं। कोनों और उनके Z मानों की सारणी बनाइए, और बताइए कौन-सा\nउत्तर है।\n\nदो स्थितियों के लिए तैयार रहिए, क्योंकि बोर्ड उन्हें जाँचता है।\n\n**अपरिबद्ध (unbounded)** क्षेत्र — जो बिना बंद किनारे के दूर तक फैला हो। उसका न्यूनतम हो सकता है पर अधिकतम\nनहीं, या उलटा। जाँच ईमानदार और सरल है: यदि क्षेत्र उस दिशा में अपरिबद्ध है जिसमें Z बढ़ता है, तो अधिकतम का\nअस्तित्व नहीं है, और आपको यही लिखना चाहिए — जो सबसे बड़ा कोना आपने अंकित किया उसे चुन लेना नहीं।\n\n**बराबरी।** यदि दो आसन्न कोनों पर Z समान आता है, तो उनके बीच की भुजा का हर बिंदु समान रूप से इष्टतम है, और\nअनंत हल हैं। यही लिखिए; मनमाने ढंग से एक चुन न लीजिए।\n\nअध्याय लगभग 5 अंकों का है, इसमें कोई सूत्र रटना नहीं है, और यह प्रश्नपत्र में प्रति-घंटा-अंक के हिसाब से\nसर्वोत्तम में है — बशर्ते आपका ग्राफ़ वास्तविक ग्राफ़ पेपर पर बना हो, अक्ष अंशांकित हों और कोने अंकित हों।\nयहाँ अधिकांश अंक न समझ की कमी से जाते हैं, लापरवाह चित्र से जाते हैं।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: रैखिक प्रोग्रामन कक्षा 12](https://www.youtube.com/results?search_query=linear+programming+class+12+maths+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/search?page_search_query=graphing%20systems%20of%20inequalities) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 2, अध्याय 12 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh206.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — NCERT की प्रश्नावली प्रतिनिधि है; ध्यान रखिए कि अंक शब्द-समस्या के\n  **सूत्रीकरण** में केंद्रित होते हैं, अतः कहानी को असमिकाओं में बदलने का अभ्यास तब भी कीजिए जब आप ग्राफ़\n  पूरा न करें।","m13":"इस अध्याय का बहुत भाग एक ही विचार पर है, और वह विचार ऐसा है जिसे मानवीय अंतर्ज्ञान लगभग हर बार ग़लत समझता\nहै: **नई सूचना से आपकी मान्यता कितनी बदलनी चाहिए।**\n\nयह मानक उदाहरण है, और इस पर थोड़ा ठहरना चाहिए। एक रोग 1000 में 1 व्यक्ति को होता है। उसकी जाँच 99% सही है।\nआपकी जाँच धनात्मक आई। आपको रोग होने की संभावना कितनी है? लगभग सब कहते हैं 99%। सही उत्तर लगभग 9% है। 1000\nलोगों में एक को रोग है और उसकी जाँच धनात्मक आती है; शेष 999 स्वस्थ लोगों में से 1% — लगभग दस लोग — फिर भी\nधनात्मक आ जाते हैं। अतः ग्यारह लोगों की जाँच धनात्मक है और उनमें केवल एक बीमार है। जाँच अच्छी है; रोग ही\nदुर्लभ है, और दुर्लभता भारी पड़ जाती है।\n\nवही गणना **बेज़ प्रमेय (Bayes' theorem)** है, और अध्याय उसी तक बनता जाता है।\n\n**सप्रतिबंध प्रायिकता (conditional probability)** नींव है: P(A|B), पढ़िए \"B के दिए होने पर A की प्रायिकता\",\nवह प्रायिकता है जब आप जान चुके हैं कि B घट गया है। B जानने से दुनिया सिकुड़कर केवल वे परिणाम रह जाते हैं\nजहाँ B सत्य है, अतः आप उस छोटी दुनिया में A का हिस्सा गिनते हैं: P(A|B) = P(A∩B)/P(B)। पत्ता निकालकर यह बता\nदिया जाए कि वह चित्र वाला पत्ता है, तो उसके बादशाह होने की प्रायिकता 4/52 से 4/12 हो जाती है। पत्ते में कुछ\nनहीं बदला; बदला यह कि आप क्या जानते हैं।\n\n**स्वतंत्रता** वह विशेष स्थिति है जहाँ सूचना बेकार है। A और B स्वतंत्र हैं यदि B जानने से आपको A के बारे में\nकुछ न मिले, अतः P(A|B) = P(A), जो पुनर्व्यवस्थित होकर वह कसौटी बनती है जिसे आप उपयोग करेंगे:\n**P(A∩B) = P(A)·P(B)**। सिक्के के दो उछाल स्वतंत्र हैं। प्रतिस्थापन के बिना निकाले दो पत्ते नहीं, क्योंकि\nपहला निकालना बदल देता है कि बचा क्या है। \"प्रतिस्थापन के साथ\" या \"प्रतिस्थापन के बिना\" वाक्यांश पर नज़र\nरखिए — पूरा प्रश्न उसी से तय होता है।\n\n**गुणन प्रमेय** वही संबंध आगे की दिशा में उपयोग करना है, और **कुल प्रायिकता** का नियम वह तरीका है जिससे आप\nउस स्थिति को सँभालते हैं जो कई रास्तों से बन सकती थी: यदि गेंद थैली A से आ सकती थी या थैली B से, तो उसके\nलाल होने की कुल संभावना = हर थैली की संभावना गुणा उस थैली से लाल आने की संभावना, सब जोड़कर। फिर **बेज़\nप्रमेय** उसी तर्क को **उलटा** चलाती है — गेंद लाल है, तो वह संभवतः किस थैली से आई? वह उलटाव अध्याय का\nप्रमुख 5-अंकीय प्रश्न है, और वह सदा कहानी के वेश में आता है: दो मशीनें और एक खराब वस्तु, तीन थैलियाँ और एक\nरंगीन गेंद, दो डॉक्टर और एक निदान। शब्द बदलते हैं; ढाँचा कभी नहीं।\n\nइन्हें सही करने का एक यंत्रवत् तरीका है जिसे अपनाना चाहिए: **वृक्ष बनाइए।** संभावित स्रोतों के लिए शाखाएँ\nउनकी पूर्व प्रायिकताओं के साथ, फिर देखे गए परिणाम के लिए शाखाएँ उनकी सप्रतिबंध प्रायिकताओं के साथ, और हर पथ\nपर गुणा करते जाइए। बेज़ प्रमेय तब केवल यह है — \"जिस पथ की मुझे चिंता है, उसे उन सब पथों से भाग दीजिए जो वह\nपरिणाम देते हैं\"। जो विद्यार्थी वृक्ष बनाते हैं वे ये प्रश्न सही करते हैं; जो सीधे सूत्र उठाते हैं वे उलझ\nजाते हैं कि कौन-सी प्रायिकता किस पर प्रतिबंधित है।\n\nअंतिम टुकड़ा है **यादृच्छिक चर** और उसका **माध्य**। यादृच्छिक चर प्रत्येक परिणाम से एक संख्या जोड़ देता है\n— जैसे तीन उछालों में चितों की संख्या — और उसका प्रायिकता बंटन मानों को उनकी प्रायिकताओं के साथ सूचीबद्ध\nकरता है। माध्य, या प्रत्याशा, Σx·P(x) है: प्रत्येक मान उसकी संभावना से भारित। यह दीर्घकालिक औसत है, और यह\nआवश्यक नहीं कि वह मान चर वास्तव में ले सके — तीन उछालों में चितों की प्रत्याशित संख्या 1.5 है। आगे बढ़ने से\nपहले दो जाँचें: हर प्रायिकता 0 और 1 के बीच होनी चाहिए, और उनका योग ठीक 1 होना चाहिए। यदि आपकी बंटन सारणी\nइनमें से कोई जाँच विफल करती है, रुकिए और त्रुटि खोजिए।\n\nपाठ्यक्रम-विस्तार पर ध्यान दें: द्विपद बंटन और प्रसरण युक्तिसंगत पाठ्यक्रम में हटाए गए हैं। उन्हें पढ़ने से\nपहले इस अध्याय का §1 देखिए।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: प्रायिकता कक्षा 12 बेज़ प्रमेय](https://www.youtube.com/results?search_query=probability+class+12+maths+bayes+theorem+hindi+one+shot)\n- **बेज़ प्रमेय अंतर्ज्ञान के विरुद्ध क्यों है** — [3Blue1Brown](https://www.youtube.com/results?search_query=bayes+theorem+3blue1brown) (अंग्रेज़ी में)।\n  उपलब्ध सबसे स्पष्ट दृश्य व्याख्या, और इससे ऊपर वाला रोग-उदाहरण स्वतःस्पष्ट हो जाता है।\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/math/statistics-probability/probability-library) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 2, अध्याय 13 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh207.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — NCERT प्रश्नावलियाँ, फिर Exemplar अध्याय 13। वृक्ष बनाकर कम-से-कम दस पूरी\n  बेज़ शब्द-समस्याएँ कीजिए; यह प्रश्नपत्र का सर्वाधिक मूल्यवान एकल प्रश्न-प्रकार है।","p1":"सूखे बालों में कंघी करके उसे कागज़ के छोटे टुकड़ों के पास ले जाइए — वे उससे चिपक जाते हैं। पूरा अध्याय\nएक वाक्य में यही है: कंघी पर कुछ अदृश्य आ गया, और अब वह उन चीज़ों को खींच रही है जिन्हें उसने छुआ भी\nनहीं।\n\nवह अदृश्य चीज़ है **आवेश (charge)**। साधारण पदार्थ में यह दो प्रकार का होता है, और हम उन्हें धनात्मक और\nऋणात्मक कहते हैं — केवल हिसाब रखने की सुविधा के लिए। इन नामों का इससे अधिक कोई अर्थ नहीं कि वे एक-दूसरे\nके विपरीत हैं। हर परमाणु में दोनों बराबर मात्रा में होते हैं, इसलिए वह बाहर की दुनिया को कुछ नहीं दिखाता।\nकंघी करने पर बालों से कुछ इलेक्ट्रॉन खिंचकर कंघी पर आ जाते हैं — अब कंघी पर थोड़ा अतिरिक्त ऋण है और बालों\nपर थोड़ा अतिरिक्त धन। कुछ बना नहीं, केवल स्थान बदला। **आवेश संरक्षण** का अर्थ यही है। और आप हमेशा पूरे\nइलेक्ट्रॉन ही हटा सकते हैं, किसी का दो-तिहाई भाग नहीं — **आवेश क्वांटीकरण** का अर्थ यही है: आप जो भी आवेश\nकभी मापेंगे, वह e = 1.6 × 10⁻¹⁹ C का पूर्ण गुणज होगा।\n\n**कूलॉम का नियम** अगला स्वाभाविक प्रश्न हल करता है: दो आवेश एक-दूसरे को कितने ज़ोर से खींचते या धकेलते\nहैं? किसी एक का आवेश दोगुना करें, बल दोगुना। दूरी दोगुनी करें, बल **चौथाई** — 1/r² बहुत तेज़ी से घटता\nहै। समान चिह्न धकेलते हैं, विपरीत खींचते हैं। F = kq₁q₂/r² इतना ही कहता है। यह न्यूटन के गुरुत्वाकर्षण\nनियम जैसा ही है, जिसमें द्रव्यमान की जगह आवेश है — और एक महत्वपूर्ण अंतर है: गुरुत्वाकर्षण केवल खींचता\nहै, यह दोनों कर सकता है।\n\nअब वह विचार जिस पर अध्याय का नाम है। कमरे में अकेला रखा एक आवेश कमरे के साथ कुछ करता है: उसके पास कहीं भी\nलाया गया **कोई भी दूसरा** आवेश तुरंत एक धक्का अनुभव करता है। हर संभव आगंतुक के लिए वह धक्का अलग-अलग\nनिकालने के बजाय, हम कमरे का ही वर्णन कर देते हैं। हर बिंदु पर हम पूछते हैं — \"यहाँ एक एकांक धन आवेश रखने\nपर उस पर कितना बल लगेगा?\" — और उत्तर संचित कर लेते हैं। उत्तरों का यही नक्शा **विद्युत क्षेत्र** E है।\nनक्शा एक बार बन जाए, तो उसमें रखे किसी भी आवेश पर बल केवल F = qE है। क्षेत्र आरंभ में हिसाब की एक युक्ति\nलगता है, पर आगे यह वास्तविक वस्तु जैसा व्यवहार करता है — अध्याय 8 में यही खाली जगह से ऊर्जा ले जाता हुआ\nप्रकाश बनेगा।\n\n**विद्युत क्षेत्र रेखाएँ** उस नक्शे को खींचने का तरीका हैं: तीरों के साथ चलिए और देखिए कि धन आवेश किस\nओर धकेला जाएगा; जहाँ रेखाएँ पास-पास हैं, वहाँ क्षेत्र प्रबल है। ये धन आवेश से चलकर ऋण आवेश पर समाप्त\nहोती हैं, कभी एक-दूसरे को नहीं काटतीं (एक बिंदु पर \"किस ओर\" के दो उत्तर नहीं हो सकते), और चालक की सतह से\nसदैव लंबवत मिलती हैं।\n\n**द्विध्रुव (dipole)** सबसे साधारण रोचक व्यवस्था है: +q और −q थोड़ी दूरी पर। जल का अणु एक द्विध्रुव है,\nइसीलिए जल नमक घोल देता है। दूर से देखने पर दोनों आवेश लगभग कट जाते हैं, इसलिए द्विध्रुव का क्षेत्र 1/r²\nके बजाय 1/r³ से घटता है — तेज़ी से, क्योंकि आप एक लगभग-कटाव देख रहे हैं। एकसमान क्षेत्र में रखा द्विध्रुव\nकहीं जाता नहीं, क्योंकि दोनों बल समान और विपरीत हैं; वह केवल **घूमता** है जब तक क्षेत्र के साथ पंक्तिबद्ध\nन हो जाए। वही घुमाव बल-आघूर्ण τ = pE sin θ है।\n\nअंत में **गाउस का नियम**, अध्याय का सबसे शक्तिशाली उपकरण। कल्पना कीजिए कि क्षेत्र रेखाएँ बाहर की ओर बह\nरही हैं, और गिनिए कि हवा में आपके खींचे किसी बंद पृष्ठ को कितनी रेखाएँ भेदती हैं। यह गिनती — **फ्लक्स** —\nकेवल इस पर निर्भर करती है कि आपने भीतर कितना आवेश लपेटा है; न लपेटने वाले पृष्ठ के आकार पर, न इस पर कि\nआवेश भीतर कहाँ रखा है। बाहर के आवेशों का योगदान ठीक शून्य है, क्योंकि जो रेखा भीतर घुसती है वह बाहर भी\nनिकलती है। यही φ = q/ε₀ है, और इससे आप तार, चादर या गोले का क्षेत्र एक पृष्ठ भर के समाकलन के बजाय तीन\nपंक्तियों में निकाल लेते हैं — बशर्ते आप ऐसा पृष्ठ चुन सकें जो सममिति से मेल खाता हो।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: वैद्युत आवेश तथा क्षेत्र कक्षा 12 वन शॉट](https://www.youtube.com/results?search_query=electric+charges+and+fields+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/science/in-in-class-12th-physics-india/in-in-electric-charges-and-field) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 1, अध्याय 1 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph101.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 2, अध्याय 29 §29.1–29.8. अध्याय 30 में गाउस के नियम पर जाने\n  से पहले कूलॉम नियम और अध्यारोपण के हल किए उदाहरण देखिए। (हिन्दी संस्करण भी उपलब्ध है।)","p2":"बाल्टी को सीढ़ियों से ऊपर ले जाने में काम करना पड़ता है, और जितना ऊपर ले जाएँ उतना अधिक काम। इसके लिए\nसीढ़ियों का आकार जानना आवश्यक नहीं — केवल ऊँचाई। गुरुत्वाकर्षण ऐसा ही है, और विद्युत भी। यह अध्याय\nविद्युत का \"ऊँचाई\" वाला रूप है।\n\nएक धन आवेश को दूसरे धन आवेश की ओर धकेलिए — आपको मेहनत करनी पड़ेगी, क्योंकि वह पूरे रास्ते आपसे लड़ेगा।\nवह काम खो नहीं जाता; संचित हो जाता है, और छोड़ते ही मुक्त होता है — आवेश तेज़ी से दूर भाग जाता है।\nसंचित मात्रा का नाम **स्थितिज ऊर्जा** है। इसे उस आवेश से भाग दे दीजिए जिसे आप धकेल रहे थे, और अब आपके\nपास आवेश का गुण नहीं, **स्थान** का गुण है: **विभव** V, जिसका मात्रक वोल्ट है। एक वोल्ट का अर्थ है — अनंत\nदूरी से एक कूलॉम लाने में एक जूल काम। विभव हर बिंदु पर एक अकेली संख्या है, तीर नहीं — और ठीक इसीलिए इसके\nसाथ काम करना क्षेत्र की तुलना में आसान है, और इसीलिए अध्याय इस पर इतना निर्भर है।\n\nदोनों के बीच का संबंध सूत्र के रूप में नहीं, चित्र के रूप में याद रखिए: **क्षेत्र विभव की ढलान पर नीचे की\nओर संकेत करता है**, और ढलान जितनी तीव्र, क्षेत्र उतना प्रबल। E = −dV/dr इसी वाक्य का प्रतीक-रूप है। ऋण\nचिह्न ही \"नीचे की ओर\" शब्द है।\n\n**समविभव पृष्ठ** उसी पहाड़ी का समोच्च रेखा (contour) है — उस पर हर बिंदु समान विभव पर। समोच्च रेखा पर\nचलने में आप चढ़ते नहीं, इसलिए कोई काम नहीं होता, इसलिए उसके अनुदिश क्षेत्र का कोई घटक नहीं हो सकता:\n**समविभव पृष्ठ और क्षेत्र रेखाएँ सदैव समकोण पर मिलती हैं।** यह एक तथ्य आश्चर्यजनक संख्या में बोर्ड\nप्रश्नों का उत्तर दे देता है।\n\nअब चालक। धातु में आवेश स्वतंत्र हैं, और जब तक कोई क्षेत्र उन्हें धकेलता रहेगा वे चलते रहेंगे। इसलिए जब\nसब स्थिर हो जाता है, तो भीतर क्षेत्र ठीक शून्य होना ही चाहिए — वरना आवेश अब भी सरक रहे होते। बाकी सब\nइसी से निकलता है: सारा अतिरिक्त आवेश बाहरी सतह पर बैठता है, पूरा पिंड एक ही विभव पर होता है, और सतह के\nठीक बाहर क्षेत्र सतह के लंबवत होता है। बिजली गिरने के समय कार के भीतर सुरक्षित रहने का कारण यही है।\n\n**धारिता (capacitance)** अध्याय का दूसरा बड़ा विचार है, और दिखने से कहीं अधिक सरल है। कोई भी दो चालक\nलीजिए, एक पर +Q और दूसरे पर −Q रखिए, और उनके बीच एक वोल्टता V प्रकट हो जाती है। अनुपात C = Q/V केवल उनके\nआकार और दूरी पर निर्भर करता है, इस पर नहीं कि आपने कितना आवेश डाला। अतः C व्यवस्था का एक निश्चित गुण है —\nयह माप कि प्रति वोल्ट वह कितना आवेश निगल लेगी। संधारित्र आवेश की बाल्टी है, और C बाल्टी का आकार है।\n\nप्लेटें पास लाने या बड़ी करने से C क्यों बढ़ती है? क्योंकि दोनों से आवेश रोकना आसान हो जाता है: अधिक\nक्षेत्रफल से आवेश को फैलने की जगह मिलती है, और कम अंतराल से विपरीत आवेश निकट रहकर उसे खींचता है, अतः उसी\nQ पर वोल्टता कम बनती है। इसीलिए C = ε₀A/d।\n\nअंतराल में काँच या प्लास्टिक की पट्टी — **परावैद्युत (dielectric)** — सरका दीजिए, और C, K गुना बढ़ जाती\nहै। कारण सुंदर है: पट्टी के अणु स्वयं द्विध्रुव हैं, और सब घूमकर आरोपित क्षेत्र के विरुद्ध हो जाते हैं,\nजिससे उनका अपना एक क्षीण क्षेत्र बनता है जो उसे आंशिक रूप से काट देता है। कुल क्षेत्र कम, तो उसी आवेश पर\nवोल्टता कम, अर्थात् धारिता अधिक।\n\nसंधारित्र को आवेशित करने पर ऊर्जा संचित होती है, U = ½CV², और यह ½ लोगों को उलझाता है। यह इसलिए है कि\nआवेश का पहला अंश मुफ़्त चढ़ जाता है, क्योंकि संधारित्र तब खाली है; और अंतिम अंश को पहले से भरे सारे आवेश\nके विरुद्ध ठेलना पड़ता है। आप बढ़ती कीमत चुका रहे हैं, अतः कुल = **औसत** कीमत × मात्रा — इसीलिए आधा।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: स्थिर वैद्युत विभव तथा धारिता कक्षा 12](https://www.youtube.com/results?search_query=electrostatic+potential+and+capacitance+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/science/in-in-class-12th-physics-india/in-in-electrostatic-potential-and-capacitance) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 1, अध्याय 2 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph102.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 2, विभव के लिए अध्याय 29 §29.9–29.14, फिर पूरा अध्याय 31\n  *Capacitors*। संचित ऊर्जा और परावैद्युत पट्टी का उनका विवेचन NCERT से अधिक स्पष्ट है।","p3":"ताँबे का तार पहले से ही इलेक्ट्रॉनों से भरा है जो चल रहे हैं — तेज़, हर दिशा में, परमाणुओं से टकराते हुए,\nजैसे बंद जार में मक्खियों का झुंड। बैटरी जोड़िए और इस अव्यवस्था में लगभग कुछ नहीं बदलता। केवल इतना होता है\nकि पूरे झुंड को एक दिशा में हलका बहाव मिल जाता है — सैकड़ों किलोमीटर प्रति सेकंड की गति के ऊपर लगभग एक\nमिलीमीटर प्रति सेकंड का रेंगना। वही रेंगना **विद्युत धारा** है। यह इस अध्याय का सबसे उपयोगी चित्र है, और\nइससे यह भी समझ आता है कि इलेक्ट्रॉन इतने धीमे होते हुए भी बल्ब तुरंत क्यों जलता है: जो क्षेत्र उन्हें\nबहाना शुरू करता है वह लगभग प्रकाश की गति से चलता है, इसलिए तार का हर इलेक्ट्रॉन एक साथ रेंगना आरंभ कर\nदेता है।\n\nतो धारा I = q/t वह कूलॉम-संख्या है जो प्रति सेकंड किसी बिंदु से गुज़रती है, और एक ऐम्पियर = एक कूलॉम\nप्रति सेकंड। इसके नीचे I = neAv_d बैठा है — प्रति घन मीटर वाहकों की संख्या, गुणा प्रत्येक का आवेश, गुणा\nअनुप्रस्थ काट, गुणा अपवाह वेग। यह \"प्रति सेकंड कितने गुज़रते हैं\" को खोलकर लिखना ही है।\n\n**प्रतिरोध क्यों होता है?** टकराव के कारण। इलेक्ट्रॉन क्षेत्र से त्वरित होता है, फिर जालक से टकराकर जो\nपाया था खो देता है, फिर त्वरित होता है। दो टकरावों के बीच का औसत समय τ कहलाता है, और यही सब तय करता है:\nबड़ा τ का अर्थ है खुली दौड़, अधिक अपवाह, अधिक धारा, कम प्रतिरोध। **ओम का नियम** V = IR प्रकृति का नियम\nकम और इस बात का अच्छा वर्णन अधिक है कि जब τ स्वयं वोल्टता पर निर्भर न हो तो क्या होता है — नियत ताप पर\nधातु के लिए सत्य, डायोड के लिए असत्य, गरम होते तंतु के लिए असत्य।\n\n**प्रतिरोध** और **प्रतिरोधकता** का अंतर स्पष्ट कर लें तो अध्याय बहुत आसान हो जाता है। प्रतिरोधकता ρ\nपदार्थ का गुण है — ताँबे का एक मान, नाइक्रोम का दूसरा, और काटने या खींचने से वह नहीं बदलता। प्रतिरोध\nR = ρl/A **उस विशेष टुकड़े** का गुण है: लंबा और पतला तो अधिक प्रतिरोध, छोटा और मोटा तो कम — ठीक पाइप में\nपानी की तरह। धातु को गरम कीजिए, ρ बढ़ता है, क्योंकि गरम परमाणु अधिक कंपन करके अधिक बार रास्ता रोकते हैं।\nअर्धचालक को गरम कीजिए, ρ **घटता** है, क्योंकि ऊष्मा जितनी बाधा जोड़ती है उससे अधिक वाहक मुक्त कर देती है —\nउलटा व्यवहार, और एक अंक का प्रिय प्रश्न।\n\n**वास्तविक बैटरी** शुद्ध वोल्टता स्रोत नहीं है। उसका अपना आंतरिक प्रतिरोध r होता है, इसलिए सिरों पर मिलने\nवाली वोल्टता V = ε − Ir अधिक धारा खींचने पर गिरती जाती है। **विद्युत वाहक बल** ε वह है जो वह तब देती जब\nआप कुछ न खींचते। टॉर्च पुराने सेलों के साथ मंद पड़ जाती है — क्योंकि r बढ़ चुका है।\n\n**श्रेणी और पार्श्व** को रटने के बजाय समझ लेना बेहतर है। श्रेणी में हर चीज़ को बारी-बारी प्रत्येक प्रतिरोध\nसे गुज़रना है, इसलिए प्रतिरोध जुड़ते हैं। पार्श्व में आपने अतिरिक्त रास्ते जोड़ दिए हैं, इसलिए कुल प्रतिरोध\n**सबसे छोटी शाखा से भी कम** निकलना चाहिए — यदि आपका उत्तर ऐसा नहीं कहता, कहीं गणना में चूक हुई है।\n\n**किरखॉफ़ के दो नियम** वह सब सँभालते हैं जो श्रेणी/पार्श्व की युक्तियाँ नहीं कर सकतीं। संधि नियम कहता है\nकि संधि पर आवेश जमा नहीं होता, अतः जो भीतर आता है वही बाहर जाता है। लूप नियम कहता है कि यदि आप बंद लूप में\nघूमकर वहीं लौट आएँ, तो आप उसी विभव पर हैं, अतः बढ़त और गिरावट कट जानी चाहिए। प्रश्नपत्र का हर परिपथ प्रश्न\nइन दो नियमों और चिह्नों की सावधानी भर है।\n\n**व्हीटस्टोन सेतु** इसका सुंदर अनुप्रयोग है: हीरे के आकार में चार प्रतिरोध और बीच में धारामापी। जब\nP/Q = R/S होता है, तब दोनों मध्य-बिंदु संयोगवश समान विभव पर आ जाते हैं, इसलिए बैटरी जो भी करे, धारामापी\nसे धारा बिलकुल नहीं बहती। इससे आप अज्ञात प्रतिरोध **संतुलन** द्वारा नाप लेते हैं, मीटर पढ़कर नहीं — और\nशून्य-पाठ विक्षेप से कहीं अधिक यथार्थ होता है, क्योंकि वह मीटर के अंशांकन पर निर्भर नहीं करता।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: विद्युत धारा कक्षा 12 वन शॉट](https://www.youtube.com/results?search_query=current+electricity+class+12+physics+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/search?page_search_query=current%20electricity%20class%2012) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 1, अध्याय 3 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph103.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 2, पूरा अध्याय 32। अपवाह वेग और प्रतिरोध के मूल पर §32.2–32.4\n  छपा हुआ सबसे स्पष्ट संक्षिप्त विवरण है; §32.11 से आगे किरखॉफ़ और सेतु।","p4":"1820 में ओर्स्टेड ने एक तार के पास कंपास की सुई रखी, धारा चालू की, और सुई घूम गई। किसी को अपेक्षा न थी कि\nविद्युत और चुंबकत्व का एक-दूसरे से कोई संबंध है। यह अध्याय उसी संयोग से आरंभ होता है: **गतिमान आवेश\nचुंबकीय क्षेत्र बनाता है, और चुंबकीय क्षेत्र गतिमान आवेश पर बल लगाता है।** बाकी सब विवरण है।\n\nधक्के से शुरू करें। चुंबकीय क्षेत्र में गतिमान आवेश पर बल F = qvB sin θ है, और यह अब तक पढ़े हर बल से दो\nतरह से भिन्न है। पहला, यदि आवेश स्थिर है या क्षेत्र के अनुदिश सीधा चल रहा है तो बल शून्य हो जाता है —\nकेवल क्षेत्र के **आड़े** गति गिनी जाती है। दूसरा, और अधिक विचित्र, **यह सदैव गति के लंबवत होता है।** वेग\nके समकोण पर लगा बल किसी वस्तु को न तेज़ कर सकता है न धीमा; वह केवल मोड़ सकता है। अतः चुंबकीय क्षेत्र कोई\nकाम नहीं करता, कण की गतिज ऊर्जा कभी नहीं बदलता, और स्वतंत्र आवेश को वृत्त में घुमा देता है। qvB को mv²/r\nके बराबर रखिए और r = mv/qB मिलता है: भारी या तेज़ कण चौड़ा मुड़ते हैं, प्रबल क्षेत्र उन्हें कसकर मोड़ता\nहै। यही एक पंक्ति में साइक्लोट्रॉन है, और यही कारण है कि एक चक्कर का समय T = 2πm/qB गति पर निर्भर ही नहीं\nकरता — और यही वह युक्ति है जो साइक्लोट्रॉन को संभव बनाती है।\n\nधारावाही तार बहुत-से गतिमान आवेश ही है, अतः उस पर भी वही धक्का लगता है, F = BIl sin θ। यही मोटर है। दो\nसमांतर तार एक-दूसरे के क्षेत्र में बैठे हैं, अतः धाराएँ एक दिशा में हों तो वे आकर्षित होते हैं और विपरीत\nहों तो प्रतिकर्षित — और सौ वर्षों से अधिक समय तक ऐम्पियर की परिभाषा इसी बल से दी जाती थी।\n\nअब दूसरी दिशा: धारा **कौन-सा** क्षेत्र बनाती है? **बायो-सावर्ट नियम** इसका उत्तर है, और उसे कूलॉम नियम के\nचुंबकीय जुड़वाँ के रूप में पढ़ना सबसे अच्छा है। लंबाई dl के तार के एक नन्हे टुकड़े में धारा I से बना\nक्षेत्र I और dl के साथ बढ़ता है, 1/r² से घटता है, और — यही नया अंश है — तार तथा उसे आपके बिंदु से जोड़ने\nवाली रेखा, **दोनों** के समकोण पर संकेत करता है। स्थिर वैद्युतिकी में कुछ भी ऐसा व्यवहार नहीं करता;\nचुंबकीय क्षेत्र अपने स्रोत से दूर संकेत करने के बजाय उसके चारों ओर कुंडलित होता है। इसीलिए दक्षिण-हस्त\nनियम, और इसीलिए सीधे तार का क्षेत्र उसके चारों ओर घूमता है, B = μ₀I/2πr, जबकि पाश का क्षेत्र उसके भीतर से\nगुज़रता है, केंद्र पर B = μ₀I/2R।\n\n**ऐम्पियर का परिपथीय नियम** गाउस के नियम का समकक्ष है, और उसी कारण उपयोगी है: जहाँ सममिति है, वहाँ यह एक\nकठिन समाकलन की जगह एक छोटा तर्क रख देता है। क्षेत्र में एक बंद लूप पर चलिए, चलते-चलते B को अपने पथ के\nअनुदिश जोड़ते जाइए, और कुल केवल इस पर निर्भर करेगा कि आपके लूप ने कितनी धारा घेरी है। लूप को क्षेत्र के\nअनुदिश चुन लीजिए और पूरी बात एक गुणा में सिमट जाती है। इससे लंबा सीधा तार दो पंक्तियों में निकल आता है।\n\n**परिनालिका (solenoid)** — एक लंबी कुंडली — वहाँ है जहाँ यह उपयोगी हो जाता है। उसके क्षेत्र भीतर जुड़ते\nहैं और बाहर बहुत हद तक कट जाते हैं, जिससे बीच में लगभग एकसमान क्षेत्र B = μ₀nI बचता है, जो केवल प्रति\nमीटर फेरों पर निर्भर है। यह बंद किया जा सकने वाला दंड चुंबक है, और प्रयोगशाला में प्रबल नियंत्रित क्षेत्र\nबनाने का उपाय।\n\nअंत में **धारामापी (moving-coil galvanometer)**, जो अध्याय के विचारों को जोड़कर बना एक यंत्र है। एक कुंडली\nत्रिज्य क्षेत्र में लटकी है; उससे धारा बहने पर बल-आघूर्ण लगता है; एक स्प्रिंग विरोध करती है; कुंडली वहीं\nरुकती है जहाँ दोनों संतुलित हों, अतः विक्षेप धारा बता देता है। इसकी दो कमज़ोरियाँ ही इसके दो मानक प्रश्न\nहैं: बड़ी धारा से यह सरलता से क्षतिग्रस्त हो जाता है, और यह कम प्रतिरोध की युक्ति है — इसलिए इसके समांतर\n**छोटा** शंट लगाकर आप इसे ऐमीटर बनाते हैं और श्रेणी में **बड़ा** प्रतिरोध लगाकर वोल्टमीटर। इस तर्क को हर\nबार सोच लेना रटने से अच्छा है: ऐमीटर धारा के रास्ते में लगता है, अतः उसे लगभग विरोध नहीं करना चाहिए;\nवोल्टमीटर दो बिंदुओं के आड़े लगता है, अतः उसे लगभग धारा नहीं चुरानी चाहिए।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: गतिमान आवेश और चुंबकत्व कक्षा 12](https://www.youtube.com/results?search_query=moving+charges+and+magnetism+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/science/in-in-class-12th-physics-india/moving-charges-and-magnetism) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 1, अध्याय 4 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph104.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 2, बल और वृत्तीय गति के लिए अध्याय 34, बायो-सावर्ट और ऐम्पियर\n  के लिए अध्याय 35। व्युत्पत्तियों से पहले §35.4 (सीधा तार) और §35.6 (परिनालिका) के हल किए उदाहरण करें।","p5":"कंपास हज़ार वर्षों से काम कर रहा है, और कारण यह है कि पृथ्वी, स्थूल रूप से, एक बहुत बड़ा दंड चुंबक है\nजिसका दक्षिण ध्रुव उत्तरी गोलार्ध के नीचे दबा है। यह अध्याय चुंबकों को वस्तु के रूप में देखता है — वे किस\nचीज़ से बने हैं, क्षेत्र में क्या करते हैं, और कुछ पदार्थ चुंबक क्यों बन जाते हैं और कुछ मना कर देते हैं।\n\nपहली बात स्पष्ट रहे: **अकेला चुंबकीय ध्रुव जैसी कोई चीज़ नहीं होती।** दंड चुंबक को बीच से तोड़िए और आपको\nअलग उत्तर और अलग दक्षिण नहीं मिलते; दो छोटे चुंबक मिलते हैं, हर एक में दोनों। बार-बार तोड़िए, वे कभी अलग\nनहीं होते। विद्युत से यह गहरा अंतर है, जहाँ अकेले धन और ऋण आवेश हर ओर हैं। क्षेत्र-रेखा की भाषा में इसका\nअर्थ है कि चुंबकीय क्षेत्र रेखाएँ कहीं आरंभ या समाप्त नहीं होतीं — वे सदैव अपने ऊपर बंद होती हैं, चुंबक के\nभीतर से गुज़रकर बाहर से घूमकर वापस।\n\nअतः चुंबक की मूल इकाई ध्रुव नहीं, **द्विध्रुव** है, जिसे चुंबकीय आघूर्ण m से बताया जाता है। और यदि आप दंड\nचुंबक का क्षेत्र-प्रतिरूप धारावाही पाश के प्रतिरूप से मिलाएँ, दोनों समरूप हैं। यह अध्याय की केंद्रीय\nअंतर्दृष्टि है और संयोग नहीं: **चुंबक का चुंबकत्व धाराओं से आता है** — परमाणुओं के भीतर परिक्रमा करते\nइलेक्ट्रॉन। कोई चुंबकीय \"पदार्थ\" नहीं होता, केवल गतिमान आवेश।\n\nचूँकि चुंबक एक द्विध्रुव है, अध्याय 1 में विद्युत द्विध्रुव के बारे में सीखा सब कुछ यहाँ अपरिवर्तित लागू\nहोता है। एकसमान क्षेत्र में दोनों सिरों पर बल समान और विपरीत हैं, इसलिए चुंबक चलता नहीं; वह **घूमता** है\nजब तक पंक्तिबद्ध न हो जाए, बल-आघूर्ण τ = mB sin θ के साथ। उसकी स्थितिज ऊर्जा U = −mB cos θ है — पंक्ति\nमें सबसे कम, उलटी दिशा में सबसे अधिक। इसीलिए कंपास उत्तर की ओर ठहर जाता है और वहीं टिका रहता है।\n\n**पृथ्वी का चुंबकत्व** तीन संख्याओं से बताया जाता है, और वे सब केवल यह कहती हैं कि \"यहाँ क्षेत्र किस ओर\nहै?\" **दिक्पात (declination)** यह है कि नक्शे पर ऊपर से देखने पर चुंबकीय उत्तर सच्चे उत्तर से कितना हटा\nहै। **नमन (dip)** यह है कि क्षेत्र ज़मीन में कितना नीचे झुका है — भूमध्य रेखा पर लगभग शून्य, ध्रुवों पर\nलगभग लंबवत। **क्षैतिज घटक** क्षेत्र का वह भाग है जो समतल में पड़ा है, और धुरी पर तैरती कंपास की सुई केवल\nइसी भाग पर प्रतिक्रिया कर सकती है। संबंध B_H = B cos δ त्रिकोणमिति है, इससे अधिक कुछ नहीं।\n\nफिर पदार्थ। हर परमाणु एक नन्हा धारा-पाश है, अतः हर पदार्थ क्षेत्र पर किसी तरह प्रतिक्रिया करता है; प्रश्न\nहै — कैसे। **प्रतिचुंबकीय (diamagnetic)** पदार्थों (जल, ताँबा, बिस्मथ) के परमाणुओं में भीतरी धाराएँ कट\nजाती हैं, इसलिए उनका अपना आघूर्ण नहीं होता; आरोपित क्षेत्र एक क्षीण विरोधी आघूर्ण प्रेरित करता है, और वे\nक्षेत्र से **बाहर** हलके-से धकेले जाते हैं। **अनुचुंबकीय (paramagnetic)** पदार्थों (ऐल्युमिनियम,\nऑक्सीजन) के प्रत्येक परमाणु का एक छोटा स्थायी आघूर्ण होता है, पर तापीय हलचल उन्हें बेतरतीब रखती है;\nक्षेत्र कुछ को पंक्ति में लाता है और वे क्षेत्र के **भीतर** हलके-से खींचे जाते हैं। **लौहचुंबकीय\n(ferromagnetic)** पदार्थ (लोहा, कोबाल्ट, निकल) नाटकीय स्थिति हैं: पड़ोसी परमाणु अपने आघूर्ण पूरे-पूरे\nक्षेत्रों में, जिन्हें डोमेन कहते हैं, समांतर जकड़ लेते हैं — इसलिए मामूली क्षेत्र भी एक साथ असंख्य को\nपंक्तिबद्ध कर देता है और पदार्थ प्रबल रूप से चुंबकित हो जाता है — और वैसा ही रह जाता है। किसी भी लौहचुंबक\nको उसके क्यूरी ताप से ऊपर गरम कीजिए और जकड़ टूट जाती है; वह अनुचुंबकीय हो जाता है और भूल जाता है कि कभी\nचुंबक था।\n\n> **यहाँ समय लगाने से पहले पाठ्यक्रम देख लें।** युक्तिसंगत बनाए गए पाठ्यक्रम में चुंबकीय पदार्थों का\n> बहुत-सा विवेचन — और विशेषतः शैथिल्य पाश (hysteresis loop) — हटाया गया है। इस अध्याय का §1 बताता है कि\n> क्या भीतर है और क्या बाहर; पहले वह पढ़ें। परीक्षा-योग्य मूल है: द्विध्रुव के रूप में दंड चुंबक,\n> बल-आघूर्ण और ऊर्जा, तथा पृथ्वी के चुंबकीय अवयव।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: चुंबकत्व एवं द्रव्य कक्षा 12](https://www.youtube.com/results?search_query=magnetism+and+matter+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/search?page_search_query=magnetism%20and%20matter%20class%2012) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 1, अध्याय 5 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph105.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 2, ध्रुव, द्विध्रुव आघूर्ण और पृथ्वी के क्षेत्र के लिए अध्याय\n  36 §36.1–36.6; पदार्थों के तीन वर्गों के लिए अध्याय 37। केवल वहीं तक पढ़ें जहाँ तक आपका पाठ्यक्रम जाता है।","p6":"अध्याय 4 ने दिखाया कि धारा चुंबकीय क्षेत्र बनाती है। स्वाभाविक प्रश्न — क्या चुंबकीय क्षेत्र धारा बना\nसकता है? — का उत्तर पाने में ग्यारह वर्ष और माइकल फैराडे लगे, और वही उत्तर पृथ्वी के हर बिजलीघर का आधार\nनिकला।\n\nयह प्रयोग सिर में रखिए। तार की एक कुंडली, उसके आड़े एक धारामापी, और एक दंड चुंबक। चुंबक को कुंडली के भीतर\nस्थिर पकड़िए: कुछ नहीं। भीतर ले जाइए: सुई एक ओर झटका देती है। बाहर निकालिए: दूसरी ओर। तेज़ी से चलाइए: बड़ा\nझटका। **बदलना महत्वपूर्ण है, क्षेत्र स्वयं नहीं।** स्थिर क्षेत्र, चाहे कितना प्रबल हो, कुछ प्रेरित नहीं\nकरता।\n\n\"बदलना\" को ठीक-ठीक कहने के लिए हमें यह गिनने का तरीका चाहिए कि कुंडली से कितना क्षेत्र गुज़र रहा है। वह\nगिनती **फ्लक्स** है, φ = BA cos θ, और इसे तीन अलग घुंडियों के रूप में पढ़ना चाहिए। आप क्षेत्र की प्रबलता\nB बदल सकते हैं, या कुंडली जो क्षेत्रफल A प्रस्तुत करती है, या वह कोण θ जिस पर क्षेत्र उससे मिलता है।\nइनमें से किसी एक को घुमाइए और फ्लक्स बदलता है और धारा प्रकट होती है। जनित्र θ घुमाता है; ट्रांसफ़ॉर्मर B\nबदलता है; पटरियों पर सरकती छड़ A बदलती है। भिन्न मशीनें, एक विचार।\n\n**फैराडे का नियम** तब केवल यह है कि \"विद्युत वाहक बल = फ्लक्स कितनी तेज़ी से बदल रहा है\": ε = −dφ/dt।\nध्यान दें यह क्या **नहीं** है — emf इस पर निर्भर नहीं है कि फ्लक्स कितना बड़ा है, केवल इस पर कि वह कितनी\nतेज़ी से बदल रहा है। किसी विशाल स्थिर क्षेत्र में रखी कुंडली में विशाल फ्लक्स और शून्य emf होगा।\n\nऋण चिह्न **लेंज़ का नियम** है, और इसे अलग अनुच्छेद चाहिए क्योंकि यह अध्याय का सबसे अधिक गड़बड़ाया जाने\nवाला विचार है। यह कहता है कि प्रेरित धारा सदैव उस दिशा में बहती है जो **उस परिवर्तन का विरोध करे जिसने\nउसे जन्म दिया**। चुंबक का उत्तरी ध्रुव कुंडली की ओर धकेलिए और कुंडली उसका सामना करने के लिए अपना उत्तरी\nध्रुव उत्पन्न करके पीछे धकेलती है। चुंबक हटाइए और कुंडली दक्षिणी ध्रुव में बदलकर उसे रोकना चाहती है।\nकुंडली सदैव आपका विरोध करती है। क्यों? क्योंकि यदि वह आपकी सहायता करती, तो चुंबक स्वयं त्वरित होता, अधिक\nधारा बनाता, और अधिक त्वरित होता — सदा के लिए मुफ़्त ऊर्जा। लेंज़ का नियम दूसरा वेश पहने ऊर्जा संरक्षण ही\nहै। \"ऋण चिह्न का औचित्य बताइए\" का उत्तर यही है, और ठीक इसी रूप में लिखना चाहिए।\n\n**गति-जनित emf** वही नियम दूसरे कोण से है। लंबाई l की चालक छड़ को क्षेत्र B में पटरियों पर वेग v से\nसरकाइए और ε = Blv मिलता है। इसे फ्लक्स से निकाल सकते हैं — परिपथ का क्षेत्रफल lv की दर से बढ़ रहा है — या\nसीधे देख सकते हैं: चलती छड़ का हर मुक्त इलेक्ट्रॉन क्षेत्र में गतिमान आवेश है, अतः उस पर छड़ के अनुदिश\nqvB का धक्का लगता है, और सिरों पर आवेश जमा होता जाता है जब तक वोल्टता उस जमाव को रोक न दे। दोनों रास्ते\nवही उत्तर देते हैं, और दोनों के बीच आ-जा सकना इस बात का चिह्न है कि आपने अध्याय समझा है, रटा नहीं।\n\n**भँवर धाराएँ (eddy currents)** तार के बजाय धातु के ठोस टुकड़े में प्रेरित धाराएँ हैं। वे भी लेंज़ मानती\nहैं, अतः जिस गति ने उन्हें बनाया उसका विरोध करती हैं — जिससे वे एक ब्रेक बन जाती हैं। रेलगाड़ियाँ इनका\nउपयोग करती हैं; इंडक्शन चूल्हे भी, जहाँ इन धाराओं को जान-बूझकर अपनी ऊर्जा ऊष्मा के रूप में गँवाने दिया\nजाता है। ट्रांसफ़ॉर्मर में ये उपद्रव हैं, इसलिए क्रोड पतली परतदार चादरों से बनाया जाता है: चादरें उन पाशों\nको तोड़ देती हैं जिनमें ये धाराएँ बहना चाहती हैं।\n\nअध्याय **प्रेरकत्व (inductance)** पर समाप्त होता है, प्रत्यावर्ती धारा से पहले का अंतिम टुकड़ा। कुंडली\nअपनी ही धारा के **परिवर्तन** का विरोध करती है, क्योंकि बदलती धारा अपना ही फ्लक्स बदलती है, जो परिवर्तन का\nविरोध करता हुआ emf प्रेरित करती है। अनुपातांक L है, स्वप्रेरकत्व: ε = −L dI/dt। यह विद्युत जड़त्व है —\nद्रव्यमान का ठीक समकक्ष। संधारित्र वोल्टता के परिवर्तन का विरोध करता है; प्रेरक धारा के परिवर्तन का; और\nएक बार दोनों को जोड़े में देख लें तो अध्याय 7 बहुत कम रहस्यमय हो जाता है।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: विद्युत चुंबकीय प्रेरण कक्षा 12](https://www.youtube.com/results?search_query=electromagnetic+induction+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/search?page_search_query=electromagnetic%20induction%20class%2012) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 1, अध्याय 6 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph106.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 2, पूरा अध्याय 38। लेंज़ नियम पर §38.4 और गति-जनित emf पर\n  §38.6 दो बार पढ़ने योग्य हैं; सरकती छड़ के हल किए उदाहरण ठीक बोर्ड की प्रिय व्यवस्था हैं।","p7":"आपकी दीवार के सॉकेट की बिजली एक दिशा में नहीं बहती। सेकंड में पचास बार वह उलटती है, और वोल्टता एक चिकनी\nज्या-तरंग खींचती हुई +325 V से −325 V और वापस जाती है। लेबल पर लिखे \"230 V\" को हम **वर्ग-माध्य-मूल (rms)**\nमान कहते हैं, और अध्याय को पहले यही बताना है कि हम शिखर मान के बजाय यह विचित्र संख्या क्यों लिखते हैं।\n\nपूरे चक्र पर ज्या-तरंग का औसत शून्य है — जितना ऊपर, उतना नीचे — इसलिए AC के वर्णन में औसत बेकार है। पर\n**ऊष्मन** शून्य नहीं है: बल्ब को इससे मतलब नहीं कि धारा किस ओर जा रही है, केवल इससे कि कितनी है, और ऊष्मा\nI² के अनुसार चलती है। अतः हम धारा का वर्ग करते हैं, उसका औसत लेते हैं, और फिर वर्गमूल लेकर लौटते हैं। यही\nrms है, और इसकी परिभाषा ठीक इसी तरह की गई है कि प्रतिरोध में बहती I_rms उतनी ही ऊष्मा दे जितनी उसी मान की\nस्थिर DC धारा। इसीलिए I_rms = I₀/√2, और 230 V rms का शिखर 325 V होता है।\n\nफिर अध्याय का असली काम: प्रतिरोध, संधारित्र और प्रेरक AC के साथ क्या करते हैं — और वे तीन अलग-अलग काम\nकरते हैं।\n\n**प्रतिरोध** नीरस है, और उपयोगी रूप से नीरस। वोल्टता और धारा साथ-साथ, एक ही कदम में, घटती-बढ़ती हैं। दी\nगई सारी ऊर्जा ऊष्मा में चली जाती है।\n\n**संधारित्र** DC को बिलकुल नहीं जाने देता — आवेश प्लेटों पर जमा होकर रुक जाता है। पर AC में प्लेटें सेकंड\nमें पचास बार आवेशित-निरावेशित हो रही हैं, इसलिए तारों में धारा लगातार आगे-पीछे छलकती रहती है, और जितनी\nतेज़ी से आप उलटें उतना आसान हो जाता है। अतः उसका विरोध X_C = 1/ωC आवृत्ति बढ़ने पर **घटता** है। और धारा\nवोल्टता से चौथाई चक्र **आगे** रहती है: पहले धारा बहेगी, तभी आवेश जमा होकर वोल्टता बना पाएगा।\n\n**प्रेरक** इसका दर्पण-प्रतिबिंब है। वह DC को खुशी से जाने देता है — वह तार की कुंडली ही है — पर परिवर्तन\nसे लड़ता है, इसलिए जितनी तेज़ी से आप उलटें उतना कड़ा विरोध: X_L = ωL आवृत्ति के साथ **बढ़ता** है। यहाँ\nवोल्टता धारा से आगे रहती है, क्योंकि कुंडली का emf धारा के बदलने की प्रतिक्रिया में प्रकट होता है।\n\nतीनों को श्रेणी में लगाइए और आप उनके विरोध सीधे जोड़ नहीं सकते, क्योंकि उनके शिखर भिन्न क्षणों पर आते हैं।\nइसीलिए **फेजर आरेख** है: प्रत्येक वोल्टता को एक तीर के रूप में खींचिए जिसका कोण उसका समय दर्ज करे, और तीर\nजोड़ने पर समय स्वयं सँभल जाता है। प्रेरक का तीर ऊपर, संधारित्र का नीचे, प्रतिरोध का अनुदिश — इसलिए दोनों\nप्रतिघात आंशिक रूप से कट जाते हैं, और कुल Z = √(R² + (X_L − X_C)²)। यह पाइथागोरस एक चित्र है, संयोग नहीं।\n\n**अनुनाद (resonance)** वहाँ है जहाँ बात सुंदर हो जाती है। X_L आवृत्ति के साथ बढ़ता है और X_C घटता है,\nइसलिए ठीक एक आवृत्ति पर वे बराबर होकर पूरी तरह कट जाते हैं। उस बिंदु पर परिपथ ऐसा व्यवहार करता है जैसे\nसंधारित्र और प्रेरक वहाँ न हों — प्रतिबाधा घटकर केवल R रह जाती है, और धारा अधिकतम पर पहुँच जाती है। वह\nआवृत्ति ω = 1/√(LC) है। रेडियो हवा में से एक स्टेशन इसी तरह चुनता है: आप C को समंजित करते हैं जब तक परिपथ\nमनचाहे स्टेशन के साथ अनुनाद न करे, और बाकी हर आवृत्ति छोटी रह जाती है।\n\nAC में **शक्ति** का एक जाल है, और प्रश्नपत्र को वह बहुत भाता है। P = V_rms I_rms cos φ, जहाँ cos φ\n**शक्ति गुणांक** है। ऊर्जा केवल प्रतिरोध खपाता है; शुद्ध प्रेरक या संधारित्र जो लेता है, आधे चक्र बाद\nपूरा लौटा देता है। अतः शुद्ध प्रतिघाती परिपथ में φ = 90°, cos φ = 0, और बड़ी धाराएँ बहने के बावजूद औसत\nशक्ति ठीक शून्य होती है — प्रसिद्ध **वाटहीन धारा**।\n\nअंत में **ट्रांसफ़ॉर्मर**, जो अध्याय 6 को काम पर लगाना है। साझा लोहे के क्रोड पर दो कुंडलियाँ: पहली की\nबदलती धारा बदलता फ्लक्स बनाती है, क्रोड उस फ्लक्स को दूसरी कुंडली तक ले जाता है, और दूसरी कुंडली में emf\nप्रकट होता है। निर्गत ओर अधिक फेरे तो अधिक वोल्टता — और, ऊर्जा संरक्षण के कारण, उतनी ही कम धारा। इसीलिए\nसंचरण लाइनें लाखों वोल्ट पर चलती हैं: उतनी ही शक्ति देने के लिए उच्च वोल्टता का अर्थ है कम धारा, और\nऊष्मा-क्षय I²R के अनुसार चलता है।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: प्रत्यावर्ती धारा कक्षा 12](https://www.youtube.com/results?search_query=alternating+current+class+12+physics+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/science/in-in-class-12th-physics-india/x51bd77206da864f3:alternating-current) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 1, अध्याय 7 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph107.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 2, अध्याय 39। rms मानों पर §39.2 और श्रेणी परिपथ तथा अनुनाद पर\n  §39.5–39.7 पढ़ें; उनका फेजर विवेचन √(R² + (X_L − X_C)²) को मनमाना नहीं, स्वाभाविक बना देता है।","p8":"1860 तक विद्युत और चुंबकत्व के चार नियम थे, और मैक्सवेल ने देखा कि उनमें से एक टूटा हुआ है। ऐम्पियर का\nनियम कहता था कि चुंबकीय क्षेत्र धारा के चारों ओर घूमता है — पर संधारित्र की प्लेटों के बीच के अंतराल का\nक्या, जहाँ कोई आवेश पार नहीं करता और फिर भी परिपथ स्पष्ट रूप से काम करता है? नियम को अक्षरशः मानिए और\nआपको अंतराल के एक ओर चुंबकीय क्षेत्र मिलेगा और दूसरी ओर कुछ नहीं — जो असंगत है।\n\nमैक्सवेल का सुधार यह था कि **बदलता विद्युत क्षेत्र**, चुंबकीय प्रयोजनों के लिए, धारा के समान ही अच्छा है।\nउन्होंने इसे **विस्थापन धारा** कहा, I_d = ε₀ dφ_E/dt। संधारित्र के अंतराल में प्लेटों के बीच क्षेत्र बढ़\nरहा है, और वही बढ़ना चुंबकीय क्षेत्र को अविच्छिन्न रखता है। यह छोटी मरम्मत है जिसका परिणाम विराट है, और इस\nसंक्षिप्त अध्याय से यही एक बात याद रखनी है।\n\nक्योंकि अब देखिए नियम मिलकर क्या कहते हैं। बदलता चुंबकीय क्षेत्र विद्युत क्षेत्र बनाता है — यह फैराडे है,\nअध्याय 6। और बदलता विद्युत क्षेत्र चुंबकीय क्षेत्र बनाता है — यह मैक्सवेल का नया पद है। अतः किसी भी प्रकार\nका बदलता क्षेत्र दूसरे को जन्म देता है, जो स्वयं बदल रहा है, जो पहले को फिर बनाता है। दोनों क्षेत्र\nएक-दूसरे को टिकाए रखते हैं और चल पड़ते हैं — न तार चाहिए, न आवेश, न कोई माध्यम। यही **विद्युत चुंबकीय\nतरंग** है, और प्रकाश उनमें से एक है।\n\nमैक्सवेल यह भी निकाल सके कि वह कितनी तेज़ चलती है, और वह भी उन दो संख्याओं से जो प्रयोगशालाओं में बैटरी\nऔर चुंबक से पहले ही नापी जा चुकी थीं: c = 1/√(μ₀ε₀), जो 3 × 10⁸ m/s निकलता है। यह प्रकाश की नापी गई गति से\nमेल खा गया, और इससे तय हो गया कि प्रकाश क्या है — एक प्रश्न जो दो शताब्दियों से खुला पड़ा था।\n\nतरंग की **संरचना** को ठीक से चित्रित करना ज़रूरी है, क्योंकि यह सीधे पूछा जाता है। E और B एक ही कदम में\nदोलन करते हैं, दोनों एक-दूसरे के समकोण पर **और** दोनों गति की दिशा के भी समकोण पर — तरंग दो बार अनुप्रस्थ\nहै। उनके परिमाण जुड़े हुए हैं: E₀/B₀ = c, अतः विद्युत भाग संख्यात्मक रूप से बहुत बड़ा है, और इसीलिए प्रकाश\nपदार्थ से मुख्यतः अपने विद्युत क्षेत्र द्वारा क्रिया करता है। गति की दिशा E × B के अनुदिश है।\n\nतरंग ऊर्जा ले जाती है, जो विद्युत और चुंबकीय आधों में बराबर बँटी होती है। वह **संवेग** भी ले जाती है,\nइसीलिए प्रकाश-पुंज एक क्षीण दबाव डालता है — सौर-पाल (solar sail) का सिद्धांत यही है।\n\n**स्पेक्ट्रम** आवृत्ति के बीसियों घातांकों में फैली वही एक परिघटना है, और पट्टियों के अलग-अलग नाम होने का\nएकमात्र कारण यह इतिहास है कि हर एक की खोज कैसे हुई। रेडियो तरंगें, माइक्रोवेव, अवरक्त, दृश्य, पराबैंगनी,\nX-किरण, गामा किरण — एक ही परिवार, बढ़ती आवृत्ति और घटती तरंगदैर्ध्य के क्रम में। वह क्रम, प्रति पट्टी एक\nउत्पादन-विधि और एक उपयोग, और लगभग कहाँ सीमाएँ हैं — यही अध्याय का पूरा तथ्यात्मक भार है और लगभग हर वर्ष\nएक-दो अंक के प्रश्न के रूप में आता है। दृश्य प्रकाश हास्यास्पद रूप से पतली पट्टी घेरता है, लगभग 400 से\n700 nm, और ओज़ोन परत का काम उसके ठीक ऊपर की पराबैंगनी को सोख लेना है।\n\nयह पुस्तक का सबसे छोटा अध्याय है और सबसे भरोसेमंद रूप से फल देने वालों में: प्रश्न छोटे, तथ्यात्मक और\nदोहराए जाने वाले होते हैं। हलका लगने के कारण इसे छोड़िए मत।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: विद्युत चुंबकीय तरंगें कक्षा 12](https://www.youtube.com/results?search_query=electromagnetic+waves+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/search?page_search_query=electromagnetic%20waves%20class%2012) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 1, अध्याय 8 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph108.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 2, अध्याय 40। यह संक्षिप्त है, जो अध्याय के अनुरूप है; विस्थापन\n  धारा और तरंग समीकरण के निकलने के लिए §40.1–40.3 पढ़ें, और स्पेक्ट्रम की सारणी के लिए NCERT का उपयोग करें।","p9":"पानी के गिलास में तिनका डालिए और वह मुड़ा दिखता है। चम्मच में अपना चेहरा देखिए और आप उलटे हैं। यह अध्याय\nदोनों समझाता है, और पूरा काम एक सरल कर देने वाली मान्यता से करता है: कि प्रकाश सीधी रेखाओं में चलता है,\nजिन्हें **किरण** कहते हैं, जब तक कोई चीज़ उसे मोड़ न दे। यह मान्यता कड़ाई से सत्य नहीं है — अध्याय 10 इसी\nके विफल होने पर है — पर जब प्रकाश जिन वस्तुओं से मिलता है वे उसकी तरंगदैर्ध्य से बहुत बड़ी हों तो यह\nउत्कृष्ट है, और इसमें हर दर्पण और लेंस आ जाता है जिसे आप कभी हाथ में लेंगे।\n\n**परावर्तन** आप जानते हैं: आने का कोण = जाने का कोण। नया है वक्र दर्पण। अवतल दर्पण (भीतर की ओर मुड़ा,\nचम्मच के भीतरी भाग जैसा) समांतर किरणों को फोकस पर मिला देता है; उत्तल दर्पण उन्हें फैला देता है, इसलिए वे\nकेवल पीछे किसी फोकस से आती **प्रतीत** होती हैं। प्रतिबिंब-निर्माण की हर बात दो किरणें खींचकर यह देखने से\nनिकलती है कि वे कहाँ मिलती हैं, और दर्पण सूत्र 1/v + 1/u = 1/f उसी खींचने का बीजगणित है। आवर्धन m = −v/u\nआकार बताता है और अपने चिह्न से यह भी कि प्रतिबिंब सीधा है या उलटा।\n\nचिह्न परिपाटी में ही सबसे अधिक अंक कटते हैं, और वह मनमानी नहीं है — वह केवल इतना है कि \"सब कुछ दर्पण से\nनापिए, और जिस दिशा से प्रकाश आया उसे ऋण कहिए।\" इसे एक बार अपनाइए, यंत्रवत् लागू कीजिए, प्रश्न के बीच में\nकभी न बदलिए। यदि वास्तविक प्रतिबिंब का उत्तर धनात्मक आ रहा है, कहीं चूक हुई है।\n\n**अपवर्तन** रोचक आधा भाग है। प्रकाश काँच में हवा से धीमा चलता है, और जब तरंग किसी सीमा को कोण पर पार करती\nहै तो जो भाग पहले प्रवेश करता है वह पहले धीमा होता है, इसलिए पूरा तरंगाग्र घूम जाता है। वही घूमना मुड़ना\nहै। स्नेल का नियम n₁ sin i = n₂ sin r हिसाब है; n = c/v अपवर्तनांक की परिभाषा है — उस पदार्थ में प्रकाश\nकितने गुना धीमा चलता है। मुड़ा तिनका ठीक यही है, और यह भी कि तालाब जितना है उससे कम गहरा दिखता है।\n\n**पूर्ण आंतरिक परावर्तन** तब होता है जब आप अपवर्तन को उसकी सीमा से आगे धकेल दें। काँच से हवा में जाते\nप्रकाश अभिलंब से **दूर** मुड़ता है, इसलिए भीतर एक बड़े कोण पर — क्रांतिक कोण — अपवर्तित किरण को 90° से भी\nआगे मुड़ना पड़ता, जो असंभव है। अतः कुछ भी बाहर नहीं निकलता; सब भीतर ही परावर्तित हो जाता है। यह आंशिक नहीं,\nपूर्ण परावर्तन है, और इसीलिए प्रकाशिक तंतु (optical fibre) प्रकाश को किलोमीटरों तक मोड़ों के आसपास बिना\nखोए ले जा सकते हैं, और इसीलिए हीरा चमकता है।\n\n**प्रिज़्म** मानक प्रयोग है: एक फलक से प्रकाश भीतर, दूसरे से बाहर, कोण δ से विचलित। आपतन कोण बदलिए और δ\nपहले घटता है, न्यूनतम पर पहुँचता है, फिर बढ़ता है — और उस न्यूनतम पर प्रकाश प्रिज़्म से सममित रूप से\nगुज़रता है। वही सममिति A + δ_m = i + e को n के सुव्यवस्थित सूत्र में समेट देती है। चूँकि n रंग पर थोड़ा\nनिर्भर करता है, हर रंग भिन्न विचलन पाता है और श्वेत प्रकाश स्पेक्ट्रम में फैल जाता है। यह **वर्ण-विक्षेपण\n(dispersion)** है, और इसी से प्रिज़्म इंद्रधनुष बनाता है और सस्ते लेंस रंगीन किनारे दिखाते हैं।\n\n**लेंस** तब दो वक्र सतहों पर दो बार अपवर्तन ही है, और वह दर्पणों जैसा ही व्यवहार करता है, चिह्न बदले हुए:\n1/v − 1/u = 1/f। **क्षमता** P = 1/f, डाइऑप्टर में, इसलिए है कि लेंस जोड़ने पर उनकी क्षमताएँ सीधे जुड़ जाती\nहैं, जो फोकस दूरियाँ जोड़ने से बहुत सुविधाजनक है — और इसीलिए आपके चश्मे का नुस्खा डाइऑप्टर में लिखा जाता है।\n\nअध्याय यंत्रों पर समाप्त होता है — सूक्ष्मदर्शी और दूरदर्शी — और दोनों वही युक्ति हैं: एक लेंस वास्तविक\nप्रतिबिंब बनाता है, और दूसरा लेंस उस प्रतिबिंब को देखने के लिए आवर्धक की तरह काम करता है। सूक्ष्मदर्शी के\nलिए आप दोनों फोकस दूरियाँ छोटी चाहते हैं; दूरदर्शी के लिए लंबा अभिदृश्यक और छोटा नेत्रिका, जिससे आवर्धन\nf₀/fₑ मिलता है। यदि आप बता सकें कि ये आवश्यकताएँ **क्यों** भिन्न हैं, तो आपने यंत्र समझ लिए हैं, उनके सूत्र\nरटे नहीं।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: किरण प्रकाशिकी कक्षा 12](https://www.youtube.com/results?search_query=ray+optics+and+optical+instruments+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/science/in-in-class-12th-physics-india/in-in-ray-optics-and-optical-instruments) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 2, अध्याय 9 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph201.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 1, पूरा अध्याय 18। §18.4 की चिह्न परिपाटी अपनाने योग्य है, और\n  §18.10–18.12 प्रिज़्म तथा वर्ण-विक्षेपण पर बोर्ड की व्युत्पत्तियाँ ढँक लेता है। यंत्रों के लिए अध्याय 19।","p10":"अध्याय 9 ने प्रकाश को सीधी रेखाओं में चलती किरणों की तरह लिया और बहुत दूर तक निभा लिया। यह अध्याय उन\nस्थितियों पर है जहाँ वह चित्र ढह जाता है — और जहाँ पता चलता है कि प्रकाश वास्तव में क्या है।\n\nयह प्रयोग निर्णायक रहा। प्रकाश को दो बहुत पतली, पास-पास रखी झिर्रियों से पर्दे पर डालिए। किरणें दो चमकीली\nपट्टियों की भविष्यवाणी करतीं। वास्तव में मिलता है चमकीली और काली पट्टियों का पूरा क्रम, पर्दे पर फैला हुआ।\n**काली** पट्टी कहाँ से आई? दो प्रकाश मिलकर छाया नहीं बना सकते — जब तक प्रकाश एक तरंग न हो।\n\nयही कुंजी है। तरंग में शिखर और गर्त होते हैं। जहाँ एक झिर्री का शिखर दूसरी के शिखर से मिलता है, वे जुड़\nजाते हैं और आपको दोगुनी चमक मिलती है: **संपोषी व्यतिकरण**। जहाँ शिखर गर्त से मिलता है, वे कट जाते हैं और\nअंधेरा मिलता है: **विनाशी व्यतिकरण**। पर्दे के किसी बिंदु पर कौन-सा होगा, यह केवल इस पर निर्भर करता है कि\nएक झिर्री से आए प्रकाश को दूसरी की तुलना में कितना अधिक चलना पड़ा — **पथांतर**। पूरे-पूरे तरंगदैर्ध्य का\nअतिरिक्त पथ मतलब शिखर अब भी शिखर से मिलेंगे, अतः चमकीला। आधे-आधे का मतलब चमक अंधेरे से मिलेगी, अतः काला।\nअध्याय का हर सूत्र इसी वाक्य के साथ ज्यामिति जुड़ी हुई है: चमकीली फ्रिंज के लिए d sin θ = nλ, और फ्रिंज\nचौड़ाई β = λD/d।\n\nउस चौड़ाई पर ध्यान दीजिए, क्योंकि इससे समझ आता है कि इसे इतने समय तक किसी ने क्यों नहीं देखा। फ्रिंज अधिक\nचौड़ी होती हैं यदि तरंगदैर्ध्य अधिक हो, या पर्दा और दूर हो, या झिर्रियाँ और पास हों। दृश्य प्रकाश की\nतरंगदैर्ध्य लगभग आधा माइक्रोन है — अतः जब तक आपकी झिर्रियाँ मिलीमीटर के अंश भर दूर न हों, फ्रिंज देखने के\nलिए बहुत ही सूक्ष्म रहती हैं। किरण प्रकाशिकी रोज़मर्रा में इसलिए नहीं चलती कि प्रकाश तरंग नहीं है, बल्कि\nइसलिए कि उसकी तरंगदैर्ध्य उन सब चीज़ों की तुलना में नन्ही है जो हम उसके रास्ते में रखते हैं।\n\nयह व्यवस्था तभी काम करती है जब दोनों झिर्रियाँ हर क्षण, शिखर-दर-शिखर, एक कदम में रहें। वह शर्त\n**कलासंबद्धता (coherence)** है, और इसीलिए प्रयोग में एक स्रोत को दो में बाँटा जाता है, दो अलग लैंप नहीं\nलिए जाते: दो स्वतंत्र लैंप सेकंड में लाखों बार कदम से बाहर आते-जाते रहते हैं, अतः फ्रिंज धुल कर एक समान\nचमक बन जाती हैं। \"स्रोतों का कलासंबद्ध होना क्यों आवश्यक है\" का मानक उत्तर यही है, और वह उत्तर इस\n\"बहकना\" शब्द में है।\n\n**हाइगेंस का सिद्धांत** वह उपकरण है जो इस सबका हिसाब संभव बनाता है। वह कहता है: तरंगाग्र के हर बिंदु को\nनई वृत्तीय तरंगिकाओं का नन्हा स्रोत मानिए, और अगला तरंगाग्र वह पृष्ठ है जिसे वे सब स्पर्श करती हैं। सुनने\nमें यह एक विचित्र हिसाबी युक्ति लगती है, और है भी, पर यह परावर्तन और अपवर्तन दोनों को ठीक निकाल देती है —\nइसमें यह भी कि प्रकाश धीमा होने पर अभिलंब की ओर **क्यों** मुड़ता है, जिसे किरण प्रकाशिकी को मान लेना पड़ता\nथा।\n\n**विवर्तन (diffraction)** वही तरंग-प्रकृति एकल झिर्री पर प्रकट होती है। प्रकाश ज्यामितीय छाया में फैल\nजाता है, जिससे एक चौड़ी केंद्रीय चमकीली पट्टी और उसके दोनों ओर क्षीण पट्टियाँ बनती हैं। केंद्रीय पट्टी की\nचौड़ाई λ/a के अनुसार चलती है — झिर्री सँकरी कीजिए और प्रतिरूप **फैल** जाता है, जो किरणों की भविष्यवाणी का\nउलटा है और यह जाँचने की अच्छी कसौटी कि आप तरंगों में सोच रहे हैं या नहीं। यही अब तक बने हर दूरदर्शी और\nसूक्ष्मदर्शी की कठोर सीमा भी है: विवर्तन जितना अनुमति दे, उससे सूक्ष्म विवरण आप हल नहीं कर सकते।\n\nएक बात जो किरण और तरंग **दोनों** स्पष्ट नहीं करतीं, वह यह है कि प्रकाश का दोलन पुंज के आड़े एक दिशा रखता\nहै। एक दिशा को छोड़कर सब छान दीजिए और आपके पास **ध्रुवित** प्रकाश है — इसका प्रमाण कि प्रकाश अनुप्रस्थ\nतरंग है, क्योंकि ध्वनि जैसी अनुदैर्घ्य तरंग में छानने के लिए कोई \"आड़ा\" ही नहीं होता।\n\n> **अपने वर्ष का पाठ्यक्रम देख लें।** पाठ्यक्रम के युक्तिसंगतीकरण से इस अध्याय में सबसे अधिक ध्रुवण\n> प्रभावित हुआ है, और विशेषतः ब्रूस्टर का नियम। इस अध्याय का §1 बताता है कि उस पर समय लगाने से पहले\n> वर्तमान CBSE पाठ्यक्रम से क्या मिलाना है। व्यतिकरण और एकल-झिर्री विवर्तन भरोसेमंद मूल हैं।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: तरंग प्रकाशिकी कक्षा 12](https://www.youtube.com/results?search_query=wave+optics+class+12+physics+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/science/in-in-class-12th-physics-india/in-in-wave-optics) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 2, अध्याय 10 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph202.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 1, अध्याय 17। यंग के प्रयोग और पथांतर तर्क पर §17.3–17.6 उपलब्ध\n  सबसे स्पष्ट संक्षिप्त विवरण है; विवर्तन के लिए §17.9। यदि शिखर-गर्त का चित्र अभी नहीं बैठा, तो अध्याय 16\n  का §16.9 (ध्वनि में व्यतिकरण) देखिए — वही विचार, ऐसी चीज़ के साथ जिसे आप सुन सकते हैं।","p11":"अध्याय 10 ने अभी सिद्ध किया कि प्रकाश एक तरंग है। यह अध्याय सिद्ध करता है कि वह कणों की धारा है। दोनों सही\nहैं, और भौतिकी आज तक इससे पूरी तरह उबरी नहीं।\n\nजिस प्रयोग ने यह थोपा: धातु की सतह पर प्रकाश डालिए और इलेक्ट्रॉन निकल आते हैं। इतना तरंग-चित्र सह लेता है\n— तरंग इलेक्ट्रॉनों को हिलाकर ढीला कर देती है। पर तीन बातें बैठती ही नहीं।\n\nपहली, **एक निश्चित आवृत्ति से नीचे कुछ भी नहीं होता**, प्रकाश चाहे कितना तेज़ हो या आप कितनी देर प्रतीक्षा\nकरें। तरंग-चित्र इसे समझा नहीं सकता; एक घंटे की मंद लाल रोशनी को एक मिनट की तेज़ लाल रोशनी जितनी ऊर्जा\nपहुँचानी चाहिए थी।\n\nदूसरी, **इलेक्ट्रॉन तुरंत निकलते हैं** — प्रकाश पहुँचने के एक नैनोसेकंड के भीतर — तब भी जब प्रकाश अत्यंत\nक्षीण हो। पूरी सतह पर फैली तरंग को एक अकेले इलेक्ट्रॉन पर पर्याप्त ऊर्जा जुटाने में मिनट लग जाते।\n\nतीसरी, **प्रकाश तेज़ करने से इलेक्ट्रॉन अधिक निकलते हैं, तेज़ नहीं।** उनकी अधिकतम ऊर्जा केवल **आवृत्ति** पर\nनिर्भर करती है। तीव्रता संख्या बदलती है, चाल कभी नहीं।\n\nआइंस्टाइन का स्पष्टीकरण था कि प्रकाश की ऊर्जा अविभाज्य गुटकों में आती है — **फ़ोटॉन** — प्रत्येक E = hν\nलिए हुए, और एक इलेक्ट्रॉन एक फ़ोटॉन सोखता है, पूरा या कुछ नहीं। सब कुछ जगह पर बैठ जाता है। धातु से बाहर\nनिकलने के लिए एक न्यूनतम ऊर्जा चाहिए, जिसे **कार्य फलन** φ₀ कहते हैं; यदि एक अकेला फ़ोटॉन उससे कम लाता है,\nतो उनकी कोई भी संख्या काम न करेगी, क्योंकि दो विफल प्रयासों को जोड़ा नहीं जा सकता। यही देहली है। चूँकि एक\nइलेक्ट्रॉन के लिए एक फ़ोटॉन है, संचित करने के लिए कुछ नहीं, अतः उत्सर्जन तत्क्षण है। और निकलने की कीमत\nचुकाने के बाद जो ऊर्जा बचती है वह गतिज ऊर्जा बन जाती है: **K_max = hν − φ₀**, आइंस्टाइन का प्रकाश-विद्युत\nसमीकरण। तीव्रता केवल प्रति सेकंड फ़ोटॉन है, अतः वह तय करती है कि कितने इलेक्ट्रॉन, कभी यह नहीं कि कितने\nऊर्जावान।\n\n**निरोधी विभव** वह तरीका है जिससे आप इलेक्ट्रॉन पकड़े बिना K_max नाप लेते हैं: उलटी वोल्टता बढ़ाते जाइए\nजब तक सबसे तेज़ इलेक्ट्रॉन भी पार न कर सके, और eV₀ = K_max। V₀ को आवृत्ति के सामने आलेखित कीजिए और एक सरल\nरेखा मिलती है जिसकी प्रवणता h/e है — हर धातु के लिए वही h, केवल अंतःखंड बदलता है। वह ग्राफ़ लगभग हर वर्ष\nपूछा जाता है, और प्रवणता तथा अंतःखंड का अर्थ बता सकना रेखा खींच देने से अधिक मूल्यवान है।\n\nफिर अध्याय विचित्रता को उलट देता है। यदि तरंग कण जैसा व्यवहार कर सकती है, तो क्या कण तरंग जैसा व्यवहार कर\nसकता है? दे ब्रॉग्ली ने कहा हाँ, और तरंगदैर्ध्य दी: **λ = h/p**। यह उपमा नहीं है। इलेक्ट्रॉनों को\nक्रिस्टल पर दागिए और वे विवर्तित होते हैं, ठीक झिर्रियों से गुज़रे प्रकाश जैसे व्यतिकरण प्रतिरूप बनाते हुए\n— इलेक्ट्रॉन सूक्ष्मदर्शी इसी का उपयोग करता है। दरवाज़े से गुज़रते समय आप विवर्तित नहीं होते, क्योंकि h\nअत्यंत सूक्ष्म है और आपका संवेग नहीं: आपकी तरंगदैर्ध्य लगभग 10⁻³⁵ m निकलती है, नापे जाने से बहुत छोटी।\nपर कुछ वोल्ट से त्वरित इलेक्ट्रॉन की तरंगदैर्ध्य परमाणुओं की दूरी के बराबर होती है, और वह वैसा ही व्यवहार\nकरता है। V वोल्ट से त्वरित इलेक्ट्रॉन के लिए उपयोगी शॉर्टकट λ = 1.227/√V nm है।\n\nईमानदार सारांश यह है कि प्रकाश न तरंग है न कण, बल्कि कुछ ऐसा जिसके लिए हमारी रोज़मर्रा की भाषा में शब्द\nनहीं है, और जो आपके प्रश्न के अनुसार एक या दूसरा चेहरा दिखाता है। इसे सुलझाने की कोशिश न कीजिए; बोर्ड यह\nअपेक्षा नहीं करता। वह यह अपेक्षा करता है कि आप वे तीन प्रेक्षण बता सकें जिन्हें तरंग-चित्र समझा नहीं सकता,\nऔर hν − φ₀ ठीक से लगा सकें।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: द्वैत प्रकृति कक्षा 12](https://www.youtube.com/results?search_query=dual+nature+of+radiation+and+matter+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/search?page_search_query=photoelectric%20effect%20class%2012) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 2, अध्याय 11 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph203.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 2, अध्याय 42। §42.1–42.5 तरंग-चित्र की विफलताओं को एक-एक करके\n  खोलता है, और बोर्ड के 3-अंकीय प्रश्न ठीक इसी ढाँचे में पूछे जाते हैं।","p12":"परमाणु के भीतर क्या है? 1911 में किसी को पता नहीं था, इसलिए रदरफ़ोर्ड के समूह ने स्वाभाविक काम किया: कोई\nछोटी और तेज़ चीज़ सोने की पतली पन्नी पर दागी और देखा कि वह कहाँ जाती है। छोटी चीज़ थी अल्फ़ा कण; पन्नी कुछ\nहज़ार परमाणु मोटी।\n\nलगभग सब सीधे पार निकल गए, बहुत कम विचलित होकर — अतः परमाणु मुख्यतः खाली जगह है। पर लगभग आठ हज़ार में एक\n**सीधा लौट आया**। रदरफ़ोर्ड ने कहा कि यह इतना चकित करने वाला था जैसे टिशू पेपर पर गोला दागा जाए और वह\nलौटकर आपकी ओर आ जाए। किसी तेज़, भारी अल्फ़ा कण को मोड़कर वापस भेजने के लिए परमाणु का सारा धन आवेश और लगभग\nसारा द्रव्यमान एक नन्हे कठोर केंद्र में ठुँसा होना चाहिए। वही **नाभिक** है, और प्रयोग ने उसका आकार भी दे\nदिया: लगभग 10⁻¹⁵ m, जबकि परमाणु 10⁻¹⁰ m। परमाणु अपने केंद्र से लाख गुना चौड़ा है — स्टेडियम के बीच में\nरखी क्रिकेट गेंद, और इलेक्ट्रॉन कहीं दर्शक-दीर्घा में।\n\nइससे तुरंत एक संकट खड़ा हो गया। यदि इलेक्ट्रॉन नाभिक की परिक्रमा ग्रहों की तरह करते हैं, तो वे त्वरित हो\nरहे हैं, और अध्याय 8 कहता है कि त्वरित आवेश विकिरण करते हैं। वे भीतर की ओर सर्पिल होकर गिर जाते और परमाणु\nनैनोसेकंड के अंश में ढह जाता। परमाणु स्पष्टतः ऐसा नहीं करते। चिरसम्मत भौतिकी की भविष्यवाणी थी कि पदार्थ\nअस्तित्व में ही नहीं रह सकता।\n\n**बोर का उत्तर** सच कहें तो एक पैबंद था, और इसे मान लेना अच्छा है, क्योंकि तब तीन अभिगृहीत याद रखना आसान\nहो जाता है, कठिन नहीं। उन्होंने कहा: इलेक्ट्रॉन केवल कुछ विशेष कक्षाओं में रह सकते हैं, जिनमें — आदेश से\n— वे विकिरण नहीं करते; अनुमत कक्षाएँ वे हैं जिनमें कोणीय संवेग h/2π का पूर्ण गुणज हो; और विकिरण केवल तब\nहोता है जब इलेक्ट्रॉन दो कक्षाओं के बीच **छलाँग** लगाए, और ठीक उतना ऊर्जा-अंतर एक फ़ोटॉन के रूप में ले\nजाए, hν = E₂ − E₁।\n\nवह अंतिम अभिगृहीत ही प्रकृति से मिलाकर जाँचा जा सकता है, और वह शानदार ढंग से खरा उतरता है। चूँकि केवल कुछ\nऊर्जाएँ हैं, केवल कुछ छलाँगें हैं, अतः केवल कुछ फ़ोटॉन-ऊर्जाएँ बाहर आती हैं — इसीलिए गरम गैस लगातार चमक के\nबजाय तीखी रंगीन रेखाएँ उत्सर्जित करती है, और इसीलिए हर तत्व की रेखाओं का समूह उसकी अँगुली-छाप है। बोर का\nमॉडल हाइड्रोजन की ऊर्जाएँ ठीक-ठीक देता है: Eₙ = −13.6/n² eV।\n\nइस सूत्र को ध्यान से पढ़िए, क्योंकि इसकी दो बातें लगातार पूछी जाती हैं। **ऋण चिह्न** का अर्थ है कि\nइलेक्ट्रॉन बद्ध है — उसे हटाने के लिए आपको ऊर्जा देनी पड़ेगी, और शून्य ऊर्जा का अर्थ है अनंत दूरी पर\nस्वतंत्र इलेक्ट्रॉन। और **1/n²** का अर्थ है कि n बढ़ने पर स्तर पास-पास सिमटते जाते हैं: n = 1 से 2 का\nअंतर विशाल है, 5 से 6 का नन्हा। अतः 13.6 eV हाइड्रोजन की आयनन ऊर्जा है, इलेक्ट्रॉन को n = 1 से पूरी तरह\nबाहर निकालने की कीमत।\n\n**स्पेक्ट्रमी श्रेणियाँ** तब केवल छलाँगों के परिवार हैं, इस आधार पर छाँटे गए कि वे कहाँ उतरती हैं। जो सब\nn = 1 पर गिरती हैं वह लाइमन श्रेणी है, और वे सबसे बड़ी ऊर्जा-गिरावटें हैं, अतः पराबैंगनी। जो n = 2 पर\nगिरती हैं वह बामर है — कम गिरावट, और ये हाइड्रोजन की वे चार दृश्य रेखाएँ हैं जो आपने विद्यालय की विसर्जन\nनलिका में देखी होंगी। फिर पाशन n = 3 पर, ब्रैकेट n = 4 पर, अवरक्त में। आपको तरंगदैर्ध्य रटने की आवश्यकता\nनहीं; आपको यह जानना है कि कौन-सी श्रेणी किस उतरने-स्तर की है, और बड़ी गिरावट का अर्थ छोटी तरंगदैर्ध्य है।\n\nवैसे, बोर का मॉडल ग़लत है — एक से अधिक इलेक्ट्रॉन वाले हर परमाणु के लिए वह विफल हो जाता है, और क्वांटम\nयंत्रिकी ने उसे बदल दिया। पर हाइड्रोजन के लिए वह सही है, और उसने यह विचार दिया कि ऊर्जा स्तरों में आती है\n— और वह विचार टिक गया। इसीलिए वह आज भी पढ़ाया जाता है।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: परमाणु कक्षा 12 बोर मॉडल](https://www.youtube.com/results?search_query=atoms+class+12+physics+bohr+model+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/search?page_search_query=bohr%20model%20hydrogen%20atom) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 2, अध्याय 12 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph204.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 2, अध्याय 43। §43.1–43.5 अभिगृहीतों से त्रिज्या और ऊर्जा\n  चरण-दर-चरण निकालते हैं, और बोर्ड यही व्युत्पत्ति पूछता है; श्रेणियों के लिए §43.6।","p13":"रदरफ़ोर्ड ने नाभिक खोजा। यह अध्याय पूछता है कि वह किस चीज़ से बना है, वह जुड़ा क्यों रहता है, और कुछ नाभिक\nटूट क्यों जाते हैं।\n\nवह प्रोटॉनों और न्यूट्रॉनों से बना है — मिलकर **न्यूक्लिऑन** — जो लगभग 10⁻¹⁵ m व्यास के गोले में ठुँसे\nहैं। R = R₀A^(1/3) से एक झटपट गणना घनत्व लगभग 10¹⁷ kg/m³ देती है, यानी मोटे तौर पर प्रति चम्मच दस करोड़\nटन। यह भी देखिए कि वह सूत्र क्या कहता है: त्रिज्या न्यूक्लिऑनों की संख्या के घनमूल के अनुसार बढ़ती है, अतः\nआयतन A के समानुपाती बढ़ता है, अतः **हर नाभिक का घनत्व वही होता है**। न्यूक्लिऑन थैली में कंचों की तरह\nसटकर भरे हैं, दबाए नहीं जा सकते।\n\nइससे स्पष्ट समस्या उठती है: नाभिक कुछ प्रोटॉनों का ढेर है, सब धनात्मक, एक-दूसरे से सटे। कूलॉम का नियम कहता\nहै कि उन्हें प्रचंड वेग से बिखर जाना चाहिए। कोई कहीं अधिक प्रबल चीज़ उन्हें पकड़े है, और उसका नाम है\n**प्रबल नाभिकीय बल** — आकर्षी, आवेश से उदासीन, और अत्यंत कम परास वाला। कुछ फ़र्मीमीटर से आगे वह बस अनुपस्थित\nहै, और इसीलिए बहुत बड़े नाभिक अस्थायी होते हैं: पर्याप्त प्रोटॉन जोड़ते जाइए और स्थिर-वैद्युत प्रतिकर्षण,\nजो पूरे नाभिक में पहुँचता है, उस बल को हराना शुरू कर देता है जो केवल पड़ोसियों के बीच काम करता है।\n\nअब अध्याय का केंद्रीय और सबसे सुंदर तथ्य। हीलियम नाभिक को तौलिए और वह अपने दो प्रोटॉनों तथा दो न्यूट्रॉनों\nके अलग-अलग तौल से **हलका** निकलता है। द्रव्यमान गायब हो गया। वह बंधन ऊर्जा बन गया, E = mc² के द्वारा:\n**द्रव्यमान क्षति** Δm उस ऊर्जा का द्रव्यमान-तुल्य है जो नाभिक को तोड़कर अलग करने में आपको देनी पड़ती। बद्ध\nनिकाय अपने अंगों से कम तौलते हैं। यहाँ का पारंपरिक मात्रक परमाणु द्रव्यमान इकाई है, और याद रखने वाली संख्या\nयह है कि **1 u से 931.5 MeV** मुक्त होती है।\n\nबंधन ऊर्जा को न्यूक्लिऑनों की संख्या से भाग दीजिए और **प्रति न्यूक्लिऑन बंधन ऊर्जा** मिलती है, जो नापती है\nकि हर न्यूक्लिऑन कितनी कसकर पकड़ा गया है — और A के सामने उसका ग्राफ़ इस अध्याय का सबसे महत्वपूर्ण चित्र है।\nवह हलके नाभिकों के लिए तेज़ी से चढ़ता है, A = 56 (लोहा) के आसपास शिखर पर आता है, और फिर धीरे-धीरे गिरता\nहै। नाभिकीय ऊर्जा की हर बात उसी ग्राफ़ पर है। बाईं ओर के नाभिक आपस में जुड़कर वक्र पर **ऊपर** जा सकते हैं,\nऊर्जा मुक्त करते हुए: यह **संलयन (fusion)** है, और सूर्य यही करता है। दाईं ओर के नाभिक टूटकर ऊपर जा सकते\nहैं: यह **विखंडन (fission)** है, और रिएक्टर यही करता है। दोनों ऊर्जा देते हैं क्योंकि दोनों के अंत में\nन्यूक्लिऑन अधिक कसकर बद्ध होते हैं। लोहा शिखर पर बैठा है, इसीलिए वह तारकीय दहन की राख है और इसीलिए आप उससे\nकिसी भी रास्ते से ऊर्जा नहीं निकाल सकते।\n\n**रेडियोसक्रियता** अध्याय का दूसरा आधा भाग है, और दिखने से सरल है। अस्थायी नाभिक के पास बाहर निकलने के तीन\nरास्ते हैं। **अल्फ़ा** क्षय एक हीलियम नाभिक बाहर फेंकता है, जिससे A में 4 और Z में 2 की कमी होती है — भारी\nनाभिकों का भार घटाने का रास्ता। **बीटा** क्षय एक न्यूट्रॉन को प्रोटॉन में (या उलटा) बदल देता है, Z एक से\nबदलता है और A वहीं रहता है — उन नाभिकों का रास्ता जिनका न्यूट्रॉन-प्रोटॉन अनुपात गड़बड़ है। **गामा**\nउत्सर्जन दोनों में से कुछ नहीं बदलता; वह केवल उत्तेजित नाभिक का नीचे के ऊर्जा स्तर पर गिरना है, अध्याय 12\nकी फ़ोटॉन-छलाँग का नाभिकीय रूप।\n\n**क्षय नियम** को रटने के बजाय समझना ठीक है, क्योंकि उससे अर्ध-आयु समझ आती है। हर नाभिक की अगले सेकंड में\nक्षय होने की एक निश्चित प्रायिकता है, और इसकी कोई स्मृति नहीं कि वह कितनी देर पहले से प्रतीक्षा कर रहा है।\nअतः प्रति सेकंड क्षय होने वालों की संख्या शेष संख्या के समानुपाती है: dN/dt = −λN, जिससे N = N₀e^(−λt)।\nप्रति इकाई समय एक निश्चित **अंश** जाता है, और ठीक इसी से **अर्ध-आयु** एक नियतांक बनती है — जो बचा है उसका\nआधा जाने का समय, चाहे आप एक किलोग्राम से शुरू करें या एक माइक्रोग्राम से।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: नाभिक कक्षा 12](https://www.youtube.com/results?search_query=nuclei+class+12+physics+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/search?page_search_query=mass%20defect%20binding%20energy%20nuclei) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 2, अध्याय 13 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph205.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 2, अध्याय 46। बंधन ऊर्जा और प्रति-न्यूक्लिऑन वक्र पर\n  §46.2–46.5, फिर क्षय नियम और तीनों क्षय-विधियों के लिए §46.6–46.9। वक्र का आकार विखंडन और संलयन दोनों की\n  अनुमति क्यों देता है — उनका यह विवेचन अवश्य पढ़ें।","p14":"आपके फ़ोन की हर चीज़ इस अध्याय में है। यह वह अध्याय भी है जिसे विद्यार्थी सबसे अधिक रटने की कोशिश करते हैं\nऔर सबसे कम रटना चाहिए, क्योंकि पूरी बात एक विचार से निकलती है: **आप यह नियंत्रित कर सकते हैं कि कोई पदार्थ\nकितनी अच्छी तरह चालन करे, और यदि आप यह कर सकते हैं तो आप बिना किसी चलने वाले पुर्ज़े का स्विच बना सकते हैं।**\n\nपहले यह कि पदार्थ भिन्न क्यों होते हैं। अकेले परमाणु में इलेक्ट्रॉन तीखे ऊर्जा स्तरों पर बैठते हैं।\nक्रिस्टल में 10²³ परमाणु साथ लाइए और वे स्तर सतत **बैंड** में घुल जाते हैं, जिनके बीच ऐसे अंतराल होते हैं\nजहाँ कोई इलेक्ट्रॉन अनुमत नहीं। दो बैंड मायने रखते हैं: **संयोजी बैंड (valence band)**, जो क्रिस्टल को\nजोड़े रखने वाले इलेक्ट्रॉनों से भरा है, और उसके ऊपर **चालन बैंड (conduction band)**, जहाँ इलेक्ट्रॉन घूमने\nऔर धारा ले जाने के लिए स्वतंत्र है। सब कुछ इनके बीच के अंतराल से तय होता है।\n\n**धातु** में बैंड अतिव्यापी होते हैं, या ऊपर वाला आधा भरा होता है, इसलिए इलेक्ट्रॉन लगभग बिना मनाए चल पड़ते\nहैं — अतः अच्छा चालन। **विद्युतरोधी** में अंतराल बड़ा होता है, कई इलेक्ट्रॉन-वोल्ट, और कमरे के ताप पर कोई\nइलेक्ट्रॉन उसे पार नहीं कर पाता। **अर्धचालक** रोचक मध्य स्थिति है: लगभग एक इलेक्ट्रॉन-वोल्ट का अंतराल,\nइतना छोटा कि तापीय ऊर्जा कुछ इलेक्ट्रॉनों को पार करा देती है। अतः वह थोड़ा चालन करता है — और, महत्वपूर्ण\nबात, **गरम होने पर बेहतर** चालन करता है, धातु के उलट, क्योंकि ऊष्मा बाधा बढ़ाने के बजाय वाहक बनाती है।\n\nजब इलेक्ट्रॉन संयोजी बैंड छोड़ता है, वह पीछे एक रिक्ति छोड़ जाता है, और पड़ोसी इलेक्ट्रॉन उसमें सरक सकता\nहै, जिससे रिक्ति दूसरी ओर खिसक जाती है। सरकते सब इलेक्ट्रॉनों का हिसाब रखने से आसान है रिक्ति का हिसाब\nरखना, इसलिए हम उसे धनात्मक कण मानकर **होल (hole)** कहते हैं। होल हिसाब की सुविधा है, जो ठीक वास्तविक\nधनात्मक वाहक जैसा व्यवहार करती है।\n\nशुद्ध अर्धचालक बहुत उपयोगी नहीं — वाहक बहुत कम, और दोनों प्रकार के बराबर। युक्ति है **अपमिश्रण (doping)**:\nदस लाख में एक परमाणु को जान-बूझकर किसी अशुद्धि से बदल देना। सिलिकॉन में चार बाह्य इलेक्ट्रॉन हैं। पाँच वाले\nपरमाणु (फ़ॉस्फ़ोरस) से बदलिए और एक इलेक्ट्रॉन बचा रहता है, चालन के लिए स्वतंत्र: **n-प्रकार** अर्धचालक,\nजिसमें धारा मुख्यतः इलेक्ट्रॉन ले जाते हैं। तीन वाले (बोरॉन) से बदलिए और एक इलेक्ट्रॉन कम पड़ता है, अर्थात्\nबना-बनाया होल: **p-प्रकार**, जिसमें धारा मुख्यतः होल ले जाते हैं। दोनों कुल मिलाकर विद्युत उदासीन ही रहते\nहैं — यह बहुत आम भ्रांति है। आपने उदासीन परमाणु जोड़ा है; आपने बदला यह है कि कौन-से वाहक उपलब्ध हैं, कुल\nआवेश नहीं।\n\nअब p-प्रकार और n-प्रकार के भाग को संपर्क में लाइए, और अध्याय की एक असली मशीन प्रकट हो जाती है। इलेक्ट्रॉन\np-ओर चले जाते हैं, होल n-ओर, और सीमा के पास वे एक-दूसरे को समाप्त कर देते हैं — पीछे बचता है एक पतला\n**ह्रासी क्षेत्र (depletion region)** जिसमें कोई मुक्त वाहक नहीं, और दोनों ओर उजागर स्थिर आयन। वे आयन एक\nछोटी अंतर्निहित वोल्टता खड़ी कर देते हैं, **रोधिका विभव (barrier potential)**, जिसकी दिशा ऐसी है कि आगे का\nविसरण रुक जाए। संतुलन।\n\nडायोड जो कुछ करता है, वह सब इस बात से निकलता है कि बाहरी वोल्टता उस रोधिका के साथ क्या करती है। धन सिरा\np-ओर जोड़िए — **अग्र अभिनति (forward bias)** — और आप अंतर्निहित क्षेत्र का विरोध करते हैं, ह्रासी क्षेत्र\nसँकरा होता है, रोधिका गिरती है, और सिलिकॉन में लगभग 0.7 V के बाद धारा मुक्त रूप से बहती है। बैटरी उलट दीजिए\nऔर आप रोधिका को **मज़बूत** कर देते हैं: ह्रासी क्षेत्र चौड़ा हो जाता है और लगभग कुछ नहीं बहता। डायोड एकतरफ़ा\nवाल्व है, और उसके I–V ग्राफ़ की पूरी विषयवस्तु यही है।\n\n**दिष्टकरण (rectification)** इसका अनुप्रयोग है: AC भीतर, DC बाहर। अर्ध-तरंग दिष्टकारी उन आधे-चक्रों को\nसीधे रोक देता है जो उसे पसंद नहीं, आधा निवेश गँवाकर। पूर्ण-तरंग दिष्टकारी दो डायोड (या सेतु में चार) इस\nप्रकार लगाता है कि चक्र के दोनों आधे भाग लोड से एक ही दिशा में गुज़रें — अतः निर्गत आवृत्ति निवेश की दोगुनी\nहोती है, एक विवरण जो बोर्ड को पूछना भाता है।\n\n> **अपना पाठ्यक्रम-विस्तार देख लें।** ट्रांज़िस्टर, तर्क द्वार (logic gates) और ज़ेनर डायोड युक्तिसंगत\n> पाठ्यक्रम से हटाए गए हैं। इस अध्याय का §1 बताता है कि ठीक-ठीक क्या परीक्षा-योग्य बचा है; भरोसेमंद मूल है\n> — बैंड, अपमिश्रण, p–n संधि, डायोड के अभिलक्षण और दिष्टकरण।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: अर्धचालक इलेक्ट्रॉनिकी कक्षा 12](https://www.youtube.com/results?search_query=semiconductor+electronics+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/search?page_search_query=semiconductor%20p-n%20junction%20diode) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT भौतिकी भाग 2, अध्याय 14 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhph206.pdf)\n- **HC Verma** — *Concepts of Physics* भाग 2, अध्याय 45। बैंड, अपमिश्रण और संधि के लिए §45.1–45.6; डायोड\n  और दिष्टकारी के लिए §45.7–45.8। जहाँ आपका पाठ्यक्रम रुकता है, वहीं रुक जाइए।"},"scopes":{"m1":"### पाठ्यक्रम में\n\n- संबंधों के प्रकार: **स्वतुल्य, सममित, संक्रामक** और **तुल्यता** संबंध\n- **एकैकी (injective)** और **आच्छादक (surjective)** फ         if (m2 && /\d/.test(m2[2]) === ord){ items.push([m2[3]]); i++; continue; }
        if (!items.length) break;
        if (/^\s{2,}\S/.test(L[i])){ items[items.length - 1].push(dedent(L[i])); i++; continue; }
        // A blank line ends the list only if nothing indented follows it. A
        // question that carries a distribution table looks exactly like this,
        // and breaking here left the table outside the list, as a paragraph
        // of raw pipes, with the next question renumbered from one.
        if (/^\s*$/.test(L[i])){
          var j = i;
          while (j < L.length && /^\s*$/.test(L[j])) j++;
          var nxt = j < L.length ? L[j].match(/^(\s*)([-*+]|\d+[.)])\s+/) : null;
          if (nxt && /\d/.test(nxt[2]) === ord && !nxt[1]){ i = j; continue; }
          if (j < L.length && !nxt && /^\s{2,}\S/.test(L[j])){
            items[items.length - 1].push(""); i = j; continue;
          }
        }
        break;
      }
      var tag = ord ? "ol" : "ul";
      var lh = "<" + tag + (ord && first !== 1 ? ' start="' + first + '"' : "") + ">";
      items.forEach(function(x){
        lh += "<li>" + (x.length > 1 ? block(x) : inline(x[0])) + "</li>";
      });
      h += lh + "</" + tag + ">";
      continue;
    }
    para.push(ln.trim()); i++;
  }
  flush();
  return h;
}

/* ================= the model =================
   The arithmetic the whole product rests on.

   CBSE publishes marks per *unit*, not per chapter. So a chapter's stake is
   its unit's marks divided between the chapters in that unit — Calculus
   carries 35 marks across five chapters, so each is worth about seven. That is
   an even split rather than a measured one, and it is the honest assumption to
   make: the board does not publish a per-chapter split, and pretending to know
   one would be inventing precision.

   Everything else follows. You grade each chapter 0-3; a grade of 3 secures
   its stake, 0 secures none of it, and the difference is marks still at risk.
   ================================================================================ */

var SUBJ = {
  maths:   { code:"041", total:80, label:"Mathematics", k:"subj.maths" },
  physics: { code:"042", total:70, label:"Physics",     k:"subj.physics" }
};
var SUBJECTS = ["maths", "physics"];
var GRADES = [0, 1, 2, 3];
//: What a grade is worth, as a share of the chapter's marks. Deliberately
//: linear: a "shaky" chapter really does tend to return about a third of its
//: marks, and a curve here would be a claim nobody can support.
function gradeShare(g){ return (g || 0) / 3; }

//: How much the queue trusts a chapter's marks. A priority-1 chapter is one
//: the board asks almost every year, so marks recovered there are more
//: reliably marks earned. From the frequency analysis in analysis/.
var PRIO_WEIGHT = { 1: 1.0, 2: 0.82, 3: 0.64 };

var CH = DATA.chapters || [];
var byId = {};
CH.forEach(function(c){ byId[c.id] = c; });

// stake: the chapter's share of its unit's marks
(function(){
  var perUnit = {};
  CH.forEach(function(c){ var k = c.subj + "|" + c.unit; perUnit[k] = (perUnit[k] || 0) + 1; });
  CH.forEach(function(c){
    c.siblings = perUnit[c.subj + "|" + c.unit];
    c.stake = c.unitMarks / c.siblings;
  });
})();

// "Unit I (8 marks, shared with Ch 2) · Typical appearance: one 1-mark MCQ…"
// The first clause repeats the unit and the marks, both of which are already
// on screen wherever this is shown. Keep the half that says something.
CH.forEach(function(c){
  var parts = String(c.appear || "").split(" · ");
  if (parts.length > 1 && /^Units? /.test(parts[0])) parts.shift();
  c.appearShort = parts.join(" · ").replace(/^Typical appearance:\s*/i, "");
});

function chapters(subj){
  return CH.filter(function(c){ return c.subj === subj; });
}
