<style>
/* ==========================================================================
   Marks First — the planner
   The design comes from the thing being sold: a CBSE answer script. Marks are
   awarded in steps by a marking scheme and totalled in the margin in red, so
   the page has a margin that totals marks, a mono face for every number that
   is a mark, and red reserved for marks that are still at risk. Paper is the
   cool grey-green of an Indian examination form, not cream.
   ========================================================================== */

:root{
  --paper:#F1F4F1; --card:#FFFFFF; --sunk:#E7ECE7;
  --ink:#141A1B; --body:#374344; --muted:#5E6D6D; --faint:#8B9898;
  --line:#D4DCD6; --hair:#E3E9E4;
  --accent:#0D4B48; --accent-ink:#0D4B48; --accent-soft:#E2EDEB;
  /* text on a filled accent or semantic ground — a literal #fff would be
     unreadable once the accent lightens for dark mode */
  --on-accent:#FFFFFF; --on-solid:#FFFFFF;
  --mark:#B03127; --mark-soft:#F7E6E3;
  --secured:#2C6742; --secured-soft:#E3EEE6;
  --ochre:#87620F; --ochre-soft:#F6EEDC;
  --shadow:0 1px 2px rgba(20,26,27,.05), 0 6px 20px rgba(20,26,27,.05);
  --lift:0 2px 6px rgba(20,26,27,.08), 0 16px 40px rgba(20,26,27,.09);
  --serif:'Faustina','Noto Serif Devanagari',Georgia,serif;
  --sans:'Archivo','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono','DejaVu Sans Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --margin:250px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1211; --card:#151C1B; --sunk:#1B2322;
    --ink:#E8EEEB; --body:#C3CDC9; --muted:#8B9997; --faint:#667573;
    --line:#28332F; --hair:#202A28;
    --accent:#54B8AC; --accent-ink:#68C6BA; --accent-soft:#0F2A28;
    --on-accent:#06211F; --on-solid:#06211F;
    --mark:#E8796B; --mark-soft:#2C1614;
    --secured:#68C189; --secured-soft:#12251A;
    --ochre:#D3A648; --ochre-soft:#261D0C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    --lift:0 2px 6px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#0D1211; --card:#151C1B; --sunk:#1B2322;
  --ink:#E8EEEB; --body:#C3CDC9; --muted:#8B9997; --faint:#667573;
  --line:#28332F; --hair:#202A28;
  --accent:#54B8AC; --accent-ink:#68C6BA; --accent-soft:#0F2A28;
  --on-accent:#06211F; --on-solid:#06211F;
  --mark:#E8796B; --mark-soft:#2C1614;
  --secured:#68C189; --secured-soft:#12251A;
  --ochre:#D3A648; --ochre-soft:#261D0C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  --lift:0 2px 6px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--body);
  font:400 15.5px/1.62 var(--sans);font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html[lang="hi"] body{line-height:1.76}
html[lang="hi"] .md{line-height:1.84}
[hidden]{display:none!important}
button{font-family:inherit}

/* ============ TOP BAR ============ */
.bar{position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
  padding:0 22px;height:56px}
.brand{display:flex;align-items:baseline;gap:9px;border:0;background:none;padding:0;
  cursor:pointer;color:inherit;text-align:left;flex:none}
.brand b{font:700 19px/1 var(--serif);color:var(--ink);letter-spacing:-.01em}
.brand span{font:400 10.5px/1 var(--mono);color:var(--faint);letter-spacing:.04em}
.brand:hover b{color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:none;cursor:pointer;color:var(--muted);
  font:500 12.5px/1 var(--sans);padding:9px 13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink);background:var(--sunk)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.find{flex:1;min-width:0;display:flex;align-items:center;gap:8px;max-width:330px;
  border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 11px;height:36px}
.find input{border:0;background:none;color:var(--ink);font:400 13.5px/1 var(--sans);
  width:100%;min-width:0}
.find input:focus{outline:0}
.find svg{flex:none;color:var(--faint)}
.bar-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.chip{border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;
  font:400 11px/1 var(--mono);padding:8px 10px;border-radius:7px;letter-spacing:.03em;
  white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--faint)}
.chip.on{color:var(--secured);border-color:var(--secured)}
.lang{display:inline-flex;gap:1px}
.lang button{border:0;background:none;cursor:pointer;color:var(--faint);
  font:400 11px/1 var(--mono);padding:8px 7px;border-radius:6px}
.lang button[aria-pressed="true"]{color:var(--ink);background:var(--sunk)}
.burger{display:none}

/* ============ FRAME ============ */
.frame{display:grid;grid-template-columns:var(--margin) minmax(0,1fr);
  align-items:start;max-width:1180px;margin:0 auto}
.stage{min-width:0;padding:34px 40px 90px}

/* ============ THE MARGIN: a marks ledger ============ */
/* An examiner totals a script down the margin. So does this. */
.ledger{position:sticky;top:56px;padding:34px 0 40px 26px;border-right:1px solid var(--hair)}
.led-k{font:400 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin:0 0 14px}
.led-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:7px 0;border-bottom:1px dotted var(--hair)}
.led-row:last-of-type{border-bottom:0}
.led-row span{font:400 12.5px/1.3 var(--sans);color:var(--muted)}
.led-row b{font:500 15px/1 var(--mono);color:var(--ink)}
.led-row.big b{font-size:26px;letter-spacing:-.02em}
.led-row.big span{font-size:13px}
.led-row.secured b{color:var(--secured)}
.led-row.risk b{color:var(--mark)}
.led-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);
  margin:14px 0 6px}
.led-bar i{display:block;height:100%}
.led-bar i.s{background:var(--secured)}
.led-bar i.r{background:var(--mark);opacity:.75}
.led-note{font:400 11px/1.5 var(--mono);color:var(--faint);margin:10px 0 0}
.led-field{margin-top:20px}
.led-field label{display:block;font:400 10px/1 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.led-field input{width:100%;border:1px solid var(--line);border-radius:7px;
  background:var(--card);color:var(--ink);font:400 13px/1 var(--mono);padding:9px 10px}
.led-cta{display:block;width:100%;margin-top:20px;border:0;border-radius:8px;
  background:var(--accent);color:var(--on-accent);font:600 13px/1 var(--sans);padding:12px;
  cursor:pointer;text-align:center;text-decoration:none}
.led-cta:hover{filter:brightness(1.08)}

/* ============ HEADINGS AND BLOCKS ============ */
.eyebrow{font:400 10.5px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;
  color:var(--accent-ink);margin:0 0 12px}
h1.pt{font:600 clamp(25px,3.4vw,34px)/1.14 var(--serif);color:var(--ink);
  letter-spacing:-.018em;margin:0;text-wrap:balance}
.lede{font:400 16px/1.6 var(--sans);color:var(--muted);margin:12px 0 0;max-width:64ch}
h2.sec{font:600 11px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:0}
.block{margin-top:38px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  flex-wrap:wrap;padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:18px}
.block-h p{margin:0;font:400 12px/1.4 var(--mono);color:var(--faint)}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:18px 20px}

/* ============ THE RATING PASS ============ */
.rate{display:flex;flex-direction:column}
.rate-u{font:400 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);padding:18px 2px 8px;display:flex;justify-content:space-between;gap:10px}
.rate-u i{font-style:normal;color:var(--muted)}
.rr{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:12px;align-items:center;
  padding:9px 2px;border-bottom:1px solid var(--hair)}
.rr:last-child{border-bottom:0}
.rr-n{font:400 11.5px/1 var(--mono);color:var(--faint);text-align:right}
.rr-t{min-width:0}
.rr-t button{border:0;background:none;padding:0;cursor:pointer;text-align:left;
  font:500 14.5px/1.3 var(--sans);color:var(--ink);display:block;width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr-t button:hover{color:var(--accent-ink)}
.rr-t em{display:block;font:400 10.5px/1.4 var(--mono);font-style:normal;color:var(--faint);
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr-m{font:500 13px/1 var(--mono);color:var(--muted);white-space:nowrap}
.rr-m u{text-decoration:none;color:var(--faint);font-size:10.5px}
.grade{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.grade button{border:0;background:none;cursor:pointer;color:var(--faint);
  font:400 10.5px/1 var(--mono);padding:8px 9px;letter-spacing:.02em}
.grade button+button{border-left:1px solid var(--line)}
.grade button:hover{background:var(--sunk);color:var(--ink)}
.grade button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grade button[aria-pressed="true"][data-g="3"]{background:var(--secured);color:var(--on-solid)}
.grade button[aria-pressed="true"][data-g="1"]{background:var(--mark);color:var(--on-solid)}

/* ============ THE QUEUE ============ */
.queue{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:11px;overflow:hidden}
.qi{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;
  background:var(--card);border:0;padding:15px 18px;cursor:pointer;text-align:left;
  font:inherit;color:inherit;width:100%}
.qi:hover{background:var(--accent-soft)}
.qi-n{font:500 15px/1 var(--mono);color:var(--faint)}
.qi-t{min-width:0}
.qi-t b{display:block;font:600 15.5px/1.3 var(--sans);color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi-t span{display:block;font:400 11.5px/1.5 var(--mono);color:var(--muted);margin-top:3px}
.qi-m{text-align:right;white-space:nowrap}
.qi-m b{display:block;font:500 17px/1 var(--mono);color:var(--mark)}
.qi-m span{display:block;font:400 9.5px/1 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-top:5px}
.cut{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--secured-soft);
  font:400 11.5px/1.4 var(--mono);color:var(--secured)}

/* ============ THE SCHEDULE ============ */
.sched{width:100%;border-collapse:collapse;font-size:13.5px}
.sched th{font:400 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);text-align:left;padding:0 12px 9px 0;font-weight:400}
.sched td{padding:10px 12px 10px 0;border-top:1px solid var(--hair);vertical-align:top}
.sched td.d{font:400 12px/1.4 var(--mono);color:var(--muted);white-space:nowrap}
.sched td.c{color:var(--ink);font-weight:500}
.sched td.p{font:400 11.5px/1.4 var(--mono);color:var(--faint)}

/* ============ CHAPTER PAGE ============ */
.back{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);cursor:pointer;border-radius:7px;
  font:400 11.5px/1 var(--mono);padding:8px 11px;margin-bottom:20px}
.back:hover{color:var(--accent-ink);border-color:var(--accent)}
.crumb{font:400 11.5px/1 var(--mono);color:var(--faint);margin:0 0 11px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb b{color:var(--muted);font-weight:400}
.tags{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:15px}
.tag{font:400 10.5px/1 var(--mono);letter-spacing:.04em;padding:6px 9px;border-radius:6px;
  background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.risk{background:var(--mark-soft);color:var(--mark)}
.tag.ok{background:var(--secured-soft);color:var(--secured)}
.tag.free{background:var(--accent-soft);color:var(--accent-ink)}
/* the appearance line is a sentence, not a label: it wraps */
.tag.wrap{white-space:normal;max-width:68ch;line-height:1.5}
.jump{position:sticky;top:56px;z-index:20;background:var(--paper);display:flex;gap:3px;
  overflow-x:auto;border-bottom:1px solid var(--line);margin:26px 0 0;
  padding-top:8px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{color:var(--muted);text-decoration:none;white-space:nowrap;
  font:500 12.5px/1 var(--sans);padding:11px 9px;border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:6px}
.jump a:hover{color:var(--ink)}
.jump a[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.sect{padding-top:34px;scroll-margin-top:112px}
.sect>h2{font:600 19px/1.25 var(--serif);color:var(--ink);letter-spacing:-.01em;margin:0 0 4px}
.sect>p.why{font:400 12.5px/1.5 var(--mono);color:var(--faint);margin:0 0 18px}

/* the deleted-topics warning: the one thing never charged for */
.warn{background:var(--ochre-soft);border:1px solid var(--ochre);border-radius:11px;
  padding:15px 17px;margin:22px 0 0}
.warn-h{font:400 10.5px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;
  color:var(--ochre);margin:0 0 10px}
.warn .md{font-size:14px}
.warn .md p:last-child{margin-bottom:0}

/* ============ QUESTIONS ============ */
.qlist{display:flex;flex-direction:column;gap:12px}
.qq{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.qq-h{display:flex;align-items:baseline;gap:12px;padding:15px 18px 6px}
.qq-n{font:500 12px/1.4 var(--mono);color:var(--accent-ink);flex:none}
.qq-m{margin-left:auto;font:400 10.5px/1 var(--mono);color:var(--mark);
  background:var(--mark-soft);padding:5px 8px;border-radius:5px;white-space:nowrap;flex:none}
.qq-b{padding:0 18px 6px 42px}
.qq-b .md{font-size:14.5px}
.qq-f{padding:0 18px 15px 42px}
.reveal{border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;
  font:400 11.5px/1 var(--mono);padding:9px 13px;border-radius:7px}
.reveal:hover{border-color:var(--accent);color:var(--accent-ink)}
.reveal[aria-expanded="true"]{border-color:var(--secured);color:var(--secured);
  background:var(--secured-soft)}
.sol{border-top:1px solid var(--line);background:var(--sunk);padding:16px 18px 4px 42px}
.sol-l{font:400 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--secured);margin:0 0 12px}
.sol .md{font-size:14.5px}

/* ============ MARKDOWN ============ */
.md{font-size:15px;line-height:1.68;color:var(--body);max-width:68ch}
.md>*:first-child{margin-top:0}
.md h3{font:600 17px/1.3 var(--serif);color:var(--ink);margin:30px 0 10px;
  letter-spacing:-.008em;text-wrap:balance}
.md h4{font:600 13px/1.35 var(--sans);color:var(--ink);margin:22px 0 7px}
.md h5,.md h6{font:600 12px/1.35 var(--sans);color:var(--ink);margin:18px 0 6px}
.md p{margin:0 0 13px}
.md strong{color:var(--ink);font-weight:600}
.md a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}
.md ul,.md ol{margin:0 0 14px;padding-left:21px}
.md li{margin:0 0 6px}
.md hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.md code{font:400 .88em/1.5 var(--mono);background:var(--sunk);color:var(--ink);
  padding:2px 5px;border-radius:4px;white-space:nowrap}
.md blockquote{margin:16px 0;padding:13px 16px;background:var(--accent-soft);
  border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
.md blockquote>*:last-child{margin-bottom:0}
.mdpre{margin:16px 0;background:var(--sunk);border:1px solid var(--hair);border-radius:9px;
  overflow-x:auto;max-width:68ch}
.mdpre pre{margin:0;padding:15px 17px;font:400 12.5px/1.62 var(--mono);color:var(--ink);
  white-space:pre;tab-size:2}
.tablewrap{margin:16px 0;overflow-x:auto;border:1px solid var(--line);border-radius:9px;
  max-width:68ch}
.md table{border-collapse:collapse;width:100%;font-size:13.5px}
.md th{background:var(--sunk);color:var(--ink);font:600 10.5px/1.3 var(--sans);
  letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:10px 13px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.md td{padding:10px 13px;border-bottom:1px solid var(--hair);vertical-align:top}
.md tr:last-child td{border-bottom:0}
.md td code{white-space:normal}

/* ============ THE GATE ============ */
.gate{background:var(--card);border:1px solid var(--accent);border-radius:12px;
  padding:21px 22px;max-width:68ch}
.gate-k{display:flex;align-items:center;gap:8px;font:400 10.5px/1 var(--mono);
  letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 12px}
.gate h3{font:600 18px/1.3 var(--serif);color:var(--ink);margin:0 0 9px}
.gate p{margin:0 0 12px;font-size:14px;max-width:60ch}
.gate p:last-of-type{margin-bottom:0}
.gate-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:18px}
.buy{border:0;background:var(--accent);color:var(--on-accent);font:600 13.5px/1 var(--sans);
  padding:13px 19px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.buy:hover{filter:brightness(1.08)}
.plain{border:0;background:none;color:var(--muted);font:500 12.5px/1 var(--sans);
  padding:10px 1px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.plain:hover{color:var(--accent-ink)}
.lk{flex:none;color:var(--faint);display:inline-flex}

/* ============ SEARCH + LIBRARY ============ */
.hits{display:flex;flex-direction:column;gap:9px}
.hit{display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:13px 16px;cursor:pointer;
  font:inherit;color:inherit}
.hit:hover{border-color:var(--accent)}
.hit b{display:block;font:600 14px/1.3 var(--sans);color:var(--ink)}
.hit span{display:block;font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.55}
.hit mark{background:var(--accent-soft);color:var(--accent-ink);padding:1px 2px;border-radius:2px}
.hit em{display:block;font:400 10.5px/1 var(--mono);font-style:normal;color:var(--faint);margin-top:7px}
.shelf{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(238px,1fr))}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:16px 17px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  display:flex;flex-direction:column;gap:6px}
.dcard:hover{border-color:var(--accent)}
.dcard b{font:600 14.5px/1.3 var(--sans);color:var(--ink);display:flex;
  align-items:center;justify-content:space-between;gap:9px}
.dcard span{font-size:12.5px;color:var(--muted);line-height:1.5}
.notrans{display:flex;gap:9px;align-items:flex-start;margin:0 0 18px;padding:11px 14px;
  background:var(--ochre-soft);border-radius:9px;font-size:12.5px;color:var(--ochre);max-width:68ch}

/* ============ ACCESS DIALOG ============ */
dialog.dlg{border:1px solid var(--line);border-radius:14px;background:var(--card);
  color:var(--body);padding:0;max-width:468px;width:calc(100vw - 32px);box-shadow:var(--lift);
  font:400 15px/1.6 var(--sans)}
dialog.dlg::backdrop{background:rgba(8,14,13,.55)}
.dlg-b{padding:22px}
.dlg-b h2{font:600 20px/1.25 var(--serif);color:var(--ink);margin:0 0 9px}
.dlg-b p{margin:0 0 12px;font-size:13.5px}
.dlg-b p:last-child{margin-bottom:0}
.dlg-b code{font:400 12px/1.5 var(--mono);background:var(--sunk);color:var(--ink);
  padding:3px 6px;border-radius:5px;word-break:break-all}
.keyin{width:100%;font:400 13px/1.45 var(--mono);padding:11px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);margin:6px 0 0;
  letter-spacing:.03em}
.msg{font-size:12.5px;margin:12px 0 0;line-height:1.55}
.msg.bad{color:var(--mark)}
.msg.good{color:var(--secured)}
.dlg-row{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin-top:17px}
.dlg-x{margin-left:auto}
.small{font:400 11.5px/1.55 var(--mono);color:var(--faint)}

/* ============ THE PRINT PACK ============ */
.sheet{border:1px solid var(--line);border-radius:11px;padding:18px 20px;margin:0 0 13px;
  background:var(--card);break-inside:avoid}
.sheet-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 0 12px;
  padding-bottom:10px;border-bottom:1px solid var(--hair)}
.sheet-h b{font:600 16px/1.3 var(--serif);color:var(--ink)}
.sheet-h span{font:400 11px/1 var(--mono);color:var(--faint)}
@media print{
  .bar,.ledger,.jump,.back,.noprint{display:none!important}
  .frame{display:block;max-width:none}
  .stage{padding:0!important}
  body{background:#fff;color:#000}
  .sheet{border:0;border-radius:0;padding:0;margin:0;background:none;break-after:page}
  .sheet:last-child{break-after:auto}
  .md a{text-decoration:none;color:#000}
}

/* ============ RESPONSIVE ============ */
@media (max-width:980px){
  .frame{grid-template-columns:minmax(0,1fr)}
  /* the margin becomes a strip: the totals still lead, they just lie down */
  .ledger{position:static;border-right:0;border-bottom:1px solid var(--line);
    padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
    gap:4px 22px;align-items:end}
  .ledger .led-k{grid-column:1/-1;margin:0}
  .ledger .led-bar{grid-column:1/-1;margin:6px 0 2px}
  .ledger .led-note,.ledger .led-cta{grid-column:1/-1}
  .led-row{border-bottom:0;padding:4px 0;display:block}
  .led-row b{display:block}
  .led-row.big b{font-size:23px}
  .led-field{margin-top:8px}
  .stage{padding:26px 20px 80px}
  .find{max-width:none}
  .bar{gap:10px;padding:0 16px}
}
@media (max-width:720px){
  .bar{height:auto;flex-wrap:wrap;padding:10px 16px;gap:9px}
  .find{order:3;flex-basis:100%}
  .bar-r{order:2}
  .jump{top:0}
  .sect{scroll-margin-top:70px}
}
@media (max-width:520px){
  .stage{padding:22px 16px 70px}
  .rr{grid-template-columns:22px minmax(0,1fr);gap:8px}
  .rr-m{grid-column:2;font-size:11.5px}
  .rr .grade{grid-column:2;justify-self:start}
  .qq-b,.qq-f,.sol{padding-left:18px}
  .brand span{display:none}
}

<script>
const DATA = {"chapters":[{"id":"m1","subj":"maths","num":1,"title":"Relations and Functions","unit":"Unit I · Relations & Functions","unitMarks":8,"prio":2,"appear":"Unit I (8 marks, shared with Ch 2) · Typical appearance: one 1-mark MCQ + one 2/3-mark relation question, occasionally a 5-mark one-one/onto proof","deleted":"- Composition of functions (g∘f)\n- Invertible functions and f⁻¹\n- Binary operations\n\n> **Why this matters.** Pre-2023 papers and most YouTube playlists spend half this chapter on\n> composition and inverses. All of it is out. If you find yourself computing g∘f, you are on an old\n> paper.","intro":"A **relation** is nothing more than a rule that pairs things up. \"Is a sibling of\" is a relation on\nthe set of people. \"Is less than\" is a relation on numbers. That is the whole definition — a\ncollection of ordered pairs. The chapter's difficulty is not the idea; it is that three particular\nproperties of relations have names that sound alike, so let us pin them down with the sibling\nexample.\n\n**Reflexive** means everything is related to itself. Is \"is a sibling of\" reflexive? Are you your\nown sibling? No. So it fails. **Symmetric** means whenever a is related to b, b is related back to a.\nIf you are my sibling, am I yours? Yes. So it passes. **Transitive** means if a relates to b and b\nrelates to c, then a relates to c. If Ravi is Sita's sibling and Sita is Meera's sibling, is Ravi\nMeera's sibling? Yes. Passes.\n\nCompare with \"is the father of\": not reflexive, not symmetric (obviously), and not transitive\neither — your father's father is your grandfather, not your father. And with \"has the same birthday\nas\": reflexive, symmetric *and* transitive.\n\nThat last kind, which passes all three, is an **equivalence relation**, and it is the one worth\nunderstanding properly because it does something useful. An equivalence relation always chops the\nset into non-overlapping groups. \"Same birthday\" splits humanity into 366 groups. \"Same remainder\nwhen divided by 3\" splits the integers into three. Nobody is left out, nobody is in two groups at\nonce. Those groups are **equivalence classes**, and being able to say what the classes *are* is the\nusual 3-mark question.\n\nHalf the marks in this chapter come from checking those three properties on a given relation, and\nthe reliable method is: for each property, either prove it in general or produce one counterexample.\nOne counterexample is a complete answer — you do not need to explain further. Most lost marks come\nfrom asserting \"not transitive\" without naming the offending triple.\n\nNow **functions**. A function is a relation with one extra restriction: every input gets exactly one\noutput. A vending machine is a function — press B4 and you always get the same thing. Two words\ndescribe how a function fills its target set. **One-one** (injective) means no two different inputs\nshare an output — nothing is hit twice. **Onto** (surjective) means nothing in the target is missed —\neverything is hit at least once. A function that is both is a **bijection**, and a bijection is\nexactly a perfect pairing, which is why it is the condition for having an inverse: if two inputs gave\nthe same output you would not know which to go back to, and if something was never hit you would\nhave nothing to go back from.\n\nThe picture to keep is arrows from a left-hand set to a right-hand set. One-one means no two arrows\nland on the same dot. Onto means no dot on the right is left bare. Draw that once and you will never\nconfuse the two again.\n\nThe practical test for one-one on real functions is either algebra — assume f(a) = f(b) and show\na = b — or calculus: a function that is always increasing (f′ > 0 throughout) cannot repeat a value,\nso it is one-one. That second route is quick and underused. For onto, compare the actual range with\nthe stated codomain; a function is onto only if they are equal, which is why f(x) = x² from ℝ to ℝ\nis not onto (it never produces a negative) but is onto if you declare the codomain to be [0, ∞).\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: relations and functions class 12 maths one shot](https://www.youtube.com/results?search_query=relations+and+functions+class+12+maths+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: relations and functions](https://www.khanacademy.org/search?page_search_query=relations%20and%20functions%20class%2012)\n- **The book the paper is set from** — [NCERT Maths Part I, Chapter 1 (PDF)](https://ncert.nic.in/textbook/pdf/lemh101.pdf)\n- **For extra problems** — NCERT Exemplar Chapter 1, and RD Sharma's chapter on relations for drill\n  on checking the three properties. The board asks these almost verbatim from the NCERT exercises,\n  so finish those first.","s":{"scope":"### In the syllabus\n\n- Types of relations: **reflexive, symmetric, transitive** and **equivalence** relations\n- **One-one (injective)** and **onto (surjective)** functions\n\nThat is the whole chapter. It is short."},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.brief","tr.hi.pyq","tr.hi.recall","tr.hi.sol","tr.hi.test","tr.hi.tips"]},{"id":"m2","subj":"maths","num":2,"title":"Inverse Trigonometric Functions","unit":"Unit I · Relations & Functions","unitMarks":8,"prio":3,"appear":"Unit I (8 marks, shared with Ch 1) · Typical appearance: one or two 1-mark MCQs, occasionally a 2-mark evaluation. Rarely more.","deleted":"- **Graphs** of inverse trigonometric functions\n- **Elementary properties** — the identity set: sin⁻¹x + cos⁻¹x = π/2, tan⁻¹x + tan⁻¹y = tan⁻¹((x+y)/(1−xy)),\n  2 tan⁻¹x = tan⁻¹(2x/(1−x²)) = sin⁻¹(2x/(1+x²)), and the rest\n\n> **Read this carefully.** Almost everything students think of as \"the inverse trig chapter\" — the\n> long identity-chaining problems — is deleted. Do not spend a week here. Spend two days, learn the\n> six domain–range pairs cold, and move to Calculus.\n>\n> One caveat: the complementary identity **sin⁻¹x + cos⁻¹x = π/2** is one line, occasionally still\n> turns up in an MCQ as a shortcut, and costs nothing to remember. Know it. Don't study the rest.","intro":"sin 30° = ½. So what angle has a sine of ½? Answer: 30°. That reverse question is all an inverse\ntrigonometric function is — sin⁻¹(½) = 30°, or π/6 in radians. The notation is unfortunate: sin⁻¹\ndoes **not** mean 1/sin. It means \"the angle whose sine is\".\n\nBut there is a genuine problem hiding in that innocent question, and the whole chapter exists to\nsolve it. What angle has a sine of ½? Also 150°. And 390°. And 510°. Infinitely many. A function is\nnot allowed to give many answers to one question, so as it stands sin⁻¹ is not a function at all.\n\nThe fix is to choose, once and for all, one answer to hand back. For sine we agree to always return\nthe angle in **[−π/2, π/2]** — so sin⁻¹(½) = π/6, full stop, and sin⁻¹(−½) = −π/6, not 330°. That\nagreed range is the **principal value branch**, and each inverse function has its own:\n\n- sin⁻¹ returns an angle in [−π/2, π/2]\n- cos⁻¹ returns an angle in [0, π]\n- tan⁻¹ returns an angle in (−π/2, π/2)\n\nWhy are they different? Because the range has to be a stretch on which the original function does\nnot repeat itself, and cosine's natural such stretch runs from 0 to π while sine's straddles zero.\nNote the practical consequence, which is the chapter's single biggest source of lost marks:\n**cos⁻¹ never returns a negative angle.** So cos⁻¹(−½) is 2π/3, not −π/3. Sine and tangent will give\nyou negatives; cosine will not.\n\nGet that one point secure and most of the chapter's questions become mechanical. The typical\none-marker is \"find the principal value of sin⁻¹(−1/√2)\", and the method is always the same three\nsteps: find the reference angle whose sine is 1/√2 (that is π/4), decide the sign, then place the\nanswer inside the correct branch. For sine, negative input means a negative answer, so −π/4. Had it\nbeen cos⁻¹(−1/√2), the answer would have to live in [0, π], giving 3π/4.\n\nTwo identities are worth knowing cold because they appear constantly:\nsin⁻¹x + cos⁻¹x = π/2, and tan⁻¹x + cot⁻¹x = π/2. Both say the same geometric thing — in a right\ntriangle the two non-right angles add to a right angle.\n\nThe other reliable technique is **substitution**, and it turns ugly expressions into easy ones. Faced\nwith something containing √(1 − x²), put x = sin θ; the root becomes cos θ and the whole expression\nusually collapses. With 1 + x², put x = tan θ. This is the standard route through the harder\n3-markers, and it is the same trick you will use again in Integrals.\n\nA caution on scope: this chapter used to include a long list of addition formulae for\ntan⁻¹x + tan⁻¹y and similar. Much of that has been trimmed. Check §1 of this chapter before\nmemorising formulae you may not need — the examinable core is principal values, the domain and range\nof each function, the two complementary identities, and simple substitutions.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: inverse trigonometric functions class 12 one shot](https://www.youtube.com/results?search_query=inverse+trigonometric+functions+class+12+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: inverse trigonometric functions](https://www.khanacademy.org/search?page_search_query=inverse%20trigonometric%20functions)\n- **The book the paper is set from** — [NCERT Maths Part I, Chapter 2 (PDF)](https://ncert.nic.in/textbook/pdf/lemh102.pdf)\n- **For extra problems** — the NCERT exercises are unusually representative here; do every one,\n  then NCERT Exemplar Chapter 2 for the substitution-based questions.","s":{"scope":"### In the syllabus\n\n- **Definition, domain, range** of the six inverse trigonometric functions\n- **Principal value branches**\n\nThat is all. This is now the smallest chapter in the book."},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"m3","subj":"maths","num":3,"title":"Matrices","unit":"Unit II · Algebra","unitMarks":10,"prio":2,"appear":"Unit II (10 marks, shared with Ch 4) · Typical appearance: 1–2 MCQs + one 2- or 3-mark question. The heavy 5-marker for this unit lives in Ch 4.","deleted":"- Concept of **elementary row and column operations**\n- **Inverse of a matrix by elementary operations**\n- Existence of non-zero matrices whose product is the zero matrix (as a stated topic)\n- Invertible matrices and the **proof of uniqueness of the inverse**\n\n> **Consequence.** Finding A⁻¹ now happens **only** via the adjoint method, which lives in\n> [Ch 4 Determinants](04-determinants.md). If a practice question says \"find the inverse using\n> elementary row transformations\", skip it — it is out of syllabus.","intro":"A **matrix** is a table of numbers, and the reason mathematics bothers with it is that a lot of\nreal problems arrive already shaped like a table. Three shops, four products, the quantity of each:\nthat is a 3 × 4 matrix. Write the prices as a 4 × 1 matrix and one multiplication gives you each\nshop's total bill. The tables are not a new kind of number — they are a way of handling many numbers\nat once with one set of rules.\n\nGetting the **order** right is the foundation: rows first, then columns. A 3 × 4 matrix has three\nrows and four columns, and the entry a₂₃ sits in row 2, column 3. Say \"row, column\" out loud every\ntime until it is automatic; a large fraction of avoidable errors in this chapter are transposition\nslips.\n\nAddition is easy and boring: add matching entries, and it only works if the two matrices are the\nsame shape. Multiplying by a plain number is equally easy: every entry gets multiplied.\n\n**Multiplying two matrices** is where the chapter actually begins, and it is nobody's first guess.\nYou do *not* multiply matching entries. Instead, to get the entry in row i and column j of the\nanswer, you take row i of the first matrix and column j of the second, multiply them term by term,\nand add. Which means the row and the column must be the same length — so **AB only exists when the\ncolumns of A equal the rows of B**, and the answer has A's rows and B's columns. Check that before\nyou compute anything.\n\nThis definition looks arbitrary until you see what it is for: a matrix is really a *transformation*,\nan instruction like \"rotate by 30° and stretch by 2\", and multiplying matrices means doing one\ntransformation after the other. That is why the rule combines rows with columns, and it is also why\n**AB ≠ BA in general**. Rotating then stretching is not the same as stretching then rotating. This\nis the property that most distinguishes matrices from ordinary numbers, and questions probing it are\ncommon. Two related surprises follow: AB can be the zero matrix without either A or B being zero,\nand you cannot cancel — AB = AC does not give B = C.\n\nThe **transpose**, written A′ or Aᵗ, flips the matrix about its diagonal, turning rows into columns.\nTwo special cases matter. A **symmetric** matrix is unchanged by the flip (A′ = A), so it is a mirror\nimage about the diagonal. A **skew-symmetric** matrix flips to its own negative (A′ = −A), which\nforces every diagonal entry to be zero — because each must equal minus itself. That last deduction\nis a favourite one-marker. The one rule to memorise carefully is (AB)′ = B′A′: the order reverses.\n\nTwo results generate a large share of the marks in this chapter and are worth knowing as facts. Any\nsquare matrix splits uniquely into a symmetric part and a skew-symmetric part, ½(A + A′) + ½(A − A′)\n— check for yourself that the first is symmetric and the second skew. And the **elementary row\noperations** route to an inverse: write A alongside the identity matrix, and whatever you do to A to\nturn it into the identity, do to the identity as well; what it becomes is A⁻¹.\n\nTwo habits will save you more marks than any formula. Write the order of every matrix above it as\nyou work, so an impossible product is caught before you waste five minutes on it. And when a\nquestion gives you a relation like A² = A or A² = I, try substituting rather than computing — that is\nalmost always the intended short route.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: matrices class 12 maths one shot](https://www.youtube.com/results?search_query=matrices+class+12+maths+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: matrices](https://www.khanacademy.org/math/precalculus/x9e81a4f98389efdf:matrices)\n- **The book the paper is set from** — [NCERT Maths Part I, Chapter 3 (PDF)](https://ncert.nic.in/textbook/pdf/lemh103.pdf)\n- **For extra problems** — NCERT Exemplar Chapter 3, then RD Sharma for volume on the\n  symmetric/skew-symmetric decomposition and elementary operations, which reward drill.","s":{"scope":"### In the syllabus\n\n- Concept, notation, **order**, equality of matrices\n- **Types**: row, column, square, diagonal, scalar, identity, zero\n- **Transpose**; **symmetric** and **skew-symmetric** matrices\n- **Operations**: addition, scalar multiplication, matrix multiplication\n- Properties of these operations; **non-commutativity** of matrix multiplication"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"m4","subj":"maths","num":4,"title":"Determinants","unit":"Unit II · Algebra","unitMarks":10,"prio":1,"appear":"Unit II (10 marks, shared with Ch 3) · Typical appearance: the unit's 5-mark question lives here (solving three equations by matrix method) plus 1–2 MCQs. The single most reliable 5-marker in the paper.","deleted":"- **Properties of determinants** — the whole \"evaluate this determinant using row/column operations\n  and prove it equals (a−b)(b−c)(c−a)\" family\n\n> **Consequence.** Determinants are now something you *compute*, not something you *manipulate*.\n> The long property-based proofs that used to be a guaranteed 5-marker are gone, and their weight\n> moved to the matrix method for solving equations. Don't spend time on `R₁ → R₁ + R₂` gymnastics.","intro":"Every square matrix has one number you can compute from it that tells you something essential, and\nthat number is the **determinant**. Here is what it actually means, because knowing this makes the\nwhole chapter cohere.\n\nA 2 × 2 matrix takes the unit square and turns it into a parallelogram. The determinant is the\n**area** of that parallelogram. A 3 × 3 matrix turns the unit cube into a slanted box, and the\ndeterminant is its **volume**. So a determinant measures how much a matrix stretches space.\n\nWhich immediately explains the one fact everything else hangs on: **det A = 0 means the matrix\nsquashes space flat.** The parallelogram has collapsed to a line, the box to a plane. And once\nsomething has been flattened you cannot un-flatten it — information is gone for good. That is why a\nmatrix with zero determinant has no inverse, and why a system of equations whose determinant is zero\ndoes not have a unique solution. Not a rule to memorise: a consequence of collapse.\n\nPractically, you expand a 3 × 3 determinant along a row or column using **cofactors** — each entry\ntimes the smaller 2 × 2 determinant left when you delete its row and column, with signs alternating\n+ − + in a checkerboard. Two pieces of advice that pay off immediately: expand along whichever row or\ncolumn has the most zeros, since each zero kills a whole term; and remember you are free to add a\nmultiple of one row to another without changing the value, which lets you manufacture those zeros\nbefore you start. Students who expand blindly along the first row every time do three times the\narithmetic and make three times the slips.\n\nThe **adjoint** is the matrix of cofactors, transposed, and its point is the identity\nA · adj A = |A| I. Divide through and you have the inverse: **A⁻¹ = adj A / |A|**, which is why the\ninverse exists exactly when |A| ≠ 0. In the transpose step lies the most common error in this\nchapter — computing the cofactor matrix and forgetting to flip it.\n\nThe determinant also gives you **area of a triangle** from its three vertices, as half the\ndeterminant of a 3 × 3 array of their coordinates. And because a triangle with zero area is three\npoints on a straight line, the same determinant set to zero is the **collinearity** test. That is a\nrecurring one-marker and it is the area interpretation doing the work again.\n\nThe chapter's payoff is solving simultaneous equations. **Cramer's rule** gives each unknown as a\nratio of determinants, and the **matrix method** writes the system as AX = B and solves it as\nX = A⁻¹B. The board strongly prefers the matrix method — its 5-mark question is usually \"solve these\nthree equations using matrices\", and it wants to see |A| computed, then adj A, then A⁻¹, then the\nmultiplication. Show all four stages; the marks are distributed across them, so a correct final\nanswer with the working skipped scores badly.\n\nThe consistency analysis is worth getting straight as a decision tree, because it is short and often\nasked. If |A| ≠ 0 there is exactly one solution. If |A| = 0, look at (adj A)B: if it is not the zero\nmatrix the system is **inconsistent** — no solution at all, the planes miss each other. If it is\nzero, the system is consistent with **infinitely many** solutions — the planes meet in a line. Two\nsentences, three cases, and full marks.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: determinants class 12 maths one shot](https://www.youtube.com/results?search_query=determinants+class+12+maths+one+shot)\n- **Why a determinant is an area** — [search: essence of linear algebra determinant 3Blue1Brown](https://www.youtube.com/results?search_query=3blue1brown+essence+of+linear+algebra+determinant).\n  Fifteen minutes here will make this chapter feel like one idea instead of ten formulae.\n- **The book the paper is set from** — [NCERT Maths Part I, Chapter 4 (PDF)](https://ncert.nic.in/textbook/pdf/lemh104.pdf)\n- **For extra problems** — NCERT Exemplar Chapter 4; then drill the 5-mark system-of-equations type\n  until the four stages are automatic, because it is nearly guaranteed to appear.","s":{"scope":"### In the syllabus\n\n- Determinant of a square matrix, **up to 3 × 3**\n- **Minors** and **cofactors**\n- Application of determinants to the **area of a triangle**\n- **Adjoint** and **inverse** of a square matrix\n- **Consistency, inconsistency** and number of solutions of a system of linear equations\n- **Solving a system of linear equations in two or three variables (unique solution) using the\n  inverse of a matrix**"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"m5","subj":"maths","num":5,"title":"Continuity and Differentiability","unit":"Unit III · Calculus","unitMarks":35,"prio":1,"appear":"Unit III Calculus (35 marks) · Typical appearance: 1–2 MCQs + a 2-mark continuity question + a 3-mark differentiation question, and often a 5-mark second-order-derivative relation. Expect 6–9 marks from this chapter alone.","deleted":"- **Rolle's theorem** and **Lagrange's Mean Value Theorem**, and their geometric interpretation\n\n> **Consequence.** This chapter is now purely mechanical. There is no theorem to state, no\n> hypothesis to verify — only procedures to execute correctly. That makes it one of the most\n> completely learnable chapters in the paper: every question is a technique, and there are only\n> seven techniques.","intro":"**Continuity** is the mathematical version of \"you can draw it without lifting your pen.\" That is\ngenuinely all it means. A function is continuous at a point if there is no jump, no hole and no\nsudden flight off to infinity there.\n\nTo make that precise you check three things at the point in question: what value the function\nactually takes there, and what it *approaches* from the left, and from the right. If all three agree,\nthe graph passes through smoothly and the function is continuous. If the left and right approaches\ndisagree, there is a jump. If they agree with each other but not with the function's value, there is\na hole with a stray dot beside it. That is the whole test, and it is why every continuity question in\nthe paper looks the same: compute the left-hand limit, the right-hand limit and the value, then set\nthem equal. When a question says \"find k such that f is continuous\", it is asking you to do exactly\nthat and solve for k.\n\n**Differentiability** is a stronger demand: not just no break, but no **corner**. The derivative is\nthe slope of the graph, so for it to exist at a point the graph must have one definite slope there.\nThink of |x| at zero: perfectly continuous — you can draw it without lifting the pen — but it\narrives at a sharp V. Coming from the left the slope is −1, from the right it is +1, so there is no\nsingle slope and the function is not differentiable there. This gives the chapter's most important\none-way street: **differentiable implies continuous, but continuous does not imply\ndifferentiable**, and |x| at x = 0 is the counterexample to quote. Every year, some form of this is\nasked.\n\nThe rest of the chapter is machinery for computing derivatives, and it is worth seeing what each\nrule is *for* rather than as a separate spell.\n\nThe **chain rule** handles a function inside a function. Differentiate the outside, then multiply by\nthe derivative of the inside. sin(x²) becomes cos(x²) × 2x. If you are ever unsure whether you have\nfinished differentiating, ask whether anything is still nested; the commonest error in the whole\nchapter is stopping one layer early.\n\n**Implicit differentiation** is for equations you cannot untangle, like x² + y³ = xy. You do not\nneed to solve for y. Differentiate every term with respect to x, remembering that y is secretly a\nfunction of x, so anything with a y in it produces a dy/dx by the chain rule. Then collect the dy/dx\nterms and divide. That is the entire technique.\n\n**Logarithmic differentiation** is the tool for towers and products — x^x, or (sin x)^(cos x), or a\nlong product of factors. Take the log of both sides first, which turns powers into multipliers and\nproducts into sums, and only then differentiate. Without it, x^x is essentially intractable; with\nit, three lines.\n\n**Parametric** differentiation is for curves given as x = f(t), y = g(t): find dy/dt and dx/dt\nseparately, then divide. And for a **second** derivative of a parametric curve, remember you must\ndifferentiate dy/dx with respect to t and then divide by dx/dt again — forgetting that last division\nis the single most frequent slip in this chapter's 3-markers.\n\n**Rolle's** and the **Mean Value Theorem** are the odd ones out — existence statements rather than\ncomputations. The MVT says that over any interval, at some point in between, the instantaneous slope\nmust equal the average slope. If you averaged 60 km/h over an hour, then at some instant your\nspeedometer read exactly 60. Rolle's theorem is the special case where you finish where you started,\nso the average slope is zero, so somewhere the tangent is flat. Both questions are marked mostly on\nwhether you *verified the conditions* — continuity on the closed interval, differentiability on the\nopen one — before applying the conclusion. State them explicitly.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: continuity and differentiability class 12 one shot](https://www.youtube.com/results?search_query=continuity+and+differentiability+class+12+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: limits and continuity](https://www.khanacademy.org/math/differential-calculus/dc-limits)\n- **The book the paper is set from** — [NCERT Maths Part I, Chapter 5 (PDF)](https://ncert.nic.in/textbook/pdf/lemh105.pdf)\n- **For extra problems** — NCERT Exemplar Chapter 5 for the piecewise-continuity type, and RD Sharma\n  for volume on logarithmic and parametric differentiation, which reward sheer repetition.","s":{"scope":"### In the syllabus\n\n- **Continuity** and **differentiability**\n- **Chain rule**\n- Derivatives of **inverse trigonometric functions** — sin⁻¹x, cos⁻¹x, tan⁻¹x\n- Derivatives of **implicit functions**\n- Concept of exponential and logarithmic functions; derivatives of **log and exponential** functions\n- **Logarithmic differentiation**\n- Derivatives of functions in **parametric form**\n- **Second-order derivatives**"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"m6","subj":"maths","num":6,"title":"Application of Derivatives","unit":"Unit III · Calculus","unitMarks":35,"prio":1,"appear":"Unit III Calculus (35 marks) · Typical appearance: one 3-mark monotonicity question + one 4- or 5-mark optimisation problem (very often the Section-E case study). Expect 6–9 marks.","deleted":"- **Tangents and normals** — equations of tangent/normal, angle between curves\n- **Approximations** — using dy to estimate small changes\n\n> **Consequence.** The chapter reduced to exactly **two** question types: *find where the function\n> increases/decreases*, and *optimise something*. That concentration makes it very high-return.\n> Two techniques, ~7 marks.","intro":"You now know how to find a derivative. This chapter is about what a derivative is *good for*, and\nthe answer is: it tells you the rate at which something is changing, and where it stops changing.\nThose two facts cover every question in the chapter.\n\n**Rate of change** is the direct reading. dy/dx means \"how fast y changes per unit change in x\". If\na balloon's radius is growing at 2 cm/s, how fast is its volume growing? Volume depends on radius,\nradius depends on time, so chain them: dV/dt = (dV/dr) × (dr/dt). Every related-rates question is\nthat chain, and the method never varies — write down what you are given as a rate, write down the\nformula connecting the quantities, differentiate it with respect to time, substitute. The one\nhabit that prevents most errors is writing the units next to each rate as you go; if the units of\nyour answer are wrong, the chain is wrong.\n\n**Increasing and decreasing** is the sign of the derivative, and it is worth seeing physically. If\nthe slope is positive the graph is heading uphill as you move right, so the function is increasing;\nnegative slope, downhill, decreasing. So to find where a function increases: differentiate, find\nwhere the derivative is zero (these are the boundary points), and test the sign of the derivative in\neach interval between them. Present the answer as intervals, and be careful to test the sign rather\nthan guess it — a factor like (x − 2)² is never negative, so it does not cause a sign change at all,\nand missing that is a classic trap.\n\n**Maxima and minima** is the chapter's heart and the source of its 5-mark question. At the top of a\nhill the ground is momentarily level; likewise at the bottom of a valley. So both maxima and minima\noccur where f′(x) = 0, which is why finding those points is only half the job — you then have to\ndecide which kind you have. Two ways: check whether the derivative changes from positive to negative\n(a maximum, since you were going up and now go down) or negative to positive (a minimum); or use the\nsecond derivative, where f″ < 0 means the curve bends downwards, hence a maximum, and f″ > 0 means it\nbends upwards, hence a minimum. The second-derivative test is faster but says nothing when f″ = 0,\nin which case fall back to the sign change.\n\nOne thing catches people out every year: on a **closed interval** the largest value need not occur\nwhere the slope is zero. It can occur at an endpoint — imagine a hill that is still climbing when\nthe road ends. So for absolute maximum and minimum on [a, b], evaluate f at every critical point\n*and* at both endpoints, and compare the list. Forgetting the endpoints is a guaranteed lost mark.\n\nThe **word problems** are where the marks actually are, and they are all one procedure. Something is\nto be made as large or as small as possible — the volume of an open box cut from a sheet, the area of\na rectangle inscribed in a circle, the cost of a cylindrical can holding a fixed volume. Introduce a\nvariable, write the quantity to be optimised in terms of it, use the constraint given in the problem\nto eliminate every other variable so you have a function of *one* variable, then differentiate and\ntest. That elimination step is where the thinking lives; the calculus afterwards is routine.\nPractise it on the standard shapes — cone in a sphere, cylinder in a cone, box from a sheet, window\nof fixed perimeter — because the board recycles them.\n\nTwo things you can safely deprioritise: **approximations** using differentials, and much of the old\ntangents-and-normals material, have been trimmed in the rationalised syllabus. Check §1 of this\nchapter before spending time on them.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: application of derivatives class 12 one shot](https://www.youtube.com/results?search_query=application+of+derivatives+class+12+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: applications of derivatives](https://www.khanacademy.org/math/differential-calculus/dc-context-app)\n- **The book the paper is set from** — [NCERT Maths Part I, Chapter 6 (PDF)](https://ncert.nic.in/textbook/pdf/lemh106.pdf)\n- **For extra problems** — the NCERT's own maxima–minima exercise and its miscellaneous exercise are\n  the closest thing to a list of the board's favourite word problems; work every one before moving to\n  the Exemplar.","s":{"scope":"### In the syllabus\n\n- **Rate of change** of quantities\n- **Increasing and decreasing** functions\n- **Maxima and minima** — first derivative test (motivated geometrically) and second derivative test\n- Simple problems illustrating basic principles and real-life situations"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"m7","subj":"maths","num":7,"title":"Integrals","unit":"Unit III · Calculus","unitMarks":35,"prio":1,"appear":"Unit III Calculus (35 marks) · The single largest source of marks in the paper: typically 8–12 marks across one 5-marker, one or two 3-markers and 1–2 MCQs. Give this chapter more time than any other in Mathematics.","deleted":"- **Definite integral as a limit of a sum** (the Σ-with-limits definition and its problems)\n- ∫√(ax² + bx + c) dx and ∫(px + q)√(ax² + bx + c) dx\n\n> **Good news.** The limit-of-a-sum questions were the most unpleasant thing in this chapter and they\n> are gone. What remains is a set of techniques, each with a clear trigger.","intro":"Integration is differentiation run backwards, and it is worth being blunt about the consequence:\ndifferentiation is a procedure, integration is a search. To differentiate x⁵ you apply a rule and\nyou are done. To integrate something you have to *recognise* what it could be the derivative of.\nThat is why this chapter is the biggest in the book, why it carries the most marks, and why the only\nroute through it is doing problems rather than reading them.\n\nThere are two distinct things called integration, and confusing them causes a lot of unnecessary\nsuffering.\n\nThe **indefinite integral** is the antiderivative: ∫2x dx = x² + C. The answer is a *function*. The\n+C is there because differentiating x² + 7 also gives 2x, so there is a whole family of answers\ndiffering by a constant. Dropping the +C is the most common single mark lost in the entire paper.\n\nThe **definite integral** ∫ₐᵇ f(x) dx is a *number*, and it means the area under the graph between\na and b. The astonishing fact linking the two — the Fundamental Theorem of Calculus — is that you\ncan find that area by antidifferentiating and subtracting: F(b) − F(a). Areas and slopes look\nunrelated, and the discovery that they are inverse operations is what made calculus the most\npowerful tool in mathematics.\n\nThe rest of the chapter is a toolkit, and knowing *which tool a problem calls for* matters more than\nknowing any one of them. Here is how to tell.\n\n**Substitution** is the chain rule reversed. Look for a chunk whose derivative is also sitting in\nthe integrand — if you can see f(g(x)) and g′(x) together, put u = g(x) and the integral collapses.\n∫2x·cos(x²) dx works because 2x is the derivative of x². This is the first thing to try, always.\n\n**Integration by parts** is for a *product* of two unlike things — a polynomial times a\ntrigonometric function, or anything times a logarithm. ∫u dv = uv − ∫v du. The whole art is choosing\nwhich factor to call u, and the guide is **ILATE**: Inverse trig, Logarithm, Algebraic,\nTrigonometric, Exponential — whichever appears first in that list becomes u. The reason is that u\ngets differentiated, and you want the factor that gets *simpler* when differentiated. A logarithm\nbecomes 1/x; a polynomial loses a degree; an exponential never simplifies, so it should be the other\none.\n\n**Partial fractions** is for a ratio of polynomials. Split the fraction into simpler pieces whose\ndenominators are the factors, and integrate each — usually into logarithms. Mechanical once set up;\nthe setup depends on the factors being linear, repeated or quadratic, and it is worth learning the\nthree shapes.\n\n**Special forms** are the ones to recognise on sight, because they will not yield to anything else:\nanything with 1/(x² + a²), 1/(x² − a²), 1/√(a² − x²) and their relatives. There are about eight of\nthem, they are in the formula sheet, and they are non-negotiable memorisation. A trigonometric\nsubstitution derives them, but in an exam you want them instantly.\n\nFinally, the **properties of definite integrals** are the chapter's hidden shortcut, and strong\ncandidates are separated from average ones by whether they use them. The most valuable is\n∫₀ᵃ f(x) dx = ∫₀ᵃ f(a − x) dx: replacing x by a − x often turns an impossible integrand into one\nthat cancels against the original, and a whole class of 3- and 5-markers is designed around it. The\neven/odd property — ∫₋ₐᵃ of an odd function is zero — can reduce a page of work to one line. Learn to\n*look* for these before you start grinding.\n\nDo not try to shortcut this chapter. Thirty problems a week for a month is the honest cost, and it\nis repaid: Integrals plus Application of Integrals plus Differential Equations is around a quarter\nof the paper.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: integrals class 12 maths one shot](https://www.youtube.com/results?search_query=integrals+class+12+maths+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: integrals](https://www.khanacademy.org/math/integral-calculus/ic-integration)\n- **Why area and slope are inverse** — [search: essence of calculus integration fundamental theorem 3Blue1Brown](https://www.youtube.com/results?search_query=3blue1brown+essence+of+calculus+integration+fundamental+theorem)\n- **The book the paper is set from** — [NCERT Maths Part II, Chapter 7 (PDF)](https://ncert.nic.in/textbook/pdf/lemh201.pdf)\n- **For extra problems** — NCERT first, all exercises, then RD Sharma for volume. This is the one\n  chapter where sheer number of problems attempted is the single best predictor of your mark.","s":{"scope":"### In the syllabus\n\n- Integration as the **inverse process of differentiation**\n- Integration by **substitution**, by **partial fractions**, by **parts**\n- Evaluation of integrals of these standard types:\n\n```\n∫ dx/(x² ± a²)          ∫ dx/√(x² ± a²)          ∫ dx/√(a² − x²)\n∫ dx/(ax² + bx + c)     ∫ dx/√(ax² + bx + c)\n∫ (px + q)dx/(ax² + bx + c)      ∫ (px + q)dx/√(ax² + bx + c)\n∫ √(a² ± x²) dx         ∫ √(x² − a²) dx\n```\n\n- **Fundamental Theorem of Calculus** (without proof)\n- **Properties of definite integrals** and their use in evaluation"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"m8","subj":"maths","num":8,"title":"Application of Integrals","unit":"Unit III · Calculus","unitMarks":35,"prio":2,"appear":"Unit III Calculus (35 marks) · Typical appearance: usually one full 5-mark question, occasionally a 3-marker instead. A small chapter with a large per-question payoff.","deleted":"- **Area between two arbitrary curves** (the general \"region between y = f(x) and y = g(x)\" family)\n\n> **A note on scope, honestly stated.** The syllabus wording (\"area under simple curves, especially\n> lines, circles/parabolas/ellipses in standard form only\") is narrower than the old one, and the\n> general two-curve topic is out. But questions bounded by *a standard curve and a line* have\n> continued to appear, because a line is one of the named curves. So:\n> **prepare the curve-plus-line and curve-plus-axes cases fully; skip the general two-conic case.**\n> Check the current year's sample paper to confirm.","intro":"You know that a definite integral gives the area under a curve. This short chapter is that one fact,\napplied carefully. It is the easiest marks in the calculus block, and it is where the most marks are\nthrown away on avoidable errors.\n\nThe basic move: the area between the curve y = f(x), the x-axis, and the vertical lines x = a and\nx = b is ∫ₐᵇ f(x) dx. Sometimes it is more convenient to integrate the other way round —\n∫ f(y) dy between two horizontal lines — and knowing which to choose is half the skill. Choose the\none that makes the boundary a single clean function.\n\nThree things go wrong, and all three are avoidable.\n\n**First, sketch the region.** Always, even when the question does not ask for a diagram. Without a\nsketch you cannot see which curve is on top, you cannot see whether the region is in two pieces, and\nyou will not notice that the curves cross inside your interval. The sketch takes ninety seconds and\nit is the difference between a full-mark answer and a plausible wrong one. Examiners also award marks\nfor it.\n\n**Second, area is never negative.** Below the x-axis the integral comes out negative, because\nf(x) is negative there. The integral is telling the truth — it is *signed* area — but the question\nasked for area, so you must take the modulus. If a region straddles the axis, split the integral at\nthe crossing point and add the absolute values of the two pieces. Do not integrate straight across\nand hand in a small number: the parts cancelled and your answer is meaningless. This is the\nchapter's classic trap, and it is worth writing \"region below axis, taking modulus\" in your working\nso the examiner sees you knew.\n\n**Third, get the limits from the curves, not from the question.** For the area *between* two curves\nthe limits are where they intersect, so you solve f(x) = g(x) first, and the area is\n∫ (upper − lower) dx. Subtracting in the wrong order gives you the negative of the right answer.\nRead off from your sketch which is upper.\n\nThe standard shapes recur, and it pays to have met each one before the exam: a circle (x² + y² = a²),\na parabola (y² = 4ax), an ellipse (x²/a² + y²/b² = 1), and the regions cut out where a line meets one\nof these. For a circle or an ellipse, exploit the symmetry — compute one quadrant and multiply by\nfour; it is faster and there is less to get wrong. The integral ∫√(a² − x²) dx is the one to have at\nyour fingertips, since almost every circle and ellipse question reduces to it.\n\nThe chapter is worth about 5 marks and takes a fraction of the time of Integrals to master. Treat it\nas a guaranteed score rather than an afterthought.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: application of integrals class 12 area under curve one shot](https://www.youtube.com/results?search_query=application+of+integrals+class+12+area+under+curve+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: area between curves](https://www.khanacademy.org/math/integral-calculus/ic-int-app)\n- **The book the paper is set from** — [NCERT Maths Part II, Chapter 8 (PDF)](https://ncert.nic.in/textbook/pdf/lemh202.pdf)\n- **For extra problems** — the NCERT exercise plus the miscellaneous exercise is close to exhaustive\n  for this chapter; the board rarely goes beyond those shapes.","s":{"scope":"### In the syllabus\n\n- Finding the **area under simple curves**, especially **lines, circles, parabolas and ellipses**,\n  **in standard form only**\n\nIn practice this covers: area under a curve between two ordinates or between two abscissae, area\nbounded by a curve and the coordinate axes, and area of a region bounded by one of these standard\ncurves together with a line — which is the form CBSE sample papers have used since the syllabus was\nrationalised."},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"m9","subj":"maths","num":9,"title":"Differential Equations","unit":"Unit III · Calculus","unitMarks":35,"prio":1,"appear":"Unit III Calculus (35 marks) · Typical appearance: one 1-mark order/degree MCQ + one 3- or 5-mark solving question, nearly every year. Highly templated — three methods cover the whole chapter.","deleted":"- **Formation** of a differential equation whose general solution is given\n- Differential equations **reducible to homogeneous** form\n- Order and degree questions built on the deleted formation topic\n\n> **Consequence.** The chapter is now exactly three solving methods plus one definition question.\n> There is nothing to \"form\" and nothing to reduce. If a practice question says \"form the\n> differential equation of the family of circles touching the y-axis\", it is out of syllabus.","intro":"A **differential equation** is an equation containing a derivative. That is the definition, but it\nundersells what is going on. Look at what such an equation is telling you: it does not say what a\nquantity *is*, it says how it *changes*. And an enormous amount of what we know about the world\narrives in exactly that form.\n\n\"A hot cup of tea cools at a rate proportional to how much hotter it is than the room.\" Nobody hands\nyou the temperature at 4 p.m.; they hand you a rule about the rate. Write it as dT/dt = −k(T − T₀)\nand you have a differential equation. Solving it means recovering the actual temperature as a\nfunction of time. Bacterial growth, radioactive decay, a falling body with air resistance, the\ncharge on a capacitor — all of them are stated as rates first. This chapter is how you get from the\nrule to the answer.\n\nTwo labels come first, because every question opens by asking for them. The **order** is the highest\nderivative present — a d²y/dx² makes it second order. The **degree** is the power that highest\nderivative is raised to, and it only counts as a degree at all if the equation is polynomial in its\nderivatives. So (d²y/dx²)³ + y = 0 has order 2 and degree 3; but sin(dy/dx) = y has order 1 and *no\ndegree defined*, because a sine is not a polynomial. That last case is a favourite one-marker.\n\nSolving comes in exactly two flavours in this syllabus, and recognising which you are looking at is\nthe whole game.\n\n**Variables separable** is the first thing to try. If you can shuffle the equation until all the y's\nand dy sit on one side and all the x's and dx on the other, you just integrate both sides and you\nare done. dy/dx = xy separates into dy/y = x dx, giving ln y = x²/2 + C. Anything that factorises\ninto (a function of x) × (a function of y) will separate.\n\n**Linear first order** is the other, and it has a fixed recipe. Get the equation into the shape\ndy/dx + Py = Q, where P and Q involve only x. Compute the **integrating factor** e^∫P dx, multiply\nthrough by it, and the left side collapses into the derivative of a single product — which is the\nwhole point of the factor. Then integrate once. The formula y × IF = ∫Q × IF dx is worth memorising,\nbut so is the reason it works, because the board sometimes asks you to identify P and Q separately.\n\nTwo pieces of practical advice. **Always look for separation first** — it is faster, and some\nequations that look linear will separate. And when a question supplies an extra condition like\n\"y = 1 when x = 0\", that is there to pin down C: solve generally, then substitute at the very end.\nA general solution offered where a particular one was asked for loses marks even if the calculus is\nperfect.\n\nNote the scope: homogeneous differential equations and the substitution y = vx have been trimmed in\nthe rationalised syllabus. Check §1 of this chapter before working through them — if they are out\nfor your year, that is a substantial saving, and it makes this chapter one of the best\nmarks-per-hour in the paper.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: differential equations class 12 one shot](https://www.youtube.com/results?search_query=differential+equations+class+12+maths+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: differential equations](https://www.khanacademy.org/math/differential-equations)\n- **The book the paper is set from** — [NCERT Maths Part II, Chapter 9 (PDF)](https://ncert.nic.in/textbook/pdf/lemh203.pdf)\n- **For extra problems** — NCERT exercises, then Exemplar Chapter 9. Drill the integrating-factor\n  type until the four steps need no thought; it is close to a guaranteed appearance.","s":{"scope":"### In the syllabus\n\n- **Definition, order and degree**, general and particular solutions of a differential equation\n- Solution by the **method of separation of variables**\n- Solutions of **homogeneous** differential equations of first order and first degree\n- Solutions of **linear** differential equations of the type **dy/dx + Py = Q**, where P and Q are\n  functions of x or constants"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"m10","subj":"maths","num":10,"title":"Vector Algebra","unit":"Unit IV · Vectors & 3D","unitMarks":14,"prio":1,"appear":"Unit IV Vectors and 3D Geometry (14 marks, shared with Ch 11) · Typical appearance: 2–3 MCQs + one or two 2/3-mark questions. Small, dense, formula-driven — probably the best marks-per-hour chapter in Mathematics.","deleted":"- **Scalar triple product** [a b c] and its applications (volume of a parallelepiped, coplanarity)\n\n> **Consequence.** No triple products means no volume questions and no coplanarity-of-three-vectors\n> questions. Everything left is dot product, cross product, and basic vector arithmetic.","intro":"\"Drive 5 km\" is incomplete information. \"Drive 5 km north\" is usable. Some quantities need a\ndirection to make sense and some do not, and that is the entire distinction between a **vector** and\na **scalar**. Distance, mass, temperature and speed are scalars — one number each. Displacement,\nforce, velocity and acceleration are vectors — a number *and* a direction.\n\nDraw a vector as an arrow: its length is the magnitude, its way of pointing is the direction. Where\nthe arrow happens to sit does not matter, so you may slide it around freely, which is what lets you\nadd vectors by putting them nose to tail. Walk 3 km east then 4 km north and your displacement is\nthe single arrow from start to finish — 5 km, north-east-ish. Notice that 3 + 4 gave 5, because the\ndirections were different. That is the one thing to internalise: **vectors do not add like numbers**\nunless they point the same way.\n\nIn coordinates a vector is written 3î + 4ĵ + 0k̂, meaning three units along x, four along y, none\nalong z. The **magnitude** is Pythagoras in three dimensions, √(3² + 4²) = 5. A **unit vector** is\nthat same arrow shrunk to length 1 — you get it by dividing by the magnitude — and its only job is to\ncarry direction with no size attached. Whenever a question asks \"in the direction of\", it wants a\nunit vector.\n\nThen the chapter's two multiplications, which are genuinely different operations that happen to\nshare a name, and keeping them apart is most of the work.\n\nThe **dot product** a·b = |a||b|cos θ gives a **number**. What it measures is how much of one vector\npoints along the other. Two clues to what it is for: it is largest when the vectors are parallel, and\nit is exactly **zero when they are perpendicular** — because cos 90° = 0. That zero test is worth\nmore marks than any other single fact in the chapter; almost every \"show these are perpendicular\"\nquestion is one dot product. In coordinates it is beautifully simple: multiply matching components\nand add. The physical meaning is work — force dotted with displacement — which is why only the\ncomponent of force along the motion counts.\n\nThe **cross product** a × b gives a **vector**, with magnitude |a||b|sin θ and direction\nperpendicular to both, found by the right-hand rule. Its clues are the mirror image: it is zero when\nthe vectors are **parallel** (sin 0° = 0), and largest when they are perpendicular. Its magnitude is\nthe **area of the parallelogram** the two vectors span — so half of it is the area of the triangle,\nwhich is how the board's area questions are set. Being a vector product it does not commute:\na × b = −(b × a), the same size pointing the opposite way.\n\nKeep the two straight by their zeros, because that is how questions are recognised:\n**dot product zero means perpendicular; cross product zero means parallel.** Get that backwards and\nyou lose whole questions.\n\nThe last idea, **projection**, is the dot product doing its job. The projection of a on b is\n(a·b)/|b| — how long a's shadow is when cast along b's direction. It is asked directly, and it is\nalso the mental picture that makes the dot product feel inevitable rather than arbitrary.\n\nThis chapter is short, scores well, and is the foundation of the next one. Do not treat it as\npreliminary; 3D Geometry is unusable without it.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: vector algebra class 12 one shot](https://www.youtube.com/results?search_query=vector+algebra+class+12+maths+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: vectors](https://www.khanacademy.org/math/precalculus/x9e81a4f98389efdf:vectors)\n- **The book the paper is set from** — [NCERT Maths Part II, Chapter 10 (PDF)](https://ncert.nic.in/textbook/pdf/lemh204.pdf)\n- **For extra problems** — NCERT exercises, then Exemplar Chapter 10. If the geometric meaning of the\n  two products has not clicked, HC Verma's *Concepts of Physics* Part 1 Ch 2 §2.5–2.9 explains them\n  with forces and torques, which many students find more concrete than the algebra.","s":{"scope":"### In the syllabus\n\n- Vectors and scalars; **magnitude and direction** of a vector\n- **Direction cosines** and **direction ratios**\n- Types of vectors: equal, unit, zero, parallel and collinear\n- **Position vector** of a point; negative of a vector; components of a vector\n- **Addition** of vectors; multiplication of a vector by a **scalar**\n- Position vector of a point **dividing a line segment** in a given ratio\n- **Scalar (dot) product**: definition, geometrical interpretation, properties, applications\n- **Vector (cross) product**: definition, geometrical interpretation, properties, applications"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"m11","subj":"maths","num":11,"title":"Three Dimensional Geometry","unit":"Unit IV · Vectors & 3D","unitMarks":14,"prio":1,"appear":"Unit IV Vectors and 3D Geometry (14 marks, shared with Ch 10) · Typical appearance: 1–2 MCQs + one 3-mark question, and very often a 5-marker (shortest distance between skew lines, or foot of perpendicular / image of a point).","deleted":"**Every plane topic is out.** Specifically:\n\n- Equation of a plane (vector, Cartesian, normal form, intercept form)\n- Plane through three points; plane through the intersection of two planes\n- **Angle between two planes**\n- **Angle between a line and a plane**\n- **Distance of a point from a plane**\n- **Coplanarity** of two lines\n- Distance between parallel planes\n\n> **Read this twice.** Roughly half of every pre-2023 3D Geometry question involved a plane, so\n> older question banks, sample papers and video playlists are heavily contaminated. If a practice\n> question mentions a plane, an equation like ax + by + cz + d = 0, or a normal vector, **skip it**.\n>\n> The upside: the surviving topic list is short and every question comes from one of five templates,\n> listed below.","intro":"This chapter is Chapter 10 put to work. It answers geometric questions about lines and planes in\nspace — the distance between two skew lines, the angle at which a line meets a plane, where a line\npierces a surface — and it answers them with dot and cross products rather than with drawing, which\nis fortunate, because drawing in three dimensions is hard.\n\nThe one idea to hold on to is that **a line is a point plus a direction**, and **a plane is a point\nplus a perpendicular**. Everything else follows.\n\nA **line** is described by saying \"start here, then head that way\": r = a + λb, where a is the\nposition vector of a known point on the line, b is its direction, and λ is a dial you turn to slide\nalong it. Every point of the line is some value of λ. The cartesian form\n(x − x₁)/a = (y − y₁)/b = (z − z₁)/c is the same statement — the numerators say how far you have\nmoved from the known point, the denominators are the direction, and setting the three ratios equal\njust says you moved proportionally in all three axes. If a question gives you two points instead of a\ndirection, subtract them: the direction is the arrow from one to the other.\n\nA **plane** is described differently, and this is the step that repays real thought. You cannot\nspecify a plane by a direction *in* it — there are infinitely many. What pins a plane down u
