\n```\n\n| | **चालक** | **अर्धचालक** | **विद्युतरोधी** |\n| --- | --- | --- | --- |\n| वर्जित अंतराल E_g | **शून्य** — बैंड **अतिव्यापी** हैं, या संयोजी बैंड आंशिक रूप से ही भरा है | **छोटा**, ≈ 1 eV | **बड़ा**, > 3 eV |\n| कक्ष ताप पर चालन बैंड में इलेक्ट्रॉन | बहुत अधिक | कुछ (ऊष्मीय रूप से उत्तेजित) | लगभग कोई नहीं |\n| चालकता | बहुत उच्च | मध्यम | बहुत निम्न |\n| ताप बढ़ाने का प्रभाव | चालकता **घटती** है | चालकता **बढ़ती** है | विद्युतरोधी ही रहता है |\n| उदाहरण | ताँबा, चाँदी, ऐलुमिनियम | सिलिकॉन (E_g = 1.1 eV), जर्मेनियम (E_g = 0.7 eV) | हीरा (E_g ≈ 6 eV), काँच, लकड़ी |\n\n> **मुख्य तुलना E_g पर है।** अर्धचालक में E_g ≈ 1 eV कक्ष ताप पर उपलब्ध ऊष्मीय ऊर्जा के तुलनीय है, अतः\n> थोड़े पर उपयोगी संख्या में इलेक्ट्रॉन अंतराल पार कर सकते हैं। विद्युतरोधी में E_g > 3 eV ऊष्मीय उत्तेजन\n> के लिए कहीं अधिक बड़ा है। यह एक वाक्य इस भाग के अधिकांश प्रश्नों का उत्तर है।\n\n### नैज अर्धचालक\n\n**नैज अर्धचालक** वह **शुद्ध** अर्धचालक है जिसमें कोई अपद्रव्य नहीं मिलाया गया।\n\nपरम शून्य पर संयोजी बैंड भरा और चालन बैंड खाली होता है, अतः वह पूर्ण विद्युतरोधी की भाँति व्यवहार करता\nहै। कक्ष ताप पर ऊष्मीय ऊर्जा कुछ सहसंयोजक बंध तोड़ देती है और इलेक्ट्रॉनों को चालन बैंड में उत्तेजित कर\nदेती है। संयोजी बैंड छोड़ने वाला प्रत्येक इलेक्ट्रॉन पीछे एक रिक्तता छोड़ जाता है — **विवर**, जो\n**धनात्मक** आवेश वाहक की भाँति व्यवहार करता है।\n\n**अतः नैज अर्धचालक में इलेक्ट्रॉन और विवर सदा युग्मों में बनते हैं:**\n\n```\n      n_e = n_h = n_i                       (n_i = नैज वाहक सांद्रता)\n```\n\n**चालन इलेक्ट्रॉनों और विवरों दोनों से होता है**, जो आरोपित क्षेत्र में विपरीत दिशाओं में चलते हैं। विवर\nधारा संयोजी इलेक्ट्रॉनों के निकटवर्ती रिक्तताओं में कूदने से बनती है, जो रिक्तता के दूसरी ओर चलने के\nतुल्य है।\n\n**ताप का प्रभाव।** ताप बढ़ाने पर और बंध टूटते हैं, अतः **n_i तेज़ी से बढ़ता है** (लगभग चरघातांकी रूप से)\nऔर **चालकता बढ़ती है** — इसीलिए अर्धचालकों का **प्रतिरोधकता ताप गुणांक ऋणात्मक** होता है (देखिए\n[अध्याय 3](03-current-electricity.md))।\n\nनैज अर्धचालकों की चालकता उपयोगी होने के लिए बहुत कम है, इसीलिए उनका मादन किया जाता है।\n\n### बाह्य अर्धचालक — मादन\n\n**मादन (doping)** शुद्ध अर्धचालक में उसकी चालकता बढ़ाने के लिए उपयुक्त अपद्रव्य की थोड़ी, नियंत्रित मात्रा\nजान-बूझकर मिलाना है। प्रायः 10⁶ आतिथेय परमाणुओं पर लगभग 1 अपद्रव्य परमाणु।\n\n**n-प्रकार अर्धचालक** — **पंचसंयोजी** अपद्रव्य से मादित (5 संयोजी इलेक्ट्रॉन):\n\n- मादक: **फ़ॉस्फ़ोरस, आर्सेनिक, ऐंटिमनी, बिस्मथ**\n- अपद्रव्य के पाँच में से चार संयोजी इलेक्ट्रॉन पड़ोसी Si/Ge परमाणुओं के साथ सहसंयोजक बंध बनाते हैं;\n  **पाँचवाँ ढीला बँधा** रहता है और सरलता से मुक्त इलेक्ट्रॉन बन जाता है।\n- अपद्रव्य एक इलेक्ट्रॉन **देता** है, अतः उसे **दाता (donor)** कहते हैं।\n- **बहुसंख्यक वाहक: इलेक्ट्रॉन।** **अल्पसंख्यक वाहक: विवर।**\n- n_e >> n_h\n\n**p-प्रकार अर्धचालक** — **त्रिसंयोजी** अपद्रव्य से मादित (3 संयोजी इलेक्ट्रॉन):\n\n- मादक: **बोरॉन, ऐलुमिनियम, इंडियम, गैलियम**\n- अपद्रव्य के तीन संयोजी इलेक्ट्रॉन तीन बंध बनाते हैं और **एक बंध अपूर्ण** छोड़ देते हैं — एक **विवर**,\n  जो पड़ोसी बंध से इलेक्ट्रॉन स्वीकार कर सकता है।\n- अपद्रव्य एक इलेक्ट्रॉन **स्वीकार करता** है, अतः उसे **ग्राही (acceptor)** कहते हैं।\n- **बहुसंख्यक वाहक: विवर।** **अल्पसंख्यक वाहक: इलेक्ट्रॉन।**\n- n_h >> n_e\n\n> **n-प्रकार और p-प्रकार दोनों अर्धचालक विद्युत् उदासीन हैं।** यह सीधे पूछा जाता है और बहुधा ग़लत उत्तरित\n> होता है। मादन कोई नेट आवेश नहीं जोड़ता: जो दाता परमाणु इलेक्ट्रॉन दे चुका है वह जालक में **स्थिर धनायन**\n> बन जाता है और मुक्त इलेक्ट्रॉन को ठीक-ठीक संतुलित कर देता है। \"n-प्रकार\" और \"p-प्रकार\" नाम केवल\n> **बहुसंख्यक वाहकों के चिह्न** को बताते हैं, पदार्थ पर किसी नेट आवेश को नहीं।\n\n**द्रव्यमान-क्रिया संबंध** (जानने योग्य):\n\n```\n      n_e × n_h = n_i²\n```\n\nअतः मादन से एक प्रकार के वाहक बढ़ाने पर दूसरा अनिवार्यतः **घट** जाता है।\n\n### p-n संधि\n\n*आरेख:* अर्धचालक की एक छड़, बाईं ओर p-प्रकार और दाईं ओर n-प्रकार, जो एक संधि पर मिलती हैं। p-क्षेत्र में\nविवर वृत्तों के रूप में और n-क्षेत्र में इलेक्ट्रॉन बिंदुओं के रूप में दिखाइए; उनके बीच एक सँकरा **ह्रासी\nक्षेत्र** जिसमें **p-ओर अचल ऋणात्मक आयन** और **n-ओर अचल धनात्मक आयन** हों, और n से p की ओर आंतरिक क्षेत्र\nतथा रोधिका विभव V_B दर्शाता तीर हो।\n\n**संधि कैसे बनती है — दो प्रक्रियाएँ:**\n\n**1. विसरण।** चूँकि विवर सांद्रता p-ओर कहीं अधिक है और इलेक्ट्रॉन सांद्रता n-ओर कहीं अधिक, अतः **विवर p\nसे n की ओर विसरित होते हैं** और **इलेक्ट्रॉन n से p की ओर**। यह **विसरण धारा** है, p से n की ओर।\n\n**2. ह्रासी क्षेत्र का बनना।** जैसे ही कोई इलेक्ट्रॉन n-क्षेत्र छोड़ता है, वह एक **स्थिर धनात्मक दाता\nआयन** उजागर कर देता है; जैसे ही कोई विवर p-क्षेत्र छोड़ता है, वह एक **स्थिर ऋणात्मक ग्राही आयन** उजागर कर\nदेता है। अतः संधि के निकट एक सँकरा क्षेत्र बनता है जो **गतिशील आवेश वाहकों से रहित** है और जिसमें केवल\n**अचल आयन** हैं — p-ओर ऋणात्मक, n-ओर धनात्मक। यही **ह्रासी क्षेत्र** (या ह्रासी परत) है, जो प्रायः\nमाइक्रोमीटर के अंश जितना चौड़ा होता है।\n\n**3. रोधिका विभव।** अचल आयन n-ओर से p-ओर की दिशा में एक **आंतरिक विद्युत् क्षेत्र** स्थापित कर देते हैं।\nह्रासी क्षेत्र के आर-पार संबद्ध विभवांतर ही **रोधिका विभव V_B** है (जिसे विभव रोधिका या संधि विभव भी\nकहते हैं):\n\n```\n      जर्मेनियम के लिए V_B ≈ 0.3 V            सिलिकॉन के लिए V_B ≈ 0.7 V\n```\n\n**4. साम्य।** यह क्षेत्र आगे के विसरण का विरोध करता है, पर अल्पसंख्यक वाहकों की गति में **सहायता** करता\nहै — p-ओर के थोड़े इलेक्ट्रॉनों को n-ओर और इसके विपरीत चलाता है। यही **अपवाह धारा** है, n से p की ओर।\nसाम्य पर **विसरण धारा अपवाह धारा को ठीक-ठीक संतुलित** कर देती है, अतः **नेट धारा शून्य** होती है और संधि\nस्थायी रहती है।\n\n### अग्र और पश्च अभिनति\n\n**अग्र अभिनति** — **p-ओर बैटरी के धन सिरे से** और n-ओर ऋण सिरे से जुड़ती है।\n\n| प्रभाव | |\n| --- | --- |\n| आरोपित क्षेत्र आंतरिक रोधिका क्षेत्र का **विरोध** करता है | |\n| रोधिका विभव | **घटता है** |\n| ह्रासी क्षेत्र की चौड़ाई | **घटती है** |\n| बहुसंख्यक वाहकों का विसरण | बहुत **बढ़ जाता है** |\n| धारा | **बड़ी**, **मिलीऐम्पियर** की कोटि की; **बहुसंख्यक** वाहकों द्वारा वहित |\n| संधि का प्रतिरोध | **कम** (कुछ ओम से कुछ सौ ओम) |\n\nउल्लेखनीय धारा तभी आरंभ होती है जब आरोपित वोल्टता रोधिका विभव से अधिक हो जाए — यही **घुटना (देहली या\nकट-इन) वोल्टता** है, **Ge के लिए लगभग 0.3 V** और **Si के लिए 0.7 V**। घुटने के आगे धारा बहुत तेज़ी से\nचढ़ती है।\n\n**पश्च अभिनति** — **p-ओर ऋण सिरे से** और n-ओर धन सिरे से जुड़ती है।\n\n| प्रभाव | |\n| --- | --- |\n| आरोपित क्षेत्र आंतरिक रोधिका क्षेत्र की **सहायता** करता है | |\n| रोधिका विभव | **बढ़ता है** |\n| ह्रासी क्षेत्र की चौड़ाई | **बढ़ती है** |\n| बहुसंख्यक वाहकों का विसरण | लगभग **रुक जाता है** |\n| धारा | **बहुत छोटी**, **माइक्रोऐम्पियर** की कोटि की; **अल्पसंख्यक** वाहकों द्वारा वहित |\n| संधि का प्रतिरोध | **बहुत अधिक** (मेगाओम की कोटि का) |\n\nइस छोटी पश्च धारा को **पश्च संतृप्त धारा** कहते हैं। वह आरोपित पश्च वोल्टता से लगभग **स्वतंत्र** होती है,\nक्योंकि वह वोल्टता से नहीं, बल्कि उपलब्ध ऊष्मीय रूप से उत्पन्न अल्पसंख्यक वाहकों की छोटी संख्या से सीमित\nहै। (हाँ, ताप के साथ वह बढ़ती अवश्य है।)\n\nपर्याप्त बड़ी पश्च वोल्टता पर संधि का **भंजन** होता है और पश्च धारा अकस्मात् बढ़ जाती है। वही वोल्टता\n**भंजन वोल्टता** है।\n\n### p-n संधि डायोड के I–V अभिलक्षण\n\n*इन्हें प्राप्त करने का परिपथ:* **अग्र** अभिलक्षण के लिए डायोड को मिलीऐमीटर, धारा-नियंत्रक और बैटरी के\nसाथ श्रेणी में जोड़िए, p-ओर धन सिरे पर, और डायोड के आर-पार वोल्टमीटर। **पश्च** अभिलक्षण के लिए वही, पर\nबैटरी उलटी और मिलीऐमीटर के स्थान पर **माइक्रो**ऐमीटर।\n\n```\n                    I (mA)\n                      │        ╱\n                      │       │\n                      │      ╱     ← अग्र अभिनति\n                      │     ╱        धारा mA में\n                      │    │         घुटने के बाद तीव्र वृद्धि\n                      │  ──╯\n                      │ ╱  ↑ घुटना वोल्टता (0.3 V Ge, 0.7 V Si)\n    ──────────────────┼────────────────→  V (वोल्ट)\n   ←── V (पश्च)       │\n                      │\n   भंजन ────────►  ───┤   ← पश्च अभिनति: अत्यल्प, लगभग अचर\n      │               │      पश्च संतृप्त धारा (µA)\n      ▼               │\n                    I (µA)\n```\n\n**बताने योग्य विशेषताएँ:**\n\n1. **अग्र अभिनति** में धारा तब तक नगण्य रहती है जब तक आरोपित वोल्टता **घुटना वोल्टता** तक न पहुँचे; उसके\n   आगे धारा **बहुत तेज़ी से और अरैखिक रूप से** चढ़ती है।\n2. **पश्च अभिनति** में **भंजन** होने तक केवल बहुत छोटी, लगभग **अचर** पश्च संतृप्त धारा (माइक्रोऐम्पियर)\n   बहती है।\n3. **दोनों अर्धों की मापनियाँ भिन्न हैं** — अग्र के लिए mA, पश्च के लिए µA। इन्हें ऐसे ही अंकित करना\n   होगा, अन्यथा ग्राफ़ ग़लत है।\n4. अभिलक्षण **अरैखिक** है, अतः डायोड **अन-ओमीय** युक्ति है: V/I अचर नहीं है।\n\n**गतिक (a.c.) प्रतिरोध:**\n\n```\n      r_d = ΔV/ΔI\n```\n\nजो प्रचालन बिंदु पर अभिलक्षण की प्रवणता से लिया जाता है। अग्र अभिनति में वह छोटा और पश्च अभिनति में बहुत\nबड़ा होता है।\n\n**मूल निष्कर्ष:** p-n संधि डायोड **केवल एक ही दिशा में सरलता से** चालन करता है — अग्र दिशा में। अतः वह\nधारा के लिए **एकमार्गी वाल्व** है, और ठीक यही उसे **दिष्टकारी** के रूप में उपयोगी बनाता है।\n\n### दिष्टकारी के रूप में डायोड\n\n**दिष्टकरण** प्रत्यावर्ती धारा को **दिष्ट (एकदिशिक) धारा में बदलना** है। यह इसलिए काम करता है कि डायोड\nकेवल अग्र अभिनत होने पर ही चालन करता है।\n\n**अर्ध-तरंग दिष्टकारी**\n\n*परिपथ:* AC स्रोत ट्रांसफ़ॉर्मर की प्राथमिक को देता है; द्वितीयक एक अकेले **डायोड** और एक **लोड प्रतिरोध\nR_L** के साथ श्रेणी में जुड़ी है। निर्गत R_L के आर-पार लिया जाता है।\n\n**कार्यविधि।** जिस अर्ध-चक्र में डायोड **अग्र अभिनत** होता है, वह चालन करता है और R_L से धारा बहती है,\nजिससे निर्गत वोल्टता बनती है। अगले अर्ध-चक्र में डायोड **पश्च अभिनत** होता है, अतः वह चालन नहीं करता और\nनिर्गत **शून्य** रहता है।\n\n```\n  निवेश (AC)          ╱‾╲       ╱‾╲       ╱‾╲\n                     ╱   ╲     ╱   ╲     ╱   ╲\n                 ───┴─────┴───┴─────┴───┴─────┴───→ t\n                          ╲   ╱     ╲   ╱\n                           ╲_╱       ╲_╱\n\n  निर्गत             ╱‾╲             ╱‾╲             ╱‾╲\n  (अर्ध-तरंग)       ╱   ╲           ╱   ╲           ╱   ╲\n                 ───┴─────┴─────────┴─────┴─────────┴─────→ t\n                        (दूसरे अर्ध-चक्र में कुछ नहीं)\n```\n\nअतः निर्गत केवल **एकांतर अर्ध-चक्रों** में आता है। निर्गत आवृत्ति **निवेश आवृत्ति के बराबर** होती है।\n\n**पूर्ण-तरंग दिष्टकारी**\n\n*परिपथ:* AC स्रोत एक **मध्य-निष्कासित ट्रांसफ़ॉर्मर** को देता है; द्वितीयक के दोनों छोर **दो डायोडों**\nD₁ और D₂ के p-सिरों से जुड़े हैं; दोनों n-सिरे परस्पर जुड़कर **लोड प्रतिरोध R_L** से होते हुए\n**मध्य-निष्कासन** पर लौटते हैं।\n\n**कार्यविधि।** एक अर्ध-चक्र में द्वितीयक का ऊपरी छोर धनात्मक होता है, अतः **D₁ अग्र अभिनत और D₂ पश्च\nअभिनत** होता है; D₁ चालन करता है और R_L से धारा बहती है। अगले अर्ध-चक्र में ध्रुवता उलट जाती है, अतः\n**D₂ अग्र अभिनत और D₁ पश्च अभिनत** होता है; D₂ चालन करता है और R_L से धारा **उसी दिशा** में बहती है।\n\n```\n  निवेश (AC)          ╱‾╲       ╱‾╲       ╱‾╲\n                     ╱   ╲     ╱   ╲     ╱   ╲\n                 ───┴─────┴───┴─────┴───┴─────┴───→ t\n                          ╲   ╱     ╲   ╱\n                           ╲_╱       ╲_╱\n\n  निर्गत             ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲\n  (पूर्ण-तरंग)      ╱   V   V   V   V   V   ╲\n                 ───┴───────────────────────────→ t\n                     (दोनों अर्ध-चक्रों में निर्गत)\n```\n\nअतः निर्गत **दोनों** अर्ध-चक्रों में आता है, और लोड में सदा एक ही दिशा में। निर्गत आवृत्ति **निवेश\nआवृत्ति की दुगुनी** होती है।\n\n**तुलना:**\n\n| | **अर्ध-तरंग** | **पूर्ण-तरंग** |\n| --- | --- | --- |\n| डायोडों की संख्या | 1 | 2 (मध्य-निष्कासित ट्रांसफ़ॉर्मर के साथ) |\n| चालन | केवल एकांतर अर्ध-चक्रों में | दोनों अर्ध-चक्रों में |\n| निर्गत आवृत्ति | निवेश के बराबर | निवेश की **दुगुनी** |\n| दक्षता | कम (~40.6%) | अधिक (~81.2%) |\n| निर्गत में तरंगिका | अधिक | कम |\n\n**छानक क्यों लगाया जाता है।** दिष्टित निर्गत एकदिशिक तो है पर अब भी **स्पंदमान** है, स्थिर DC नहीं।\n**लोड के समांतर जुड़ा संधारित्र** (छानक) उसे चिकना कर देता है: संधारित्र शिखरों पर आवेशित होता है और\nअंतरालों में लोड से निरावेशित होता है, जिससे तरंगिका बहुत घट जाती है।","pyq":"**Q1.** *(5 अंक)* परिपथ आरेख की सहायता से **पूर्ण-तरंग दिष्टकारी** की कार्यविधि समझाइए। निवेश और निर्गत\nतरंगरूप खींचिए। निर्गत आवृत्ति निवेश आवृत्ति से कैसी होती है?\n\n**Q2.** *(3 अंक)* चालक, अर्धचालक तथा विद्युतरोधी के ऊर्जा बैंड आरेख खींचिए, और वर्जित ऊर्जा अंतराल के आधार\nपर उनमें भेद कीजिए।\n\n**Q3.** *(3 अंक)* आरेख के साथ समझाइए कि p-n संधि में **ह्रासी क्षेत्र** तथा **रोधिका विभव** कैसे बनते हैं।\n\n**Q4.** *(3 अंक)* अग्र तथा उत्क्रम अभिनति में p-n संधि डायोड के I–V अभिलक्षण खींचिए। प्रत्येक स्थिति में\nवक्र का आकार समझाइए।\n\n**Q5.** *(3 अंक)* n-प्रकार तथा p-प्रकार अर्धचालकों में भेद कीजिए। क्या वे विद्युत रूप से आवेशित होते हैं?\nसमझाइए।\n\n**Q6.** *(2 अंक)* अपमिश्रण (doping) का क्या अर्थ है? दो पंचसंयोजी तथा दो त्रिसंयोजी अपमिश्रकों के नाम\nलिखिए।\n\n**Q7.** *(3 अंक)* परिपथ आरेख तथा निवेश/निर्गत तरंगरूपों के साथ **अर्ध-तरंग दिष्टकारी** की कार्यविधि\nसमझाइए।\n\n**Q8.** *(2 अंक)* ताप के साथ अर्धचालक की चालकता क्यों बढ़ती है, जबकि धातु की घटती है?\n\n**Q9.** *(2 अंक)* डायोड की उत्क्रम संतृप्ति धारा आरोपित उत्क्रम वोल्टता से लगभग स्वतंत्र क्यों होती है?\n\n**Q10.** *(1 अंक, बहुविकल्पीय)* n-प्रकार अर्धचालक में बहुसंख्यक वाहक हैं\n(a) होल (b) इलेक्ट्रॉन (c) प्रोटॉन (d) धनात्मक आयन\n\n**Q11.** *(2 अंक)* p-n संधि डायोड में अग्र अभिनति प्रतिरोध कम और उत्क्रम अभिनति प्रतिरोध अधिक होता है।\nसमझाइए।\n\n**Q12.** *(4 अंक, प्रकरण अध्ययन)* एक सिलिकॉन डायोड 200 Ω प्रतिरोध तथा 5 V की बैटरी के साथ श्रेणी में जुड़ा\nहै, और p-ओर धन सिरे की ओर है।\n(i) डायोड अग्र या उत्क्रम अभिनत है?\n(ii) चालन करते सिलिकॉन डायोड के आड़े वोल्टता पात 0.7 V लेकर परिपथ में धारा ज्ञात कीजिए।\n(iii) यदि बैटरी उलट दी जाए तो धारा कितनी होगी?\n(iv) समझाइए कि डायोड को अनओमीय युक्ति क्यों कहा जाता है।\n\n**Q13.** *(2 अंक)* 0 K पर अर्धचालक विद्युतरोधी क्यों होता है?","sol":"### Q1 — पूर्ण-तरंग दिष्टकारी\n\n*परिपथ आरेख (यह सब खींचिए और नामांकित कीजिए):* ट्रांसफ़ॉर्मर की **प्राथमिक** पर AC निवेश; एक\n**मध्य-निष्कर्षित (centre-tapped) द्वितीयक**; द्वितीयक का ऊपरी सिरा डायोड **D₁** की p-ओर से और निचला सिरा\nडायोड **D₂** की p-ओर से जुड़ा; दोनों डायोडों की n-ओर जुड़ी हुई और **लोड प्रतिरोध R_L** से होकर\n**मध्य-निष्कर्ष** तक। R_L के आड़े निर्गत अंकित कीजिए।\n\n**सिद्धांत।** p-n संधि डायोड ध्यान देने योग्य चालन केवल तब करता है जब वह **अग्र अभिनत** हो। दो डायोडों को\nऐसे लगाकर कि प्रत्येक अर्ध-चक्र में एक चालन करे, लोड में धारा पूरे AC चक्र में **एक ही दिशा** में बहाई जा\nसकती है।\n\n**कार्यविधि।**\n\n**पहले अर्ध-चक्र में**, मान लीजिए द्वितीयक का **ऊपरी सिरा** मध्य-निष्कर्ष के सापेक्ष धनात्मक है। तब:\n- **D₁ अग्र अभिनत** है (उसकी p-ओर धन सिरे पर है) और **चालन करता है**;\n- **D₂ उत्क्रम अभिनत** है और चालन नहीं करता।\n\nधारा द्वितीयक के ऊपरी सिरे से, D₁ से होकर, R_L से नीचे, और मध्य-निष्कर्ष तक बहती है।\n\n**दूसरे अर्ध-चक्र में** ध्रुवता उलट जाती है, अतः **निचला सिरा** धनात्मक हो जाता है। तब:\n- **D₂ अग्र अभिनत** है और **चालन करता है**;\n- **D₁ उत्क्रम अभिनत** है और चालन नहीं करता।\n\nअब धारा द्वितीयक के निचले सिरे से, D₂ से होकर, और **R_L से पहले की ही दिशा में नीचे** बहकर\nमध्य-निष्कर्ष तक जाती है।\n\nअतः **दोनों अर्ध-चक्रों में** लोड से धारा बहती है, और सदैव **एक ही दिशा** में — AC निवेश दिष्ट हो गया है।\n\n**तरंगरूप:**\n\n```\n  निवेश (पूरे द्वितीयक के आड़े AC)\n                        ╱‾╲       ╱‾╲       ╱‾╲\n                       ╱   ╲     ╱   ╲     ╱   ╲\n                   ───┴─────┴───┴─────┴───┴─────┴────→ t\n                            ╲   ╱     ╲   ╱\n                             ╲_╱       ╲_╱\n\n  निर्गत (R_L के आड़े)\n                        ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲\n                       ╱   V   V   V   V   V   ╲\n                   ───┴─────────────────────────────→ t\n                       D₁   D₂   D₁   D₂   D₁   D₂\n```\n\n*(निर्गत स्पंदों को संगत निवेश अर्ध-चक्रों के नीचे संरेखित कीजिए, और प्रत्येक स्पंद के लिए कौन-सा डायोड\nचालन कर रहा है, अंकित कीजिए।)*\n\n**निर्गत आवृत्ति।** चूँकि निवेश के **प्रत्येक अर्ध-चक्र** के लिए एक निर्गत स्पंद बनता है, अतः प्रति निवेश\nचक्र **दो** निर्गत स्पंद होते हैं। इसलिए\n\n```\n      निर्गत आवृत्ति = 2 × निवेश आवृत्ति\n```\n\n50 Hz मुख्य आपूर्ति के निवेश के लिए निर्गत की तरंगिका (ripple) आवृत्ति **100 Hz** होती है।\n\n*(इसके विपरीत अर्ध-तरंग दिष्टकारी प्रति निवेश चक्र एक स्पंद देता है, अतः उसकी निर्गत आवृत्ति निवेश\nआवृत्ति के बराबर होती है।)*\n\n**ध्यान दें।** निर्गत एकदिशीय है पर अब भी **स्पंदमान** है। **लोड के समांतर एक संधारित्र** छानक (filter) की\nतरह कार्य करता है, शिखरों पर आवेशित होकर उनके बीच लोड से निरावेशित होता है, और अतः निर्गत को स्थिर DC की\nओर चिकना कर देता है। ∎\n\n### Q2 — ऊर्जा बैंड आरेख\n\n```\n      चालक                     अर्धचालक                  विद्युतरोधी\n\n  ┌──────────────┐          ┌──────────────┐          ┌──────────────┐\n  │    चालन      │          │    चालन      │          │    चालन      │\n  │    बैंड      │          │    बैंड      │          │    बैंड      │\n  ├──────────────┤          └──────────────┘          └──────────────┘\n  │  अतिव्यापन   │              ↕ E_g ≈ 1 eV\n  │   E_g = 0    │          ┌──────────────┐              ↕ E_g > 3 eV\n  ├──────────────┤          │   संयोजी     │\n  │   संयोजी     │          │ बैंड (भरा)   │          ┌──────────────┐\n  │    बैंड      │          └──────────────┘          │   संयोजी     │\n  └──────────────┘                                    │ बैंड (भरा)   │\n                                                      └──────────────┘\n```\n\n**वर्जित ऊर्जा अंतराल के आधार पर भेद:**\n\n| | **चालक** | **अर्धचालक** | **विद्युतरोधी** |\n| --- | --- | --- | --- |\n| वर्जित अंतराल E_g | **शून्य** — संयोजी और चालन बैंड **अतिव्यापी** हैं (या संयोजी बैंड केवल आंशिक भरा है) | **छोटा**, लगभग **1 eV** (Si 1.1 eV, Ge 0.7 eV) | **बड़ा**, **3 eV** से अधिक (हीरा ≈ 6 eV) |\n| कमरे के ताप पर चालन बैंड में इलेक्ट्रॉन | बहुत बड़ी संख्या | छोटी पर ध्यान देने योग्य संख्या, तापीय उत्तेजन से अंतराल पार करके | वस्तुतः कोई नहीं |\n| चालकता | अत्यंत उच्च | मध्यवर्ती | उपेक्षणीय |\n| उदाहरण | ताँबा, चाँदी | सिलिकॉन, जर्मेनियम | हीरा, काँच |\n\n**मूल बात।** चालन के लिए **चालन बैंड** में इलेक्ट्रॉन आवश्यक हैं। चालक में सदैव पर्याप्त होते हैं।\nअर्धचालक में E_g ≈ 1 eV **कमरे के ताप पर उपलब्ध तापीय ऊर्जा के तुलनीय** है, अतः कुछ इलेक्ट्रॉन अंतराल पार\nकर सकते हैं और पीछे होल छोड़ जाते हैं। विद्युतरोधी में E_g > 3 eV साधारण तापों पर तापीय उत्तेजन के लिए\n**बहुत ही बड़ा** है, अतः चालन बैंड खाली ही रहता है।\n\n### Q3 — ह्रासी क्षेत्र तथा रोधिका विभव का बनना\n\n*आरेख:* एक छड़ जिसमें बाईं ओर p-क्षेत्र (होल ○ से दिखाए, और विसरण के बाद संधि के पास स्थिर ऋणात्मक ग्राही\nआयन ⊖) और दाईं ओर n-क्षेत्र (इलेक्ट्रॉन ● से दिखाए, और संधि के पास स्थिर धनात्मक दाता आयन ⊕)। ह्रासी\nक्षेत्र, n से p की ओर संकेत करता आंतरिक क्षेत्र **E**, और रोधिका विभव V_B अंकित कीजिए।\n\n**चरण 1 — विसरण।** p-क्षेत्र में होल सांद्रता अत्यंत उच्च है, और n-क्षेत्र में इलेक्ट्रॉन सांद्रता अत्यंत\nउच्च। इस **सांद्रता प्रवणता** के कारण, संधि बनते ही:\n\n- **होल p-ओर से n-ओर विसरित होते हैं**, और\n- **इलेक्ट्रॉन n-ओर से p-ओर विसरित होते हैं।**\n\nयह p से n की ओर निर्देशित **विसरण धारा** बनाता है।\n\n**चरण 2 — ह्रासी क्षेत्र का बनना।** जब कोई इलेक्ट्रॉन n-ओर से विसरित होकर चला जाता है, तो वह जालक में पीछे\nएक **स्थिर (अचल) धनात्मक दाता आयन** छोड़ जाता है। जब कोई होल p-ओर से विसरित होकर चला जाता है, तो वह पीछे एक\n**स्थिर ऋणात्मक ग्राही आयन** छोड़ जाता है।\n\nअतः संधि के दोनों ओर का सँकरा क्षेत्र **गतिशील आवेश वाहकों से रिक्त** हो जाता है और उसमें केवल ये\n**अचल आयन** रह जाते हैं — **p-ओर ऋणात्मक** और **n-ओर धनात्मक**। इस क्षेत्र को **ह्रासी क्षेत्र**\n(depletion layer) कहते हैं। उसकी चौड़ाई आमतौर पर एक माइक्रोमीटर के अंश भर होती है।\n\n**चरण 3 — रोधिका विभव।** स्थिर विपरीत आवेशों की ये परतें ह्रासी क्षेत्र के आड़े एक **आंतरिक विद्युत\nक्षेत्र** खड़ा कर देती हैं, जो **n-ओर से p-ओर** निर्देशित होता है। इससे जुड़े विभवांतर को **रोधिका विभव\nV_B** कहते हैं, जिसमें n-ओर का विभव p-ओर से अधिक होता है:\n\n```\n      जर्मेनियम के लिए V_B ≈ 0.3 V              सिलिकॉन के लिए V_B ≈ 0.7 V\n```\n\n**चरण 4 — संतुलन।** आंतरिक क्षेत्र बहुसंख्यक वाहकों के **आगे विसरण का विरोध** करता है। तथापि वह\nअल्पसंख्यक वाहकों (p-ओर के कुछ इलेक्ट्रॉन और n-ओर के कुछ होल) की गति में **सहायता** करता है, उन्हें संधि\nके आर-पार बहा देता है — यह **अपवाह धारा** है, जो n से p की ओर निर्देशित है।\n\nविसरण तब तक चलता है जब तक रोधिका इतनी बड़ी न हो जाए कि **विसरण धारा ठीक-ठीक अपवाह धारा से संतुलित** हो जाए।\nउस बिंदु पर संधि के आर-पार **नेट धारा शून्य** होती है, और संधि स्थिर ह्रासी क्षेत्र तथा रोधिका विभव के साथ\n**संतुलन** में होती है। ∎\n\n### Q4 — p-n संधि डायोड के I–V अभिलक्षण\n\n*परिपथ (दोनों खींचिए):* अग्र अभिलक्षण के लिए — डायोड की p-ओर बैटरी के धन सिरे से, धारा-नियंत्रक (rheostat)\nतथा **मिलीऐमीटर** के साथ श्रेणी में, और डायोड के आड़े वोल्टमीटर। उत्क्रम अभिलक्षण के लिए — वही परिपथ\nजिसमें बैटरी उलटी हो और मिलीऐमीटर के स्थान पर **माइक्रोऐमीटर** हो।\n\n```\n                       I (mA)\n                          │           ╱\n                          │          │\n                          │         ╱\n                          │        │      अग्र अभिनति\n                          │       ╱       (धारा mA में)\n                          │     ─╯\n                          │   ╱ ↑\n                          │ ╱   घुटना वोल्टता\n      ────────────────────┼────────────────────→ V (वोल्ट)\n      ← उत्क्रम V         │\n                          │\n   भंजन  ────────────►  ──┤   उत्क्रम अभिनति\n        │                 │   (धारा µA में — पैमाना भिन्न है, ध्यान दें)\n        ▼                 │\n                       I (µA)\n```\n\n**अग्र अभिनति — आकार का स्पष्टीकरण।**\n\nछोटी आरोपित वोल्टताओं पर धारा **लगभग शून्य** होती है, क्योंकि आरोपित वोल्टता **रोधिका विभव** पार करने के\nलिए अभी पर्याप्त नहीं है। जब आरोपित वोल्टता **घुटना (देहली) वोल्टता** से अधिक हो जाती है — जर्मेनियम के\nलिए लगभग **0.3 V** और सिलिकॉन के लिए **0.7 V** — तो रोधिका वस्तुतः समाप्त हो जाती है, ह्रासी क्षेत्र बहुत\nसँकरा हो जाता है, और **बहुसंख्यक वाहक** संधि स्वतंत्र रूप से पार करते हैं। तब धारा वोल्टता के साथ\n**अत्यंत तीव्रता से और अरैखिक रूप से** बढ़ती है, और **मिलीऐम्पियर** की कोटि की होती है। संधि प्रतिरोध\n**कम** होता है।\n\n**उत्क्रम अभिनति — आकार का स्पष्टीकरण।**\n\nआरोपित क्षेत्र अब आंतरिक रोधिका क्षेत्र की **सहायता** करता है, अतः रोधिका विभव बढ़ जाता है और ह्रासी\nक्षेत्र चौड़ा हो जाता है। इसलिए **बहुसंख्यक वाहक** पार नहीं कर पाते, और विसरण धारा रुक जाती है।\n\nतथापि एक अत्यंत छोटी धारा बहती है, जिसे **तापीय रूप से उत्पन्न अल्पसंख्यक वाहक** ले जाते हैं — p-ओर के कुछ\nइलेक्ट्रॉन और n-ओर के कुछ होल — जिन्हें क्षेत्र संधि के आर-पार बहा देता है। यह **उत्क्रम संतृप्ति धारा**\nहै, **माइक्रोऐम्पियर** की कोटि की, और वह आरोपित वोल्टता से लगभग **स्वतंत्र** होती है, क्योंकि वह वोल्टता\nसे नहीं, उपलब्ध अल्पसंख्यक वाहकों की *संख्या* से सीमित है। संधि प्रतिरोध **अत्यंत उच्च** होता है।\n\nपर्याप्त बड़ी उत्क्रम वोल्टता पर संधि का **भंजन (breakdown)** होता है, और उत्क्रम धारा अचानक बढ़ जाती है।\n\n**निष्कर्ष।** अभिलक्षण स्पष्ट रूप से **अरैखिक** है और दोनों दिशाओं में सर्वथा भिन्न: डायोड **अग्र** दिशा में\nसरलता से चालन करता है और **उत्क्रम** दिशा में लगभग नहीं। अतः वह धारा के लिए **एकतरफ़ा वाल्व** की तरह कार्य\nकरता है — यही गुण उसे दिष्टकारी के रूप में उपयोगी बनाता है।\n\n### Q5 — n-प्रकार बनाम p-प्रकार, और क्या वे आवेशित हैं\n\n| | **n-प्रकार** | **p-प्रकार** |\n| --- | --- | --- |\n| **अपमिश्रक** | **पंचसंयोजी** (5 संयोजी इलेक्ट्रॉन) | **त्रिसंयोजी** (3 संयोजी इलेक्ट्रॉन) |\n| **अपमिश्रक के उदाहरण** | फ़ॉस्फ़ोरस, आर्सेनिक, ऐंटिमनी, बिस्मथ | बोरॉन, ऐल्युमिनियम, इंडियम, गैलियम |\n| **अपमिश्रक का नाम** | **दाता (donor)** — वह एक मुक्त इलेक्ट्रॉन देता है | **ग्राही (acceptor)** — वह एक इलेक्ट्रॉन लेता है, जिससे होल बनता है |\n| **बहुसंख्यक वाहक** | **इलेक्ट्रॉन** | **होल** |\n| **अल्पसंख्यक वाहक** | होल | इलेक्ट्रॉन |\n| **वाहक सांद्रताएँ** | n_e >> n_h | n_h >> n_e |\n\n**क्या वे विद्युत रूप से आवेशित होते हैं?**\n\n**नहीं — n-प्रकार और p-प्रकार, दोनों अर्धचालक विद्युत रूप से उदासीन होते हैं।**\n\n**स्पष्टीकरण।** अपमिश्रण क्रिस्टल में कोई नेट आवेश नहीं जोड़ता। n-प्रकार अर्धचालक पर विचार कीजिए: प्रत्येक\nपंचसंयोजी दाता परमाणु एक **मुक्त इलेक्ट्रॉन** (ऋणात्मक) देता है, पर वह परमाणु स्वयं, उस इलेक्ट्रॉन को खोकर,\nजालक में एक **स्थिर धनात्मक आयन** बन जाता है। दोनों आवेश समान और विपरीत हैं, अतः वे ठीक-ठीक कट जाते हैं।\np-प्रकार पदार्थ पर भी वही तर्क लागू होता है, जहाँ इलेक्ट्रॉन लेने वाला प्रत्येक ग्राही परमाणु एक स्थिर\n**ऋणात्मक** आयन बन जाता है, जो गतिशील धनात्मक होल को संतुलित करता है।\n\nअतः \"n-प्रकार\" और \"p-प्रकार\" केवल **बहुसंख्यक आवेश वाहकों के चिह्न** को दर्शाते हैं — पदार्थ पर समग्र\nरूप से किसी नेट आवेश को **नहीं**।\n\n### Q6 — अपमिश्रण\n\n**अपमिश्रण** शुद्ध (नैज) अर्धचालक में उसकी **विद्युत चालकता बढ़ाने** के लिए किसी उपयुक्त अशुद्धि की छोटी,\nसावधानी से नियंत्रित मात्रा जान-बूझकर मिलाने की प्रक्रिया है।\n\nअपमिश्रण का स्तर बहुत कम होता है — आमतौर पर आधार के लगभग **10⁶ परमाणुओं में 1 अशुद्धि परमाणु** — जिससे\nक्रिस्टल संरचना विक्षोभित न हो।\n\n**दो पंचसंयोजी अपमिश्रक:** **फ़ॉस्फ़ोरस (P)** तथा **आर्सेनिक (As)**।\n*(ऐंटिमनी, बिस्मथ भी। ये n-प्रकार पदार्थ बनाते हैं।)*\n\n**दो त्रिसंयोजी अपमिश्रक:** **बोरॉन (B)** तथा **ऐल्युमिनियम (Al)**।\n*(इंडियम, गैलियम भी। ये p-प्रकार पदार्थ बनाते हैं।)*\n\n### Q7 — अर्ध-तरंग दिष्टकारी\n\n*परिपथ आरेख:* ट्रांसफ़ॉर्मर की प्राथमिक पर AC निवेश; द्वितीयक एक **अकेले डायोड** तथा **लोड प्रतिरोध R_L**\nके साथ श्रेणी में जुड़ी; निर्गत R_L के आड़े लिया गया। AC निवेश, डायोड, R_L तथा निर्गत नामांकित कीजिए।\n\n**सिद्धांत।** p-n संधि डायोड ध्यान देने योग्य चालन केवल तब करता है जब वह **अग्र अभिनत** हो। अतः यदि एक\nअकेला डायोड लोड तथा AC आपूर्ति के साथ श्रेणी में रखा जाए, तो धारा केवल उन अर्ध-चक्रों में बहेगी जिनमें\nडायोड अग्र अभिनत हो।\n\n**कार्यविधि।**\n\nनिवेश के **धनात्मक अर्ध-चक्र में** (वह ध्रुवता लेकर जो डायोड की p-ओर को धनात्मक बनाती है) डायोड\n**अग्र अभिनत** होता है। वह कम प्रतिरोध देकर **चालन करता है**, अतः R_L से धारा बहती है और उसके आड़े निर्गत\nवोल्टता प्रकट होती है।\n\n**ऋणात्मक अर्ध-चक्र में** ध्रुवता उलट जाती है और डायोड **उत्क्रम अभिनत** हो जाता है। वह अत्यंत उच्च\nप्रतिरोध देकर वस्तुतः **चालन नहीं करता**, अतः R_L के आड़े निर्गत व्यावहारिक रूप से **शून्य** होता है।\n\nअतः लोड से धारा **केवल एक दिशा** में, **वैकल्पिक अर्ध-चक्रों** में बहती है — AC दिष्ट हो गया है, भले हर\nचक्र का आधा भाग ही उपयोग हुआ।\n\n**तरंगरूप:**\n\n```\n  निवेश (AC)\n                        ╱‾╲       ╱‾╲       ╱‾╲\n                       ╱   ╲     ╱   ╲     ╱   ╲\n                   ───┴─────┴───┴─────┴───┴─────┴────→ t\n                            ╲   ╱     ╲   ╱\n                             ╲_╱       ╲_╱\n\n  निर्गत (R_L के आड़े)\n                        ╱‾╲             ╱‾╲             ╱‾╲\n                       ╱   ╲           ╱   ╲           ╱   ╲\n                   ───┴─────┴─────────┴─────┴─────────┴─────┴──→ t\n                             (ऋणात्मक अर्ध-चक्रों में कोई निर्गत नहीं)\n```\n\n**निर्गत आवृत्ति = निवेश आवृत्ति**, क्योंकि प्रति निवेश चक्र एक निर्गत स्पंद होता है।\n\n**सीमाएँ** (एक पंक्ति के योग्य): हर चक्र का आधा ही उपयोग होता है, अतः दक्षता कम है (लगभग 40.6%) और निर्गत\nमें बड़ी तरंगिका होती है। पूर्ण-तरंग दिष्टकारी दोनों दोष दूर कर देता है। ∎\n\n### Q8 — चालकता की ताप-निर्भरता: अर्धचालक बनाम धातु\n\n**अर्धचालक — ताप के साथ चालकता बढ़ती है।**\n\nअर्धचालक में वर्जित ऊर्जा अंतराल छोटा (≈ 1 eV) होता है। कम ताप पर बहुत कम इलेक्ट्रॉनों में उसे पार करने की\nऊर्जा होती है, अतः आवेश वाहक कम होते हैं। ताप बढ़ने पर अधिक सहसंयोजक बंध टूटते हैं और **कहीं अधिक\nइलेक्ट्रॉन–होल युग्म बनते हैं**, अतः आवेश वाहकों का **संख्या घनत्व n बहुत तेज़ी से बढ़ता** है (लगभग\nचरघातांकी रूप से)।\n\nचूँकि σ = n e μ, n में यह बड़ी वृद्धि गतिशीलता μ में किसी भी कमी पर भारी पड़ती है, अतः **चालकता बढ़ती** है\n— समकक्ष रूप से प्रतिरोधकता **गिरती** है, और प्रतिरोधकता का ताप गुणांक **ऋणात्मक** होता है।\n\n**धातु — ताप के साथ चालकता घटती है।**\n\nधातु में मुक्त इलेक्ट्रॉनों का संख्या घनत्व n वस्तुतः **नियत** है — वह परमाणुओं की संख्या से तय होता है और\nताप के साथ ध्यान देने योग्य रूप से नहीं बदलता। पर ताप बढ़ने पर जालक आयन **अधिक प्रबलता से कंपन करते हैं**,\nअतः इलेक्ट्रॉन **अधिक बार टकराते हैं**, और शिथिलन काल τ (और अतः गतिशीलता) **घटता** है।\n\nn नियत और τ घटने से ρ = m/(ne²τ) **बढ़ता** है, अतः **चालकता घटती** है और प्रतिरोधकता का ताप गुणांक\n**धनात्मक** होता है।\n\n**मूल विरोधाभास:** अर्धचालक में प्रबल प्रभाव **वाहकों की संख्या में बड़ी वृद्धि** है; धातु में वाहकों की\nसंख्या नियत है और प्रबल प्रभाव **शिथिलन काल में कमी** है।\n\n### Q9 — उत्क्रम संतृप्ति धारा वोल्टता से लगभग स्वतंत्र क्यों\n\nउत्क्रम अभिनति में बढ़ी हुई रोधिका बहुसंख्यक वाहकों को संधि पार करने से रोक देती है। छोटी उत्क्रम धारा\nपूर्णतः **अल्पसंख्यक वाहकों** द्वारा ले जाई जाती है — p-क्षेत्र में उपस्थित कुछ इलेक्ट्रॉन और n-क्षेत्र में\nकुछ होल, जो इलेक्ट्रॉन–होल युग्मों के **तापीय जनन** से बनते हैं।\n\nछोटी उत्क्रम वोल्टता भी संधि तक पहुँचने वाले **वस्तुतः सभी** अल्पसंख्यक वाहकों को उसके आर-पार बहा देने के\nलिए पर्याप्त है। अतः धारा वोल्टता से नहीं, बल्कि **अल्पसंख्यक वाहकों के तापीय जनन की दर** से सीमित है —\nअर्थात् **उपलब्ध संख्या** से, उन्हें चलाने वाले बल से नहीं।\n\nअतः उत्क्रम वोल्टता बढ़ाने से धारा ध्यान देने योग्य रूप से नहीं बढ़ती: वह एक छोटे मान पर **संतृप्त** हो\nजाती है, इसीलिए उसे **उत्क्रम संतृप्ति धारा** कहते हैं।\n\n*(तथापि वह **ताप** के साथ स्पष्ट रूप से बढ़ती है, क्योंकि अल्पसंख्यक वाहकों के तापीय जनन की दर ताप के साथ\nबढ़ती है। और पर्याप्त बड़ी उत्क्रम वोल्टता पर भंजन होता है और धारा अचानक बढ़ जाती है।)*\n\n### Q10 — n-प्रकार पदार्थ में बहुसंख्यक वाहक\n\nn-प्रकार अर्धचालक पंचसंयोजी (दाता) अशुद्धि से अपमिश्रित होता है, जिसका प्रत्येक परमाणु एक मुक्त\n**इलेक्ट्रॉन** देता है।\n\n**उत्तर: (b) इलेक्ट्रॉन**\n\n### Q11 — अग्र प्रतिरोध कम और उत्क्रम प्रतिरोध अधिक क्यों\n\n**अग्र अभिनति में** (p-ओर धन सिरे से) आरोपित क्षेत्र आंतरिक रोधिका क्षेत्र का **विरोध** करता है। अतः\nरोधिका विभव **घट** जाता है और **ह्रासी क्षेत्र सँकरा** हो जाता है। जब आरोपित वोल्टता घुटना वोल्टता से अधिक\nहो जाती है, तो **बहुसंख्यक वाहक** — जो बहुत बड़ी संख्या में उपस्थित हैं — संधि स्वतंत्र रूप से पार करते हैं।\nछोटी आरोपित वोल्टता पर बड़ी धारा (मिलीऐम्पियर) बहती है, अतः R = V/I से **अग्र प्रतिरोध कम** होता है (कुछ\nओम से कुछ सौ ओम)।\n\n**उत्क्रम अभिनति में** (p-ओर ऋण सिरे से) आरोपित क्षेत्र आंतरिक रोधिका क्षेत्र की **सहायता** करता है।\nरोधिका विभव **बढ़** जाता है और **ह्रासी क्षेत्र चौड़ा** हो जाता है, अतः बहुसंख्यक वाहक पार ही नहीं कर पाते।\nकेवल तापीय रूप से उत्पन्न बहुत कम **अल्पसंख्यक वाहक** योगदान देते हैं, जिससे बड़ी आरोपित वोल्टता पर भी धारा\nकेवल माइक्रोऐम्पियर की होती है। अतः **उत्क्रम प्रतिरोध अत्यंत उच्च** होता है (मेगाओम की कोटि का)।\n\nउत्क्रम और अग्र प्रतिरोध का **अनुपात** आमतौर पर 10⁵ या अधिक होता है — और ठीक यही असममिति डायोड को\nदिष्टकारी के रूप में उपयोगी बनाती है।\n\n### Q12 — प्रकरण अध्ययन: श्रेणी परिपथ में सिलिकॉन डायोड\n\n```\n      R = 200 Ω          बैटरी = 5 V          p-ओर धन सिरे की ओर\n```\n\n**(i) अग्र या उत्क्रम अभिनत?**\n\n**p-ओर बैटरी के धन सिरे की ओर** जुड़ी है। यह ठीक **अग्र अभिनति** की शर्त है।\n\n**डायोड अग्र अभिनत है।**\n\n**(ii) परिपथ में धारा।**\n\nअग्र अभिनति में चालन करता सिलिकॉन डायोड अपने आड़े लगभग नियत **0.7 V** का पात देता है। शेष वोल्टता प्रतिरोध\nके आड़े प्रकट होती है:\n\n```\n      R के आड़े वोल्टता = 5 − 0.7 = 4.3 V\n```\n\n```\n      I = 4.3/200 = 0.0215 A = 21.5 mA\n```\n\n**I = 21.5 mA**\n\n**(iii) यदि बैटरी उलट दी जाए तो धारा।**\n\nतब डायोड **उत्क्रम अभिनत** हो जाएगा। केवल नन्ही **उत्क्रम संतृप्ति धारा** बहेगी — **माइक्रोऐम्पियर** की\nकोटि की, और अधिकांश प्रयोजनों के लिए **वस्तुतः शून्य** मानी जाती है।\n\n**I ≈ 0** (अधिकतम कुछ µA)।\n\n**(iv) डायोड अनओमीय युक्ति क्यों है।**\n\n**ओमीय** युक्ति ओम के नियम का पालन करती है: V ∝ I, अतः अनुपात V/I — प्रतिरोध — **नियत** होता है, और I–V\nग्राफ़ मूल बिंदु से जाती सरल रेखा होता है।\n\nडायोड के लिए I–V अभिलक्षण **स्पष्ट रूप से अरैखिक** है: घुटना वोल्टता से नीचे धारा लगभग शून्य है और फिर\nअत्यंत तीव्रता से बढ़ती है, और वह उत्क्रम दिशा में अग्र दिशा से पूर्णतः भिन्न है। अतः अनुपात V/I\n**नियत नहीं** है — वह आरोपित वोल्टता के साथ, और उसके चिह्न के साथ भी, बदलता है।\n\nचूँकि डायोड ओम के नियम का पालन नहीं करता, उसे **अनओमीय** युक्ति कहा जाता है।\n\n### Q13 — 0 K पर अर्धचालक विद्युतरोधी क्यों\n\n**परम शून्य** पर इलेक्ट्रॉनों को उत्तेजित करने के लिए कोई तापीय ऊर्जा उपलब्ध नहीं होती।\n\nअर्धचालक में **संयोजी बैंड पूर्णतः भरा** होता है और **चालन बैंड पूर्णतः खाली**, और उनके बीच लगभग 1 eV का\nवर्जित अंतराल होता है। चालन के लिए **चालन बैंड में इलेक्ट्रॉन** आवश्यक हैं (और उसी अनुसार संयोजी बैंड में\nहोल), क्योंकि पूर्णतः भरे बैंड के इलेक्ट्रॉन अपनी अवस्था नहीं बदल सकते और अतः नेट धारा नहीं ले जा सकते।\n\nअतः 0 K पर **कोई इलेक्ट्रॉन अंतराल पार नहीं कर सकता**, चालन बैंड खाली रहता है, और **कोई मुक्त आवेश वाहक\nही नहीं** होता। परिणामतः अर्धचालक **पूर्ण विद्युतरोधी** की तरह व्यवहार करता है।\n\n0 K से ऊपर ताप बढ़ने पर तापीय ऊर्जा सहसंयोजक बंध तोड़ने लगती है, जिससे इलेक्ट्रॉन–होल युग्म और अतः आवेश\nवाहक बनते हैं — इसीलिए अर्धचालक की चालकता ताप के साथ बढ़ती है।"}}}],"docs":[{"id":"blueprint","title":"Exam Blueprint","blurb":"Paper design, unit weightage, the full deletion list, and how CBSE marking schemes award marks","body":"Read this once, properly, before opening a single chapter. Almost every avoidable mark lost in the\nboard exam is lost because the student did not know how the paper is built.\n\n---\n\n## 1. Mathematics (Code 041)\n\n**Theory 80 marks · Internal assessment 20 marks · 3 hours**\n\n### Unit-wise weightage (official)\n\n| Unit | Chapters | Marks |\n| --- | --- | --- |\n| I. Relations and Functions | 1. Relations and Functions · 2. Inverse Trigonometric Functions | 8 |\n| II. Algebra | 3. Matrices · 4. Determinants | 10 |\n| III. Calculus | 5. Continuity & Differentiability · 6. Application of Derivatives · 7. Integrals · 8. Application of Integrals · 9. Differential Equations | **35** |\n| IV. Vectors and Three-Dimensional Geometry | 10. Vector Algebra · 11. Three Dimensional Geometry | 14 |\n| V. Linear Programming | 12. Linear Programming | 5 |\n| VI. Probability | 13. Probability | 8 |\n| | **Total** | **80** |\n\nThe CBSE syllabus document carries an explicit line: *\"No chapter-wise weightage. Care to be taken\nto cover all chapters.\"* So the numbers above are **unit** totals, and the split between chapters\ninside a unit shifts year to year. Do not use \"chapter-wise weightage\" tables from coaching sites as\na reason to skip a chapter — Application of Integrals has appeared as a 5-marker in most years\ndespite being \"only 4 marks\" on such tables.\n\n### Paper design\n\n38 questions, five sections, no overall choice (internal choice in Sections B–E).\n\n| Section | Questions | Type | Marks each | Total |\n| --- | --- | --- | --- | --- |\n| A | 1–18 | MCQ, one correct option | 1 | 18 |\n| A | 19–20 | Assertion–Reason | 1 | 2 |\n| B | 21–25 | Very Short Answer (VSA) | 2 | 10 |\n| C | 26–31 | Short Answer (SA) | 3 | 18 |\n| D | 32–35 | Long Answer (LA) | 5 | 20 |\n| E | 36–38 | Case-study / source-based | 4 | 12 |\n| | **38** | | | **80** |\n\n### Internal assessment (20)\n\n| Component | Marks |\n| --- | --- |\n| Periodic tests | 10 |\n| Mathematics activities / lab | 5 |\n| Portfolio (assignments, project work) | 5 |\n\n### Where the 5-markers come from\n\nOver the last decade, the four Section-D questions have almost always been drawn from this pool.\nPrepare **all** of it; you will then be able to pick your best four.\n\n- Matrix method / inverse of a 3×3 matrix to solve a system of three equations\n- Definite or indefinite integral (partial fractions, or a by-parts + substitution combination)\n- Area bounded by curves (line with parabola / circle / ellipse)\n- Differential equation — linear form, or homogeneous\n- Maxima–minima word problem (volume, area, cost, distance)\n- Shortest distance between two skew lines / image of a point in a line\n- Relations and functions: prove one-one and onto\n- Probability: Bayes' theorem (occasionally placed in Section D instead of C)\n\n### Where the 4-mark case studies come from\n\nThree case studies, and historically they cluster hard:\n\n1. **Probability** — a Bayes / total-probability story (factories, machines, students, diseases).\n2. **Application of derivatives** — a maxima–minima story (a box, a window, a wire cut in two, cost).\n3. **Linear programming, 3D geometry, or a differential-equation growth/decay story** — this third\n   slot is the variable one.\n\nEach case study has 2–3 parts, usually `2 + 2` or `1 + 1 + 2`, with an internal choice in the last part.\n\n---\n\n## 2. Physics (Code 042)\n\n**Theory 70 marks · Practical 30 marks · 3 hours**\n\n### Unit-wise weightage (official)\n\nCBSE publishes Physics weightage in **paired units**. That pairing is itself information: it tells\nyou the board balances marks across the pair, not chapter by chapter.\n\n| Units | Chapters | Marks |\n| --- | --- | --- |\n| I. Electrostatics + II. Current Electricity | 1. Electric Charges and Fields · 2. Electrostatic Potential and Capacitance · 3. Current Electricity | 16 |\n| III. Magnetic Effects of Current and Magnetism + IV. Electromagnetic Induction and Alternating Currents | 4. Moving Charges and Magnetism · 5. Magnetism and Matter · 6. Electromagnetic Induction · 7. Alternating Current | 17 |\n| V. Electromagnetic Waves + VI. Optics | 8. Electromagnetic Waves · 9. Ray Optics and Optical Instruments · 10. Wave Optics | **18** |\n| VII. Dual Nature of Radiation and Matter + VIII. Atoms and Nuclei | 11. Dual Nature of Radiation and Matter · 12. Atoms · 13. Nuclei | 12 |\n| IX. Electronic Devices | 14. Semiconductor Electronics | 7 |\n| | **Total** | **70** |\n\nTwo things follow immediately:\n\n- **Optics is the largest single block.** Ray Optics alone typically carries ~10 of those 18 marks.\n  It is the last chapter you should ever leave incomplete.\n- **Semiconductor Electronics is 7 marks from one short chapter with a small syllabus.** It is the\n  highest marks-per-hour chapter in the paper. Students skip it because it is last in the book;\n  that is a free 7 marks handed away.\n\n### Paper design\n\n33 questions, five sections, no overall choice (internal choice in Sections B–E).\n\n| Section | Questions | Type | Marks each | Total |\n| --- | --- | --- | --- | --- |\n| A | 1–12 | MCQ | 1 | 12 |\n| A | 13–16 | Assertion–Reason | 1 | 4 |\n| B | 17–21 | Very Short Answer | 2 | 10 |\n| C | 22–28 | Short Answer | 3 | 21 |\n| D | 29–30 | Case-study based | 4 | 8 |\n| E | 31–33 | Long Answer | 5 | 15 |\n| | **33** | | | **70** |\n\n### Practical / internal assessment (30)\n\n| Component | Marks |\n| --- | --- |\n| Two experiments (one from each section) | 7 + 7 = 14 |\n| Practical record (experiments + activities) | 5 |\n| One activity from any section | 3 |\n| Investigatory project | 3 |\n| Viva on experiments, activities and project | 5 |\n\n### Where the 5-markers come from\n\nSection E is three questions, and CBSE almost always spreads them across three *different* blocks —\ntypically one from Electrostatics/Current Electricity, one from Magnetism/EMI/AC, and one from\nOptics. Each is usually \"derivation + application\" or \"derivation + numerical\".\n\nThe recurring pool:\n\n- Ray optics: lens/mirror formula derivation, refraction through a prism, compound microscope or\n  astronomical telescope (magnification + ray diagram)\n- Wave optics: Young's double slit — fringe width derivation; single-slit diffraction\n- AC: series LCR circuit with phasor diagram, impedance, resonance; transformer\n- EMI: AC generator, self/mutual inductance, motional emf\n- Moving charges: Biot–Savart applications (loop axis), Ampere's law (solenoid/toroid),\n  moving coil galvanometer, force between parallel currents\n- Electrostatics: Gauss's law applications (shell, wire, sheet), capacitor with dielectric, energy stored\n- Current electricity: Wheatstone bridge, metre bridge, drift velocity → Ohm's law\n\n### Where the 4-mark case studies come from\n\nTwo case studies, four sub-parts each carrying 1 mark, or 3 + 1. The reliable sources are Ray\nOptics (a lens/mirror or human-eye passage), Semiconductor Electronics (a diode/rectifier passage),\nCurrent Electricity (cells, internal resistance) and Photoelectric Effect (a graph passage).\n\n---\n\n## 3. Deleted topics — do not study these\n\nThese were removed in the rationalised syllabus and have **not** been asked since. Verify against\nthe current-year CBSE syllabus PDF at the start of the session, but as of the 2025-26 and 2026-27\ndocuments, all of the following are out.\n\n### Mathematics\n\n| Chapter | Deleted |\n| --- | --- |\n| 1. Relations and Functions | Composition of functions, invertible functions, binary operations |\n| 2. Inverse Trigonometric Functions | Graphs of inverse trig functions, elementary properties (the `2 tan⁻¹x` identities etc.) |\n| 3. Matrices | Elementary row/column operations, inverse by elementary operations, existence of non-zero matrices whose product is the zero matrix, proof of uniqueness of inverse |\n| 4. Determinants | Properties of determinants (the evaluate-by-properties questions), minors/cofactors as a standalone topic beyond what is needed for adjoint |\n| 5. Continuity & Differentiability | Rolle's theorem, Lagrange's Mean Value Theorem and their geometric interpretation |\n| 6. Application of Derivatives | Tangents and normals, approximations, rate of change of *bodies* framing beyond simple rates |\n| 7. Integrals | Definite integral as a limit of a sum; some special integral forms |\n| 8. Application of Integrals | Area between two curves (only area under simple curves, and area between a line and a circle/parabola/ellipse, remain) |\n| 9. Differential Equations | Formation of a differential equation whose general solution is given; equations reducible to homogeneous form |\n| 10. Vector Algebra | Scalar triple product |\n| 11. Three Dimensional Geometry | **All plane topics** — equation of a plane, angle between two planes, angle between a line and a plane, distance of a point from a plane, coplanarity of lines |\n| 12. Linear Programming | Diet / transportation / manufacturing problem *types* as named categories; problems with more than three non-trivial constraints |\n| 13. Probability | Variance and standard deviation of a random variable; Bernoulli trials and the Binomial distribution |\n\n> **The two that trip students up most:** planes are gone from 3D Geometry, and the Binomial\n> distribution is gone from Probability. Older question banks, YouTube playlists and second-hand\n> notes are full of both. If a practice paper asks you the equation of a plane or `nCr p^r q^(n-r)`,\n> it is an old paper.\n\n### Physics\n\n| Chapter | Deleted |\n| --- | --- |\n| 2. Electrostatic Potential and Capacitance | Van de Graaff generator |\n| 3. Current Electricity | Potentiometer (theory **and** practical), carbon resistors and colour code |\n| 4. Moving Charges and Magnetism | Cyclotron |\n| 5. Magnetism and Matter | Magnetic susceptibility and permeability, hysteresis, electromagnets and permanent magnets, para/dia/ferro treated quantitatively |\n| 7. Alternating Current | LC oscillations |\n| 10. Wave Optics | Resolving power of microscope and telescope, validity of ray optics, polarisation by scattering |\n| 13. Nuclei | Radioactivity — alpha, beta, gamma decay, decay law, half-life and mean life |\n| 14. Semiconductor Electronics | Zener diode and voltage regulator, optoelectronic devices (LED, photodiode, solar cell), transistors, transistor as amplifier/oscillator, logic gates |\n\n> **Consequence for Ch 14:** what remains is small and highly predictable — energy bands, intrinsic\n> vs extrinsic semiconductors, p-n junction formation, diode I–V characteristics, and diode as a\n> half-wave / full-wave rectifier. Seven marks, five topics. Learn it in a weekend.\n\n---\n\n## 4. The marking scheme, and how marks are actually awarded\n\nThis is the part no textbook tells you.\n\n**CBSE marks answers against a step-list, not against the final answer.** The marking scheme for a\n5-mark derivation might read: diagram ½, statement of the law ½, setting up the expression 1,\nalgebra 2, final result 1. Which means:\n\n1. **A correct final answer with no working scores a fraction of the marks.** Show the steps.\n2. **A wrong final answer with correct method scores most of the marks.** Never leave a numerical\n   blank because you cannot finish it — write the formula, substitute, and go as far as you can.\n3. **Diagrams and labels carry independent marks.** A ray diagram in Optics, a phasor diagram in AC,\n   a circuit diagram, a feasible-region graph in LP, a shaded-area sketch in Application of\n   Integrals — each is worth ½ to 1 mark *on its own*, awarded even if the rest is wrong. Draw it\n   even when the question does not explicitly say \"draw\".\n4. **Units carry marks in Physics.** A numerical answer without a unit typically loses ½ mark. So\n   does an answer with the wrong unit.\n5. **Vector answers must look like vectors.** In Maths, if the answer is a vector and you write it\n   without the arrow/î ĵ k̂ form, expect to lose the last mark.\n6. **\"State\" vs \"Derive\" vs \"Explain\" are different instructions.** *State* wants the statement, one\n   or two lines, no derivation — do not waste eight minutes deriving. *Derive* wants every algebraic\n   step. *Explain* wants reasoning in words plus, usually, a diagram.\n\n**Time budget.** 3 hours for 80 marks (Maths) is ~2 min/mark with 20 minutes spare; 3 hours for 70\nmarks (Physics) is ~2.3 min/mark with 25 minutes spare. Spend the 15-minute reading time marking\nwhich internal-choice option you will attempt, and which order you will attempt sections in.\n\n**Order to attempt.** Not 1 → 38. Do the section you are strongest in first to bank marks and settle\nnerves — for most students that is Section A (MCQs) then Section D/E (the long ones, while you are\nfresh), then B and C. Attempt every numerical you have a formula for, even partially.\n\n---\n\n## 5. Answer-sheet discipline\n\n- Write the question number in the margin, exactly as on the paper. Marks are lost every year to\n  mis-numbered answers.\n- If you attempt a question and then attempt the internal-choice alternative too, **cross out the\n  one you don't want**. Otherwise the examiner marks the first one, whichever that was.\n- Start each answer on a new line, not a new page — but do leave two blank lines between answers.\n- Box or underline every final answer.\n- Never use pencil except for diagrams and graphs.\n- Rough work goes on the last page, marked \"Rough work\" — not in the margins."},{"id":"plan","title":"Study Plans","blurb":"Three plans by time remaining, plus the error-log habit","lock":["body"]},{"id":"answer","title":"How to Answer","blurb":"Answer templates for every question type in the paper","lock":["body"]},{"id":"pyqm","title":"What Repeats · Maths","blurb":"Topic-by-topic frequency and P1/P2/P3 priorities","lock":["body"]},{"id":"pyqp","title":"What Repeats · Physics","blurb":"Topic-by-topic frequency and P1/P2/P3 priorities","lock":["body"]},{"id":"pyqi","title":"Reading the Frequency Tables","blurb":"What the frequency bands mean, and the caveats","body":"## What was analysed\n\nThe frequency tables in this folder describe recurring **question types** in the CBSE Class 12\nboard papers for Mathematics (041) and Physics (042) across roughly the last decade — the\n2015 → 2025 window, including the multiple sets (Delhi / Outside Delhi / Compartment) that CBSE\nissues each year, and the official sample paper for each session.\n\n## How to read the frequency column\n\nEvery table has a **Freq** column with one of four bands:\n\n| Band | Meaning | What to do |\n| --- | --- | --- |\n| **Every year** | Appeared in essentially every session, usually in every set | Must be automatic. Practise until you don't think. |\n| **8–9/10** | Appeared in 8 or 9 of the last 10 sessions | Treat as compulsory. |\n| **5–7/10** | Appeared about every other year | Learn it properly; don't drill it to death. |\n| **2–4/10** | Occasional — often as an MCQ or a sub-part | Know the formula and the idea. Don't spend a week on it. |\n\nThe **Marks** column gives where the question type normally sits (1 / 2 / 3 / 4 / 5), which tells you\nhow deep to go. A \"2–4/10, 1 mark\" topic needs a formula and nothing more. A \"every year, 5 marks\"\ntopic needs the full derivation on demand.\n\n## Caveats — read these\n\n1. **These bands are pattern estimates, not a machine count.** They are built from the recurring\n   structure of CBSE papers and marking schemes, not from an automated parse of PDF papers in this\n   repo. Treat them as a well-informed prioritisation, not as a published statistic. If you want\n   hard counts, download the last 10 years of papers from cbseacademic.nic.in and tally them\n   yourself against these tables — that exercise is itself excellent revision, and any correction\n   you find should be edited straight into these files.\n\n2. **The syllabus was rationalised in 2023-24.** Papers from 2015–2022 contain questions on topics\n   that are now deleted — planes in 3D Geometry, the Binomial distribution, potentiometer,\n   transistors and logic gates, radioactivity, tangents and normals, and more. These tables cover\n   only what is **still in the syllabus**; a deleted topic that used to appear every year is simply\n   absent here. When you practise from an old paper, cross out the deleted questions first. The full\n   deletion list is in [`../docs/00-exam-blueprint.md`](../docs/00-exam-blueprint.md) §3.\n\n3. **Frequency is not the same as importance-per-hour.** A topic asked every year for 1 mark\n   deserves less of your time than a topic asked every other year for 5. Read the Freq and Marks\n   columns together. The \"Priority\" column in each table already combines them.\n\n4. **High frequency is a floor, not a ceiling.** CBSE deliberately includes unfamiliar\n   application-style questions each year, and the shift to competency-based questions has increased\n   that. Never study *only* the high-frequency list — it gets you to about 65–70%, not beyond.\n\n## Priority column\n\n**P1** — highest return. Do these first, and do them completely.\n**P2** — core. Needed for a good score.\n**P3** — do after P1 and P2 are solid.\n\nIf you are on the 30-day plan, do P1 across both subjects and stop.\n\n## Files\n\n- [`pyq-frequency-maths.md`](pyq-frequency-maths.md)\n- [`pyq-frequency-physics.md`](pyq-frequency-physics.md)"},{"i न है\" से: स्वतुल्य, सममित **और** संक्रामक।\n\nवह अंतिम प्रकार, जो तीनों में पास हो, **तुल्यता संबंध** है, और इसे ठीक से समझना उपयोगी है क्योंकि वह कुछ\nकाम का करता है। तुल्यता संबंध समुच्चय को सदैव परस्पर अतिव्यापी न होने वाले समूहों में काट देता है।\n\"वही जन्मदिन\" मानवता को 366 समूहों में बाँट देता है। \"3 से भाग देने पर वही शेषफल\" पूर्णांकों को तीन में।\nकोई छूटता नहीं, कोई एक साथ दो समूहों में नहीं होता। वे समूह **तुल्यता वर्ग** हैं, और वर्ग **क्या हैं** यह\nबता पाना ही सामान्य 3-अंकीय प्रश्न है।\n\nइस अध्याय के आधे अंक दिए गए संबंध पर उन तीन गुणों की जाँच से आते हैं, और भरोसेमंद विधि यह है: प्रत्येक गुण\nके लिए या तो उसे सामान्य रूप से सिद्ध कीजिए, या एक प्रति-उदाहरण दीजिए। एक प्रति-उदाहरण पूरा उत्तर है — आगे\nकुछ समझाने की आवश्यकता नहीं। सबसे अधिक अंक \"संक्रामक नहीं है\" कह देने पर कटते हैं, जब दोषी त्रिक का नाम\nनहीं लिया जाता।\n\nअब **फलन**। फलन एक ऐसा संबंध है जिस पर एक अतिरिक्त प्रतिबंध है: हर निवेश को ठीक एक ही निर्गत मिले। वेंडिंग\nमशीन एक फलन है — B4 दबाइए और आपको हमेशा वही चीज़ मिलेगी। दो शब्द बताते हैं कि फलन अपने लक्ष्य समुच्चय को\nकैसे भरता है। **एकैकी (one-one)** का अर्थ है दो भिन्न निवेशों का निर्गत एक नहीं — कोई भी दो बार नहीं छुआ\nगया। **आच्छादक (onto)** का अर्थ है लक्ष्य में कुछ छूटा नहीं — हर चीज़ कम-से-कम एक बार छुई गई। जो दोनों हो\nवह **एकैकी आच्छादक (bijection)** है, और यही व्युत्क्रम होने की शर्त है: यदि दो निवेश एक ही निर्गत देते, तो\nआपको पता न चलता किस पर लौटें, और यदि कोई कभी छुआ न गया, तो लौटने के लिए कुछ ही न होता।\n\nचित्र यह रखिए — बाएँ समुच्चय से दाएँ समुच्चय की ओर तीर। एकैकी का अर्थ है कोई दो तीर एक ही बिंदु पर न\nउतरें। आच्छादक का अर्थ है दाईं ओर कोई बिंदु खाली न रहे। इसे एक बार खींच लीजिए और आप दोनों में कभी नहीं\nउलझेंगे।\n\nवास्तविक फलनों पर एकैकी की व्यावहारिक जाँच दो तरह से होती है — बीजगणित से: मानिए f(a) = f(b) और दिखाइए\na = b; या कलन से: जो फलन सदा वर्धमान है (पूरे अंतराल में f′ > 0) वह कोई मान दोहरा नहीं सकता, अतः एकैकी है।\nयह दूसरा रास्ता तेज़ है और कम प्रयोग होता है। आच्छादक के लिए वास्तविक परिसर की सहप्रांत से तुलना कीजिए;\nफलन आच्छादक तभी है जब दोनों बराबर हों — इसीलिए ℝ से ℝ पर f(x) = x² आच्छादक नहीं है (वह ऋणात्मक मान कभी\nनहीं देता), पर यदि आप सहप्रांत [0, ∞) घोषित कर दें तो आच्छादक है।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: संबंध एवं फलन कक्षा 12](https://www.youtube.com/results?search_query=relations+and+functions+class+12+maths+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/search?page_search_query=relations%20and%20functions%20class%2012) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 1, अध्याय 1 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh101.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — NCERT प्रश्नावली, फिर NCERT Exemplar अध्याय 1। बोर्ड ये प्रश्न लगभग\n  अक्षरशः NCERT से पूछता है, इसलिए पहले वही पूरे कीजिए।","m2":"sin 30° = ½। तो किस कोण की ज्या ½ है? उत्तर: 30°। यही उलटा प्रश्न प्रतिलोम त्रिकोणमितीय फलन है —\nsin⁻¹(½) = 30°, या रेडियन में π/6। संकेतन दुर्भाग्यपूर्ण है: sin⁻¹ का अर्थ 1/sin **नहीं** है। उसका अर्थ है\n\"वह कोण जिसकी ज्या है\"।\n\nपर उस सीधे-से प्रश्न में एक असली समस्या छिपी है, और पूरा अध्याय उसी को हल करने के लिए है। किस कोण की ज्या\n½ है? 150° की भी। और 390° की। और 510° की। अनंत कोणों की। फलन को एक प्रश्न के अनेक उत्तर देने की अनुमति नहीं\nहै, अतः जैसा है वैसा sin⁻¹ फलन ही नहीं है।\n\nसमाधान है — एक बार और सदा के लिए तय कर लेना कि कौन-सा उत्तर लौटाया जाएगा। ज्या के लिए हम सहमत हैं कि सदा\n**[−π/2, π/2]** का कोण लौटाया जाएगा — अतः sin⁻¹(½) = π/6, बस; और sin⁻¹(−½) = −π/6, 330° नहीं। वह तय किया\nगया परिसर **मुख्य मान शाखा** है, और हर प्रतिलोम फलन की अपनी है:\n\n- sin⁻¹ [−π/2, π/2] में कोण लौटाता है\n- cos⁻¹ [0, π] में कोण लौटाता है\n- tan⁻¹ (−π/2, π/2) में कोण लौटाता है\n\nये भिन्न क्यों हैं? क्योंकि परिसर ऐसा खंड होना चाहिए जिस पर मूल फलन अपने को दोहराता न हो, और कोज्या का\nस्वाभाविक ऐसा खंड 0 से π तक चलता है जबकि ज्या का शून्य के दोनों ओर फैला है। व्यावहारिक परिणाम पर ध्यान\nदीजिए, जो इस अध्याय में अंक कटने का सबसे बड़ा कारण है: **cos⁻¹ कभी ऋणात्मक कोण नहीं लौटाता।** अतः\ncos⁻¹(−½) 2π/3 है, −π/3 नहीं। ज्या और स्पर्शज्या आपको ऋणात्मक देंगे; कोज्या नहीं देगी।\n\nयह एक बिंदु पक्का कर लीजिए और अध्याय के बहुत-से प्रश्न यंत्रवत् हो जाते हैं। सामान्य एक-अंकीय प्रश्न होता\nहै \"sin⁻¹(−1/√2) का मुख्य मान ज्ञात कीजिए\", और विधि सदा वही तीन चरण है: वह संदर्भ कोण खोजिए जिसकी ज्या\n1/√2 है (वह π/4 है), चिह्न तय कीजिए, फिर उत्तर को सही शाखा के भीतर बैठाइए। ज्या के लिए ऋण निवेश का अर्थ\nऋण उत्तर, अतः −π/4। यदि cos⁻¹(−1/√2) होता, तो उत्तर [0, π] में रहना ही चाहिए, अतः 3π/4।\n\nदो सर्वसमिकाएँ पक्की जान लेने योग्य हैं क्योंकि वे लगातार आती हैं: sin⁻¹x + cos⁻¹x = π/2, और\ntan⁻¹x + cot⁻¹x = π/2। दोनों वही ज्यामितीय बात कहती हैं — समकोण त्रिभुज में दो शेष कोण मिलकर एक समकोण बनाते\nहैं।\n\nदूसरी भरोसेमंद तकनीक है **प्रतिस्थापन**, और यह भद्दे व्यंजकों को आसान बना देती है। जहाँ √(1 − x²) दिखे,\nवहाँ x = sin θ रखिए; मूल cos θ बन जाता है और पूरा व्यंजक आमतौर पर सिमट जाता है। जहाँ 1 + x² हो, वहाँ\nx = tan θ। कठिन 3-अंकीय प्रश्नों का मानक रास्ता यही है, और यही युक्ति आप समाकलन में फिर उपयोग करेंगे।\n\nपाठ्यक्रम-विस्तार पर एक चेतावनी: इस अध्याय में पहले tan⁻¹x + tan⁻¹y जैसे योग-सूत्रों की लंबी सूची होती थी।\nउसका बहुत भाग हटाया गया है। ऐसे सूत्र रटने से पहले इस अध्याय का §1 देखिए — परीक्षा-योग्य मूल है: मुख्य मान,\nहर फलन का प्रांत और परिसर, दोनों पूरक सर्वसमिकाएँ, और साधारण प्रतिस्थापन।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: प्रतिलोम त्रिकोणमितीय फलन कक्षा 12](https://www.youtube.com/results?search_query=inverse+trigonometric+functions+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/search?page_search_query=inverse%20trigonometric%20functions) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 1, अध्याय 2 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh102.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — यहाँ NCERT की प्रश्नावली असामान्य रूप से प्रतिनिधि है; हर प्रश्न कीजिए,\n  फिर प्रतिस्थापन वाले प्रश्नों के लिए NCERT Exemplar अध्याय 2।","m3":"**आव्यूह (matrix)** संख्याओं की एक सारणी है, और गणित इसकी चिंता इसलिए करता है कि बहुत-सी वास्तविक समस्याएँ\nपहले से ही सारणी के आकार में आती हैं। तीन दुकानें, चार उत्पाद, प्रत्येक की मात्रा: वह 3 × 4 का आव्यूह है।\nकीमतों को 4 × 1 आव्यूह लिखिए और एक गुणन से आपको हर दुकान का कुल बिल मिल जाता है। सारणियाँ किसी नए प्रकार की\nसंख्या नहीं हैं — वे नियमों के एक समूह से बहुत-सी संख्याएँ एक साथ सँभालने का तरीका हैं।\n\n**कोटि (order)** ठीक रखना नींव है: पहले पंक्तियाँ, फिर स्तंभ। 3 × 4 आव्यूह में तीन पंक्तियाँ और चार स्तंभ\nहैं, और अवयव a₂₃ पंक्ति 2, स्तंभ 3 पर बैठा है। जब तक स्वतः न हो जाए, हर बार \"पंक्ति, स्तंभ\" ज़ोर से कहिए;\nइस अध्याय की टाली जा सकने वाली त्रुटियों का बड़ा भाग यही उलट-फेर है।\n\nजोड़ सरल और नीरस है: मेल खाते अवयव जोड़ दीजिए, और यह तभी चलता है जब दोनों आव्यूहों का आकार समान हो। किसी\nसाधारण संख्या से गुणा भी उतना ही सरल है: हर अवयव गुणा हो जाता है।\n\n**दो आव्यूहों का गुणन** वहाँ है जहाँ अध्याय वास्तव में आरंभ होता है, और यह किसी का पहला अनुमान नहीं होता।\nआप मेल खाते अवयव गुणा **नहीं** करते। बल्कि, उत्तर के पंक्ति i और स्तंभ j वाले अवयव के लिए आप पहले आव्यूह की\nपंक्ति i और दूसरे आव्यूह का स्तंभ j लेते हैं, उन्हें पद-दर-पद गुणा करते हैं, और जोड़ देते हैं। अतः पंक्ति\nऔर स्तंभ की लंबाई समान होनी चाहिए — इसलिए **AB का अस्तित्व तभी है जब A के स्तंभ B की पंक्तियों के बराबर\nहों**, और उत्तर में A की पंक्तियाँ और B के स्तंभ होते हैं। कुछ भी गणना करने से पहले यह जाँच लीजिए।\n\nयह परिभाषा मनमानी लगती है, जब तक आप न देखें कि वह किस काम की है: आव्यूह वास्तव में एक **रूपांतरण** है, जैसे\n\"30° घुमाओ और 2 गुना खींचो\", और आव्यूहों का गुणन एक रूपांतरण के बाद दूसरा करना है। इसीलिए नियम पंक्तियों को\nस्तंभों से जोड़ता है, और इसीलिए **साधारणतः AB ≠ BA**। घुमाकर खींचना, खींचकर घुमाने के समान नहीं है। यही गुण\nआव्यूहों को साधारण संख्याओं से सबसे अधिक अलग करता है, और इसकी जाँच करने वाले प्रश्न आम हैं। इससे दो और\nआश्चर्य निकलते हैं: A या B में से कोई भी शून्य न होते हुए भी AB शून्य आव्यूह हो सकता है, और आप निरस्त नहीं\nकर सकते — AB = AC से B = C नहीं मिलता।\n\n**परिवर्त (transpose)**, A′ या Aᵗ, आव्यूह को उसके विकर्ण के परितः पलट देता है, पंक्तियों को स्तंभ बनाते\nहुए। दो विशेष स्थितियाँ मायने रखती हैं। **सममित** आव्यूह पलटने से नहीं बदलता (A′ = A), अतः वह विकर्ण के\nपरितः दर्पण-प्रतिबिंब है। **विषम सममित** आव्यूह पलटकर अपना ही ऋण बन जाता है (A′ = −A), और इससे हर विकर्ण\nअवयव शून्य होना अनिवार्य हो जाता है — क्योंकि हर एक को अपने ही ऋण के बराबर होना है। यह अंतिम निष्कर्ष एक\nप्रिय एक-अंकीय प्रश्न है। सावधानी से याद रखने योग्य एक नियम है (AB)′ = B′A′: क्रम उलट जाता है।\n\nदो परिणाम इस अध्याय के अंकों का बड़ा भाग बनाते हैं और तथ्य के रूप में जानने योग्य हैं। कोई भी वर्ग आव्यूह\nअद्वितीय रूप से एक सममित और एक विषम सममित भाग में बँट जाता है, ½(A + A′) + ½(A − A′) — स्वयं जाँचिए कि पहला\nसममित और दूसरा विषम सममित है। और व्युत्क्रम निकालने का **प्रारंभिक पंक्ति संक्रिया** वाला रास्ता: A के साथ\nतत्समक आव्यूह लिखिए, और A को तत्समक बनाने के लिए जो कीजिए वही तत्समक पर भी कीजिए; वह जो बन जाए, वही A⁻¹ है।\n\nदो आदतें किसी भी सूत्र से अधिक अंक बचाएँगी। काम करते समय हर आव्यूह के ऊपर उसकी कोटि लिख लीजिए, जिससे असंभव\nगुणनफल पाँच मिनट बरबाद करने से पहले पकड़ा जाए। और जब प्रश्न A² = A या A² = I जैसा कोई संबंध दे, तो गणना के\nबजाय प्रतिस्थापन आज़माइए — लगभग सदा वही छोटा अभीष्ट रास्ता होता है।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: आव्यूह कक्षा 12](https://www.youtube.com/results?search_query=matrices+class+12+maths+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/math/precalculus/x9e81a4f98389efdf:matrices) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 1, अध्याय 3 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh103.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — NCERT Exemplar अध्याय 3, फिर सममित/विषम सममित विभाजन और प्रारंभिक\n  संक्रियाओं के अभ्यास के लिए RD Sharma।","m4":"हर वर्ग आव्यूह से आप एक संख्या निकाल सकते हैं जो कुछ आवश्यक बात बताती है, और वह संख्या है **सारणिक\n(determinant)**। इसका वास्तविक अर्थ यह है — और यह जान लेने पर पूरा अध्याय एक सूत्र में बँध जाता है।\n\n2 × 2 आव्यूह एकांक वर्ग को एक समांतर चतुर्भुज में बदल देता है। सारणिक उस समांतर चतुर्भुज का **क्षेत्रफल**\nहै। 3 × 3 आव्यूह एकांक घन को एक तिरछे बक्से में बदलता है, और सारणिक उसका **आयतन** है। अतः सारणिक नापता है\nकि आव्यूह जगह को कितना खींचता है।\n\nइससे तुरंत वह एक तथ्य समझ आता है जिस पर बाकी सब टिका है: **det A = 0 का अर्थ है कि आव्यूह ने जगह को चपटा\nकर दिया।** समांतर चतुर्भुज एक रेखा में सिमट गया, बक्सा एक समतल में। और जो एक बार चपटा हो गया उसे आप\nअन-चपटा नहीं कर सकते — सूचना सदा के लिए चली गई। इसीलिए शून्य सारणिक वाले आव्यूह का व्युत्क्रम नहीं होता, और\nइसीलिए जिस समीकरण-निकाय का सारणिक शून्य है उसका अद्वितीय हल नहीं होता। यह रटने का नियम नहीं: चपटा होने का\nपरिणाम है।\n\nव्यावहारिक रूप से आप 3 × 3 सारणिक को किसी पंक्ति या स्तंभ के अनुदिश **सहखंडों (cofactors)** से प्रसारित\nकरते हैं — प्रत्येक अवयव गुणा वह छोटा 2 × 2 सारणिक जो उसकी पंक्ति और स्तंभ हटाने पर बचता है, और चिह्न\n+ − + के शतरंज-प्रतिरूप में बदलते हुए। दो सलाह तुरंत फल देती हैं: उस पंक्ति या स्तंभ के अनुदिश प्रसार\nकीजिए जिसमें सबसे अधिक शून्य हों, क्योंकि हर शून्य एक पूरा पद मार देता है; और याद रखिए कि आप किसी पंक्ति का\nगुणज दूसरी पंक्ति में जोड़ सकते हैं और मान नहीं बदलेगा — इससे आप आरंभ करने से पहले वे शून्य बना सकते हैं।\nजो विद्यार्थी हर बार आँख मूँदकर पहली पंक्ति से प्रसार करते हैं, वे तीन गुना गणित करते हैं और तीन गुना चूक\nकरते हैं।\n\n**सहखंडज (adjoint)** सहखंडों का आव्यूह है, परिवर्तित; और उसका प्रयोजन यह सर्वसमिका है\nA · adj A = |A| I। भाग दीजिए और व्युत्क्रम मिल जाता है: **A⁻¹ = adj A / |A|**, इसीलिए व्युत्क्रम ठीक तब\nहोता है जब |A| ≠ 0। परिवर्त वाले चरण में इस अध्याय की सबसे आम त्रुटि छिपी है — सहखंड आव्यूह निकालकर उसे\nपलटना भूल जाना।\n\nसारणिक तीन शीर्षों से **त्रिभुज का क्षेत्रफल** भी देता है, उनके निर्देशांकों की 3 × 3 सरणी के सारणिक के आधे\nके रूप में। और चूँकि शून्य क्षेत्रफल वाला त्रिभुज एक सरल रेखा पर तीन बिंदु है, वही सारणिक शून्य रखकर\n**संरेखता (collinearity)** की जाँच बन जाती है। यह बार-बार आने वाला एक-अंकीय प्रश्न है और यहाँ भी क्षेत्रफल\nवाली व्याख्या ही काम कर रही है।\n\nअध्याय का प्रतिफल है युगपत् समीकरण हल करना। **क्रेमर नियम** प्रत्येक अज्ञात को सारणिकों के अनुपात के रूप\nमें देता है, और **आव्यूह विधि** निकाय को AX = B लिखकर X = A⁻¹B के रूप में हल करती है। बोर्ड आव्यूह विधि\nको प्रबलता से पसंद करता है — उसका 5-अंकीय प्रश्न आमतौर पर \"आव्यूह विधि से ये तीन समीकरण हल कीजिए\" होता है,\nऔर वह देखना चाहता है कि |A| निकाला गया, फिर adj A, फिर A⁻¹, फिर गुणन। चारों चरण दिखाइए; अंक उनमें बँटे होते\nहैं, इसलिए सही अंतिम उत्तर के साथ छोड़ा गया कार्य कम अंक पाता है।\n\nसंगति (consistency) का विश्लेषण एक निर्णय-वृक्ष के रूप में स्पष्ट कर लेना उपयोगी है, क्योंकि यह छोटा है\nऔर अक्सर पूछा जाता है। यदि |A| ≠ 0 तो ठीक एक हल है। यदि |A| = 0, तो (adj A)B देखिए: यदि वह शून्य आव्यूह\nनहीं है तो निकाय **असंगत** है — कोई हल नहीं, समतल एक-दूसरे से चूक जाते हैं। यदि वह शून्य है, तो निकाय संगत\nहै और **अनंत** हल हैं — समतल एक रेखा में मिलते हैं। दो वाक्य, तीन स्थितियाँ, और पूरे अंक।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: सारणिक कक्षा 12](https://www.youtube.com/results?search_query=determinants+class+12+maths+hindi+one+shot)\n- **सारणिक क्षेत्रफल क्यों है** — [3Blue1Brown का वीडियो](https://www.youtube.com/results?search_query=3blue1brown+essence+of+linear+algebra+determinant) (अंग्रेज़ी में)।\n  यहाँ पंद्रह मिनट लगाने पर यह अध्याय दस सूत्रों के बजाय एक विचार जैसा लगने लगेगा।\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 1, अध्याय 4 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh104.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — NCERT Exemplar अध्याय 4; फिर 5-अंकीय समीकरण-निकाय वाला प्रकार तब तक\n  अभ्यास कीजिए जब तक चारों चरण स्वतः न हो जाएँ, क्योंकि वह आना लगभग निश्चित है।","m5":"**सांतत्य (continuity)** का गणितीय अर्थ है \"आप इसे कलम उठाए बिना खींच सकते हैं।\" वास्तव में इससे अधिक कुछ\nनहीं। कोई फलन किसी बिंदु पर संतत है यदि वहाँ कोई छलाँग न हो, कोई छिद्र न हो, और अनंत की ओर अचानक उड़ान न हो।\n\nइसे ठीक-ठीक कहने के लिए आप उस बिंदु पर तीन चीज़ें जाँचते हैं: फलन वहाँ वास्तव में क्या मान लेता है, और वह\nबाईं ओर से किसकी ओर **बढ़ता** है, और दाईं ओर से किसकी ओर। यदि तीनों एक हैं, तो ग्राफ़ वहाँ से चिकनाई से\nगुज़रता है और फलन संतत है। यदि बाएँ और दाएँ के अभिगमन भिन्न हैं, तो वहाँ छलाँग है। यदि वे परस्पर सहमत हैं\nपर फलन के मान से नहीं, तो वहाँ एक छिद्र है और पास में एक आवारा बिंदु। यही पूरी जाँच है, और इसीलिए प्रश्नपत्र\nका हर सांतत्य प्रश्न एक जैसा दिखता है: बायाँ पक्ष सीमा, दायाँ पक्ष सीमा, और मान निकालिए, फिर बराबर रखिए।\nजब प्रश्न कहता है \"k ज्ञात कीजिए जिससे f संतत हो\", वह ठीक यही करने और k हल करने को कह रहा है।\n\n**अवकलनीयता (differentiability)** अधिक कड़ी माँग है: केवल यह नहीं कि टूट न हो, बल्कि यह भी कि **कोना** न\nहो। अवकलज ग्राफ़ की प्रवणता है, अतः किसी बिंदु पर उसके अस्तित्व के लिए वहाँ ग्राफ़ की एक निश्चित प्रवणता\nहोनी चाहिए। शून्य पर |x| सोचिए: पूर्णतः संतत — आप उसे कलम उठाए बिना खींच सकते हैं — पर वह एक तीखे V पर\nपहुँचता है। बाईं ओर से प्रवणता −1 है, दाईं ओर से +1, अतः कोई एक प्रवणता नहीं है और फलन वहाँ अवकलनीय नहीं\nहै। इससे अध्याय का सबसे महत्वपूर्ण एकतरफ़ा रास्ता मिलता है: **अवकलनीय होने से संतत होना सिद्ध होता है, पर\nसंतत होने से अवकलनीय होना नहीं**, और x = 0 पर |x| वह प्रति-उदाहरण है जिसे उद्धृत करना चाहिए। हर वर्ष इसका\nकोई रूप पूछा जाता है।\n\nअध्याय का शेष भाग अवकलज निकालने की मशीनरी है, और यह देख लेना उपयोगी है कि हर नियम **किस लिए** है, उन्हें\nअलग-अलग जादुई मंत्र मानने के बजाय।\n\n**शृंखला नियम (chain rule)** फलन के भीतर फलन सँभालता है। बाहर वाले का अवकलज लीजिए, फिर भीतर वाले के अवकलज\nसे गुणा कीजिए। sin(x²) का अवकलज cos(x²) × 2x हो जाता है। यदि कभी संदेह हो कि अवकलन पूरा हुआ या नहीं, तो\nपूछिए कि कुछ अभी भी भीतर धँसा हुआ है क्या; पूरे अध्याय की सबसे आम त्रुटि एक परत पहले रुक जाना है।\n\n**अस्पष्ट अवकलन (implicit differentiation)** उन समीकरणों के लिए है जिन्हें आप सुलझा नहीं सकते, जैसे\nx² + y³ = xy। आपको y के लिए हल करने की आवश्यकता नहीं। हर पद का x के सापेक्ष अवकलन कीजिए, यह याद रखते हुए कि\ny भी गुप्त रूप से x का फलन है, अतः जिसमें y है वह शृंखला नियम से dy/dx उत्पन्न करेगा। फिर dy/dx वाले पद\nइकट्ठे कीजिए और भाग दे दीजिए। पूरी तकनीक यही है।\n\n**लघुगणकीय अवकलन** घातों और गुणनफलों का उपकरण है — x^x, या (sin x)^(cos x), या गुणनखंडों का लंबा गुणनफल।\nपहले दोनों पक्षों का लघुगणक लीजिए, जो घातों को गुणकों में और गुणनफलों को योगों में बदल देता है, और तभी\nअवकलन कीजिए। इसके बिना x^x लगभग असाध्य है; इसके साथ तीन पंक्तियाँ।\n\n**प्राचलिक (parametric)** अवकलन उन वक्रों के लिए है जो x = f(t), y = g(t) के रूप में दिए हों: dy/dt और\ndx/dt अलग-अलग निकालिए, फिर भाग दीजिए। और प्राचलिक वक्र के **द्वितीय** अवकलज के लिए याद रखिए कि आपको dy/dx\nका t के सापेक्ष अवकलन करके फिर dx/dt से भाग देना है — वह अंतिम भाग भूल जाना इस अध्याय के 3-अंकीय प्रश्नों\nकी सबसे बार-बार होने वाली चूक है।\n\n**रोले** और **माध्यमान प्रमेय (MVT)** यहाँ अलग तरह के हैं — गणना नहीं, अस्तित्व के कथन। MVT कहता है कि\nकिसी भी अंतराल में, बीच के किसी बिंदु पर, तात्क्षणिक प्रवणता औसत प्रवणता के बराबर होनी ही चाहिए। यदि आपने\nएक घंटे में औसत 60 km/h चली, तो किसी क्षण आपका स्पीडोमीटर ठीक 60 पढ़ रहा था। रोले प्रमेय वही विशेष स्थिति\nहै जहाँ आप वहीं समाप्त करते हैं जहाँ से चले थे, अतः औसत प्रवणता शून्य है, अतः कहीं स्पर्श रेखा समतल है।\nदोनों प्रश्नों में अंक मुख्यतः इस पर मिलते हैं कि आपने निष्कर्ष लगाने से पहले **शर्तें सत्यापित कीं** —\nबंद अंतराल पर सांतत्य, खुले अंतराल पर अवकलनीयता। उन्हें स्पष्ट रूप से लिखिए।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: सांतत्य तथा अवकलनीयता कक्षा 12](https://www.youtube.com/results?search_query=continuity+and+differentiability+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/math/differential-calculus/dc-limits) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 1, अध्याय 5 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh105.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — खंडशः फलनों के सांतत्य वाले प्रकार के लिए NCERT Exemplar अध्याय 5, और\n  लघुगणकीय तथा प्राचलिक अवकलन के अभ्यास के लिए RD Sharma — इनमें केवल दोहराव से लाभ होता है।","m6":"अब आप अवकलज निकालना जानते हैं। यह अध्याय इस बारे में है कि अवकलज **किस काम का** है, और उत्तर है: वह बताता\nहै कि कोई चीज़ किस दर से बदल रही है, और कहाँ बदलना बंद कर देती है। ये दो तथ्य अध्याय के हर प्रश्न को ढँक\nलेते हैं।\n\n**परिवर्तन की दर** सीधा पाठ है। dy/dx का अर्थ है \"x में एक इकाई परिवर्तन पर y कितनी तेज़ी से बदलता है\"।\nयदि गुब्बारे की त्रिज्या 2 cm/s की दर से बढ़ रही है, तो आयतन कितनी तेज़ी से बढ़ रहा है? आयतन त्रिज्या पर\nनिर्भर है, त्रिज्या समय पर, अतः उन्हें शृंखला में जोड़िए: dV/dt = (dV/dr) × (dr/dt)। संबंधित-दर का हर\nप्रश्न वही शृंखला है, और विधि कभी नहीं बदलती — जो दिया है उसे दर के रूप में लिखिए, राशियों को जोड़ने वाला\nसूत्र लिखिए, उसका समय के सापेक्ष अवकलन कीजिए, मान रखिए। एक आदत जो सबसे अधिक त्रुटियाँ रोकती है — चलते-चलते\nहर दर के पास उसका मात्रक लिख दीजिए; यदि उत्तर के मात्रक ग़लत हैं, तो शृंखला ग़लत है।\n\n**वर्धमान और ह्रासमान** अवकलज का चिह्न है, और इसे भौतिक रूप में देखना उपयोगी है। यदि प्रवणता धनात्मक है तो\nदाईं ओर बढ़ते हुए ग्राफ़ ऊपर जा रहा है, अतः फलन वर्धमान है; ऋण प्रवणता, नीचे, ह्रासमान। अतः जहाँ फलन\nवर्धमान है वह खोजने के लिए: अवकलन कीजिए, जहाँ अवकलज शून्य है वे बिंदु खोजिए (ये सीमा-बिंदु हैं), और उनके\nबीच के प्रत्येक अंतराल में अवकलज का चिह्न जाँचिए। उत्तर अंतरालों के रूप में लिखिए, और चिह्न का अनुमान लगाने\nके बजाय उसे जाँचिए — (x − 2)² जैसा गुणनखंड कभी ऋणात्मक नहीं होता, अतः वह चिह्न-परिवर्तन ही नहीं कराता, और\nइसे भूल जाना एक चिरपरिचित जाल है।\n\n**उच्चतम और निम्नतम** अध्याय का हृदय है और उसके 5-अंकीय प्रश्न का स्रोत। पहाड़ी की चोटी पर ज़मीन क्षण भर\nके लिए समतल होती है; घाटी के तल पर भी। अतः उच्चतम और निम्नतम दोनों वहाँ आते हैं जहाँ f′(x) = 0 — इसीलिए वे\nबिंदु खोज लेना आधा ही काम है; फिर आपको तय करना है कि कौन-सा प्रकार मिला है। दो तरीके: देखिए कि अवकलज धन से\nऋण होता है (उच्चतम, क्योंकि आप चढ़ रहे थे और अब उतर रहे हैं) या ऋण से धन (निम्नतम); या द्वितीय अवकलज लीजिए,\nजहाँ f″ < 0 का अर्थ है वक्र नीचे की ओर मुड़ रहा है, अतः उच्चतम, और f″ > 0 का अर्थ है ऊपर की ओर, अतः निम्नतम।\nद्वितीय अवकलज परीक्षण तेज़ है पर f″ = 0 होने पर कुछ नहीं कहता, और तब चिह्न-परिवर्तन पर लौटना पड़ता है।\n\nएक बात हर वर्ष लोगों को पकड़ लेती है: **बंद अंतराल** पर सबसे बड़ा मान वहाँ होना आवश्यक नहीं जहाँ प्रवणता\nशून्य है। वह सिरे पर हो सकता है — कल्पना कीजिए वह पहाड़ी जो अभी चढ़ ही रही थी कि सड़क समाप्त हो गई। अतः\n[a, b] पर निरपेक्ष उच्चतम और निम्नतम के लिए f का मान हर क्रांतिक बिंदु पर **और** दोनों सिरों पर निकालिए,\nऔर सूची की तुलना कीजिए। सिरे भूल जाना पक्का अंक-नुकसान है।\n\n**शब्द-समस्याएँ** वहीं हैं जहाँ अंक वास्तव में हैं, और वे सब एक ही प्रक्रिया हैं। कोई चीज़ अधिकतम या न्यूनतम\nकरनी है — चादर से काटे खुले बक्से का आयतन, वृत्त के अंतर्गत आयत का क्षेत्रफल, नियत आयतन वाले बेलनाकार डिब्बे\nकी लागत। एक चर लीजिए, अभीष्ट राशि को उसके पदों में लिखिए, प्रश्न में दिए प्रतिबंध से हर दूसरे चर को हटाइए\nजिससे आपके पास **एक** चर का फलन बचे, फिर अवकलन और परीक्षण कीजिए। वह हटाने वाला चरण ही सोचने का स्थान है;\nउसके बाद का कलन दिनचर्या है। मानक आकारों पर इसका अभ्यास कीजिए — गोले के अंतर्गत शंकु, शंकु के अंतर्गत बेलन,\nचादर से बक्सा, नियत परिमाप की खिड़की — क्योंकि बोर्ड इन्हें दोहराता है।\n\nदो चीज़ें आप निश्चिंत होकर पीछे रख सकते हैं: अवकल का उपयोग करते **सन्निकटन**, और पुरानी स्पर्श-रेखा तथा\nअभिलंब वाली बहुत-सी सामग्री, युक्तिसंगत पाठ्यक्रम में हटाई जा चुकी है। उन पर समय लगाने से पहले इस अध्याय का\n§1 देखिए।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: अवकलज के अनुप्रयोग कक्षा 12](https://www.youtube.com/results?search_query=application+of+derivatives+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/math/differential-calculus/dc-context-app) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 1, अध्याय 6 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh106.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — NCERT की उच्चतम-निम्नतम प्रश्नावली और उसका विविध प्रश्नावली बोर्ड की\n  प्रिय शब्द-समस्याओं की सूची के सबसे निकट है; Exemplar पर जाने से पहले उनमें से हर प्रश्न कीजिए।","m7":"समाकलन उलटी दिशा में चलाया गया अवकलन है, और इसका परिणाम साफ़ कह देना चाहिए: अवकलन एक प्रक्रिया है, समाकलन\nएक खोज। x⁵ का अवकलन करने के लिए आप एक नियम लगाते हैं और काम पूरा। किसी चीज़ का समाकलन करने के लिए आपको\n**पहचानना** पड़ता है कि वह किसका अवकलज हो सकती है। इसीलिए यह पुस्तक का सबसे बड़ा अध्याय है, इसीलिए इसमें\nसबसे अधिक अंक हैं, और इसीलिए इससे पार जाने का एक ही रास्ता है — प्रश्न करना, पढ़ना नहीं।\n\nसमाकलन नाम की दो अलग चीज़ें हैं, और उन्हें गड्डमड्ड करने से बहुत अनावश्यक कष्ट होता है।\n\n**अनिश्चित समाकल** प्रति-अवकलज है: ∫2x dx = x² + C। उत्तर एक **फलन** है। +C इसलिए है कि x² + 7 का अवकलन\nभी 2x देता है, अतः एक पूरा परिवार है जो केवल एक अचर से भिन्न है। +C छोड़ देना पूरे प्रश्नपत्र में कटने वाला\nसबसे आम एक अंक है।\n\n**निश्चित समाकल** ∫ₐᵇ f(x) dx एक **संख्या** है, और इसका अर्थ है a से b के बीच ग्राफ़ के नीचे का क्षेत्रफल।\nदोनों को जोड़ने वाला चकित करने वाला तथ्य — कलन की आधारभूत प्रमेय — यह है कि आप वह क्षेत्रफल प्रति-अवकलन\nकरके और घटाकर निकाल सकते हैं: F(b) − F(a)। क्षेत्रफल और प्रवणता असंबद्ध लगते हैं, और यह खोज कि वे परस्पर\nप्रतिलोम संक्रियाएँ हैं, वही चीज़ है जिसने कलन को गणित का सबसे शक्तिशाली उपकरण बनाया।\n\nअध्याय का शेष भाग एक औज़ार-पेटी है, और यह जानना कि **कौन-सी समस्या किस औज़ार को माँगती है** किसी एक औज़ार\nको जानने से अधिक महत्वपूर्ण है। पहचानने का तरीका यह है।\n\n**प्रतिस्थापन** उलटा शृंखला नियम है। ऐसा टुकड़ा खोजिए जिसका अवकलज भी समाकल्य में बैठा हो — यदि आपको f(g(x))\nऔर g′(x) साथ दिखें, तो u = g(x) रखिए और समाकल सिमट जाएगा। ∫2x·cos(x²) dx इसलिए बनता है कि 2x, x² का अवकलज\nहै। सबसे पहले सदा यही आज़माना चाहिए।\n\n**खंडशः समाकलन (by parts)** दो असमान चीज़ों के **गुणनफल** के लिए है — बहुपद गुणा त्रिकोणमितीय फलन, या किसी\nचीज़ का लघुगणक से गुणनफल। ∫u dv = uv − ∫v du। पूरी कला यह चुनने में है कि किस गुणनखंड को u कहें, और मार्गदर्शक\nहै **ILATE**: प्रतिलोम त्रिकोणमितीय, लघुगणक, बीजीय, त्रिकोणमितीय, चरघातांकी — जो इस सूची में पहले आए वही u\nबनेगा। कारण यह है कि u का अवकलन होता है, और आप वह गुणनखंड चाहते हैं जो अवकलन पर **सरल** हो जाए। लघुगणक 1/x\nबन जाता है; बहुपद की एक घात घट जाती है; चरघातांकी कभी सरल नहीं होता, अतः वही दूसरा होना चाहिए।\n\n**आंशिक भिन्न** बहुपदों के अनुपात के लिए है। भिन्न को सरल टुकड़ों में बाँटिए जिनके हर वे गुणनखंड हों, और\nप्रत्येक का समाकलन कीजिए — आमतौर पर लघुगणक में। एक बार व्यवस्थित हो जाने पर यह यंत्रवत् है; व्यवस्था इस\nपर निर्भर है कि गुणनखंड रैखिक, पुनरावृत्त या द्विघात हैं, और वे तीनों रूप सीखने योग्य हैं।\n\n**विशेष रूप** वे हैं जिन्हें देखते ही पहचानना चाहिए, क्योंकि वे किसी और तरीके से नहीं झुकेंगे: 1/(x² + a²),\n1/(x² − a²), 1/√(a² − x²) और उनके सजातीय। ऐसे लगभग आठ हैं, वे सूत्र पत्रक में हैं, और उन्हें रटना अनिवार्य\nहै। त्रिकोणमितीय प्रतिस्थापन उन्हें निकाल देता है, पर परीक्षा में आप उन्हें तत्क्षण चाहते हैं।\n\nअंत में, **निश्चित समाकल के गुणधर्म** अध्याय का छिपा शॉर्टकट हैं, और अच्छे परीक्षार्थी औसत से इसी बात पर\nअलग होते हैं कि वे इनका उपयोग करते हैं या नहीं। सबसे मूल्यवान है ∫₀ᵃ f(x) dx = ∫₀ᵃ f(a − x) dx: x को a − x\nसे बदलने पर एक असंभव समाकल्य अक्सर ऐसा बन जाता है जो मूल के साथ कट जाए, और 3- तथा 5-अंकीय प्रश्नों का एक\nपूरा वर्ग इसी के आसपास बनाया जाता है। सम/विषम गुणधर्म — विषम फलन का ∫₋ₐᵃ शून्य होता है — एक पृष्ठ भर के काम\nको एक पंक्ति में समेट सकता है। पीसना शुरू करने से पहले इन्हें **खोजना** सीखिए।\n\nइस अध्याय को छोटा रास्ता देने की कोशिश न कीजिए। एक महीने तक सप्ताह में तीस प्रश्न — यही ईमानदार कीमत है,\nऔर वह चुकती है: समाकलन + समाकलनों के अनुप्रयोग + अवकल समीकरण मिलकर प्रश्नपत्र का लगभग एक-चौथाई हैं।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: समाकलन कक्षा 12](https://www.youtube.com/results?search_query=integrals+class+12+maths+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/math/integral-calculus/ic-integration) (अंग्रेज़ी में)\n- **क्षेत्रफल और प्रवणता प्रतिलोम क्यों हैं** — [3Blue1Brown](https://www.youtube.com/results?search_query=3blue1brown+essence+of+calculus+integration+fundamental+theorem) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 2, अध्याय 7 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh201.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — पहले NCERT, सारी प्रश्नावलियाँ, फिर मात्रा के लिए RD Sharma। यही एक अध्याय\n  है जहाँ किए गए प्रश्नों की कुल संख्या आपके अंक की सबसे अच्छी भविष्यवाणी है।","m8":"आप जानते हैं कि निश्चित समाकल वक्र के नीचे का क्षेत्रफल देता है। यह छोटा अध्याय उसी एक तथ्य को सावधानी से\nलगाना है। कलन खंड में यह सबसे आसान अंक हैं, और यहीं सबसे अधिक अंक टाली जा सकने वाली त्रुटियों में गँवाए\nजाते हैं।\n\nमूल चाल: वक्र y = f(x), x-अक्ष, और ऊर्ध्वाधर रेखाओं x = a तथा x = b के बीच का क्षेत्रफल ∫ₐᵇ f(x) dx है।\nकभी दूसरी दिशा में समाकलन करना अधिक सुविधाजनक होता है — दो क्षैतिज रेखाओं के बीच ∫ f(y) dy — और कौन-सा चुनें\nयह जानना आधा कौशल है। वही चुनिए जिससे सीमा एक साफ़ अकेला फलन बन जाए।\n\nतीन चीज़ें ग़लत होती हैं, और तीनों टाली जा सकती हैं।\n\n**पहली, क्षेत्र का चित्र बनाइए।** सदा, तब भी जब प्रश्न आरेख न माँगे। चित्र के बिना आप नहीं देख सकते कि\nकौन-सा वक्र ऊपर है, नहीं देख सकते कि क्षेत्र दो टुकड़ों में है, और नहीं देखेंगे कि वक्र आपके अंतराल के भीतर\nएक-दूसरे को काट रहे हैं। चित्र में नब्बे सेकंड लगते हैं और वही पूरे अंक वाले उत्तर और विश्वसनीय दिखते ग़लत\nउत्तर के बीच का अंतर है। परीक्षक चित्र के लिए अंक भी देते हैं।\n\n**दूसरी, क्षेत्रफल कभी ऋणात्मक नहीं होता।** x-अक्ष के नीचे समाकल ऋणात्मक आता है, क्योंकि वहाँ f(x) ऋणात्मक\nहै। समाकल सच बोल रहा है — वह **चिह्नित** क्षेत्रफल है — पर प्रश्न ने क्षेत्रफल माँगा था, अतः आपको निरपेक्ष\nमान लेना है। यदि क्षेत्र अक्ष के दोनों ओर फैला है, तो कटान बिंदु पर समाकल को बाँटिए और दोनों टुकड़ों के\nनिरपेक्ष मान जोड़िए। सीधे पार समाकलन करके छोटी संख्या न लिख दीजिए: भाग आपस में कट गए और आपका उत्तर निरर्थक\nहै। यह इस अध्याय का चिरपरिचित जाल है, और अपने कार्य में \"अक्ष के नीचे का क्षेत्र, निरपेक्ष मान लेते हुए\"\nलिख देना उपयोगी है जिससे परीक्षक देख सके कि आप जानते थे।\n\n**तीसरी, सीमाएँ वक्रों से लीजिए, प्रश्न से नहीं।** दो वक्रों के **बीच** के क्षेत्रफल की सीमाएँ वहाँ हैं\nजहाँ वे मिलते हैं, अतः पहले f(x) = g(x) हल कीजिए, और क्षेत्रफल ∫ (ऊपर वाला − नीचे वाला) dx है। ग़लत क्रम में\nघटाने पर आपको सही उत्तर का ऋण मिलेगा। अपने चित्र से पढ़िए कि कौन ऊपर है।\n\nमानक आकार बार-बार आते हैं, और परीक्षा से पहले हर एक से मिल लेना लाभदायक है: वृत्त (x² + y² = a²), परवलय\n(y² = 4ax), दीर्घवृत्त (x²/a² + y²/b² = 1), और वे क्षेत्र जो इनमें किसी को कोई रेखा काटकर बनाती है। वृत्त\nया दीर्घवृत्त के लिए सममिति का लाभ उठाइए — एक चतुर्थांश निकालकर चार से गुणा कर दीजिए; यह तेज़ है और ग़लत\nहोने की गुंजाइश कम। समाकल ∫√(a² − x²) dx अँगुलियों पर होना चाहिए, क्योंकि वृत्त और दीर्घवृत्त का लगभग हर\nप्रश्न उसी पर सिमटता है।\n\nअध्याय लगभग 5 अंकों का है और समाकलन में लगने वाले समय के एक अंश में सध जाता है। इसे बाद में देखने वाली चीज़\nके बजाय पक्के अंक की तरह लीजिए।\n\n**कहीं और से भी सीखिए**\n\n- **वीडियो व्याख्यान** — [खोजें: समाकलनों के अनुप्रयोग क्षेत्रफल कक्षा 12](https://www.youtube.com/results?search_query=application+of+integrals+area+under+curve+class+12+hindi+one+shot)\n- **इंटरैक्टिव पाठ और अभ्यास** — [खान अकादमी](https://www.khanacademy.org/math/integral-calculus/ic-int-app) (अंग्रेज़ी में)\n- **जिस पुस्तक से प्रश्नपत्र बनता है** — [NCERT गणित भाग 2, अध्याय 8 (हिन्दी PDF)](https://ncert.nic.in/textbook/pdf/lhmh202.pdf)\n- **अतिरिक्त प्रश्नों के लिए** — NCERT की प्रश्नावली और विविध प्रश्नावली इस अध्याय के लिए लगभग पूर्ण हैं;\n  बोर्ड इन आकारों से आगे बहुत कम जाता है।","m9":"**अवकल समीकरण** वह समीकरण है जिसमें अवकलज हो। परिभाषा यह है, पर इससे बात का महत्व कम आँका जाता है। देखिए\nऐसा समीकरण आपको क्या बता रहा है: वह यह नहीं कहता कि कोई राशि **क्या है**, वह कहता है कि वह **कैसे बदलती\nहै**। और दुनिया के बारे में हम जो बहुत कुछ जानते हैं, वह ठीक इसी रूप में आता है।\n\n\"गरम चाय का प्याला उस दर से ठंडा होता है जो इस पर निर्भर है कि वह कमरे से कितना अधिक गरम है।\" कोई आपको 4\nबजे का तापमान नहीं देता; वे आपको दर के बारे में एक नियम देते हैं। उसे dT/dt = −k(T − T₀) लिखिए और आपके पास\nएक अवकल समीकरण है। उसे हल करने का अर्थ है वास्तविक तापमान को समय के फलन के रूप में वापस पाना। जीवाणुओं की\nवृद्धि, रेडियोसक्रिय क्षय, वायु-प्रतिरोध के साथ गिरता पिंड, संधारित्र पर आवेश — ये सब पहले दर के रूप में\nकहे जाते हैं। यह अध्याय नियम से उत्तर तक पहुँचने का रास्ता है।\n\nपहले दो नाम, क्योंकि हर प्रश्न उन्हें
