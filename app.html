niquely\nis the direction **perpendicular** to it, called the **normal**. So a plane is \"all the points whose\ndisplacement from a known point is perpendicular to n\", which in dot-product language is\n(r − a)·n = 0, and rearranged, r·n = d. In cartesian form ax + by + cz = d, and the numbers a, b, c\n*are* the normal's components — read them straight off. That single observation converts most plane\nquestions into vector arithmetic.\n\nNow every standard question is one of these ideas with a dot or cross product attached, and the\npattern is worth seeing:\n\n- **Angle between two lines** — the angle between their directions, so a dot product of the two b's.\n- **Angle between two planes** — the angle between their *normals*, so a dot product of the two n's.\n- **Angle between a line and a plane** — here is the trap. Dotting the line's direction with the\n  plane's normal gives you the angle from the normal, not from the plane. The angle you want is its\n  complement, so use **sin θ** where you would otherwise use cos. Every year someone loses this mark.\n- **Perpendicular lines** — directions dot to zero. **Parallel lines** — directions cross to zero.\n- **Parallel planes** — same normal (up to a scale factor).\n\n**Distances** are the other family, and there the cross product does the work, because a cross\nproduct measures the perpendicular part. The shortest distance from a point to a line, and the\nshortest distance between two **skew** lines — lines that neither meet nor run parallel, which only\nexist in three dimensions — both come out of the standard formulae in the formula sheet. For skew\nlines the numerator is a scalar triple product and the denominator is |b₁ × b₂|, and the whole thing\nis the projection of the gap between the lines onto the one direction perpendicular to both. Worth\nknowing as a formula; worth understanding as a shadow.\n\nPractical advice: this chapter is unusually formula-heavy, and the fastest way through it is not\nmemorising twelve formulae but recognising which of the five or six *situations* you are in. Read\nthe question and ask: is this a line or a plane, an angle or a distance? The formula follows from\nthat. And convert between vector and cartesian form fluently — questions often give you one and\nexpect the other, and that conversion is nothing more than reading off components.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: three dimensional geometry class 12 one shot](https://www.youtube.com/results?search_query=three+dimensional+geometry+class+12+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: lines and planes in 3D](https://www.khanacademy.org/search?page_search_query=lines%20planes%20three%20dimensional%20geometry)\n- **The book the paper is set from** — [NCERT Maths Part II, Chapter 11 (PDF)](https://ncert.nic.in/textbook/pdf/lemh205.pdf)\n- **For extra problems** — NCERT exercises are the closest match to the board's phrasing; then\n  Exemplar Chapter 11 for the skew-lines and image-of-a-point types.","s":{"scope":"### In the syllabus — **lines only**\n\n- **Direction cosines and direction ratios** of a line joining two points\n- **Cartesian and vector equations of a line**\n- **Skew lines**\n- **Shortest distance between two lines**\n- **Angle between two lines**"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"m12","subj":"maths","num":12,"title":"Linear Programming","unit":"Unit V · Linear Programming","unitMarks":5,"prio":1,"appear":"Unit V (5 marks) · Typical appearance: one 4- or 5-mark graphical question, plus sometimes a 1-mark corner-point MCQ. Completely templated — there is no excuse for losing marks here.","deleted":"- The named **problem types** as separate categories: diet problems, manufacturing problems,\n  transportation problems\n- Problems with **more than three** non-trivial constraints\n\n> **What \"three non-trivial constraints\" means for you.** Beyond x ≥ 0 and y ≥ 0 (the trivial ones),\n> you will never face more than three inequalities. That caps the feasible region at a small polygon\n> with at most five corner points. There is a hard ceiling on how difficult this question can be.","intro":"A factory can make chairs and tables. Each chair needs 2 hours of carpentry and 1 hour of polishing;\neach table needs 3 hours of carpentry and 1 of polishing. There are 60 carpentry hours and 24\npolishing hours available this week. A chair sells for a profit of ₹200 and a table ₹300. How many of\neach should you make?\n\nThat is a **linear programming** problem, and it is the entire chapter. Notice its shape: you want\nto maximise something (profit) subject to limits you cannot exceed (hours available). The word\n\"linear\" means everything is proportional — twice the chairs takes twice the hours and gives twice\nthe profit, with no bulk discounts or economies of scale. That assumption is what makes the problem\nsolvable by drawing.\n\nThe method has four steps and never varies.\n\n**Step 1 — name the variables.** Let x be the number of chairs and y the number of tables. Say so\nexplicitly in your answer; marks are given for it.\n\n**Step 2 — write the constraints as inequalities.** Carpentry: 2x + 3y ≤ 60. Polishing: x + y ≤ 24.\nAnd, because you cannot make a negative number of chairs, x ≥ 0 and y ≥ 0. Those last two are easy\nto forget and they matter — they are what confine you to one quadrant.\n\n**Step 3 — draw.** Each inequality is a half-plane: draw the boundary line, then decide which side\nsatisfies it (test the origin — it is usually quickest). The region satisfying *all* of them at once\nis the **feasible region**, and every point in it is a genuinely possible production plan. Shade it\nand label its corners.\n\n**Step 4 — evaluate at the corners.** Here is the theorem that makes this work, and it is worth\nknowing why rather than just using it. The profit function Z = 200x + 300y has straight parallel\ncontour lines. Slide such a line across a polygon and the last point it touches on the way out is\nalways a **corner** — never the middle of an edge, never the interior. So the maximum and minimum of\nZ must occur at vertices of the feasible region. You do not need to test infinitely many points;\nyou test four or five. Tabulate the corners and their Z values, and state which is the answer.\n\nTwo situations to be ready for, because the board tests them.\n\nAn **unbounded** region — one that stretches away without a closing edge. It may still have a\nminimum but no maximum, or the reverse. The check is honest and simple: if the region is unbounded in\nthe direction that increases Z, then no maximum exists, and you should say so rather than picking the\nlargest corner you happened to plot.\n\n**Ties.** If two adjacent corners give the same Z, then every point on the edge between them is\nequally optimal, and there are infinitely many solutions. Say that; do not choose one arbitrarily.\n\nThe chapter is worth around 5 marks, needs no memorised formulae, and is one of the highest\nmarks-per-hour in the paper — provided your graph is drawn on actual graph paper with the axes\nscaled and the corners labelled. Most marks lost here are lost to sloppy drawing, not to\nmisunderstanding.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: linear programming class 12 one shot](https://www.youtube.com/results?search_query=linear+programming+class+12+maths+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: graphing systems of inequalities](https://www.khanacademy.org/search?page_search_query=graphing%20systems%20of%20inequalities)\n- **The book the paper is set from** — [NCERT Maths Part II, Chapter 12 (PDF)](https://ncert.nic.in/textbook/pdf/lemh206.pdf)\n- **For extra problems** — the NCERT exercise is representative; note that the *formulation* of the\n  word problem is where the marks concentrate, so practise translating the story into inequalities\n  even when you do not finish the graph.","s":{"scope":"### In the syllabus\n\n- Introduction and related **terminology**: constraints, objective function, optimisation\n- **Graphical method** of solution for problems in **two variables**\n- **Feasible and infeasible regions** (bounded or unbounded)\n- Feasible and infeasible solutions; **optimal feasible solutions**\n- Restricted to **up to three non-trivial constraints**"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"m13","subj":"maths","num":13,"title":"Probability","unit":"Unit VI · Probability","unitMarks":8,"prio":1,"appear":"Unit VI (8 marks) · Typical appearance: one Bayes' theorem question worth 4–5 marks (essentially guaranteed) + one 2/3-mark conditional-probability question + an MCQ.","deleted":"- **Variance** and standard deviation of a random variable\n- **Bernoulli trials** and the **Binomial distribution** (no ⁿCᵣ pᵣ qⁿ⁻ᵣ)\n\n> **This is the deletion students miss most often.** The Binomial distribution used to be a\n> guaranteed question — \"find the probability of exactly 3 heads in 5 tosses\" — and it is now out of\n> syllabus, along with variance. Almost every second-hand note and old question bank still features\n> both prominently. The entire 8 marks now comes from the conditional-probability family plus the\n> mean of a random variable.","recall":"```\nCONDITIONAL:  P(A|B) = P(A∩B)/P(B),  P(B) ≠ 0        ← \"given\" goes in the DENOMINATOR\n              P(A′|B) = 1 − P(A|B)\n\nMULTIPLICATION: P(A∩B) = P(A)P(B|A) = P(B)P(A|B)\n                P(A∩B∩C) = P(A)P(B|A)P(C|A∩B)\n\nINDEPENDENT: P(A∩B) = P(A)P(B)  ⟺  P(A|B) = P(A)\n             P(at least one) = 1 − (1−P(A))(1−P(B))\n             independent ≠ mutually exclusive\n\nTOTAL PROBABILITY:  P(A) = Σ P(Eᵢ) P(A|Eᵢ)\n\nBAYES:  P(Eᵢ|A) = P(Eᵢ)P(A|Eᵢ) / Σⱼ P(Eⱼ)P(A|Eⱼ)\n        LAYOUT: define events → all priors → all likelihoods → formula → substitute\n\nRANDOM VARIABLE: Σpᵢ = 1 ;  Mean = E(X) = Σ xᵢpᵢ\n```","intro":"Most of this chapter is about one idea, and it is an idea that human intuition gets wrong almost\nevery time: **how new information should change what you believe.**\n\nHere is the standard illustration, and it is worth sitting with. A disease affects 1 person in 1000.\nA test for it is 99% accurate. You test positive. What is the chance you have the disease? Almost\neveryone says 99%. The right answer is about 9%. Out of 1000 people, one has the disease and tests\npositive; of the 999 healthy ones, 1% — about ten people — test positive anyway. So eleven people\ntest positive and only one is ill. The test is good; the disease is just rare, and rarity dominates.\n\nThat calculation is **Bayes' theorem**, and the chapter builds up to it.\n\n**Conditional probability** is the foundation: P(A|B), read \"the probability of A *given* B\", is the\nprobability of A once you know B has happened. Knowing B shrinks the world to just those outcomes\nwhere B is true, so you count A's share of that smaller world: P(A|B) = P(A∩B)/P(B). Drawing a card\nand being told it is a face card changes the odds it is a king from 4/52 to 4/12. Nothing has\nchanged about the card; what changed is what you know.\n\n**Independence** is the special case where the news is useless. A and B are independent if learning\nB tells you nothing about A, so P(A|B) = P(A), which rearranges into the test you will use:\n**P(A∩B) = P(A)·P(B)**. Two coin tosses are independent. Two cards drawn without replacement are\nnot, because the first draw changes what is left in the deck. Watch for the phrase \"with\nreplacement\" or \"without\" — it decides the whole question.\n\nThe **multiplication theorem** is that same relation used forwards, and the **total probability**\nrule is how you handle a situation that could have arisen by several routes: if a ball could have\ncome from bag A or bag B, the overall chance of it being red is the chance of each bag times the\nchance of red from that bag, added up. Then **Bayes' theorem** runs that argument *backwards* —\ngiven the ball is red, which bag did it probably come from? That reversal is the chapter's flagship\n5-mark question, and it always arrives dressed as a story: two machines and a defective item, three\nbags and a coloured ball, two doctors and a diagnosis. The wording changes; the structure never does.\n\nThere is a mechanical way to get these right that is worth adopting: **draw the tree**. Branches for\nthe possible sources with their prior probabilities, then branches for the observed outcome with its\nconditional probabilities, and multiply along each path. Bayes' theorem is then just \"the path I care\nabout, divided by all the paths that produce the observation\". Students who draw the tree get these\nright; students who reach for the formula mix up which probability is conditioned on which.\n\nThe last piece is the **random variable** and its **mean**. A random variable attaches a number to\neach outcome — the number of heads in three tosses, say — and its probability distribution lists the\nvalues with their probabilities. The mean, or expectation, is Σx·P(x): each value weighted by how\nlikely it is. It is the long-run average, and it need not be a value the variable can actually take —\nthe expected number of heads in three tosses is 1.5. Two checks before you go further: every\nprobability must be between 0 and 1, and they must sum to exactly 1. If your distribution table\nfails either test, stop and find the error.\n\nNote the scope: the binomial distribution and variance have been trimmed in the rationalised\nsyllabus. Check §1 of this chapter before studying them.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: probability class 12 one shot Bayes theorem](https://www.youtube.com/results?search_query=probability+class+12+maths+one+shot+bayes+theorem)\n- **Why Bayes' theorem is unintuitive** — [search: Bayes theorem 3Blue1Brown](https://www.youtube.com/results?search_query=bayes+theorem+3blue1brown).\n  The clearest visual explanation available, and it makes the disease example obvious.\n- **Interactive lessons and practice** — [Khan Academy: conditional probability and Bayes](https://www.khanacademy.org/math/statistics-probability/probability-library)\n- **The book the paper is set from** — [NCERT Maths Part II, Chapter 13 (PDF)](https://ncert.nic.in/textbook/pdf/lemh207.pdf)\n- **For extra problems** — NCERT exercises, then Exemplar Chapter 13. Do at least ten full Bayes\n  word problems with trees drawn; it is the highest-value single question type in the paper.","s":{"scope":"### In the syllabus\n\n- **Conditional probability**\n- **Multiplication theorem** on probability\n- **Independent events**\n- **Theorem of total probability**\n- **Bayes' theorem**\n- **Random variable** and its **probability distribution**\n- **Mean** of a random variable","brief":"### Conditional probability\n\nThe probability of A **given that** B has already occurred:\n\n```\n      P(A|B) = P(A ∩ B) / P(B)              provided P(B) ≠ 0\n```\n\nRead it as: restrict the sample space to B, and ask what fraction of B is also A.\n\n**Properties:**\n\n```\n      P(S|B) = P(B|B) = 1\n      P(A′|B) = 1 − P(A|B)\n      P((A ∪ C)|B) = P(A|B) + P(C|B) − P((A ∩ C)|B)\n```\n\n> **The one thing to keep straight:** P(A|B) and P(B|A) are different numbers. The **denominator is\n> whatever is given**. \"Given it is defective, find the probability it came from machine C\" has\n> \"defective\" in the denominator.\n\n### Multiplication theorem\n\nRearranging the definition:\n\n```\n      P(A ∩ B) = P(B) · P(A|B) = P(A) · P(B|A)\n```\n\nFor three events:\n\n```\n      P(A ∩ B ∩ C) = P(A) · P(B|A) · P(C|A ∩ B)\n```\n\nThis is what you use for \"drawing without replacement\": the probability changes at each draw, and\nyou multiply the conditional probabilities.\n\n### Independent events\n\nA and B are **independent** if the occurrence of one does not affect the other:\n\n```\n      P(A ∩ B) = P(A) · P(B)\n```\n\nEquivalently, P(A|B) = P(A) and P(B|A) = P(B).\n\n**If A and B are independent, so are:** A′ and B, A and B′, A′ and B′.\n\n**Independent ≠ mutually exclusive.** These are completely different ideas and the distinction is\nexamined:\n\n| | Mutually exclusive | Independent |\n| --- | --- | --- |\n| Definition | A ∩ B = ∅, so P(A ∩ B) = 0 | P(A ∩ B) = P(A)P(B) |\n| Meaning | they cannot both happen | one happening tells you nothing about the other |\n| Can both hold? | Only if P(A) = 0 or P(B) = 0 | |\n\nSo two events with non-zero probabilities that are mutually exclusive are **necessarily dependent** —\nif you know A happened, you know B did not. That is the standard MCQ.\n\n**Useful:** for independent A, B:\n\n```\n      P(A ∪ B) = P(A) + P(B) − P(A)P(B)\n      P(neither) = P(A′ ∩ B′) = (1 − P(A))(1 − P(B))\n      P(at least one) = 1 − P(neither)\n```\n\n### Theorem of total probability\n\nLet E₁, E₂, …, Eₙ be a **partition** of the sample space (mutually exclusive, exhaustive, each with\nnon-zero probability). Then for any event A:\n\n```\n      P(A) = P(E₁)P(A|E₁) + P(E₂)P(A|E₂) + … + P(Eₙ)P(A|Eₙ)\n           = Σ P(Eᵢ) P(A|Eᵢ)\n```\n\nIn words: to find the overall probability of A, go through each way the world could be, and weight\nthe conditional probability by how likely that way is.\n\n### Bayes' theorem\n\nSame setup. Then\n\n```\n                  P(Eᵢ) · P(A|Eᵢ)\n      P(Eᵢ|A) = ─────────────────────────\n                  Σⱼ P(Eⱼ) · P(A|Eⱼ)\n```\n\nThe denominator is exactly P(A) from the total probability theorem. So Bayes' theorem is:\n\n```\n      P(Eᵢ|A) = (that one term) / (sum of all the terms)\n```\n\n**Vocabulary that appears in questions:** P(Eᵢ) are the **prior** probabilities (before you observe\nA); P(Eᵢ|A) are the **posterior** probabilities (after).\n\n### The Bayes layout — use it every time\n\nThe reason students lose this question is disorganisation, not ignorance. Impose this structure:\n\n**Step 1 — Define the events**, with letters.\n\n```\n      E₁ : the item came from machine A\n      E₂ : the item came from machine B\n      E₃ : the item came from machine C\n      D  : the item is defective\n```\n\n**Step 2 — Write all the priors** P(E₁), P(E₂), P(E₃).\n\n**Step 3 — Write all the likelihoods** P(D|E₁), P(D|E₂), P(D|E₃).\n\n**Step 4 — Write the formula** with the required index.\n\n**Step 5 — Substitute and simplify.**\n\nLaid out this way it is structurally impossible to invert the conditional or to drop a term from the\ndenominator — the two ways this question is actually lost.\n\n### Random variables\n\nA **random variable** X is a real-valued function on the sample space of a random experiment.\n\nIts **probability distribution** is the table of values and their probabilities:\n\n| X = xᵢ | x₁ | x₂ | … | xₙ |\n| --- | --- | --- | --- | --- |\n| P(X = xᵢ) = pᵢ | p₁ | p₂ | … | pₙ |\n\n**The two conditions** every probability distribution must satisfy:\n\n```\n      pᵢ ≥ 0 for all i          and          Σ pᵢ = 1\n```\n\nChecking Σpᵢ = 1 is both a mark and your own error check. Do it.\n\n**Mean (expectation):**\n\n```\n      Mean = E(X) = μ = Σ xᵢ pᵢ\n```\n\nThe mean is also called the **expected value** or the **expectation** of X.\n\n> Variance is deleted, so you will not be asked for Σxᵢ²pᵢ − μ². If a practice question asks for it,\n> it is from an old paper.","pyq":"**Q1.** *(4 marks — the archetypal Bayes question)*\nBag I contains 3 red and 4 black balls; Bag II contains 5 red and 6 black balls. One ball is drawn\nat random from one of the bags, and it is found to be red. Find the probability that it was drawn\nfrom Bag II.\n\n**Q2.** *(5 marks)* A factory has three machines A, B and C, producing 25%, 35% and 40% of the total\noutput respectively. Of their outputs, 5%, 4% and 2% are defective. An item is drawn at random from\nthe total output and found to be defective. Find the probability that it was produced by machine C.\n\n**Q3.** *(3 marks)* A die is thrown twice and the sum of the numbers appearing is observed to be 6.\nWhat is the conditional probability that the number 4 has appeared at least once?\n\n**Q4.** *(2 marks)* A and B are independent events with P(A) = 0.3 and P(B) = 0.4. Find P(A ∪ B).\n\n**Q5.** *(4 marks)* Two cards are drawn successively **with replacement** from a well-shuffled deck\nof 52 cards. Find the probability distribution of the number of aces, and hence find its mean.\n\n**Q6.** *(3 marks)* An urn contains 5 red and 5 black balls. A ball is drawn at random, its colour\nis noted, and it is returned to the urn. Moreover, 2 additional balls of the colour drawn are put\ninto the urn, and then a ball is drawn at random. What is the probability that the second ball is\nred?\n\n**Q7.** *(2 marks)* If P(A) = 6/11, P(B) = 5/11 and P(A ∪ B) = 7/11, find P(A|B).\n\n**Q8.** *(1 mark, MCQ)* If A and B are two events such that P(A) ≠ 0 and P(B|A) = 1, then\n(a) A ⊂ B (b) B ⊂ A (c) B = ∅ (d) A = ∅\n\n**Q9.** *(3 marks)* Three cards are drawn successively **without replacement** from a pack of 52\ncards. Find the probability that all three are kings.\n\n**Q10.** *(4 marks, case study)* In a school, 40% of the students are girls and 60% are boys. It is\nknown that 5% of the girls and 8% of the boys are left-handed.\n(i) Find the probability that a randomly chosen student is left-handed.\n(ii) Given that a randomly chosen student is left-handed, find the probability that the student is a\ngirl.\n(iii) State which theorem you used in each part.\n\n**Q11.** *(2 marks)* A random variable X has the following probability distribution. Find k, and\nthen the mean of X.\n\n| X | 0 | 1 | 2 | 3 |\n| --- | --- | --- | --- | --- |\n| P(X) | k | 2k | 3k | 4k |\n\n**Q12.** *(1 mark, Assertion–Reason)*\n**A:** If two events are mutually exclusive with non-zero probabilities, they cannot be independent.\n**R:** For mutually exclusive events, P(A ∩ B) = 0.\n\n---","sol":"### Q1 — two bags, red ball drawn, which bag?\n\n**Step 1 — define events.**\n\n```\n      E₁ : the ball is drawn from Bag I\n      E₂ : the ball is drawn from Bag II\n      R  : the ball drawn is red\n```\n\n**Step 2 — priors.** One of the two bags is chosen at random, so\n\n```\n      P(E₁) = 1/2          P(E₂) = 1/2\n```\n\n**Step 3 — likelihoods.**\n\n```\n      Bag I  : 3 red out of (3 + 4) = 7 balls    ⟹   P(R|E₁) = 3/7\n      Bag II : 5 red out of (5 + 6) = 11 balls   ⟹   P(R|E₂) = 5/11\n```\n\n**Step 4 — Bayes' theorem.**\n\n```\n                        P(E₂) P(R|E₂)\n      P(E₂|R) = ───────────────────────────────\n                 P(E₁)P(R|E₁) + P(E₂)P(R|E₂)\n```\n\n**Step 5 — substitute.**\n\n```\n                     (1/2)(5/11)\n      P(E₂|R) = ──────────────────────────\n                 (1/2)(3/7) + (1/2)(5/11)\n```\n\nThe (1/2) cancels throughout:\n\n```\n                    5/11\n      P(E₂|R) = ─────────────\n                 3/7 + 5/11\n```\n\n```\n      3/7 + 5/11 = (33 + 35)/77 = 68/77\n```\n\n```\n      P(E₂|R) = (5/11) × (77/68) = (5 × 7)/68 = 35/68\n```\n\n```\nP(the ball came from Bag II | it is red) = 35/68          ≈ 0.515\n```\n\n*(Sanity check: Bag II's red fraction (5/11 ≈ 0.455) is slightly higher than Bag I's (3/7 ≈ 0.429),\nand the two bags were equally likely to start with, so the posterior for Bag II should come out a\nlittle above ½. It does: 35/68 ≈ 0.515 ✓)*\n\n### Q2 — three machines, defective item, which machine?\n\n**Step 1 — define events.**\n\n```\n      E₁ : item produced by machine A\n      E₂ : item produced by machine B\n      E₃ : item produced by machine C\n      D  : item is defective\n```\n\n**Step 2 — priors.**\n\n```\n      P(E₁) = 0.25          P(E₂) = 0.35          P(E₃) = 0.40\n```\n\n**Step 3 — likelihoods.**\n\n```\n      P(D|E₁) = 0.05        P(D|E₂) = 0.04        P(D|E₃) = 0.02\n```\n\n**Step 4 — Bayes' theorem.**\n\n```\n                            P(E₃) P(D|E₃)\n      P(E₃|D) = ───────────────────────────────────────────\n                 P(E₁)P(D|E₁) + P(E₂)P(D|E₂) + P(E₃)P(D|E₃)\n```\n\n**Step 5 — substitute.**\n\n```\n      P(E₁)P(D|E₁) = 0.25 × 0.05 = 0.0125\n      P(E₂)P(D|E₂) = 0.35 × 0.04 = 0.0140\n      P(E₃)P(D|E₃) = 0.40 × 0.02 = 0.0080\n                                   ────────\n      Denominator  =               0.0345\n```\n\n*(Note in passing: 0.0345 is P(D), the overall defective rate — that is the total probability\ntheorem, and it is often asked as a separate part.)*\n\n```\n      P(E₃|D) = 0.0080 / 0.0345 = 80/345 = 16/69\n```\n\n```\nP(machine C | defective) = 16/69          ≈ 0.232\n```\n\n### Q3 — die thrown twice, sum is 6, was a 4 shown?\n\n**Define events.**\n\n```\n      A : the number 4 appears at least once\n      B : the sum of the two numbers is 6\n```\n\n**List B.** The outcomes with sum 6:\n\n```\n      (1,5), (2,4), (3,3), (4,2), (5,1)          →  n(B) = 5\n```\n\n**List A ∩ B.** Which of those contain a 4?\n\n```\n      (2,4), (4,2)                                →  n(A ∩ B) = 2\n```\n\n**Compute.** All 36 outcomes are equally likely, so\n\n```\n      P(B) = 5/36          P(A ∩ B) = 2/36\n```\n\n```\n      P(A|B) = P(A ∩ B)/P(B) = (2/36)/(5/36) = 2/5\n```\n\n```\nP(a 4 appeared at least once | the sum is 6) = 2/5\n```\n\n> Once you have restricted to the five outcomes with sum 6, the answer is just \"2 out of 5\". Listing\n> the reduced sample space explicitly is the fastest and safest method for this question type.\n\n### Q4 — independent events, P(A ∪ B)\n\n```\n      P(A ∪ B) = P(A) + P(B) − P(A ∩ B)\n```\n\nSince A and B are **independent**, P(A ∩ B) = P(A)·P(B) = (0.3)(0.4) = 0.12.\n\n```\n      P(A ∪ B) = 0.3 + 0.4 − 0.12 = 0.58\n```\n\n### Q5 — probability distribution of the number of aces (with replacement)\n\nLet X = the number of aces drawn. Since the draws are **with replacement**, the two draws are\nindependent, and on each draw\n\n```\n      P(ace) = 4/52 = 1/13          P(not ace) = 12/13\n```\n\nX can be 0, 1 or 2.\n\n```\n      P(X = 0) = (12/13)(12/13) = 144/169\n\n      P(X = 1) = (1/13)(12/13) + (12/13)(1/13) = 24/169      [ace first, or ace second]\n\n      P(X = 2) = (1/13)(1/13) = 1/169\n```\n\n**Probability distribution:**\n\n| X | 0 | 1 | 2 |\n| --- | --- | --- | --- |\n| P(X) | 144/169 | 24/169 | 1/169 |\n\n**Check:** (144 + 24 + 1)/169 = 169/169 = 1 ✓\n\n**Mean:**\n\n```\n      E(X) = Σ xᵢ pᵢ = 0(144/169) + 1(24/169) + 2(1/169)\n           = (0 + 24 + 2)/169\n           = 26/169\n           = 2/13\n```\n\n```\nMean = 2/13          ≈ 0.154\n```\n\n*(Sensible: each draw gives an ace with probability 1/13, and there are two draws, so on average\n2/13 aces.)*\n\n### Q6 — urn with balls added\n\n**Define events.**\n\n```\n      R₁ : the first ball drawn is red          B₁ : the first ball drawn is black\n      R₂ : the second ball drawn is red\n```\n\n**Priors.** The urn starts with 5 red and 5 black, so 10 balls:\n\n```\n      P(R₁) = 5/10 = 1/2          P(B₁) = 5/10 = 1/2\n```\n\n**Likelihoods.** The ball drawn is returned, **and 2 more of the same colour are added**, so the urn\nthen has 12 balls.\n\n```\n      If R₁ occurred: 5 + 2 = 7 red and 5 black    ⟹   P(R₂|R₁) = 7/12\n      If B₁ occurred: 5 red and 5 + 2 = 7 black    ⟹   P(R₂|B₁) = 5/12\n```\n\n**Apply the total probability theorem:**\n\n```\n      P(R₂) = P(R₁)P(R₂|R₁) + P(B₁)P(R₂|B₁)\n            = (1/2)(7/12) + (1/2)(5/12)\n            = (7 + 5)/24\n            = 12/24\n```\n\n```\nP(the second ball is red) = 1/2\n```\n\n> A pleasing result: adding balls of the colour drawn does not change the probability that the next\n> ball is red, because the urn started symmetric. Worth stating as a remark — it shows understanding.\n\n### Q7 — find P(A|B)\n\n```\n      P(A ∪ B) = P(A) + P(B) − P(A ∩ B)\n⟹     7/11 = 6/11 + 5/11 − P(A ∩ B)\n⟹     P(A ∩ B) = 11/11 − 7/11 = 4/11\n```\n\n```\n      P(A|B) = P(A ∩ B)/P(B) = (4/11)/(5/11) = 4/5\n```\n\n### Q8 — P(B|A) = 1\n\n```\n      P(B|A) = P(A ∩ B)/P(A) = 1     ⟹     P(A ∩ B) = P(A)\n```\n\nIf the probability of A ∩ B equals the probability of A, then A contributes nothing outside B — i.e.\n**A ⊂ B**.\n\n**Answer: (a) A ⊂ B**\n\n*(Interpretation: whenever A happens, B is certain to happen. That means A is contained in B.)*\n\n### Q9 — three kings without replacement\n\n**Define events.**\n\n```\n      K₁ : the first card is a king\n      K₂ : the second card is a king\n      K₃ : the third card is a king\n```\n\nSince the draws are **without replacement**, use the multiplication theorem for three events:\n\n```\n      P(K₁ ∩ K₂ ∩ K₃) = P(K₁) · P(K₂|K₁) · P(K₃|K₁ ∩ K₂)\n```\n\n```\n      P(K₁) = 4/52                        [4 kings in 52 cards]\n      P(K₂|K₁) = 3/51                     [3 kings left in 51 cards]\n      P(K₃|K₁ ∩ K₂) = 2/50                [2 kings left in 50 cards]\n```\n\n```\n      P = (4/52)(3/51)(2/50) = 24/132600 = 1/5525\n```\n\n```\nP(all three cards are kings) = 1/5525          ≈ 0.000181\n```\n\n### Q10 — case study: left-handed students\n\n**Define events.**\n\n```\n      G : the student is a girl          B : the student is a boy\n      L : the student is left-handed\n```\n\n```\n      P(G) = 0.40          P(B) = 0.60\n      P(L|G) = 0.05        P(L|B) = 0.08\n```\n\n**(i) P(L) — by the theorem of total probability:**\n\n```\n      P(L) = P(G)P(L|G) + P(B)P(L|B)\n           = (0.40)(0.05) + (0.60)(0.08)\n           = 0.020 + 0.048\n           = 0.068\n```\n\n**P(a student is left-handed) = 0.068 = 17/250**\n\n**(ii) P(G|L) — by Bayes' theorem:**\n\n```\n                  P(G)P(L|G)          0.020\n      P(G|L) = ──────────────── = ───────────── = 20/68 = 5/17\n                     P(L)              0.068\n```\n\n**P(the student is a girl | left-handed) = 5/17 ≈ 0.294**\n\n**(iii)** Part (i) uses the **theorem of total probability**; part (ii) uses **Bayes' theorem**.\n\n*(Notice that 5/17 ≈ 0.294 is well below P(G) = 0.40 — knowing the student is left-handed makes\n\"girl\" less likely, because boys are left-handed at a higher rate. Sanity checks like this one are\nworth doing.)*\n\n### Q11 — find k and the mean\n\n**Use Σpᵢ = 1:**\n\n```\n      k + 2k + 3k + 4k = 1\n⟹     10k = 1\n⟹     k = 1/10\n```\n\n**Distribution:**\n\n| X | 0 | 1 | 2 | 3 |\n| --- | --- | --- | --- | --- |\n| P(X) | 1/10 | 2/10 | 3/10 | 4/10 |\n\n**Mean:**\n\n```\n      E(X) = 0(1/10) + 1(2/10) + 2(3/10) + 3(4/10)\n           = (0 + 2 + 6 + 12)/10\n           = 20/10\n           = 2\n```\n\n```\nk = 1/10 and Mean = 2\n```\n\n### Q12 — Assertion–Reason\n\n**A:** \"Mutually exclusive events with non-zero probabilities cannot be independent.\" **True.**\nIf mutually exclusive, P(A ∩ B) = 0. If also independent, P(A ∩ B) = P(A)P(B), which would force\nP(A)P(B) = 0, contradicting both being non-zero.\n\n**R:** \"For mutually exclusive events, P(A ∩ B) = 0.\" **True** — that is the definition.\n\n**Does R explain A?** Yes — A follows directly from R combined with the independence condition.\n\n**Answer: (a) Both A and R are true, and R is the correct explanation of A.**\n\n---","test":"Time: 50 minutes. Answers below.\n\n1. *(1)* If P(A) = 0.5, P(B) = 0.4 and P(A ∩ B) = 0.2, then P(A|B) is\n   (a) 0.4 (b) 0.5 (c) 0.2 (d) 0.8\n2. *(1)* If A and B are independent, P(A) = 1/2, P(B) = 1/3, then P(A ∩ B) is\n   (a) 5/6 (b) 1/6 (c) 2/3 (d) 1/5\n3. *(1)* For a probability distribution, Σpᵢ must equal\n   (a) 0 (b) 1 (c) n (d) any positive number\n4. *(2)* A coin is tossed three times. Find the probability of getting at least two heads.\n5. *(2)* If P(A) = 0.6, P(B) = 0.3 and A, B are independent, find P(neither A nor B).\n6. *(3)* Two dice are thrown. Given that the sum is 8, find the probability that one die shows a 2.\n7. *(3)* A bag contains 4 red and 6 white balls. Two balls are drawn without replacement. Find the\n   probability that both are red.\n8. *(4)* A random variable X has the distribution below. Find c and E(X).\n\n   | X | 1 | 2 | 3 | 4 | 5 |\n   | --- | --- | --- | --- | --- | --- |\n   | P(X) | c | 2c | 2c | 3c | c |\n\n9. *(5)* Of the students in a college, 60% reside in a hostel and 40% do not. Past records show that\n   30% of the hostellers and 20% of the day-scholars attain an A grade. One student is chosen at\n   random and has an A grade. What is the probability that the student is a hosteller?\n10. *(5)* Two groups are competing for the board positions of a corporation. The probabilities that\n    the first and second groups will win are 0.6 and 0.4. Further, if the first group wins, the\n    probability of introducing a new product is 0.7, and the corresponding probability if the second\n    group wins is 0.3. Find the probability that the new product was introduced by the second group.\n11. *(3)* A die is tossed twice. Find the probability distribution of the number of times a number\n    greater than 4 appears, and find its mean.\n12. *(2)* Three coins are tossed. Let A be \"at least two heads\" and B \"the first coin shows a head\".\n    Find P(A|B).\n13. *(2)* If A and B are events with P(A) = 0.4, P(B) = 0.8 and P(B|A) = 0.6, find P(A|B).\n\n### Answer key\n\n**1. (b) 0.5.** P(A|B) = 0.2/0.4 = 0.5.\n\n**2. (b) 1/6.** (1/2)(1/3).\n\n**3. (b) 1.**\n\n**4. 1/2.** Sample space has 8 outcomes. At least two heads: HHH, HHT, HTH, THH → 4/8 = 1/2.\n\n**5. 0.28.** P(A′ ∩ B′) = (1 − 0.6)(1 − 0.3) = (0.4)(0.7) = 0.28.\n\n**6. 2/5.** Outcomes with sum 8: (2,6), (3,5), (4,4), (5,3), (6,2) → 5 outcomes. Of these, those\ncontaining a 2: (2,6) and (6,2) → 2. So P = 2/5.\n\n**7. 2/15.** (4/10)(3/9) = 12/90 = 2/15.\n\n**8. c = 1/9, E(X) = 3.** Σp = c + 2c + 2c + 3c + c = 9c = 1 ⟹ c = 1/9.\nE(X) = [1(1) + 2(2) + 3(2) + 4(3) + 5(1)]/9 = (1 + 4 + 6 + 12 + 5)/9 = 27/9 = 3.\n\n**9. 9/13.** Let H = hosteller, D = day-scholar, A = A grade.\nP(H) = 0.6, P(D) = 0.4, P(A|H) = 0.3, P(A|D) = 0.2.\nP(A) = (0.6)(0.3) + (0.4)(0.2) = 0.18 + 0.08 = 0.26.\nP(H|A) = 0.18/0.26 = 18/26 = **9/13** ≈ 0.692.\n\n**10. 2/9.** Let E₁ = first group wins, E₂ = second group wins, N = new product introduced.\nP(E₁) = 0.6, P(E₂) = 0.4, P(N|E₁) = 0.7, P(N|E₂) = 0.3.\nP(N) = (0.6)(0.7) + (0.4)(0.3) = 0.42 + 0.12 = 0.54.\nP(E₂|N) = 0.12/0.54 = 12/54 = **2/9** ≈ 0.222.\n\n**11.** \"Greater than 4\" means 5 or 6, so p = 2/6 = 1/3 per throw, and the throws are independent.\nX = 0, 1, 2.\nP(X = 0) = (2/3)² = 4/9; P(X = 1) = 2(1/3)(2/3) = 4/9; P(X = 2) = (1/3)² = 1/9.\nCheck: 4/9 + 4/9 + 1/9 = 1 ✓\nE(X) = 0(4/9) + 1(4/9) + 2(1/9) = 6/9 = **2/3**.\n\n**12. 3/4.** B = {HHH, HHT, HTH, HTT}, so P(B) = 4/8. A ∩ B = {HHH, HHT, HTH}, so P(A ∩ B) = 3/8.\nP(A|B) = (3/8)/(4/8) = 3/4.\n\n**13. 0.3.** P(A ∩ B) = P(A)·P(B|A) = (0.4)(0.6) = 0.24. P(A|B) = 0.24/0.8 = 0.3.\n\n**Scoring.** Out of 34. Below 24 → the loss is almost certainly conditional-probability *direction*.\nRedo §3 Q1, Q2 and Q10, writing out the five-step Bayes layout each time even when it feels\nunnecessary.\n\n---","tips":"**On Bayes' theorem — the 4/5-mark question**\n\n1. **Define the events with letters, in words, before any arithmetic.** \"Let E₁ be the event that the\n   item came from machine A; let D be the event that the item is defective.\" This is a mark, and it\n   is the step that prevents the inversion error.\n\n2. **List all the priors, then all the likelihoods, as two separate groups.** Do not mix them. If you\n   have three machines you should have exactly three priors and three likelihoods before you write\n   the formula.\n\n3. **Write the formula out in full before substituting**, with the whole denominator shown. Dropping\n   a term from the denominator is the second-most-common error.\n\n4. **The word \"given\" tells you the denominator.** \"Given that it is defective\" → the conditioning\n   event is D, so you want P(machine|D), and P(D) is the denominator.\n\n5. **The denominator is P(A) by the total probability theorem — say so.** Many questions ask for P(A)\n   as a separate part, and pointing out the connection is good practice and sometimes a mark.\n\n6. **Do a sanity check on the answer.** Posterior probabilities must lie between 0 and 1, and they\n   should move in the sensible direction relative to the prior. If a machine makes 40% of output but\n   only 2% defectives, its posterior share of defectives must be *below* 40% — 16/69 ≈ 23% ✓.\n\n7. **Leave the answer as a fraction in lowest terms**, and add the decimal in brackets. 16/69 rather\n   than 0.2318…\n\n**On conditional probability**\n\n8. **For dice and coin problems, list the reduced sample space explicitly.** Writing out the five\n   outcomes with sum 6 is faster and far safer than manipulating formulas, and it shows your method.\n\n9. **State which of P(A|B) and P(B|A) you are computing.** Write it symbolically before substituting.\n\n10. **For \"without replacement\", the denominators decrease.** 4/52, then 3/51, then 2/50. For \"with\n    replacement\" they do not. Read the question for which it is — this single word changes the whole\n    answer.\n\n**On independence**\n\n11. **Never assume independence.** Use P(A ∩ B) = P(A)P(B) **only** when the question says the events\n    are independent, or you have verified it. Conversely, when a question asks you to *check*\n    independence, compute both P(A ∩ B) and P(A)P(B) and compare.\n\n12. **\"At least one\" means 1 − P(none).** For independent events, P(at least one) =\n    1 − (1 − P(A))(1 − P(B)). This is almost always faster than adding cases.\n\n**On random variables**\n\n13. **Use Σpᵢ = 1 to find the unknown constant**, and show that equation. It is the first mark.\n\n14. **Present the distribution as a table**, then compute the mean underneath it. Do not compute the\n    mean inline.\n\n15. **Do not compute variance.** It is out of syllabus, and time spent on it is wasted."},"tr":{"hi":{"tips":"**बेज़ प्रमेय पर — 4/5-अंकीय प्रश्न**\n\n1. **किसी भी गणना से पहले घटनाओं को अक्षरों से, शब्दों में परिभाषित कीजिए।** \"मान लीजिए E₁ वह घटना है\n   कि वस्तु मशीन A से आई; D वह घटना है कि वस्तु खराब है।\" यह एक अंक है, और यही वह चरण है जो उलटाव की\n   भूल रोकता है।\n\n2. **पहले सभी पूर्व प्रायिकताएँ, फिर सभी सप्रतिबंध प्रायिकताएँ — दो अलग समूहों में लिखिए।** इन्हें\n   मिलाइए मत। तीन मशीनें हैं तो सूत्र लिखने से पहले ठीक तीन पूर्व और तीन सप्रतिबंध प्रायिकताएँ आपके\n   पास होनी चाहिए।\n\n3. **प्रतिस्थापन से पहले सूत्र पूरा लिखिए**, पूरा हर दिखाते हुए। हर में से एक पद छोड़ देना दूसरी\n   सबसे आम भूल है।\n\n4. **\"दिए होने पर\" शब्द ही हर बताता है।** \"यह खराब है, यह दिए होने पर\" → प्रतिबंधक घटना D है, अतः\n   आपको P(मशीन|D) चाहिए और हर में P(D) है।\n\n5. **हर कुल प्रायिकता प्रमेय से प्राप्त P(A) ही है — यह लिखिए।** कई प्रश्न P(A) अलग भाग के रूप में\n   पूछते हैं, और इस संबंध को बता देना अच्छा अभ्यास है और कभी-कभी एक अंक भी।\n\n6. **उत्तर की तर्कसंगति जाँचिए।** पश्च प्रायिकताएँ 0 और 1 के बीच होनी चाहिए, और पूर्व प्रायिकता की\n   तुलना में उचित दिशा में हटनी चाहिए। यदि कोई मशीन 40% उत्पादन करती है पर केवल 2% खराबी देती है, तो\n   खराब वस्तुओं में उसका पश्च हिस्सा 40% से *कम* होना चाहिए — 16/69 ≈ 23% ✓।\n\n7. **उत्तर निम्नतम रूप में भिन्न के रूप में छोड़िए**, और कोष्ठक में दशमलव जोड़िए। 0.2318… के स्थान पर\n   16/69।\n\n**सप्रतिबंध प्रायिकता पर**\n\n8. **पासों और सिक्कों के प्रश्नों में घटा हुआ प्रतिदर्श समष्टि स्पष्ट लिखिए।** योग 6 वाले पाँचों\n   परिणाम लिख देना सूत्रों को उलटने-पलटने से तेज़ और कहीं अधिक सुरक्षित है, और इससे आपकी विधि भी दिखती\n   है।\n\n9. **आप P(A|B) निकाल रहे हैं या P(B|A), यह बताइए।** प्रतिस्थापन से पहले इसे संकेतों में लिखिए।\n\n10. **\"प्रतिस्थापन के बिना\" में हर घटते जाते हैं।** 4/52, फिर 3/51, फिर 2/50। \"प्रतिस्थापन के साथ\" में\n    नहीं घटते। प्रश्न में देखिए कि कौन-सा है — यह एक शब्द पूरा उत्तर बदल देता है।\n\n**स्वतंत्रता पर**\n\n11. **स्वतंत्रता कभी मान मत लीजिए।** P(A ∩ B) = P(A)P(B) का प्रयोग **केवल** तब कीजिए जब प्रश्न कहे कि\n    घटनाएँ स्वतंत्र हैं, या आपने स्वयं जाँच लिया हो। इसके विपरीत, जब प्रश्न स्वतंत्रता *जाँचने* को कहे,\n    तो P(A ∩ B) और P(A)P(B) दोनों निकालकर उनकी तुलना कीजिए।\n\n12. **\"कम से कम एक\" का अर्थ है 1 − P(कोई नहीं)।** स्वतंत्र घटनाओं के लिए P(कम से कम एक) =\n    1 − (1 − P(A))(1 − P(B))। यह प्रायः स्थितियाँ जोड़ने से तेज़ है।\n\n**यादृच्छिक चर पर**\n\n13. **अज्ञात अचर निकालने के लिए Σpᵢ = 1 का प्रयोग कीजिए**, और वह समीकरण दिखाइए। यही पहला अंक है।\n\n14. **बंटन को सारणी के रूप में प्रस्तुत कीजिए**, फिर उसके नीचे माध्य निकालिए। माध्य को पंक्ति में ही\n    मत निकालिए।\n\n15. **प्रसरण मत निकालिए।** वह पाठ्यक्रम से बाहर है, और उस पर लगाया समय व्यर्थ है।","test":"समय: 50 मिनट। उत्तर नीचे हैं।\n\n1. *(1)* यदि P(A) = 0.5, P(B) = 0.4 और P(A ∩ B) = 0.2, तो P(A|B) है\n   (a) 0.4 (b) 0.5 (c) 0.2 (d) 0.8\n2. *(1)* यदि A और B स्वतंत्र हैं, P(A) = 1/2, P(B) = 1/3, तो P(A ∩ B) है\n   (a) 5/6 (b) 1/6 (c) 2/3 (d) 1/5\n3. *(1)* किसी प्रायिकता बंटन के लिए Σpᵢ बराबर होना चाहिए\n   (a) 0 (b) 1 (c) n (d) कोई भी धनात्मक संख्या\n4. *(2)* एक सिक्का तीन बार उछाला जाता है। कम से कम दो चित आने की प्रायिकता ज्ञात कीजिए।\n5. *(2)* यदि P(A) = 0.6, P(B) = 0.3 और A, B स्वतंत्र हैं, तो P(न A न B) ज्ञात कीजिए।\n6. *(3)* दो पासे फेंके जाते हैं। योग 8 दिए होने पर, एक पासे पर 2 आने की प्रायिकता ज्ञात कीजिए।\n7. *(3)* एक थैले में 4 लाल और 6 सफ़ेद गेंदें हैं। प्रतिस्थापन के बिना दो गेंदें निकाली जाती हैं। दोनों के\n   लाल होने की प्रायिकता ज्ञात कीजिए।\n8. *(4)* एक यादृच्छिक चर X का बंटन नीचे दिया है। c और E(X) ज्ञात कीजिए।\n\n   | X | 1 | 2 | 3 | 4 | 5 |\n   | --- | --- | --- | --- | --- | --- |\n   | P(X) | c | 2c | 2c | 3c | c |\n\n9. *(5)* एक महाविद्यालय के 60% विद्यार्थी छात्रावास में रहते हैं और 40% नहीं। पुराने अभिलेख बताते हैं कि\n   छात्रावासियों में 30% और बाहर रहने वालों में 20% A ग्रेड पाते हैं। एक विद्यार्थी यादृच्छिक रूप से चुना\n   गया और उसे A ग्रेड मिला है। उसके छात्रावासी होने की प्रायिकता क्या है?\n10. *(5)* दो समूह किसी निगम के बोर्ड पदों के लिए प्रतिस्पर्धा कर रहे हैं। पहले और दूसरे समूह के जीतने की\n    प्रायिकताएँ 0.6 और 0.4 हैं। आगे, यदि पहला समूह जीतता है तो नया उत्पाद लाने की प्रायिकता 0.7 है, और\n    दूसरा समूह जीते तो संगत प्रायिकता 0.3 है। नया उत्पाद दूसरे समूह द्वारा लाए जाने की प्रायिकता ज्ञात\n    कीजिए।\n11. *(3)* एक पासा दो बार फेंका जाता है। 4 से बड़ी संख्या आने की बारंबारता का प्रायिकता बंटन और उसका माध्य\n    ज्ञात कीजिए।\n12. *(2)* तीन सिक्के उछाले जाते हैं। मान लीजिए A है \"कम से कम दो चित\" और B है \"पहले सिक्के पर चित\"।\n    P(A|B) ज्ञात कीजिए।\n13. *(2)* यदि A और B ऐसी घटनाएँ हैं कि P(A) = 0.4, P(B) = 0.8 और P(B|A) = 0.6, तो P(A|B) ज्ञात कीजिए।\n\n### उत्तर कुंजी\n\n**1. (b) 0.5.** P(A|B) = 0.2/0.4 = 0.5।\n\n**2. (b) 1/6.** (1/2)(1/3)।\n\n**3. (b) 1.**\n\n**4. 1/2.** प्रतिदर्श समष्टि में 8 परिणाम हैं। कम से कम दो चित: HHH, HHT, HTH, THH → 4/8 = 1/2।\n\n**5. 0.28.** P(A′ ∩ B′) = (1 − 0.6)(1 − 0.3) = (0.4)(0.7) = 0.28।\n\n**6. 2/5.** योग 8 वाले परिणाम: (2,6), (3,5), (4,4), (5,3), (6,2) → 5 परिणाम। इनमें 2 वाले: (2,6) और\n(6,2) → 2। अतः P = 2/5।\n\n**7. 2/15.** (4/10)(3/9) = 12/90 = 2/15।\n\n**8. c = 1/9, E(X) = 3.** Σp = c + 2c + 2c + 3c + c = 9c = 1 ⟹ c = 1/9।\nE(X) = [1(1) + 2(2) + 3(2) + 4(3) + 5(1)]/9 = (1 + 4 + 6 + 12 + 5)/9 = 27/9 = 3।\n\n**9. 9/13.** मान लीजिए H = छात्रावासी, D = बाहर रहने वाला, A = A ग्रेड।\nP(H) = 0.6, P(D) = 0.4, P(A|H) = 0.3, P(A|D) = 0.2।\nP(A) = (0.6)(0.3) + (0.4)(0.2) = 0.18 + 0.08 = 0.26।\nP(H|A) = 0.18/0.26 = 18/26 = **9/13** ≈ 0.692।\n\n**10. 2/9.** मान लीजिए E₁ = पहला समूह जीता, E₂ = दूसरा समूह जीता, N = नया उत्पाद लाया गया।\nP(E₁) = 0.6, P(E₂) = 0.4, P(N|E₁) = 0.7, P(N|E₂) = 0.3।\nP(N) = (0.6)(0.7) + (0.4)(0.3) = 0.42 + 0.12 = 0.54।\nP(E₂|N) = 0.12/0.54 = 12/54 = **2/9** ≈ 0.222।\n\n**11.** \"4 से बड़ी\" का अर्थ है 5 या 6, अतः प्रति फेंक p = 2/6 = 1/3, और फेंक स्वतंत्र हैं।\nX = 0, 1, 2।\nP(X = 0) = (2/3)² = 4/9; P(X = 1) = 2(1/3)(2/3) = 4/9; P(X = 2) = (1/3)² = 1/9।\nजाँच: 4/9 + 4/9 + 1/9 = 1 ✓\nE(X) = 0(4/9) + 1(4/9) + 2(1/9) = 6/9 = **2/3**।\n\n**12. 3/4.** B = {HHH, HHT, HTH, HTT}, अतः P(B) = 4/8। A ∩ B = {HHH, HHT, HTH}, अतः P(A ∩ B) = 3/8।\nP(A|B) = (3/8)/(4/8) = 3/4।\n\n**13. 0.3.** P(A ∩ B) = P(A)·P(B|A) = (0.4)(0.6) = 0.24। P(A|B) = 0.24/0.8 = 0.3।\n\n**अंकन।** कुल 34 में से। 24 से कम → हानि लगभग निश्चित रूप से सप्रतिबंध प्रायिकता की *दिशा* में है।\n§3 के Q1, Q2 और Q10 दोबारा कीजिए, और हर बार बेज़ का पाँच-चरणीय क्रम लिखिए, भले ही वह अनावश्यक लगे।\n\n---","recall":"```\nसप्रतिबंध:   P(A|B) = P(A∩B)/P(B),  P(B) ≠ 0        ← \"दिए होने पर\" हर (DENOMINATOR) में जाता है\n              P(A′|B) = 1 − P(A|B)\n\nगुणन:         P(A∩B) = P(A)P(B|A) = P(B)P(A|B)\n              P(A∩B∩C) = P(A)P(B|A)P(C|A∩B)\n\nस्वतंत्र:     P(A∩B) = P(A)P(B)  ⟺  P(A|B) = P(A)\n              P(कम से कम एक) = 1 − (1−P(A))(1−P(B))\n              स्वतंत्र ≠ परस्पर अपवर्जी\n\nकुल प्रायिकता:  P(A) = Σ P(Eᵢ) P(A|Eᵢ)\n\nबेज़:  P(Eᵢ|A) = P(Eᵢ)P(A|Eᵢ) / Σⱼ P(Eⱼ)P(A|Eⱼ)\n       क्रम: घटनाएँ परिभाषित → सभी पूर्व → सभी सप्रतिबंध → सूत्र → प्रतिस्थापन\n\nयादृच्छिक चर: Σpᵢ = 1 ;  माध्य = E(X) = Σ xᵢpᵢ\n```","brief":"### सप्रतिबंध प्रायिकता\n\nA की प्रायिकता, **यह दिए होने पर** कि B पहले ही घट चुका है:\n\n```\n      P(A|B) = P(A ∩ B) / P(B)              जबकि P(B) ≠ 0\n```\n\nइसे यूँ पढ़िए: प्रतिदर्श समष्टि को B तक सीमित कीजिए, और पूछिए कि B का कितना भाग A भी है।\n\n**गुणधर्म:**\n\n```\n      P(S|B) = P(B|B) = 1\n      P(A′|B) = 1 − P(A|B)\n      P((A ∪ C)|B) = P(A|B) + P(C|B) − P((A ∩ C)|B)\n```\n\n> **एक बात जो स्पष्ट रखनी है:** P(A|B) और P(B|A) अलग-अलग संख्याएँ हैं। **हर वही होता है जो दिया गया\n> है।** \"यह खराब है, यह दिए होने पर बताइए कि यह मशीन C से आने की प्रायिकता क्या है\" — इसमें \"खराब\"\n> हर में है।\n\n### गुणन प्रमेय\n\nपरिभाषा को पुनर्व्यवस्थित करने पर:\n\n```\n      P(A ∩ B) = P(B) · P(A|B) = P(A) · P(B|A)\n```\n\nतीन घटनाओं के लिए:\n\n```\n      P(A ∩ B ∩ C) = P(A) · P(B|A) · P(C|A ∩ B)\n```\n\n\"प्रतिस्थापन के बिना निकालने\" में यही काम आता है: हर बार प्रायिकता बदलती है, और आप सप्रतिबंध\nप्रायिकताओं का गुणा करते जाते हैं।\n\n### स्वतंत्र घटनाएँ\n\nA और B **स्वतंत्र** हैं यदि एक का घटना दूसरे को प्रभावित न करे:\n\n```\n      P(A ∩ B) = P(A) · P(B)\n```\n\nसमतुल्य रूप से, P(A|B) = P(A) और P(B|A) = P(B)।\n\n**यदि A और B स्वतंत्र हैं, तो ये भी स्वतंत्र हैं:** A′ और B, A और B′, A′ और B′।\n\n**स्वतंत्र ≠ परस्पर अपवर्जी।** ये पूर्णतः भिन्न विचार हैं और यह अंतर परीक्षा में पूछा जाता है:\n\n| | परस्पर अपवर्जी | स्वतंत्र |\n| --- | --- | --- |\n| परिभाषा | A ∩ B = ∅, अतः P(A ∩ B) = 0 | P(A ∩ B) = P(A)P(B) |\n| अर्थ | दोनों एक साथ नहीं हो सकतीं | एक का होना दूसरे के बारे में कुछ नहीं बताता |\n| दोनों साथ संभव? | केवल तब जब P(A) = 0 या P(B) = 0 | |\n\nअतः शून्येतर प्रायिकता वाली दो परस्पर अपवर्जी घटनाएँ **अनिवार्यतः परतंत्र** होती हैं — यदि आप जानते\nहैं कि A घटी, तो आप जानते हैं कि B नहीं घटी। यही वह मानक बहुविकल्पीय प्रश्न है।\n\n**उपयोगी:** स्वतंत्र A, B के लिए:\n\n```\n      P(A ∪ B) = P(A) + P(B) − P(A)P(B)\n      P(कोई नहीं) = P(A′ ∩ B′) = (1 − P(A))(1 − P(B))\n      P(कम से कम एक) = 1 − P(कोई नहीं)\n```\n\n### कुल प्रायिकता का प्रमेय\n\nमान लीजिए E₁, E₂, …, Eₙ प्रतिदर्श समष्टि का एक **विभाजन** है (परस्पर अपवर्जी, निःशेष, और प्रत्येक की\nप्रायिकता शून्येतर)। तब किसी भी घटना A के लिए:\n\n```\n      P(A) = P(E₁)P(A|E₁) + P(E₂)P(A|E₂) + … + P(Eₙ)P(A|Eₙ)\n           = Σ P(Eᵢ) P(A|Eᵢ)\n```\n\nशब्दों में: A की कुल प्रायिकता निकालने के लिए, दुनिया जिन-जिन रूपों में हो सकती थी उन सब से गुज़रिए, और\nहर रूप की सप्रतिबंध प्रायिकता को उस रूप की संभावना से भारित कीजिए।\n\n### बेज़ प्रमेय\n\nवही व्यवस्था। तब\n\n```\n                  P(Eᵢ) · P(A|Eᵢ)\n      P(Eᵢ|A) = ─────────────────────────\n                  Σⱼ P(Eⱼ) · P(A|Eⱼ)\n```\n\nहर ठीक वही P(A) है जो कुल प्रायिकता प्रमेय से आता है। अतः बेज़ प्रमेय यह है:\n\n```\n      P(Eᵢ|A) = (वह एक पद) / (सभी पदों का योग)\n```\n\n**प्रश्नों में आने वाली शब्दावली:** P(Eᵢ) **पूर्व (prior)** प्रायिकताएँ हैं (A देखने से पहले);\nP(Eᵢ|A) **पश्च (posterior)** प्रायिकताएँ हैं (देखने के बाद)।\n\n### बेज़ का क्रम — हर बार यही अपनाइए\n\nविद्यार्थी यह प्रश्न अज्ञान से नहीं, अव्यवस्था से खोते हैं। यह ढाँचा थोपिए:\n\n**चरण 1 — घटनाएँ परिभाषित कीजिए**, अक्षरों के साथ।\n\n```\n      E₁ : वस्तु मशीन A से आई\n      E₂ : वस्तु मशीन B से आई\n      E₃ : वस्तु मशीन C से आई\n      D  : वस्तु खराब है\n```\n\n**चरण 2 — सभी पूर्व प्रायिकताएँ लिखिए** P(E₁), P(E₂), P(E₃)।\n\n**चरण 3 — सभी सप्रतिबंध प्रायिकताएँ लिखिए** P(D|E₁), P(D|E₂), P(D|E₃)।\n\n**चरण 4 — अभीष्ट सूचकांक के साथ सूत्र लिखिए।**\n\n**चरण 5 — प्रतिस्थापित करके सरल कीजिए।**\n\nइस क्रम में लिखने पर सप्रतिबंधता उलटना या हर में से कोई पद छूट जाना संरचनात्मक रूप से असंभव हो जाता है\n— और यही दो तरीके हैं जिनसे यह प्रश्न वास्तव में खोया जाता है।\n\n### यादृच्छिक चर\n\n**यादृच्छिक चर** X किसी यादृच्छिक प्रयोग की प्रतिदर्श समष्टि पर परिभाषित एक वास्तविक-मान फलन है।\n\nउसका **प्रायिकता बंटन** मानों और उनकी प्रायिकताओं की सारणी है:\n\n| X = xᵢ | x₁ | x₂ | … | xₙ |\n| --- | --- | --- | --- | --- |\n| P(X = xᵢ) = pᵢ | p₁ | p₂ | … | pₙ |\n\n**दो शर्तें** जो हर प्रायिकता बंटन को पूरी करनी हैं:\n\n```\n      हर i के लिए pᵢ ≥ 0          और          Σ pᵢ = 1\n```\n\nΣpᵢ = 1 जाँचना एक अंक भी है और आपकी अपनी भूल-जाँच भी। इसे कीजिए।\n\n**माध्य (प्रत्याशा):**\n\n```\n      माध्य = E(X) = μ = Σ xᵢ pᵢ\n```\n\nमाध्य को **प्रत्याशित मान** या X की **प्रत्याशा** भी कहते हैं।\n\n> प्रसरण विलोपित है, अतः आपसे Σxᵢ²pᵢ − μ² नहीं पूछा जाएगा। यदि किसी अभ्यास-प्रश्न में वह माँगा गया है,\n> तो वह किसी पुराने प्रश्नपत्र से है।","pyq":"**Q1.** *(4 अंक — बेज़ का आदर्श प्रश्न)*\nथैली I में 3 लाल और 4 काली गेंदें हैं; थैली II में 5 लाल और 6 काली। दोनों थैलियों में से किसी एक से\nयादृच्छिक रूप से एक गेंद निकाली जाती है, और वह लाल निकलती है। उसकी प्रायिकता ज्ञात कीजिए कि वह थैली II से\nनिकाली गई थी।\n\n**Q2.** *(5 अंक)* किसी कारख़ाने में तीन मशीनें A, B तथा C कुल उत्पादन का क्रमशः 25%, 35% तथा 40% बनाती हैं।\nउनके उत्पादन में क्रमशः 5%, 4% तथा 2% खराब हैं। कुल उत्पादन से यादृच्छिक रूप से एक वस्तु निकाली जाती है\nऔर वह खराब निकलती है। उसकी प्रायिकता ज्ञात कीजिए कि वह मशीन C ने बनाई थी।\n\n**Q3.** *(3 अंक)* एक पासा दो बार फेंका जाता है और आए अंकों का योग 6 देखा जाता है। इसकी सप्रतिबंध प्रायिकता\nक्या है कि अंक 4 कम-से-कम एक बार आया?\n\n**Q4.** *(2 अंक)* A तथा B स्वतंत्र घटनाएँ हैं जिनके लिए P(A) = 0.3 तथा P(B) = 0.4। P(A ∪ B) ज्ञात कीजिए।\n\n**Q5.** *(4 अंक)* 52 पत्तों की अच्छी तरह फेंटी गई गड्डी से **प्रतिस्थापन के साथ** क्रमशः दो पत्ते निकाले\nजाते हैं। इक्कों की संख्या का प्रायिकता बंटन ज्ञात कीजिए, और उससे उसका माध्य ज्ञात कीजिए।\n\n**Q6.** *(3 अंक)* एक कलश में 5 लाल और 5 काली गेंदें हैं। यादृच्छिक रूप से एक गेंद निकाली जाती है, उसका रंग\nनोट किया जाता है, और वह कलश में लौटा दी जाती है। साथ ही निकाले गए रंग की 2 अतिरिक्त गेंदें कलश में डाल दी\nजाती हैं, और फिर यादृच्छिक रूप से एक गेंद निकाली जाती है। दूसरी गेंद के लाल होने की प्रायिकता क्या है?\n\n**Q7.** *(2 अंक)* यदि P(A) = 6/11, P(B) = 5/11 तथा P(A ∪ B) = 7/11, तो P(A|B) ज्ञात कीजिए।\n\n**Q8.** *(1 अंक, बहुविकल्पीय)* यदि A तथा B ऐसी दो घटनाएँ हैं कि P(A) ≠ 0 तथा P(B|A) = 1, तो\n(a) A ⊂ B (b) B ⊂ A (c) B = ∅ (d) A = ∅\n\n**Q9.** *(3 अंक)* 52 पत्तों की गड्डी से **प्रतिस्थापन के बिना** क्रमशः तीन पत्ते निकाले जाते हैं। तीनों के\nबादशाह होने की प्रायिकता ज्ञात कीजिए।\n\n**Q10.** *(4 अंक, प्रकरण अध्ययन)* किसी विद्यालय में 40% विद्यार्थी लड़कियाँ और 60% लड़के हैं। ज्ञात है कि\n5% लड़कियाँ और 8% लड़के बाएँ हाथ से लिखते हैं।\n(i) यादृच्छिक रूप से चुने गए विद्यार्थी के बाएँ हाथ से लिखने वाला होने की प्रायिकता ज्ञात कीजिए।\n(ii) यह दिया हो कि यादृच्छिक रूप से चुना गया विद्यार्थी बाएँ हाथ से लिखता है, तो उसके लड़की होने की\nप्रायिकता ज्ञात कीजिए।\n(iii) बताइए कि प्रत्येक भाग में आपने कौन-सी प्रमेय का उपयोग किया।\n\n**Q11.** *(2 अंक)* एक यादृच्छिक चर X का प्रायिकता बंटन नीचे दिया है। k ज्ञात कीजिए, और फिर X का माध्य।\n\n| X | 0 | 1 | 2 | 3 |\n| --- | --- | --- | --- | --- |\n| P(X) | k | 2k | 3k | 4k |\n\n**Q12.** *(1 अंक, अभिकथन–कारण)*\n**A:** यदि दो घटनाएँ परस्पर अपवर्जी हों और उनकी प्रायिकताएँ शून्येतर हों, तो वे स्वतंत्र नहीं हो सकतीं।\n**R:** परस्पर अपवर्जी घटनाओं के लिए P(A ∩ B) = 0।","sol":"### Q1 — दो थैलियाँ, लाल गेंद निकली, कौन-सी थैली?\n\n**चरण 1 — घटनाएँ परिभाषित कीजिए।**\n\n```\n      E₁ : गेंद थैली I से निकाली गई\n      E₂ : गेंद थैली II से निकाली गई\n      R  : निकाली गई गेंद लाल है\n```\n\n**चरण 2 — पूर्व प्रायिकताएँ।** दोनों थैलियों में से एक यादृच्छिक रूप से चुनी जाती है, अतः\n\n```\n      P(E₁) = 1/2          P(E₂) = 1/2\n```\n\n**चरण 3 — सप्रतिबंध प्रायिकताएँ।**\n\n```\n      थैली I  : (3 + 4) = 7 गेंदों में 3 लाल    ⟹   P(R|E₁) = 3/7\n      थैली II : (5 + 6) = 11 गेंदों में 5 लाल   ⟹   P(R|E₂) = 5/11\n```\n\n**चरण 4 — बेज़ प्रमेय।**\n\n```\n                        P(E₂) P(R|E₂)\n      P(E₂|R) = ───────────────────────────────\n                 P(E₁)P(R|E₁) + P(E₂)P(R|E₂)\n```\n\n**चरण 5 — मान रखिए।**\n\n```\n                     (1/2)(5/11)\n      P(E₂|R) = ──────────────────────────\n                 (1/2)(3/7) + (1/2)(5/11)\n```\n\n(1/2) पूरे में कट जाता है:\n\n```\n                    5/11\n      P(E₂|R) = ─────────────\n                 3/7 + 5/11\n```\n\n```\n      3/7 + 5/11 = (33 + 35)/77 = 68/77\n```\n\n```\n      P(E₂|R) = (5/11) × (77/68) = (5 × 7)/68 = 35/68\n```\n\n```\nP(गेंद थैली II से आई | वह लाल है) = 35/68          ≈ 0.515\n```\n\n*(संगति जाँच: थैली II का लाल अंश (5/11 ≈ 0.455) थैली I के (3/7 ≈ 0.429) से थोड़ा अधिक है, और आरंभ में\nदोनों थैलियाँ समान संभावना की थीं, अतः थैली II की पश्चवर्ती प्रायिकता ½ से थोड़ी ऊपर आनी चाहिए। वैसा ही\nहै: 35/68 ≈ 0.515 ✓)*\n\n### Q2 — तीन मशीनें, खराब वस्तु, कौन-सी मशीन?\n\n**चरण 1 — घटनाएँ परिभाषित कीजिए।**\n\n```\n      E₁ : वस्तु मशीन A ने बनाई\n      E₂ : वस्तु मशीन B ने बनाई\n      E₃ : वस्तु मशीन C ने बनाई\n      D  : वस्तु खराब है\n```\n\n**चरण 2 — पूर्व प्रायिकताएँ।**\n\n```\n      P(E₁) = 0.25          P(E₂) = 0.35          P(E₃) = 0.40\n```\n\n**चरण 3 — सप्रतिबंध प्रायिकताएँ।**\n\n```\n      P(D|E₁) = 0.05        P(D|E₂) = 0.04        P(D|E₃) = 0.02\n```\n\n**चरण 4 — बेज़ प्रमेय।**\n\n```\n                            P(E₃) P(D|E₃)\n      P(E₃|D) = ───────────────────────────────────────────\n                 P(E₁)P(D|E₁) + P(E₂)P(D|E₂) + P(E₃)P(D|E₃)\n```\n\n**चरण 5 — मान रखिए।**\n\n```\n      P(E₁)P(D|E₁) = 0.25 × 0.05 = 0.0125\n      P(E₂)P(D|E₂) = 0.35 × 0.04 = 0.0140\n      P(E₃)P(D|E₃) = 0.40 × 0.02 = 0.0080\n                                   ────────\n      हर           =               0.0345\n```\n\n*(प्रसंगवश ध्यान दें: 0.0345, P(D) है — कुल खराबी दर — और यही कुल प्रायिकता प्रमेय है, जो अक्सर अलग भाग\nके रूप में पूछी जाती है।)*\n\n```\n      P(E₃|D) = 0.0080 / 0.0345 = 80/345 = 16/69\n```\n\n```\nP(मशीन C | खराब) = 16/69          ≈ 0.232\n```\n\n### Q3 — पासा दो बार, योग 6, क्या 4 आया?\n\n**घटनाएँ परिभाषित कीजिए।**\n\n```\n      A : अंक 4 कम-से-कम एक बार आता है\n      B : दोनों अंकों का योग 6 है\n```\n\n**B की सूची।** योग 6 वाले परिणाम:\n\n```\n      (1,5), (2,4), (3,3), (4,2), (5,1)          →  n(B) = 5\n```\n\n**A ∩ B की सूची।** इनमें से किनमें 4 है?\n\n```\n      (2,4), (4,2)                                →  n(A ∩ B) = 2\n```\n\n**गणना।** सभी 36 परिणाम समसंभाव्य हैं, अतः\n\n```\n      P(B) = 5/36          P(A ∩ B) = 2/36\n```\n\n```\n      P(A|B) = P(A ∩ B)/P(B) = (2/36)/(5/36) = 2/5\n```\n\n```\nP(4 कम-से-कम एक बार आया | योग 6 है) = 2/5\n```\n\n> योग 6 वाले पाँच परिणामों तक सीमित हो जाने के बाद उत्तर केवल \"5 में से 2\" है। इस प्रकार के प्रश्न के लिए\n> घटे हुए प्रतिदर्श समष्टि की स्पष्ट सूची बनाना सबसे तेज़ और सुरक्षित विधि है।\n\n### Q4 — स्वतंत्र घटनाएँ, P(A ∪ B)\n\n```\n      P(A ∪ B) = P(A) + P(B) − P(A ∩ B)\n```\n\nचूँकि A तथा B **स्वतंत्र** हैं, अतः P(A ∩ B) = P(A)·P(B) = (0.3)(0.4) = 0.12।\n\n```\n      P(A ∪ B) = 0.3 + 0.4 − 0.12 = 0.58\n```\n\n### Q5 — इक्कों की संख्या का प्रायिकता बंटन (प्रतिस्थापन के साथ)\n\nमान लीजिए X = निकाले गए इक्कों की संख्या। चूँकि निकालना **प्रतिस्थापन के साथ** है, अतः दोनों निकालने\nस्वतंत्र हैं, और प्रत्येक बार\n\n```\n      P(इक्का) = 4/52 = 1/13          P(इक्का नहीं) = 12/13\n```\n\nX के मान 0, 1 या 2 हो सकते हैं।\n\n```\n      P(X = 0) = (12/13)(12/13) = 144/169\n\n      P(X = 1) = (1/13)(12/13) + (12/13)(1/13) = 24/169      [पहले इक्का, या दूसरे इक्का]\n\n      P(X = 2) = (1/13)(1/13) = 1/169\n```\n\n**प्रायिकता बंटन:**\n\n| X | 0 | 1 | 2 |\n| --- | --- | --- | --- |\n| P(X) | 144/169 | 24/169 | 1/169 |\n\n**जाँच:** (144 + 24 + 1)/169 = 169/169 = 1 ✓\n\n**माध्य:**\n\n```\n      E(X) = Σ xᵢ pᵢ = 0(144/169) + 1(24/169) + 2(1/169)\n           = (0 + 24 + 2)/169\n           = 26/169\n           = 2/13\n```\n\n```\nमाध्य = 2/13          ≈ 0.154\n```\n\n*(संगत: प्रत्येक बार इक्का 1/13 प्रायिकता से मिलता है, और दो बार निकाला जाता है, अतः औसतन 2/13 इक्के।)*\n\n### Q6 — गेंदें जोड़े जाने वाला कलश\n\n**घटनाएँ परिभाषित कीजिए।**\n\n```\n      R₁ : पहली निकाली गेंद लाल है          B₁ : पहली निकाली गेंद काली है\n      R₂ : दूसरी निकाली गेंद लाल है\n```\n\n**पूर्व प्रायिकताएँ।** कलश में आरंभ में 5 लाल और 5 काली, अतः 10 गेंदें:\n\n```\n      P(R₁) = 5/10 = 1/2          P(B₁) = 5/10 = 1/2\n```\n\n**सप्रतिबंध प्रायिकताएँ।** निकाली गई गेंद लौटा दी जाती है, **और उसी रंग की 2 और डाल दी जाती हैं**, अतः तब\nकलश में 12 गेंदें होती हैं।\n\n```\n      यदि R₁ हुआ: 5 + 2 = 7 लाल और 5 काली    ⟹   P(R₂|R₁) = 7/12\n      यदि B₁ हुआ: 5 लाल और 5 + 2 = 7 काली    ⟹   P(R₂|B₁) = 5/12\n```\n\n**कुल प्रायिकता प्रमेय लगाइए:**\n\n```\n      P(R₂) = P(R₁)P(R₂|R₁) + P(B₁)P(R₂|B₁)\n            = (1/2)(7/12) + (1/2)(5/12)\n            = (7 + 5)/24\n            = 12/24\n```\n\n```\nP(दूसरी गेंद लाल है) = 1/2\n```\n\n> सुंदर परिणाम: निकाले गए रंग की गेंदें जोड़ने से अगली गेंद के लाल होने की प्रायिकता नहीं बदलती, क्योंकि\n> कलश आरंभ में सममित था। इसे टिप्पणी के रूप में लिखना चाहिए — यह समझ दर्शाता है।\n\n### Q7 — P(A|B) ज्ञात करना\n\n```\n      P(A ∪ B) = P(A) + P(B) − P(A ∩ B)\n⟹     7/11 = 6/11 + 5/11 − P(A ∩ B)\n⟹     P(A ∩ B) = 11/11 − 7/11 = 4/11\n```\n\n```\n      P(A|B) = P(A ∩ B)/P(B) = (4/11)/(5/11) = 4/5\n```\n\n### Q8 — P(B|A) = 1\n\n```\n      P(B|A) = P(A ∩ B)/P(A) = 1     ⟹     P(A ∩ B) = P(A)\n```\n\nयदि A ∩ B की प्रायिकता A की प्रायिकता के बराबर है, तो A का B के बाहर कोई योगदान नहीं — अर्थात् **A ⊂ B**।\n\n**उत्तर: (a) A ⊂ B**\n\n*(अर्थ: जब भी A घटता है, B निश्चित रूप से घटता है। इसका अर्थ है A, B में समाहित है।)*\n\n### Q9 — प्रतिस्थापन के बिना तीन बादशाह\n\n**घटनाएँ परिभाषित कीजिए।**\n\n```\n      K₁ : पहला पत्ता बादशाह है\n      K₂ : दूसरा पत्ता बादशाह है\n      K₃ : तीसरा पत्ता बादशाह है\n```\n\nचूँकि निकालना **प्रतिस्थापन के बिना** है, अतः तीन घटनाओं के लिए गुणन प्रमेय का उपयोग कीजिए:\n\n```\n      P(K₁ ∩ K₂ ∩ K₃) = P(K₁) · P(K₂|K₁) · P(K₃|K₁ ∩ K₂)\n```\n\n```\n      P(K₁) = 4/52                        [52 पत्तों में 4 बादशाह]\n      P(K₂|K₁) = 3/51                     [51 पत्तों में 3 बादशाह शेष]\n      P(K₃|K₁ ∩ K₂) = 2/50                [50 पत्तों में 2 बादशाह शेष]\n```\n\n```\n      P = (4/52)(3/51)(2/50) = 24/132600 = 1/5525\n```\n\n```\nP(तीनों पत्ते बादशाह हैं) = 1/5525          ≈ 0.000181\n```\n\n### Q10 — प्रकरण अध्ययन: बाएँ हाथ से लिखने वाले विद्यार्थी\n\n**घटनाएँ परिभाषित कीजिए।**\n\n```\n      G : विद्यार्थी लड़की है          B : विद्यार्थी लड़का है\n      L : विद्यार्थी बाएँ हाथ से लिखता है\n```\n\n```\n      P(G) = 0.40          P(B) = 0.60\n      P(L|G) = 0.05        P(L|B) = 0.08\n```\n\n**(i) P(L) — कुल प्रायिकता प्रमेय से:**\n\n```\n      P(L) = P(G)P(L|G) + P(B)P(L|B)\n           = (0.40)(0.05) + (0.60)(0.08)\n           = 0.020 + 0.048\n           = 0.068\n```\n\n**P(विद्यार्थी बाएँ हाथ से लिखता है) = 0.068 = 17/250**\n\n**(ii) P(G|L) — बेज़ प्रमेय से:**\n\n```\n                  P(G)P(L|G)          0.020\n      P(G|L) = ──────────────── = ───────────── = 20/68 = 5/17\n                     P(L)              0.068\n```\n\n**P(विद्यार्थी लड़की है | बाएँ हाथ से लिखता है) = 5/17 ≈ 0.294**\n\n**(iii)** भाग (i) में **कुल प्रायिकता प्रमेय** का उपयोग है; भाग (ii) में **बेज़ प्रमेय** का।\n\n*(ध्यान दीजिए कि 5/17 ≈ 0.294, P(G) = 0.40 से काफ़ी कम है — यह जानने से कि विद्यार्थी बाएँ हाथ से लिखता\nहै, \"लड़की\" कम संभावित हो जाती है, क्योंकि लड़कों में बाएँ हाथ की दर अधिक है। ऐसी संगति जाँचें करने योग्य\nहैं।)*\n\n### Q11 — k तथा माध्य ज्ञात करना\n\n**Σpᵢ = 1 का उपयोग कीजिए:**\n\n```\n      k + 2k + 3k + 4k = 1\n⟹     10k = 1\n⟹     k = 1/10\n```\n\n**बंटन:**\n\n| X | 0 | 1 | 2 | 3 |\n| --- | --- | --- | --- | --- |\n| P(X) | 1/10 | 2/10 | 3/10 | 4/10 |\n\n**माध्य:**\n\n```\n      E(X) = 0(1/10) + 1(2/10) + 2(3/10) + 3(4/10)\n           = (0 + 2 + 6 + 12)/10\n           = 20/10\n           = 2\n```\n\n```\nk = 1/10 तथा माध्य = 2\n```\n\n### Q12 — अभिकथन–कारण\n\n**A:** \"शून्येतर प्रायिकताओं वाली परस्पर अपवर्जी घटनाएँ स्वतंत्र नहीं हो सकतीं।\" **सत्य।**\nपरस्पर अपवर्जी होने पर P(A ∩ B) = 0। यदि वे स्वतंत्र भी होतीं, तो P(A ∩ B) = P(A)P(B) होता, जिससे\nP(A)P(B) = 0 अनिवार्य हो जाता — और यह दोनों के शून्येतर होने के विरुद्ध है।\n\n**R:** \"परस्पर अपवर्जी घटनाओं के लिए P(A ∩ B) = 0।\" **सत्य** — यही परिभाषा है।\n\n**क्या R, A को समझाता है?** हाँ — A सीधे R और स्वतंत्रता की शर्त को मिलाकर निकलता है।\n\n**उत्तर: (a) A तथा R दोनों सत्य हैं, और R, A का सही स्पष्टीकरण है।**"}}},{"id":"p1","subj":"physics","num":1,"title":"Electric Charges and Fields","unit":"Units I+II · Electrostatics & Current","unitMarks":16,"prio":1,"appear":"Units I + II (16 marks, shared with Ch 2 and Ch 3) · Typical appearance: 1–2 MCQs + a 2-mark flux or dipole question, and often the 5-mark Gauss's law derivation-plus-application.","deleted":"Nothing substantial was removed from this chapter beyond what was already out of the\nsenior-secondary course. (The Van de Graaff generator, sometimes taught alongside, belongs to Ch 2\nand **is** deleted.)","intro":"Rub a comb through dry hair and it picks up bits of paper. That is the whole chapter in one\nsentence: something invisible got onto the comb, and it can pull on things it never touches.\n\nThat something is **charge**. Ordinary matter has two kinds of it, and we call them positive and\nnegative for bookkeeping reasons only — the names carry no meaning beyond \"opposite\". Every atom\nholds equal amounts of both, so it shows nothing to the outside world. Rubbing the comb scrapes a\nfew electrons off the hair onto the comb, and now the comb has a little extra negative and the hair\na little extra positive. Nothing was created; it was moved. That is what **conservation of charge**\nmeans. And you can only ever move whole electrons, never two-thirds of one, which is what\n**quantisation** means: every charge you will ever measure is a whole-number multiple of\ne = 1.6 × 10⁻¹⁹ C.\n\n**Coulomb's law** answers the obvious next question: how hard do two charges push or pull? Twice the\ncharge on either one, twice the force. Twice as far apart, a *quarter* of the force — the 1/r²\nfalls off fast. Same signs push apart, opposite signs pull together. That is all F = kq₁q₂/r² says.\nIt is Newton's law of gravity with charge in place of mass, and one crucial difference: gravity\nonly ever pulls, while this can do both.\n\nNow the idea the chapter is actually named after. A charge sitting alone in a room does something\nto the room: any *other* charge brought anywhere nearby immediately feels a push. Rather than\nrecompute that push for every possible visitor, we describe the room itself. At each point we ask\n\"what force would a unit positive charge feel here?\" and store the answer. That map of answers is\nthe **electric field**, E. Once you have the map, the force on any charge you drop in is just\nF = qE. The field is a bookkeeping device that turns out to behave like a real thing — Chapter 8\nwill show it carrying energy across empty space as light.\n\n**Field lines** are how we draw that map: you follow the arrows to see which way a positive charge\nwould be pushed, and where the lines crowd together the field is strong. They start on positive\ncharge and end on negative, they never cross (a point cannot have two different \"which way\" answers),\nand they always meet a conductor's surface at a right angle.\n\nA **dipole** is the simplest interesting arrangement: +q and −q a small distance apart. Water\nmolecules are dipoles, which is why water dissolves salt. Far away the two charges almost cancel,\nso a dipole's field dies off as 1/r³ instead of 1/r² — faster, because you are seeing a\nnear-cancellation. Put a dipole in a uniform field and the two forces are equal and opposite, so it\ndoes not go anywhere; it just **twists** until it lines up. That twist is the torque τ = pE sin θ.\n\nFinally **Gauss's law**, the chapter's power tool. Picture the field lines as something streaming\noutward, and count how many pierce a closed surface you have drawn in the air. The count — the\n**flux** — depends only on how much charge you have wrapped up, never on the shape of the wrapper\nor where the charge sits inside it. Charges outside contribute exactly zero, because every line that\nenters must also leave. That is φ = q/ε₀, and it lets you get the field of a wire, a sheet or a\nsphere in three lines instead of a page of integration, provided you are clever enough to draw a\nsurface that matches the symmetry.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: electric charges and fields class 12 one shot](https://www.youtube.com/results?search_query=electric+charges+and+fields+class+12+physics+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: electric charges and field](https://www.khanacademy.org/science/in-in-class-12th-physics-india/in-in-electric-charges-and-field)\n- **The book the paper is set from** — [NCERT Physics Part I, Chapter 1 (PDF)](https://ncert.nic.in/textbook/pdf/leph101.pdf)\n- **HC Verma** — *Concepts of Physics* Part 2, Ch 29 *Electric Field and Potential*, §29.1–29.8. Read\n  the worked examples on Coulomb's law and superposition before you touch Gauss's law in Ch 30.","s":{"scope":"### In the syllabus\n\n- Electric charges; **conservation of charge**\n- **Coulomb's law** — force between two point charges; forces between multiple charges;\n  **superposition principle**; continuous charge distribution\n- **Electric field**; field due to a point charge; **electric field lines**\n- **Electric dipole**; field due to a dipole; **torque** on a dipole in a uniform field\n- **Electric flux**; statement of **Gauss's theorem** and its applications to find the field due to\n  - an infinitely long straight **wire**\n  - a uniformly charged infinite plane **sheet**\n  - a uniformly charged thin **spherical shell** (field inside and outside)"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p2","subj":"physics","num":2,"title":"Electrostatic Potential and Capacitance","unit":"Units I+II · Electrostatics & Current","unitMarks":16,"prio":1,"appear":"Units I + II (16 marks, shared with Ch 1 and Ch 3) · Typical appearance: 1–2 MCQs + a 2/3-mark question on equipotentials or energy, and frequently the 5-mark capacitor-with-dielectric derivation.","deleted":"- **Van de Graaff generator**","intro":"Lifting a bucket up a staircase takes work, and the higher you take it the more work it took. You do\nnot need to know the shape of the staircase — only the height. Gravity is like that, and so is\nelectricity. This chapter is the electrical version of \"height\".\n\nPush a positive charge towards another positive charge and you have to work at it, because it fights\nyou the whole way. That work does not vanish; it is stored, and released the instant you let go —\nthe charge flies apart. **Potential energy** is the name for the stored amount. Divide it by the\ncharge you were pushing and you get a property of the *place* rather than of the charge:\n**potential**, V, measured in volts. One volt means one joule of work per coulomb brought in from\nfar away. Potential is a single number at each point, not an arrow — which is exactly why it is\neasier to work with than the field, and why the chapter leans on it so heavily.\n\nThe link between the two is worth memorising as a picture, not a formula: **the field points\ndownhill on the potential**, and the steeper the hill the stronger the field. E = −dV/dr is just\nthat sentence in symbols. The minus sign is the word \"downhill\".\n\nAn **equipotential surface** is a contour line on that hill — every point on it at the same\npotential. Walk along a contour and you climb nothing, so no work is done, so the field can have no\ncomponent along it: **equipotentials and field lines always cross at right angles**. That single\nfact answers a surprising number of board questions.\n\nNow conductors. In a metal, charges are free to move, and they will keep moving as long as any\nfield pushes them. So once things have settled, the field *inside* must be exactly zero — otherwise\nthe charges would still be shuffling. Everything follows from that: all the excess charge sits on\nthe outer surface, the whole body is at one potential, and the field just outside meets the surface\nperpendicularly. This is why a car is a safe place in a lightning storm.\n\n**Capacitance** is the chapter's second big idea, and it is a much humbler one than it looks. Take\nany two conductors, put +Q on one and −Q on the other, and a voltage V appears between them. The\nratio C = Q/V turns out to depend only on their shape and spacing, never on how much charge you\nused. So C is a fixed property of the arrangement — a measure of how much charge it will swallow\nper volt. A capacitor is a bucket for charge, and C is the size of the bucket.\n\nWhy does bringing the plates closer, or making them bigger, increase C? Because both make it easier\nto hold the charge: more area gives the charge more room to spread out, and a smaller gap means the\nopposite charge is nearby pulling it in, so less voltage builds up for the same Q. Hence\nC = ε₀A/d.\n\nSlide a slab of glass or plastic — a **dielectric** — into the gap and C goes up by a factor K. The\nreason is pretty: the slab's own molecules are dipoles, and they all swing round to point against\nthe applied field, producing a weak field of their own that partly cancels it. Less net field means\nless voltage for the same charge, which means more capacitance.\n\nCharging a capacitor stores energy, U = ½CV², and the ½ trips people up. It is there because the\nfirst bit of charge goes on for free while the capacitor is still empty, and the last bit has to be\nforced in against everything already there. You are paying an increasing price, so the total is the\n*average* price times the amount — hence one half.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: electrostatic potential and capacitance class 12 one shot](https://www.youtube.com/results?search_query=electrostatic+potential+and+capacitance+class+12+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: electrostatic potential and capacitance](https://www.khanacademy.org/science/in-in-class-12th-physics-india/in-in-electrostatic-potential-and-capacitance)\n- **The book the paper is set from** — [NCERT Physics Part I, Chapter 2 (PDF)](https://ncert.nic.in/textbook/pdf/leph102.pdf)\n- **HC Verma** — *Concepts of Physics* Part 2, Ch 29 §29.9–29.14 for potential, then Ch 31\n  *Capacitors* entire. HC Verma's treatment of the energy stored and of the dielectric slab is\n  clearer than the NCERT's; do his in-chapter examples.","s":{"scope":"### In the syllabus\n\n- **Electric potential** and potential difference; potential due to a **point charge**, a **dipole**,\n  and a **system of charges**\n- **Equipotential surfaces**\n- **Electric potential energy** of a system of two point charges, and of an electric **dipole** in an\n  electrostatic field\n- **Conductors and insulators**; free and bound charges inside a conductor\n- **Dielectrics** and electric **polarisation**\n- **Capacitors and capacitance**; combination in **series and parallel**\n- **Capacitance of a parallel-plate capacitor**, with and without a dielectric medium\n- **Energy stored** in a capacitor"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p3","subj":"physics","num":3,"title":"Current Electricity","unit":"Units I+II · Electrostatics & Current","unitMarks":16,"prio":1,"appear":"Units I + II (16 marks, shared with Ch 1 and Ch 2) · Typical appearance: 1–2 MCQs + one or two 2/3-mark questions + often the 5-mark drift-velocity or Wheatstone-bridge derivation. Also the single most likely source of a Section-D case study.","deleted":"- **Potentiometer** — theory **and** the practical experiments (comparing emfs of two cells;\n  measuring internal resistance)\n- **Carbon resistors** and the resistor **colour code**\n\n> **This is one of the biggest deletions in the syllabus.** The potentiometer was a guaranteed\n> 3–5 mark question for a decade. Its weight has gone to Kirchhoff's rules, the Wheatstone bridge and\n> the drift-velocity derivation. If a practice paper asks you to compare the emfs of two cells with a\n> potentiometer, or to read a resistor colour code, it is an old paper.","intro":"A copper wire is full of electrons that are already moving — fast, in every direction, bouncing off\nthe atoms like a swarm of flies in a jar. Connect a battery and almost nothing changes about that\nchaos. All that happens is that the whole swarm acquires a slight drift in one direction, a crawl of\nroughly a millimetre a second on top of speeds of hundreds of kilometres a second. That crawl is the\n**current**. It is the single most useful picture in this chapter, and it explains why the light\ncomes on instantly even though the electrons themselves are so slow: the field that starts them\ndrifting travels at nearly the speed of light, so every electron in the wire begins its crawl at\nonce.\n\nSo current I = q/t is the number of coulombs strolling past a point each second, and one ampere is\none coulomb per second. Underneath it sits I = neAv_d — number of carriers per cubic metre, times\nthe charge on each, times the cross-section, times the drift speed. That is just \"how many pass per\nsecond\", written out.\n\n**Why is there any resistance at all?** Because of the bouncing. An electron is accelerated by the\nfield, then slams into the lattice and loses what it gained, then accelerates again. The average\ntime between collisions is called τ, and it fixes everything: a longer τ means a freer run, a\nlarger drift, a bigger current, a smaller resistance. **Ohm's law**, V = IR, is not a law of nature\nso much as a good description of what happens when τ does not itself depend on the voltage — true\nfor a metal at fixed temperature, false for a diode, false for a filament that heats up.\n\nDistinguish **resistance** from **resistivity** and the chapter gets much easier. Resistivity ρ is\na property of the material — copper has one value, nichrome another, and no amount of cutting or\nstretching changes it. Resistance R = ρl/A is a property of the *particular piece*: long and thin\nmeans high resistance, short and fat means low, exactly like water through a pipe. Heat a metal and\nρ rises, because hotter atoms vibrate more and get in the way more often. Heat a semiconductor and ρ\n*falls*, because heat shakes loose more carriers than it adds obstruction — the opposite behaviour,\nand a favourite one-mark question.\n\nA **real battery** is not a pure voltage source. It has its own internal resistance r, so the\nvoltage you actually get at the terminals, V = ε − Ir, sags as you draw more current. The **emf** ε\nis what it would give if you drew nothing. This is why a torch dims as the cells age: r has crept up.\n\n**Series and parallel** are worth understanding rather than memorising. In series, everything must\npass through each resistor in turn, so resistances add. In parallel, you have added extra routes, so\nthe total resistance must come *out lower than the smallest branch* — if that is not what your\nanswer says, you have made an arithmetic slip.\n\n**Kirchhoff's two rules** cover everything the series/parallel shortcuts cannot. The junction rule\nsays charge does not pile up at a junction, so what flows in flows out. The loop rule says if you\nwalk all the way round a closed loop and return to where you started, you are back at the same\npotential, so the rises and drops must cancel. Every circuit problem in the paper is those two rules\nplus careful signs.\n\nThe **Wheatstone bridge** is the elegant application: four resistors in a diamond with a\ngalvanometer across the middle. When P/Q = R/S the two midpoints happen to sit at the same\npotential, so no current flows through the galvanometer at all, whatever the battery does. That\nlets you measure an unknown resistance by *balancing* rather than by reading a meter — and a null\nreading is far more accurate than a deflection, because it does not depend on the meter being\ncalibrated.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: current electricity class 12 one shot](https://www.youtube.com/results?search_query=current+electricity+class+12+physics+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: current electricity](https://www.khanacademy.org/search?page_search_query=current%20electricity%20class%2012)\n- **The book the paper is set from** — [NCERT Physics Part I, Chapter 3 (PDF)](https://ncert.nic.in/textbook/pdf/leph103.pdf)\n- **HC Verma** — *Concepts of Physics* Part 2, Ch 32 *Electric Current in Conductors*, all of it.\n  §32.2–32.4 on drift speed and the origin of resistance is the clearest short account in print;\n  §32.11 onwards does Kirchhoff and the bridge.","s":{"scope":"### In the syllabus\n\n- Mechanism of the flow of current in conductors\n- **Mobility**, **drift velocity** and its relation with electric current\n- **Ohm's law**; V–I characteristics (linear and non-linear)\n- Electrical **energy and power**\n- Electrical **resistivity and conductivity**; **temperature dependence** of resistance\n- **Internal resistance** of a cell; potential difference and **emf**\n- **Combination of cells** in series and in parallel\n- **Kirchhoff's rules** and their applications\n- **Wheatstone bridge**"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p4","subj":"physics","num":4,"title":"Moving Charges and Magnetism","unit":"Units III+IV · Magnetism, EMI & AC","unitMarks":17,"prio":1,"appear":"Units III + IV (17 marks, shared with Ch 5, 6, 7) · Typical appearance: 1–2 MCQs + a 2/3-mark force or field question, and often a 5-marker on the circular-loop field or the moving-coil galvanometer.","deleted":"- **Cyclotron** — construction, working, and the resonance-frequency derivation\n- **Toroid** — the Ampere's-law application to a toroidal solenoid\n\n> **Two notes on scope.** (i) The cyclotron was a standard 3-mark derivation for years and is now\n> fully out. (ii) The solenoid is listed as **qualitative treatment only** — so know the field\n> pattern and the result B = μ₀nI, but the marks are in describing and using it rather than in a\n> full Ampere's-law derivation. The **long straight wire** is the application that is explicitly\n> named for derivation.","intro":"In 1820 Oersted put a compass needle next to a wire, switched on the current, and the needle swung.\nNobody had expected electricity and magnetism to have anything to do with each other. That accident\nis where this chapter starts: **a moving charge makes a magnetic field, and a magnetic field pushes\non a moving charge.** Everything else is detail.\n\nStart with the push. The force on a charge moving through a magnetic field is F = qvB sin θ, and it\nbehaves unlike any force you have met before in two ways. First, it vanishes if the charge is\nsitting still or moving straight along the field — only motion *across* the field counts. Second,\nand stranger, **it is always perpendicular to the motion**. A force at right angles to velocity can\nnever speed anything up or slow it down; it can only bend. So a magnetic field does no work, never\nchanges a particle's kinetic energy, and turns a free charge into a circle. Set qvB equal to\nmv²/r and you get r = mv/qB: heavier or faster particles curve wide, stronger fields curve them\ntight. That is the cyclotron in one line, and the reason the time for one lap, T = 2πm/qB, does not\ndepend on the speed at all — which is the trick that makes a cyclotron possible.\n\nA current-carrying wire is just a lot of moving ch
