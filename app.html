arges, so it feels the same push, F = BIl sin θ.\nThis is a motor. Two parallel wires each sit in the other's field, so they attract when their\ncurrents run the same way and repel when they oppose — and that force is how the ampere itself was\ndefined for over a century.\n\nNow the other direction: what field does a current *make*? The **Biot–Savart law** is the answer,\nand it is best read as the magnetic twin of Coulomb's law. A tiny piece of wire of length dl\ncarrying current I contributes a field that grows with I and dl, falls off as 1/r², and — the new\npart — points at right angles to both the wire and the line joining it to your point. Nothing in\nelectrostatics behaves that way; magnetic fields curl around their source instead of pointing away\nfrom it. Hence the right-hand rule, and hence a straight wire's field circles it, B = μ₀I/2πr, while\na loop's field threads through it, B = μ₀I/2R at the centre.\n\n**Ampere's circuital law** is Gauss's law's counterpart, and it earns its place for the same reason:\nwhere there is symmetry, it replaces a hard integral with a short argument. Walk a closed loop\nthrough the field, adding up B along your path as you go, and the total depends only on how much\ncurrent your loop encircles. Choose the loop to run along the field and it collapses to one\nmultiplication. That gives you the long straight wire in two lines.\n\nThe **solenoid** — a long coil — is where this becomes useful. Its fields add up inside and largely\ncancel outside, leaving a nearly uniform field down the middle, B = μ₀nI, that depends only on the\nturns per metre. It is a bar magnet you can switch off, and it is how you make a strong controlled\nfield in a lab.\n\nLast, the **moving-coil galvanometer**, which is the chapter's ideas assembled into an instrument.\nA coil hangs in a radial field; a current through it feels a torque; a spring resists; the coil\nstops where the two balance, so the deflection reads the current. Its two weaknesses are its two\nstandard questions: it is easily damaged by large currents, and it is a low-resistance device, so\nyou turn it into an ammeter by hanging a *small* shunt across it and into a voltmeter by putting a\n*large* resistance in series. The logic is worth reasoning out each time rather than memorising —\nan ammeter goes in the path of the current, so it must barely resist; a voltmeter goes across a\ngap, so it must barely steal any current.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: moving charges and magnetism class 12 one shot](https://www.youtube.com/results?search_query=moving+charges+and+magnetism+class+12+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: moving charges and magnetism](https://www.khanacademy.org/science/in-in-class-12th-physics-india/moving-charges-and-magnetism)\n- **The book the paper is set from** — [NCERT Physics Part I, Chapter 4 (PDF)](https://ncert.nic.in/textbook/pdf/leph104.pdf)\n- **HC Verma** — *Concepts of Physics* Part 2, Ch 34 *Magnetic Field* for the force and circular\n  motion, Ch 35 *Magnetic Field due to a Current* for Biot–Savart and Ampere. Do the worked examples\n  in §35.4 (straight wire) and §35.6 (solenoid) before attempting the derivations.","s":{"scope":"### In the syllabus\n\n- Concept of magnetic field; **Oersted's experiment**\n- **Biot–Savart law** and its application to a current-carrying **circular loop**\n- **Ampere's law** and its application to an **infinitely long straight wire**\n- **Straight solenoid** — *qualitative treatment only*\n- **Force on a moving charge** in uniform magnetic and electric fields\n- **Force on a current-carrying conductor** in a uniform magnetic field\n- **Force between two parallel current-carrying conductors** — definition of the **ampere**\n- **Torque** on a current loop in a uniform magnetic field\n- **Moving-coil galvanometer** — current sensitivity, and conversion to an **ammeter** and a\n  **voltmeter**"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p5","subj":"physics","num":5,"title":"Magnetism and Matter","unit":"Units III+IV · Magnetism, EMI & AC","unitMarks":17,"prio":3,"appear":"Units III + IV (17 marks, shared with Ch 4, 6, 7) · Typical appearance: one 1-mark MCQ, sometimes a 2-mark question on Earth's magnetic elements or material types. Rarely more.","deleted":"- **Magnetic susceptibility** (χ) and **permeability** (μ, μ_r), and the relations between them\n- **Magnetisation** M and magnetic intensity H, and the relation B = μ₀(H + M)\n- **Hysteresis** loops, retentivity, coercivity\n- **Electromagnets**, the factors affecting their strength, and **permanent magnets**\n- **Magnetic dipole moment of a revolving electron**\n- Magnetic field of a **bar magnet** along its **axial** and **equatorial** lines (the analogue of the\n  electric dipole formulas)\n- Tangent galvanometer; oscillation-of-a-magnet timing experiments\n\n> **A note on scope, honestly stated.** This chapter's syllabus line has been trimmed more than once,\n> and different publishers disagree about exactly what survived. What is certain: the whole\n> **quantitative magnetic-materials** block (χ, μ_r, M, H, hysteresis, electromagnets) is out, and\n> so are the bar-magnet axial/equatorial field formulas. What is certain to *stay*: bar magnet as an\n> equivalent solenoid, field lines, and Earth's magnetism.\n>\n> **Practical advice:** learn the short retained list properly, know τ = **m** × **B** and the\n> qualitative material table, and do **not** invest time in χ, μ_r or hysteresis. Then check the\n> current year's CBSE syllabus PDF to confirm. Given the chapter is worth roughly 1–3 marks, this is\n> not a place to spend more effort than that.","intro":"A compass has worked for a thousand years and the reason is that the Earth is, roughly, a very large\nbar magnet with its south pole buried under the northern hemisphere. This chapter is about magnets\nas objects — what they are made of, what they do in a field, and why some materials become magnets\nand others refuse.\n\nThe first thing to be clear about: **there is no such thing as a single magnetic pole.** Snap a bar\nmagnet in half and you do not get a loose north and a loose south; you get two smaller magnets, each\nwith both. Cut again and again, and you never separate them. This is the deep difference from\nelectricity, where isolated positive and negative charges are everywhere. In field-line language it\nmeans magnetic field lines never start or stop anywhere — they always close on themselves, passing\nthrough the magnet and back around outside.\n\nSo a magnet's basic unit is not a pole but a **dipole**, described by its magnetic moment m. And if\nyou compare a bar magnet's field pattern with a current loop's, they are identical. That is the\nchapter's central insight and it is not a coincidence: **a magnet's magnetism comes from currents**\n— electrons circulating inside atoms. There is no magnetic \"stuff\", only moving charge.\n\nBecause a magnet is a dipole, everything you learned about an electric dipole in Chapter 1 carries\nacross unchanged. In a uniform field the forces on the two ends are equal and opposite, so the\nmagnet does not move; it **twists** until it lines up, with torque τ = mB sin θ. Its potential\nenergy is U = −mB cos θ, lowest when aligned and highest when reversed, which is why a compass\nsettles pointing north and stays there.\n\n**Earth's magnetism** is described by three numbers, and they are all just \"how is the field\noriented here?\" The **declination** is how far magnetic north is from true north as you look down at\na map. The **dip** (or inclination) is how far the field tilts down into the ground — nearly zero at\nthe equator, nearly vertical at the poles. The **horizontal component** is the part of the field\nlying flat, which is the only part a compass needle floating on a pivot can respond to. The relation\nB_H = B cos δ is trigonometry, nothing more.\n\nThen the materials. Every atom is a tiny current loop, so every material responds to a field\nsomehow; the question is how. **Diamagnetic** materials (water, copper, bismuth) have atoms whose\ninternal currents cancel, so they have no moment of their own; an applied field induces a weak\nopposing one, and they are pushed feebly *out* of the field. **Paramagnetic** materials (aluminium,\noxygen) have atoms with a small permanent moment each, but thermal jostling keeps them randomly\npointed; a field lines up a few of them and they are pulled weakly *in*. **Ferromagnetic** materials\n(iron, cobalt, nickel) are the dramatic case: neighbouring atoms lock their moments parallel over\nwhole regions called domains, so a modest field can align enormous numbers at once and the material\nbecomes strongly magnetised — and stays that way. Heat any ferromagnet past its Curie temperature\nand the locking breaks; it turns paramagnetic and forgets it was ever a magnet.\n\n> **Check the scope before you invest time here.** In the rationalised syllabus much of the\n> magnetic-materials treatment — and the hysteresis loop in particular — has been trimmed. This\n> chapter's §1 lists what is in and what is out; read it first. The examinable core is the bar\n> magnet as a dipole, torque and energy, and Earth's magnetic elements.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: magnetism and matter class 12 one shot](https://www.youtube.com/results?search_query=magnetism+and+matter+class+12+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: magnetism and matter](https://www.khanacademy.org/search?page_search_query=magnetism%20and%20matter%20class%2012)\n- **The book the paper is set from** — [NCERT Physics Part I, Chapter 5 (PDF)](https://ncert.nic.in/textbook/pdf/leph105.pdf)\n- **HC Verma** — *Concepts of Physics* Part 2, Ch 36 *Permanent Magnets* §36.1–36.6 for poles,\n  dipole moment and Earth's field; Ch 37 *Magnetic Properties of Matter* for the three classes of\n  material. Read only as far as your syllabus scope goes.","s":{"scope":"### In the syllabus\n\nThe official CBSE line for this chapter is short:\n\n- **Bar magnet as an equivalent solenoid**; **magnetic field lines**\n- **Earth's magnetic field and magnetic elements**\n\nAlongside these, two things are routinely examined at 1–2 mark level and cost almost nothing to\nlearn, so they are included below:\n\n- **Torque on a magnetic dipole**, τ = **m** × **B** — this is the same physics as *torque on a\n  current loop*, which is explicitly in [Ch 4](04-moving-charges-and-magnetism.md)\n- The **qualitative** comparison of **para-, dia- and ferromagnetic** substances"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p6","subj":"physics","num":6,"title":"Electromagnetic Induction","unit":"Units III+IV · Magnetism, EMI & AC","unitMarks":17,"prio":1,"appear":"Units III + IV (17 marks, shared with Ch 4, 5, 7) · Typical appearance: 1–2 MCQs + a 2/3-mark Lenz's-law or inductance question, and often a 5-marker on the AC generator or self/mutual inductance.","deleted":"Nothing substantial was removed from this chapter.","intro":"Chapter 4 showed that a current makes a magnetic field. The obvious question — can a magnetic field\nmake a current? — took eleven years and Michael Faraday to answer, and the answer turned out to be\nthe basis of every power station on Earth.\n\nHere is the experiment you should keep in your head. A coil of wire, a galvanometer across it, and a\nbar magnet. Hold the magnet still inside the coil: nothing. Move it in: the needle kicks one way.\nMove it out: the needle kicks the other way. Move it faster: a bigger kick. **It is the changing\nthat matters, not the field itself.** A steady field, however strong, induces nothing.\n\nTo say \"changing\" precisely we need a way to count how much field is threading the coil. That count\nis the **flux**, φ = BA cos θ, and it is worth reading as three separate knobs. You can change the\nfield strength B, or the area A the coil presents, or the angle θ at which the field meets it. Turn\nany one of those and the flux changes and a current appears. A generator turns θ; a transformer\nturns B; a rod sliding on rails turns A. Different machines, one idea.\n\n**Faraday's law** is then just \"the emf equals how fast the flux is changing\": ε = −dφ/dt. Note what\nthis is *not* — the emf does not depend on how big the flux is, only on how quickly it is changing.\nA coil sitting in an enormous steady field has an enormous flux and zero emf.\n\nThe minus sign is **Lenz's law**, and it deserves a paragraph of its own because it is the most\ncommonly mishandled idea in the chapter. It says the induced current always flows in whatever\ndirection *opposes the change that produced it*. Push the north pole of a magnet towards a coil and\nthe coil generates a north pole to face it and push back. Pull the magnet away and the coil switches\nto a south pole to hold it. The coil always resists you. Why? Because if it helped you instead, the\nmagnet would accelerate on its own, generating more current, accelerating further — free energy\nforever. Lenz's law is conservation of energy wearing a different hat. That is the answer to\n\"justify the negative sign\", and it is worth writing exactly that way.\n\n**Motional emf** is the same law from a different angle. Slide a conducting rod of length l along\nrails at speed v through a field B and you get ε = Blv. You can derive that from flux — the circuit's\narea is growing at a rate lv — or you can see it directly: each free electron in the moving rod is a\ncharge moving through a field, so it feels a qvB push along the rod, and charge piles up at the ends\nuntil the voltage stops the pile-up. Both routes give the same answer, and being able to switch\nbetween them is the sign that you have understood the chapter rather than memorised it.\n\n**Eddy currents** are induced currents in a solid lump of metal instead of a wire. They obey Lenz\ntoo, so they oppose whatever motion made them — which makes them a brake. Trains use them; so do\ninduction cooktops, where the currents are deliberately allowed to waste their energy as heat. In a\ntransformer they are a nuisance, which is why the core is built from thin laminated sheets: the\nsheets break up the loops the currents want to run in.\n\nThe chapter closes with **inductance**, the last piece before AC. A coil resists a *change* in its\nown current, because a changing current changes its own flux, which induces an emf opposing the\nchange. The constant of proportionality is L, the self-inductance: ε = −L dI/dt. It is electrical\ninertia — the exact analogue of mass. A capacitor resists a change in voltage; an inductor resists a\nchange in current; and once you see them as a pair, Chapter 7 becomes much less mysterious.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: electromagnetic induction class 12 one shot](https://www.youtube.com/results?search_query=electromagnetic+induction+class+12+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: electromagnetic induction](https://www.khanacademy.org/search?page_search_query=electromagnetic%20induction%20class%2012)\n- **The book the paper is set from** — [NCERT Physics Part I, Chapter 6 (PDF)](https://ncert.nic.in/textbook/pdf/leph106.pdf)\n- **HC Verma** — *Concepts of Physics* Part 2, Ch 38 *Electromagnetic Induction*, all of it. His\n  §38.4 on Lenz's law and §38.6 on motional emf are the two sections to read twice; the worked\n  examples on the sliding rod are exactly the board's favourite setup.","s":{"scope":"### In the syllabus\n\n- **Electromagnetic induction**\n- **Faraday's laws**; induced emf and current\n- **Lenz's law**; **eddy currents**\n- **Self and mutual induction**\n- **AC generator** — *(the CBSE syllabus lists this under Chapter 7, while NCERT places it in\n  Chapter 6. It is the same unit either way; it is covered here because the physics is Faraday's\n  law.)*"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p7","subj":"physics","num":7,"title":"Alternating Current","unit":"Units III+IV · Magnetism, EMI & AC","unitMarks":17,"prio":1,"appear":"Units III + IV (17 marks, shared with Ch 4, 5, 6) · Typical appearance: 1–2 MCQs + a 2/3-mark question on rms values or reactance, and — very reliably — the 5-mark series-LCR-with-phasor-diagram question. Along with Ray Optics, this is one of the two most predictable 5-markers in the paper.","deleted":"- **LC oscillations** — the charge/current oscillation derivation and the analogy with SHM\n\n> **Note on \"phasors only\".** The syllabus explicitly restricts the LCR treatment to the **phasor**\n> method — you are not expected to solve the differential equation. So learn to *draw* the phasor\n> diagram and read the impedance off it. This is good news: the phasor method is much shorter, and it\n> is what the marking scheme wants.","intro":"The electricity in your wall socket does not flow one way. Fifty times a second it reverses, and the\nvoltage traces a smooth sine wave from +325 V to −325 V and back. We call the \"230 V\" on the label\nthe **rms** value, and the first thing this chapter has to explain is why we quote that odd number\ninstead of the peak.\n\nThe average of a sine wave over a full cycle is zero — as much above as below — so an average is\nuseless for describing AC. But the *heating* is not zero: a bulb does not care which way the current\ngoes, only how much there is, and heat goes as I². So we square the current, take the average of\nthat, and square-root it back. That is the root-mean-square, and it is defined precisely so that\nI_rms through a resistor produces the same heat as a steady DC current of the same value. Hence\nI_rms = I₀/√2, and 230 V rms is a 325 V peak.\n\nThen the chapter's real business: what a resistor, a capacitor and an inductor each do to AC, and\nthey do three different things.\n\nA **resistor** is dull, and usefully so. Voltage and current rise and fall together, in step. All\nthe energy delivered is dissipated as heat.\n\nA **capacitor** cannot pass DC at all — charge just piles up on the plates and stops. But with AC\nthe plates are being charged and discharged fifty times a second, so current sloshes back and forth\nin the wires continuously, and the faster you reverse, the easier it gets. So its opposition,\nX_C = 1/ωC, *falls* as frequency rises. And the current leads the voltage by a quarter cycle: the\ncurrent has to flow first before charge can accumulate to produce a voltage.\n\nAn **inductor** is the mirror image. It happily passes DC — it is only a coil of wire — but it fights\nchange, so the faster you reverse the harder it resists: X_L = ωL *rises* with frequency. Here the\nvoltage leads the current, because the coil's emf appears in response to the current changing.\n\nPut all three in series and you cannot simply add their oppositions, because their peaks happen at\ndifferent moments. This is why the **phasor diagram** exists: draw each voltage as an arrow whose\nangle records its timing, and adding arrows handles the timing automatically. The inductor's arrow\npoints up, the capacitor's down, the resistor's along — so the two reactances partly cancel, and the\ntotal is Z = √(R² + (X_L − X_C)²). That Pythagoras is a picture, not an accident.\n\n**Resonance** is where it gets beautiful. X_L rises with frequency and X_C falls, so at exactly one\nfrequency they are equal and cancel completely. At that point the circuit behaves as though the\ncapacitor and inductor were not there — impedance drops to just R, and the current shoots up to its\nmaximum. That frequency is ω = 1/√(LC). It is how a radio picks one station out of the air: you\nadjust C until the circuit resonates with the station you want, and every other frequency stays\nsmall.\n\n**Power** in AC has one trap, and the paper loves it. P = V_rms I_rms cos φ, where cos φ is the\n**power factor**. Only the resistor consumes energy; a pure inductor or capacitor gives back\neverything it takes, half a cycle later. So in a purely reactive circuit φ = 90°, cos φ = 0, and the\naverage power is exactly zero despite large currents flowing — the famous **wattless current**.\n\nFinally the **transformer**, which is Chapter 6 put to work. Two coils on a shared iron core: the\nfirst coil's changing current makes a changing flux, the core carries that flux to the second coil,\nand the second coil sees an emf. More turns on the output side means more voltage — and,\nbecause energy is conserved, correspondingly less current. This is why power lines run at hundreds\nof thousands of volts: for the same power delivered, high voltage means low current, and heating\nloss goes as I²R.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: alternating current class 12 one shot](https://www.youtube.com/results?search_query=alternating+current+class+12+physics+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: alternating current](https://www.khanacademy.org/science/in-in-class-12th-physics-india/x51bd77206da864f3:alternating-current)\n- **The book the paper is set from** — [NCERT Physics Part I, Chapter 7 (PDF)](https://ncert.nic.in/textbook/pdf/leph107.pdf)\n- **HC Verma** — *Concepts of Physics* Part 2, Ch 39 *Alternating Current*. Read §39.2 on rms\n  values and §39.5–39.7 on the series circuit and resonance; his phasor treatment is the one that\n  makes the √(R² + (X_L − X_C)²) obvious rather than arbitrary.","s":{"scope":"### In the syllabus\n\n- **Alternating currents**; **peak and RMS values** of alternating current/voltage\n- **Reactance** and **impedance**\n- **LCR series circuit** — *phasors only*\n- **Resonance**\n- **Power in AC circuits**; **power factor**; **wattless current**\n- **Transformer** *(and the AC generator, which is covered in\n  [Ch 6](06-electromagnetic-induction.md))*"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p8","subj":"physics","num":8,"title":"Electromagnetic Waves","unit":"Units V+VI · EM Waves & Optics","unitMarks":18,"prio":2,"appear":"Units V + VI (18 marks, shared with Ch 9 and Ch 10) · Typical appearance: 1–2 MCQs + a 2-mark question on the EM spectrum or the properties of EM waves. Small chapter, reliable marks — the best marks-per-page ratio in the book.","deleted":"Nothing substantial. Note the phrase \"**qualitative ideas only**\" — you are not asked to derive the\nwave equation from Maxwell's equations, only to know the properties and be able to justify them.\n\n> **Why this chapter is worth your time.** It is two or three pages of content that reliably supplies\n> 2–4 marks, mostly in Sections A and B, and the marks come from a single memorised table. Learn the\n> spectrum table cold and you have banked them.","intro":"By 1860 there were four laws of electricity and magnetism, and Maxwell noticed that one of them was\nbroken. Ampere's law said a magnetic field circles a current — but what about the gap between a\ncapacitor's plates, where no charge crosses and yet the circuit plainly works? Follow the law\nliterally and you get a magnetic field on one side of the gap and none on the other, which is\nabsurd.\n\nMaxwell's fix was to say that a **changing electric field** is, for magnetic purposes, as good as a\ncurrent. He called it the **displacement current**, I_d = ε₀ dφ_E/dt. In the capacitor gap the field\nbetween the plates is building up, and that build-up is exactly what keeps the magnetic field\ncontinuous. It is a small repair with an enormous consequence, and it is the one thing to remember\nfrom this short chapter.\n\nBecause now look at what the laws say together. A changing magnetic field creates an electric field\n— that is Faraday, Chapter 6. And a changing electric field creates a magnetic field — that is\nMaxwell's new term. So a changing field of either kind creates the other, which is itself changing,\nwhich recreates the first. The two fields sustain each other and travel, needing no wire, no charge\nand no medium at all. That is an **electromagnetic wave**, and light is one.\n\nMaxwell could even compute how fast it goes, from two numbers already measured in laboratories with\nbatteries and magnets: c = 1/√(μ₀ε₀), which comes out at 3 × 10⁸ m/s. That matched the measured\nspeed of light, and settled what light was — a question that had been open for two centuries.\n\nThe **structure** of the wave is worth picturing properly, because it is asked directly. E and B\noscillate in step, both at right angles to each other *and* both at right angles to the direction\nof travel — the wave is transverse twice over. Their magnitudes are locked: E₀/B₀ = c, so the\nelectric part is numerically much larger, which is why light interacts with matter mostly through\nits electric field. The direction of travel is along E × B.\n\nThe wave carries energy, split equally between the electric and magnetic halves. It also carries\n**momentum**, which is why a light beam exerts a faint pressure — the principle behind solar sails.\n\nThe **spectrum** is the same phenomenon across twenty-odd orders of magnitude of frequency, and the\nonly reason the bands have different names is the history of how each was discovered. Radio waves,\nmicrowaves, infrared, visible, ultraviolet, X-rays, gamma rays — one family, in order of increasing\nfrequency and decreasing wavelength. Learn that order, one production method and one use per band,\nand roughly where the boundaries sit; that is the whole of the chapter's factual load and it appears\nalmost every year as a one- or two-marker. Visible light occupies a laughably narrow slice, about\n400 to 700 nm, and the ozone layer's job is absorbing the ultraviolet just above it.\n\nThis is the shortest chapter in the book and among the most reliably rewarding: the questions are\nshort, factual and repetitive. Do not skip it because it looks slight.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: electromagnetic waves class 12 one shot](https://www.youtube.com/results?search_query=electromagnetic+waves+class+12+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: electromagnetic waves](https://www.khanacademy.org/search?page_search_query=electromagnetic%20waves%20class%2012)\n- **The book the paper is set from** — [NCERT Physics Part I, Chapter 8 (PDF)](https://ncert.nic.in/textbook/pdf/leph108.pdf)\n- **HC Verma** — *Concepts of Physics* Part 2, Ch 40 *Electromagnetic Waves*. It is brief, which\n  suits the chapter; read §40.1–40.3 for the displacement current and how the wave equation falls\n  out, and use the NCERT for the spectrum table.","s":{"scope":"### In the syllabus\n\n- **Basic idea of displacement current**\n- **Electromagnetic waves**, their **characteristics**, their **transverse nature** (qualitative ideas\n  only)\n- **Electromagnetic spectrum** — radio waves, microwaves, infrared, visible, ultraviolet, X-rays,\n  gamma rays — including **elementary facts about their uses**"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p9","subj":"physics","num":9,"title":"Ray Optics and Optical Instruments","unit":"Units V+VI · EM Waves & Optics","unitMarks":18,"prio":1,"appear":"Units V + VI (18 marks, shared with Ch 8 and Ch 10) · Ray Optics alone typically carries 8–10 marks, and it is the one chapter that appears in **every** section of the paper — MCQ, 2-mark, 3-mark derivation, case study, and a 5-mark instrument question.","deleted":"- **The human eye** — image formation, accommodation, and the correction of eye defects (myopia,\n  hypermetropia) using lenses\n- **Scattering of light** — the blue colour of the sky and the reddish appearance of the Sun at\n  sunrise and sunset\n\n> **Two notes.** (i) The eye-defects question (\"what lens does a myopic person need?\") was a\n> standard 2-marker and is now out. Old question banks are full of it. (ii) Dispersion by a prism\n> survives only as far as it is needed to discuss refraction through a prism; the\n> Rayleigh-scattering explanations are out.","intro":"Put a straw in a glass of water and it looks bent. Look at yourself in a spoon and you are upside\ndown. This chapter explains both, and it does the whole job with one simplifying assumption: that\nlight travels in straight lines, called **rays**, until something makes it turn. That assumption is\nnot strictly true — Chapter 10 is about where it fails — but it is excellent whenever the objects\nlight meets are much bigger than its wavelength, which covers every mirror and lens you will ever\nhold.\n\n**Reflection** you already know: the angle in equals the angle out. What is new is curved mirrors.\nA concave mirror (curving inwards, like the inside of a spoon) takes parallel rays and brings them\ntogether at the focus; a convex mirror spreads them apart so they only *appear* to come from a focus\nbehind it. Everything about image formation follows from tracing two rays and seeing where they\nmeet, and the mirror formula 1/v + 1/u = 1/f is the algebra of that tracing. The magnification\nm = −v/u tells you the size and, through its sign, whether the image is upright or inverted.\n\nThe sign convention is where most marks are lost, and it is not arbitrary — it is just \"measure\neverything from the mirror, and call the direction the light came from negative.\" Adopt it once,\napply it mechanically, never bend it mid-question. If your answer for a real image comes out\npositive, you have slipped.\n\n**Refraction** is the interesting half. Light travels slower in glass than in air, and when a wave\ncrosses a boundary at an angle, the side that enters first slows first, so the whole wavefront\npivots. That pivot is the bending. Snell's law, n₁ sin i = n₂ sin r, is the bookkeeping;\nn = c/v is the definition of the refractive index — how many times slower light goes in that\nmaterial. The bent straw is exactly this, and so is the fact that a pond looks shallower than it is.\n\n**Total internal reflection** is what happens when you push refraction past its limit. Going from\nglass into air, light bends *away* from the normal, so at a large enough angle inside — the critical\nangle — the refracted ray would have to bend past 90°, which is impossible. So none gets out; it all\nreflects back inside. This is not a partial reflection but a perfect one, and it is why optical\nfibres can carry light around corners for kilometres without losing it, and why a diamond sparkles.\n\nThe **prism** is the standard experiment: light in one face, out another, deviated by an angle δ.\nVary the angle of incidence and δ first falls, reaches a minimum, then rises — and at that minimum\nthe light passes symmetrically through the prism. That symmetry is what makes A + δ_m = i + e\ncollapse into the tidy formula for n. Because n depends slightly on colour, each colour deviates\ndifferently and white light fans out into a spectrum. That is **dispersion**, and it is why a prism\nmakes a rainbow and why cheap lenses show coloured fringes.\n\n**Lenses** are then refraction twice over, at two curved surfaces, and they behave like mirrors with\nthe signs rearranged: 1/v − 1/u = 1/f. **Power** P = 1/f, in dioptres, exists because when you stack\nlenses their powers simply add, which is far more convenient than combining focal lengths — and it is\nwhy your spectacle prescription is written in dioptres.\n\nThe chapter finishes with instruments — the microscope and the telescope — and both are the same\ntrick: one lens makes a real image, and a second lens is used as a magnifier to look at that image.\nFor a microscope you want both focal lengths short; for a telescope you want a long objective and a\nshort eyepiece, giving magnification f₀/fₑ. If you can explain *why* those requirements differ, you\nhave understood the instruments rather than memorised their formulae.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: ray optics and optical instruments class 12 one shot](https://www.youtube.com/results?search_query=ray+optics+and+optical+instruments+class+12+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: ray optics and optical instruments](https://www.khanacademy.org/science/in-in-class-12th-physics-india/in-in-ray-optics-and-optical-instruments)\n- **The book the paper is set from** — [NCERT Physics Part II, Chapter 9 (PDF)](https://ncert.nic.in/textbook/pdf/leph201.pdf)\n- **HC Verma** — *Concepts of Physics* Part 1, Ch 18 *Geometrical Optics*, all of it. His treatment\n  of the sign convention in §18.4 is the one to adopt, and §18.10–18.12 on the prism and dispersion\n  covers the board's derivations. Ch 19 *Optical Instruments* for the microscope and telescope.","s":{"scope":"### In the syllabus\n\n- **Reflection** of light; **spherical mirrors**; **mirror formula**\n- **Refraction** of light; **total internal reflection** and **optical fibres**\n- **Refraction at spherical surfaces**; **lenses**; **thin lens formula**; **lens maker's formula**\n- **Magnification**; **power of a lens**; **combination of thin lenses in contact**\n- **Refraction of light through a prism**\n- **Optical instruments:** **microscopes** and **astronomical telescopes** (reflecting and\n  refracting) and their **magnifying powers**"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p10","subj":"physics","num":10,"title":"Wave Optics","unit":"Units V+VI · EM Waves & Optics","unitMarks":18,"prio":1,"appear":"Units V + VI (18 marks, shared with Ch 8 and Ch 9) · Typical appearance: 1–2 MCQs + a 3-mark question on YDSE or single-slit diffraction, and sometimes a 5-marker combining both.","deleted":"- **Resolving power** of a microscope and of an astronomical telescope\n- **Validity of ray optics** (the Fresnel-distance discussion)\n- **Polarisation by scattering** (the blue sky / Rayleigh discussion)","intro":"Chapter 9 treated light as rays travelling in straight lines, and got a very long way on it. This\nchapter is about the situations where that picture collapses — and what light turns out to be\ninstead.\n\nHere is the experiment that settled it. Shine light through two very narrow slits, close together,\nonto a screen. Rays would predict two bright strips. What you actually get is a whole row of bright\nand dark bands, spread out across the screen. Where does the *dark* come from? Two lights cannot\nmake a shadow — unless light is a wave.\n\nThat is the key. A wave has a crest and a trough. Where a crest from one slit meets a crest from the\nother, they add and you get double brightness: **constructive interference**. Where a crest meets a\ntrough, they cancel and you get darkness: **destructive interference**. Which one happens at a\ngiven point on the screen depends purely on how much further the light from one slit had to travel\nthan from the other — the **path difference**. A whole number of wavelengths of extra path means\ncrests still meet crests, so bright. A half-number means bright meets dark, so dark. Every formula\nin the chapter is that sentence with geometry attached: d sin θ = nλ for a bright fringe, and the\nfringe spacing β = λD/d.\n\nLook at what that spacing says, because it explains why nobody noticed this for so long. The\nfringes are wider if the wavelength is longer, if the screen is further away, or if the slits are\ncloser together. Visible light's wavelength is around half a micron — so unless your slits are a\nfraction of a millimetre apart, the fringes are far too fine to see. Ray optics works in daily life\nnot because light is not a wave, but because its wavelength is tiny compared with everything we\nput in its way.\n\nThe setup only works if the two slits stay in step, crest for crest, moment to moment. That\ncondition is **coherence**, and it is why the experiment uses one source split in two rather than\ntwo separate lamps: two independent lamps drift in and out of step millions of times a second, so\nthe fringes wash out into an even glow. This is the standard \"why must the sources be coherent\"\nquestion, and the answer is that word \"drift\".\n\n**Huygens' principle** is the tool that makes all this calculable. It says: treat every point on a\nwavefront as a tiny source of new circular wavelets, and the next wavefront is the surface they all\ntouch. It sounds like a strange bookkeeping trick, and it is, but it correctly produces reflection\nand refraction — including *why* light bends towards the normal when it slows down, which ray optics\nhad to assume.\n\n**Diffraction** is the same wave nature showing up at a single slit. Light spreads into the\ngeometrical shadow, giving a wide central bright band with weaker ones beside it. The central band's\nwidth goes as λ/a — narrow the slit and the pattern spreads *out*, which is the opposite of what\nrays would say and a good test of whether you are thinking in waves. This is also the hard limit on\nevery telescope and microscope ever built: you cannot resolve detail finer than diffraction allows.\n\nThe one thing rays and waves *both* fail to make obvious is that light's oscillation has a\ndirection across the beam. Filter out all but one direction and you have **polarised** light — proof\nthat light is a transverse wave, since a longitudinal wave like sound has no \"across\" to filter.\n\n> **Check the scope for your year.** Polarisation is the part of this chapter most affected by\n> syllabus rationalisation, and Brewster's law in particular. §1 of this chapter flags what to\n> verify against the current CBSE syllabus before spending time on it. Interference and single-slit\n> diffraction are the reliable core.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: wave optics class 12 one shot](https://www.youtube.com/results?search_query=wave+optics+class+12+physics+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: wave optics](https://www.khanacademy.org/science/in-in-class-12th-physics-india/in-in-wave-optics)\n- **The book the paper is set from** — [NCERT Physics Part II, Chapter 10 (PDF)](https://ncert.nic.in/textbook/pdf/leph202.pdf)\n- **HC Verma** — *Concepts of Physics* Part 1, Ch 17 *Light Waves*. §17.3–17.6 on Young's experiment\n  and the path-difference argument is the clearest short account available; §17.9 for diffraction.\n  Ch 16 *Sound Waves* §16.9 on interference is worth a look if the crest-and-trough picture has not\n  clicked yet — the same idea with something you can hear.","s":{"scope":"### In the syllabus\n\n- **Wavefront** and **Huygens' principle**\n- Reflection and refraction of a plane wave at a plane surface using wavefronts; **proof of the laws\n  of reflection and refraction using Huygens' principle**\n- **Interference**; **Young's double slit experiment** and the expression for **fringe width**\n  — the syllabus notes *\"no derivation, final expression only\"*\n- **Coherent sources** and **sustained interference** of light\n- **Diffraction due to a single slit**; **width of the central maximum** — the syllabus notes\n  *\"qualitative treatment only\"*\n\n\n### Scope you should verify for your year\n\nThe **polarisation block** — plane polarised light, **Brewster's law**, Malus's law, Polaroids and\ntheir uses — has been progressively trimmed from this chapter, and sources disagree about exactly\nwhat remains for the current session.\n\n> **Practical advice, honestly stated.** Treat polarisation as **low priority**: read the summary\n> below once so you are not blank if a 1-mark question appears, but do **not** derive Brewster's law\n> or drill Malus's-law numericals. Put that time into YDSE and single-slit diffraction, which are\n> certainly in the syllabus and carry most of the marks. Then confirm against the current CBSE\n> syllabus PDF for your session.\n\nNote also the two syllabus qualifiers above. \"**Final expression only**\" for the fringe width and\n\"**qualitative treatment only**\" for the central maximum mean the board does not require the full\nderivations. The short derivation is given below anyway — it is three lines, it makes the formula\nmemorable, and boards have sometimes asked for it — but if you are short of time, the **formula plus\nits consequences** is what you must have.\n\n---"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p11","subj":"physics","num":11,"title":"Dual Nature of Radiation and Matter","unit":"Units VII+VIII · Modern Physics","unitMarks":12,"prio":1,"appear":"Units VII + VIII (12 marks, shared with Ch 12 and Ch 13) · Typical appearance: 1–2 MCQs + a 2/3-mark question on Einstein's equation or the graphs, and a frequent source of Section-D case studies (the graphs make ideal \"source material\").","deleted":"- **Davisson–Germer experiment**","intro":"Chapter 10 just finished proving that light is a wave. This chapter proves it is a stream of\nparticles. Both are right, and physics has not fully recovered.\n\nThe experiment that forced it: shine light on a metal surface and electrons come off. That much a\nwave picture can live with — the wave shakes the electrons loose. But three details refuse to fit.\n\nFirst, **below a certain frequency nothing happens at all**, no matter how bright the light or how\nlong you wait. A wave picture cannot explain that; dim red light for an hour should deliver as much\nenergy as bright red light for a minute.\n\nSecond, **the electrons come out instantly** — within a nanosecond of the light arriving — even when\nthe light is extremely faint. A wave spread over the whole surface would take minutes to concentrate\nenough energy on a single electron.\n\nThird, **making the light brighter produces more electrons but not faster ones.** Their maximum\nenergy depends only on the *frequency*. Brightness changes the count, never the speed.\n\nEinstein's explanation was to take light's energy as arriving in indivisible lumps — **photons** —\neach carrying E = hν, and to say that one electron absorbs one photon, all or nothing. Everything\nfalls into place. There is a minimum energy needed to escape the metal, called the **work function**\nφ₀; if a single photon carries less than that, no amount of them will do, because you cannot add up\ntwo failed attempts. That is the threshold. Since it is one photon per electron, there is nothing to\naccumulate, so emission is instantaneous. And whatever energy is left over after paying the escape\ncost becomes kinetic energy: **K_max = hν − φ₀**, Einstein's photoelectric equation. Brightness is\njust photons per second, so it sets how many electrons, never how energetic.\n\nThe **stopping potential** is how you measure K_max without catching electrons: apply a reverse\nvoltage until even the fastest electron cannot make it across, and eV₀ = K_max. Plot V₀ against\nfrequency and you get a straight line whose slope is h/e — the same h for every metal, with only\nthe intercept changing. That graph is asked almost every year, and being able to say what the slope\nand the intercept each mean is worth more than reproducing the line.\n\nThen the chapter turns the strangeness around. If a wave can behave like a particle, can a particle\nbehave like a wave? De Broglie said yes and gave the wavelength: **λ = h/p**. This is not a\nmetaphor. Fire electrons at a crystal and they diffract, producing interference patterns exactly\nlike light through slits — which is what electron microscopes exploit. The reason you do not diffract\nwhen you walk through a doorway is that h is minuscule and your momentum is not: your wavelength\ncomes out around 10⁻³⁵ m, unmeasurably small. An electron accelerated through a few volts, though,\nhas a wavelength comparable to atomic spacing, and behaves accordingly. The useful shortcut for an\nelectron accelerated through V volts is λ = 1.227/√V nm.\n\nThe honest summary is that light is neither a wave nor a particle but something for which we have no\neveryday word, and which shows one face or the other depending on what you ask of it. Do not try to\nresolve that; the board does not expect you to. What it expects is that you can state the three\nobservations a wave picture cannot explain, and use hν − φ₀ correctly.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: dual nature of radiation and matter class 12 one shot](https://www.youtube.com/results?search_query=dual+nature+of+radiation+and+matter+class+12+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: photoelectric effect](https://www.khanacademy.org/search?page_search_query=photoelectric%20effect%20class%2012)\n- **The book the paper is set from** — [NCERT Physics Part II, Chapter 11 (PDF)](https://ncert.nic.in/textbook/pdf/leph203.pdf)\n- **HC Verma** — *Concepts of Physics* Part 2, Ch 42 *Photoelectric Effect and Wave–Particle\n  Duality*. §42.1–42.5 walk through the failures of the wave picture one at a time, which is exactly\n  how the board's 3-markers are framed.","s":{"scope":"### In the syllabus\n\n- **Dual nature of radiation**\n- **Photoelectric effect**; **Hertz and Lenard's observations**\n- **Einstein's photoelectric equation** — the particle nature of light\n- **Experimental study** of the photoelectric effect\n- **Matter waves** — the wave nature of particles; the **de Broglie relation**"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p12","subj":"physics","num":12,"title":"Atoms","unit":"Units VII+VIII · Modern Physics","unitMarks":12,"prio":1,"appear":"Units VII + VIII (12 marks, shared with Ch 11 and Ch 13) · Typical appearance: 1 MCQ + a 2/3-mark question on Bohr's postulates or the energy levels. Two memorised numbers do most of the work.","deleted":"- **de Broglie's explanation of Bohr's second postulate** (the standing-wave justification of\n  angular-momentum quantisation)\n\n> **On \"qualitative treatment only\" for the spectra.** Know the **names and regions** of the series\n> (Lyman, Balmer, Paschen…) and which transitions produce them; the Rydberg formula is given below\n> and is still useful for numericals, but the marks are concentrated in the energy-level picture\n> rather than in wavelength arithmetic.","intro":"What is inside an atom? In 1911 nobody knew, so Rutherford's group did the obvious thing: fired\nsomething small and fast at a thin gold foil and watched where it went. The something was alpha\nparticles; the foil was a few thousand atoms thick.\n\nAlmost all of them went straight through, barely deflected — so an atom is mostly empty space. But\nabout one in eight thousand came *straight back*. Rutherford said it was as astonishing as firing a\nshell at tissue paper and having it bounce back at you. To turn a fast, heavy alpha particle around,\nall the atom's positive charge and nearly all its mass must be crammed into a tiny hard centre. That\nis the **nucleus**, and the experiment even gave its size: about 10⁻¹⁵ m, against 10⁻¹⁰ m for the\natom. The atom is a hundred thousand times wider than its core — a cricket ball in the middle of a\nstadium, with electrons somewhere in the stands.\n\nWhich immediately created a crisis. If electrons orbit the nucleus like planets, they are\naccelerating, and Chapter 8 says accelerating charges radiate. They would spiral in and the atom\nwould collapse in a fraction of a nanosecond. Atoms plainly do not do this. Classical physics\npredicted that matter cannot exist.\n\n**Bohr's answer** was frankly a patch, and it is worth being honest about that, because it makes the\nthree postulates easier to remember rather than harder. He said: electrons may only occupy certain\nspecial orbits, in which — by decree — they do not radiate; the allowed ones are those where the\nangular momentum is a whole-number multiple of h/2π; and radiation happens only when an electron\n*jumps* between two of them, carrying away exactly the energy difference as one photon, hν = E₂ − E₁.\n\nThat last postulate is the one you can check against nature, and it works spectacularly. Because\nonly certain energies exist, only certain jumps exist, so only certain photon energies come out —\nwhich is why a hot gas emits sharp coloured lines instead of a continuous glow, and why every\nelement's set of lines is a fingerprint. Bohr's model gets hydrogen's energies exactly right:\nEₙ = −13.6/n² eV.\n\nRead that formula properly, because two things about it are asked constantly. The **negative sign**\nmeans the electron is bound — you must supply energy to remove it, and zero energy corresponds to a\nfree electron infinitely far away. And the **1/n²** means the levels crowd together as n rises: the\ngap from n = 1 to 2 is enormous, from 5 to 6 tiny. So 13.6 eV is the ionisation energy of hydrogen,\nthe cost of getting the electron from n = 1 all the way out.\n\nThe **spectral series** are then just families of jumps sorted by where they land. Everything falling\nto n = 1 is the Lyman series, and those are the biggest energy drops, hence ultraviolet. Everything\nfalling to n = 2 is Balmer — smaller drops, and these are the four visible hydrogen lines you may\nhave seen in a school discharge tube. Then Paschen to n = 3, Brackett to n = 4, in the infrared.\nYou do not need to memorise wavelengths; you need to know which series is which landing level, and\nthat a bigger drop means a shorter wavelength.\n\nBohr's model is wrong, incidentally — it fails for every atom with more than one electron, and\nquantum mechanics replaced it. But it is right about hydrogen, and it introduced the idea that\nenergy comes in levels, which survived. That is why it is still taught.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: atoms class 12 physics one shot Bohr model](https://www.youtube.com/results?search_query=atoms+class+12+physics+one+shot+bohr+model)\n- **Interactive lessons and practice** — [Khan Academy: Bohr's model of the atom](https://www.khanacademy.org/search?page_search_query=bohr%20model%20hydrogen%20atom)\n- **The book the paper is set from** — [NCERT Physics Part II, Chapter 12 (PDF)](https://ncert.nic.in/textbook/pdf/leph204.pdf)\n- **HC Verma** — *Concepts of Physics* Part 2, Ch 43 *Bohr's Model and Physics of the Atom*.\n  §43.1–43.5 derive the radius and energy from the postulates step by step, which is the derivation\n  the board asks for; §43.6 covers the series.","s":{"scope":"### In the syllabus\n\n- **Alpha-particle scattering experiment**; **Rutherford's model** of the atom\n- **Bohr model** of the hydrogen atom; expressions for the **radius** of the nᵗʰ orbit, and the\n  **velocity** and **energy** of the electron in the nᵗʰ orbit\n- **Hydrogen line spectra** — the syllabus notes *\"qualitative treatment only\"*"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p13","subj":"physics","num":13,"title":"Nuclei","unit":"Units VII+VIII · Modern Physics","unitMarks":12,"prio":1,"appear":"Units VII + VIII (12 marks, shared with Ch 11 and Ch 12) · Typical appearance: 1 MCQ + a 2/3-mark question, most often on the binding-energy-per-nucleon curve or a mass-defect numerical.","deleted":"- **Radioactivity** in its entirety:\n  - alpha, beta and gamma particles/rays and their properties\n  - **radioactive decay law**, N = N₀e^(−λt)\n  - **half-life** and **mean life**\n  - activity, becquerel and curie\n\n> **This is one of the largest deletions in the Physics syllabus.** Radioactivity used to supply most\n> of this chapter's numericals — half-life problems, decay-law calculations, activity questions.\n> **All of it is out.** Pre-2023 papers and question banks are dominated by it, so cross those\n> questions out before practising.\n>\n> What remains is small and highly predictable, and centres almost entirely on the **binding energy\n> per nucleon curve**.","intro":"Rutherford found the nucleus. This chapter asks what it is made of, why it holds together, and why\nsome of them fall apart.\n\nIt is made of protons and neutrons — collectively **nucleons** — packed into a sphere about\n10⁻¹⁵ m across. A quick calculation with R = R₀A^(1/3) gives a density of around 10¹⁷ kg/m³, which\nis roughly a hundred million tonnes per teaspoon. Notice also what that formula says: the radius\ngrows as the cube root of the number of nucleons, so volume grows in proportion to A, so **nuclear\ndensity is the same for every nucleus**. Nucleons are packed like marbles in a bag, touching, not\ncompressible.\n\nWhich raises the obvious problem: a nucleus is a handful of protons, all positive, jammed together.\nCoulomb's law says they should blow apart violently. Something much stronger is holding them, and it\nis called the **strong nuclear force** — attractive, indifferent to charge, and with an extremely\nshort range. Beyond a few femtometres it is simply absent, which is why very large nuclei are\nunstable: add enough protons and the electrostatic repulsion, which reaches across the whole\nnucleus, starts to beat a force that only acts between neighbours.\n\nNow the chapter's central and most beautiful fact. Weigh a helium nucleus and it comes out *lighter*\nthan its two protons and two neutrons weighed separately. Mass has gone missing. It has become\nbinding energy, via E = mc²: the **mass defect** Δm is the mass equivalent of the energy you would\nhave to supply to pull the nucleus apart. Bound systems weigh less than their parts. The\nconventional unit here is the atomic mass unit, and the number to remember is that **1 u releases\n931.5 MeV**.\n\nDivide the binding energy by the number of nucleons and you get **binding energy per nucleon**,\nwhich measures how tightly each nucleon is held — and the graph of it against A is the single most\nimportant picture in the chapter. It rises steeply for light nuclei, peaks around A = 56 (iron), and\nthen falls slowly. Everything about nuclear energy is on that graph. Nuclei to the left can move\n*up* the curve by joining together, releasing energy: that is **fusion**, and it is what the Sun\ndoes. Nuclei to the right can move up by splitting: that is **fission**, and it is what a reactor\ndoes. Both release energy because both end up with more tightly bound nucleons. Iron sits at the\npeak, which is why it is the ash of stellar burning and why you cannot extract energy from it by\neither route.\n\n**Radioactivity** is the other half of the chapter, and it is simpler than it looks. An unstable\nnucleus has three ways out. **Alpha** decay throws out a helium nucleus, dropping A by 4 and Z by 2\n— the route heavy nuclei take to shed bulk. **Beta** decay converts a neutron into a proton (or the\nreverse), changing Z by one while A stays put — the route for nuclei with the wrong neutron-to-proton\nbalance. **Gamma** emission changes neither; it is just an excited nucleus dropping to a lower\nenergy level, the nuclear version of Chapter 12's photon jump.\n\nThe **decay law** is worth understanding rather than memorising, because it explains the half-life.\nEach nucleus has a fixed probability of decaying in the next second, and no memory of how long it\nhas already waited. So the number decaying per second is proportional to how many are left:\ndN/dt = −λN, giving N = N₀e^(−λt). A fixed *fraction* goes per unit time, which is exactly what\nmakes the **half-life** a constant — the time for half of whatever remains to go, the same whether\nyou start with a kilogram or a microgram.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: nuclei class 12 physics one shot](https://www.youtube.com/results?search_query=nuclei+class+12+physics+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: nuclei, mass defect and binding energy](https://www.khanacademy.org/search?page_search_query=mass%20defect%20binding%20energy%20nuclei)\n- **The book the paper is set from** — [NCERT Physics Part II, Chapter 13 (PDF)](https://ncert.nic.in/textbook/pdf/leph205.pdf)\n- **HC Verma** — *Concepts of Physics* Part 2, Ch 46 *The Nucleus*. §46.2–46.5 on binding energy and\n  the BE-per-nucleon curve, then §46.6–46.9 for the decay law and the three decay modes. His\n  discussion of why the curve's shape permits both fission and fusion is the one to read.","s":{"scope":"### In the syllabus\n\n- **Composition and size** of the nucleus\n- **Nuclear force**\n- **Mass–energy relation**; **mass defect**\n- **Binding energy per nucleon** and its **variation with mass number**\n- **Nuclear fission**; **nuclear fusion**"},"lock":["recall","s.brief","s.pyq","s.sol","s.test","s.tips","tr.hi.pyq","tr.hi.sol"]},{"id":"p14","subj":"physics","num":14,"title":"Semiconductor Electronics","unit":"Unit IX · Electronic Devices","unitMarks":7,"prio":1,"appear":"Unit IX (7 marks — 10% of the paper) · Typical appearance: 1–2 MCQs + a 2/3-mark question, and very often one of the two Section-D case studies.","deleted":"- **Zener diode** and its use as a **voltage regulator**\n- **Optoelectronic devices** — LED, photodiode, solar cell\n- **Transistors** — construction, characteristics, transistor as an **amplifier**, as a **switch**, as\n  an **oscillator**\n- **Logic gates** — OR, AND, NOT, NAND, NOR, and their truth tables\n- **Digital electronics** and integrated circuits\n\n> **The deletion here is enormous.** Roughly two thirds of the old chapter is gone, including\n> everything students found difficult. The **7 marks did not go anywhere** — they are now concentrated\n> on the five surviving topics, which means the questions are more predictable than in any other\n> chapter. Two focused days here is worth more than two weeks on\n> [Ch 5 Magnetism and Matter](05-magnetism-and-matter.md).\n>\n> If a practice question mentions a transistor, a logic gate, a Zener diode or an LED, **skip it**.","recall":"```\nENERGY BANDS  (E_g = forbidden gap between valence and conduction bands)\n  CONDUCTOR     : E_g = 0, bands overlap ;  conductivity ↓ with T\n  SEMICONDUCTOR : E_g ≈ 1 eV (Si 1.1, Ge 0.7) ;  conductivity ↑ with T\n  INSULATOR     : E_g > 3 eV (diamond ≈ 6 eV)\n\nINTRINSIC : pure ;  n_e = n_h = n_i ;  conduction by BOTH electrons and holes\n  pairs created thermally ;  n_i rises fast with T ;  insulator at 0 K\n\nEXTRINSIC (doping ≈ 1 impurity per 10⁶ atoms)\n  n-TYPE : PENTAVALENT dopant (P, As, Sb, Bi) = DONOR\n           majority ELECTRONS, minority holes ;  n_e >> n_h\n  p-TYPE : TRIVALENT dopant (B, Al, In, Ga) = ACCEPTOR\n           majority HOLES, minority electrons ;  n_h >> n_e\n  BOTH ARE ELECTRICALLY NEUTRAL       n_e n_h = n_i²\n\np-n JUNCTION\n  diffusion of majority carriers → immobile ions exposed → DEPLETION REGION\n  (negative ions on the p-side, positive on the n-side)\n  internal field n → p ;  BARRIER POTENTIAL V_B ≈ 0.3 V (Ge), 0.7 V (Si)\n  equilibrium: diffusion current = drift current, net current zero\n\nFORWARD BIAS (p to +) : barrier ↓, depletion width ↓, current LARGE (mA),\n  majority carriers, resistance LOW ;  knee voltage 0.3 V Ge / 0.7 V Si\nREVERSE BIAS (p to −) : barrier ↑, depletion width ↑, current TINY (µA),\n  minority carriers, resistance HIGH ;  reverse saturation current is nearly\n  independent of voltage ;  breakdown at large reverse V\n\nI–V CHARACTERISTIC: non-linear ⟹ diode is NON-OHMIC\n  label the axes: mA for forward, µA for reverse\n  dynamic resistance r_d = ΔV/ΔI\n\nRECTIFIER: AC → unidirectional DC (the diode conducts one way only)\n  HALF-WAVE : 1 diode ; alternate half-cycles ; output frequency = input\n  FULL-WAVE : 2 diodes + CENTRE-TAPPED transformer ; both half-cycles ;\n              output frequency = 2 × input ; more efficient, less ripple\n  a capacitor in parallel with the load acts as a FILTER, smoothing the ripple\n```","intro":"Everything in your phone is in this chapter. It is also the chapter students most often try to\nmemorise and most often should not, because the whole thing follows from one idea: **you can control\nhow well a material conducts, and if you can do that you can build a switch with no moving parts.**\n\nStart with why materials differ at all. In an isolated atom electrons sit at sharp energy levels.\nBring 10²³ atoms together in a crystal and those levels smear into continuous **bands**, with gaps\nbetween them where no electron is allowed. Two bands matter: the **valence band**, full of the\nelectrons holding the crystal together, and the **conduction band** above it, where an electron is\nfree to roam and carry current. What decides everything is the gap between them.\n\nIn a **metal** the bands overlap, or the upper one is half full, so electrons can move with almost\nno persuasion — hence good conduction. In an **insulator** the gap is large, several electronvolts,\nand at room temperature no electron can cross it. A **semiconductor** is the interesting middle\ncase: a gap of about one electronvolt, small enough that thermal energy shakes a few electrons\nacross. So it conducts a little — and, importantly, it conducts *better when heated*, opposite to a\nmetal, because heat manufactures carriers rather than obstructing them.\n\nWhen an electron leaves the valence band it leaves behind a vacancy, and a neighbouring electron can\nslide into it, which moves the vacancy the other way. It is easier to keep track of the vacancy than\nof all the electrons shuffling, so we treat it as a positive particle called a **hole**. Holes are a\nbookkeeping convenience that behaves exactly like a real positive carrier.\n\nA pure semiconductor is not much use — too few carriers, and equal numbers of each. The trick is\n**doping**: replacing one atom in a million with a deliberate impurity. Silicon has four outer\nelectrons. Substitute an atom with five (phosphorus) and there is one electron spare, free to\nconduct: an **n-type** semiconductor, carrying current mainly by electrons. Substitute one with\nthree (boron) and there is one electron missing, a ready-made hole: **p-type**, carrying current\nmainly by holes. Both are still electrically neutral overall — this is a very common\nmisunderstanding. You added a neutral atom; you changed which carriers are available, not the total\ncharge.\n\nNow put a p-type region and an n-type region in contact, and the chapter's one real piece of\nmachinery appears. Electrons wander across into the p-side, holes into the n-side, and they\nannihilate near the boundary — leaving a thin **depletion region** with no free carriers, and\nexposed fixed ions on either side. Those ions set up a small built-in voltage, the **barrier\npotential**, pointing so as to stop further diffusion. Equilibrium.\n\nEverything a diode does follows from what an external voltage does to that barrier. Connect the\npositive terminal to the p-side — **forward bias** — and you oppose the built-in field, the\ndepletion region narrows, the barrier drops, and beyond about 0.7 V in silicon current flows\nfreely. Reverse the battery and you *reinforce* the barrier: the depletion region widens and almost\nnothing flows. A diode is a one-way valve, and that is the entire content of its I–V graph.\n\n**Rectification** is the application: AC in, DC out. A half-wave rectifier simply blocks the\nhalf-cycles it does not like, wasting half the input. A full-wave rectifier uses two diodes (or four\nin a bridge) arranged so that both halves of the cycle are routed through the load in the same\ndirection — so the output frequency is twice the input, a detail the board likes to ask about.\n\n> **Check your syllabus scope.** Transistors, logic gates and the Zener diode have been trimmed from\n> the rationalised syllabus. §1 of this chapter lists exactly what remains examinable; the reliable\n> core is bands, doping, the p–n junction, the diode's characteristics and rectification.\n\n**Learn it from someone else too**\n\n- **Video lecture** — [search: semiconductor electronics class 12 one shot](https://www.youtube.com/results?search_query=semiconductor+electronics+class+12+one+shot)\n- **Interactive lessons and practice** — [Khan Academy: semiconductors and p-n junction](https://www.khanacademy.org/search?page_search_query=semiconductor%20p-n%20junction%20diode)\n- **The book the paper is set from** — [NCERT Physics Part II, Chapter 14 (PDF)](https://ncert.nic.in/textbook/pdf/leph206.pdf)\n- **HC Verma** — *Concepts of Physics* Part 2, Ch 45 *Semiconductors and Semiconductor Devices*.\n  §45.1–45.6 for bands, doping and the junction; §45.7–45.8 for the diode and rectifier. Stop where\n  your syllabus does.","s":{"scope":"### In the syllabus — the whole of it\n\n- **Energy bands** in conductors, semiconductors and insulators (qualitative ideas only)\n- **Intrinsic and extrinsic** semiconductors — **p-type and n-type**\n- **p-n junction**\n- **Semiconductor diode** — **I–V characteristics** in forward and reverse bias\n- Application of the junction diode — **diode as a rectifier**\n\nThat is five topics. There is nothing else.","brief":"### Energy bands\n\nIn an isolated atom the electron energies are discrete levels. In a solid, the atoms are so close\nthat these levels broaden into **bands** of closely spaced allowed energies, separated by **forbidden\ngaps**.\n\n| Band | What it is |\n| --- | --- |\n| **Valence band** | The band containing the **valence electrons** — the highest band that is occupied at 0 K |\n| **Conduction band** | The next band above it. Electrons here are **free to move** and carry current |\n| **Forbidden energy gap (E_g)** | The energy gap between the top of the valence band and the bottom of the conduction band. No electron can have an energy in this gap |\n\n**Conduction requires electrons in the conduction band.** So the size of E_g determines whether a\nsolid conducts.\n\n**The three cases — draw all three diagrams:**\n\n```\n   CONDUCTOR              SEMICONDUCTOR              INSULATOR\n                          \n ┌─────────────┐        ┌─────────────┐           ┌─────────────┐\n │ conduction  │        │ conduction  │           │ conduction  │\n │    band     │        │    band     │           │    band     │\n ├─────────────┤        └─────────────┘           └─────────────┘\n │  overlap    │           E_g ≈ 1 eV                            \n │  (E_g = 0)  │        ┌─────────────┐              E_g > 3 eV  \n ├─────────────┤        │  valence    │                          \n │   valence   │        │    band     │           ┌─────────────┐\n │    band     │        │  (full)     │           │  valence    │\n └─────────────┘        └─────────────┘           │    band     │\n                                                  │  (full)     │\n                                                  └─────────────┘\n```\n\n| | **Conductor** | **Semiconductor** | **Insulator** |\n| --- | --- | --- | --- |\n| Forbidden gap E_g | **zero** — the bands **overlap**, or the valence band is only partly filled | **small**, ≈ 1 eV | **large**, > 3 eV |\n| Electrons in the conduction band at room temperature | very many | a few (thermally excited) | essentially none |\n| Conductivity | very high | intermediate | very low |\n| Effect of raising temperature | conductivity **decreases** | conductivity **increases** | remains an insulator |\n| Examples | copper, silver, aluminium | silicon (E_g = 1.1 eV), germanium (E_g = 0.7 eV) | diamond (E_g ≈ 6 eV), glass, wood |\n\n> **The key comparison is E_g.** In a semiconductor E_g ≈ 1 eV is comparable to the thermal energy\n> available at room temperature, so a small but useful number of electrons can be excited across the\n> gap. In an insulator E_g > 3 eV is far too large for thermal excitation. That one sentence answers\n> most questions in this section.\n\n### Intrinsic semiconductors\n\nAn **intrinsic semiconductor** is a **pure** semiconductor, with no added impurity.\n\nAt absolute zero the valence band is full and the conduction band empty, so it behaves as a perfect\ninsulator. At room temperature, thermal energy breaks a few covalent bonds, exciting electrons into\nthe conduction band. Each electron that leaves the valence band leaves behind a vacancy — a\n**hole**, which behaves as a **positive** charge carrier.\n\n**So in an intrinsic semiconductor, electrons and holes are always created in pairs:**\n\n```\n      n_e = n_h = n_i                       (n_i = intrinsic carrier concentration)\n```\n\n**Conduction occurs by both electrons and holes**, moving in opposite directions under an applied\nfield. The hole current arises from valence electrons hopping into adjacent vacancies, which is\nequivalent to the vacancy moving the other way.\n\n**Effect of temperature.** Raising the temperature breaks more bonds, so **n_i increases rapidly**\n(roughly exponentially) and the **conductivity increases** — which is why semiconductors have a\n**negative temperature coefficient of resistivity** (see\n[Ch 3](03-current-electricity.md)).\n\nIntrinsic semiconductors have too low a conductivity to be useful, which is why they are doped.\n\n### Extrinsic semiconductors — doping\n\n**Doping** is the deliberate addition of a small, controlled amount of a suitable impurity to a pure\nsemiconductor in order to increase its conductivity. Typically about 1 impurity atom per 10⁶ host\natoms.\n\n**n-type semiconductor** — doped with a **pentavalent** impurity (5 valence electrons):\n\n- Dopants: **phosphorus, arsenic, antimony, bismuth**\n- Four of the impurity's five valence electrons form covalent bonds with neighbouring Si/Ge atoms;\n  the **fifth is loosely bound** and easily becomes a free electron.\n- The impurity **donates** an electron, so it is called a **donor**.\n- **Majority carriers: electrons.** **Minority carriers: holes.**\n- n_e >> n_h\n\n**p-type semiconductor** — doped with a **trivalent** impurity (3 valence electrons):\n\n- Dopants: **boron, aluminium, indium, gallium**\n- The impurity's three valence electrons form three bonds, leaving **one bond incomplete** — a\n  **hole**, which can accept an electron from a neighbouring bond.\n- The impurity **accepts** an electron, so it is called an **acceptor**.\n- **Majority carriers: holes.** **Minority carriers: electrons.**\n- n_h >> n_e\n\n> **Both n-type and p-type semiconductors are electrically NEUTRAL.** This is asked directly and\n> answered wrongly very often. Doping does not add net charge: a donor atom that has given up an\n> electron becomes a **fixed positive ion** in the lattice, exactly balancing the free electron. The\n> names \"n-type\" and \"p-type\" refer only to the **sign of the majority carriers**, not to any net\n> charge on the material.\n\n**The mass-action relation** (worth knowing):\n\n```\n      n_e × n_h = n_i²\n```\n\nso increasing one type of carrier by doping necessarily **decreases** the other.\n\n### The p-n junction\n\n*Diagram:* a bar of semiconductor, p-type on the left and n-type on the right, meeting at a junction.\nShow the holes as circles in the p-region and electrons as dots in the n-region; between them, a\nnarrow **depletion region** containing **immobile negative ions on the p-side** and **immobile\npositive ions on the n-side**, with an arrow showing the internal field from n to p and the barrier\npotential V_B.\n\n**How the junction forms — the two processes:**\n\n**1. Diffusion.** Because the hole concentration is far higher on the p-side and the electron\nconcentration far higher on the n-side, **holes diffuse from p to n** and **electrons diffuse from n\nto p**. This is a **diffusion current**, from p to n.\n\n**2. Formation of the depletion region.** As an electron leaves the n-region it exposes a **fixed\npositive donor ion**; as a hole leaves the p-region it exposes a **fixed negative acceptor ion**.\nNear the junction, therefore, a narrow region forms that is **depleted of mobile charge carriers** and\ncontains only **immobile ions** — negative on the p-side, positive on the n-side. This is the\n**depletion region** (or depletion layer), typically a fraction of a micrometre wide.\n\n**3. Barrier potential.** The immobile ions set up an **internal electric field** directed from the\nn-side to the p-side. The associated potential difference across the depletion region is the\n**barrier potential V_B** (also called the potential barrier or junction potential):\n\n```\n      V_B ≈ 0.3 V for germanium                V_B ≈ 0.7 V for silicon\n```\n\n**4. Equilibrium.** This field opposes further diffusion, but it **assists** the motion of minority\ncarriers — driving the few electrons on the p-side across to the n-side and vice versa. That is the\n**drift current**, from n to p. At equilibrium the **diffusion current exactly balances the drift\ncurrent**, so the **net current is zero** and the junction is stable.\n\n### Forward and reverse bias\n\n**Forward bias** — the **p-side is connected to the positive terminal** of the battery and the n-side\nto the negative.\n\n| Effect | |\n| --- | --- |\n| The applied field **opposes** the internal barrier field | |\n| Barrier potential | **decreases** |\n| Width of the depletion region | **decreases** |\n| Diffusion of majority carriers | greatly **increased** |\n| Current | **large**, of the order of **milliamperes**; carried by **majority** carriers |\n| Resistance of the junction | **low** (a few ohms to a few hundred ohms) |\n\nAppreciable current begins only once the applied voltage exceeds the barrier potential — the\n**knee (threshold or cut-in) voltage**, about **0.3 V for Ge** and **0.7 V for Si**. Beyond the knee,\nthe current rises very steeply.\n\n**Reverse bias** — the **p-side is connected to the negative terminal** and the n-side to the\npositive.\n\n| Effect | |\n| --- | --- |\n| The applied field **aids** the internal barrier field | |\n| Barrier potential | **increases** |\n| Width of the depletion region | **increases** |\n| Diffusion of majority carriers | essentially **stopped** |\n| Current | **very small**, of the order of **microamperes**; carried by **minority** carriers |\n| Resistance of the junction | **very high** (of the order of megohms) |\n\nThe small reverse current is called the **reverse saturation current**. It is almost **independent of\nthe applied reverse voltage**, because it is limited by the small number of thermally generated\nminority carriers available, not by the voltage. (It does, however, increase with temperature.)\n\nAt a sufficiently large reverse voltage the junction suffers **breakdown**, and the reverse current\nrises abruptly. That voltage is the **breakdown voltage**.\n\n### I–V characteristics of a p-n junction diode\n\n*Circuit to obtain them:* for the **forward** characteristic, the diode in series with a milliammeter,\na rheostat and a battery, with the p-side to the positive terminal, and a voltmeter across the diode.\nFor the **reverse** characteristic, the same but with the battery reversed and a **micro**ammeter in\nplace of the milliammeter.\n\n```\n                    I (mA)\n                      │        ╱\n                      │       │\n                      │      ╱     ← FORWARD BIAS\n                      │     ╱        current in mA\n                      │    │         steep rise after the knee\n                      │  ──╯\n                      │ ╱  ↑ knee voltage (0.3 V Ge, 0.7 V Si)\n    ──────────────────┼────────────────→  V (volts)\n   ←── V (reverse)    │\n                      │\n   breakdown ──►  ────┤   ← REVERSE BIAS: tiny, nearly constant\n      │               │      reverse saturation current (µA)\n      ▼               │\n                    I (µA)\n```\n\n**The features to state:**\n\n1. In **forward bias**, the current is negligible until the applied voltage reaches the **knee\n   voltage**; beyond it the current rises **very steeply and non-linearly**.\n2. In **reverse bias**, only a very small, almost **constant** reverse saturation current flows\n   (microamperes), until **breakdown** occurs.\n3. **The scales on the two halves are different** — mA for forward, µA for reverse. You must label\n   them so, or the graph is wrong.\n4. The characteristic is **non-linear**, so a diode is a **non-ohmic** device: V/I is not constant.\n\n**Dynamic (a.c.) resistance:**\n\n```\n      r_d = ΔV/ΔI\n```\n\ntaken from the slope of the characteristic at the operating point. It is small in forward bias and\nvery large in reverse bias.\n\n**The essential conclusion:** a p-n junction diode conducts **easily in one direction only** —\nforward. It is therefore a **one-way valve** for current, and this is precisely what makes it useful\nas a **rectifier**.\n\n### Diode as a rectifier\n\n**Rectification** is the conversion of **alternating current into direct (unidirectional) current**.\nIt works because the diode conducts only when forward biased.\n\n**Half-wave rectifier**\n\n*Circuit:* an AC supply feeding the primary of a transformer; the secondary connected in series with\na single **diode** and a **load resistance R_L**. The output is taken across R_L.\n\n**Working.** During the half-cycle in which the diode is **forward biased**, it conducts and current\nflows through R_L, producing an output voltage. During the next half-cycle the diode is **reverse\nbiased**, so it does not conduct and the output is **zero**.\n\n```\n  INPUT (AC)          ╱‾╲       ╱‾╲       ╱‾╲\n                     ╱   ╲     ╱   ╲     ╱   ╲\n                 ───┴─────┴───┴─────┴───┴─────┴───→ t\n                          ╲   ╱     ╲   ╱\n                           ╲_╱       ╲_╱\n\n  OUTPUT             ╱‾╲             ╱‾╲             ╱‾╲\n  (half-wave)       ╱   ╲           ╱   ╲           ╱   ╲\n                 ───┴─────┴─────────┴─────┴─────────┴─────→ t\n                         (nothing during the other half-cycle)\n```\n\nSo the output appears only during **alternate half-cycles**. The output frequency **equals the input\nfrequency**.\n\n**Full-wave rectifier**\n\n*Circuit:* an AC supply feeding a **centre-tapped transformer**; the two ends of the secondary\nconnected to the p-sides of **two diodes** D₁ and D₂; the two n-sides joined together and connected\nthrough the **load resistance R_L** back to the **centre tap**.\n\n**Working.** During one half-cycle, the upper end of the secondary is positive, so **D₁ is forward\nbiased and D₂ reverse biased**; D₁ conducts and current flows through R_L. During the next\nhalf-cycle, the polarity reverses, so **D₂ is forward biased and D₁ reverse biased**; D₂ conducts and\ncurrent flows through R_L **in the same direction** as before.\n\n```\n  INPUT (AC)          ╱‾╲       ╱‾╲       ╱‾╲\n                     ╱   ╲     ╱   ╲     ╱   ╲\n                 ───┴─────┴───┴─────┴───┴─────┴───→ t\n                          ╲   ╱     ╲   ╱\n                           ╲_╱       ╲_╱\n\n  OUTPUT             ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲\n  (full-wave)       ╱   V   V   V   V   V   ╲\n                 ───┴───────────────────────────→ t\n                     (output during BOTH half-cycles)\n```\n\nSo the output appears during **both** half-cycles, always in the same direction through the load. The\noutput frequency is **twice the input frequency**.\n\n**Comparison:**\n\n| | **Half-wave** | **Full-wave** |\n| --- | --- | --- |\n| Number of diodes | 1 | 2 (with a centre-tapped transformer) |\n| Conduction | alternate half-cycles only | both half-cycles |\n| Output frequency | same as the input | **twice** the input |\n| Efficiency | lower (~40.6%) | higher (~81.2%) |\n| Ripple in the output | larger | smaller |\n\n**Why a filter is used.** The rectified output is unidirectional but still **pulsating**, not steady\nDC. A **capacitor connected in parallel with the load** (a filter) smooths it: the capacitor charges\nat the peaks and discharges through the load in the gaps, greatly reducing the ripple."
