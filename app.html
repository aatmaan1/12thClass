  return { pyq:c.s.pyq, sol:c.s.sol, translated:LANG === "en" };
}
function parseQs(c){
  var src = qaSource(c), sols = {};
  // A locked chapter ships no questions and no solutions: the fields are
  // absent rather than empty, because the point of the gate is that they are
  // not in this file at all.
  (src.sol || "").split(/\n(?=### Q\d+\b)/).forEach(function(b){
    var m = b.match(/^### Q(\d+)\b[^\n]*\n?([\s\S]*)$/);
    if (m) sols[m[1]] = (m[2] || "").trim();

  (src.pyq || "").split(/\n(?=\*\*Q\d+\.\*\*)/).forEach(function(b){
    var m = b.match(/^\*\*Q(\d+)\.\*\*\s*(?:\*\(([^)]*)\)\*)?\s*([\s\S]*)$/);
    if (!m) return;
    out.push({ n:m[1], marks:(m[2] || "").replace(/\s*—[\s\S]*/,"").trim(),
               body:(m[3] || "").trim(), sol:sols[m[1]] || "" });
  });

}

/* ---------------- the ledger ---------------- */
function ledger(subj){
  var list = chapters(subj), total = SUBJ[subj].total;
  var secured = 0;
  list.forEach(function(c){ secured += c.stake * gradeShare(gradeOf(c.id)); });
  var target = total * plan.target / 100;
  return {
    subject: subj,
    total: total,
    secured: secured,
    risk: Math.max(total - secured, 0),
    target: target,
    gap: Math.max(target - secured, 0),
    graded: list.filter(function(c){ return gradeOf(c.id) > 0; }).length,
    chapters: list.length
  };
}
function bothLedgers(){
  var a = ledger("maths"), b = ledger("physics");
  return {
    total: a.total + b.total,
    secured: a.secured + b.secured,
    target: a.target + b.target,
    gap: a.gap + b.gap
  };
}

/* ---------------- the queue ----------------
   Ranked by marks recoverable, weighted by how reliably the board asks the
   chapter. Then cut where the running total closes the gap — so the answer to
   "what do I do next" is a short list, not all 27 chapters.
   ---------------------------------------------------------------------------- */
function queue(subj){
  var out = chapters(subj)
    .map(function(c){
      var g = gradeOf(c.id);
      var recoverable = c.stake * (1 - gradeShare(g));
      return { c:c, grade:g, recoverable:recoverable,
               weight:recoverable * (PRIO_WEIGHT[c.prio] || 0.7) };
    })
    .filter(function(x){ return x.recoverable > 0.05; })
    .sort(function(a,b){
      return b.weight - a.weight || a.c.prio - b.c.prio || a.c.num - b.c.num;
    });

  var gap = ledger(subj).gap, running = 0;
  out.forEach(function(x){
    x.running = (running += x.recoverable);
    x.closesGap = gap > 0 && x.running >= gap;
  });
  var cut = -1;
  for (var i = 0; i < out.length; i++){
    if (out[i].closesGap){ cut = i; break; }
  }
  return { items: out, cut: cut, gap: gap };
}

/* ---------------- the schedule ----------------
   A plan, not a prediction. Days to the exam are divided between the chapters
   in the queue with a fifth held back for revision, because a plan with no
   slack is a plan that breaks on the first bad week.
   ---------------------------------------------------------------------------- */
var MS_DAY = 86400000;
function daysToExam(){
  if (!plan.exam) return null;
  var when = Date.parse(plan.exam + "T00:00:00");
  if (isNaN(when)) return null;
  var today = new Date();
  today = Date.parse(today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0") + "-" +
    String(today.getDate()).padStart(2, "0") + "T00:00:00");
  return Math.round((when - today) / MS_DAY);
}
function schedule(items, days){
  if (!items.length || !days || days < 1) return [];
  var usable = Math.max(Math.floor(days * 0.8), 1);      // a fifth for revision
  var per = usable / items.length;
  var out = [], cursor = 0;
  items.forEach(function(x, i){
    var from = Math.floor(cursor), to = Math.floor(cursor + per) - 1;
    if (to < from) to = from;
    if (i === items.length - 1) to = usable - 1;
    out.push({ item:x, from:from, to:to, days:Math.max(to - from + 1, 1) });
    cursor += per;
  });
  return out;
}
function dateAfter(offset){
  var d = new Date(Date.now() + offset * MS_DAY);
  return d.toLocaleDateString(LANG === "hi" ? "hi-IN" : "en-IN",
    { day:"numeric", month:"short" });
}
function marks(n){
  // Marks read as marks: one decimal, and never a bare ".0"
  var r = Math.round(n * 10) / 10;
  return (r === Math.round(r) ? String(Math.round(r)) : r.toFixed(1));
}

/* ---------------- the plan ---------------- */
function planView(){
  var l = ledger(subject), qd = queue(subject), days = daysToExam();
  var ranked = qd.cut >= 0 ? qd.items.slice(0, qd.cut + 1) : qd.items;

  var head;
  if (!l.graded){
    head = '<h1 class="pt">' + T("plan.hEmpty") + "</h1>" +
      '<p class="lede">' + T("plan.lede") + "</p>";
  } else if (l.gap > 0.05){
    head = '<h1 class="pt">' + T("plan.h",
        {gap:marks(l.gap), subject:subjLabel(subject)}) + "</h1>" +
      '<p class="lede">' + T("plan.lede") + "</p>";
  } else {
    head = '<h1 class="pt">' + T("plan.hOk", {subject:subjLabel(subject)}) + "</h1>" +
      '<p class="lede">' + T("plan.ledeOk") + "</p>";
  }
  var h = '<p class="eyebrow">' + T("plan.eyebrow") + " · " + subjLabel(subject) +
    " · " + SUBJ[subject].code + "</p>" + head;

  /* the queue */
  if (ranked.length){
    h += '<section class="block"><div class="block-h"><h2 class="sec">' +
      T("plan.queueH") + '</h2><p>' + T("plan.queueWhy") + "</p></div>" +
      '<div class="queue">';
    ranked.forEach(function(x, i){
      var c = x.c;
      h += '<button class="qi" data-ch="' + c.id + '">' +
        '<span class="qi-n">' + (i + 1) + "</span>" +
        '<span class="qi-t"><b>' + esc(chTitle(c)) + (c.lock ? "" : "") + "</b>" +
          "<span>" + T("ch.chapter") + " " + c.num + " · " + esc(unitName(c.unit)) +
          " · P" + c.prio +
          "</span></span>" +
        '<span class="qi-m"><b>' + marks(x.recoverable) + "</b>" +
          "<span>" + T("plan.recover") + "</span></span>" +
        "</button>";
    });
    if (qd.gap > 0.05){
      h += '<p class="cut">' + (qd.cut >= 0
        ? T("plan.cut", {n:ranked.length, gap:marks(qd.gap)})
        : T("plan.cutAll")) + "</p>";
    }
    h += "</div></section>";
  }

  /* the schedule */
  if (ranked.length){
    h += '<section class="block"><div class="block-h"><h2 class="sec">' +
      T("plan.schedH") + '</h2><p>' + (days != null && days > 0
        ? T("plan.schedWhy", {days:days}) : T("plan.schedNoDate")) + "</p></div>";
    if (days != null && days > 0){
      var rows = schedule(ranked, days);
      h += '<div class="tablewrap" style="max-width:none"><table class="sched"><thead><tr><th>' +
        T("plan.schedCol1") + "</th><th>" + T("plan.schedCol2") + "</th><th>" +
        T("plan.schedCol3") + "</th></tr></thead><tbody>";
      rows.forEach(function(r){
        h += '<tr><td class="d">' + dateAfter(r.from) +
          (r.to > r.from ? " – " + dateAfter(r.to) : "") + "</td>" +
          '<td class="c">' + esc(chTitle(r.item.c)) + "</td>" +
          '<td class="p">' + T("plan.passes") + "</td></tr>";
      });
      h += "</tbody></table></div>";
    }
    h += "</section>";
  }

  /* the grading pass */
  h += '<section class="block"><div class="block-h"><h2 class="sec">' +
    T("plan.rateH") + '</h2><p>' + T("plan.rateWhy") + "</p></div>" + '<div class="rate">';
  var unit = null;
  chapters(subject).forEach(function(c){
    if (c.unit !== unit){
      unit = c.unit;
      h += '<div class="rate-u"><span>' + esc(unitName(unit)) + "</span><i>" +
        c.unitMarks + " marks</i></div>";
    }
    var g = gradeOf(c.id);
    h += '<div class="rr"><span class="rr-n">' + c.num + "</span>" +
      '<span class="rr-t"><button data-ch="' + c.id + '">' + esc(chTitle(c)) +
        (c.lock ? " " + lockSvg(10) : "") + "</button>" +
        "<em>" + (c.appearShort ? esc(c.appearShort) : esc(unitName(c.unit))) + "</em></span>" +
      '<span class="rr-m">' + marks(c.stake) + ' <u>' + T("plan.atStake") + "</u></span>" +
      '<span class="grade" role="group" aria-label="' + esc(chTitle(c)) + '">';
    GRADES.forEach(function(n){
      h += '<button data-grade="' + c.id + ":" + n + '" data-g="' + n +
        '" aria-pressed="' + (g === n) + '">' + T("plan.g" + n) + "</button>";
    });
    h += "</span></div>";
  });
  h += "</div></section>";

  /* the shelf */
  h += '<section class="block"><div class="block-h"><h2 class="sec">' +
    T("plan.libH") + '</h2><p>' + T("plan.libWhy") + "</p></div>" +
    shelf() + "</section>";

  h += '<footer class="block"><p class="small" style="max-width:68ch"><strong>' +
    T("plan.caveatH") + "</strong> " + T("plan.caveat1") + "</p>" +
    '<p class="small" style="max-width:68ch">' + T("plan.caveat2") + " " +
    T("plan.notAff") + "</p></footer>";
  return h;
}

function shelf(){
  var h = '<div class="shelf">';
  DATA.docs.forEach(function(d){
    h += '<button class="dcard" data-doc="' + d.id + '"><b>' + esc(docTitle(d)) +
      (isLocked(d, "body") ? lockSvg(11) : "") + "</b><span>" + esc(docBlurb(d)) +
      "</span></button>";
  });
  if ((PACKS["packs.revision"] || {}).pack){
    h += '<button class="dcard" data-go=\'{"k":"pack"}\'><b>' + T("pack.eyebrow") +
      "</b><span>" + T("pack.h") + "</span></button>";
  }
  return h + "</div>";
}

/* ================= the chapter, the shelf, the pack, search =================
   One scrolling page per chapter rather than six tabs, in the order the marks
   are in: what the examiner pays for, then the questions, then the self-test,
   then the recall box, then the detail, then the scope. The old order started
   with the syllabus and finished with the marking scheme, which is the order
   a textbook is written in, not the order marks are won in.
   ================================================================================ */

//: id, string key, where the text comes from, and what a locked one says.
var SECTIONS = [
  { id:"start",  key:"start",  field:"intro",   lock:null },
  { id:"pays",   key:"pays",   field:"s.tips",  lock:"pays" },
  { id:"qs",     key:"qs",     field:"s.pyq",   lock:"qs" },
  { id:"test",   key:"test",   field:"s.test",  lock:"test" },
  { id:"recall", key:"recall", field:"recall",  lock:"recall" },
  { id:"detail", key:"detail", field:"s.brief", lock:"detail" },
  { id:"scope",  key:"scope",  field:"s.scope", lock:null }
];

function fieldOf(c, path){ return tr(c, path).text; }

function chapterView(c){
  var g = gradeOf(c.id);
  var h = '<button class="back noprint" data-home>&larr; ' + T("ch.back") + "</button>" +
    '<p class="crumb"><b>' + subjLabel(c.subj) + "</b> · " + T("ch.chapter") + " " +
      c.num + " · " + esc(unitName(c.unit)) + "</p>" +
    '<h1 class="pt">' + esc(chTitle(c)) + "</h1>" +
    '<div class="tags">' +
      (!c.lock && anyLocked() ? '<span class="tag free">' + T("lock.free") + "</span>" : "") +
      '<span class="tag ' + (g === 3 ? "ok" : "risk") + '">' +
        T("ch.stake", {n:marks(c.stake)}) + "</span>" +
      '<span class="tag">' + T("ch.prio", {n:c.prio}) + "</span>" +
      (c.appearShort ? '<span class="tag wrap">' + esc(c.appearShort) + "</span>" : "") +
    "</div>";

  /* grading, where the studying happens rather than back on the plan */
  h += '<div class="card noprint" style="margin-top:20px;display:flex;gap:14px;' +
    'align-items:center;flex-wrap:wrap;justify-content:space-between">' +
    '<span style="font:500 13.5px/1.4 var(--sans);color:var(--ink)">' +
      T("ch.gradeQ") + "</span>" +
    '<span class="grade" role="group" aria-label="' + esc(chTitle(c)) + '">';
  GRADES.forEach(function(n){
    h += '<button data-grade="' + c.id + ":" + n + '" data-g="' + n +
      '" aria-pressed="' + (g === n) + '">' + T("plan.g" + n) + "</button>";
  });
  h += "</span></div>";

  if (c.deleted){
    h += '<div class="warn"><p class="warn-h">' + T("ch.deleted") + "</p>" +
      '<div class="md">' + md(c.deleted) + "</div></div>";
  }

  /* the in-chapter nav: only sections that exist or are gated */
  var live = SECTIONS.filter(function(s){
    return fieldOf(c, s.field) || (s.lock && isLocked(c, s.field));
  });
  h += '<nav class="jump noprint">';
  live.forEach(function(s, i){
    h += '<a href="#s-' + s.id + '"' + (i === 0 ? ' aria-current="true"' : "") + ">" +
      T("sec." + s.key) + (s.lock && isLocked(c, s.field) ? lockSvg(11) : "") + "</a>";
  });
  h += "</nav>";

  live.forEach(function(s){
    h += '<section class="sect" id="s-' + s.id + '"><h2>' + T("sec." + s.key) + "</h2>" +
      '<p class="why">' + T("sec." + s.key + "Why") + "</p>" +
      sectionBody(c, s) + "</section>";
  });

  h += passBlock(c);
  return h;
}

function sectionBody(c, s){
  if (s.lock && isLocked(c, s.field)) return gate(s.lock);
  var got = tr(c, s.field);

  if (s.id === "start") return notrans(got.translated) + '<div class="md">' + md(got.text) + "</div>";
  if (s.id === "qs") return notrans(qaSource(c).translated) + questions(c);
  if (s.id === "test") return selfTest(c);
  return notrans(got.translated) + '<div class="md">' + md(got.text) + "</div>";
}

function questions(c){
  if (!c.qs.length) return "";
  var h = '<div class="qlist">';
  c.qs.forEach(function(q){
    var k = c.id + "-" + q.n;
    h += '<article class="qq"><div class="qq-h"><span class="qq-n">Q' + q.n + "</span>" +
      (q.marks ? '<span class="qq-m">' + esc(q.marks) + "</span>" : "") + "</div>" +
      '<div class="qq-b"><div class="md">' + md(q.body) + "</div></div>" +
      '<div class="qq-f noprint"><button class="reveal" data-sol="' + k +
        '" aria-expanded="false" aria-controls="sol-' + k + '">' + T("qs.show") + "</button></div>" +
      '<div class="sol" id="sol-' + k + '" hidden><p class="sol-l">' + T("qs.sol") + "</p>" +
      '<div class="md">' + md(q.sol) + "</div></div></article>";
  });
  return h + "</div>";
}

function selfTest(c){
  var got = tr(c, "s.test");
  var cut = got.text.split(/\n### (?:Answer key|उत्तर कुंजी)\s*\n/);
  var score = plan.scores[c.id];
  return notrans(got.translated) + '<div class="md">' + md(cut[0]) + "</div>" +
    '<div class="card noprint" style="margin-top:18px;display:flex;gap:13px;' +
      'align-items:center;flex-wrap:wrap">' +
      '<p style="margin:0;flex:1;min-width:180px;font-size:13.5px"><strong style="color:var(--ink)">' +
        T("test.hidden") + "</strong> " + T("test.hiddenWhy") + "</p>" +
      '<button class="reveal" data-sol="key-' + c.id + '" aria-expanded="false" ' +
        'aria-controls="key-' + c.id + '">' + T("test.reveal") + "</button></div>" +
    '<div id="key-' + c.id + '" hidden><div class="md"><h3>' + T("test.key") + "</h3>" +
      md(cut[1] || "") + "</div></div>" +
    '<div class="card noprint" style="margin-top:14px;display:flex;gap:11px;' +
      'align-items:center;flex-wrap:wrap">' +
      '<label for="score-' + c.id + '" style="font:500 13px/1 var(--sans);color:var(--ink)">' +
        T("test.score") + "</label>" +
      '<input id="score-' + c.id + '" type="text" inputmode="numeric" placeholder="—" ' +
        'value="' + (score == null ? "" : esc(String(score))) + '" data-score="' + c.id +
        '" style="width:76px;font:400 14px/1 var(--mono);padding:9px 10px;border-radius:7px;' +
        'border:1px solid var(--line);background:var(--paper);color:var(--ink)">' +
      '<span style="font-size:12.5px;color:var(--muted)">' + T("test.scoreNote") + "</span></div>";
}

function passBlock(c){
  var p = passesOf(c.id);
  var h = '<section class="block noprint"><div class="block-h"><h2 class="sec">' +
    T("pass.h") + '</h2><p>' + T("pass.why") + "</p></div>" +
    '<div class="shelf">';
  ["p1","p2","p3"].forEach(function(k){
    h += '<label class="dcard" style="cursor:pointer">' +
      '<b style="justify-content:flex-start;gap:9px"><input type="checkbox" data-pass="' +
        c.id + ":" + k + '"' + (p[k] ? " checked" : "") +
        ' style="width:16px;height:16px;accent-color:var(--secured)">' +
        T("pass." + k) + "</b>" +
      "<span>" + T("pass." + k + "d") + "</span></label>";
  });
  return h + "</div></section>";
}

/* ---------------- search ---------------- */
function searchView(term){
  var t = term.toLowerCase(), hits = [];
  function push(title, where, text, act){
    if (!text) return;
    var i = String(text).toLowerCase().indexOf(t);
    if (i < 0) return;
    var a = Math.max(0, i - 70), b = Math.min(text.length, i + term.length + 110);
    var frag = (a ? "…" : "") + text.slice(a, i) + C1 +
      text.slice(i, i + term.length) + C2 + text.slice(i + term.length, b) +
      (b < text.length ? "…" : "");
    hits.push({ title:title, where:where, act:act,
      frag: esc(frag.replace(/\s+/g," "))
        .split(C1).join("<mark>").split(C2).join("</mark>") });
  }
  CH.forEach(function(c){
    // Only what is actually here. A search that matched paid text would be
    // leaking the thing the gate exists to hold back.
    SECTIONS.forEach(function(s){
      push(chTitle(c), subjLabel(c.subj) + " · " + T("ch.chapter") + " " + c.num +
        " · " + T("sec." + s.key), fieldOf(c, s.field),
        JSON.stringify({ k:"ch", id:c.id, sec:s.id }));
    });
    push(chTitle(c), subjLabel(c.subj) + " · " + T("ch.chapter") + " " + c.num,
      chIntro(c), JSON.stringify({ k:"ch", id:c.id }));
  });
  DATA.docs.forEach(function(d){
    push(docTitle(d), T("doc.eyebrow"), d.body, JSON.stringify({ k:"doc", id:d.id }));
  });

  var h = '<button class="back noprint" data-home>&larr; ' + T("ch.back") + "</button>" +
    '<p class="eyebrow">' + T("find.eyebrow") + "</p>" +
    '<h1 class="pt">' + T(hits.length === 1 ? "find.n1" : "find.n", {n:hits.length}) + "</h1>" +
    '<p class="lede">' + T("find.for", {q:esc(term)}) + "</p>" +
    (anyLocked()
      ? '<p class="small" style="margin-top:10px;max-width:68ch">' +
        T("find.locked", {n:CH.length, d:DATA.docs.length}) + "</p>"
      : "");
  if (!hits.length) return h + '<p class="lede">' + T("find.none") + "</p>";

  h += '<div class="hits" style="margin-top:24px">';
  hits.slice(0, 60).forEach(function(x){
    h += "<button class=\"hit\" data-go='" + x.act + "'><b>" + esc(x.title) + "</b>" +
      "<span>" + x.frag + "</span><em>" + x.where + "</em></button>";
  });
  h += "</div>";
  if (hits.length > 60) h += '<p class="small" style="margin-top:14px">' + T("find.first60") + "</p>";
  return h;
}

/* ================= the paywall =================
   What ships in this file: the planner in full, the syllabus scope, the
   deleted-topics warning and the plain-English opening for all 27 chapters,
   plus two chapters and two reference documents whole. Nothing else is here in
   any form — a study app that shipped all 27 chapters and hid 25 behind a CSS
   class would be defeated by the first person to open view-source.

   The rest arrives from the unlock endpoint against a licence key and is
   cached afterwards, because the week before a board exam is exactly when a
   phone has no signal.

   The mechanics below are the ones already proved out: signed keys, seats
   counted per device, a cached unlock re-checked in the background so a refund
   can take access back. Only the presentation is new.
   ================================================================================ */

var PW = (typeof PAYWALL === "object" && PAYWALL) ? PAYWALL : {};
var ACCESS = { key:"", codes:"", seats:0, used:0, grants:{}, cache:{} };
var PACKS = {};
var K_GRANTS = "mf.grants", K_LIC = "mf.licence", K_INSTALL = "mf.install", K_NONCE = "mf.nonce";

function installId(){
  // Identifies this browser to the seat count, so unlocking twice here does
  // not spend a second device. Random and local; it says nothing about who is
  // using it.
  try {
    var v = localStorage.getItem(K_INSTALL);
    if (!v){
      v = "d" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      localStorage.setItem(K_INSTALL, v);
    }
    return v;
  } catch(e){ return "unstored"; }
}
function isLocked(item, path){
  return !!(item && item.lock && item.lock.indexOf(path) !== -1);
}
function anyLocked(){
  return CH.some(function(c){ return !!c.lock; }) ||
         DATA.docs.some(function(d){ return !!d.lock; });
}
function freeChapters(){
  return CH.filter(function(c){ return !c.lock; }).length;
}
function price(offer){ return (PW.prices || {})[offer || "core"] || ""; }
function checkoutUrl(offer){
  var urls = PW.checkout || {};
  return urls[offer || "core"] || PW.offerUrl || "";
}
function nonce(){
  // Generated here, before the browser leaves for the checkout, and carried
  // out through the provider's custom data. It is what lets the thank-you page
  // hand this browser its key without trusting a guessable order number.
  try {
    var v = localStorage.getItem(K_NONCE);
    if (!v){
      v = "n" + Math.random().toString(36).slice(2, 12) +
          Math.random().toString(36).slice(2, 12);
      localStorage.setItem(K_NONCE, v);
    }
    return v;
  } catch(e){ return ""; }
}
function withNonce(url){
  var param = PW.nonceParam, value = param ? nonce() : "";
  if (!param || !value || !url || url === "#") return url;
  try {
    var u = new URL(url, location.href);
    u.searchParams.set(param, value);
    return u.toString();
  } catch(e){ return url; }
}

/* ---------------- merging what was bought into the page ---------------- */
function deepMerge(target, patch, prefix, filled){
  Object.keys(patch).forEach(function(k){
    var path = prefix ? prefix + "." + k : k, v = patch[k];
    if (v && typeof v === "object" && !Array.isArray(v)){
      if (typeof target[k] !== "object" || !target[k]) target[k] = {};
      deepMerge(target[k], v, path, filled);
    } else {
      target[k] = v;
      filled.push(path);
    }
  });
}
function mergeItem(item, patch){
  var filled = [];
  deepMerge(item, patch, "", filled);
  if (item.lock){
    item.lock = item.lock.filter(function(p){ return filled.indexOf(p) === -1; });
    if (!item.lock.length) delete item.lock;
  }
}
function applyGrants(grants){
  if (!grants) return;
  Object.keys(grants).forEach(function(name){
    var payload = grants[name];
    ACCESS.grants[name] = true;
    if (name === "chapters"){
      Object.keys(payload || {}).forEach(function(id){
        if (!byId[id]) return;
        mergeItem(byId[id], payload[id]);
        requeue(byId[id]);
      });
    } else if (name === "docs"){
      Object.keys(payload || {}).forEach(function(id){
        var d = DATA.docs.filter(function(x){ return x.id === id; })[0];
        if (d) mergeItem(d, payload[id]);
      });
    } else {
      PACKS[name] = payload;
    }
  });
}
function cacheAccess(){
  try {
    localStorage.setItem(K_LIC, ACCESS.key);
    localStorage.setItem(K_GRANTS, JSON.stringify({
      codes: ACCESS.codes, seats: ACCESS.seats, used: ACCESS.used, grants: ACCESS.cache
    }));
  } catch(e){
    // Out of quota, or storage blocked. The unlock holds for this session; it
    // just has to be fetched again next time.
  }
}
function forgetAccess(){
  try { localStorage.removeItem(K_LIC); localStorage.removeItem(K_GRANTS); } catch(e){}
}
function restoreAccess(){
  var raw = null;
  try {
    ACCESS.key = localStorage.getItem(K_LIC) || "";
    raw = JSON.parse(localStorage.getItem(K_GRANTS) || "null");
  } catch(e){ raw = null; }
  if (!raw || !raw.grants) return false;
  ACCESS.codes = raw.codes || "";
  ACCESS.seats = raw.seats || 0;
  ACCESS.used = raw.used || 0;
  ACCESS.cache = raw.grants;
  applyGrants(raw.grants);
  return true;
}

/* ---------------- talking to the endpoint ---------------- */
function postJSON(url, body){
  if (!url) return Promise.reject(new Error("no-endpoint"));
  return fetch(url, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok || j.error){
        var err = new Error(j.error || ("http-" + r.status));
        err.status = r.status;
        err.revoked = j.revoked === true;
        throw err;
      }
      return j;
    });
  });
}
function takeUnlock(res, key){
  ACCESS.key = key || ACCESS.key;
  ACCESS.codes = res.codes || "";
  ACCESS.seats = res.seats || 0;
  ACCESS.used = res.used || 0;
  ACCESS.cache = res.grants || {};
  applyGrants(res.grants);
  cacheAccess();
}
function unlockWithKey(key){
  return postJSON(PW.unlockUrl, { key:key, install:installId() })
    .then(function(res){ takeUnlock(res, key); return res; });
}
function claimWithNonce(n){
  return postJSON(PW.claimUrl, { nonce:n, install:installId() })
    .then(function(res){ takeUnlock(res, res.key || ""); return res; });
}
function refreshAccess(){
  // Re-check a cached unlock in the background. A network failure is ignored:
  // losing the guide because a café wifi is down would be worse than serving a
  // refunded licence for one more session. An explicit refusal is not ignored —
  // that is what a refund has to be able to do.
  if (!ACCESS.key || !PW.unlockUrl) return;
  postJSON(PW.unlockUrl, { key:ACCESS.key, install:installId() })
    .then(function(res){ takeUnlock(res, ACCESS.key); })
    .catch(function(err){
      if (err && (err.revoked || err.status === 403)){
        forgetAccess();
        location.reload();
      }
    });
}

/* ---------------- the gate panel ---------------- */
function gate(what, offer){
  var p = price(offer), url = checkoutUrl(offer);
  return '<div class="gate noprint"><p class="gate-k">' + lockSvg(12) + "<span>" +
    T("lock.badge") + "</span></p>" +
    "<h3>" + T("lock.h") + "</h3>" +
    "<p>" + T("lock." + what) + "</p>" +
    '<p class="small">' + T("lock.reading", {n:CH.length, s:freeChapters()}) + "</p>" +
    '<div class="gate-row">' +
    (url ? '<a class="buy" href="' + esc(url) + '" data-buy>' +
        T("lock.cta", {p:p}) + "</a>" : "") +
    '<button type="button" class="plain" data-unlock>' + T("lock.have") + "</button>" +
    "</div></div>";
}

/* ---------------- the access dialog ---------------- */
var accessDlg = document.getElementById("accessDlg");
var accessBody = document.getElementById("accessBody");
function accessMsg(text, kind){
  var el = accessBody.querySelector(".msg");
  if (el){ el.className = "msg" + (kind ? " " + kind : ""); el.innerHTML = text; }
}
function unlockError(err){
  // A 400 means the key itself was not accepted, and the endpoint deliberately
  // will not say which way — forged, mistyped and expired look identical from
  // outside. A 403 is different: the licence is real and the reason is
  // something the buyer can act on, so pass it through rather than sending
  // them off to check a key that is perfectly fine.
  if (!err || err.message === "no-endpoint") return T("unlock.offline");
  if (err.status === 403 && err.message) return esc(err.message);
  if (err.status) return T("unlock.badkey", {e:esc(PW.support || "")});
  return T("unlock.offline");
}
function drawAccess(){
  var support = PW.support || "";
  var note = PW.note ? '<p class="small">' + esc(PW.note) + "</p>" : "";
  if (!anyLocked() && ACCESS.key){
    accessBody.innerHTML = note +
      "<p>" + T("unlock.status", {u:ACCESS.used || 1, s:ACCESS.seats || 1}) + "</p>" +
      '<p class="small">' + T("unlock.keyIs") + ": <code>" + esc(ACCESS.key) + "</code></p>" +
      '<div class="dlg-row"><button type="button" class="plain" data-forget>' +
        T("unlock.forget") + "</button>" +
      '<button class="buy dlg-x" value="close">' + T("unlock.close") + "</button></div>" +
      '<p class="msg"></p>' +
      '<p class="small">' + T("unlock.forgetNote", {e:esc(support)}) + "</p>";
  } else {
    var url = checkoutUrl("core");
    accessBody.innerHTML = note +
      "<p>" + T("unlock.have") + "</p>" +
      '<input class="keyin" id="keyIn" type="text" autocomplete="off" spellcheck="false" ' +
        'placeholder="' + esc(T("unlock.ph")) + '" aria-label="' + esc(T("unlock.have")) +
        '" value="' + esc(ACCESS.key || "") + '">' +
      '<p class="msg"></p>' +
      '<div class="dlg-row"><button type="button" class="buy" data-dounlock>' +
        T("unlock.go") + "</button>" +
      (url ? '<a class="plain" href="' + esc(url) + '" data-buy>' + T("unlock.buy") + "</a>" : "") +
      '<button class="plain dlg-x" value="close">' + T("unlock.close") + "</button></div>" +
      (support ? "<p class=\"small\">" + T("unlock.support",
        {e:'<a href="mailto:' + esc(support) + '">' + esc(support) + "</a>"}) + "</p>" : "");
  }
  wireAccess();
}
function wireAccess(){
  var input = accessBody.querySelector("#keyIn");
  var go = accessBody.querySelector("[data-dounlock]");
  if (go){
    go.onclick = function(){
      var key = (input && input.value || "").trim();
      if (!key) return;
      go.disabled = true;
      accessMsg(T("unlock.busy"));
      unlockWithKey(key).then(function(){
        accessMsg(T("unlock.ok"), "good");
        render(); paintAccess();
        setTimeout(function(){ try { accessDlg.close(); } catch(e){} }, 900);
      }).catch(function(err){
        go.disabled = false;
        accessMsg(unlockError(err), "bad");
      });
    };
  }
  if (input){
    input.onkeydown = function(e){ if (e.key === "Enter" && go){ e.preventDefault(); go.click(); } };
  }
  var forget = accessBody.querySelector("[data-forget]");
  if (forget) forget.onclick = function(){ forgetAccess(); location.reload(); };
  accessBody.querySelectorAll("a[data-buy]").forEach(function(a){
    a.addEventListener("click", function(){
      a.href = withNonce(a.href);
      try { accessDlg.close(); } catch(e){}
    });
  });
}
function openAccess(){
  drawAccess();
  if (accessDlg.showModal) accessDlg.showModal(); else accessDlg.setAttribute("open", "");
  var input = accessBody.querySelector("#keyIn");
  if (input) input.focus();
}
function paintAccess(){
  var btn = document.getElementById("accessBtn");
  if (!btn) return;
  var full = !anyLocked();
  btn.textContent = full ? T("acct.full") : T("acct.free");
  btn.className = "chip" + (full ? " on" : "");
}

/* ---------------- claiming a purchase straight after checkout ---------------- */
function claimFromUrl(){
  var match = /[?&]claim=([^&]+)/.exec(location.search || "");
  if (!match) return;
  openAccess();
  accessMsg(T("unlock.claiming"));
  claimWithNonce(decodeURIComponent(match[1])).then(function(){
    accessMsg(T("unlock.ok"), "good");
    render(); paintAccess(); drawAccess();
    try { history.replaceState(null, "", location.pathname + location.hash); } catch(e){}
  }).catch(function(){
    drawAccess();
    accessMsg(T("unlock.claimFail", {e:esc(PW.support || "")}), "bad");
  });
}

/* ================= the shell: routes, wiring, boot ================= */

var subject = "maths";
var route = { k:"plan" };
var stage = document.getElementById("stage");

function render(){
  if (route.k === "ch" && byId[route.id]) stage.innerHTML = chapterView(byId[route.id]);
  else if (route.k === "doc"){
    var d = DATA.docs.filter(function(x){ return x.id === route.id; })[0];
    stage.innerHTML = d ? docView(d) : planView();
  }
  else if (route.k === "pack") stage.innerHTML = packView();
  else if (route.k === "lib") stage.innerHTML = libView();
  else if (route.k === "search") stage.innerHTML = searchView(route.term);
  else stage.innerHTML = planView();
  drawLedger();
  paintSubject();
  wire();
}

function hashOf(r){
  if (r.k === "ch")     return "#/ch/" + r.id + (r.sec ? "/" + r.sec : "");
  if (r.k === "doc")    return "#/doc/" + r.id;
  if (r.k === "pack")   return "#/pack";
  if (r.k === "lib")    return "#/library";
  if (r.k === "search") return "#/find/" + encodeURIComponent(r.term || "");
  return "#/" + subject;
}
function parseHash(){
  var p = (location.hash || "").replace(/^#\/?/, "").split("/");
  if (p[0] === "ch" && byId[p[1]])  return { k:"ch", id:p[1], sec:p[2] || "" };
  if (p[0] === "doc" && p[1])       return { k:"doc", id:decodeURIComponent(p[1]) };
  if (p[0] === "pack")              return { k:"pack" };
  if (p[0] === "library")           return { k:"lib" };
  if (p[0] === "find" && p[1])      return { k:"search", term:decodeURIComponent(p.slice(1).join("/")) };
  if (p[0] === "maths" || p[0] === "physics") subject = p[0];
  return { k:"plan" };
}
function apply(r, keepScroll){
  route = r;
  if (r.k === "ch" && byId[r.id]) subject = byId[r.id].subj;
  render();
  if (!keepScroll){
    if (r.k === "ch" && r.sec){
      var target = document.getElementById("s-" + r.sec);
      if (target){ target.scrollIntoView(); return; }
    }
    window.scrollTo(0, 0);
  }
}
function go(r, keepScroll){
  var h = hashOf(r);
  if (location.hash !== h){
    try {
      if (r.k === "search" && history.replaceState) history.replaceState(null, "", h);
      else location.hash = h;
    } catch(e){}
  }
  apply(r, keepScroll);
}
window.addEventListener("hashchange", function(){
  if (location.hash === hashOf(route)) return;     // our own write, already rendered
  apply(parseHash(), false);
});

/* ---------------- wiring the current view ---------------- */
function wire(){
  stage.querySelectorAll("[data-ch]").forEach(function(b){
    b.onclick = function(){ go({ k:"ch", id:b.dataset.ch }); };
  });
  stage.querySelectorAll("[data-doc]").forEach(function(b){
    b.onclick = function(){ go({ k:"doc", id:b.dataset.doc }); };
  });
  stage.querySelectorAll("[data-home]").forEach(function(b){
    b.onclick = function(){ go({ k:"plan" }); };
  });
  stage.querySelectorAll("[data-go]").forEach(function(b){
    b.onclick = function(){ go(JSON.parse(b.dataset.go)); };
  });
  stage.querySelectorAll("[data-unlock]").forEach(function(b){
    b.onclick = function(){ openAccess(); };
  });
  stage.querySelectorAll("[data-print]").forEach(function(b){
    b.onclick = function(){ window.print(); };
  });
  stage.querySelectorAll("a[data-buy]").forEach(function(a){
    // Tagged on click rather than on render, so the value is fresh and a
    // cached page cannot send a stale one.
    a.onclick = function(){ a.href = withNonce(a.href); };
  });

  /* grading: update in place, and keep the ledger honest */
  stage.querySelectorAll("[data-grade]").forEach(function(b){
    b.onclick = function(){
      var bits = b.dataset.grade.split(":");
      setGrade(bits[0], +bits[1]);
      if (route.k === "plan") render();
      else {
        b.closest(".grade").querySelectorAll("button").forEach(function(x){
          x.setAttribute("aria-pressed", String(x === b));
        });
        drawLedger();
      }
    };
  });

  /* solutions and answer keys */
  stage.querySelectorAll("[data-sol]").forEach(function(b){
    b.onclick = function(){
      var open = b.getAttribute("aria-expanded") === "true";
      b.setAttribute("aria-expanded", String(!open));
      var t = document.getElementById(b.getAttribute("aria-controls"));
      if (t) t.hidden = open;
      var isKey = b.dataset.sol.indexOf("key-") === 0;
      b.textContent = open ? T(isKey ? "test.reveal" : "qs.show")
                           : T(isKey ? "test.hideKey" : "qs.hide");
    };
  });
  stage.querySelectorAll("[data-pass]").forEach(function(cb){
    cb.onchange = function(){
      var bits = cb.dataset.pass.split(":");
      togglePass(bits[0], bits[1], cb.checked);
    };
  });
  stage.querySelectorAll("[data-score]").forEach(function(inp){
    inp.onchange = function(){
      var v = inp.value.replace(/[^0-9]/g, "");
      if (v === "") delete plan.scores[inp.dataset.score];
      else plan.scores[inp.dataset.score] = Math.min(100, +v);
      inp.value = plan.scores[inp.dataset.score] == null ? "" : plan.scores[inp.dataset.score];
      savePlan();
    };
  });

  /* the in-chapter nav follows the scroll */
  var links = stage.querySelectorAll(".jump a");
  if (links.length && "IntersectionObserver" in window){
    var sections = stage.querySelectorAll(".sect");
    var seen = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        links.forEach(function(a){
          a.setAttribute("aria-current", String(a.getAttribute("href") === "#" + e.target.id));
        });
      });
    }, { rootMargin: "-120px 0px -70% 0px" });
    sections.forEach(function(s){ seen.observe(s); });
  }
}

/* ---------------- the chrome ---------------- */
function paintSubject(){
  document.getElementById("tabM").setAttribute("aria-pressed", String(subject === "maths"));
  document.getElementById("tabP").setAttribute("aria-pressed", String(subject === "physics"));
}
function paintChrome(){
  document.getElementById("brandSub").textContent = T("brand.sub");
  document.getElementById("tabM").textContent = T("subj.maths");
  document.getElementById("tabP").textContent = T("subj.physics");
  var q = document.getElementById("q");
  q.setAttribute("placeholder", T("search.ph"));
  q.setAttribute("aria-label", T("search.ph"));
  document.getElementById("themeBtn").textContent = T("btn.theme");
  paintAccess();

  // each language names itself, so the switch never needs translating
  var sw = "";
  LANGS.forEach(function(l){
    var name = l === "en" ? EN["lang.short"] : (DATA.langs[l].ui["lang.short"] || l);
    sw += '<button data-lang="' + l + '" aria-pressed="' + (l === LANG) + '">' +
      esc(name) + "</button>";
  });
  var el = document.getElementById("langSw");
  el.innerHTML = sw;
  el.querySelectorAll("[data-lang]").forEach(function(b){
    b.onclick = function(){ setLang(b.dataset.lang); };
  });
}
function setLang(l){
  LANG = LANGS.indexOf(l) === -1 ? "en" : l;
  try { localStorage.setItem("mf.lang", LANG); } catch(e){}
  document.documentElement.setAttribute("lang", LANG);
  // the questions are language-dependent, so they are parsed again
  CH.forEach(requeue);
  paintChrome();
  render();
}

document.getElementById("tabM").onclick = function(){ subject = "maths";   go({ k:"plan" }); };
document.getElementById("tabP").onclick = function(){ subject = "physics"; go({ k:"plan" }); };
document.getElementById("brand").onclick = function(){ go({ k:"plan" }); };
document.getElementById("accessBtn").onclick = function(){ openAccess(); };
accessDlg.addEventListener("close", function(){ paintAccess(); });

var findTimer = null;
document.getElementById("q").oninput = function(e){
  var v = e.target.value.trim();
  clearTimeout(findTimer);
  findTimer = setTimeout(function(){
    if (v.length >= 2) go({ k:"search", term:v }, true);
    else if (route.k === "search") go({ k:"plan" }, true);
  }, 190);
};

document.getElementById("themeBtn").onclick = function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("mf.theme", dark ? "light" : "dark"); } catch(e){}
};
try {
  var th = localStorage.getItem("mf.theme");
  if (th) document.documentElement.setAttribute("data-theme", th);
} catch(e){}

document.addEventListener("keydown", function(e){
  if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){
    e.preventDefault();
    document.getElementById("q").focus();
  }
  if (e.key === "Escape" && route.k !== "plan" &&
      !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) go({ k:"plan" });
});

/* ---------------- boot ---------------- */
try {
  var savedLang = localStorage.getItem("mf.lang");
  if (savedLang && LANGS.indexOf(savedLang) !== -1) LANG = savedLang;
} catch(e){}
document.documentElement.setAttribute("lang", LANG);

// Whatever was already bought is applied before the first paint, so a paid
// device opens straight into the full guide with no network and no flicker.
restoreAccess();
paintChrome();
apply(parseHash(), false);

// Then, in the background: pick up a purchase that has just completed, and
// re-check a cached licence in case it was refunded.
claimFromUrl();
refreshAccess();

</script>
