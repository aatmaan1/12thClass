 electron and the nucleus.\n\n2. **Quantisation of angular momentum.** Only those orbits are permitted for which the angular\n   momentum of the electron is an integral multiple of h/2π:\n\n```\n      m v r = n h/(2π)                      n = 1, 2, 3, …\n```\n\n3. **Frequency condition.** An electron emits or absorbs energy only when it **jumps** between two\n   stationary orbits, and the photon involved has energy equal to the difference of the two levels:\n   hν = E_i − E_f.\n\n**Derivation of the radius.**\n\n*Diagram:* an electron of charge −e and mass m in a circular orbit of radius r about a nucleus of\ncharge +e, with the Coulomb attraction shown pointing inward.\n\nThe electrostatic attraction provides the centripetal force:\n\n```\n      m v²/r = (1/4πε₀) · e²/r²                      …(i)\n```\n\nBohr's second postulate gives\n\n```\n      m v r = n h/(2π)      ⟹      v = n h/(2π m r)     …(ii)\n```\n\nSubstituting (ii) into (i):\n\n```\n      (m/r) [ n h/(2π m r) ]²  =  e²/(4πε₀ r²)\n\n      n² h²/(4π² m r³)  =  e²/(4πε₀ r²)\n```\n\nCancelling and rearranging:\n\n```\n      r = n² h² ε₀ / (π m e²)\n```\n\nSubstituting h = 6.63 × 10⁻³⁴ J s, ε₀ = 8.854 × 10⁻¹² C² N⁻¹ m⁻², m = 9.1 × 10⁻³¹ kg,\ne = 1.6 × 10⁻¹⁹ C:\n\n```\n      r_n = 0.53 n²  Å  =  0.53 n² × 10⁻¹⁰ m\n```\n\nSo the **radius is proportional to n²**, and the smallest orbit (n = 1) has radius 0.53 Å.\n\n**Derivation of the total energy.**\n\n**Kinetic energy.** From (i), m v² = e²/(4πε₀ r), so\n\n```\n      K = ½ m v² = e²/(8πε₀ r)\n```\n\n**Potential energy.** For a charge −e at distance r from a charge +e:\n\n```\n      U = (1/4πε₀) · (e)(−e)/r = − e²/(4πε₀ r)\n```\n\n**Total energy:**\n\n```\n      E = K + U = e²/(8πε₀ r) − e²/(4πε₀ r) = − e²/(8πε₀ r)\n```\n\nSubstituting r = n²h²ε₀/(πme²):\n\n```\n      E_n = − e²/(8πε₀) × π m e²/(n² h² ε₀)\n```\n\n```\n      E_n = − m e⁴/(8 ε₀² n² h²)\n```\n\nEvaluating the constants and converting to electron-volts:\n\n```\n      E_n = − 13.6/n²  eV\n```\n\n∎\n\n**Remarks worth adding:**\n- E is **negative**, showing the electron is **bound**; energy must be supplied to free it.\n- **E ∝ −1/n²**, so the levels get closer together as n increases, converging on 0 at n = ∞.\n- Note that **K = −E** and **U = 2E = −2K**.\n\n### Q2 — Rutherford's scattering experiment\n\n*Diagram:* a lead-shielded radioactive source of alpha particles, a collimating slit, a thin gold\nfoil, and a rotatable zinc-sulphide screen with a microscope, showing alpha particles mostly passing\nstraight through and a few deflected through large angles.\n\n**The experiment.** A narrow, collimated beam of alpha particles from a radioactive source was\ndirected at a **very thin gold foil** (about 10⁻⁷ m thick). The scattered alpha particles were\ndetected by the flashes they produced on a zinc-sulphide screen, which could be rotated to any angle,\nand were counted with a microscope.\n\n**Observations.**\n\n1. **Most** alpha particles passed **straight through** the foil almost undeflected.\n2. A **small fraction** were deflected through **small** angles.\n3. A **very small number** — roughly 1 in 8000 — were deflected through **large** angles, some by more\n   than 90°, effectively bouncing back.\n\n**Two conclusions.**\n\n1. **The atom is largely empty space, with the positive charge and mass concentrated in a tiny\n   central nucleus.** Since most alpha particles went straight through, the atom cannot be a uniform\n   sphere of positive charge; but since a few were violently deflected, there must be a very\n   concentrated centre of positive charge capable of exerting a large Coulomb repulsion.\n\n2. **The nucleus is extremely small compared with the atom.** Because only about one alpha particle\n   in 8000 suffered a large deflection, the target responsible must occupy a tiny fraction of the\n   foil's area. Rutherford estimated the nuclear radius as about **10⁻¹⁵ m**, against an atomic radius\n   of about **10⁻¹⁰ m** — so the nucleus occupies roughly 10⁻¹⁵ of the atom's volume, while containing\n   nearly all of its mass.\n\n### Q3 — drawbacks of Rutherford's model, and how Bohr fixed them\n\n**Drawback 1 — instability of the atom.**\n\nIn Rutherford's model the electron moves in a circular orbit, and so is **continuously accelerating**\n(centripetal acceleration). Classical electromagnetic theory requires an **accelerating charge to\nradiate energy continuously**. Losing energy, the electron's orbit would shrink and it would\n**spiral into the nucleus within about 10⁻⁸ s**. Atoms would therefore be unstable — contrary to\nobservation.\n\n**Drawback 2 — it predicts the wrong kind of spectrum.**\n\nAs the electron spiralled inward, its radius and hence its frequency of revolution would change\n**continuously**, so the radiation emitted would cover a **continuous range of frequencies**. But\natoms are observed to emit sharp, discrete **line spectra** at definite wavelengths characteristic of\nthe element.\n\n**How Bohr's model overcame them.**\n\n**For the stability problem**, Bohr's **first postulate** simply asserts that certain orbits are\n**stationary states** in which the electron does **not** radiate, despite accelerating. Combined with\nthe **second postulate** (mvr = nh/2π), this fixes a smallest permitted orbit — the n = 1 orbit of\nradius 0.53 Å — below which the electron cannot go. So the atom has a **stable ground state** and\ncannot collapse.\n\n**For the spectrum problem**, Bohr's **third postulate** confines radiation to **jumps between\ndiscrete levels**, with hν = E_i − E_f. Since the energies E_n = −13.6/n² eV are **discrete**, only\ncertain photon energies — and hence certain wavelengths — are possible. This gives a **line\nspectrum**, and it correctly predicts the observed wavelengths of the hydrogen series.\n\n### Q4 — energy level diagram, Lyman and Balmer series\n\n```\n      E (eV)\n        0  ─────────────────────────────  n = ∞\n     −0.54 ─────────────────────────────  n = 5\n     −0.85 ─────────────────────────────  n = 4\n                    │      │\n     −1.51 ──────────┼──────┼───────────   n = 3\n                    │      │   ↑\n                    │      │   │ (Paschen, infrared)\n     −3.40 ─────────┼──────▼───────────   n = 2\n                    │  ↑↑↑\n                    │  │││  BALMER series (to n = 2) — VISIBLE\n     −13.6 ─────────▼──────────────────   n = 1   (ground state)\n                 ↑↑↑\n                 │││  LYMAN series (to n = 1) — ULTRAVIOLET\n```\n\n- The **Lyman series** consists of all transitions ending at **n = 1**. These are the largest energy\n  jumps in hydrogen (at least 10.2 eV), so the photons have the shortest wavelengths — the series lies\n  in the **ultraviolet**.\n- The **Balmer series** consists of all transitions ending at **n = 2**. The energy jumps are smaller,\n  and the wavelengths (656 nm, 486 nm, 434 nm, …) fall in the **visible** region.\n\n**The series in the visible region is the Balmer series** — which is why it was the first to be\ndiscovered, and why it is the one seen in a hydrogen discharge tube.\n\n### Q5 — radius and energy of the third orbit\n\n```\n      r_n = 0.53 n² Å                E_n = −13.6/n² eV\n```\n\nFor n = 3:\n\n```\n      r₃ = 0.53 × 9 = 4.77 Å = 4.77 × 10⁻¹⁰ m\n\n      E₃ = −13.6/9 = −1.51 eV\n```\n\n**r₃ = 4.77 Å and E₃ = −1.51 eV.**\n\n### Q6 — wavelength of the H_α line\n\nThe H_α line is the transition **n = 3 → n = 2** (the first line of the Balmer series).\n\n```\n      1/λ = R ( 1/n_f² − 1/n_i² )\n          = (1.097 × 10⁷)( 1/2² − 1/3² )\n          = (1.097 × 10⁷)( 1/4 − 1/9 )\n          = (1.097 × 10⁷)( (9 − 4)/36 )\n          = (1.097 × 10⁷)(5/36)\n          = 1.524 × 10⁶ m⁻¹\n```\n\n```\n      λ = 1/(1.524 × 10⁶) = 6.56 × 10⁻⁷ m = 656 nm\n```\n\n**λ = 656 nm** — in the **red** part of the visible spectrum, which is the familiar red H_α line of\nhydrogen.\n\n*(Cross-check via energies: E₃ − E₂ = −1.51 − (−3.40) = 1.89 eV, and λ = 1240/1.89 = 656 nm ✓ — using\nhc = 1240 eV nm, this is much quicker than the Rydberg formula.)*\n\n### Q7 — ionisation and first excitation energy\n\n**Ionisation energy** is the energy required to remove the electron completely from the ground state,\ni.e. to take it from n = 1 to n = ∞:\n\n```\n      Ionisation energy = E_∞ − E₁ = 0 − (−13.6) = 13.6 eV\n```\n\n**First excitation energy** is the energy required to take the electron from the ground state (n = 1)\nto the first excited state (n = 2):\n\n```\n      E₂ = −13.6/4 = −3.40 eV\n\n      First excitation energy = E₂ − E₁ = −3.40 − (−13.6) = 10.2 eV\n```\n\n**Ionisation energy = 13.6 eV; first excitation energy = 10.2 eV.**\n\n### Q8 — kinetic and potential energy in the first excited state\n\nThe first excited state is n = 2, with total energy E = −3.4 eV.\n\nUsing the standard relations for a Coulomb-bound orbit:\n\n```\n      K = − E                       U = 2 E = − 2 K\n```\n\nTherefore\n\n```\n      K = −(−3.4) = + 3.4 eV\n\n      U = 2(−3.4) = − 6.8 eV\n```\n\n**K = +3.4 eV and U = −6.8 eV.**\n\n*Check:* K + U = 3.4 − 6.8 = −3.4 eV = E ✓\n\n*(These relations follow from the derivation in Q1: K = e²/8πε₀r and U = −e²/4πε₀r, so U = −2K and\nE = K + U = −K.)*\n\n### Q9 — limitations of Bohr's model\n\nAny three of:\n\n1. **It applies only to hydrogen and hydrogen-like single-electron ions.** It fails for atoms with two\n   or more electrons, because it takes no account of the **electron–electron repulsion**.\n\n2. **It cannot explain the relative intensities** of the spectral lines — it says which wavelengths\n   appear, but not how bright each is.\n\n3. **It cannot explain the fine structure** of spectral lines, i.e. their splitting into several very\n   closely spaced components when examined with a high-resolution spectrometer.\n\n4. **The quantisation condition is unjustified.** Bohr simply postulated mvr = nh/2π without\n   deriving it from any deeper principle.\n\n5. **It cannot explain the Zeeman effect or the Stark effect** — the splitting of spectral lines when\n   the atom is placed in a magnetic or electric field.\n\n6. **It conflicts with the uncertainty principle**, since it assigns the electron a definite orbit\n   with simultaneously definite position and momentum.\n\n### Q10 — number of spectral lines from n = 4\n\n```\n      Number of lines = n(n − 1)/2\n                      = 4(4 − 1)/2\n                      = 4 × 3/2\n                      = 6\n```\n\n**Six spectral lines are possible.**\n\n*(Explicitly: 4→3, 4→2, 4→1, 3→2, 3→1, 2→1 — six transitions ✓)*\n\n### Q11 — dependence of the Bohr radius on n\n\n```\n      r_n = 0.53 n² Å\n```\n\n**Answer: (b) n²**\n\n### Q12 — case study: excitation to n = 3\n\n**(i) Energy of the absorbed photon.**\n\n```\n      E₁ = −13.6 eV                E₃ = −13.6/9 = −1.51 eV\n\n      Energy absorbed = E₃ − E₁ = −1.51 − (−13.6) = 12.09 eV\n```\n\n**≈ 12.1 eV**\n\n**(ii) Wavelength of the photon.** Using hc = 1240 eV nm:\n\n```\n      λ = 1240/12.09 = 102.6 nm\n```\n\n**λ ≈ 103 nm** — in the **ultraviolet** (this is the second line of the Lyman series).\n\n**(iii) Number of spectral lines emitted on returning to the ground state.**\n\n```\n      n(n − 1)/2 = 3(3 − 1)/2 = 3\n```\n\n**Three lines** — from the transitions 3→2, 3→1 and 2→1.\n\n**(iv) Which emitted line has the longest wavelength?**\n\nThe longest wavelength corresponds to the **smallest energy jump**. Comparing the three:\n\n```\n      3 → 2 :  E₃ − E₂ = −1.51 − (−3.40) = 1.89 eV        ← smallest\n      2 → 1 :  E₂ − E₁ = −3.40 − (−13.6) = 10.2 eV\n      3 → 1 :  E₃ − E₁ = 12.09 eV                          ← largest\n```\n\nThe **3 → 2** transition has the smallest energy (1.89 eV) and hence the **longest wavelength**:\n\n```\n      λ = 1240/1.89 = 656 nm\n```\n\n**The 3 → 2 transition, at 656 nm** — the red H_α line of the Balmer series.\n\n### Q13 — why the electron does not fall into the nucleus\n\nOn **classical** physics it should: an electron in a circular orbit is accelerating, and an\naccelerating charge radiates energy, so the electron would lose energy, spiral inward, and reach the\nnucleus in about 10⁻⁸ s. This was Rutherford's fatal problem.\n\n**Bohr's answer** is his **first postulate**: certain orbits are **stationary states** in which the\nelectron revolves **without radiating**, despite its acceleration. Radiation occurs only when the\nelectron **jumps between** such states (the third postulate).\n\nCombined with the **quantisation condition** mvr = nh/2π, which permits only n = 1, 2, 3, …, there is\na **smallest allowed orbit** — the n = 1 orbit of radius 0.53 Å. The electron in the ground state\ntherefore has **no lower state to fall into**: it cannot radiate while in a stationary state, and\nthere is no stationary state below n = 1. Hence the atom is stable.\n\n---","test":"Time: 35 minutes. Answers below.\n\n1. *(1)* The energy of the electron in the ground state of hydrogen is\n   (a) −13.6 eV (b) +13.6 eV (c) −3.4 eV (d) 0\n2. *(1)* Which spectral series of hydrogen lies in the visible region?\n   (a) Lyman (b) Balmer (c) Paschen (d) Pfund\n3. *(1)* According to Bohr, the angular momentum of an electron in the nᵗʰ orbit is\n   (a) nh (b) nh/2π (c) 2πn/h (d) h/2πn\n4. *(2)* State Bohr's second postulate and write its mathematical form.\n5. *(2)* Find the energy and the radius of the electron in the second orbit of hydrogen.\n6. *(2)* Find the wavelength of the radiation emitted when a hydrogen atom goes from n = 4 to n = 2.\n7. *(2)* What is the ratio of the radii of the n = 2 and n = 1 orbits of hydrogen?\n8. *(3)* State two observations of Rutherford's scattering experiment and the conclusion drawn from\n   each.\n9. *(3)* Draw the energy level diagram of hydrogen and mark the transition giving the shortest\n   wavelength of the Balmer series.\n10. *(5)* Using Bohr's postulates, derive the expression for the radius of the nᵗʰ orbit of a hydrogen\n    atom. Hence find the radius of the n = 5 orbit.\n11. *(2)* An electron in a hydrogen atom jumps from n = 5 to n = 2. Which series does this line belong\n    to, and in what region of the spectrum does it lie?\n12. *(2)* Why is the total energy of an electron in a Bohr orbit negative? What does it signify?\n13. *(2)* How many spectral lines are emitted by atomic hydrogen excited to the n = 5 level?\n\n### Answer key\n\n**1. (a) −13.6 eV.**\n\n**2. (b) Balmer.**\n\n**3. (b) nh/2π.**\n\n**4.** **Bohr's second postulate:** only those circular orbits are permitted for which the angular\nmomentum of the electron is an **integral multiple of h/2π**. Mathematically, **mvr = nh/2π**, where\nn = 1, 2, 3, … is the principal quantum number.\n\n**5. E₂ = −3.4 eV, r₂ = 2.12 Å.** E₂ = −13.6/4 = −3.4 eV; r₂ = 0.53 × 4 = 2.12 Å.\n\n**6. 486 nm.** E₄ = −13.6/16 = −0.85 eV; E₂ = −3.40 eV. ΔE = −0.85 + 3.40 = 2.55 eV.\nλ = 1240/2.55 = **486 nm** (the blue-green H_β line of the Balmer series).\n\n**7. 4 : 1.** r ∝ n², so r₂/r₁ = 2²/1² = 4.\n\n**8.** (i) **Most alpha particles passed straight through** → the atom is **mostly empty space**, so\nthe positive charge is not spread uniformly through it. (ii) **A very few were deflected through more\nthan 90°** → there is a **tiny, dense, concentrated positive nucleus** capable of exerting a very\nlarge Coulomb repulsion, containing nearly all the atom's mass.\n\n**9.** Diagram as in §4 Q4. The **shortest wavelength** of the Balmer series is the **series limit**,\nthe transition **n = ∞ → n = 2**, of energy 3.40 eV and wavelength λ = 1240/3.40 = **365 nm** (in the\nnear ultraviolet). Mark that transition with an arrow from the n = ∞ line down to n = 2.\n\n**10.** Derivation as in §3 Q1, giving r_n = n²h²ε₀/(πme²) = 0.53 n² Å.\nFor n = 5: r₅ = 0.53 × 25 = **13.25 Å = 1.325 × 10⁻⁹ m**.\n\n**11.** The transition ends at **n = 2**, so it belongs to the **Balmer series**, which lies in the\n**visible** region. *(Specifically ΔE = −0.54 + 3.40 = 2.86 eV, so λ = 1240/2.86 = 434 nm — violet.)*\n\n**12.** The total energy is E = K + U with U = −2K, so E = −K, which is **negative**. It signifies that\nthe electron is **bound** to the nucleus: its total energy is less than that of a free electron at\nrest at infinity (which is taken as zero), so **energy must be supplied from outside** to remove the\nelectron from the atom. The magnitude |E| is precisely the energy needed to free it — the **binding\nenergy** of that state.\n\n**13. 10.** n(n − 1)/2 = 5 × 4/2 = 10.\n\n**Scoring.** Out of 28. Below 20 → memorise r_n = 0.53n² Å and E_n = −13.6/n² eV, and then redo every\nnumerical. Those two formulas plus hc = 1240 eV nm answer almost everything in this chapter.\n\n---","tips":"**On the derivation (the 5-marker)**\n\n1. **State all three postulates before deriving anything.** They are typically worth 1½ of the 5\n   marks and are marked separately from the algebra.\n\n2. **Write the two starting equations as labelled lines:** the force balance (i) and the quantisation\n   condition (ii). Then say you are eliminating v between them. Naming the strategy is a mark.\n\n3. **For the energy, do K and U as separate steps**, note U = −2K, and only then add. Do not write\n   E = −13.6/n² and claim it as a derivation.\n\n4. **End with the numerical forms** r_n = 0.53n² Å and E_n = −13.6/n² eV, and say they are obtained\n   by substituting the values of the constants. The question almost always asks for a specific orbit.\n\n5. **Add the interpretation:** E is negative because the electron is bound; the levels crowd together\n   as n increases. These remarks are frequently separate sub-parts.\n\n**On the numericals**\n\n6. **Use hc = 1240 eV nm rather than the Rydberg formula** whenever you know the two energy levels.\n   Find ΔE in eV from E_n = −13.6/n², then λ(nm) = 1240/ΔE(eV). It is two lines instead of five, and\n   far less error-prone.\n\n7. **E_n = −13.6/n² eV is the single most useful number in the chapter.** Almost every numerical is\n   one arithmetic step from it.\n\n8. **Keep the sign.** Energies of bound states are negative; energy *differences* (photon energies)\n   are positive. A negative photon energy means you subtracted the wrong way round.\n\n9. **For the number of spectral lines, use n(n−1)/2** — and if you have time, list the transitions to\n   check.\n\n10. **\"Longest wavelength\" means smallest energy jump.** So within a series it is the transition from\n    the immediately higher level; \"shortest wavelength\" (the series limit) is from n = ∞.\n\n**On the descriptive questions**\n\n11. **For Rutherford's experiment, pair each observation with its conclusion.** Marks are awarded for\n    the pairs, so never list observations without saying what each implies.\n\n12. **For the drawbacks of Rutherford's model, give the mechanism.** \"An accelerating charge radiates,\n    so the electron would spiral in within ~10⁻⁸ s\" earns the mark; \"the model was unstable\" does not.\n\n13. **For the energy level diagram, label the energies in eV and the values of n**, and draw the\n    levels **converging** towards E = 0 as n increases. Mark the transitions with arrows pointing\n    **downwards** for emission.\n\n14. **Know that Balmer is the visible series.** It is asked directly, and it also lets you sanity-check\n    any wavelength answer: a Balmer transition should come out between about 365 nm and 656 nm."}},{"id":"p13","subj":"physics","num":13,"title":"Nuclei","unit":"Units VII+VIII · Modern Physics","unitMarks":12,"prio":1,"appear":"Units VII + VIII (12 marks, shared with Ch 11 and Ch 12) · Typical appearance: 1 MCQ + a 2/3-mark question, most often on the binding-energy-per-nucleon curve or a mass-defect numerical.","deleted":"- **Radioactivity** in its entirety:\n  - alpha, beta and gamma particles/rays and their properties\n  - **radioactive decay law**, N = N₀e^(−λt)\n  - **half-life** and **mean life**\n  - activity, becquerel and curie\n\n> **This is one of the largest deletions in the Physics syllabus.** Radioactivity used to supply most\n> of this chapter's numericals — half-life problems, decay-law calculations, activity questions.\n> **All of it is out.** Pre-2023 papers and question banks are dominated by it, so cross those\n> questions out before practising.\n>\n> What remains is small and highly predictable, and centres almost entirely on the **binding energy\n> per nucleon curve**.","recall":"```\nA = Z + N ;  ᴬ_Z X\nisotopes: same Z | isobars: same A | isotones: same N\n\n1 u = 1.66 × 10⁻²⁷ kg ;   1 u ≡ 931.5 MeV\nm_p = 1.00728 u ; m_n = 1.00867 u ; m_H = 1.00783 u\n\nSIZE : R = R₀ A^(1/3) ,  R₀ = 1.2 fm     ⟹  volume ∝ A\nDENSITY ρ ≈ 2.3 × 10¹⁷ kg m⁻³ — INDEPENDENT of A (mass ∝ A and volume ∝ A cancel)\n\nNUCLEAR FORCE : strongest at nuclear range | SHORT range (~2–3 fm) |\n  CHARGE INDEPENDENT | attractive but repulsive below ~0.8 fm |\n  SATURATED (only nearest neighbours) | spin dependent | non-central\n\nMASS DEFECT  Δm = [Z m_p + (A−Z) m_n] − M\n  (use Z m_H instead of Z m_p if ATOMIC masses are given)\nBINDING ENERGY  BE = Δm c² ;   BE(MeV) = Δm(u) × 931.5\nBE/A : larger ⟹ more stable\n\nBE/A CURVE : rises steeply to ~8 MeV by A ≈ 20 ; ~constant 8 MeV for 30 < A < 170 ;\n  PEAK ~8.8 MeV at A = 56 (Fe, most stable) ; falls to ~7.6 MeV at A = 238\n  conclusions: (a) nuclear force is saturated and short range\n               (b) FISSION of heavy nuclei releases energy (products move UP the curve)\n               (c) FUSION of light nuclei releases energy (products move UP the curve)\n\nFISSION : ²³⁵U + n → Ba + Kr + 3n + ~200 MeV ; chain reaction possible\nFUSION  : ²H + ³H → ⁴He + n + 17.6 MeV ; needs ~10⁷ K to beat the COULOMB BARRIER\n  fusion gives MORE energy PER NUCLEON ; fission more per reaction\n\nQ = (mass of reactants − mass of products)c² ;  Q > 0 ⟹ energy released\nZ and A are conserved in every nuclear reaction\n```","s":{"scope":"### In the syllabus\n\n- **Composition and size** of the nucleus\n- **Nuclear force**\n- **Mass–energy relation**; **mass defect**\n- **Binding energy per nucleon** and its **variation with mass number**\n- **Nuclear fission**; **nuclear fusion**\n\n### Deleted — do not study\n\n- **Radioactivity** in its entirety:\n  - alpha, beta and gamma particles/rays and their properties\n  - **radioactive decay law**, N = N₀e^(−λt)\n  - **half-life** and **mean life**\n  - activity, becquerel and curie\n\n> **This is one of the largest deletions in the Physics syllabus.** Radioactivity used to supply most\n> of this chapter's numericals — half-life problems, decay-law calculations, activity questions.\n> **All of it is out.** Pre-2023 papers and question banks are dominated by it, so cross those\n> questions out before practising.\n>\n> What remains is small and highly predictable, and centres almost entirely on the **binding energy\n> per nucleon curve**.\n\n---","brief":"### Composition of the nucleus\n\nThe nucleus contains **protons** and **neutrons**, collectively called **nucleons**.\n\n```\n      Z = atomic number   = number of protons\n      N = neutron number  = number of neutrons\n      A = mass number     = Z + N = total number of nucleons\n```\n\nA nuclide is written **ᴬ_Z X**, e.g. ²³⁸₉₂U has Z = 92 protons and N = 238 − 92 = 146 neutrons.\n\n| Term | Definition | Example |\n| --- | --- | --- |\n| **Isotopes** | same Z, different A (same element, different neutron number) | ¹H, ²H, ³H |\n| **Isobars** | same A, different Z | ³H and ³He |\n| **Isotones** | same N, different Z | ³H (N = 2) and ⁴He (N = 2) |\n\n**Atomic mass unit:**\n\n```\n      1 u = 1.66 × 10⁻²⁷ kg  =  1/12 of the mass of a ¹²C atom\n      1 u × c² = 931.5 MeV                  so  1 u ≡ 931.5 MeV/c²\n```\n\n**Masses to have available:**\n\n```\n      m_proton  = 1.00728 u                 m_neutron = 1.00867 u\n      m_electron = 0.00055 u                m_H atom  = 1.00783 u\n```\n\n### Nuclear size and density\n\nExperiment (electron and neutron scattering) gives\n\n```\n      R = R₀ A^(1/3)                        R₀ = 1.2 × 10⁻¹⁵ m = 1.2 fm\n```\n\nso the **nuclear radius is proportional to A^(1/3)**, and the **nuclear volume is proportional to A**.\n\n**Nuclear density.**\n\n```\n      ρ = mass/volume = (A × 1.66 × 10⁻²⁷) / [ (4/3)π R₀³ A ]\n```\n\nThe **A cancels**, giving\n\n```\n      ρ ≈ 2.3 × 10¹⁷ kg m⁻³            — INDEPENDENT of A\n```\n\n> **\"Nuclear density is independent of the mass number\" is asked directly**, and the reason is exactly\n> the cancellation above: mass ∝ A and volume ∝ A, so their ratio is a constant. It also implies\n> that **nuclear matter is incompressible** and that nucleons are closely packed in every nucleus.\n>\n> For scale: nuclear density is about 10¹⁴ times the density of water.\n\n### Nuclear force — characteristics\n\nA standard 2/3-mark question. The nuclear force that binds nucleons has these properties:\n\n1. It is the **strongest** of the known interactions in nature at nuclear distances — far stronger\n   than the electrostatic repulsion between protons, which is why nuclei hold together at all.\n2. It is **short range** — effective only up to about **2–3 fm**, and essentially zero beyond that.\n3. It is **charge independent** — the force between two protons, two neutrons, or a proton and a\n   neutron is essentially the same. (So it is not electrical in origin.)\n4. It is **attractive** at normal nuclear separations, but becomes strongly **repulsive** at very\n   short distances (below about 0.8 fm) — which is why the nucleus does not collapse.\n5. It **saturates** — a given nucleon interacts only with its **immediate neighbours**, not with every\n   other nucleon in the nucleus. This is why the binding energy per nucleon is roughly constant over\n   most of the periodic table.\n6. It **depends on spin** — the force between two nucleons depends on the relative orientation of\n   their spins.\n7. It is **non-central** — it does not act purely along the line joining the two nucleons.\n\n### Mass defect and binding energy\n\n**The observation.** The measured mass of a nucleus is always **less** than the sum of the masses of\nits constituent free nucleons. The difference is the **mass defect**:\n\n```\n      Δm = [ Z m_p + (A − Z) m_n ] − M_nucleus\n```\n\n**Binding energy.** By E = mc², this missing mass corresponds to an energy\n\n```\n      BE = Δm c²\n```\n\nand with Δm in atomic mass units,\n\n```\n      BE (in MeV) = Δm (in u) × 931.5\n```\n\n**Physical meaning.** The binding energy is:\n- the energy **released** when the free nucleons come together to form the nucleus, **or equivalently**\n- the energy that must be **supplied** to break the nucleus completely apart into its free nucleons.\n\n**Binding energy per nucleon:**\n\n```\n      BE/A = (Δm c²)/A\n```\n\nThis is the meaningful measure of nuclear stability — **a larger BE/A means a more stable nucleus**.\n\n> **Careful with the definition of the mass defect** when the problem gives you **atomic** masses\n> rather than **nuclear** masses. If atomic masses are given, use Z m_H (hydrogen atoms) rather than\n> Z m_p, because the Z electrons are then automatically accounted for. The question will make clear\n> which masses it is giving.\n\n### The binding-energy-per-nucleon curve\n\n**You must be able to draw this curve and read conclusions off it.** It is the single most-asked item\nin the chapter.\n\n```\n  BE/A\n  (MeV)\n    9 │              ●Fe-56  (~8.8 MeV, the peak)\n      │          ╱‾‾‾‾‾‾‾‾‾‾‾‾╲___\n    8 │       ╱                    ‾‾‾‾‾‾‾‾‾───────╲  U-238 (~7.6 MeV)\n      │     ╱ ●O-16\n    7 │    ╱\n      │   ╱\n    6 │  ╱\n      │ │ ●He-4 (7.07)\n    5 │ │\n      │ │\n    2 │ ●H-2 (1.1)\n      │\n    0 └──┴────┴────┴────┴────┴────┴────┴────┴──── A\n       0   20   50   56  100  150  200  238\n```\n\n**The features to state:**\n\n1. **It rises steeply** for very light nuclei (A < 20), from about 1.1 MeV for deuterium.\n2. **It is roughly constant at about 8 MeV** for the broad range 30 < A < 170.\n3. **It peaks at about 8.8 MeV near A = 56** (iron-56) — **the most stable nucleus**.\n4. **It falls slowly** for heavy nuclei, reaching about 7.6 MeV at A = 238 (uranium).\n5. Certain light nuclei (⁴He, ¹²C, ¹⁶O) sit noticeably **above** the general trend — they are unusually\n   stable.\n\n**The three conclusions drawn from the curve** — each is an examinable point:\n\n**(a) The nuclear force is short range and saturated.** BE/A is nearly constant over most of the\ncurve. If each nucleon interacted with **all** the others, the total BE would grow as A² and BE/A\nwould grow as A — it does not. So a nucleon interacts only with its **immediate neighbours**.\n\n**(b) Fission of heavy nuclei releases energy.** A heavy nucleus (A ≈ 240, BE/A ≈ 7.6 MeV) splitting\ninto two medium nuclei (A ≈ 120 each, BE/A ≈ 8.5 MeV) moves the fragments **up** the curve to greater\nbinding energy per nucleon. The gain of about 0.9 MeV per nucleon, over 240 nucleons, releases about\n**200 MeV**.\n\n**(c) Fusion of light nuclei releases energy.** Two very light nuclei fusing move **up** the steep\nleft-hand part of the curve, where BE/A increases sharply with A. So energy is released, and per\nnucleon the gain is much larger than in fission.\n\n**In both cases, energy is released because the products have a higher BE/A than the reactants.** That\nsentence is the answer to most \"why does X release energy\" questions in this chapter.\n\n### Nuclear fission\n\n**Definition.** The splitting of a heavy nucleus into two lighter nuclei of comparable mass, with the\nrelease of a large amount of energy.\n\n**A typical reaction:**\n\n```\n      ²³⁵₉₂U + ¹₀n  →  ²³⁶₉₂U*  →  ¹⁴¹₅₆Ba + ⁹²₃₆Kr + 3 ¹₀n + Q          Q ≈ 200 MeV\n```\n\n- The energy released per fission is about **200 MeV** (about 0.9 MeV per nucleon).\n- The energy appears mainly as the **kinetic energy of the fragments**.\n- The reaction releases **2 or 3 neutrons**, which can induce further fissions — a **chain reaction**,\n  which is the basis of both nuclear reactors (controlled) and fission weapons (uncontrolled).\n\n**Why energy is released:** the fragments (A ≈ 95 and 140) lie **higher on the BE/A curve** than\nuranium, so the total binding energy of the products exceeds that of the reactant, and the difference\nis released.\n\n### Nuclear fusion\n\n**Definition.** The combining of two very light nuclei to form a heavier nucleus, with the release of\nenergy.\n\n**Examples:**\n\n```\n      ²₁H + ²₁H  →  ³₂He + ¹₀n + 3.27 MeV\n      ²₁H + ³₁H  →  ⁴₂He + ¹₀n + 17.59 MeV\n```\n\n**The proton–proton cycle in stars**, net effect:\n\n```\n      4 ¹₁H + 2 e⁻  →  ⁴₂He + 2ν + 6γ + 26.7 MeV\n```\n\n**Why fusion needs extremely high temperature.** Both nuclei are **positively charged**, so they repel\neach other electrostatically. To get within the ~2 fm range of the attractive nuclear force, they\nmust overcome this **Coulomb barrier**, which requires kinetic energies corresponding to temperatures\nof the order of **10⁷–10⁹ K**. This is why fusion is called a **thermonuclear** reaction, and why it\noccurs naturally only in stellar interiors.\n\n**Fission vs fusion — the comparison:**\n\n| | **Fission** | **Fusion** |\n| --- | --- | --- |\n| Process | a heavy nucleus splits | two light nuclei combine |\n| Energy per reaction | ~200 MeV | ~17–27 MeV |\n| Energy **per nucleon** | ~0.9 MeV | **~3–7 MeV — much greater** |\n| Conditions needed | ordinary temperature; a slow neutron | **extremely high** temperature (~10⁷ K) |\n| Controllability | can be **controlled** (nuclear reactors) | very difficult to control on Earth |\n| Products | radioactive fragments (waste problem) | mostly non-radioactive |\n| Occurs naturally in | some heavy nuclei | **stars**, including the Sun |\n\n> **Fusion releases more energy per nucleon than fission**, even though fission releases more per\n> reaction — because a fission event involves ~236 nucleons and a fusion event only a handful. This\n> distinction is frequently the point of the question.\n\n### Nuclear reactions — the conservation rules\n\nIn every nuclear reaction:\n- **Charge (Z) is conserved** — the sum of the atomic numbers is the same on both sides.\n- **Mass number (A) is conserved** — the sum of the mass numbers is the same on both sides.\n- **Energy and momentum are conserved** (with mass–energy taken together).\n\nThe **Q value** of a reaction:\n\n```\n      Q = ( total mass of reactants − total mass of products ) × c²\n```\n\nQ > 0 → energy is **released** (exoergic). Q < 0 → energy must be **supplied** (endoergic).\n\n### Quick recall box\n\n```\nA = Z + N ;  ᴬ_Z X\nisotopes: same Z | isobars: same A | isotones: same N\n\n1 u = 1.66 × 10⁻²⁷ kg ;   1 u ≡ 931.5 MeV\nm_p = 1.00728 u ; m_n = 1.00867 u ; m_H = 1.00783 u\n\nSIZE : R = R₀ A^(1/3) ,  R₀ = 1.2 fm     ⟹  volume ∝ A\nDENSITY ρ ≈ 2.3 × 10¹⁷ kg m⁻³ — INDEPENDENT of A (mass ∝ A and volume ∝ A cancel)\n\nNUCLEAR FORCE : strongest at nuclear range | SHORT range (~2–3 fm) |\n  CHARGE INDEPENDENT | attractive but repulsive below ~0.8 fm |\n  SATURATED (only nearest neighbours) | spin dependent | non-central\n\nMASS DEFECT  Δm = [Z m_p + (A−Z) m_n] − M\n  (use Z m_H instead of Z m_p if ATOMIC masses are given)\nBINDING ENERGY  BE = Δm c² ;   BE(MeV) = Δm(u) × 931.5\nBE/A : larger ⟹ more stable\n\nBE/A CURVE : rises steeply to ~8 MeV by A ≈ 20 ; ~constant 8 MeV for 30 < A < 170 ;\n  PEAK ~8.8 MeV at A = 56 (Fe, most stable) ; falls to ~7.6 MeV at A = 238\n  conclusions: (a) nuclear force is saturated and short range\n               (b) FISSION of heavy nuclei releases energy (products move UP the curve)\n               (c) FUSION of light nuclei releases energy (products move UP the curve)\n\nFISSION : ²³⁵U + n → Ba + Kr + 3n + ~200 MeV ; chain reaction possible\nFUSION  : ²H + ³H → ⁴He + n + 17.6 MeV ; needs ~10⁷ K to beat the COULOMB BARRIER\n  fusion gives MORE energy PER NUCLEON ; fission more per reaction\n\nQ = (mass of reactants − mass of products)c² ;  Q > 0 ⟹ energy released\nZ and A are conserved in every nuclear reaction\n```\n\n---","pyq":"**Q1.** *(3 marks)* Draw a graph showing the variation of binding energy per nucleon with mass number.\nState any two conclusions that can be drawn from it.\n\n**Q2.** *(3 marks)* Define mass defect and binding energy. Calculate the binding energy per nucleon of\n⁴₂He, given m_p = 1.00728 u, m_n = 1.00867 u and M(⁴He nucleus) = 4.00151 u.\n\n**Q3.** *(3 marks)* Show that the density of a nucleus is independent of its mass number.\n\n**Q4.** *(3 marks)* State four characteristics of nuclear forces.\n\n**Q5.** *(3 marks)* Explain, using the binding-energy-per-nucleon curve, why energy is released in\nboth the fission of a heavy nucleus and the fusion of two light nuclei.\n\n**Q6.** *(2 marks)* Find the radius of a ²⁷₁₃Al nucleus. Take R₀ = 1.2 fm.\n\n**Q7.** *(3 marks)* Distinguish between nuclear fission and nuclear fusion, giving three points of\ndifference.\n\n**Q8.** *(2 marks)* Why does nuclear fusion require extremely high temperatures?\n\n**Q9.** *(2 marks)* Calculate the energy released in the fusion reaction\n²₁H + ³₁H → ⁴₂He + ¹₀n, given the masses 2.014 u, 3.016 u, 4.003 u and 1.009 u respectively.\n\n**Q10.** *(1 mark, MCQ)* The nucleus with the highest binding energy per nucleon is that of\n(a) ²³⁸U (b) ⁴He (c) ⁵⁶Fe (d) ²H\n\n**Q11.** *(2 marks)* The ratio of the radii of two nuclei is 1 : 2. What is the ratio of their mass\nnumbers?\n\n**Q12.** *(4 marks, case study)* Consider the fission reaction\n²³⁵₉₂U + ¹₀n → ¹⁴¹₅₆Ba + ⁹²₃₆Kr + x ¹₀n + Q.\n(i) Find x.\n(ii) Verify that charge and mass number are conserved.\n(iii) If Q ≈ 200 MeV, find the energy released per nucleon.\n(iv) Why can this reaction sustain a chain reaction?\n\n**Q13.** *(2 marks)* Two nuclei have mass numbers in the ratio 8 : 125. What is the ratio of their\nnuclear densities?\n\n---","sol":"### Q1 — the binding-energy-per-nucleon curve\n\n```\n  BE/A\n  (MeV)\n    9 │                ●  Fe-56  (~8.8 MeV — the maximum)\n      │            ╱‾‾‾‾‾‾‾‾‾‾‾╲____\n    8 │        ╱                      ‾‾‾‾‾‾‾‾───────╲ U-238 (~7.6)\n      │      ╱  ● O-16\n    7 │     ╱\n      │    ╱\n    6 │   ╱\n      │  │ ● He-4 (7.07)\n    5 │  │\n      │  │\n    2 │  ● H-2 (1.1)\n      │\n    0 └──┴─────┴─────┴─────┴─────┴─────┴─────┴────→ A\n       0   20    56    100   150   200   238\n```\n\n*(Label both axes — \"binding energy per nucleon (MeV)\" and \"mass number A\" — and mark the peak at\nA ≈ 56 with value ≈ 8.8 MeV.)*\n\n**Features:** BE/A rises steeply for light nuclei, is roughly **constant at about 8 MeV** over the\nbroad range 30 < A < 170, reaches a **maximum of about 8.8 MeV at A ≈ 56 (iron)**, and then falls\nslowly to about 7.6 MeV at A = 238.\n\n**Two conclusions:**\n\n**1. The nuclear force is short range and saturated.** Over most of the curve BE/A is almost\nconstant, i.e. the total binding energy is roughly proportional to A. If every nucleon attracted\nevery other one, the total binding energy would go as A(A − 1)/2 ≈ A², and BE/A would rise linearly\nwith A. Since it does not, **each nucleon must interact only with its immediate neighbours** — the\nnuclear force is short range and saturates.\n\n**2. Both fission of heavy nuclei and fusion of light nuclei release energy.** Nuclei with **higher\nBE/A are more stable**. A heavy nucleus (BE/A ≈ 7.6 MeV) splitting into two medium ones\n(BE/A ≈ 8.5 MeV) moves **up** the curve; two light nuclei fusing also move **up** the steep left-hand\nside. In both cases the products are more tightly bound than the reactants, so the excess energy is\n**released**.\n\n*(A third acceptable conclusion: iron-56, at the peak, is the most stable nucleus — which is why it is\nthe end point of nuclear fusion in stellar cores.)*\n\n### Q2 — mass defect, binding energy, and the BE/A of helium\n\n**Mass defect.** The **mass defect** of a nucleus is the difference between the sum of the masses of\nits constituent free nucleons and the actual mass of the nucleus:\n\n```\n      Δm = [ Z m_p + (A − Z) m_n ] − M\n```\n\n**Binding energy.** The **binding energy** is the energy equivalent of the mass defect, BE = Δm c². It\nis the energy released when the free nucleons combine to form the nucleus, and equally the energy\nthat must be supplied to break the nucleus completely into free nucleons.\n\n**Numerical for ⁴₂He** (Z = 2, A = 4, so 2 protons and 2 neutrons):\n\n```\n      Sum of nucleon masses = 2 m_p + 2 m_n\n                            = 2(1.00728) + 2(1.00867)\n                            = 2.01456 + 2.01734\n                            = 4.03190 u\n\n      Mass of nucleus       = 4.00151 u\n```\n\n**Mass defect:**\n\n```\n      Δm = 4.03190 − 4.00151 = 0.03039 u\n```\n\n**Binding energy:**\n\n```\n      BE = Δm × 931.5 MeV\n         = 0.03039 × 931.5\n         = 28.31 MeV\n```\n\n**Binding energy per nucleon:**\n\n```\n      BE/A = 28.31/4 = 7.08 MeV\n```\n\n**BE/A ≈ 7.08 MeV per nucleon.**\n\n*(This agrees with the accepted value of about 7.07 MeV, and you can see on the curve in Q1 that\n⁴He sits noticeably above the general trend for such light nuclei — it is an unusually stable\nnucleus.)*\n\n### Q3 — nuclear density is independent of A\n\n**Mass of the nucleus.** A nucleus of mass number A contains A nucleons, each of mass approximately\n1 u = 1.66 × 10⁻²⁷ kg. So\n\n```\n      M ≈ A × 1.66 × 10⁻²⁷ kg                        i.e.  M ∝ A\n```\n\n**Volume of the nucleus.** Taking the nucleus as a sphere of radius R = R₀A^(1/3):\n\n```\n      V = (4/3)π R³ = (4/3)π (R₀ A^(1/3))³ = (4/3)π R₀³ A          i.e.  V ∝ A\n```\n\n**Density:**\n\n```\n      ρ = M/V = ( A × 1.66 × 10⁻²⁷ ) / ( (4/3)π R₀³ A )\n```\n\nThe **A cancels between numerator and denominator**:\n\n```\n      ρ = (1.66 × 10⁻²⁷) / ( (4/3)π R₀³ )\n```\n\nwhich contains **no reference to A at all**. So the nuclear density is the **same for all nuclei**. ∎\n\n**Evaluating it**, with R₀ = 1.2 × 10⁻¹⁵ m:\n\n```\n      (4/3)π R₀³ = (4/3)(3.1416)(1.2 × 10⁻¹⁵)³\n                 = (4.1888)(1.728 × 10⁻⁴⁵)\n                 = 7.24 × 10⁻⁴⁵ m³\n\n      ρ = (1.66 × 10⁻²⁷)/(7.24 × 10⁻⁴⁵)\n        = 2.3 × 10¹⁷ kg m⁻³\n```\n\n**ρ ≈ 2.3 × 10¹⁷ kg m⁻³**, about 10¹⁴ times the density of water.\n\n**What it signifies:** the nucleons are **equally closely packed in every nucleus**, whatever its\nsize — so nuclear matter is essentially **incompressible**, and this is itself evidence that the\nnuclear force **saturates**.\n\n### Q4 — characteristics of nuclear forces\n\nAny four of:\n\n1. **They are the strongest known forces at nuclear range** — much stronger than the electrostatic\n   repulsion between protons, which is why nuclei with many protons remain bound.\n\n2. **They are short range.** The nuclear force is effective only up to about **2–3 fm**, and is\n   essentially zero beyond that. (This is in sharp contrast to the electrostatic and gravitational\n   forces, which are long range.)\n\n3. **They are charge independent.** The nuclear force between two protons, between two neutrons, and\n   between a proton and a neutron is essentially the **same**. Hence the force is not electrical in\n   origin.\n\n4. **They are attractive at normal nuclear distances but strongly repulsive at very short range** —\n   below about 0.8 fm the force becomes repulsive, which prevents the nucleus from collapsing.\n\n5. **They saturate.** A given nucleon interacts only with its **immediate neighbours**, not with every\n   other nucleon in the nucleus. This is the reason the binding energy per nucleon is nearly constant\n   over most of the periodic table.\n\n6. **They depend on the spin** of the interacting nucleons, and are **non-central** (they do not act\n   purely along the line joining the two nucleons).\n\n### Q5 — why both fission and fusion release energy\n\n*Reference the curve from Q1.*\n\n**The governing principle:** a nucleus with a **higher binding energy per nucleon is more tightly\nbound and more stable**. In any nuclear process, if the **products have a higher BE/A than the\nreactants**, the excess binding energy is **released** as the energy of the reaction.\n\n**Fission of a heavy nucleus.**\n\nTake uranium, A ≈ 235, with BE/A ≈ 7.6 MeV. When it splits into two medium-mass fragments of\nA ≈ 120 each, those fragments have BE/A ≈ 8.5 MeV, because they lie in the flat middle region of the\ncurve, **above** the heavy-nucleus end.\n\n```\n      Gain in BE/A ≈ 8.5 − 7.6 = 0.9 MeV per nucleon\n      Total energy released ≈ 0.9 × 235 ≈ 200 MeV\n```\n\nSo the fragments are more tightly bound than the parent, and about 200 MeV is released per fission.\n\n**Fusion of two light nuclei.**\n\nAt the light end (A < 20) the curve **rises very steeply**. So combining two very light nuclei\nproduces a nucleus much further **up** the curve. For instance, deuterium has BE/A ≈ 1.1 MeV while\nhelium-4 has BE/A ≈ 7.07 MeV — a gain of nearly **6 MeV per nucleon**.\n\nSo the product is far more tightly bound than the reactants, and energy is released.\n\n**The unifying statement:** in both processes the products lie **closer to the peak of the curve\n(A ≈ 56)** than the reactants do. Fission moves *down* in A towards the peak from the right; fusion\nmoves *up* in A towards the peak from the left. **Every energy-releasing nuclear process moves the\nsystem towards A ≈ 56.**\n\n*(And note the per-nucleon comparison: fusion's gain of ~6 MeV per nucleon far exceeds fission's\n~0.9 MeV, which is why fusion is a much richer energy source per unit mass — even though a single\nfission event releases more total energy.)*\n\n### Q6 — radius of an aluminium nucleus\n\n```\n      A = 27                R₀ = 1.2 fm = 1.2 × 10⁻¹⁵ m\n```\n\n```\n      R = R₀ A^(1/3)\n        = (1.2 × 10⁻¹⁵) × 27^(1/3)\n        = (1.2 × 10⁻¹⁵) × 3                    (since 27^(1/3) = 3)\n        = 3.6 × 10⁻¹⁵ m\n```\n\n**R = 3.6 × 10⁻¹⁵ m = 3.6 fm**\n\n### Q7 — fission vs fusion\n\n| | **Nuclear fission** | **Nuclear fusion** |\n| --- | --- | --- |\n| **Process** | a **heavy** nucleus **splits** into two lighter nuclei of comparable mass | two **light** nuclei **combine** to form a heavier nucleus |\n| **Energy released per nucleon** | about **0.9 MeV** | about **3–7 MeV** — much greater |\n| **Conditions required** | occurs at ordinary temperature, initiated by a slow neutron | requires **extremely high temperature** (~10⁷ K) to overcome the Coulomb repulsion |\n| **Controllability** | can be **controlled**, as in a nuclear reactor | extremely difficult to control on Earth |\n| **Products** | radioactive fragments, giving a waste-disposal problem | mostly non-radioactive |\n\n*(Any three rows is a full 3-mark answer. Note that each row compares the **same** attribute on both\nsides.)*\n\n### Q8 — why fusion needs very high temperatures\n\nFor two nuclei to fuse, they must come within about **2 fm** of each other — the range of the\nattractive **nuclear force**.\n\nBut both nuclei are **positively charged**, so as they approach they experience a strong\n**electrostatic repulsion** that grows as 1/r². This repulsion constitutes a **Coulomb potential\nbarrier** of the order of several hundred keV, which the nuclei must **overcome** by their kinetic\nenergy of approach.\n\nThe only practical way to give a large number of nuclei such kinetic energies is to raise the\ntemperature enormously, since the average kinetic energy of a particle is of order kT. Requiring\nkinetic energies of hundreds of keV implies temperatures of the order of **10⁷ to 10⁹ K**.\n\nThis is why fusion is called a **thermonuclear** reaction, and why it occurs naturally only in\n**stellar interiors**, where such temperatures and pressures exist.\n\n### Q9 — energy released in a fusion reaction\n\n```\n      ²₁H + ³₁H  →  ⁴₂He + ¹₀n\n```\n\n```\n      Mass of reactants = 2.014 + 3.016 = 5.030 u\n      Mass of products  = 4.003 + 1.009 = 5.012 u\n```\n\n**Mass difference (the Q value in mass units):**\n\n```\n      Δm = 5.030 − 5.012 = 0.018 u\n```\n\n**Energy released:**\n\n```\n      Q = Δm × 931.5 MeV\n        = 0.018 × 931.5\n        = 16.77 MeV\n```\n\n**Q ≈ 16.8 MeV**\n\nThe mass of the products is **less** than that of the reactants, so Δm > 0 and energy is **released**\n— the reaction is exoergic.\n\n### Q10 — highest binding energy per nucleon\n\nFrom the BE/A curve, the maximum lies at A ≈ 56, which is iron-56 (BE/A ≈ 8.8 MeV).\n\n**Answer: (c) ⁵⁶Fe**\n\n*(For comparison: ⁴He ≈ 7.07 MeV, ²³⁸U ≈ 7.6 MeV, ²H ≈ 1.1 MeV.)*\n\n### Q11 — ratio of mass numbers from the ratio of radii\n\n```\n      R = R₀ A^(1/3)                ⟹      R ∝ A^(1/3)\n```\n\nSo\n\n```\n      R₁/R₂ = (A₁/A₂)^(1/3)\n⟹     A₁/A₂ = (R₁/R₂)³\n```\n\nWith R₁ : R₂ = 1 : 2:\n\n```\n      A₁/A₂ = (1/2)³ = 1/8\n```\n\n**The ratio of the mass numbers is 1 : 8.**\n\n### Q12 — case study: the fission of uranium-235\n\n```\n      ²³⁵₉₂U + ¹₀n  →  ¹⁴¹₅₆Ba + ⁹²₃₆Kr + x ¹₀n + Q\n```\n\n**(i) Find x.** Use conservation of **mass number**:\n\n```\n      LHS:  235 + 1 = 236\n      RHS:  141 + 92 + x(1) = 233 + x\n\n      236 = 233 + x\n⟹     x = 3\n```\n\n**x = 3** — three neutrons are released.\n\n**(ii) Verify conservation of charge and mass number.**\n\n**Charge (atomic number Z):**\n\n```\n      LHS:  92 + 0 = 92\n      RHS:  56 + 36 + 3(0) = 92          ✓\n```\n\n**Mass number (A):**\n\n```\n      LHS:  235 + 1 = 236\n      RHS:  141 + 92 + 3(1) = 236        ✓\n```\n\nBoth are conserved, as they must be in any nuclear reaction.\n\n**(iii) Energy released per nucleon.**\n\nThe total number of nucleons involved is 236 (from ²³⁵U plus the incident neutron):\n\n```\n      Energy per nucleon = Q/236 = 200/236 = 0.847 MeV\n```\n\n**≈ 0.85 MeV per nucleon**\n\n*(Consistent with the BE/A curve: uranium sits at about 7.6 MeV and the fragments at about 8.5 MeV,\na difference of roughly 0.9 MeV per nucleon ✓)*\n\n**(iv) Why a chain reaction is possible.**\n\nThe reaction is initiated by **one** neutron but releases **three** neutrons. Each of those neutrons\ncan, if suitably slowed (moderated) and if it strikes another ²³⁵U nucleus rather than escaping or\nbeing absorbed, **induce a further fission**, which in turn releases three more neutrons.\n\nThe number of fissions can therefore **multiply from one generation to the next** — a self-sustaining\n**chain reaction**. If the multiplication is held at exactly one fission per fission (by absorbing\nthe surplus neutrons with control rods), the reaction is **controlled**, as in a nuclear reactor. If\nit is allowed to grow, the release becomes explosive.\n\n### Q13 — ratio of nuclear densities\n\n**The nuclear density is independent of the mass number** (as shown in Q3), because the mass is\nproportional to A and the volume is also proportional to A, so their ratio is a constant.\n\nTherefore, whatever the mass numbers,\n\n```\n      ρ₁ : ρ₂ = 1 : 1\n```\n\n**The ratio of the nuclear densities is 1 : 1** — they are equal.\n\n*(The 8 : 125 ratio of mass numbers is a distractor. It would matter for the ratio of **radii**, which\nwould be (8/125)^(1/3) = 2 : 5.)*\n\n---","test":"Time: 35 minutes. Answers below.\n\n1. *(1)* 1 u is equivalent to\n   (a) 931.5 MeV (b) 1.6 × 10⁻¹⁹ J (c) 13.6 eV (d) 200 MeV\n2. *(1)* The nuclear radius is proportional to\n   (a) A (b) A^(1/3) (c) A² (d) A^(1/2)\n3. *(1)* Nuclear density\n   (a) increases with A (b) decreases with A (c) is independent of A (d) is zero\n4. *(2)* Define binding energy per nucleon. Why is it a better measure of nuclear stability than the\n   total binding energy?\n5. *(2)* ³H and ³He — are these isotopes, isobars or isotones? Justify.\n6. *(2)* Find the radius of a ⁶⁴₂₉Cu nucleus. (R₀ = 1.2 fm)\n7. *(2)* Why is the nuclear force said to be charge independent?\n8. *(3)* Find the binding energy of ⁷₃Li, given m_p = 1.00783 u (hydrogen atom), m_n = 1.00867 u and\n   the atomic mass of ⁷Li = 7.01600 u.\n9. *(3)* Draw the BE/A curve and use it to explain why very heavy nuclei are unstable.\n10. *(3)* Distinguish between nuclear fission and fusion, giving three differences.\n11. *(2)* Complete and balance: ²³⁸₉₂U → ²³⁴₉₀Th + ?\n12. *(2)* Calculate the energy released when four hydrogen nuclei fuse to form one helium nucleus,\n    given the mass of ¹H = 1.00783 u and of ⁴He = 4.00260 u. (Ignore the electrons.)\n13. *(2)* Two nuclei have radii in the ratio 3 : 5. Find the ratio of their mass numbers and of their\n    nuclear densities.\n\n### Answer key\n\n**1. (a) 931.5 MeV.**\n\n**2. (b) A^(1/3).**\n\n**3. (c) is independent of A.**\n\n**4.** The **binding energy per nucleon** is the total binding energy of a nucleus divided by its mass\nnumber, BE/A. It is a better measure of stability than the total binding energy because the total BE\nnaturally grows with the number of nucleons — a heavy nucleus has a large total BE simply because it\nhas more nucleons. Dividing by A gives the **average binding energy holding each nucleon**, which\nallows nuclei of different sizes to be **compared** on the same footing. The nucleus with the largest\nBE/A is the most stable.\n\n**5. Isobars.** They have the **same mass number** (A = 3) but different atomic numbers (Z = 1 for\n³H and Z = 2 for ³He). Nuclides with the same A and different Z are **isobars**.\n*(They are not isotones either: ³H has N = 2 while ³He has N = 1.)*\n\n**6. 4.8 fm.** R = R₀A^(1/3) = 1.2 × 64^(1/3) = 1.2 × 4 = **4.8 fm = 4.8 × 10⁻¹⁵ m**.\n\n**7.** Experiments show that the nuclear force between **two protons**, between **two neutrons**, and\nbetween **a proton and a neutron** is essentially the **same** in magnitude. Since protons carry\ncharge and neutrons do not, a force that is unaffected by this difference cannot depend on charge —\nit is therefore said to be **charge independent**, and cannot be electrical in origin.\n\n**8. 39.2 MeV.** Since **atomic** masses are given (via m_H), use Z hydrogen atoms:\nSum = 3(1.00783) + 4(1.00867) = 3.02349 + 4.03468 = 7.05817 u.\nΔm = 7.05817 − 7.01600 = 0.04217 u.\nBE = 0.04217 × 931.5 = **39.28 MeV** (so BE/A = 39.28/7 = 5.61 MeV).\n\n**9.** Curve as in §4 Q1. From the curve, BE/A **falls** for A above about 56, reaching only ~7.6 MeV\nat A = 238. So heavy nuclei are **less tightly bound per nucleon** than medium-mass nuclei. The\nphysical reason is that the **long-range Coulomb repulsion** between the many protons grows as Z²\nand acts across the whole nucleus, whereas the **short-range attractive nuclear force saturates** and\nacts only between neighbours. As A increases, the repulsion grows faster than the attraction can\ncompensate. A heavy nucleus can therefore **increase** its binding energy per nucleon by splitting\ninto two medium-mass fragments — which is why such nuclei are unstable and undergo fission.\n\n**10.** Any three rows from the table in §4 Q7.\n\n**11. ⁴₂He (an alpha particle).**\nMass number: 238 = 234 + A, so A = 4. Charge: 92 = 90 + Z, so Z = 2. Hence the particle is ⁴₂He.\n*(The decay process itself is out of syllabus; only the balancing of A and Z is required.)*\n\n**12. 26.7 MeV.**\nMass of reactants = 4 × 1.00783 = 4.03132 u. Mass of product = 4.00260 u.\nΔm = 4.03132 − 4.00260 = 0.02872 u.\nQ = 0.02872 × 931.5 = **26.75 MeV** — the energy released in the proton–proton cycle that powers the\nSun.\n\n**13. Mass numbers 27 : 125; densities 1 : 1.**\nSince R ∝ A^(1/3), A₁/A₂ = (R₁/R₂)³ = (3/5)³ = 27/125.\nNuclear density is independent of A, so the densities are **equal**, 1 : 1.\n\n**Scoring.** Out of 26. Below 18 → the BE/A curve is the whole chapter. Draw it with the axes labelled\nand the Fe-56 peak marked, and write out the three conclusions from memory.\n\n---","tips":"**On the BE/A curve**\n\n1. **Label both axes** — \"binding energy per nucleon (MeV)\" and \"mass number A\". An unlabelled graph\n   loses most of the mark.\n\n2. **Mark the peak at A ≈ 56 with the value ≈ 8.8 MeV**, and mark the ~7.6 MeV value at A = 238. Those\n   two numbers are what the conclusions are built from.\n\n3. **State the conclusions as reasoned statements, not observations.** \"BE/A is nearly constant,\n   therefore each nucleon interacts only with its neighbours, therefore the nuclear force saturates\" —\n   the chain of reasoning is the mark.\n\n4. **The unifying answer to \"why is energy released\":** the products have a **higher BE/A** than the\n   reactants, i.e. they lie **closer to the peak** of the curve. Say it in those words.\n\n**On mass-defect numericals**\n\n5. **Check whether you are given nuclear or atomic masses.** If atomic (or if m_H = 1.00783 u is\n   given rather than m_p = 1.00728 u), use **Z m_H**, which accounts for the electrons automatically.\n   Mixing them up gives an answer wrong by about Z × 0.00055 u.\n\n6. **Keep five decimal places in u throughout**, and only round at the end. The mass defect is a small\n   difference between two nearly equal numbers, so early rounding destroys the answer.\n\n7. **Use 1 u = 931.5 MeV.** BE in MeV = Δm in u × 931.5. There is no need to convert to kilograms and\n   joules unless the question asks for joules.\n\n8. **Distinguish BE from BE/A.** If the question asks for the binding energy per nucleon, remember to\n   divide by A. This is a routine dropped mark.\n\n**On sizes and densities**\n\n9. **R ∝ A^(1/3), so A ∝ R³.** For ratio questions, cube or cube-root as appropriate, and say which\n   you are doing.\n\n10. **\"Nuclear density is independent of A\" is the answer to any density-ratio question** — the ratio\n    is always 1 : 1. And be ready to *prove* it: mass ∝ A, volume ∝ A, so the A cancels.\n\n**On descriptive questions**\n\n11. **For nuclear-force characteristics, give four distinct properties with a word of explanation\n    each.** \"Short range — effective only up to about 2–3 fm\" scores; \"short range\" alone often does\n    not.\n\n12. **For fission vs fusion, use a table with parallel rows**, and include the **per-nucleon** energy\n    comparison — that is the distinction most questions are really after.\n\n13. **For nuclear reactions, balance A and Z explicitly as two separate lines.** It is the whole\n    method, and it is worth the marks even when the identity of the missing particle is obvious.\n\n14. **Do not write anything about half-life, decay constant, or alpha/beta/gamma decay properties.**\n    That material is deleted, and time spent on it is wasted. Balancing a reaction's A and Z is still\n    fair game; the decay law is not."}},{"id":"p14","subj":"physics","num":14,"title":"Semiconductor Electronics","unit":"Unit IX · Electronic Devices","unitMarks":7,"prio":1,"appear":"Unit IX (7 marks — 10% of the paper) · Typical appearance: 1–2 MCQs + a 2/3-mark question, and very often one of the two Section-D case studies.","deleted":"- **Zener diode** and its use as a **voltage regulator**\n- **Optoelectronic devices** — LED, photodiode, solar cell\n- **Transistors** — construction, characteristics, transistor as an **amplifier**, as a **switch**, as\n  an **oscillator**\n- **Logic gates** — OR, AND, NOT, NAND, NOR, and their truth tables\n- **Digital electronics** and integrated circuits\n\n> **The deletion here is enormous.** Roughly two thirds of the old chapter is gone, including\n> everything students found difficult. The **7 marks did not go anywhere** — they are now concentrated\n> on the five surviving topics, which means the questions are more predictable than in any other\n> chapter. Two focused days here is worth more than two weeks on\n> [Ch 5 Magnetism and Matter](05-magnetism-and-matter.md).\n>\n> If a practice question mentions a transistor, a logic gate, a Zener diode or an LED, **skip it**.","recall":"```\nENERGY BANDS  (E_g = forbidden gap between valence and conduction bands)\n  CONDUCTOR     : E_g = 0, bands overlap ;  conductivity ↓ with T\n  SEMICONDUCTOR : E_g ≈ 1 eV (Si 1.1, Ge 0.7) ;  conductivity ↑ with T\n  INSULATOR     : E_g > 3 eV (diamond ≈ 6 eV)\n\nINTRINSIC : pure ;  n_e = n_h = n_i ;  conduction by BOTH electrons and holes\n  pairs created thermally ;  n_i rises fast with T ;  insulator at 0 K\n\nEXTRINSIC (doping ≈ 1 impurity per 10⁶ atoms)\n  n-TYPE : PENTAVALENT dopant (P, As, Sb, Bi) = DONOR\n           majority ELECTRONS, minority holes ;  n_e >> n_h\n  p-TYPE : TRIVALENT dopant (B, Al, In, Ga) = ACCEPTOR\n           majority HOLES, minority electrons ;  n_h >> n_e\n  BOTH ARE ELECTRICALLY NEUTRAL       n_e n_h = n_i²\n\np-n JUNCTION\n  diffusion of majority carriers → immobile ions exposed → DEPLETION REGION\n  (negative ions on the p-side, positive on the n-side)\n  internal field n → p ;  BARRIER POTENTIAL V_B ≈ 0.3 V (Ge), 0.7 V (Si)\n  equilibrium: diffusion current = drift current, net current zero\n\nFORWARD BIAS (p to +) : barrier ↓, depletion width ↓, current LARGE (mA),\n  majority carriers, resistance LOW ;  knee voltage 0.3 V Ge / 0.7 V Si\nREVERSE BIAS (p to −) : barrier ↑, depletion width ↑, current TINY (µA),\n  minority carriers, resistance HIGH ;  reverse saturation current is nearly\n  independent of voltage ;  breakdown at large reverse V\n\nI–V CHARACTERISTIC: non-linear ⟹ diode is NON-OHMIC\n  label the axes: mA for forward, µA for reverse\n  dynamic resistance r_d = ΔV/ΔI\n\nRECTIFIER: AC → unidirectional DC (the diode conducts one way only)\n  HALF-WAVE : 1 diode ; alternate half-cycles ; output frequency = input\n  FULL-WAVE : 2 diodes + CENTRE-TAPPED transformer ; both half-cycles ;\n              output frequency = 2 × input ; more efficient, less ripple\n  a capacitor in parallel with the load acts as a FILTER, smoothing the ripple\n```","s":{"scope":"### In the syllabus — the whole of it\n\n- **Energy bands** in conductors, semiconductors and insulators (qualitative ideas only)\n- **Intrinsic and extrinsic** semiconductors — **p-type and n-type**\n- **p-n junction**\n- **Semiconductor diode** — **I–V characteristics** in forward and reverse bias\n- Application of the junction diode — **diode as a rectifier**\n\nThat is five topics. There is nothing else.\n\n### Deleted — do not study\n\n- **Zener diode** and its use as a **voltage regulator**\n- **Optoelectronic devices** — LED, photodiode, solar cell\n- **Transistors** — construction, characteristics, transistor as an **amplifier**, as a **switch**, as\n  an **oscillator**\n- **Logic gates** — OR, AND, NOT, NAND, NOR, and their truth tables\n- **Digital electronics** and integrated circuits\n\n> **The deletion here is enormous.** Roughly two thirds of the old chapter is gone, including\n> everything students found difficult. The **7 marks did not go anywhere** — they are now concentrated\n> on the five surviving topics, which means the questions are more predictable than in any other\n> chapter. Two focused days here is worth more than two weeks on\n> [Ch 5 Magnetism and Matter](05-magnetism-and-matter.md).\n>\n> If a practice question mentions a transistor, a logic gate, a Zener diode or an LED, **skip it**.\n\n---","brief":"### Energy bands\n\nIn an isolated atom the electron energies are discrete levels. In a solid, the atoms are so close\nthat these levels broaden into **bands** of closely spaced allowed energies, separated by **forbidden\ngaps**.\n\n| Band | What it is |\n| --- | --- |\n| **Valence band** | The band containing the **valence electrons** — the highest band that is occupied at 0 K |\n| **Conduction band** | The next band above it. Electrons here are **free to move** and carry current |\n| **Forbidden energy gap (E_g)** | The energy gap between the top of the valence band and the bottom of the conduction band. No electron can have an energy in this gap |\n\n**Conduction requires electrons in the conduction band.** So the size of E_g determines whether a\nsolid conducts.\n\n**The three cases — draw all three diagrams:**\n\n```\n   CONDUCTOR              SEMICONDUCTOR              INSULATOR\n                          \n ┌─────────────┐        ┌─────────────┐           ┌─────────────┐\n │ conduction  │        │ conduction  │           │ conduction  │\n │    band     │        │    band     │           │    band     │\n ├─────────────┤        └─────────────┘           └─────────────┘\n │  overlap    │           E_g ≈ 1 eV                            \n │  (E_g = 0)  │        ┌─────────────┐              E_g > 3 eV  \n ├─────────────┤        │  valence    │                          \n │   valence   │        │    band     │           ┌─────────────┐\n │    band     │        │  (full)     │           │  valence    │\n └─────────────┘        └─────────────┘           │    band     │\n                                                  │  (full)     │\n                                                  └─────────────┘\n```\n\n| | **Conductor** | **Semiconductor** | **Insulator** |\n| --- | --- | --- | --- |\n| Forbidden gap E_g | **zero** — the bands **overlap**, or the valence band is only partly filled | **small**, ≈ 1 eV | **large**, > 3 eV |\n| Electrons in the conduction band at room temperature | very many | a few (thermally excited) | essentially none |\n| Conductivity | very high | intermediate | very low |\n| Effect of raising temperature | conductivity **decreases** | conductivity **increases** | remains an insulator |\n| Examples | copper, silver, aluminium | silicon (E_g = 1.1 eV), germanium (E_g = 0.7 eV) | diamond (E_g ≈ 6 eV), glass, wood |\n\n> **The key comparison is E_g.** In a semiconductor E_g ≈ 1 eV is comparable to the thermal energy\n> available at room temperature, so a small but useful number of electrons can be excited across the\n> gap. In an insulator E_g > 3 eV is far too large for thermal excitation. That one sentence answers\n> most questions in this section.\n\n### Intrinsic semiconductors\n\nAn **intrinsic semiconductor** is a **pure** semiconductor, with no added impurity.\n\nAt absolute zero the valence band is full and the conduction band empty, so it behaves as a perfect\ninsulator. At room temperature, thermal energy breaks a few covalent bonds, exciting electrons into\nthe conduction band. Each electron that leaves the valence band leaves behind a vacancy — a\n**hole**, which behaves as a **positive** charge carrier.\n\n**So in an intrinsic semiconductor, electrons and holes are always created in pairs:**\n\n```\n      n_e = n_h = n_i                       (n_i = intrinsic carrier concentration)\n```\n\n**Conduction occurs by both electrons and holes**, moving in opposite directions under an applied\nfield. The hole current arises from valence electrons hopping into adjacent vacancies, which is\nequivalent to the vacancy moving the other way.\n\n**Effect of temperature.** Raising the temperature breaks more bonds, so **n_i increases rapidly**\n(roughly exponentially) and the **conductivity increases** — which is why semiconductors have a\n**negative temperature coefficient of resistivity** (see\n[Ch 3](03-current-electricity.md)).\n\nIntrinsic semiconductors have too low a conductivity to be useful, which is why they are doped.\n\n### Extrinsic semiconductors — doping\n\n**Doping** is the deliberate addition of a small, controlled amount of a suitable impurity to a pure\nsemiconductor in order to increase its conductivity. Typically about 1 impurity atom per 10⁶ host\natoms.\n\n**n-type semiconductor** — doped with a **pentavalent** impurity (5 valence electrons):\n\n- Dopants: **phosphorus, arsenic, antimony, bismuth**\n- Four of the impurity's five valence electrons form covalent bonds with neighbouring Si/Ge atoms;\n  the **fifth is loosely bound** and easily becomes a free electron.\n- The impurity **donates** an electron, so it is called a **donor**.\n- **Majority carriers: electrons.** **Minority carriers: holes.**\n- n_e >> n_h\n\n**p-type semiconductor** — doped with a **trivalent** impurity (3 valence electrons):\n\n- Dopants: **boron, aluminium, indium, gallium**\n- The impurity's three valence electrons form three bonds, leaving **one bond incomplete** — a\n  **hole**, which can accept an electron from a neighbouring bond.\n- The impurity **accepts** an electron, so it is called an **acceptor**.\n- **Majority carriers: holes.** **Minority carriers: electrons.**\n- n_h >> n_e\n\n> **Both n-type and p-type semiconductors are electrically NEUTRAL.** This is asked directly and\n> answered wrongly very often. Doping does not add net charge: a donor atom that has given up an\n> electron becomes a **fixed positive ion** in the lattice, exactly balancing the free electron. The\n> names \"n-type\" and \"p-type\" refer only to the **sign of the majority carriers**, not to any net\n> charge on the material.\n\n**The mass-action relation** (worth knowing):\n\n```\n      n_e × n_h = n_i²\n```\n\nso increasing one type of carrier by doping necessarily **decreases** the other.\n\n### The p-n junction\n\n*Diagram:* a bar of semiconductor, p-type on the left and n-type on the right, meeting at a junction.\nShow the holes as circles in the p-region and electrons as dots in the n-region; between them, a\nnarrow **depletion region** containing **immobile negative ions on the p-side** and **immobile\npositive ions on the n-side**, with an arrow showing the internal field from n to p and the barrier\npotential V_B.\n\n**How the junction forms — the two processes:**\n\n**1. Diffusion.** Because the hole concentration is far higher on the p-side and the electron\nconcentration far higher on the n-side, **holes diffuse from p to n** and **electrons diffuse from n\nto p**. This is a **diffusion current**, from p to n.\n\n**2. Formation of the depletion region.** As an electron leaves the n-region it exposes a **fixed\npositive donor ion**; as a hole leaves the p-region it exposes a **fixed negative acceptor ion**.\nNear the junction, therefore, a narrow region forms that is **depleted of mobile charge carriers** and\ncontains only **immobile ions** — negative on the p-side, positive on the n-side. This is the\n**depletion region** (or depletion layer), typically a fraction of a micrometre wide.\n\n**3. Barrier potential.** The immobile ions set up an **internal electric field** directed from the\nn-side to the p-side. The associated potential difference across the depletion region is the\n**barrier potential V_B** (also called the potential barrier or junction potential):\n\n```\n      V_B ≈ 0.3 V for germanium                V_B ≈ 0.7 V for silicon\n```\n\n**4. Equilibrium.** This field opposes further diffusion, but it **assists** the motion of minority\ncarriers — driving the few electrons on the p-side across to the n-side and vice versa. That is the\n**drift current**, from n to p. At equilibrium the **diffusion current exactly balances the drift\ncurrent**, so the **net current is zero** and the junction is stable.\n\n### Forward and reverse bias\n\n**Forward bias** — the **p-side is connected to the positive terminal** of the battery and the n-side\nto the negative.\n\n| Effect | |\n| --- | --- |\n| The applied field **opposes** the internal barrier field | |\n| Barrier potential | **decreases** |\n| Width of the depletion region | **decreases** |\n| Diffusion of majority carriers | greatly **increased** |\n| Current | **large**, of the order of **milliamperes**; carried by **majority** carriers |\n| Resistance of the junction | **low** (a few ohms to a few hundred ohms) |\n\nAppreciable current begins only once the applied voltage exceeds the barrier potential — the\n**knee (threshold or cut-in) voltage**, about **0.3 V for Ge** and **0.7 V for Si**. Beyond the knee,\nthe current rises very steeply.\n\n**Reverse bias** — the **p-side is connected to the negative terminal** and the n-side to the\npositive.\n\n| Effect | |\n| --- | --- |\n| The applied field **aids** the internal barrier field | |\n| Barrier potential | **increases** |\n| Width of the depletion region | **increases** |\n| Diffusion of majority carriers | essentially **stopped** |\n| Current | **very small**, of the order of **microamperes**; carried by **minority** carriers |\n| Resistance of the junction | **very high** (of the order of megohms) |\n\nThe small reverse current is called the **reverse saturation current**. It is almost **independent of\nthe applied reverse voltage**, because it is limited by the small number of thermally generated\nminority carriers available, not by the voltage. (It does, however, increase with temperature.)\n\nAt a sufficiently large reverse voltage the junction suffers **breakdown**, and the reverse current\nrises abruptly. That voltage is the **breakdown voltage**.\n\n### I–V characteristics of a p-n junction diode\n\n*Circuit to obtain them:* for the **forward** characteristic, the diode in series with a milliammeter,\na rheostat and a battery, with the p-side to the positive terminal, and a voltmeter across the diode.\nFor the **reverse** characteristic, the same but with the battery reversed and a **micro**ammeter in\nplace of the milliammeter.\n\n```\n                    I (mA)\n                      │        ╱\n                      │       │\n                      │      ╱     ← FORWARD BIAS\n                      │     ╱        current in mA\n                      │    │         steep rise after the knee\n                      │  ──╯\n                      │ ╱  ↑ knee voltage (0.3 V Ge, 0.7 V Si)\n    ──────────────────┼────────────────→  V (volts)\n   ←── V (reverse)    │\n                      │\n   breakdown ──►  ────┤   ← REVERSE BIAS: tiny, nearly constant\n      │               │      reverse saturation current (µA)\n      ▼               │\n                    I (µA)\n```\n\n**The features to state:**\n\n1. In **forward bias**, the current is negligible until the applied voltage reaches the **knee\n   voltage**; beyond it the current rises **very steeply and non-linearly**.\n2. In **reverse bias**, only a very small, almost **constant** reverse saturation current flows\n   (microamperes), until **breakdown** occurs.\n3. **The scales on the two halves are different** — mA for forward, µA for reverse. You must label\n   them so, or the graph is wrong.\n4. The characteristic is **non-linear**, so a diode is a **non-ohmic** device: V/I is not constant.\n\n**Dynamic (a.c.) resistance:**\n\n```\n      r_d = ΔV/ΔI\n```\n\ntaken from the slope of the characteristic at the operating point. It is small in forward bias and\nvery large in reverse bias.\n\n**The essential conclusion:** a p-n junction diode conducts **easily in one direction only** —\nforward. It is therefore a **one-way valve** for current, and this is precisely what makes it useful\nas a **rectifier**.\n\n### Diode as a rectifier\n\n**Rectification** is the conversion of **alternating current into direct (unidirectional) current**.\nIt works because the diode conducts only when forward biased.\n\n**Half-wave rectifier**\n\n*Circuit:* an AC supply feeding the primary of a transformer; the secondary connected in series with\na single **diode** and a **load resistance R_L**. The output is taken across R_L.\n\n**Working.** During the half-cycle in which the diode is **forward biased**, it conducts and current\nflows through R_L, producing an output voltage. During the next half-cycle the diode is **reverse\nbiased**, so it does not conduct and the output is **zero**.\n\n```\n  INPUT (AC)          ╱‾╲       ╱‾╲       ╱‾╲\n                     ╱   ╲     ╱   ╲     ╱   ╲\n                 ───┴─────┴───┴─────┴───┴─────┴───→ t\n                          ╲   ╱     ╲   ╱\n                           ╲_╱       ╲_╱\n\n  OUTPUT             ╱‾╲             ╱‾╲             ╱‾╲\n  (half-wave)       ╱   ╲           ╱   ╲           ╱   ╲\n                 ───┴─────┴─────────┴─────┴─────────┴─────→ t\n                         (nothing during the other half-cycle)\n```\n\nSo the output appears only during **alternate half-cycles**. The output frequency **equals the input\nfrequency**.\n\n**Full-wave rectifier**\n\n*Circuit:* an AC supply feeding a **centre-tapped transformer**; the two ends of the secondary\nconnected to the p-sides of **two diodes** D₁ and D₂; the two n-sides joined together and connected\nthrough the **load resistance R_L** back to the **centre tap**.\n\n**Working.** During one half-cycle, the upper end of the secondary is positive, so **D₁ is forward\nbiased and D₂ reverse biased**; D₁ conducts and current flows through R_L. During the next\nhalf-cycle, the polarity reverses, so **D₂ is forward biased and D₁ reverse biased**; D₂ conducts and\ncurrent flows through R_L **in the same direction** as before.\n\n```\n  INPUT (AC)          ╱‾╲       ╱‾╲       ╱‾╲\n                     ╱   ╲     ╱   ╲     ╱   ╲\n                 ───┴─────┴───┴─────┴───┴─────┴───→ t\n                          ╲   ╱     ╲   ╱\n                           ╲_╱       ╲_╱\n\n  OUTPUT             ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲\n  (full-wave)       ╱   V   V   V   V   V   ╲\n                 ───┴───────────────────────────→ t\n                     (output during BOTH half-cycles)\n```\n\nSo the output appears during **both** half-cycles, always in the same direction through the load. The\noutput frequency is **twice the input frequency**.\n\n**Comparison:**\n\n| | **Half-wave** | **Full-wave** |\n| --- | --- | --- |\n| Number of diodes | 1 | 2 (with a centre-tapped transformer) |\n| Conduction | alternate half-cycles only | both half-cycles |\n| Output frequency | same as the input | **twice** the input |\n| Efficiency | lower (~40.6%) | higher (~81.2%) |\n| Ripple in the output | larger | smaller |\n\n**Why a filter is used.** The rectified output is unidirectional but still **pulsating**, not steady\nDC. A **capacitor connected in parallel with the load** (a filter) smooths it: the capacitor charges\nat the peaks and discharges through the load in the gaps, greatly reducing the ripple.\n\n### Quick recall box\n\n```\nENERGY BANDS  (E_g = forbidden gap between valence and conduction bands)\n  CONDUCTOR     : E_g = 0, bands overlap ;  conductivity ↓ with T\n  SEMICONDUCTOR : E_g ≈ 1 eV (Si 1.1, Ge 0.7) ;  conductivity ↑ with T\n  INSULATOR     : E_g > 3 eV (diamond ≈ 6 eV)\n\nINTRINSIC : pure ;  n_e = n_h = n_i ;  conduction by BOTH electrons and holes\n  pairs created thermally ;  n_i rises fast with T ;  insulator at 0 K\n\nEXTRINSIC (doping ≈ 1 impurity per 10⁶ atoms)\n  n-TYPE : PENTAVALENT dopant (P, As, Sb, Bi) = DONOR\n           majority ELECTRONS, minority holes ;  n_e >> n_h\n  p-TYPE : TRIVALENT dopant (B, Al, In, Ga) = ACCEPTOR\n           majority HOLES, minority electrons ;  n_h >> n_e\n  BOTH ARE ELECTRICALLY NEUTRAL       n_e n_h = n_i²\n\np-n JUNCTION\n  diffusion of majority carriers → immobile ions exposed → DEPLETION REGION\n  (negative ions on the p-side, positive on the n-side)\n  internal field n → p ;  BARRIER POTENTIAL V_B ≈ 0.3 V (Ge), 0.7 V (Si)\n  equilibrium: diffusion current = drift current, net current zero\n\nFORWARD BIAS (p to +) : barrier ↓, depletion width ↓, current LARGE (mA),\n  majority carriers, resistance LOW ;  knee voltage 0.3 V Ge / 0.7 V Si\nREVERSE BIAS (p to −) : barrier ↑, depletion width ↑, current TINY (µA),\n  minority carriers, resistance HIGH ;  reverse saturation current is nearly\n  independent of voltage ;  breakdown at large reverse V\n\nI–V CHARACTERISTIC: non-linear ⟹ diode is NON-OHMIC\n  label the axes: mA for forward, µA for reverse\n  dynamic resistance r_d = ΔV/ΔI\n\nRECTIFIER: AC → unidirectional DC (the diode conducts one way only)\n  HALF-WAVE : 1 diode ; alternate half-cycles ; output frequency = input\n  FULL-WAVE : 2 diodes + CENTRE-TAPPED transformer ; both half-cycles ;\n              output frequency = 2 × input ; more efficient, less ripple\n  a capacitor in parallel with the load acts as a FILTER, smoothing the ripple\n```\n\n---","pyq":"**Q1.** *(5 marks)* With the help of a circuit diagram, explain the working of a **full-wave\nrectifier**. Draw the input and output waveforms. How does the output frequency compare with the\ninput frequency?\n\n**Q2.** *(3 marks)* Draw the energy band diagrams for a conductor, a semiconductor and an insulator,\nand distinguish between them on the basis of the forbidden energy gap.\n\n**Q3.** *(3 marks)* Explain, with a diagram, how a **depletion region** and a **barrier potential**\nare formed in a p-n junction.\n\n**Q4.** *(3 marks)* Draw the I–V characteristics of a p-n junction diode in forward and reverse bias.\nExplain the shape of the curve in each case.\n\n**Q5.** *(3 marks)* Distinguish between n-type and p-type semiconductors. Are they electrically\ncharged? Explain.\n\n**Q6.** *(2 marks)* What is meant by doping? Name two pentavalent and two trivalent dopants.\n\n**Q7.** *(3 marks)* Explain the working of a **half-wave rectifier** with a circuit diagram and\ninput/output waveforms.\n\n**Q8.** *(2 marks)* Why does the conductivity of a semiconductor increase with temperature, while that\nof a metal decreases?\n\n**Q9.** *(2 marks)* Why is the reverse saturation current of a diode almost independent of the applied\nreverse voltage?\n\n**Q10.** *(1 mark, MCQ)* In an n-type semiconductor, the majority carriers are\n(a) holes (b) electrons (c) protons (d) positive ions\n\n**Q11.** *(2 marks)* In a p-n junction diode, the forward bias resistance is low and the reverse bias\nresistance is high. Explain.\n\n**Q12.** *(4 marks, case study)* A silicon diode is connected in series with a resistance of 200 Ω\nand a battery of 5 V, with the p-side towards the positive terminal.\n(i) Is the diode forward or reverse biased?\n(ii) Taking the voltage drop across a conducting silicon diode as 0.7 V, find the current in the\ncircuit.\n(iii) What would the current be if the battery were reversed?\n(iv) Explain why a diode is called a non-ohmic device.\n\n**Q13.** *(2 marks)* Why is a semiconductor an insulator at 0 K?\n\n---","sol":"### Q1 — full-wave rectifier\n\n*Circuit diagram (draw and label all of this):* an AC input to the **primary** of a transformer; a\n**centre-tapped secondary**; the upper end of the secondary connected to the p-side of diode **D₁**\nand the lower end to the
