e line: β = y_(n+1) − y_n = (n+1)λD/d − nλD/d = λD/d.)*\n\n**All fringes are of equal width and equal intensity**, and the pattern is symmetric about the\ncentral bright fringe at O.\n\n**Angular fringe width:**\n\n```\n      θ = β/D = λ/d\n```\n\n**Effect of changing the parameters** — this is asked constantly:\n\n| Change | Effect on β = λD/d |\n| --- | --- |\n| Wavelength λ increased (e.g. blue → red) | β **increases** |\n| Screen distance D increased | β **increases** |\n| Slit separation d increased | β **decreases** |\n| Whole apparatus immersed in a liquid of index n | λ → λ/n, so β **decreases** to β/n |\n| One slit covered | interference **disappears**; only single-slit diffraction remains |\n| Monochromatic source replaced by white light | central fringe **white**, flanked by a few coloured fringes (violet nearest the centre, since β ∝ λ) |\n| Slit width increased (both slits) | fringes lose contrast and eventually wash out |\n\n### Diffraction at a single slit\n\n*Diagram:* a plane wavefront incident on a slit of width a, with a screen at distance D. Show the\nbroad central bright maximum, flanked by minima and progressively weaker secondary maxima, and the\nintensity-distribution curve beside it.\n\nDiffraction is the **bending of light around the edges of an obstacle or aperture**, and the\nconsequent spreading into the geometrical shadow. It becomes noticeable when the size of the\naperture is **comparable to the wavelength**.\n\n**Positions of the minima (dark):**\n\n```\n      a sin θ = n λ                 n = ±1, ±2, ±3, …          (note: n ≠ 0)\n```\n\n**Positions of the secondary maxima (bright):**\n\n```\n      a sin θ = (2n + 1) λ/2        n = 1, 2, 3, …\n```\n\n**The central maximum** lies at θ = 0 and is much broader and far more intense than the others.\n\n**Width of the central maximum:**\n\n```\n      Angular half-width  θ = λ/a\n      Angular full width  2θ = 2λ/a\n\n      Linear width on a screen at distance D:   w = 2 λ D / a\n```\n\n**Consequences that get asked:**\n- **Narrower slit (a smaller) → wider central maximum.** The pattern spreads more.\n- **Longer wavelength → wider central maximum.**\n- If a >> λ, the central maximum is very narrow and diffraction is negligible — which is why ray\n  optics works for ordinary apertures.\n\n**Intensity distribution:**\n\n```\n   I │        ╱╲\n     │       ╱  ╲          ← broad, intense central maximum\n     │      ╱    ╲\n     │     ╱      ╲\n     │ ╱╲ ╱        ╲ ╱╲    ← weak secondary maxima\n     │╱  V          V  ╲\n     └────┴────┴────┴────┴──── θ\n        −2λ/a −λ/a  λ/a 2λ/a\n```\n\n### Interference vs diffraction — the comparison table\n\n| | **Interference** | **Diffraction** |\n| --- | --- | --- |\n| Cause | superposition of waves from **two (or more) separate coherent sources** | superposition of waves from **different parts of the same wavefront** |\n| Fringe width | all fringes are of **equal width** | the central maximum is **much wider** than the others |\n| Intensity of maxima | all bright fringes are of **equal intensity** | intensity **falls off rapidly** away from the centre |\n| Minima | dark fringes are **perfectly dark** (for equal amplitudes) | minima are **not perfectly dark** |\n| Number of fringes | many fringes of comparable brightness | a few, with most of the light in the central maximum |\n\n### Polarisation — read once, do not drill\n\n*(See the scope note in §1: treat this section as low priority and verify against the current\nsyllabus.)*\n\nLight from an ordinary source is **unpolarised** — the electric field vibrates in all directions\nperpendicular to the direction of propagation. In **plane (linearly) polarised** light, the electric\nfield vibrates in **one plane** only.\n\n**Polarisation is possible only for transverse waves**, so its observation in light is direct\nevidence that **light is a transverse wave**. That single sentence is the most likely thing to be\nasked here.\n\n**Polaroids** are sheets that transmit only the component of the electric field along their\ntransmission axis. Two Polaroids in series:\n- axes **parallel** → maximum transmission;\n- axes **perpendicular (crossed)** → **no light** transmitted.\n\n**Malus's law:** I = I₀ cos²θ, where θ is the angle between the polariser's and the analyser's axes.\n\n**Brewster's law:** when unpolarised light is incident on a surface at the **polarising angle** θ_p,\nthe reflected light is completely plane polarised, and\n\n```\n      tan θ_p = n\n```\n\n**Uses of Polaroids:** sunglasses (reducing glare from horizontal surfaces), camera filters,\nphotoelastic stress analysis, LCD displays, controlling the intensity of light in windows.\n\n### Quick recall box\n\n```\nWAVEFRONT: locus of points in the SAME PHASE ;  a ray is ⊥ to the wavefront\n  spherical (point source) | cylindrical (slit) | plane (distant source)\n\nHUYGENS: every point on a wavefront is a source of secondary wavelets;\n         the new wavefront is the FORWARD ENVELOPE of these wavelets\n  reflection : BC = AD = ct, triangles congruent ⟹ i = r\n  refraction : sin i/sin r = v₁/v₂ = n₂/n₁\n  frequency UNCHANGED on refraction; wavelength changes with the speed\n\nINTERFERENCE\n  constructive: path diff = nλ      ,  phase diff = 2nπ\n  destructive : path diff = (2n−1)λ/2, phase diff = (2n−1)π\n  phase diff = (2π/λ) × path diff\n  I = I₁ + I₂ + 2√(I₁I₂)cos φ ;  I_max = (√I₁+√I₂)² ;  I_min = (√I₁−√I₂)²\n\nCOHERENT SOURCES: same frequency, CONSTANT phase difference\n  two independent lamps cannot interfere — random, rapidly varying phase\n  hence YDSE derives both beams from ONE source\n\nYDSE : path difference = yd/D\n  bright : y = nλD/d          dark : y = (2n−1)λD/2d\n  FRINGE WIDTH  β = λD/d       angular width = λ/d\n  λ↑ → β↑ ;  D↑ → β↑ ;  d↑ → β↓ ;  immersed in liquid n → β/n\n  white light → central fringe WHITE, then a few coloured fringes\n\nSINGLE-SLIT DIFFRACTION\n  minima : a sin θ = nλ  (n ≠ 0)      secondary maxima : a sin θ = (2n+1)λ/2\n  central maximum: angular half-width λ/a, full width 2λ/a\n  linear width on screen = 2λD/a\n  narrower slit → WIDER central maximum\n\nINTERFERENCE vs DIFFRACTION: two sources vs one wavefront ; equal vs unequal widths ;\n  equal vs falling intensity ; perfectly dark vs not perfectly dark minima\n\nPOLARISATION (low priority): proves light is TRANSVERSE\n  Malus: I = I₀cos²θ ;  Brewster: tan θ_p = n ;  crossed Polaroids → no light\n```\n\n---","pyq":"**Q1.** *(5 marks)* State Huygens' principle. Use it to prove the laws of reflection of a plane wave\nat a plane reflecting surface.\n\n**Q2.** *(5 marks)* Use Huygens' principle to derive Snell's law of refraction for a plane wave at a\nplane interface. What happens to the frequency, wavelength and speed of light when it goes from a\nrarer to a denser medium?\n\n**Q3.** *(3 marks)* In Young's double slit experiment, write the expression for the fringe width. In\nan experiment, two slits 0.3 mm apart are illuminated by light of wavelength 600 nm, and the screen\nis 1.5 m away. Find the fringe width and the distance of the third bright fringe from the centre.\n\n**Q4.** *(3 marks)* What are coherent sources? Why can two independent sources of light not produce a\nsustained interference pattern? State two conditions for sustained interference.\n\n**Q5.** *(3 marks)* Describe the diffraction pattern due to a single slit. Derive (or write) the\nexpression for the width of the central maximum and state how it changes if (i) the slit is made\nnarrower and (ii) red light is used instead of blue.\n\n**Q6.** *(3 marks)* Distinguish between interference and diffraction of light, giving three points of\ndifference.\n\n**Q7.** *(2 marks)* How does the fringe width in Young's experiment change if (i) the screen is moved\nfurther away, (ii) the separation between the slits is increased, (iii) the whole apparatus is\nimmersed in water?\n\n**Q8.** *(2 marks)* In a YDSE, the intensity at the central maximum is I₀. What is the intensity at a\npoint where the path difference is λ/3?\n\n**Q9.** *(2 marks)* A slit of width 0.2 mm is illuminated by light of wavelength 600 nm. Find the\nangular width of the central maximum.\n\n**Q10.** *(2 marks)* What is observed in Young's double slit experiment if the monochromatic source\nis replaced by white light?\n\n**Q11.** *(1 mark, MCQ)* In a single-slit diffraction pattern, the first minimum occurs at an angle θ\ngiven by\n(a) a sin θ = λ/2 (b) a sin θ = λ (c) a sin θ = 2λ (d) a sin θ = 3λ/2\n\n**Q12.** *(4 marks, case study)* In a Young's double slit experiment, the slit separation is 0.5 mm\nand the screen is 1 m from the slits. The source emits light of wavelength 500 nm.\n(i) Find the fringe width.\n(ii) Find the distance between the 2nd and the 5th bright fringes.\n(iii) Where is the 3rd dark fringe located?\n(iv) What happens to the pattern if one of the slits is covered?\n\n**Q13.** *(2 marks)* Why does the observation of polarisation of light establish that light is a\ntransverse wave?\n\n---","sol":"### Q1 — Huygens' principle and the law of reflection\n\n**Statement of Huygens' principle.**\n\n1. Every point on a given wavefront acts as a **source of secondary wavelets** which spread out in\n   all directions with the **speed of the wave in that medium**.\n2. The position of the wavefront after a time t is the **forward envelope** (the common tangent\n   surface) of all these secondary wavelets. The backward envelope is discarded, since no backward\n   wave is observed.\n\n**Proof of the laws of reflection.**\n\n*Diagram:* the reflecting surface XY drawn horizontally. A plane wavefront AB approaches at angle i,\nwith A on the surface and B above it. While the disturbance travels from B to C along the surface, a\nsecondary wavelet centred on A grows to radius AD. The reflected wavefront is the tangent CD, making\nangle r with the surface. Draw the normals, and mark i and r.\n\nLet a plane wavefront AB be incident at angle i on a plane reflecting surface XY. Let c be the speed\nof the wave, and let t be the time taken for the disturbance to travel from B to C, where C is on the\nsurface.\n\nThen\n\n```\n      BC = c t\n```\n\nDuring the same time t, the secondary wavelet originating at A spreads out to a radius\n\n```\n      AD = c t\n```\n\nSo\n\n```\n      BC = AD                    …(i)\n```\n\nThe reflected wavefront is the tangent from C to this wavelet, i.e. **CD**.\n\nNow compare the right-angled triangles **ABC** and **ADC**:\n\n```\n      ∠ABC = ∠ADC = 90°          (AB is the incident wavefront, CD the reflected one)\n      BC = AD                     from (i)\n      AC = AC                     common\n```\n\nBy the **RHS congruence** criterion, the triangles ABC and ADC are **congruent**. Therefore the\ncorresponding angles are equal:\n\n```\n      ∠BAC = ∠DCA\n```\n\nFrom the geometry, ∠BAC = **i** (the angle of incidence) and ∠DCA = **r** (the angle of reflection).\nHence\n\n```\n      i = r\n```\n\nwhich is the **first law of reflection**. Also, the incident wavefront, the reflected wavefront and\nthe normal all lie in the same plane (the plane of the diagram), which is the **second law**. ∎\n\n### Q2 — Huygens' principle and Snell's law\n\n*Diagram:* the interface XY between medium 1 (above, speed v₁) and medium 2 (below, speed v₂ < v₁).\nA plane wavefront AB is incident at angle i, A on the interface. While the disturbance travels\nB → C along the interface in medium 1, the secondary wavelet from A grows to radius AD in medium 2.\nThe refracted wavefront is the tangent CD, at angle r. Mark i, r, BC = v₁t and AD = v₂t.\n\nLet a plane wavefront AB be incident at angle i on the plane interface between two media, in which\nthe wave speeds are v₁ and v₂.\n\nLet t be the time taken for the disturbance at B to reach the interface at C. In medium 1,\n\n```\n      BC = v₁ t\n```\n\nDuring the same time t, the secondary wavelet from A travels into medium 2, where the speed is v₂, so\nit reaches a radius\n\n```\n      AD = v₂ t\n```\n\nThe refracted wavefront is the tangent CD.\n\n**In triangle ABC** (right-angled at B), the angle at A equals the angle of incidence i:\n\n```\n      sin i = BC/AC = v₁ t / AC                    …(i)\n```\n\n**In triangle ADC** (right-angled at D), the angle at C equals the angle of refraction r:\n\n```\n      sin r = AD/AC = v₂ t / AC                    …(ii)\n```\n\n**Dividing (i) by (ii):**\n\n```\n      sin i/sin r = v₁/v₂\n```\n\nThe right-hand side is a **constant** for the given pair of media, which is exactly **Snell's law**.\nWriting the speeds in terms of the refractive indices, v₁ = c/n₁ and v₂ = c/n₂:\n\n```\n      sin i/sin r = (c/n₁)/(c/n₂) = n₂/n₁ = n₂₁\n```\n\n∎\n\n**Going from a rarer to a denser medium:**\n\n| Quantity | Change |\n| --- | --- |\n| **Frequency** | **unchanged** — it is determined by the source, not the medium |\n| **Speed** | **decreases**, v = c/n |\n| **Wavelength** | **decreases**, λ → λ/n (since v = νλ with ν fixed) |\n\n### Q3 — YDSE fringe width and fringe position\n\n**Expression for the fringe width:**\n\n```\n      β = λ D / d\n```\n\nwhere λ is the wavelength, D the distance from the slits to the screen, and d the slit separation.\n\n**Numerical.**\n\n```\n      d = 0.3 mm = 0.3 × 10⁻³ m = 3 × 10⁻⁴ m\n      λ = 600 nm = 600 × 10⁻⁹ m = 6 × 10⁻⁷ m\n      D = 1.5 m\n```\n\n**Fringe width:**\n\n```\n      β = λD/d\n        = (6 × 10⁻⁷)(1.5)/(3 × 10⁻⁴)\n        = (9 × 10⁻⁷)/(3 × 10⁻⁴)\n        = 3 × 10⁻³ m\n        = 3 mm\n```\n\n**β = 3 mm**\n\n**Distance of the third bright fringe from the centre:**\n\n```\n      y₃ = 3 β = 3 × 3 = 9 mm\n```\n\n*(Equivalently y₃ = 3λD/d = 3 × 3 mm = 9 mm.)*\n\n**y₃ = 9 mm from the central fringe.**\n\n### Q4 — coherent sources and sustained interference\n\n**Coherent sources.** Two sources of light are said to be **coherent** if they emit waves of the\n**same frequency** (and wavelength) with a **constant phase difference** between them that does not\nchange with time.\n\n**Why two independent sources cannot produce sustained interference.**\n\nLight from an ordinary source is emitted by a vast number of atoms independently, in short bursts\nlasting about 10⁻⁸ s. The phase of the light from each source therefore **changes randomly and\nextremely rapidly** — millions of times a second.\n\nFor two **independent** sources, the phase difference between them is therefore **not constant** but\nfluctuates randomly. The positions of the bright and dark fringes shift far faster than the eye (or\nany detector) can follow, so only the **time average** is observed — which is **uniform\nillumination**, with no visible fringe pattern.\n\nThis is precisely why Young derived **both** interfering beams from a **single** source, by letting\nthe light fall on two narrow slits. Any random fluctuation in the source then affects the two beams\n**identically**, so their phase difference remains **constant** and a steady fringe pattern is\nobserved.\n\n**Two conditions for sustained interference** (any two):\n\n1. The two sources must be **coherent** — same frequency, constant phase difference. In practice this\n   means both must be derived from a single source.\n2. The two waves must have **nearly equal amplitudes**, so that the dark fringes are nearly dark and\n   the pattern has good contrast.\n3. The sources must be **narrow** and **close together**, and the screen sufficiently distant, so that\n   the fringes are wide enough to be resolved.\n\n### Q5 — single-slit diffraction pattern and the central maximum\n\n**Description of the pattern.**\n\n*Diagram:* a slit of width a illuminated by a plane wavefront, with a screen at distance D showing a\n**broad, bright central maximum** flanked on both sides by **dark minima** and progressively **weaker\nsecondary maxima**. Draw the intensity curve alongside.\n\nWhen monochromatic light passes through a narrow single slit, the pattern on the screen consists of:\n\n- a **broad, very intense central bright maximum** directly opposite the slit;\n- on either side, alternate **dark and bright bands**;\n- the secondary maxima are **much weaker** than the central one and their intensity **falls off\n  rapidly** with distance from the centre;\n- the minima are **not perfectly dark**.\n\nThe pattern arises from the superposition of secondary wavelets from **different parts of the same\nwavefront** passing through the slit.\n\n**Positions of the minima.** A dark fringe occurs when the slit can be divided into pairs of strips\nwhose contributions cancel, which gives\n\n```\n      a sin θ = n λ                 n = ±1, ±2, ±3, …\n```\n\n**Width of the central maximum.** The central maximum extends from the **first minimum on one side to\nthe first minimum on the other**. The first minimum is at\n\n```\n      a sin θ = λ           ⟹      sin θ = λ/a           ⟹      θ ≈ λ/a   (for small θ)\n```\n\nSo the **angular half-width** is λ/a and the\n\n```\n      angular width of the central maximum = 2θ = 2λ/a\n```\n\nOn a screen at distance D, the linear width is\n\n```\n      w = D × 2θ = 2 λ D / a\n```\n\n**(i) If the slit is made narrower** (a decreased): since w ∝ 1/a, the central maximum becomes\n**wider** — the pattern spreads out more. (In the limit of a very narrow slit, the light spreads\nalmost uniformly.)\n\n**(ii) If red light is used instead of blue** (λ increased, since λ_red > λ_blue): since w ∝ λ, the\ncentral maximum becomes **wider**.\n\n### Q6 — interference vs diffraction\n\n| | **Interference** | **Diffraction** |\n| --- | --- | --- |\n| **Origin** | superposition of waves from **two (or more) separate coherent sources** | superposition of secondary waves from **different parts of the same wavefront** |\n| **Fringe width** | all fringes have the **same width** | the **central maximum is much wider** than the rest, and the fringes are unequally spaced |\n| **Intensity of maxima** | all bright fringes have **the same intensity** | intensity of the maxima **decreases rapidly** away from the centre |\n| **Minima** | dark fringes are **perfectly dark** (for equal amplitudes) | minima are **not perfectly dark** |\n\n*(Any three rows constitutes a full 3-mark answer. Note that each row compares the **same** attribute\non both sides — that parallel structure is what the marking scheme rewards.)*\n\n### Q7 — effect of changes on the fringe width\n\nSince β = λD/d:\n\n**(i) Screen moved further away (D increased):** β ∝ D, so the fringe width **increases**.\n\n**(ii) Slit separation increased (d increased):** β ∝ 1/d, so the fringe width **decreases**.\n\n**(iii) Whole apparatus immersed in water** (refractive index n = 1.33): the wavelength in water\nbecomes λ_water = λ/n, while D and d are unchanged. So\n\n```\n      β_water = λ_water D/d = (λ/n)(D/d) = β/n\n```\n\nThe fringe width **decreases** by the factor n — to about β/1.33, i.e. about 75% of its value in air.\n\n### Q8 — intensity at a path difference of λ/3\n\n**Phase difference** corresponding to a path difference of λ/3:\n\n```\n      φ = (2π/λ) × (path difference) = (2π/λ)(λ/3) = 2π/3\n```\n\nFor two waves of equal intensity I₁ = I₂ = I, the resultant intensity is\n\n```\n      I_R = I + I + 2√(I·I) cos φ = 2I(1 + cos φ) = 4I cos²(φ/2)\n```\n\n**At the central maximum**, φ = 0, so I₀ = 4I, i.e. I = I₀/4.\n\n**At the point in question**, φ = 2π/3, so φ/2 = π/3 and\n\n```\n      I_R = 4I cos²(π/3) = 4I (1/2)² = 4I × ¼ = I\n```\n\nSince I = I₀/4,\n\n```\n      I_R = I₀/4\n```\n\n**The intensity is I₀/4.**\n\n### Q9 — angular width of the central maximum\n\n```\n      a = 0.2 mm = 0.2 × 10⁻³ m = 2 × 10⁻⁴ m\n      λ = 600 nm = 6 × 10⁻⁷ m\n```\n\n```\n      Angular width = 2λ/a\n                    = 2(6 × 10⁻⁷)/(2 × 10⁻⁴)\n                    = (12 × 10⁻⁷)/(2 × 10⁻⁴)\n                    = 6 × 10⁻³ rad\n```\n\n**Angular width = 6 × 10⁻³ rad** (about 0.34°).\n\n*(The angular half-width is 3 × 10⁻³ rad.)*\n\n### Q10 — YDSE with white light\n\nWith white light instead of a monochromatic source:\n\n1. **The central fringe is white.** At the centre the path difference is zero for **every**\n   wavelength, so all colours interfere constructively there and combine to give white.\n\n2. **The fringes on either side are coloured.** Since β = λD/d, the fringe width is **different for\n   each wavelength** — greatest for red and least for violet. So the maxima for different colours\n   fall at different positions, producing coloured fringes with **violet nearest the centre and red\n   furthest out** in each order.\n\n3. **Only a few fringes are visible.** Beyond the first few orders the fringe patterns of the\n   different wavelengths overlap so heavily that the colours merge into general white illumination,\n   and no distinct fringes can be seen.\n\n### Q11 — first minimum in single-slit diffraction\n\nThe minima are at a sin θ = nλ with n = 1, 2, 3, …, so the **first** minimum (n = 1) is at\n\n```\n      a sin θ = λ\n```\n\n**Answer: (b) a sin θ = λ**\n\n*(Option (a), a sin θ = λ/2, is the trap — that is the condition for a *maximum* in two-slit\ninterference, not a single-slit minimum. Note also that n = 0 is excluded from the minima condition,\nsince θ = 0 is the central **maximum**.)*\n\n### Q12 — case study: YDSE numerical\n\n```\n      d = 0.5 mm = 5 × 10⁻⁴ m          D = 1 m          λ = 500 nm = 5 × 10⁻⁷ m\n```\n\n**(i) Fringe width:**\n\n```\n      β = λD/d = (5 × 10⁻⁷)(1)/(5 × 10⁻⁴) = 10⁻³ m = 1 mm\n```\n\n**β = 1 mm**\n\n**(ii) Distance between the 2nd and 5th bright fringes:**\n\nBright fringes are at y_n = nβ, so\n\n```\n      y₅ − y₂ = (5 − 2)β = 3 × 1 mm = 3 mm\n```\n\n**3 mm**\n\n**(iii) Position of the 3rd dark fringe:**\n\n```\n      y_n(dark) = (2n − 1) λD/(2d) = (2n − 1) β/2\n```\n\nFor n = 3:\n\n```\n      y₃ = (2×3 − 1)(1/2) = 5 × 0.5 = 2.5 mm\n```\n\n**The 3rd dark fringe is 2.5 mm from the central bright fringe.**\n\n*(Sensible: the dark fringes sit midway between the bright ones, so the 3rd dark fringe lies between\nthe 2nd and 3rd bright fringes, at 2.5 mm ✓)*\n\n**(iv) If one slit is covered:**\n\nThe **interference pattern disappears**, because interference requires two coherent beams and there is\nnow only one. What remains is the **single-slit diffraction pattern** of the open slit — a broad\ncentral bright band with weak fringes on either side — and the screen is much less bright overall and\nshows no equally spaced fringes.\n\n### Q13 — polarisation and the transverse nature of light\n\n**Polarisation is a phenomenon that can occur only for transverse waves.**\n\nIn a **transverse** wave, the vibrations are perpendicular to the direction of propagation, so there\nare **many possible directions of vibration** in the plane perpendicular to the propagation\ndirection. It is therefore meaningful to select one of them — which is exactly what polarisation\ndoes.\n\nIn a **longitudinal** wave (such as sound), the vibrations are **along** the direction of\npropagation, so there is only **one** possible direction of vibration. There is nothing to select,\nand a longitudinal wave **cannot be polarised**.\n\nSince light **can** be polarised — as demonstrated by the fact that two crossed Polaroids block it\ncompletely — it follows that light must be a **transverse** wave. This was historically the decisive\nevidence for the transverse nature of light, and it is consistent with light being an\nelectromagnetic wave, in which **E** and **B** oscillate perpendicular to the direction of\npropagation.\n\n---","test":"Time: 45 minutes. Answers below.\n\n1. *(1)* In Young's double slit experiment, the fringe width is\n   (a) λd/D (b) λD/d (c) dD/λ (d) λ/(dD)\n2. *(1)* If the distance between the slits in YDSE is doubled, the fringe width\n   (a) doubles (b) halves (c) is unchanged (d) quadruples\n3. *(1)* The condition for the first minimum in single-slit diffraction is\n   (a) a sin θ = λ (b) a sin θ = λ/2 (c) a cos θ = λ (d) a sin θ = 2λ\n4. *(2)* Define a wavefront. What is the shape of the wavefront from a point source, and from a very\n   distant source?\n5. *(2)* State Huygens' principle.\n6. *(2)* In a YDSE, d = 1 mm, D = 1 m and λ = 600 nm. Find the fringe width.\n7. *(2)* What is the path difference for (i) the 4th bright fringe and (ii) the 3rd dark fringe?\n8. *(3)* Light of wavelength 500 nm falls on a slit of width 0.1 mm. Find the angular width of the\n   central maximum and its linear width on a screen 2 m away.\n9. *(3)* Two coherent sources have intensities in the ratio 4 : 1. Find the ratio of the maximum to\n   the minimum intensity in the interference pattern.\n10. *(5)* State Huygens' principle and use it to prove Snell's law. What happens to the wavelength of\n    light when it enters water (n = 1.33) from air, if its wavelength in air is 600 nm?\n11. *(3)* Give three differences between interference and diffraction.\n12. *(2)* Why is the diffraction of sound waves much more readily observed than that of light waves?\n13. *(2)* In a YDSE with white light, why is the central fringe white while the others are coloured?\n\n### Answer key\n\n**1. (b) λD/d.**\n\n**2. (b) halves.** β ∝ 1/d.\n\n**3. (a) a sin θ = λ.**\n\n**4.** A **wavefront** is the locus of all points of a medium vibrating in the **same phase** at a\ngiven instant. A **point source** gives a **spherical** wavefront. A **very distant source** gives\n(effectively) a **plane** wavefront, since a small portion of a very large sphere is nearly flat.\n\n**5.** (i) Every point on a wavefront acts as a source of **secondary wavelets** spreading out in all\ndirections with the speed of the wave in that medium. (ii) The new wavefront after time t is the\n**forward envelope** (common tangent) of all these secondary wavelets.\n\n**6. 0.6 mm.** β = λD/d = (6 × 10⁻⁷)(1)/(10⁻³) = 6 × 10⁻⁴ m = 0.6 mm.\n\n**7.** (i) 4th bright fringe: path difference = nλ with n = 4, so **4λ**.\n(ii) 3rd dark fringe: path difference = (2n − 1)λ/2 with n = 3, so **5λ/2**.\n\n**8. Angular width = 10⁻² rad; linear width = 2 cm.**\nAngular width = 2λ/a = 2(5 × 10⁻⁷)/(10⁻⁴) = 10⁻² rad.\nLinear width = 2λD/a = (10⁻²)(2) = 2 × 10⁻² m = 2 cm.\n\n**9. 9 : 1.** With I₁/I₂ = 4/1, we have √I₁ : √I₂ = 2 : 1.\nI_max/I_min = (√I₁ + √I₂)²/(√I₁ − √I₂)² = (2 + 1)²/(2 − 1)² = 9/1.\n\n**10.** Statement and proof as in §3 Q2.\nNumerically: λ_water = λ_air/n = 600/1.33 = **451 nm**. The **frequency is unchanged**; the speed and\nthe wavelength both fall by the factor n.\n\n**11.** Any three rows from the table in §4 Q6.\n\n**12.** Diffraction becomes appreciable only when the **wavelength is comparable to the size of the\naperture or obstacle**. Sound waves in air have wavelengths of the order of **centimetres to metres**,\ncomparable to the size of doorways, walls and other everyday obstacles — so sound diffracts strongly\nand we hear round corners. Light has wavelengths of the order of **5 × 10⁻⁷ m**, tens of thousands of\ntimes smaller than ordinary obstacles, so its diffraction is negligible for everyday apertures and\nbecomes observable only with very narrow slits.\n\n**13.** At the **central** fringe the path difference is **zero for every wavelength**, so all colours\ninterfere constructively there and combine to produce **white**. Away from the centre, the fringe\nwidth β = λD/d **depends on the wavelength**, so each colour has its maxima at different positions.\nThe colours therefore separate, giving **coloured fringes** — with violet nearest the centre (smallest\nβ) and red furthest out.\n\n**Scoring.** Out of 29. Below 20 → the two Huygens proofs plus the YDSE formula and its consequences\nare the priority. Everything else in this chapter is secondary.\n\n---","tips":"**On the Huygens proofs (the 5-markers)**\n\n1. **State the principle in two numbered parts** — secondary wavelets, and the forward envelope.\n   Both halves are marked, and mentioning that the backward envelope is discarded is a nice extra.\n\n2. **The diagram is essential and must be labelled.** Show the incident wavefront AB, the point C on\n   the surface, the secondary wavelet radius AD, the reflected/refracted wavefront CD, and the angles\n   i and r. Without the labels the proof cannot be followed.\n\n3. **For reflection, name the congruence criterion (RHS)** and list the three matching parts. That is\n   the mark.\n\n4. **For refraction, write BC = v₁t and AD = v₂t explicitly**, then take the two sines and divide.\n   Three lines. Do not skip to sin i/sin r = n₂/n₁.\n\n5. **Add the frequency/wavelength/speed conclusion** — it is very often an explicit sub-part.\n   Frequency unchanged; speed and wavelength both reduced by n.\n\n**On YDSE**\n\n6. **The syllabus says \"final expression only\", so state β = λD/d confidently** and then use it. If\n   you want to justify it, the one-line derivation β = y_(n+1) − y_n is enough.\n\n7. **Write down the SI conversions on their own line.** mm → 10⁻³ m, nm → 10⁻⁹ m, μm → 10⁻⁶ m. Almost\n   every numerical error in this chapter is a power-of-ten slip here.\n\n8. **For \"effect of changing…\" questions, quote the formula and reason from it.** \"Since β = λD/d and\n   β ∝ 1/d, doubling d halves the fringe width.\" Quoting the proportionality is the mark.\n\n9. **For immersion in a liquid, change only λ.** λ → λ/n, so β → β/n. D and d are geometric and\n   unchanged.\n\n10. **For the coherence question, the answer is about the randomly varying phase**, and the point of\n    the single slit before the double slit is to make the two beams share that variation. Say both\n    things.\n\n**On single-slit diffraction**\n\n11. **The minima condition excludes n = 0.** a sin θ = nλ with n = ±1, ±2, … — because θ = 0 is the\n    central **maximum**, not a minimum. Stating that exclusion shows understanding.\n\n12. **Width of the central maximum is 2λ/a angular, 2λD/a linear.** Note the factor of 2 — it spans\n    from the first minimum on one side to the first on the other. Forgetting the 2 is the standard\n    error.\n\n13. **Draw the intensity distribution**, with the broad central peak and rapidly decaying secondary\n    maxima, and label the axes. It is worth a mark.\n\n**On comparison questions**\n\n14. **Use a table with parallel rows.** Each row must compare the **same** attribute for interference\n    and for diffraction. Three parallel rows is a full 3-mark answer; three unrelated statements is\n    not.\n\n**On priorities**\n\n15. **Spend your time on YDSE and single-slit diffraction, not on polarisation.** Given the scope\n    uncertainty noted in §1, know that polarisation proves light is transverse and know what crossed\n    Polaroids do — and leave it there."}},{"id":"p11","subj":"physics","num":11,"title":"Dual Nature of Radiation and Matter","unit":"Units VII+VIII · Modern Physics","unitMarks":12,"prio":1,"appear":"Units VII + VIII (12 marks, shared with Ch 12 and Ch 13) · Typical appearance: 1–2 MCQs + a 2/3-mark question on Einstein's equation or the graphs, and a frequent source of Section-D case studies (the graphs make ideal \"source material\").","deleted":"- **Davisson–Germer experiment**","recall":"```\nPHOTOELECTRIC EFFECT: emission of electrons when light of suitable frequency hits a metal\n\nφ₀ = work function = hν₀ = hc/λ₀      (a property of the METAL)\nV₀ = stopping potential ;  eV₀ = K_max\nsaturation current depends on INTENSITY\n\nEINSTEIN : hν = φ₀ + K_max = φ₀ + eV₀\n           K_max = h(ν − ν₀)\n           V₀ = (h/e)ν − φ₀/e\n\nFOUR LAWS: current ∝ intensity ;  K_max depends only on ν ;\n           threshold ν₀ exists ;  emission is instantaneous (<10⁻⁹ s)\n\nWAVE THEORY FAILS on all three of: K_max should depend on intensity (it doesn't),\n  there should be no threshold (there is), there should be a time lag (there isn't)\n\nGRAPHS\n  I vs V, different INTENSITIES (same ν): different saturation currents, SAME V₀\n  I vs V, different FREQUENCIES (same I): same saturation current, DIFFERENT V₀\n  V₀ vs ν : straight line ; slope = h/e (SAME for all metals) ;\n            x-intercept = ν₀ ; y-intercept = −φ₀/e\n\nPHOTON : E = hν = hc/λ ;  p = h/λ ;  rest mass 0 ;  charge 0 (undeflected by E, B)\n\nde BROGLIE : λ = h/p = h/mv ;  λ = h/√(2mK)\n  accelerated electron : λ = h/√(2meV) = 12.27/√V Å\n  λ ∝ 1/√V ;  for the same K, heavier particle → shorter λ\n\nCONSTANTS: h = 6.63×10⁻³⁴ J s ; 1 eV = 1.6×10⁻¹⁹ J ; hc = 1240 eV nm ;\n           m_e = 9.1×10⁻³¹ kg\n```","s":{"scope":"### In the syllabus\n\n- **Dual nature of radiation**\n- **Photoelectric effect**; **Hertz and Lenard's observations**\n- **Einstein's photoelectric equation** — the particle nature of light\n- **Experimental study** of the photoelectric effect\n- **Matter waves** — the wave nature of particles; the **de Broglie relation**\n\n### Deleted — do not study\n\n- **Davisson–Germer experiment**\n\n---","brief":"### The photoelectric effect\n\n**Definition.** The **emission of electrons** from the surface of a metal when light of a suitable\nfrequency falls on it. The emitted electrons are called **photoelectrons**.\n\n**Hertz and Lenard's observations.** Hertz (1887) found that a spark discharge occurred more readily\nwhen the electrodes were illuminated with ultraviolet light. Lenard (1902) showed that the effect was\ndue to the emission of **electrons** from the illuminated cathode, and that the current flowed only\nwhile the light was falling on it.\n\n### The terms — know these definitions exactly\n\n| Term | Definition |\n| --- | --- |\n| **Work function** φ₀ | The **minimum energy** required to just liberate an electron from the metal surface. Unit: eV (or J). A material constant. |\n| **Threshold frequency** ν₀ | The **minimum frequency** of incident radiation below which no photoemission occurs, however great the intensity. φ₀ = hν₀ |\n| **Threshold wavelength** λ₀ | The corresponding **maximum** wavelength: λ₀ = c/ν₀ = hc/φ₀ |\n| **Stopping potential** V₀ | The **minimum negative** potential on the collector at which the photocurrent becomes **zero**. It measures the maximum kinetic energy: eV₀ = K_max |\n| **Saturation current** | The maximum photocurrent, reached when all emitted electrons are collected. It depends on the **intensity** |\n\nNote that **φ₀, ν₀ and λ₀ are properties of the metal**, not of the incident light.\n\n### The four experimental laws of photoelectric emission\n\n1. **For a given frequency (above threshold), the photocurrent — and hence the number of\n   photoelectrons emitted per second — is directly proportional to the intensity** of the incident\n   radiation.\n\n2. **The maximum kinetic energy of the photoelectrons depends only on the frequency** of the incident\n   radiation and on the metal, and is **completely independent of the intensity**.\n\n3. **There exists a threshold frequency ν₀ for each metal, below which no emission occurs**, however\n   intense the radiation and however long it is applied.\n\n4. **The emission is instantaneous** — the time lag between the incidence of radiation and the\n   emission of electrons is less than about 10⁻⁹ s.\n\n### Einstein's photoelectric equation\n\nEinstein proposed that radiation consists of discrete **photons**, each of energy hν, and that\nphotoemission is a **one-photon–one-electron** process. An electron absorbs one whole photon; it uses\nφ₀ of that energy to escape the surface, and the rest appears as kinetic energy:\n\n```\n      h ν = φ₀ + K_max\n```\n\nso\n\n```\n      K_max = h ν − φ₀ = h ν − h ν₀ = h(ν − ν₀)\n```\n\nand since K_max = eV₀,\n\n```\n      e V₀ = h ν − φ₀                     ⟹      V₀ = (h/e) ν − φ₀/e\n```\n\nAlso, in terms of wavelength:\n\n```\n      h c/λ = φ₀ + ½ m v²_max\n```\n\n**How the equation explains all four laws** (this is the marked part of the question):\n\n| Law | Explanation from hν = φ₀ + K_max |\n| --- | --- |\n| Current ∝ intensity | Intensity = number of photons per second. More photons ⟹ more electrons emitted ⟹ larger current. |\n| K_max independent of intensity | K_max = hν − φ₀ contains no intensity term. Increasing the intensity sends more photons, but each still carries the same energy hν. |\n| Threshold frequency exists | If hν < φ₀ then K_max would be negative, which is impossible. So emission requires ν ≥ ν₀ = φ₀/h, whatever the intensity. |\n| Emission is instantaneous | The process is a single-photon absorption by a single electron — no time is needed to accumulate energy. |\n\n### Why the wave theory fails\n\nThe classical wave picture predicts the **opposite** of what is observed, in three ways:\n\n1. **Energy should depend on intensity.** On the wave theory a brighter beam carries more energy per\n   unit area, so the electrons should come off with **greater** kinetic energy. Observation: K_max is\n   completely independent of intensity.\n\n2. **There should be no threshold frequency.** A wave of any frequency should eventually supply enough\n   energy if applied long enough or intensely enough. Observation: below ν₀, **no** electrons are\n   emitted at all, however intense the light.\n\n3. **There should be a measurable time lag.** An electron would need time to absorb enough energy\n   from a spread-out wave — calculations give hours for a dim source. Observation: emission is\n   instantaneous (< 10⁻⁹ s).\n\n### The graphs — learn all three as objects\n\n**Graph 1 — photocurrent vs collector potential, at fixed frequency, for different intensities:**\n\n```\n     I │              ────────── I₃  (highest intensity)\n       │            ╱\n       │        ────────────── I₂\n       │      ╱  ╱\n       │  ──────────────  I₁\n       │ ╱ ╱  ╱\n   ────┴┴┴───────────────────→  V (collector potential)\n     −V₀   0\n       ↑\n   SAME stopping potential for all intensities\n```\n\n- The **saturation currents differ** — higher intensity gives a larger saturation current.\n- The **stopping potential is the same** for all three, because K_max depends only on the frequency.\n\n**Graph 2 — photocurrent vs collector potential, at fixed intensity, for different frequencies:**\n\n```\n     I │        ───────────────  (same saturation current)\n       │      ╱ ╱ ╱\n       │    ╱ ╱ ╱\n   ────┴───┴─┴─┴──────────────→  V\n    −V₀₃ −V₀₂ −V₀₁  0\n       ↑\n   DIFFERENT stopping potentials;  ν₃ > ν₂ > ν₁\n```\n\n- The **saturation current is the same**, since the intensity (photons per second) is unchanged.\n- The **stopping potentials differ** — a higher frequency gives a larger V₀.\n\n**Graph 3 — stopping potential vs frequency (the most-asked graph):**\n\n```\n   V₀ │                    ╱ metal A     ╱ metal B\n      │                  ╱             ╱\n      │                ╱             ╱\n      │              ╱             ╱\n   ───┼────────────●─────────────●──────────→ ν\n      │          ν₀A           ν₀B\n −φ₀/e│        ╱\n      │      ╱\n```\n\nFrom V₀ = (h/e)ν − φ₀/e, this is a **straight line** with:\n\n```\n      slope           = h/e                    — the SAME for every metal\n      x-intercept     = ν₀                     — the threshold frequency\n      y-intercept     = −φ₀/e                  — gives the work function\n```\n\n> **This graph is a favourite because it packs three facts into one line.** The slope is universal\n> (it is how h was first measured accurately by Millikan); only the intercept changes from metal to\n> metal, and a metal with a larger work function has a larger threshold frequency, so its line lies\n> further right.\n\n### The photon — properties\n\n| Property | Statement |\n| --- | --- |\n| Energy | E = hν = hc/λ |\n| Momentum | p = E/c = hν/c = **h/λ** |\n| Rest mass | **zero** |\n| Charge | **zero** — so a photon is **not deflected** by electric or magnetic fields |\n| Speed | c in vacuum, for all photons |\n| Number | photons are **not conserved** — they can be created and absorbed |\n| Intensity | intensity = (number of photons per unit area per second) × hν |\n\n**Effective (relativistic) mass:** m = E/c² = hν/c². *(This is not a rest mass; a photon has no rest\nmass.)*\n\n### de Broglie's hypothesis — matter waves\n\nDe Broglie proposed that **every moving particle has a wave associated with it**, of wavelength\n\n```\n      λ = h/p = h/(m v)\n```\n\n**For an electron accelerated through a potential difference V:**\n\n```\n      Kinetic energy:   K = eV = ½ m v²          ⟹      v = √(2eV/m)\n      Momentum:         p = m v = √(2 m e V)\n```\n\nso\n\n```\n      λ = h/√(2 m e V)\n```\n\nSubstituting the constants for an electron gives the very useful working formula:\n\n```\n      λ = 12.27/√V  Å                (V in volts, λ in ångström)\n\n         = 1.227/√V  nm\n```\n\n**In terms of kinetic energy K:**\n\n```\n      λ = h/√(2 m K)\n```\n\n**Points that get asked:**\n\n- λ ∝ 1/√V, so a **larger accelerating voltage gives a shorter wavelength**.\n- For the **same kinetic energy**, a heavier particle has a **shorter** de Broglie wavelength\n  (λ ∝ 1/√m). So a proton has a much shorter wavelength than an electron of the same energy.\n- For the **same speed**, again λ ∝ 1/m.\n- The de Broglie wavelength of ordinary macroscopic objects (a cricket ball, say) is around 10⁻³⁴ m —\n  far too small to detect, which is why we do not see wave behaviour in everyday life.\n\n### Constants to have memorised\n\n```\n      h = 6.63 × 10⁻³⁴ J s                          h/e = 4.14 × 10⁻¹⁵ V s\n      1 eV = 1.6 × 10⁻¹⁹ J                          hc = 1240 eV nm\n      m_e = 9.1 × 10⁻³¹ kg                          e = 1.6 × 10⁻¹⁹ C\n```\n\n> **hc = 1240 eV nm is worth its weight in gold.** It turns E = hc/λ into a one-line calculation:\n> a photon of wavelength 400 nm has energy 1240/400 = 3.1 eV. No powers of ten, no unit conversion.\n\n### Quick recall box\n\n```\nPHOTOELECTRIC EFFECT: emission of electrons when light of suitable frequency hits a metal\n\nφ₀ = work function = hν₀ = hc/λ₀      (a property of the METAL)\nV₀ = stopping potential ;  eV₀ = K_max\nsaturation current depends on INTENSITY\n\nEINSTEIN : hν = φ₀ + K_max = φ₀ + eV₀\n           K_max = h(ν − ν₀)\n           V₀ = (h/e)ν − φ₀/e\n\nFOUR LAWS: current ∝ intensity ;  K_max depends only on ν ;\n           threshold ν₀ exists ;  emission is instantaneous (<10⁻⁹ s)\n\nWAVE THEORY FAILS on all three of: K_max should depend on intensity (it doesn't),\n  there should be no threshold (there is), there should be a time lag (there isn't)\n\nGRAPHS\n  I vs V, different INTENSITIES (same ν): different saturation currents, SAME V₀\n  I vs V, different FREQUENCIES (same I): same saturation current, DIFFERENT V₀\n  V₀ vs ν : straight line ; slope = h/e (SAME for all metals) ;\n            x-intercept = ν₀ ; y-intercept = −φ₀/e\n\nPHOTON : E = hν = hc/λ ;  p = h/λ ;  rest mass 0 ;  charge 0 (undeflected by E, B)\n\nde BROGLIE : λ = h/p = h/mv ;  λ = h/√(2mK)\n  accelerated electron : λ = h/√(2meV) = 12.27/√V Å\n  λ ∝ 1/√V ;  for the same K, heavier particle → shorter λ\n\nCONSTANTS: h = 6.63×10⁻³⁴ J s ; 1 eV = 1.6×10⁻¹⁹ J ; hc = 1240 eV nm ;\n           m_e = 9.1×10⁻³¹ kg\n```\n\n---","pyq":"**Q1.** *(3 marks)* Write Einstein's photoelectric equation and use it to explain (i) the existence\nof a threshold frequency and (ii) why the maximum kinetic energy of the photoelectrons is independent\nof the intensity of the incident radiation.\n\n**Q2.** *(3 marks)* Draw a graph showing the variation of stopping potential with the frequency of\nincident radiation for two different metals. What does the slope of the graph represent? How is the\nwork function obtained from the graph?\n\n**Q3.** *(3 marks)* Draw graphs showing the variation of photocurrent with collector potential for\n(i) different intensities at constant frequency and (ii) different frequencies at constant intensity.\nExplain the essential difference between the two.\n\n**Q4.** *(3 marks)* State three observations of the photoelectric effect that the wave theory of light\ncannot explain, and state how the photon picture explains each.\n\n**Q5.** *(2 marks)* Define work function and threshold frequency. Write the relation between them.\n\n**Q6.** *(3 marks)* The work function of a metal is 2.14 eV. Light of wavelength 500 nm is incident on\nit. Find (i) the threshold wavelength, (ii) the maximum kinetic energy of the photoelectrons and\n(iii) the stopping potential.\n\n**Q7.** *(2 marks)* Find the de Broglie wavelength of an electron accelerated through a potential\ndifference of 100 V.\n\n**Q8.** *(2 marks)* An electron and a proton have the same kinetic energy. Which has the greater\nde Broglie wavelength, and why?\n\n**Q9.** *(2 marks)* Find the energy and momentum of a photon of wavelength 620 nm.\n\n**Q10.** *(1 mark, MCQ)* The stopping potential in a photoelectric experiment depends on\n(a) the intensity of the incident light (b) the frequency of the incident light\n(c) the distance of the source (d) the area of the cathode\n\n**Q11.** *(4 marks, case study)* In a photoelectric experiment, the stopping potential V₀ is measured\nfor different frequencies ν of the incident radiation, and the graph of V₀ against ν is found to be a\nstraight line of slope 4.14 × 10⁻¹⁵ V s, cutting the ν-axis at 5 × 10¹⁴ Hz.\n(i) What physical constant does the slope give?\n(ii) Find the value of Planck's constant from the slope.\n(iii) Find the work function of the metal in eV.\n(iv) Would the slope change if a different metal were used? Explain.\n\n**Q12.** *(2 marks)* Why are photons not deflected by an electric or a magnetic field?\n\n**Q13.** *(1 mark, Assertion–Reason)*\n**A:** No photoelectrons are emitted if the frequency of the incident light is below the threshold\nfrequency, however intense the light.\n**R:** Photoemission is a one-photon–one-electron process, and a single photon of energy less than\nthe work function cannot liberate an electron.\n\n---","sol":"### Q1 — Einstein's equation and two of the laws\n\n**Einstein's photoelectric equation.** Radiation consists of photons, each of energy hν. In\nphotoemission, **one photon is absorbed by one electron**. Part of the photon's energy, equal to the\nwork function φ₀, is used in liberating the electron from the metal surface, and the remainder appears\nas the electron's kinetic energy:\n\n```\n      h ν = φ₀ + K_max                      or          K_max = h ν − φ₀\n```\n\nSince K_max = eV₀, this can also be written eV₀ = hν − φ₀.\n\n**(i) The existence of a threshold frequency.**\n\nKinetic energy cannot be negative, so emission is possible only if\n\n```\n      h ν − φ₀ ≥ 0\n⟹     ν ≥ φ₀/h\n```\n\nDefining ν₀ = φ₀/h, emission occurs **only if ν ≥ ν₀**. If ν < ν₀, then a single photon simply does\nnot carry enough energy to liberate an electron — and since the process is one photon per electron,\nincreasing the **intensity** only supplies **more** such inadequate photons, never a more energetic\none. Hence **no emission occurs below ν₀, however intense the light**. This is the threshold\nfrequency.\n\n**(ii) Why K_max is independent of the intensity.**\n\n```\n      K_max = h ν − φ₀\n```\n\nThe right-hand side contains **only the frequency ν and the material constant φ₀** — the intensity\ndoes not appear.\n\nPhysically: the **intensity determines the number of photons arriving per second**, not the energy of\neach photon. Each electron absorbs exactly **one** photon, of energy hν. So increasing the intensity\nincreases the **number** of photoelectrons (and hence the photocurrent) but leaves the energy\navailable to each one — and therefore K_max — unchanged.\n\n### Q2 — stopping potential vs frequency graph\n\nFrom Einstein's equation, eV₀ = hν − φ₀, so\n\n```\n      V₀ = (h/e) ν − φ₀/e\n```\n\nwhich is a **straight line** in V₀ against ν.\n\n**Graph** (for two metals A and B with φ₀A < φ₀B):\n\n```\n   V₀ │                     ╱ A         ╱ B\n      │                   ╱           ╱\n      │                 ╱           ╱        (the two lines are PARALLEL)\n      │               ╱           ╱\n   ───┼─────────────●───────────●──────────────→ ν\n      │           ν₀A         ν₀B\n      │         ╱\n −φ₀/e│       ╱\n```\n\n**What the slope represents.** Comparing with y = mx + c, the slope is\n\n```\n      slope = h/e\n```\n\nthe ratio of **Planck's constant to the electronic charge**. Crucially, this is a combination of two\n**universal constants**, so the slope is the **same for every metal** — the two lines are parallel.\n(This is how Millikan first measured h accurately.)\n\n**How the work function is obtained.**\n\nTwo equivalent ways:\n1. From the **intercept on the V₀-axis**, which equals **−φ₀/e**. So φ₀ = e × (magnitude of the\n   y-intercept).\n2. From the **intercept on the ν-axis**, which is the threshold frequency ν₀, since V₀ = 0 there.\n   Then φ₀ = **h ν₀**.\n\nA metal with a **larger work function** has a **larger threshold frequency**, so its line is shifted\nto the **right** — which is the only difference between the two metals on this graph.\n\n### Q3 — photocurrent vs collector potential graphs\n\n**(i) Different intensities, at constant frequency:**\n\n```\n     I │                 ─────────── I₃\n       │               ╱\n       │           ─────────────── I₂\n       │         ╱   ╱\n       │     ──────────────── I₁\n       │   ╱   ╱   ╱\n   ────┴───────────────────────────→  V\n     −V₀      0\n       ↑\n   the SAME stopping potential for all three\n```\n\n**(ii) Different frequencies, at constant intensity:**\n\n```\n     I │            ──────────────── (all reach the SAME saturation current)\n       │        ╱  ╱  ╱\n       │      ╱  ╱  ╱\n       │    ╱  ╱  ╱\n   ────┴───┴──┴──┴────────────────→  V\n    −V₀₃ −V₀₂ −V₀₁  0\n                       ν₃ > ν₂ > ν₁\n```\n\n**The essential difference.**\n\n| | Different **intensities**, same ν | Different **frequencies**, same intensity |\n| --- | --- | --- |\n| Saturation current | **different** — larger for greater intensity | **the same** for all |\n| Stopping potential | **the same** for all | **different** — larger for higher frequency |\n\n**Why:** the **saturation current** measures the *number* of photoelectrons per second, which is set\nby the **number of photons per second**, i.e. by the **intensity**. The **stopping potential**\nmeasures K_max = hν − φ₀, which is set by the **frequency** alone.\n\nSo the first graph varies the number of photons (changing the current but not their energy), and the\nsecond varies the energy per photon (changing the maximum kinetic energy but not the number).\n\n### Q4 — three failures of the wave theory\n\n| Observation | Wave theory predicts | Photon theory explains |\n| --- | --- | --- |\n| **K_max is independent of intensity** | A more intense wave carries more energy per unit area, so electrons should emerge with **greater** kinetic energy | Intensity = number of photons per second; each electron absorbs **one** photon of energy hν, so K_max = hν − φ₀ does not involve the intensity |\n| **A threshold frequency exists** | A wave of **any** frequency should eventually eject electrons, if intense enough or applied long enough | A single photon of energy hν < φ₀ cannot liberate an electron at all, and since one electron absorbs one photon, more such photons do not help |\n| **Emission is instantaneous (< 10⁻⁹ s)** | An electron must **accumulate** energy from the spread-out wave; classical estimates give a time lag of hours for a dim source | The energy arrives in a **single concentrated packet** and is absorbed all at once, so emission is immediate |\n\n### Q5 — work function and threshold frequency\n\n**Work function (φ₀).** The **minimum energy** required to just liberate an electron from the surface\nof a metal, i.e. to bring it to the surface with zero kinetic energy. It is a **characteristic of the\nmetal** and is usually expressed in electron-volts.\n\n**Threshold frequency (ν₀).** The **minimum frequency** of incident radiation below which\nphotoelectric emission does **not** occur from a given metal, however great the intensity of the\nradiation.\n\n**Relation between them:**\n\n```\n      φ₀ = h ν₀                     (and equivalently φ₀ = h c/λ₀)\n```\n\n### Q6 — photoelectric numerical\n\n```\n      φ₀ = 2.14 eV          λ = 500 nm\n```\n\n**(i) Threshold wavelength.** Using hc = 1240 eV nm:\n\n```\n      λ₀ = h c/φ₀ = 1240/2.14 = 579 nm\n```\n\n**λ₀ ≈ 579 nm**\n\n*(Since the incident λ = 500 nm is **less** than λ₀ = 579 nm, the incident frequency exceeds the\nthreshold, so emission does occur ✓ — worth stating.)*\n\n**(ii) Maximum kinetic energy.**\n\nEnergy of an incident photon:\n\n```\n      E = h c/λ = 1240/500 = 2.48 eV\n```\n\n```\n      K_max = E − φ₀ = 2.48 − 2.14 = 0.34 eV\n```\n\n**K_max = 0.34 eV** (= 0.34 × 1.6 × 10⁻¹⁹ = 5.44 × 10⁻²⁰ J)\n\n**(iii) Stopping potential.**\n\n```\n      e V₀ = K_max\n⟹     V₀ = K_max/e = 0.34 eV/e = 0.34 V\n```\n\n**V₀ = 0.34 V**\n\n> Notice how the **hc = 1240 eV nm** shortcut makes this whole question three lines of arithmetic\n> with no powers of ten. And note that when K_max is expressed in **eV**, the stopping potential in\n> **volts** is numerically the same — because eV₀ = K_max.\n\n### Q7 — de Broglie wavelength of an accelerated electron\n\n```\n      V = 100 V\n```\n\nUsing the working formula:\n\n```\n      λ = 12.27/√V  Å\n        = 12.27/√100\n        = 12.27/10\n        = 1.227 Å\n```\n\n**λ = 1.227 Å = 1.227 × 10⁻¹⁰ m ≈ 0.123 nm**\n\n*(Full method, if the formula is not quoted:\np = √(2meV) = √(2 × 9.1 × 10⁻³¹ × 1.6 × 10⁻¹⁹ × 100) = √(2.912 × 10⁻⁴⁷) = 5.4 × 10⁻²⁴ kg m s⁻¹,\nso λ = h/p = (6.63 × 10⁻³⁴)/(5.4 × 10⁻²⁴) = 1.23 × 10⁻¹⁰ m ✓)*\n\n### Q8 — electron vs proton of the same kinetic energy\n\nFor a particle of mass m and kinetic energy K,\n\n```\n      p = √(2 m K)                  ⟹      λ = h/p = h/√(2 m K)\n```\n\nSo at the **same kinetic energy K**,\n\n```\n      λ ∝ 1/√m\n```\n\nThe electron's mass is far smaller than the proton's (m_p ≈ 1836 m_e), so\n\n```\n      λ_electron/λ_proton = √(m_p/m_e) = √1836 ≈ 43\n```\n\n**The electron has the greater de Broglie wavelength** — about 43 times greater — because for the\nsame kinetic energy the lighter particle has the smaller momentum, and λ is inversely proportional to\nmomentum.\n\n### Q9 — energy and momentum of a photon\n\n```\n      λ = 620 nm = 620 × 10⁻⁹ m\n```\n\n**Energy**, using hc = 1240 eV nm:\n\n```\n      E = hc/λ = 1240/620 = 2 eV = 2 × 1.6 × 10⁻¹⁹ = 3.2 × 10⁻¹⁹ J\n```\n\n**E = 2 eV = 3.2 × 10⁻¹⁹ J**\n\n**Momentum:**\n\n```\n      p = h/λ = (6.63 × 10⁻³⁴)/(620 × 10⁻⁹)\n        = (6.63 × 10⁻³⁴)/(6.2 × 10⁻⁷)\n        = 1.07 × 10⁻²⁷ kg m s⁻¹\n```\n\n**p ≈ 1.07 × 10⁻²⁷ kg m s⁻¹**\n\n*(Check with p = E/c = (3.2 × 10⁻¹⁹)/(3 × 10⁸) = 1.07 × 10⁻²⁷ ✓)*\n\n### Q10 — what the stopping potential depends on\n\nFrom eV₀ = hν − φ₀, the stopping potential depends on the **frequency** of the incident light and on\nthe work function of the metal — not on the intensity, the distance of the source, or the geometry.\n\n**Answer: (b) the frequency of the incident light**\n\n### Q11 — case study: the V₀–ν graph\n\n```\n      slope = 4.14 × 10⁻¹⁵ V s          ν-intercept = 5 × 10¹⁴ Hz\n```\n\n**(i) What the slope gives.** From V₀ = (h/e)ν − φ₀/e, the slope is **h/e** — the ratio of Planck's\nconstant to the electronic charge.\n\n**(ii) Planck's constant:**\n\n```\n      h/e = 4.14 × 10⁻¹⁵\n⟹     h = (4.14 × 10⁻¹⁵)(1.6 × 10⁻¹⁹)\n        = 6.62 × 10⁻³⁴ J s\n```\n\n**h ≈ 6.6 × 10⁻³⁴ J s** — in good agreement with the accepted value.\n\n**(iii) Work function.** The ν-intercept is the threshold frequency ν₀ = 5 × 10¹⁴ Hz, so\n\n```\n      φ₀ = h ν₀ = (6.62 × 10⁻³⁴)(5 × 10¹⁴) = 3.31 × 10⁻¹⁹ J\n```\n\nIn electron-volts:\n\n```\n      φ₀ = (3.31 × 10⁻¹⁹)/(1.6 × 10⁻¹⁹) = 2.07 eV\n```\n\n**φ₀ ≈ 2.07 eV**\n\n*(Faster route: φ₀/e = (h/e) × ν₀ = (4.14 × 10⁻¹⁵)(5 × 10¹⁴) = 2.07 V, so φ₀ = 2.07 eV directly.)*\n\n**(iv) Would the slope change for a different metal?**\n\n**No.** The slope is **h/e**, a combination of two **universal constants**, and contains nothing\nspecific to the metal. So the graph for any other metal is a **parallel** straight line.\n\nWhat *does* change is the **intercept**: a different metal has a different work function, hence a\ndifferent threshold frequency ν₀ = φ₀/h, so its line is shifted horizontally. A metal with a larger\nwork function has its line shifted further to the right.\n\n### Q12 — why photons are not deflected by fields\n\nThe force on a particle in electric and magnetic fields is\n\n```\n      F = q(E + v × B)\n```\n\nwhich is **proportional to the charge q**.\n\nA photon is **electrically neutral** — it carries **zero charge**. Therefore the force exerted on it\nby any electric or magnetic field is **zero**, and it travels through such fields undeviated.\n\n*(This is a standard way of distinguishing gamma rays from beta and alpha radiation: only the gamma\nrays, being photons, pass through a magnetic field undeflected.)*\n\n### Q13 — Assertion–Reason\n\n**A:** \"No photoelectrons are emitted below the threshold frequency, however intense the light.\"\n**True** — this is one of the four experimental laws.\n\n**R:** \"Photoemission is a one-photon–one-electron process, and a single photon of energy less than\nthe work function cannot liberate an electron.\" **True.**\n\n**Does R explain A?** **Yes** — and precisely. Because each electron absorbs exactly one photon,\nincreasing the intensity increases only the **number** of photons, not the energy of any one of them.\nIf hν < φ₀, then no single photon has enough energy, and no number of them will do.\n\n**Answer: (a) Both A and R are true, and R is the correct explanation of A.**\n\n---","test":"Time: 40 minutes. Answers below.\n\n1. *(1)* The momentum of a photon of wavelength λ is\n   (a) h/λ (b) hλ (c) hc/λ (d) λ/h\n2. *(1)* The maximum kinetic energy of photoelectrons depends on\n   (a) intensity (b) frequency (c) the area of the cathode (d) the distance of the source\n3. *(1)* The de Broglie wavelength of a particle of mass m moving with speed v is\n   (a) h/mv (b) mv/h (c) hmv (d) h/v\n4. *(2)* Define stopping potential. How is it related to the maximum kinetic energy of the\n   photoelectrons?\n5. *(2)* The work function of caesium is 2.14 eV. Find its threshold wavelength.\n6. *(2)* Find the energy in eV of a photon of wavelength 400 nm.\n7. *(2)* An electron is accelerated through 400 V. Find its de Broglie wavelength.\n8. *(3)* Light of frequency 8 × 10¹⁴ Hz is incident on a metal of work function 2 eV. Find the maximum\n   kinetic energy of the photoelectrons and the stopping potential.\n9. *(3)* State the four laws of photoelectric emission.\n10. *(3)* Draw the graph of stopping potential against frequency for two metals of different work\n    functions, and state two things that can be found from it.\n11. *(2)* Why is the wave nature of matter not apparent in our everyday observations?\n12. *(2)* A proton and an alpha particle are accelerated through the same potential difference. Find\n    the ratio of their de Broglie wavelengths.\n13. *(2)* If the intensity of the incident light is doubled while the frequency is unchanged, what\n    happens to (i) the saturation current and (ii) the stopping potential?\n\n### Answer key\n\n**1. (a) h/λ.**\n\n**2. (b) frequency.**\n\n**3. (a) h/mv.**\n\n**4.** The **stopping potential** is the minimum negative potential applied to the collector at which\nthe photoelectric current becomes **zero** — i.e. at which even the fastest photoelectrons are just\nturned back. It is related to the maximum kinetic energy by **eV₀ = K_max**.\n\n**5. 579 nm.** λ₀ = hc/φ₀ = 1240/2.14 = 579 nm.\n\n**6. 3.1 eV.** E = hc/λ = 1240/400 = 3.1 eV.\n\n**7. 0.613 Å.** λ = 12.27/√400 = 12.27/20 = 0.613 Å = 6.13 × 10⁻¹¹ m.\n\n**8. K_max = 1.31 eV; V₀ = 1.31 V.**\nE = hν = (6.63 × 10⁻³⁴)(8 × 10¹⁴) = 5.30 × 10⁻¹⁹ J = 5.30 × 10⁻¹⁹/1.6 × 10⁻¹⁹ = 3.31 eV.\nK_max = 3.31 − 2 = 1.31 eV. V₀ = 1.31 V.\n\n**9.** (i) For a fixed frequency above threshold, the photocurrent is **proportional to the\nintensity**. (ii) The **maximum kinetic energy** of the photoelectrons depends only on the\n**frequency** and the metal, and is independent of the intensity. (iii) For each metal there is a\n**threshold frequency** below which no emission occurs, whatever the intensity. (iv) Emission is\n**instantaneous** (< 10⁻⁹ s).\n\n**10.** Graph as in §4 Q2 — two **parallel** straight lines with different ν-intercepts. From it one\ncan find: (i) **Planck's constant**, from the slope h/e; (ii) the **threshold frequency** of each\nmetal, from its ν-intercept — and hence its **work function**, φ₀ = hν₀ (or from the magnitude of the\nV₀-intercept, φ₀/e).\n\n**11.** The de Broglie wavelength λ = h/mv is inversely proportional to the mass. For everyday\nobjects the mass is enormous compared with atomic scales — a 100 g ball moving at 10 m s⁻¹ has\nλ = (6.63 × 10⁻³⁴)/(0.1 × 10) ≈ **6.6 × 10⁻³⁴ m**. This is unimaginably smaller than any aperture or\nobstacle available, so no diffraction or interference can be observed and the wave nature is\ncompletely undetectable. Wave behaviour becomes apparent only for particles of very small mass, such\nas electrons.\n\n**12. λ_p/λ_α = 2√2 : 1.** For acceleration through the same V, λ = h/√(2mqV), so λ ∝ 1/√(mq).\nFor a proton, m = m, q = e. For an alpha particle, m = 4m, q = 2e.\nλ_p/λ_α = √(4m × 2e)/√(m × e) = √8 = **2√2 ≈ 2.83**.\n\n**13.** (i) The **saturation current doubles**, since twice as many photons arrive per second and hence\ntwice as many photoelectrons are emitted per second. (ii) The **stopping potential is unchanged**,\nbecause eV₀ = hν − φ₀ depends only on the frequency, which has not changed.\n\n**Scoring.** Out of 26. Below 18 → the gap is almost certainly the three graphs. Draw all three from\nmemory, labelled, and state what the slope and intercepts of the third one mean.\n\n---","tips":"**On Einstein's equation**\n\n1. **Always write hν = φ₀ + K_max first**, then rearrange to whatever the question needs. Do not\n   start from K_max = h(ν − ν₀).\n\n2. **When explaining a law, quote the equation and point to the missing variable.** \"K_max = hν − φ₀\n   contains no intensity term\" is the mark for the independence-of-intensity question.\n\n3. **Say \"one photon, one electron\".** That phrase carries the whole conceptual content, and it is\n   what makes the threshold-frequency argument work.\n\n**On the graphs**\n\n4. **Label both axes with quantity and unit**, mark the stopping potential(s) on the negative\n   V-axis, and label which curve corresponds to which intensity or frequency. Unlabelled graphs score\n   little.\n\n5. **For the intensity graph: different saturation currents, same stopping potential.** For the\n   frequency graph: **same** saturation current, **different** stopping potentials. Get these the\n   right way round — it is exactly what is being tested.\n\n6. **For the V₀–ν graph, state all three readings:** slope = h/e (universal, so lines for different\n   metals are parallel), ν-intercept = ν₀, V₀-intercept = −φ₀/e. Three facts, and each can be a mark.\n\n7. **Draw two parallel lines when two metals are asked for.** Non-parallel lines contradict the\n   physics and lose the mark.\n\n**On numericals**\n\n8. **Use hc = 1240 eV nm.** It turns E = hc/λ into a division: 1240/λ(nm) gives the energy directly\n   in eV. This single shortcut removes most of the arithmetic in this chapter.\n\n9. **Use λ = 12.27/√V Å for accelerated electrons.** Quote it, then substitute. If the question asks\n   you to derive it, show p = √(2meV) and then λ = h/p.\n\n10. **When K_max is in eV, V₀ in volts is numerically the same.** So \"K_max = 0.34 eV\" immediately\n    gives \"V₀ = 0.34 V\" — say why (eV₀ = K_max), and you get both marks in one line.\n\n11. **Check whether emission occurs at all.** If the incident wavelength exceeds λ₀ (or the frequency\n    is below ν₀), the answer is \"no photoelectrons are emitted\", and any calculated \"negative kinetic\n    energy\" is a sign you have missed this. CBSE sets such questions deliberately.\n\n12. **For comparison questions (electron vs proton, proton vs alpha), reduce to a proportionality\n    first.** λ ∝ 1/√(mK) for equal energies, λ ∝ 1/√(mq) for equal accelerating voltages. Then\n    substitute the ratios. Much faster and less error-prone than computing both wavelengths.\n\n13. **Units:** eV or J for energy, V for stopping potential, Å or nm or m for wavelength,\n    kg m s⁻¹ for momentum, Hz for frequency."}},{"id":"p12","subj":"physics","num":12,"title":"Atoms","unit":"Units VII+VIII · Modern Physics","unitMarks":12,"prio":1,"appear":"Units VII + VIII (12 marks, shared with Ch 11 and Ch 13) · Typical appearance: 1 MCQ + a 2/3-mark question on Bohr's postulates or the energy levels. Two memorised numbers do most of the work.","deleted":"- **de Broglie's explanation of Bohr's second postulate** (the standing-wave justification of\n  angular-momentum quantisation)\n\n> **On \"qualitative treatment only\" for the spectra.** Know the **names and regions** of the series\n> (Lyman, Balmer, Paschen…) and which transitions produce them; the Rydberg formula is given below\n> and is still useful for numericals, but the marks are concentrated in the energy-level picture\n> rather than in wavelength arithmetic.","recall":"```\nRUTHERFORD SCATTERING\n  observations: most pass through ; a few small deflections ; very few large (>90°)\n  conclusions : atom mostly EMPTY ; small dense positive NUCLEUS ; nucleus ~10⁻¹⁵ m\n                against atomic size ~10⁻¹⁰ m ; nearly all mass in the nucleus\n  impact parameter b: smaller b → larger scattering angle ; b = 0 → 180°\n  distance of closest approach: ½mv² = (1/4πε₀)(2e)(Ze)/r₀\n\nRUTHERFORD FAILS: (1) an accelerating electron must radiate → atom would collapse in\n                      ~10⁻⁸ s ; (2) it predicts a CONTINUOUS spectrum, not LINE spectra\n\nBOHR'S POSTULATES\n  1. stationary orbits — the electron revolves without radiating\n  2. angular momentum quantised : m v r = n h/2π\n  3. radiation only on a jump : hν = E_i − E_f\n\n  r_n = n²h²ε₀/(πmZe²)         →  hydrogen: r_n = 0.53 n² Å        r ∝ n²\n  v_n = Ze²/(2ε₀nh)                                                 v ∝ 1/n\n  E_n = −mZ²e⁴/(8ε₀²n²h²)      →  hydrogen: E_n = −13.6/n² eV\n  K = −E ;  U = 2E = −2K\n\n  ground state n=1 : E = −13.6 eV\n  ionisation energy = 13.6 eV ;  first excitation energy = 10.2 eV\n\nSERIES : Lyman (n_f=1, UV) | BALMER (n_f=2, VISIBLE) | Paschen (n_f=3, IR)\n         Brackett (4) | Pfund (5)\n  1/λ = R(1/n_f² − 1/n_i²) ,  R = 1.097 × 10⁷ m⁻¹\n  longest λ in a series: n_i = n_f + 1 ;  shortest (series limit): n_i = ∞\n  number of lines from level n = n(n−1)/2\n\nBOHR FAILS for: multi-electron atoms, line intensities, fine structure,\n                Zeeman/Stark effects; and the quantisation is unjustified\n```","s":{"scope":"### In the syllabus\n\n- **Alpha-particle scattering experiment**; **Rutherford's model** of the atom\n- **Bohr model** of the hydrogen atom; expressions for the **radius** of the nᵗʰ orbit, and the\n  **velocity** and **energy** of the electron in the nᵗʰ orbit\n- **Hydrogen line spectra** — the syllabus notes *\"qualitative treatment only\"*\n\n### Deleted — do not study\n\n- **de Broglie's explanation of Bohr's second postulate** (the standing-wave justification of\n  angular-momentum quantisation)\n\n> **On \"qualitative treatment only\" for the spectra.** Know the **names and regions** of the series\n> (Lyman, Balmer, Paschen…) and which transitions produce them; the Rydberg formula is given below\n> and is still useful for numericals, but the marks are concentrated in the energy-level picture\n> rather than in wavelength arithmetic.\n\n---","brief":"### Rutherford's alpha-particle scattering experiment\n\n*Set-up:* a radioactive source emitting alpha particles, a narrow collimating slit, a **thin gold\nfoil** (about 10⁻⁷ m thick), and a rotatable zinc-sulphide screen with a microscope to count the\nscattered particles at various angles.\n\n**The observations:**\n\n1. **Most** alpha particles passed **straight through** the foil, essentially undeviated.\n2. A **small fraction** were deflected through **small** angles.\n3. A **very few** — about 1 in 8000 — were deflected through **large** angles, and some were turned\n   back through more than 90°.\n\n**The conclusions:**\n\n1. Since most particles passed undeviated, **the atom is mostly empty space**.\n2. Since a few were deflected through very large angles, there must be a **concentrated centre of\n   positive charge and mass** — the **nucleus** — capable of exerting a large repulsive Coulomb force.\n3. Since only a **very few** were strongly deflected, the nucleus must be **extremely small** compared\n   with the atom. (Rutherford estimated the nucleus at ~10⁻¹⁵ m against an atomic size of ~10⁻¹⁰ m —\n   the nucleus occupies about 10⁻¹⁵ of the atom's volume.)\n4. Essentially **all the mass** of the atom is concentrated in the nucleus, with the electrons\n   revolving around it.\n\n**Rutherford's model.** A tiny, dense, positively charged nucleus at the centre, with electrons\nrevolving around it in circular orbits, the necessary centripetal force being provided by the\nelectrostatic attraction:\n\n```\n      m v²/r = (1/4πε₀) · Z e²/r²\n```\n\n**Impact parameter (b).** The perpendicular distance of the initial velocity vector of the alpha\nparticle from the centre of the nucleus. **A smaller impact parameter gives a larger scattering\nangle**; a head-on collision (b = 0) gives 180° back-scattering.\n\n**Distance of closest approach (r₀).** For a head-on approach, the alpha particle stops when all its\nkinetic energy has been converted into electrostatic potential energy:\n\n```\n      ½ m v² = (1/4πε₀) · (2e)(Ze)/r₀\n⟹     r₀ = (1/4πε₀) · 2 Z e²/( ½ m v² )  =  (1/4πε₀) · 4 Z e²/(m v²)\n```\n\n**Two failures of Rutherford's model** — the reason Bohr was needed:\n\n1. **Stability.** An electron moving in a circle is **accelerating** (centripetally), and classical\n   electromagnetism says an accelerating charge must **radiate** energy continuously. Losing energy,\n   the electron would spiral inward and fall into the nucleus in about 10⁻⁸ s. **Atoms would not be\n   stable** — but they are.\n\n2. **Spectra.** As the electron spiralled in, its frequency of revolution would change continuously,\n   so it would emit a **continuous spectrum**. But atoms are observed to emit **sharp line spectra**\n   at definite discrete wavelengths.\n\n### Bohr's postulates\n\n**Postulate 1 — stationary orbits.** An electron in an atom can revolve in certain **stable circular\norbits**, called **stationary states**, **without radiating energy**, even though it is accelerating.\nThe necessary centripetal force is provided by the electrostatic attraction of the nucleus.\n\n**Postulate 2 — quantisation of angular momentum.** Only those orbits are permitted for which the\nangular momentum is an **integral multiple of h/2π**:\n\n```\n      m v r = n h/(2π)                      n = 1, 2, 3, …\n```\n\nn is the **principal quantum number**.\n\n**Postulate 3 — frequency condition.** An electron radiates or absorbs energy **only when it jumps\nfrom one stationary orbit to another**. The energy of the emitted or absorbed photon equals the\ndifference between the two energy levels:\n\n```\n      h ν = E_i − E_f\n```\n\n### Radius, velocity and energy of the nᵗʰ orbit\n\n**Setting up.** For a hydrogen-like atom of nuclear charge Ze, the Coulomb attraction provides the\ncentripetal force:\n\n```\n      m v²/r = (1/4πε₀) · Z e²/r²                    …(i)\n```\n\nand Bohr's second postulate gives\n\n```\n      m v r = n h/(2π)                               …(ii)\n```\n\n**Radius.** From (ii), v = nh/(2πmr). Substituting into (i):\n\n```\n      m/r · [ n h/(2π m r) ]² = (1/4πε₀) Z e²/r²\n⟹     n² h²/(4π² m r) = Z e²/(4πε₀)\n```\n\n```\n      r_n = n² h² ε₀ / (π m Z e²)\n```\n\nFor **hydrogen (Z = 1)**, substituting the constants:\n\n```\n      r_n = 0.53 n²  Å  =  0.53 n² × 10⁻¹⁰ m\n```\n\nSo **r ∝ n²**, and the first Bohr orbit (n = 1) has radius **0.53 Å** — the **Bohr radius**.\n\n**Velocity.** From (ii), v_n = nh/(2πmr_n), and substituting r_n:\n\n```\n      v_n = Z e²/(2 ε₀ n h)\n```\n\nSo **v ∝ 1/n** — the electron moves **more slowly in higher orbits**. For hydrogen, v₁ = c/137 (about\n2.2 × 10⁶ m s⁻¹).\n\n**Energy.** The kinetic energy is, from (i),\n\n```\n      K = ½ m v² = (1/2) · Z e²/(4πε₀ r)\n```\n\nand the potential energy is\n\n```\n      U = − Z e²/(4πε₀ r)  =  − 2K\n```\n\nso the total energy is\n\n```\n      E = K + U = K − 2K = −K = − Z e²/(8πε₀ r)\n```\n\nSubstituting r_n:\n\n```\n      E_n = − m Z² e⁴/(8 ε₀² n² h²)\n```\n\nFor **hydrogen (Z = 1)**, evaluating the constants:\n\n```\n      E_n = − 13.6/n²  eV\n```\n\n> **Memorise these two results and most of the chapter follows:**\n>\n> ```\n>       r_n = 0.53 n²  Å                E_n = − 13.6/n²  eV\n> ```\n\n**The energy relations worth noting:**\n\n```\n      K = −E = + 13.6/n²  eV                U = 2E = − 27.2/n²  eV                U = −2K\n```\n\n**The negative sign of E** means the electron is **bound** to the nucleus. Energy must be *supplied*\nto remove it.\n\n### Energy level diagram for hydrogen\n\n```\n      E (eV)\n        0  ────────────────────────  n = ∞    (ionised, free electron)\n     −0.54 ────────────────────────  n = 5\n     −0.85 ────────────────────────  n = 4\n     −1.51 ────────────────────────  n = 3\n                                              ↑ Paschen (to n=3, infrared)\n     −3.40 ────────────────────────  n = 2\n                                              ↑ Balmer (to n=2, VISIBLE)\n     −13.6 ────────────────────────  n = 1    (ground state)\n                                              ↑ Lyman (to n=1, ultraviolet)\n```\n\n- **Ground state:** n = 1, E = −13.6 eV.\n- **Excited states:** n = 2, 3, 4, …\n- The levels get **closer together** as n increases, converging on E = 0 at n = ∞.\n- **Ionisation energy** of hydrogen = the energy needed to take the electron from n = 1 to n = ∞:\n\n```\n      = 0 − (−13.6) = 13.6 eV\n```\n\n- **First excitation energy** = E₂ − E₁ = −3.4 − (−13.6) = **10.2 eV**.\n\n### Hydrogen spectral series\n\nWhen an electron falls from a higher level n_i to a lower level n_f, a photon is emitted of energy\n\n```\n      h ν = E_i − E_f = 13.6 ( 1/n_f² − 1/n_i² )  eV\n```\n\nand wavelength given by the **Rydberg formula**:\n\n```\n      1/λ = R ( 1/n_f² − 1/n_i² )                     R = 1.097 × 10⁷ m⁻¹\n```\n\n| Series | n_f | n_i | Spectral region |\n| --- | --- | --- | --- |\n| **Lyman** | 1 | 2, 3, 4, … | **ultraviolet** |\n| **Balmer** | 2 | 3, 4, 5, … | **visible** |\n| **Paschen** | 3 | 4, 5, 6, … | infrared |\n| **Brackett** | 4 | 5, 6, 7, … | infrared |\n| **Pfund** | 5 | 6, 7, 8, … | far infrared |\n\n**Within each series:** the transition from n_f + 1 gives the **longest** wavelength of that series\n(smallest energy jump), and the transition from n_i = ∞ gives the **shortest** (the series limit).\n\n> **The Balmer series is the visible one** — the only series that can be seen by eye, and hence the\n> first to be discovered. That fact is asked directly.\n\n**Number of spectral lines** possible when an atom is excited to level n and then de-excites:\n\n```\n      number of lines = n(n − 1)/2\n```\n\n### Limitations of Bohr's model\n\n1. It applies only to **hydrogen and hydrogen-like (single-electron) atoms** — it fails for atoms\n   with two or more electrons, because it takes no account of electron–electron interactions.\n2. It cannot explain the **relative intensities** of the spectral lines.\n3. It cannot explain the **fine structure** of spectral lines (the splitting into closely spaced\n   components).\n4. It provides **no justification** for the quantisation condition mvr = nh/2π — the postulate is\n   simply asserted.\n5. It cannot explain the **Zeeman and Stark effects** (splitting of lines in magnetic and electric\n   fields).\n6. It treats the electron as a **particle in a definite orbit**, which conflicts with the\n   uncertainty principle.\n\n### Quick recall box\n\n```\nRUTHERFORD SCATTERING\n  observations: most pass through ; a few small deflections ; very few large (>90°)\n  conclusions : atom mostly EMPTY ; small dense positive NUCLEUS ; nucleus ~10⁻¹⁵ m\n                against atomic size ~10⁻¹⁰ m ; nearly all mass in the nucleus\n  impact parameter b: smaller b → larger scattering angle ; b = 0 → 180°\n  distance of closest approach: ½mv² = (1/4πε₀)(2e)(Ze)/r₀\n\nRUTHERFORD FAILS: (1) an accelerating electron must radiate → atom would collapse in\n                      ~10⁻⁸ s ; (2) it predicts a CONTINUOUS spectrum, not LINE spectra\n\nBOHR'S POSTULATES\n  1. stationary orbits — the electron revolves without radiating\n  2. angular momentum quantised : m v r = n h/2π\n  3. radiation only on a jump : hν = E_i − E_f\n\n  r_n = n²h²ε₀/(πmZe²)         →  hydrogen: r_n = 0.53 n² Å        r ∝ n²\n  v_n = Ze²/(2ε₀nh)                                                 v ∝ 1/n\n  E_n = −mZ²e⁴/(8ε₀²n²h²)      →  hydrogen: E_n = −13.6/n² eV\n  K = −E ;  U = 2E = −2K\n\n  ground state n=1 : E = −13.6 eV\n  ionisation energy = 13.6 eV ;  first excitation energy = 10.2 eV\n\nSERIES : Lyman (n_f=1, UV) | BALMER (n_f=2, VISIBLE) | Paschen (n_f=3, IR)\n         Brackett (4) | Pfund (5)\n  1/λ = R(1/n_f² − 1/n_i²) ,  R = 1.097 × 10⁷ m⁻¹\n  longest λ in a series: n_i = n_f + 1 ;  shortest (series limit): n_i = ∞\n  number of lines from level n = n(n−1)/2\n\nBOHR FAILS for: multi-electron atoms, line intensities, fine structure,\n                Zeeman/Stark effects; and the quantisation is unjustified\n```\n\n---","pyq":"**Q1.** *(5 marks)* State Bohr's postulates. Using them, derive an expression for the radius of the\nnᵗʰ orbit of the electron in a hydrogen atom, and hence for its total energy.\n\n**Q2.** *(3 marks)* Describe Rutherford's alpha-particle scattering experiment. State two conclusions\ndrawn from it.\n\n**Q3.** *(3 marks)* State two drawbacks of Rutherford's atomic model, and explain how Bohr's model\novercame them.\n\n**Q4.** *(3 marks)* Draw the energy level diagram of a hydrogen atom, and mark the transitions\ncorresponding to the Lyman and Balmer series. Which series lies in the visible region?\n\n**Q5.** *(2 marks)* Find the radius and the energy of the electron in the third orbit of a hydrogen\natom.\n\n**Q6.** *(2 marks)* Calculate the wavelength of the H_α line of the Balmer series\n(the transition n = 3 → n = 2). Take R = 1.097 × 10⁷ m⁻¹.\n\n**Q7.** *(2 marks)* Find the ionisation energy and the first excitation energy of a hydrogen atom.\n\n**Q8.** *(2 marks)* The total energy of an electron in the first excited state of hydrogen is −3.4 eV.\nFind its kinetic and potential energies in that state.\n\n**Q9.** *(3 marks)* State three limitations of Bohr's model of the atom.\n\n**Q10.** *(2 marks)* How many spectral lines are possible when hydrogen atoms are excited to the\nn = 4 level?\n\n**Q11.** *(1 mark, MCQ)* The radius of the nᵗʰ Bohr orbit is proportional to\n(a) n (b) n² (c) 1/n (d) 1/n²\n\n**Q12.** *(4 marks, case study)* A hydrogen atom in its ground state absorbs a photon and is excited\nto the n = 3 level.\n(i) Find the energy of the absorbed photon.\n(ii) Find the wavelength of that photon.\n(iii) How many spectral lines can be emitted as the atom returns to the ground state?\n(iv) Which of the emitted lines has the longest wavelength?\n\n**Q13.** *(2 marks)* Why does the electron in the ground state of a hydrogen atom not fall into the\nnucleus, according to Bohr's model?\n\n---","sol":"### Q1 — Bohr's postulates, and the radius and energy of the nᵗʰ orbit\n\n**Bohr's postulates.**\n\n1. **Stationary orbits.** An electron in an atom revolves in certain **stable circular orbits**,\n   called **stationary states**, **without radiating energy**. The centripetal force required is\n   provided by the electrostatic attraction between the
