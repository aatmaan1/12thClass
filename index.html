al agitation, so the net moment is normally zero. An applied field **partially aligns** them\nwith itself, giving a net moment **along** the field, so the substance is pulled towards the\n**stronger** part of the field — it is **attracted**.\n\n**9.** ∮**B**·d**A** = 0: the net magnetic flux through any closed surface is zero. It implies that\n**isolated magnetic poles do not exist** — magnetic field lines are closed, so every line entering a\nclosed surface also leaves it.\n\n**10. 0.6 × 10⁻⁴ T.** B = B_H/cos δ = (0.3 × 10⁻⁴)/cos 60° = (0.3 × 10⁻⁴)/0.5 = 0.6 × 10⁻⁴ T.\n\n**11. m/3 each.** Cutting perpendicular to the length leaves the cross-sectional area (and hence the\npole strength q_m) unchanged, but divides the length by 3. Since m = q_m × length, each piece has\nmoment **m/3**. Each is a complete magnet with both poles.\n\n**Scoring.** Out of 20. Below 14 → the only things worth going back for are the Earth's-magnetism\nrelations and the three-material table. That is genuinely all this chapter owes you.\n\n---","tips":"1. **Do not over-invest in this chapter.** It carries roughly 1–3 marks. Learn the Earth's-magnetism\n   triangle, the material table, and the field-line properties, and put the rest of your time into\n   [Ch 9 Ray Optics](09-ray-optics-and-optical-instruments.md) and\n   [Ch 14](14-semiconductor-electronics.md), which carry 17 marks between them.\n\n2. **For Earth's magnetism, draw the right triangle.** B as the hypotenuse, B_H horizontal, B_V\n   vertical, angle δ between B and B_H. Every question here is one trigonometric step from that\n   triangle, and drawing it prevents mixing up sin and cos.\n\n3. **Use B_V = B_H tan δ when both B_H and δ are given** — it is one step rather than two.\n\n4. **For \"distinguish between\" questions, use a table** and compare the **same** property on each\n   row. Three parallel rows plus one example each is a full 3-mark answer. Comparing different\n   attributes on the two sides scores badly.\n\n5. **Always give examples** when asked to distinguish materials — bismuth/copper for diamagnetic,\n   aluminium/sodium for paramagnetic, iron/cobalt/nickel for ferromagnetic. The examples are worth a\n   mark.\n\n6. **For the bar-magnet-as-solenoid question, the diagram is the answer.** Draw both field patterns\n   side by side and label the effective poles of the solenoid.\n\n7. **On cutting a magnet, say what happens to the pole strength and what happens to the length**\n   separately, then combine. And always add the sentence \"each piece is a complete magnet with both\n   poles\" — it is the conceptual mark.\n\n8. **When contrasting with electrostatics, name the contrast explicitly:** closed loops vs\n   start-and-end on charges, and ∮**B**·d**A** = 0 vs ∮**E**·d**A** = q/ε₀. Those two pairings answer\n   most comparison questions in this chapter.\n\n9. **Do not use χ, μ_r, M or H in your answers.** They are out of syllabus, and an answer framed in\n   terms of them may not match the marking scheme even if it is physically correct."}},{"id":"p6","subj":"physics","num":6,"title":"Electromagnetic Induction","unit":"Units III+IV · Magnetism, EMI & AC","unitMarks":17,"prio":1,"appear":"Units III + IV (17 marks, shared with Ch 4, 5, 7) · Typical appearance: 1–2 MCQs + a 2/3-mark Lenz's-law or inductance question, and often a 5-marker on the AC generator or self/mutual inductance.","deleted":"Nothing substantial was removed from this chapter.","recall":"```\nFLUX : φ = BA cos θ (weber) ;  flux linkage = Nφ\nFARADAY : ε = −N dφ/dt ;  I = ε/R ;  charge q = NΔφ/R  (independent of the time taken)\n\nLENZ : the induced current OPPOSES the change in flux\n  — the minus sign in Faraday's law\n  — a consequence of CONSERVATION OF ENERGY\n\nMOTIONAL EMF : ε = Blv\n  I = Blv/R ;  F = B²l²v/R ;  P_mech = P_elec = B²l²v²/R\n\nEDDY CURRENTS : induced loops in the bulk of a conductor\n  minimised by LAMINATED cores\n  uses: electromagnetic braking, induction furnace, induction motor, energy meters\n\nSELF-INDUCTANCE : φ = LI ;  ε = −L dI/dt ;  unit HENRY\n  solenoid : L = μ₀n²Al = μ₀N²A/l\n  energy   : U = ½LI²\n\nMUTUAL INDUCTANCE : φ₂ = MI₁ ;  ε₂ = −M dI₁/dt ;  M₁₂ = M₂₁\n  two coaxial solenoids : M = μ₀n₁n₂Al = μ₀N₁N₂A/l\n  M = k√(L₁L₂) ;  max when coaxial and close, ZERO when axes are perpendicular\n\nAC GENERATOR : ε = NBAω sin ωt = ε₀ sin ωt ;  ε₀ = NBAω\n  max emf when the coil's PLANE is PARALLEL to B ;  zero when perpendicular\n  slip rings (not a commutator) → alternating output\n```","s":{"scope":"### In the syllabus\n\n- **Electromagnetic induction**\n- **Faraday's laws**; induced emf and current\n- **Lenz's law**; **eddy currents**\n- **Self and mutual induction**\n- **AC generator** — *(the CBSE syllabus lists this under Chapter 7, while NCERT places it in\n  Chapter 6. It is the same unit either way; it is covered here because the physics is Faraday's\n  law.)*\n\n### Deleted\n\nNothing substantial was removed from this chapter.\n\n---","brief":"### Magnetic flux\n\n```\n      φ = B · A = B A cos θ\n```\n\nθ is the angle between **B** and the **area vector** (the normal to the surface).\n\nSI unit: **weber (Wb)** = T m². For a coil of N turns, the **flux linkage** is Nφ.\n\nFlux is a **scalar**. It changes if B changes, if A changes, or if the orientation θ changes — and\n**all three** are used to set questions.\n\n### Faraday's laws of electromagnetic induction\n\n**First law.** Whenever the magnetic flux linked with a closed circuit changes, an **emf is induced**\nin the circuit. The emf lasts only as long as the change continues.\n\n**Second law.** The magnitude of the induced emf is equal to the **rate of change** of magnetic flux\nlinked with the circuit.\n\n```\n      ε = − dφ/dt                   and for N turns:      ε = − N dφ/dt\n```\n\n**Induced current** (if the circuit is closed, of total resistance R):\n\n```\n      I = ε/R = −(N/R) dφ/dt\n```\n\n**Charge** that flows in time Δt:\n\n```\n      q = ∫I dt = NΔφ/R\n```\n\n— note that the charge depends only on the **total change in flux**, not on how fast it happened.\nThat is a favourite MCQ.\n\n### Lenz's law\n\n**Statement.** The direction of the induced emf (and hence of the induced current) is such that it\n**opposes the change** in magnetic flux that produced it.\n\nThat is the meaning of the **minus sign** in Faraday's law.\n\n**Lenz's law is a consequence of the conservation of energy.** If the induced current *aided* the\nchange instead of opposing it, the change would grow without limit and produce energy from nothing —\na perpetual-motion machine. So work must be done against the opposing force, and it is this\nmechanical work that appears as the electrical energy of the induced current.\n\n**Applying it — the standard cases:**\n\n| Situation | Induced current direction | Reason |\n| --- | --- | --- |\n| N pole of a magnet approaching a coil | such that the near face becomes a **north** pole | to **repel** the approaching magnet |\n| N pole of a magnet receding from a coil | such that the near face becomes a **south** pole | to **attract** and oppose the receding |\n| Coil moving into a field region | opposes the **increase** in flux | |\n| Coil moving out of a field region | opposes the **decrease** in flux | |\n| A magnet falling through a metal ring | opposes the motion | the magnet falls **slower** than free fall |\n\n> **In an exam, always give the reason, not just the direction.** \"The induced current flows\n> anticlockwise so that the face towards the magnet becomes a north pole, repelling the approaching\n> north pole and thereby opposing the increase in flux.\" That sentence is the mark.\n\n### Motional emf\n\n*Set-up:* a conducting rod of length l slides with velocity v along two parallel rails, in a uniform\nfield B perpendicular to the plane of the rails.\n\n**Derivation.** Let the rod be at distance x from the closed end. The area of the circuit is lx, so\nthe flux is\n\n```\n      φ = B l x\n```\n\nAs the rod moves, x changes, so\n\n```\n      ε = −dφ/dt = −B l (dx/dt) = −B l v\n```\n\n**Magnitude:**\n\n```\n      ε = B l v\n```\n\n**Alternative derivation (via the Lorentz force).** Each free charge q in the rod moves with the rod\nat velocity v, and so experiences a magnetic force qvB along the rod. The work done per unit charge\nin moving it along the length l is therefore\n\n```\n      ε = (force per unit charge) × (length) = (vB)(l) = Blv\n```\n\n**Associated quantities** (often asked as follow-up parts):\n\n```\n      Induced current      I = Blv/R\n      Force needed to keep the rod moving at constant v:   F = BIl = B²l²v/R\n      Mechanical power supplied:   P = Fv = B²l²v²/R\n      Electrical power dissipated: P = I²R = B²l²v²/R           — the two are EQUAL\n```\n\nThe equality of mechanical input and electrical output is a nice demonstration of energy\nconservation, and it is asked.\n\n### Eddy currents\n\nWhen the magnetic flux through the **body** of a conductor changes, induced currents circulate in\nclosed loops within the bulk of the metal. These are **eddy currents** (also called Foucault\ncurrents).\n\n**Disadvantages:**\n- They dissipate energy as **heat** in transformer and motor cores, reducing efficiency.\n- They can cause overheating of the core.\n\n**How they are minimised:** by using a **laminated core** — thin sheets of metal separated by\ninsulating varnish. The laminations break the large eddy-current loops into many small ones of\nhigher resistance, so the induced currents (and hence the I²R losses) are much smaller.\n\n**Applications (each worth knowing by name):**\n- **Electromagnetic braking** in trains\n- **Induction furnace** — melting metals by eddy-current heating\n- **Induction motor**\n- **Electric power (energy) meters** — the rotating aluminium disc\n- **Metal detectors**\n- Damping in moving-coil galvanometers (via the metal frame)\n\n### Self-induction\n\nWhen the current in a coil changes, the flux it produces through itself changes, inducing an emf in\nthe **same** coil that opposes the change. This is **self-induction**, and it is why a coil resists\nchanges in its own current — an electrical \"inertia\".\n\n```\n      φ = L I                       ⟹      ε = − L dI/dt\n```\n\n**L is the self-inductance** (or coefficient of self-induction), SI unit the **henry (H)**.\n\n**Definitions of the henry**, either of which is acceptable:\n- L = 1 H if a flux linkage of 1 Wb is produced by a current of 1 A.\n- L = 1 H if an emf of 1 V is induced by a current changing at 1 A s⁻¹.\n\n**Self-inductance of a long solenoid** (N turns, length l, area A, n = N/l turns per unit length):\n\n*Derivation.* The field inside is B = μ₀nI. The flux through one turn is BA = μ₀nIA, so the total\nflux linkage through N turns is\n\n```\n      Nφ = N μ₀ n I A = (n l)(μ₀ n I A) = μ₀ n² A l I\n```\n\nComparing with Nφ = LI:\n\n```\n      L = μ₀ n² A l  =  μ₀ N² A / l\n```\n\n(With a magnetic material of relative permeability μ_r inside, multiply by μ_r.)\n\n**Energy stored in an inductor:**\n\n```\n      U = ½ L I²\n```\n\n*Derivation:* the work done against the back emf in raising the current from 0 to I is\nW = ∫εI dt = ∫(L dI/dt) I dt = L∫I dI = ½LI².\n\n### Mutual induction\n\nWhen the current in one coil (the **primary**) changes, the changing flux links a nearby coil (the\n**secondary**) and induces an emf in it.\n\n```\n      φ₂ = M I₁                     ⟹      ε₂ = − M dI₁/dt\n```\n\n**M is the mutual inductance**, also in **henry**. Note M is the same whichever coil is treated as\nprimary (M₁₂ = M₂₁) — the **reciprocity** property.\n\n**Mutual inductance of two long coaxial solenoids** (both of length l and area A, with N₁ and N₂\nturns):\n\n```\n      M = μ₀ n₁ n₂ A l  =  μ₀ N₁ N₂ A / l\n```\n\n**M depends on:** the number of turns of each coil, their areas, their separation and relative\norientation, and the permeability of the medium between them. It is maximum when the coils are\n**coaxial and close together** and zero when their axes are **perpendicular**.\n\n**Coupling relation** (worth knowing): M = k√(L₁L₂), where k ≤ 1 is the coupling coefficient; k = 1\nfor perfect coupling.\n\n### AC generator (dynamo)\n\n**Principle.** Electromagnetic induction — when a coil rotates in a uniform magnetic field, the flux\nthrough it changes continuously, inducing an alternating emf.\n\n*Diagram (label all of these):* a rectangular armature coil ABCD between the poles N and S of a\nmagnet; the two ends of the coil connected to two **slip rings**, which press against two\n**carbon brushes** connected to the external circuit.\n\n**Construction.**\n- **Armature coil** — a coil of many turns of insulated wire wound on a soft-iron core\n- **Field magnet** — provides a strong uniform magnetic field\n- **Slip rings** — two rings attached to the ends of the coil, rotating with it\n- **Brushes** — stationary carbon contacts pressing on the slip rings, carrying current to the\n  external circuit\n\n**Working and derivation.** Let the coil of N turns and area A rotate with uniform angular velocity ω\nin a uniform field B. At time t, the normal to the coil makes an angle θ = ωt with **B**, so the flux\nlinkage is\n\n```\n      Nφ = N B A cos ωt\n```\n\nBy Faraday's law,\n\n```\n      ε = −d(Nφ)/dt\n        = −N B A d(cos ωt)/dt\n        = N B A ω sin ωt\n```\n\nSo\n\n```\n      ε = ε₀ sin ωt                 where     ε₀ = N B A ω\n```\n\nThe emf is **sinusoidal**, i.e. alternating. Its **peak value** is ε₀ = NBAω, and it reverses\ndirection every half rotation.\n\n**When is the emf maximum and zero?**\n- ε is **maximum** when sin ωt = 1, i.e. when the **plane of the coil is parallel to B** (the coil is\n  moving perpendicular to the field, cutting field lines fastest).\n- ε is **zero** when the **plane of the coil is perpendicular to B** (the coil is momentarily moving\n  parallel to the field lines).\n\n**Why slip rings and not a commutator?** Slip rings keep each end of the coil permanently connected\nto the same brush, so the output reverses with the coil and is **alternating**. (A split-ring\ncommutator, as in a DC generator, reverses the connections each half turn to give a unidirectional\noutput.)\n\n### Quick recall box\n\n```\nFLUX : φ = BA cos θ (weber) ;  flux linkage = Nφ\nFARADAY : ε = −N dφ/dt ;  I = ε/R ;  charge q = NΔφ/R  (independent of the time taken)\n\nLENZ : the induced current OPPOSES the change in flux\n  — the minus sign in Faraday's law\n  — a consequence of CONSERVATION OF ENERGY\n\nMOTIONAL EMF : ε = Blv\n  I = Blv/R ;  F = B²l²v/R ;  P_mech = P_elec = B²l²v²/R\n\nEDDY CURRENTS : induced loops in the bulk of a conductor\n  minimised by LAMINATED cores\n  uses: electromagnetic braking, induction furnace, induction motor, energy meters\n\nSELF-INDUCTANCE : φ = LI ;  ε = −L dI/dt ;  unit HENRY\n  solenoid : L = μ₀n²Al = μ₀N²A/l\n  energy   : U = ½LI²\n\nMUTUAL INDUCTANCE : φ₂ = MI₁ ;  ε₂ = −M dI₁/dt ;  M₁₂ = M₂₁\n  two coaxial solenoids : M = μ₀n₁n₂Al = μ₀N₁N₂A/l\n  M = k√(L₁L₂) ;  max when coaxial and close, ZERO when axes are perpendicular\n\nAC GENERATOR : ε = NBAω sin ωt = ε₀ sin ωt ;  ε₀ = NBAω\n  max emf when the coil's PLANE is PARALLEL to B ;  zero when perpendicular\n  slip rings (not a commutator) → alternating output\n```\n\n---","pyq":"**Q1.** *(5 marks)* Draw a labelled diagram of an AC generator. State its principle, explain its\nworking, and derive an expression for the instantaneous emf induced in the coil.\n\n**Q2.** *(3 marks)* State Faraday's laws of electromagnetic induction. Derive an expression for the\nmotional emf induced in a conducting rod moving in a uniform magnetic field.\n\n**Q3.** *(3 marks)* State Lenz's law. Show that it is a consequence of the conservation of energy.\n\n**Q4.** *(3 marks)* Derive an expression for the self-inductance of a long solenoid. On what factors\ndoes it depend?\n\n**Q5.** *(3 marks)* Define mutual inductance and write its SI unit. Derive an expression for the\nmutual inductance of two long coaxial solenoids.\n\n**Q6.** *(2 marks)* What are eddy currents? State two applications and one way of minimising them.\n\n**Q7.** *(2 marks)* A magnet is dropped through a long vertical copper tube. Will it fall with the\nacceleration due to gravity? Explain.\n\n**Q8.** *(2 marks)* The current in a coil of self-inductance 5 H changes from 2 A to 6 A in 0.2 s.\nFind the magnitude of the induced emf.\n\n**Q9.** *(2 marks)* A coil of area 0.05 m² with 100 turns is placed perpendicular to a field of\n0.2 T. The field is reduced to zero in 0.1 s. Find the induced emf.\n\n**Q10.** *(1 mark, MCQ)* The SI unit of self-inductance is\n(a) weber (b) tesla (c) henry (d) volt\n\n**Q11.** *(2 marks)* A conducting rod of length 0.5 m moves with a velocity of 4 m s⁻¹ perpendicular\nto a magnetic field of 0.3 T. Find the emf induced across its ends.\n\n**Q12.** *(4 marks, case study)* A coil of 500 turns and area 100 cm² is placed with its plane\nperpendicular to a magnetic field of 0.4 T. The coil has a resistance of 20 Ω. The field is reduced\nuniformly to zero in 0.2 s.\n(i) Find the initial magnetic flux linkage.\n(ii) Find the induced emf.\n(iii) Find the induced current.\n(iv) Find the total charge that flows.\n\n**Q13.** *(2 marks)* Why is the core of a transformer laminated?\n\n---","sol":"### Q1 — AC generator\n\n*Diagram:* a rectangular coil ABCD mounted on an axle between the poles N and S of a permanent\nmagnet, with the ends of the coil connected to two slip rings S₁ and S₂, which press against carbon\nbrushes B₁ and B₂ leading to an external resistance R. Label all of: armature coil, field magnet,\nslip rings, brushes, external circuit.\n\n**Principle.** The AC generator works on the principle of **electromagnetic induction**: when a coil\nis rotated in a uniform magnetic field, the magnetic flux linked with it changes continuously, and by\nFaraday's law an emf is induced. Because the flux varies sinusoidally, the induced emf is\n**alternating**.\n\n**Construction.**\n- **Armature coil:** a rectangular coil of a large number of turns of insulated copper wire wound on\n  a soft-iron core (the core increases the flux linkage).\n- **Field magnet:** a strong permanent magnet (or electromagnet) providing a uniform field between\n  its concave poles.\n- **Slip rings:** two metal rings, each connected to one end of the coil and rotating with it.\n- **Brushes:** two stationary carbon brushes pressing against the slip rings, transferring the\n  current to the external circuit.\n\n**Working.** As the coil rotates, the angle between its normal and the field changes continuously, so\nthe flux through it changes and an emf is induced. During one half-rotation the flux decreases and\nthe emf drives current one way; during the next half it increases and the current reverses. The\noutput is therefore **alternating**, completing one cycle per rotation.\n\n**Derivation.** Let the coil have N turns and area A, and rotate with constant angular velocity ω in\na uniform field B. At time t the normal to the coil makes an angle θ = ωt with **B**, so the flux\nlinkage is\n\n```\n      N φ = N B A cos θ = N B A cos ωt\n```\n\nBy Faraday's law,\n\n```\n      ε = − d(Nφ)/dt\n        = − N B A · d(cos ωt)/dt\n        = − N B A (−ω sin ωt)\n```\n\n```\n      ε = N B A ω sin ωt  =  ε₀ sin ωt              where  ε₀ = N B A ω\n```\n\nThe induced emf varies sinusoidally with time, with peak value ε₀ = NBAω. ∎\n\n**Maximum and zero emf.** ε is maximum when sin ωt = 1, i.e. when the **plane of the coil is parallel\nto the field** (the coil sides are then moving perpendicular to **B**, cutting field lines at the\ngreatest rate). ε is zero when the **plane of the coil is perpendicular to the field**.\n\n### Q2 — Faraday's laws and motional emf\n\n**Faraday's first law.** Whenever the magnetic flux linked with a closed circuit changes, an emf is\ninduced in the circuit; it persists only as long as the flux is changing.\n\n**Faraday's second law.** The magnitude of the induced emf equals the rate of change of the magnetic\nflux linkage:\n\n```\n      ε = − N dφ/dt\n```\n\n(The minus sign expresses Lenz's law — the induced emf opposes the change.)\n\n**Motional emf — derivation.**\n\n*Diagram:* two long parallel horizontal rails joined at the left end by a resistance R, in a uniform\nfield **B** directed into the page. A conducting rod PQ of length l rests across the rails and slides\nto the right with velocity v.\n\nLet the rod be at distance x from the closed end. The area enclosed by the circuit is\n\n```\n      A = l x\n```\n\nso the magnetic flux through it is\n\n```\n      φ = B A = B l x\n```\n\nAs the rod slides, x increases with time. By Faraday's law,\n\n```\n      ε = − dφ/dt = − B l (dx/dt)\n```\n\nand since dx/dt = v,\n\n```\n      |ε| = B l v\n```\n\n∎\n\n**Alternative (Lorentz-force) derivation, if asked.** Each free charge q in the rod shares the rod's\nvelocity v and so experiences a magnetic force qvB directed along the rod. The work done by this\nforce in carrying unit charge from one end of the rod to the other, a distance l, is\n\n```\n      ε = (vB)(l) = Blv\n```\n\nwhich is the induced emf. ∎\n\n### Q3 — Lenz's law and energy conservation\n\n**Statement of Lenz's law.** The direction of the induced emf, and hence of the induced current, is\nalways such as to **oppose the change in magnetic flux** that produces it.\n\n**Showing it is a consequence of energy conservation.**\n\n*Diagram:* the north pole of a bar magnet being pushed towards a coil connected to a galvanometer,\nwith the induced current shown flowing so that the near face of the coil becomes a north pole.\n\nSuppose the north pole of a magnet is pushed towards a closed coil. The flux through the coil\nincreases, so a current is induced.\n\n**By Lenz's law**, the induced current flows in the sense that makes the **near face of the coil a\nnorth pole**, which **repels** the approaching magnet. To keep pushing the magnet in, an external\nagent must therefore do **work against this repulsion**. That mechanical work is what appears as the\nelectrical energy dissipated in the coil. Energy is conserved.\n\n**Now suppose Lenz's law were violated** — that the induced current instead made the near face a\n**south** pole. It would then **attract** the magnet, pulling it in faster. The magnet would\naccelerate on its own, increasing the rate of change of flux, increasing the induced current,\nincreasing the attraction — and so on. We would obtain both increasing kinetic energy and increasing\nelectrical energy from nothing. This violates the **conservation of energy**, and is therefore\nimpossible.\n\nHence Lenz's law is required by, and is a consequence of, the conservation of energy. ∎\n\n### Q4 — self-inductance of a long solenoid\n\n*Diagram:* a long solenoid of length l, cross-sectional area A, with N closely wound turns carrying\ncurrent I, and the uniform axial field B inside.\n\nConsider a long solenoid of length l, cross-sectional area A, with N turns, so that the number of\nturns per unit length is n = N/l. Let it carry a current I.\n\n**Field inside** the solenoid (from [Ch 4](04-moving-charges-and-magnetism.md)):\n\n```\n      B = μ₀ n I\n```\n\n**Flux through one turn:**\n\n```\n      φ = B A = μ₀ n I A\n```\n\n**Total flux linkage** through all N turns:\n\n```\n      N φ = N μ₀ n I A\n```\n\nSubstituting N = nl:\n\n```\n      N φ = (n l)(μ₀ n I A) = μ₀ n² A l I\n```\n\n**By definition** of self-inductance, Nφ = L I, so\n\n```\n      L = μ₀ n² A l  =  μ₀ N² A / l\n```\n\n∎\n\n**Factors on which L depends:**\n\n1. The **number of turns** — L ∝ N² (so doubling the turns quadruples L).\n2. The **cross-sectional area** A — L ∝ A.\n3. The **length** l — L ∝ 1/l for a fixed N.\n4. The **permeability of the core material** — with a core of relative permeability μ_r,\n   L = μ_r μ₀ N²A/l, so an iron core greatly increases L.\n\nNote that L does **not** depend on the current — it is a purely geometric and material property.\n\n### Q5 — mutual inductance of two coaxial solenoids\n\n**Definition.** The **mutual inductance** of two coils is the flux linkage produced in one coil per\nunit current in the other:\n\n```\n      φ₂ = M I₁                     ⟹      M = φ₂/I₁\n```\n\nEquivalently, M = 1 H if a rate of change of current of 1 A s⁻¹ in the primary induces an emf of 1 V\nin the secondary.\n\n**SI unit:** the **henry (H)**.\n\n**Derivation for two long coaxial solenoids.**\n\n*Diagram:* an inner solenoid S₂ of N₂ turns wound over a longer outer solenoid S₁ of N₁ turns, both\nof length l and cross-sectional area A, on the same axis.\n\nLet solenoid 1 have N₁ turns and solenoid 2 have N₂ turns, both of length l and cross-sectional area\nA, wound coaxially. Let n₁ = N₁/l and n₂ = N₂/l.\n\nSuppose a current I₁ flows in solenoid 1. The field it produces inside is\n\n```\n      B₁ = μ₀ n₁ I₁\n```\n\nSince the solenoids are coaxial and of the same area, this whole field links solenoid 2. The flux\nthrough one turn of solenoid 2 is B₁A, so the total flux linkage of solenoid 2 is\n\n```\n      N₂ φ₂ = N₂ B₁ A = N₂ μ₀ n₁ I₁ A\n```\n\nSubstituting N₂ = n₂ l:\n\n```\n      N₂ φ₂ = (n₂ l)(μ₀ n₁ I₁ A) = μ₀ n₁ n₂ A l I₁\n```\n\nBy definition N₂φ₂ = M I₁, hence\n\n```\n      M = μ₀ n₁ n₂ A l  =  μ₀ N₁ N₂ A / l\n```\n\n∎\n\nNote the result is **symmetric** in the two coils, consistent with the reciprocity property\nM₁₂ = M₂₁.\n\n**M depends on:** the number of turns of each coil, their cross-sectional area, their length,\ntheir relative orientation and separation, and the permeability of the medium between them.\n\n### Q6 — eddy currents\n\n**Definition.** When the magnetic flux through the **body** of a conductor changes, induced currents\nare set up which circulate in closed loops within the bulk of the metal. These are called **eddy\ncurrents** (or Foucault currents).\n\n**Two applications:**\n1. **Electromagnetic braking** — in electric trains, an electromagnet near the rotating rails or\n   drum induces eddy currents that oppose the motion, providing smooth braking with no mechanical\n   wear.\n2. **Induction furnace** — a metal placed in a rapidly changing magnetic field develops large eddy\n   currents, whose I²R heating melts the metal. Used to produce alloys.\n\n*(Other acceptable answers: induction motor, electric power meters, metal detectors, damping in\ngalvanometers.)*\n\n**How they are minimised.** By using a **laminated core** — the core is made of thin sheets of metal\nstuck together with insulating varnish between them, with the planes of the laminations parallel to\nthe field. This confines the eddy-current loops to individual thin sheets, greatly increasing the\nresistance of each loop and so reducing the currents and the associated I²R heating.\n\n### Q7 — a magnet dropped through a copper tube\n\n**No — the magnet falls with an acceleration much less than g**, and in fact often reaches a nearly\nconstant (terminal) velocity.\n\n**Explanation.** As the magnet falls, the magnetic flux through each section of the copper tube\nchanges. This induces **eddy currents** in the walls of the tube. By **Lenz's law**, these currents\nflow in the sense that opposes the change in flux, so they exert a **retarding force** on the falling\nmagnet — opposing its motion.\n\nThe magnet therefore experiences an upward magnetic force in addition to its weight, so its net\ndownward acceleration is less than g. As it speeds up, the induced currents and the retarding force\ngrow, until the retarding force balances the weight and the magnet descends at a steady speed.\n\n*(If the tube were made of an insulator, or were slit lengthwise so no circulating current could\nflow, the magnet would fall freely with acceleration g. That is the standard follow-up question.)*\n\n### Q8 — induced emf from a changing current\n\n```\n      L = 5 H          dI = 6 − 2 = 4 A          dt = 0.2 s\n```\n\n```\n      |ε| = L |dI/dt| = 5 × (4/0.2) = 5 × 20 = 100 V\n```\n\n**|ε| = 100 V**\n\n*(The induced emf opposes the increase in current, hence the minus sign in ε = −L dI/dt; the question\nasks for the magnitude.)*\n\n### Q9 — induced emf from a changing field\n\n```\n      N = 100          A = 0.05 m²          B changes from 0.2 T to 0\n      dt = 0.1 s       coil ⊥ to B, so θ = 0 and φ = BA\n```\n\n```\n      Initial flux linkage  = N B A = (100)(0.2)(0.05) = 1 Wb\n      Final flux linkage    = 0\n\n      |ε| = |N dφ/dt| = |Δ(Nφ)|/Δt = (1 − 0)/0.1 = 10 V\n```\n\n**|ε| = 10 V**\n\n### Q10 — SI unit of self-inductance\n\n**Answer: (c) henry**\n\n### Q11 — motional emf\n\n```\n      l = 0.5 m          v = 4 m s⁻¹          B = 0.3 T          (all mutually perpendicular)\n```\n\n```\n      ε = B l v = (0.3)(0.5)(4) = 0.6 V\n```\n\n**ε = 0.6 V**\n\n### Q12 — case study: coil in a changing field\n\n```\n      N = 500          A = 100 cm² = 100 × 10⁻⁴ m² = 1 × 10⁻² m²\n      B = 0.4 T (initially), reduced to 0          R = 20 Ω          Δt = 0.2 s\n```\n\nThe plane of the coil is perpendicular to **B**, so the normal is **parallel** to **B** and θ = 0,\ngiving φ = BA.\n\n**(i) Initial flux linkage:**\n\n```\n      N φ = N B A = (500)(0.4)(1 × 10⁻²) = 2 Wb\n```\n\n**Initial flux linkage = 2 Wb**\n\n**(ii) Induced emf:**\n\n```\n      |ε| = |Δ(Nφ)|/Δt = (2 − 0)/0.2 = 10 V\n```\n\n**|ε| = 10 V**\n\n**(iii) Induced current:**\n\n```\n      I = ε/R = 10/20 = 0.5 A\n```\n\n**I = 0.5 A**\n\n**(iv) Total charge:**\n\n```\n      q = I Δt = (0.5)(0.2) = 0.1 C\n```\n\n**q = 0.1 C**\n\n*(Cross-check with q = NΔφ/R = 2/20 = 0.1 C ✓ — and note this form shows the charge depends only on\nthe total flux change and the resistance, **not** on how quickly the change happened. Halving Δt\nwould double the emf and the current but leave q unchanged.)*\n\n### Q13 — why a transformer core is laminated\n\nThe alternating current in a transformer's windings produces a continuously changing magnetic flux in\nthe core. Since the core is a conductor, this changing flux induces **eddy currents** in the body of\nthe core, which dissipate energy as **heat** (I²R loss) and reduce the transformer's efficiency.\n\nThe core is therefore built from **thin laminations** — sheets of soft iron separated by insulating\nvarnish, with their planes **parallel to the magnetic field**. This restricts each eddy-current loop\nto a single thin sheet, greatly **increasing the resistance** of the path available to the eddy\ncurrents. The currents, and hence the power dissipated, are therefore much smaller.\n\n---","test":"Time: 45 minutes. Answers below.\n\n1. *(1)* The SI unit of magnetic flux is\n   (a) tesla (b) weber (c) henry (d) volt\n2. *(1)* Lenz's law is a consequence of the conservation of\n   (a) charge (b) momentum (c) energy (d) mass\n3. *(1)* The self-inductance of a solenoid is proportional to\n   (a) N (b) N² (c) 1/N (d) 1/N²\n4. *(2)* Define magnetic flux and write its SI unit. When is the flux through a coil maximum?\n5. *(2)* State Lenz's law and use it to find the direction of the induced current when the south pole\n   of a magnet is moved towards a coil.\n6. *(2)* A rod of length 1 m rotates about one end in a plane perpendicular to a field of 0.5 T with\n   angular velocity 20 rad s⁻¹. Find the emf between its ends.\n7. *(3)* Derive an expression for the energy stored in an inductor carrying a current I.\n8. *(3)* A coil of 200 turns and area 0.02 m² is rotated at 50 rad s⁻¹ in a field of 0.1 T. Find the\n   peak emf.\n9. *(3)* Two coils have a mutual inductance of 0.5 H. Find the emf induced in the second coil when\n   the current in the first changes from 0 to 4 A in 0.1 s.\n10. *(5)* Draw a labelled diagram of an AC generator and derive the expression for the emf induced.\n    A coil of 100 turns and area 0.05 m² rotates at 60 rad s⁻¹ in a field of 0.2 T; find the peak emf.\n11. *(2)* Why does an aeroplane flying over the Earth's magnetic field develop a potential difference\n    across its wing tips?\n12. *(2)* On what factors does the mutual inductance of two coils depend? When is it zero?\n13. *(2)* A coil of resistance 10 Ω experiences a flux change of 5 Wb. Find the charge that flows.\n\n### Answer key\n\n**1. (b) weber.**\n\n**2. (c) energy.**\n\n**3. (b) N².**\n\n**4.** Magnetic flux through a surface is the product of the magnetic field and the area projected\nperpendicular to it: φ = **B**·**A** = BA cos θ. SI unit **weber (Wb)**. It is **maximum** when θ = 0,\ni.e. when **B** is **perpendicular to the plane of the coil** (parallel to its normal), giving\nφ = BA.\n\n**5.** **Lenz's law:** the induced current flows in the direction that opposes the change in flux\nproducing it. With the **south** pole approaching, the flux through the coil increases (in the sense\ntowards the magnet), so the induced current flows such that the **near face of the coil becomes a\nsouth pole**, which **repels** the approaching south pole and so opposes the increase in flux. Seen\nfrom the magnet's side, this means the current flows **clockwise**.\n\n**6. 5 V.** For a rod rotating about one end, ε = ½Bωl² = ½(0.5)(20)(1)² = 5 V.\n*(Derivation: the rod sweeps area ½l²θ, so φ = ½Bl²θ and ε = dφ/dt = ½Bl²ω.)*\n\n**7.** When the current in an inductor is i and increasing at rate di/dt, the back emf is L(di/dt),\nand the work done against it per unit time is P = εi = L i (di/dt). So the total work in raising the\ncurrent from 0 to I is\nW = ∫P dt = ∫L i (di/dt) dt = L∫[0,I] i di = **½ L I²**, which is stored as magnetic energy. ∎\n\n**8. 20 V.** ε₀ = NBAω = (200)(0.1)(0.02)(50) = 20 V.\n\n**9. 20 V.** |ε₂| = M|dI₁/dt| = (0.5)(4/0.1) = (0.5)(40) = 20 V.\n\n**10.** Diagram and derivation as in §3 Q1, giving ε = NBAω sin ωt.\nNumerically: ε₀ = NBAω = (100)(0.2)(0.05)(60) = **60 V**.\n\n**11.** The metal wings of the aeroplane act as a **conductor moving through the Earth's magnetic\nfield**. As the wings cut across the field's lines, a **motional emf** ε = B_V l v is induced across\nthem (it is the **vertical** component of the Earth's field that matters for horizontal flight, with\nl the wingspan and v the speed). Hence a potential difference appears between the wing tips.\n\n**12.** Mutual inductance depends on: the **number of turns** of each coil; their **cross-sectional\nareas**; their **lengths**; the **distance between them** and their **relative orientation**; and the\n**permeability of the medium** between them. It is **zero** when the axes of the two coils are\n**perpendicular** to each other, because then none of the flux from one links the other.\n\n**13. 0.5 C.** q = Δφ/R = 5/10 = 0.5 C. *(For N turns, q = NΔφ/R.)*\n\n**Scoring.** Out of 29. Below 20 → the AC generator derivation and the two inductance derivations are\nwhere the marks are. Write all three from memory, with diagrams.\n\n---","tips":"**On the AC generator (the 5-marker)**\n\n1. **The labelled diagram is worth 1–2 marks on its own.** You must show and label: armature coil,\n   field magnet with poles, **slip rings**, **brushes**, external circuit. Omitting the slip rings and\n   brushes is the standard loss.\n\n2. **State the principle in one line** (\"electromagnetic induction\") before the construction.\n\n3. **In the derivation, write the flux linkage first**: Nφ = NBA cos ωt. Then differentiate. Do not\n   start from ε = NBAω sin ωt.\n\n4. **Answer the \"when is emf maximum\" sub-part**, and phrase it in terms of the **plane** of the coil\n   relative to **B**. It appears almost every time this question is set.\n\n5. **If asked why slip rings rather than a commutator:** slip rings keep each coil end tied to the\n   same brush, so the output alternates; a split-ring commutator would reverse the connection each\n   half-cycle and give DC.\n\n**On Lenz's law**\n\n6. **Give the reason, not just the direction.** The mark is for \"so that the near face becomes a north\n   pole, repelling the approaching magnet and thereby opposing the increase in flux\".\n\n7. **For the energy-conservation question, argue by contradiction.** Suppose the induced current\n   aided the change → the magnet accelerates → more current → more acceleration → energy from\n   nothing. State that explicitly; it is the whole answer.\n\n8. **Name the law you are invoking.** \"By Lenz's law…\" — examiners look for it.\n\n**On the inductance derivations**\n\n9. **Start from B = μ₀nI, then flux through one turn, then flux linkage through N turns, then compare\n   with LI.** Four steps, and each is marked. Do not jump to L = μ₀N²A/l.\n\n10. **Substitute N = nl explicitly** — it is the algebraic step that converts μ₀n²Al into μ₀N²A/l, and\n    it is easy to show.\n\n11. **Answer the \"on what factors does it depend\" part with a numbered list**, and include the core\n    material. And note that L is **independent of the current** — that is often the intended catch.\n\n12. **For mutual inductance, state the reciprocity property** M₁₂ = M₂₁, and note M is zero for\n    perpendicular axes.\n\n**On numericals**\n\n13. **Convert cm² to m² by 10⁻⁴, not 10⁻².** 100 cm² = 10⁻² m². This is the single most common unit\n    slip in this chapter.\n\n14. **Watch what \"plane perpendicular to the field\" means.** If the *plane* of the coil is\n    perpendicular to **B**, then the *normal* is **parallel** to **B**, so θ = 0 and φ = BA (maximum).\n    State which you are using.\n\n15. **For charge questions, use q = NΔφ/R**, and point out that it is independent of the time taken.\n    That observation is often the marked part of the question.\n\n16. **Units:** Wb for flux, V for emf, H for inductance, C for charge, J for stored energy."}},{"id":"p7","subj":"physics","num":7,"title":"Alternating Current","unit":"Units III+IV · Magnetism, EMI & AC","unitMarks":17,"prio":1,"appear":"Units III + IV (17 marks, shared with Ch 4, 5, 6) · Typical appearance: 1–2 MCQs + a 2/3-mark question on rms values or reactance, and — very reliably — the 5-mark series-LCR-with-phasor-diagram question. Along with Ray Optics, this is one of the two most predictable 5-markers in the paper.","deleted":"- **LC oscillations** — the charge/current oscillation derivation and the analogy with SHM\n\n> **Note on \"phasors only\".** The syllabus explicitly restricts the LCR treatment to the **phasor**\n> method — you are not expected to solve the differential equation. So learn to *draw* the phasor\n> diagram and read the impedance off it. This is good news: the phasor method is much shorter, and it\n> is what the marking scheme wants.","recall":"```\ni = i₀ sin ωt ;  ω = 2πf\nmean over a full cycle = 0 ;  over a half cycle = 2i₀/π\nRMS : i_rms = i₀/√2 ;  v_rms = v₀/√2       — the DC that gives the SAME HEATING\n  AC meters read rms ;  220 V mains → peak 220√2 ≈ 311 V\n\nSINGLE ELEMENTS\n  R : V and I IN PHASE\n  L : I LAGS V by π/2 ;  X_L = ωL = 2πfL       ∝ f   (blocks high f, passes DC)\n  C : I LEADS V by π/2 ;  X_C = 1/ωC = 1/2πfC  ∝ 1/f (passes high f, BLOCKS DC)\n  \"CIVIL\": in C, I leads V ;  V leads I in L\n  average power in a pure L or pure C = ZERO\n\nSERIES LCR (phasors)\n  Z = √(R² + (X_L − X_C)²)          tan φ = (X_L − X_C)/R          cos φ = R/Z\n  X_L > X_C → inductive, V leads I ;  X_L < X_C → capacitive, V lags I\n\nRESONANCE : X_L = X_C\n  ω₀ = 1/√(LC) ;  f₀ = 1/(2π√(LC))\n  Z MINIMUM = R ;  I MAXIMUM = V/R ;  φ = 0 ;  power factor = 1\n  Q = ω₀L/R = 1/(ω₀CR) = (1/R)√(L/C) = ω₀/Δω ,  Δω = R/L\n  small R → sharp resonance, high Q       (an \"acceptor\" circuit)\n\nPOWER : P_avg = V_rms I_rms cos φ ;  power factor cos φ = R/Z\n  wattless current = i_rms sin φ  (consumes no average power)\n\nTRANSFORMER (mutual induction)\n  V_s/V_p = N_s/N_p = I_p/I_s\n  step-up: N_s > N_p, V↑ I↓ ;  step-down: N_s < N_p, V↓ I↑\n  losses: copper (thick wire) ; eddy (laminated core) ; hysteresis (soft iron) ;\n          flux leakage (closed core, coils wound over each other)\n  will NOT work on DC (dφ/dt = 0)\n  transmission at high V, low I because line loss = I²R\n```","s":{"scope":"### In the syllabus\n\n- **Alternating currents**; **peak and RMS values** of alternating current/voltage\n- **Reactance** and **impedance**\n- **LCR series circuit** — *phasors only*\n- **Resonance**\n- **Power in AC circuits**; **power factor**; **wattless current**\n- **Transformer** *(and the AC generator, which is covered in\n  [Ch 6](06-electromagnetic-induction.md))*\n\n### Deleted — do not study\n\n- **LC oscillations** — the charge/current oscillation derivation and the analogy with SHM\n\n> **Note on \"phasors only\".** The syllabus explicitly restricts the LCR treatment to the **phasor**\n> method — you are not expected to solve the differential equation. So learn to *draw* the phasor\n> diagram and read the impedance off it. This is good news: the phasor method is much shorter, and it\n> is what the marking scheme wants.\n\n---","brief":"### Alternating current and voltage\n\n```\n      i = i₀ sin ωt                 v = v₀ sin ωt\n```\n\nwhere i₀, v₀ are the **peak (amplitude) values**, ω = 2πf is the angular frequency, and f is the\nfrequency (50 Hz in India).\n\n### Mean and RMS values\n\n**Mean value over a full cycle is zero** — the current spends equal time in each direction. So the\naverage is useless as a measure of an AC's magnitude, and this is *why* the rms value is needed.\n\n**Mean over a half cycle:**\n\n```\n      i_mean = 2i₀/π = 0.637 i₀\n```\n\n**Root-mean-square (rms), or virtual, value.** The rms value of an alternating current is that value\nof **steady direct current** which would produce the **same heating effect** in a given resistance in\nthe same time.\n\n```\n      i_rms = i₀/√2 = 0.707 i₀                v_rms = v₀/√2 = 0.707 v₀\n```\n\n> **Why rms and not mean.** Heating depends on i², which is positive in both half-cycles, so the\n> *mean of the square* is non-zero even though the mean of i is zero. That is exactly what makes rms\n> the physically meaningful measure — and it is the asked reason.\n\n**In practice:** AC ammeters and voltmeters read **rms** values. The Indian mains \"220 V\" is an rms\nvalue, so its peak is v₀ = 220√2 ≈ 311 V.\n\n### AC through a single element\n\n| Element | Phase relation | Opposition | Formula |\n| --- | --- | --- | --- |\n| **Resistor R** | current and voltage **in phase** (φ = 0) | resistance R | i₀ = v₀/R |\n| **Inductor L** | current **lags** voltage by **π/2** | inductive reactance X_L | X_L = ωL = 2πfL |\n| **Capacitor C** | current **leads** voltage by **π/2** | capacitive reactance X_C | X_C = 1/(ωC) = 1/(2πfC) |\n\n**Memory hook: \"CIVIL\"** — in a **C**, **I** leads **V**; **V** leads **I** in an **L**.\n\n**Frequency dependence** (asked as MCQs and graph questions):\n\n- **X_L = ωL ∝ f.** An inductor **blocks** high frequencies and passes DC freely (at f = 0, X_L = 0).\n- **X_C = 1/ωC ∝ 1/f.** A capacitor **passes** high frequencies and **blocks DC** (at f = 0,\n  X_C = ∞ — this is why a capacitor in series stops DC entirely).\n\n**Average power over a cycle in a pure inductor or a pure capacitor is ZERO**, because the phase\ndifference is 90° and cos 90° = 0. No net energy is consumed — energy is stored and returned each\nquarter cycle.\n\n### Series LCR circuit — the phasor method\n\n*Phasor diagram:* draw V_R along the horizontal (in phase with the current I, drawn along the same\ndirection); V_L vertically **up** (leading I by 90°); V_C vertically **down** (lagging I by 90°). The\nnet reactive phasor is (V_L − V_C), and the resultant V is the vector sum of V_R and (V_L − V_C).\n\n```\n              V_L\n               ↑\n               │        V\n               │      ╱\n       V_L−V_C │    ╱\n               │  ╱  φ\n               │╱________→  V_R   (and I)\n               │\n               ↓\n              V_C\n```\n\nSince V_R is along the current and (V_L − V_C) is perpendicular to it, the resultant applied voltage\nis\n\n```\n      V = √( V_R² + (V_L − V_C)² )\n```\n\nSubstituting V_R = IR, V_L = IX_L, V_C = IX_C:\n\n```\n      V = I √( R² + (X_L − X_C)² )\n```\n\nso V = IZ with the **impedance**\n\n```\n      Z = √( R² + (X_L − X_C)² )              unit: ohm\n```\n\n**Phase angle** between the applied voltage and the current:\n\n```\n      tan φ = (X_L − X_C)/R = (V_L − V_C)/V_R                cos φ = R/Z\n```\n\n**Three cases:**\n\n| Condition | Circuit behaves as | Phase |\n| --- | --- | --- |\n| X_L > X_C | mainly **inductive** | voltage **leads** current (φ positive) |\n| X_L < X_C | mainly **capacitive** | voltage **lags** current (φ negative) |\n| X_L = X_C | purely **resistive** | voltage and current **in phase** — **resonance** |\n\n### Resonance\n\nAt **resonance**, X_L = X_C:\n\n```\n      ω₀L = 1/(ω₀C)\n⟹     ω₀ = 1/√(LC)                 f₀ = 1/(2π√(LC))\n```\n\n**At resonance:**\n- **Z is minimum**, and equals R (purely resistive)\n- **Current is maximum**, I_max = V/R\n- **Voltage and current are in phase** (φ = 0)\n- **Power factor is unity**\n- The voltages across L and C are equal in magnitude and opposite in phase, so they cancel\n\n**Graph — current vs frequency:**\n\n```\n   I │        ╱╲     ← small R : SHARP resonance, high Q\n     │       ╱  ╲\n     │     ╱      ╲\n     │   ╱ ╱‾‾╲ ╲     ← large R : BROAD resonance, low Q\n     │ ╱  ╱     ╲  ╲\n     └──────────┴──────────── f\n                f₀\n```\n\nA **series LCR circuit at resonance is called an acceptor circuit** — it accepts (passes a large\ncurrent at) the resonant frequency, which is the basis of radio tuning.\n\n**Sharpness of resonance — the Q factor:**\n\n```\n      Q = ω₀L/R  =  1/(ω₀CR)  =  (1/R)√(L/C)\n```\n\nAlso Q = ω₀/Δω, where Δω = R/L is the **bandwidth** (the width of the resonance curve at which the\npower drops to half its maximum).\n\n**A larger Q means a sharper resonance**, obtained by making R **small**. High Q gives better\nselectivity in a tuner.\n\n### Power in AC circuits\n\n**Instantaneous power** varies through the cycle; what matters is the **average over a cycle**:\n\n```\n      P_avg = V_rms I_rms cos φ\n```\n\nwhere **cos φ is the power factor**:\n\n```\n      power factor  cos φ = R/Z\n```\n\n**Values of the power factor:**\n\n| Circuit | cos φ | Average power |\n| --- | --- | --- |\n| Pure R | 1 | V_rms I_rms — maximum |\n| Pure L | 0 | **zero** |\n| Pure C | 0 | **zero** |\n| Series LCR at resonance | 1 | V_rms I_rms |\n| General LCR | R/Z | V_rms I_rms (R/Z) |\n\n**Wattless current.** The component of the current that is **perpendicular** to the voltage phasor,\ni.e. i_rms sin φ, consumes **no average power** over a cycle and is called the **wattless\n(or idle) current**. In a purely inductive or purely capacitive circuit the *whole* current is\nwattless.\n\n*(The in-phase component i_rms cos φ is the part that does deliver power.)*\n\n### Transformer\n\n**Principle: mutual induction.** An alternating current in the primary produces a changing magnetic\nflux in the core, which links the secondary and induces an alternating emf in it.\n\n*Diagram:* a closed laminated soft-iron core; primary coil of N_p turns on one limb connected to an\nAC source; secondary coil of N_s turns on the other limb connected to a load.\n\n**Construction.** Two coils of insulated copper wire — the **primary** (N_p turns) and the\n**secondary** (N_s turns) — wound on a **closed laminated soft-iron core**.\n\n**Working and the turns relation.** The same changing flux φ links both coils, so\n\n```\n      ε_p = − N_p dφ/dt                    ε_s = − N_s dφ/dt\n```\n\nDividing:\n\n```\n      ε_s/ε_p = N_s/N_p\n```\n\nFor an **ideal (100% efficient)** transformer, power in = power out:\n\n```\n      V_p I_p = V_s I_s\n```\n\nCombining, the **transformer equations** are\n\n```\n      V_s/V_p = N_s/N_p = I_p/I_s  =  k                (the turns ratio)\n```\n\n| Type | Turns | Voltage | Current |\n| --- | --- | --- | --- |\n| **Step-up** | N_s > N_p | increased | decreased |\n| **Step-down** | N_s < N_p | decreased | increased |\n\n> **A transformer never \"creates\" energy.** Voltage is stepped up only at the cost of a\n> proportionately reduced current — the power is (ideally) unchanged. Saying this explicitly is often\n> a mark.\n\n**Why a transformer will not work on DC:** a steady current produces a constant flux, and dφ/dt = 0,\nso no emf is induced in the secondary. A transformer requires a **changing** flux.\n\n**Energy losses and their remedies** — a standard 3-mark question:\n\n| Loss | Cause | Remedy |\n| --- | --- | --- |\n| **Copper loss** | I²R heating in the windings | use thick copper wire of low resistance |\n| **Eddy-current loss** | induced currents in the core | use a **laminated** core |\n| **Hysteresis loss** | repeated magnetisation and demagnetisation of the core | use **soft iron**, which has a narrow hysteresis loop |\n| **Flux leakage** | not all the primary flux links the secondary | wind the coils one over the other on a **closed** core |\n| **Humming (magnetostriction)** | vibration of the core | tighten the core laminations |\n\n**Why transformers matter — long-distance power transmission.** Power is transmitted at very **high\nvoltage and low current**, because the line loss is I²R: reducing I by a factor of 100 reduces the\nloss by 10 000. Step-up transformers raise the voltage at the generating station, and step-down\ntransformers reduce it near the consumer.\n\n### Quick recall box\n\n```\ni = i₀ sin ωt ;  ω = 2πf\nmean over a full cycle = 0 ;  over a half cycle = 2i₀/π\nRMS : i_rms = i₀/√2 ;  v_rms = v₀/√2       — the DC that gives the SAME HEATING\n  AC meters read rms ;  220 V mains → peak 220√2 ≈ 311 V\n\nSINGLE ELEMENTS\n  R : V and I IN PHASE\n  L : I LAGS V by π/2 ;  X_L = ωL = 2πfL       ∝ f   (blocks high f, passes DC)\n  C : I LEADS V by π/2 ;  X_C = 1/ωC = 1/2πfC  ∝ 1/f (passes high f, BLOCKS DC)\n  \"CIVIL\": in C, I leads V ;  V leads I in L\n  average power in a pure L or pure C = ZERO\n\nSERIES LCR (phasors)\n  Z = √(R² + (X_L − X_C)²)          tan φ = (X_L − X_C)/R          cos φ = R/Z\n  X_L > X_C → inductive, V leads I ;  X_L < X_C → capacitive, V lags I\n\nRESONANCE : X_L = X_C\n  ω₀ = 1/√(LC) ;  f₀ = 1/(2π√(LC))\n  Z MINIMUM = R ;  I MAXIMUM = V/R ;  φ = 0 ;  power factor = 1\n  Q = ω₀L/R = 1/(ω₀CR) = (1/R)√(L/C) = ω₀/Δω ,  Δω = R/L\n  small R → sharp resonance, high Q       (an \"acceptor\" circuit)\n\nPOWER : P_avg = V_rms I_rms cos φ ;  power factor cos φ = R/Z\n  wattless current = i_rms sin φ  (consumes no average power)\n\nTRANSFORMER (mutual induction)\n  V_s/V_p = N_s/N_p = I_p/I_s\n  step-up: N_s > N_p, V↑ I↓ ;  step-down: N_s < N_p, V↓ I↑\n  losses: copper (thick wire) ; eddy (laminated core) ; hysteresis (soft iron) ;\n          flux leakage (closed core, coils wound over each other)\n  will NOT work on DC (dφ/dt = 0)\n  transmission at high V, low I because line loss = I²R\n```\n\n---","pyq":"**Q1.** *(5 marks)* A series LCR circuit is connected to an AC source of voltage\nv = v₀ sin ωt. Draw the phasor diagram and hence obtain expressions for the impedance of the circuit\nand the phase angle between the voltage and the current. Under what condition is the current maximum?\n\n**Q2.** *(3 marks)* Define the resonant frequency of a series LCR circuit and derive an expression\nfor it. Draw graphs of current against frequency for two different values of resistance and explain\nwhich corresponds to a sharper resonance.\n\n**Q3.** *(5 marks)* Draw a labelled diagram of a transformer. State its principle and working, and\nderive the relation between the voltages and the number of turns. Mention any two sources of energy\nloss and how each is minimised.\n\n**Q4.** *(3 marks)* Define the rms value of an alternating current and derive its relation to the\npeak value. Why is the rms value, rather than the mean value, used to specify an AC?\n\n**Q5.** *(3 marks)* Define the power factor of an AC circuit. What is meant by wattless current? Show\nthat the average power consumed in a pure inductor over a complete cycle is zero.\n\n**Q6.** *(2 marks)* An inductor of 200 mH is connected to a 220 V, 50 Hz AC source. Find the\ninductive reactance and the rms current.\n\n**Q7.** *(2 marks)* A capacitor of 100 μF is connected to a 220 V, 50 Hz supply. Find the capacitive\nreactance and the rms current.\n\n**Q8.** *(3 marks)* A series LCR circuit has R = 3 Ω, L = 25.48 mH and C = 796 μF, connected to a\n230 V, 50 Hz supply. Find (i) the impedance, (ii) the current, and (iii) the power factor.\n\n**Q9.** *(2 marks)* Explain why a capacitor blocks DC but allows AC to pass.\n\n**Q10.** *(2 marks)* Why can a transformer not be used with a DC supply?\n\n**Q11.** *(1 mark, MCQ)* At resonance in a series LCR circuit, the impedance is\n(a) minimum and equal to R (b) maximum (c) zero (d) equal to X_L\n\n**Q12.** *(4 marks, case study)* A step-down transformer is used to convert 2200 V AC to 220 V AC to\nrun a 1 kW device. Assume the transformer is 100% efficient.\n(i) Find the turns ratio N_s/N_p.\n(ii) Find the current in the secondary.\n(iii) Find the current in the primary.\n(iv) Name one energy loss in a real transformer and how it is reduced.\n\n**Q13.** *(2 marks)* Define the quality factor of a series LCR circuit at resonance. How does it\ndepend on R?\n\n---","sol":"### Q1 — series LCR circuit: phasor diagram, impedance and phase angle\n\n*Circuit diagram:* R, L and C in series across an AC source v = v₀ sin ωt.\n\n*Phasor diagram:*\n\n```\n              V_L\n               ↑\n               │           V\n               │         ╱\n     (V_L−V_C) │       ╱\n               │     ╱  φ\n               │   ╱____________→   V_R  ,  I\n               │\n               ↓\n              V_C\n```\n\n**Setting up.** In a series circuit the **same current** i = i₀ sin(ωt − φ) flows through all three\nelements. Take the current phasor **I** along the reference (horizontal) direction. Then:\n\n- **V_R = IR** is **in phase** with I → drawn along I\n- **V_L = IX_L** **leads** I by 90° → drawn perpendicular, **upward**\n- **V_C = IX_C** **lags** I by 90° → drawn perpendicular, **downward**\n\n**Combining.** V_L and V_C are antiparallel, so their resultant is a single phasor of magnitude\n|V_L − V_C| perpendicular to V_R. The applied voltage V is the vector sum of V_R and (V_L − V_C),\nwhich are at right angles, so by Pythagoras:\n\n```\n      V = √( V_R² + (V_L − V_C)² )\n```\n\n**Substituting** V_R = IR, V_L = IX_L, V_C = IX_C:\n\n```\n      V = √( (IR)² + (IX_L − IX_C)² )\n        = I √( R² + (X_L − X_C)² )\n```\n\nComparing with V = I Z, the **impedance** is\n\n```\n      Z = √( R² + (X_L − X_C)² )              where X_L = ωL,  X_C = 1/ωC\n```\n\n**Phase angle.** From the phasor diagram, the angle φ between V and I satisfies\n\n```\n      tan φ = (V_L − V_C)/V_R = (X_L − X_C)/R\n```\n\nand\n\n```\n      cos φ = V_R/V = R/Z\n```\n\n**Condition for maximum current.** Since I = V/Z, the current is maximum when Z is **minimum**. From\nZ = √(R² + (X_L − X_C)²), the minimum occurs when the reactive term vanishes:\n\n```\n      X_L = X_C\n⟹     ωL = 1/(ωC)\n⟹     ω = 1/√(LC)\n```\n\nThis is the condition of **resonance**. At resonance Z = R (its minimum possible value), the current\nis maximum at I = V/R, and the voltage and current are **in phase** (φ = 0). ∎\n\n### Q2 — resonant frequency and sharpness of resonance\n\n**Definition.** The **resonant frequency** of a series LCR circuit is the frequency of the applied AC\nat which the **inductive and capacitive reactances become equal**, so that the impedance is minimum\nand the current maximum.\n\n**Derivation.** At resonance,\n\n```\n      X_L = X_C\n⟹     ω₀ L = 1/(ω₀ C)\n⟹     ω₀² = 1/(LC)\n⟹     ω₀ = 1/√(LC)\n```\n\nand since ω₀ = 2πf₀,\n\n```\n      f₀ = 1/(2π √(LC))\n```\n\n**Graphs of current against frequency:**\n\n```\n   I │         ╱╲          ← R₁ (SMALL): tall, narrow peak — SHARP resonance\n     │        ╱  ╲\n     │       ╱    ╲\n     │      ╱      ╲\n     │    ╱  ╱‾‾╲   ╲      ← R₂ (LARGE): short, broad peak — flat resonance\n     │  ╱  ╱      ╲   ╲\n     └────────┴────────────── f\n              f₀\n```\n\nBoth curves peak at the **same** frequency f₀ = 1/(2π√(LC)), since f₀ does not depend on R. But:\n\n- For **small R**, the peak current V/R is **large** and the curve is **narrow** — a **sharp**\n  resonance.\n- For **large R**, the peak current is smaller and the curve is **broad** — a flat resonance.\n\n**Which is sharper, and why.** The curve for the **smaller resistance** is sharper. Quantitatively,\nthe sharpness is measured by the **quality factor**\n\n```\n      Q = ω₀L/R = ω₀/Δω          where Δω = R/L is the bandwidth\n```\n\nSince Q ∝ 1/R, a **smaller R gives a larger Q and hence a sharper resonance**. A sharp resonance\nmeans the circuit responds strongly to a narrow band of frequencies, which is what makes it\n**selective** — the property used to tune a radio to one station.\n\n### Q3 — transformer\n\n*Diagram:* a closed rectangular laminated soft-iron core; the **primary** coil of N_p turns wound on\nthe left limb and connected to an AC source; the **secondary** coil of N_s turns wound on the right\nlimb and connected to a load. Label: laminated soft-iron core, primary, secondary, AC input, output.\n\n**Principle.** A transformer works on the principle of **mutual induction**. An alternating current\nin the primary coil produces a continuously changing magnetic flux in the core; this flux links the\nsecondary coil and, by Faraday's law, induces an alternating emf in it.\n\n**Construction.** Two coils of insulated copper wire — the primary (N_p turns) and the secondary\n(N_s turns) — wound on a **closed, laminated, soft-iron core**. The core is closed so that almost all\nthe flux produced by the primary links the secondary; it is laminated to reduce eddy currents; and it\nis soft iron because that has a narrow hysteresis loop.\n\n**Working and derivation.**\n\nLet φ be the flux through each turn of the core (assumed the same for both coils, i.e. no flux\nleakage). By Faraday's law, the emf induced in each coil is\n\n```\n      ε_p = − N_p (dφ/dt)                    …(i)\n      ε_s = − N_s (dφ/dt)                    …(ii)\n```\n\nDividing (ii) by (i):\n\n```\n      ε_s/ε_p = N_s/N_p\n```\n\nFor an ideal transformer with no losses, the terminal voltages equal the emfs, so\n\n```\n      V_s/V_p = N_s/N_p\n```\n\nAlso, for a **100% efficient** transformer, the output power equals the input power:\n\n```\n      V_p I_p = V_s I_s\n⟹     I_p/I_s = V_s/V_p = N_s/N_p\n```\n\nHence the **transformer equations**:\n\n```\n      V_s/V_p = N_s/N_p = I_p/I_s\n```\n\n**Step-up transformer:** N_s > N_p, so V_s > V_p and I_s < I_p — the voltage is raised at the cost of\na reduced current.\n**Step-down transformer:** N_s < N_p, so V_s < V_p and I_s > I_p.\n\n**Two sources of energy loss and their remedies:**\n\n1. **Eddy-current loss.** The changing flux induces circulating currents in the body of the iron\n   core, which dissipate energy as heat. **Remedy:** use a **laminated core** — thin insulated sheets\n   of iron, which break the eddy-current loops and greatly increase their resistance.\n\n2. **Copper loss.** The currents in the primary and secondary windings dissipate energy as I²R\n   heating in the wires. **Remedy:** use **thick copper wire** of low resistance for the windings.\n\n*(Other acceptable pairs: hysteresis loss → use soft iron with a narrow hysteresis loop; flux\nleakage → wind the coils one over the other on a closed core.)* ∎\n\n### Q4 — rms value of an alternating current\n\n**Definition.** The **rms (root-mean-square) value** of an alternating current is that value of\n**steady direct current** which, flowing through a given resistance for a given time, produces the\n**same amount of heat** as the alternating current does in the same resistance in the same time.\n\n**Derivation.** Let i = i₀ sin ωt. The instantaneous power dissipated in a resistance R is\n\n```\n      P = i²R = i₀² R sin²ωt\n```\n\nThe average over one complete cycle uses the average of sin²ωt, which is **½**:\n\n```\n      ⟨sin²ωt⟩ = ½\n```\n\n*(Because sin²ωt = (1 − cos 2ωt)/2, and the average of cos 2ωt over a full cycle is zero.)*\n\nSo\n\n```\n      P_avg = i₀² R × ½ = (i₀²/2) R\n```\n\nFor an equivalent steady current i_rms producing the same average heating,\n\n```\n      i_rms² R = (i₀²/2) R\n⟹     i_rms² = i₀²/2\n⟹     i_rms = i₀/√2 = 0.707 i₀\n```\n\nSimilarly v_rms = v₀/√2. ∎\n\n**Why rms rather than mean.**\n\nThe **mean value of an alternating current over a complete cycle is zero**, because the current\nflows for equal times in opposite directions and the positive and negative halves cancel exactly. So\nthe mean value carries no information about the magnitude of the current, and an AC meter based on it\nwould always read zero.\n\nThe **heating effect**, however, depends on **i²**, which is positive in **both** half-cycles.\nTherefore the average of i² is not zero, and its square root — the rms value — is a genuine measure\nof the current's magnitude and of the work it can do. This is why AC ammeters and voltmeters are\ncalibrated to read rms values, and why \"220 V mains\" means 220 V rms.\n\n### Q5 — power factor, wattless current, and zero power in an inductor\n\n**Power factor.** The average power in an AC circuit is\n\n```\n      P_avg = V_rms I_rms cos φ\n```\n\nThe factor **cos φ** — where φ is the phase angle between the applied voltage and the current — is\ncalled the **power factor** of the circuit. It equals\n\n```\n      cos φ = R/Z\n```\n\nIt is the ratio of the actual average power consumed to the apparent power V_rms I_rms, and it lies\nbetween 0 and 1.\n\n**Wattless current.** Resolving the current phasor into components parallel and perpendicular to the\nvoltage phasor:\n\n- the component I_rms cos φ, **in phase** with the voltage, delivers the power;\n- the component **I_rms sin φ**, **perpendicular** to the voltage, consumes **no average power** over\n  a complete cycle.\n\nThis perpendicular component is called the **wattless (or idle) current**.\n\n**Average power in a pure inductor is zero.**\n\nIn a purely inductive circuit the current **lags** the voltage by exactly π/2. So with\n\n```\n      v = v₀ sin ωt              i = i₀ sin(ωt − π/2) = −i₀ cos ωt\n```\n\nthe instantaneous power is\n\n```\n      P = v i = −v₀ i₀ sin ωt cos ωt = −(v₀ i₀/2) sin 2ωt\n```\n\nThe average of sin 2ωt over a complete cycle is **zero**, so\n\n```\n      P_avg = 0\n```\n\n*(Equivalently: P_avg = V_rms I_rms cos φ with φ = 90°, and cos 90° = 0.)*\n\n**Physical meaning.** Energy is drawn from the source and stored in the inductor's magnetic field\nduring one quarter of the cycle, and returned to the source during the next quarter. Over a complete\ncycle there is **no net transfer of energy** — the inductor consumes no power on average. The same\nargument applies to a pure capacitor, with energy stored in the electric field. ∎\n\n### Q6 — inductive reactance and current\n\n```\n      L = 200 mH = 0.2 H          V_rms = 220 V          f = 50 Hz\n```\n\n```\n      X_L = 2πfL = 2π(50)(0.2) = 2π(10) = 62.83 Ω\n```\n\n```\n      I_rms = V_rms/X_L = 220/62.83 = 3.50 A\n```\n\n**X_L ≈ 62.8 Ω and I_rms ≈ 3.5 A.**\n\n*(The current lags the voltage by 90°, and the average power consumed is zero.)*\n\n### Q7 — capacitive reactance and current\n\n```\n      C = 100 μF = 100 × 10⁻⁶ F = 10⁻⁴ F          V_rms = 220 V          f = 50 Hz\n```\n\n```\n      X_C = 1/(2πfC) = 1/[2π(50)(10⁻⁴)]\n          = 1/(2π × 5 × 10⁻³)\n          = 1/(3.1416 × 10⁻²)\n          = 31.83 Ω\n```\n\n```\n      I_rms = V_rms/X_C = 220/31.83 = 6.91 A\n```\n\n**X_C ≈ 31.8 Ω and I_rms ≈ 6.9 A.**\n\n*(The current leads the voltage by 90°, and the average power consumed is zero.)*\n\n### Q8 — series LCR numerical\n\n```\n      R = 3 Ω          L = 25.48 mH = 25.48 × 10⁻³ H          C = 796 μF = 796 × 10⁻⁶ F\n      V_rms = 230 V    f = 50 Hz,  so ω = 2π(50) = 314.16 rad s⁻¹\n```\n\n**Reactances:**\n\n```\n      X_L = ωL = (314.16)(25.48 × 10⁻³) = 8.0 Ω\n\n      X_C = 1/(ωC) = 1/[(314.16)(796 × 10⁻⁶)]\n          = 1/(0.2501)\n          = 4.0 Ω\n```\n\n**(i) Impedance:**\n\n```\n      Z = √( R² + (X_L − X_C)² )\n        = √( 3² + (8.0 − 4.0)² )\n        = √( 9 + 16 )\n        = √25\n        = 5 Ω\n```\n\n**Z = 5 Ω**\n\n**(ii) Current:**\n\n```\n      I_rms = V_rms/Z = 230/5 = 46 A\n```\n\n**I_rms = 46 A**\n\n**(iii) Power factor:**\n\n```\n      cos φ = R/Z = 3/5 = 0.6\n```\n\n**cos φ = 0.6**\n\n*(Since X_L > X_C the circuit is inductive, so the voltage leads the current by\nφ = cos⁻¹(0.6) = 53.1°. The average power consumed is\nP = V_rms I_rms cos φ = (230)(46)(0.6) = 6348 W ≈ 6.35 kW.)*\n\n### Q9 — why a capacitor blocks DC but passes AC\n\nThe capacitive reactance is\n\n```\n      X_C = 1/(2π f C)\n```\n\n**For DC**, the frequency f = 0, so\n\n```\n      X_C = 1/(2π × 0 × C) = ∞\n```\n\nThe reactance is infinite, so no steady current can flow — the capacitor **blocks DC**. Physically,\nthe capacitor charges up until the voltage across it equals the applied voltage, after which the\ncurrent stops; the dielectric between the plates offers no conducting path.\n\n**For AC**, f is non-zero and X_C = 1/(2πfC) is **finite**, and it becomes **smaller as the frequency\nincreases**. So the capacitor **allows AC to pass**, and the higher the frequency the more freely it\npasses. Physically, the capacitor charges and discharges continuously as the polarity alternates, so\ncurrent flows back and forth in the circuit throughout — even though no charge crosses the gap\nbetween the plates.\n\n*(This is why capacitors are used as \"blocking capacitors\" to stop DC while letting an AC signal\nthrough.)*\n\n### Q10 — why a transformer will not work on DC\n\nA transformer works by **mutual induction**, which requires a **changing** magnetic flux through the\nsecondary coil. By Faraday's law the emf induced in the secondary is\n\n```\n      ε_s = − N_s (dφ/dt)\n```\n\nIf a **steady DC** is applied to the primary, the current — and hence the magnetic flux in the core —\nis **constant**, so\n\n```\n      dφ/dt = 0          ⟹          ε_s = 0\n```\n\nNo emf is induced in the secondary, and there is no output.\n\n*(Worse, in practice: a DC supply would drive a large steady current through the primary, limited only\nby its small resistance rather than by its reactance, which could burn out the winding.)*\n\n### Q11 — impedance at resonance\n\nAt resonance X_L = X_C, so Z = √(R² + 0) = R, which is the smallest value Z can take.\n\n**Answer: (a) minimum and equal to R**\n\n### Q12 — case study: step-down transformer\n\n```\n      V_p = 2200 V          V_s = 220 V          Output power = 1 kW = 1000 W\n      100% efficiency\n```\n\n**(i) Turns ratio:**\n\n```\n      N_s/N_p = V_s/V_p = 220/2200 = 1/10\n```\n\n**N_s/N_p = 1 : 10** — a step-down transformer, as expected.\n\n**(ii) Secondary current:**\n\n```\n      P = V_s I_s\n⟹     I_s = P/V_s = 1000/220 = 4.55 A\n```\n\n**I_s ≈ 4.55 A**\n\n**(iii) Primary current.** For a 100% efficient transformer, the input power equals the output power:\n\n```\n      V_p I_p = 1000\n⟹     I_p = 1000/2200 = 0.455 A\n```\n\n**I_p ≈ 0.455 A**\n\n*(Check with the turns relation: I_p/I_s = N_s/N_p = 1/10, so I_p = I_s/10 = 0.455 A ✓ — the voltage\nwas stepped down by 10, so the current is stepped up by 10.)*\n\n**(iv) One energy loss and its remedy.**\n\n**Eddy-current loss:** the alternating flux in the iron core induces circulating currents in the body\nof the core, which dissipate energy as heat. **Remedy:** use a **laminated core** made of thin\ninsulated iron sheets, which confines each eddy current to a thin sheet of high resistance and so\ngreatly reduces the loss.\n\n*(Any of copper loss / hysteresis loss / flux leakage with its matching remedy is equally\nacceptable.)*\n\n### Q13 — quality factor\n\n**Definition.** The **quality factor (Q factor)** of a series LCR circuit at resonance measures the\n**sharpness of the resonance**. It is defined as the ratio of the resonant frequency to the bandwidth:\n\n```\n      Q = ω₀/Δω                     where Δω = R/L is the bandwidth\n```\n\nEquivalently, it is the ratio of the voltage across the inductor (or the capacitor) at resonance to\nthe applied voltage:\n\n```\n      Q = ω₀L/R  =  1/(ω₀CR)  =  (1/R) √(L/C)\n```\n\n**Dependence on R.** Since Q ∝ **1/R**:\n\n- a **smaller resistance** gives a **larger Q** and hence a **sharper** resonance curve;\n- a **larger resistance** gives a smaller Q and a broader, flatter resonance.\n\nA high-Q circuit is more **selective** — it responds strongly to a narrow band of frequencies around\nf₀, which is what allows a radio receiver to pick out one station from many.\n\n---","test":"Time: 50 minutes. Answers below.\n\n1. *(1)* The rms value of an alternating current of peak value 10 A is\n   (a) 10 A (b) 7.07 A (c) 14.14 A (d) 5 A\n2. *(1)* In a purely capacitive AC circuit, the current\n   (a) lags the voltage by π/2 (b) leads the voltage by π/2 (c) is in phase (d) is zero\n3. *(1)* The average power consumed in a pure inductor over a complete cycle is\n   (a) V_rms I_rms (b) ½V_rms I_rms (c) zero (d) V₀I₀\n4. *(2)* An AC source of 220 V, 50 Hz is connected to a 100 Ω resistor. Find the rms current and the\n   power dissipated.\n5. *(2)* Define inductive reactance and capacitive reactance, and state how each depends on frequency.\n6. *(2)* Find the resonant frequency of a series LCR circuit with L = 2 H and C = 32 μF.\n7. *(3)* A series LCR circuit has R = 40 Ω, X_L = 60 Ω and X_C = 30 Ω. Find the impedance, the phase\n   angle and the power factor.\n8. *(3)* Show that the average power in an AC circuit is V_rms I_rms cos φ.\n9. *(3)* An ideal step-up transformer has 100 turns in the primary and 500 turns in the secondary. If\n   the primary is connected to 220 V and draws 5 A, find the secondary voltage and current.\n10. *(5)* Draw the phasor diagram for a series LCR circuit and derive the expression for its\n    impedance. A series LCR circuit with R = 5 Ω, L = 0.1 H and C = 100 μF is connected to a 200 V,\n    50 Hz source; find the impedance and the current.\n11. *(2)* Why is power transmitted over long distances at high voltage and low current?\n12. *(2)* What is meant by a wattless current? In which circuit is the whole current wattless?\n13. *(2)* A 60 W bulb is connected to a 220 V, 50 Hz supply. Find the peak voltage and the rms\n    current.\n\n### Answer key\n\n**1. (b) 7.07 A.** i_rms = i₀/√2 = 10/1.414 = 7.07 A.\n\n**2. (b) leads the voltage by π/2.**\n\n**3. (c) zero.**\n\n**4. I_rms = 2.2 A, P = 484 W.** I = V/R = 220/100 = 2.2 A. For a pure resistor cos φ = 1, so\nP = VI = (220)(2.2) = 484 W. *(Or P = V²/R = 48400/100 = 484 W.)*\n\n**5.** **Inductive reactance** X_L = ωL = 2πfL is the opposition offered by an inductor to AC; it is\n**directly proportional to frequency**. **Capacitive reactance** X_C = 1/ωC = 1/(2πfC) is the\nopposition offered by a capacitor; it is **inversely proportional to frequency**. Both are measured in\nohms.\n\n**6. 19.9 Hz.** f₀ = 1/(2π√(LC)) = 1/(2π√(2 × 32 × 10⁻⁶)) = 1/(2π√(6.4 × 10⁻⁵))\n= 1/(2π × 8 × 10⁻³) = 1/(0.0503) ≈ 19.9 Hz.\n\n**7. Z = 50 Ω, φ = 36.9°, cos φ = 0.8.**\nZ = √(40² + (60 − 30)²) = √(1600 + 900) = √2500 = 50 Ω.\ntan φ = 30/40 = 0.75, so φ = 36.9°. cos φ = 40/50 = 0.8. Since X_L > X_C the circuit is inductive and\nthe voltage **leads** the current.\n\n**8.** Let v = v₀ sin ωt and i = i₀ sin(ωt − φ). Then\nP = vi = v₀i₀ sin ωt sin(ωt − φ) = (v₀i₀/2)[cos φ − cos(2ωt − φ)].\nAveraging over a full cycle, ⟨cos(2ωt − φ)⟩ = 0, so\nP_avg = (v₀i₀/2) cos φ = (v₀/√2)(i₀/√2) cos φ = **V_rms I_rms cos φ**. ∎\n\n**9. V_s = 1100 V, I_s = 1 A.** V_s/V_p = N_s/N_p = 500/100 = 5, so V_s = 5(220) = 1100 V.\nI_p/I_s = N_s/N_p = 5, so I_s = I_p/5 = 5/5 = 1 A. *(Check power: 220 × 5 = 1100 W = 1100 × 1 ✓)*\n\n**10.** Phasor diagram and derivation as in §3 Q1, giving Z = √(R² + (X_L − X_C)²).\nNumerically, ω = 2π(50) = 314.16 rad s⁻¹:\nX_L = ωL = (314.16)(0.1) = 31.4 Ω; X_C = 1/(ωC) = 1/[(314.16)(10⁻⁴)] = 31.8 Ω.\nZ = √(5² + (31.4 − 31.8)²) = √(25 + 0.16) = √25.16 ≈ **5.02 Ω**.\nI = V/Z = 200/5.02 ≈ **39.8 A**.\n*(Note X_L ≈ X_C here, so the circuit is very close to resonance and Z ≈ R — hence the large current.)*\n\n**11.** The power lost in the transmission line is **I²R**, where R is the resistance of the line. For\na given power P = VI, transmitting at a **high voltage** means a proportionately **low current**, and\nsince the loss goes as I², reducing the current by a factor of 100 reduces the loss by a factor of\n**10 000**. Transformers make this practical: step-up at the generating station, step-down near the\nconsumer.\n\n**12.** The **wattless current** is the component of the AC current that is **perpendicular** to the\nvoltage phasor, i.e. I_rms sin φ; it consumes **no average power** over a complete cycle. The\n**whole** current is wattless in a **purely inductive** or a **purely capacitive** circuit, where\nφ = 90° and so the power factor cos φ = 0.\n\n**13. Peak voltage ≈ 311 V; I_rms ≈ 0.27 A.**\nv₀ = √2 V_rms = 1.414 × 220 = 311 V.\nFor a bulb (essentially resistive), P = V_rms I_rms, so I_rms = 60/220 = 0.273 A.\n\n**Scoring.** Out of 29. Below 20 → the phasor diagram is the priority. Draw it and derive Z from\nmemory five times; that single derivation is worth 5 marks nearly every year.\n\n---","tips":"**On the series-LCR 5-marker**\n\n1. **Draw the phasor diagram, properly labelled.** V_R along the current, V_L up, V_C down, the\n   resultant V, and the angle φ. It is worth 1–2 of the 5 marks and is marked **independently** of the\n   algebra — so draw it even if you cannot finish the derivation.\n\n2. **State that the same current flows through all three elements**, and that the current is taken as\n   the reference phasor. That sentence is why the diagram is drawn the way it is.\n\n3. **Give the phase relation for each element in words:** V_R in phase with I, V_L leads I by 90°,\n   V_C lags I by 90°. Three statements, and they are marked.\n\n4. **Show V = √(V_R² + (V_L − V_C)²) before substituting** IR, IX_L, IX_C. Then factor out I to get\n   Z. Do not write Z down directly.\n\n5. **Answer the resonance sub-part** — it is asked almost every time: current is maximum when Z is\n   minimum, which needs X_L = X_C, giving ω₀ = 1/√(LC).\n\n**On resonance and Q**\n\n6. **Both resonance curves must peak at the same f₀.** A common error is drawing the low-R curve\n   shifted sideways. R affects the *height and width*, not the position.\n\n7. **Label the axes and mark f₀.** And label which curve is the smaller R.\n\n8. **Say Q ∝ 1/R and what that means physically** — smaller R, sharper resonance, more selective\n   circuit. The physical interpretation is the mark.\n\n**On the transformer**\n\n9. **The diagram must show a closed laminated core** with primary and secondary on it, labelled. A\n   sketch with two unconnected coils loses the mark.\n\n10. **Derive from ε = −N dφ/dt for each coil and then divide.** Writing V_s/V_p = N_s/N_p without the\n    two Faraday equations is not a derivation.\n\n11. **State the ideal-transformer power assumption explicitly** before using V_p I_p = V_s I_s.\n\n12. **Pair each loss with its remedy.** Eddy → laminated core; copper → thick wire; hysteresis → soft\n    iron; leakage → closed core with coils wound over each other. Marks are awarded for the pairs, so\n    never list losses without remedies.\n\n13. **Remember: a transformer does not increase power.** If asked \"does a step-up transformer violate\n    energy conservation?\", the answer is no — the current falls in the same proportion as the voltage\n    rises.\n\n**On numericals**\n\n14. **Compute ω = 2πf as a separate line** and use it for both reactances. Most numerical errors here\n    come from putting f where ω belongs.\n\n15. **Convert mH and μF first.** 200 mH = 0.2 H; 100 μF = 10⁻⁴ F. Note μF → F is 10⁻⁶.\n\n16. **All AC voltages and currents quoted in a question are rms unless stated otherwise.** So a \"220 V\n    supply\" gives I = 220/Z as an rms current. If asked for a peak value, multiply by √2.\n\n17. **Use P = V_rms I_rms cos φ, never V_rms I_rms alone**, unless the circuit is purely resistive or\n    at resonance. Omitting cos φ is the most common power-question error."}},{"id":"p8","subj":"physics","num":8,"title":"Electromagnetic Waves","unit":"Units V+VI · EM Waves & Optics","unitMarks":18,"prio":2,"appear":"Units V + VI (18 marks, shared with Ch 9 and Ch 10) · Typical appearance: 1–2 MCQs + a 2-mark question on the EM spectrum or the properties of EM waves. Small chapter, reliable marks — the best marks-per-page ratio in the book.","deleted":"Nothing substantial. Note the phrase \"**qualitative ideas only**\" — you are not asked to derive the\nwave equation from Maxwell's equations, only to know the properties and be able to justify them.\n\n> **Why this chapter is worth your time.** It is two or three pages of content that reliably supplies\n> 2–4 marks, mostly in Sections A and B, and the marks come from a single memorised table. Learn the\n> spectrum table cold and you have banked them.","recall":"```\nDISPLACEMENT CURRENT : I_d = ε₀ dφ_E/dt\n  needed because Ampere's law is inconsistent for a CHARGING CAPACITOR\n  Ampere–Maxwell : ∮B·dl = μ₀(I_c + ε₀ dφ_E/dt)\n  a CHANGING ELECTRIC FIELD produces a MAGNETIC FIELD\n\nEM WAVE PROPERTIES\n  transverse ; E ⊥ B ⊥ direction of propagation (direction along E × B)\n  need NO medium ;  c = 1/√(μ₀ε₀) = 3 × 10⁸ m s⁻¹ ;  c = E₀/B₀\n  E and B in phase ;  not deflected by E or B fields (no charge)\n  carry energy AND momentum → radiation pressure\n  energy shared EQUALLY between the E and B fields\n  produced by ACCELERATING charges\n  in a medium : v = c/n ,  λ → λ/n ,  FREQUENCY UNCHANGED\n\nSPECTRUM ORDER (increasing frequency / decreasing wavelength):\n  RADIO → MICROWAVE → INFRARED → VISIBLE → ULTRAVIOLET → X-RAY → GAMMA\n  visible: violet ≈ 400 nm (highest f)  ...  red ≈ 700 nm (lowest f)\n\nc = νλ ;  E_photon = hν = hc/λ\n```","s":{"scope":"### In the syllabus\n\n- **Basic idea of displacement current**\n- **Electromagnetic waves**, their **characteristics**, their **transverse nature** (qualitative ideas\n  only)\n- **Electromagnetic spectrum** — radio waves, microwaves, infrared, visible, ultraviolet, X-rays,\n  gamma rays — including **elementary facts about their uses**\n\n### Deleted\n\nNothing substantial. Note the phrase \"**qualitative ideas only**\" — you are not asked to derive the\nwave equation from Maxwell's equations, only to know the properties and be able to justify them.\n\n> **Why this chapter is worth your time.** It is two or three pages of content that reliably supplies\n> 2–4 marks, mostly in Sections A and B, and the marks come from a single memorised table. Learn the\n> spectrum table cold and you have banked them.\n\n---","brief":"### Displacement current — why Ampere's law needed fixing\n\n**The problem.** Consider a **capacitor being charged**. A current flows in the wires, but **no charge\ncrosses the gap** between the plates.\n\nApply Ampere's law, ∮**B**·d**l** = μ₀I, to a circular loop around the wire, and choose two different\nsurfaces bounded by that loop:\n\n- A surface that the **wire** pierces → the enclosed conduction current is I, so ∮**B**·d**l** = μ₀I.\n- A surface that passes **between the plates** → no conduction current pierces it, so\n  ∮**B**·d**l** = 0.\n\nThe same loop gives two different answers. **Ampere's law, as originally stated, is inconsistent.**\n\n**Maxwell's resolution.** Between the plates there is no conduction current, but there **is a\nchanging electric field**, and hence a changing electric flux. Maxwell proposed that a changing\nelectric flux is itself equivalent to a current — the **displacement current**:\n\n```\n      I_d = ε₀ (dφ_E/dt)\n```\n\nwhere φ_E is the electric flux.\n\n**The corrected law — the Ampere–Maxwell law
