ines = (−2/6, −4/6, 4/6) = (−1/3, −2/3, 2/3). *Check: 1/9 + 4/9 + 4/9 = 1 ✓*\n\n**12. 3î + ĵ + k̂.** Midpoint = ((2+4)/2)î + ((3−1)/2)ĵ + ((−1+3)/2)k̂ = 3î + ĵ + k̂.\n\n**13. c = (5/3)î + (2/3)ĵ + (2/3)k̂.**\nLet **c** = c₁î + c₂ĵ + c₃k̂.\n**a**·**c** = c₁ + c₂ + c₃ = 3   …(i)\n**a** × **c** = î(c₃ − c₂) − ĵ(c₃ − c₁) + k̂(c₂ − c₁) = 0î + ĵ − k̂\n⟹ c₃ − c₂ = 0 …(ii);  −(c₃ − c₁) = 1 ⟹ c₁ − c₃ = 1 …(iii);  c₂ − c₁ = −1 …(iv)\nFrom (ii): c₂ = c₃. From (iv): c₁ = c₂ + 1 = c₃ + 1, consistent with (iii).\nSubstituting into (i): (c₃ + 1) + c₃ + c₃ = 3 ⟹ 3c₃ = 2 ⟹ c₃ = 2/3, c₂ = 2/3, c₁ = 5/3.\n\n**Scoring.** Out of 26. Below 19 → the loss is almost certainly the cross-product determinant sign\npattern (the middle term is **minus**). Redo §3 Q5, Q9 and Q13.\n\n---","tips":"1. **Write vectors with the arrow or in î ĵ k̂ form in your final answer.** A vector answer written as\n   a bare triple, or without the hats, loses the last mark. The marking scheme distinguishes vector\n   answers from scalar ones.\n\n2. **State whether your answer is a scalar or a vector.** Dot product → scalar. Cross product →\n   vector. Projection → scalar. Area → scalar. Unit vector → vector. If your \"area\" has an î in it,\n   you forgot to take the magnitude.\n\n3. **Compute the cross product as a determinant, written out.** Do not attempt it component by\n   component from memory. And **the middle term carries a minus sign** — write −ĵ(…) explicitly. This\n   is the single commonest error in the chapter.\n\n4. **Projection divides by the magnitude of the vector you project *onto*.** Projection of **a** on\n   **b** is **a**·**b**/|**b**|. Write the formula down before substituting.\n\n5. **For \"find a unit vector perpendicular to both\", the answer is (a × b)/|a × b|** — two steps, and\n   both are marked. Note that the negative is also valid, and saying so shows understanding.\n\n6. **Area: know which of the two formulas applies.** Adjacent sides → |**a**×**b**|. Diagonals →\n   ½|**d₁**×**d₂**|. Triangle from two sides → ½|**a**×**b**|. Read the question for which is given.\n\n7. **For a triangle from three vertices, form both side vectors from the *same* vertex.** AB and AC,\n   not AB and BC (which also works but is easier to get wrong).\n\n8. **For perpendicularity/parallelism questions, state the condition first.** \"Since the vectors are\n   perpendicular, **a**·**b** = 0\" and then substitute. The condition line is a mark.\n\n9. **Verify direction cosines with l² + m² + n² = 1.** Five seconds, and it catches any arithmetic\n   error in |**a**|.\n\n10. **Rationalise or leave surds tidily.** 10/√6 is acceptable; (5√6)/3 is tidier. Both score. Do\n    not convert to a decimal.\n\n11. **Use the identity |a×b|² + (a·b)² = |a|²|b|² whenever a question gives you three of the four\n    quantities.** It turns a two-step trigonometric argument into one line, and it is exactly why\n    CBSE sets those 2-markers.\n\n12. **For \"find c such that a × c = b and a·c = k\", set up c = c₁î + c₂ĵ + c₃k̂ and get three\n    simultaneous equations.** Label them (i)–(iv) and solve systematically. Trying to guess **c**\n    wastes the question."}},{"id":"m11","subj":"maths","num":11,"title":"Three Dimensional Geometry","unit":"Unit IV · Vectors & 3D","unitMarks":14,"prio":1,"appear":"Unit IV Vectors and 3D Geometry (14 marks, shared with Ch 10) · Typical appearance: 1–2 MCQs + one 3-mark question, and very often a 5-marker (shortest distance between skew lines, or foot of perpendicular / image of a point).","deleted":"**Every plane topic is out.** Specifically:\n\n- Equation of a plane (vector, Cartesian, normal form, intercept form)\n- Plane through three points; plane through the intersection of two planes\n- **Angle between two planes**\n- **Angle between a line and a plane**\n- **Distance of a point from a plane**\n- **Coplanarity** of two lines\n- Distance between parallel planes\n\n> **Read this twice.** Roughly half of every pre-2023 3D Geometry question involved a plane, so\n> older question banks, sample papers and video playlists are heavily contaminated. If a practice\n> question mentions a plane, an equation like ax + by + cz + d = 0, or a normal vector, **skip it**.\n>\n> The upside: the surviving topic list is short and every question comes from one of five templates,\n> listed below.","recall":"```\nDRs of AB = (x₂−x₁, y₂−y₁, z₂−z₁);  divide by |AB| for direction cosines;  l²+m²+n² = 1\n\nLINE:  r = a + λb        (x−x₁)/a₁ = (y−y₁)/a₂ = (z−z₁)/a₃\n       through two points: r = a + λ(b−a)\n       general point: (a₁λ+x₁, a₂λ+y₁, a₃λ+z₁)\n\nANGLE: cos θ = |b₁·b₂|/(|b₁||b₂|)          ← MODULUS (acute angle convention)\n       ⊥ : a₁a₂+b₁b₂+c₁c₂ = 0      ∥ : a₁/a₂ = b₁/b₂ = c₁/c₂\n\nSKEW distance:      d = |(b₁×b₂)·(a₂−a₁)| / |b₁×b₂|\nPARALLEL distance:  d = |b×(a₂−a₁)| / |b|\nd = 0  ⟹  the lines intersect\n\nFOOT of ⊥ from P: general point Q(λ) → PQ·b = 0 → solve λ → Q\nIMAGE of P:       P′ = 2Q − P\n```","s":{"scope":"### In the syllabus — **lines only**\n\n- **Direction cosines and direction ratios** of a line joining two points\n- **Cartesian and vector equations of a line**\n- **Skew lines**\n- **Shortest distance between two lines**\n- **Angle between two lines**\n\n### Deleted — do not study\n\n**Every plane topic is out.** Specifically:\n\n- Equation of a plane (vector, Cartesian, normal form, intercept form)\n- Plane through three points; plane through the intersection of two planes\n- **Angle between two planes**\n- **Angle between a line and a plane**\n- **Distance of a point from a plane**\n- **Coplanarity** of two lines\n- Distance between parallel planes\n\n> **Read this twice.** Roughly half of every pre-2023 3D Geometry question involved a plane, so\n> older question banks, sample papers and video playlists are heavily contaminated. If a practice\n> question mentions a plane, an equation like ax + by + cz + d = 0, or a normal vector, **skip it**.\n>\n> The upside: the surviving topic list is short and every question comes from one of five templates,\n> listed below.\n\n---","brief":"### Direction cosines and direction ratios of a line\n\nFor a line through A(x₁, y₁, z₁) and B(x₂, y₂, z₂):\n\n```\nDirection ratios (DRs):   (x₂ − x₁, y₂ − y₁, z₂ − z₁)\n```\n\nDivide by the magnitude √[(x₂−x₁)² + (y₂−y₁)² + (z₂−z₁)²] to get the **direction cosines**\n(l, m, n), which satisfy\n\n```\n      l² + m² + n² = 1\n```\n\nDirection ratios are not unique — any non-zero scalar multiple of (a, b, c) is an equally valid set.\nDirection cosines are unique up to overall sign.\n\n### Equations of a line\n\n**Through a point A(position vector a) with direction vector b:**\n\n```\nVector form:      r = a + λ b                      (λ ∈ R, a parameter)\n\nCartesian form:   (x − x₁)/a₁  =  (y − y₁)/a₂  =  (z − z₁)/a₃\n```\n\nwhere b = a₁î + a₂ĵ + a₃k̂ and A = (x₁, y₁, z₁).\n\n**Through two points A(a) and B(b):**\n\n```\nVector form:      r = a + λ(b − a)\n\nCartesian form:   (x − x₁)/(x₂ − x₁)  =  (y − y₁)/(y₂ − y₁)  =  (z − z₁)/(z₂ − z₁)\n```\n\n**Reading the Cartesian form.** From\n\n```\n      (x − 2)/3 = (y + 1)/(−2) = (z − 4)/5\n```\n\nyou read off: the line passes through **(2, −1, 4)** and has direction ratios **(3, −2, 5)**. Note\nthe sign flip on the y-coordinate: (y + 1) means y₁ = −1.\n\n**A common trap in the Cartesian form.** If a denominator would be zero, the form is written with a\nseparate equation. For instance a line through (1, 2, 3) with DRs (0, 1, 2) is written\n`x = 1, (y − 2)/1 = (z − 3)/2`. Never write a zero denominator.\n\n**The general point on a line.** From (x − x₁)/a₁ = (y − y₁)/a₂ = (z − z₁)/a₃ = λ, the general point\nis\n\n```\n      (a₁λ + x₁,  a₂λ + y₁,  a₃λ + z₁)\n```\n\nThis parametrisation is the engine of half the questions in this chapter — intersections, feet of\nperpendiculars, and images all start here.\n\n### Angle between two lines\n\nIf the lines have direction vectors **b₁** and **b₂**:\n\n```\n      cos θ = | b₁ · b₂ | / ( |b₁| |b₂| )\n```\n\nIn Cartesian terms, with DRs (a₁, b₁, c₁) and (a₂, b₂, c₂):\n\n```\n      cos θ = | a₁a₂ + b₁b₂ + c₁c₂ | / [ √(a₁²+b₁²+c₁²) · √(a₂²+b₂²+c₂²) ]\n```\n\n> **The modulus matters.** By convention the angle between two lines is taken as the acute one, so\n> we use the absolute value of the dot product. (For the angle between two *vectors*, in Ch 10, you\n> do **not** take the modulus — a negative dot product genuinely means an obtuse angle. Know the\n> difference.)\n\n**Special cases:**\n\n```\nPerpendicular:   a₁a₂ + b₁b₂ + c₁c₂ = 0\nParallel:        a₁/a₂ = b₁/b₂ = c₁/c₂\n```\n\n### Skew lines\n\nTwo lines in space are **skew** if they are **neither parallel nor intersecting**. Skew lines do not\nlie in a common plane. In 2D this cannot happen; it is a genuinely three-dimensional phenomenon.\n\n### Shortest distance — the two formulas\n\n**Between two skew lines** r = a₁ + λb₁ and r = a₂ + μb₂:\n\n```\n      d  =  | (b₁ × b₂) · (a₂ − a₁) |  /  | b₁ × b₂ |\n```\n\n**Between two parallel lines** r = a₁ + λb and r = a₂ + μb (same direction vector b):\n\n```\n      d  =  | b × (a₂ − a₁) |  /  | b |\n```\n\n> **Which formula?** Check whether the direction vectors are proportional. If they are, the lines are\n> parallel and the skew formula fails (it gives 0/0, since **b₁** × **b₂** = **0**). Making this check\n> explicitly, and saying which case you are in, is a mark.\n\n**If d = 0**, the lines **intersect**. So the skew-distance formula doubles as an intersection test.\n\n### The five templates — every question in this chapter\n\n**Template 1 — Equation of a line.** Given a point and either a direction or a second point. Write\nboth vector and Cartesian forms unless told otherwise.\n\n**Template 2 — Angle between two lines.** Extract the DRs, apply the cos θ formula with a modulus.\n\n**Template 3 — Shortest distance.** Identify a₁, b₁, a₂, b₂; check parallel or skew; apply the\nmatching formula.\n\n**Template 4 — Foot of the perpendicular from a point P to a line.** Procedure:\n\n1. Write the **general point Q** on the line in terms of λ.\n2. Form the vector **PQ** = Q − P.\n3. Impose **PQ · b = 0** (since PQ must be perpendicular to the line's direction).\n4. Solve for λ, and substitute back to get Q — the foot of the perpendicular.\n5. If asked, the perpendicular distance is |**PQ**|.\n\n**Template 5 — Image of a point P in a line.** Find the foot of the perpendicular Q by Template 4;\nthen Q is the **midpoint** of P and its image P′, so\n\n```\n      P′ = 2Q − P\n```\n\ncomponent-wise. This is the whole of the extra work — two lines.\n\n**Bonus — show two lines intersect and find the point.** Write the general point of each line (in λ\nand μ), equate all three coordinates to get three equations in two unknowns, solve two of them, and\n**verify the third**. If the third is satisfied the lines intersect; if not, they are skew. The\nverification step is essential and is a mark.\n\n### Quick recall box\n\n```\nDRs of AB = (x₂−x₁, y₂−y₁, z₂−z₁);  divide by |AB| for direction cosines;  l²+m²+n² = 1\n\nLINE:  r = a + λb        (x−x₁)/a₁ = (y−y₁)/a₂ = (z−z₁)/a₃\n       through two points: r = a + λ(b−a)\n       general point: (a₁λ+x₁, a₂λ+y₁, a₃λ+z₁)\n\nANGLE: cos θ = |b₁·b₂|/(|b₁||b₂|)          ← MODULUS (acute angle convention)\n       ⊥ : a₁a₂+b₁b₂+c₁c₂ = 0      ∥ : a₁/a₂ = b₁/b₂ = c₁/c₂\n\nSKEW distance:      d = |(b₁×b₂)·(a₂−a₁)| / |b₁×b₂|\nPARALLEL distance:  d = |b×(a₂−a₁)| / |b|\nd = 0  ⟹  the lines intersect\n\nFOOT of ⊥ from P: general point Q(λ) → PQ·b = 0 → solve λ → Q\nIMAGE of P:       P′ = 2Q − P\n```\n\n---","pyq":"**Q1.** *(5 marks)* Find the shortest distance between the lines\n\n```\n      r = (î + 2ĵ + k̂) + λ(î − ĵ + k̂)          and          r = (2î − ĵ − k̂) + μ(2î + ĵ + 2k̂)\n```\n\n**Q2.** *(3 marks)* Find the angle between the lines\n\n```\n      (x − 2)/2 = (y − 1)/5 = (z + 3)/(−3)          and          (x + 2)/(−1) = (y − 4)/8 = (z − 5)/4\n```\n\n**Q3.** *(3 marks)* Find the vector and Cartesian equations of the line passing through the points\n(−1, 0, 2) and (3, 4, 6).\n\n**Q4.** *(5 marks)* Find the foot of the perpendicular drawn from the point P(1, 6, 3) to the line\nx/1 = (y − 1)/2 = (z − 2)/3. Also find the length of the perpendicular.\n\n**Q5.** *(5 marks)* Find the image of the point (1, 6, 3) in the line x/1 = (y − 1)/2 = (z − 2)/3.\n\n**Q6.** *(5 marks)* Show that the lines\n\n```\n      (x − 1)/2 = (y − 2)/3 = (z − 3)/4          and          (x − 4)/5 = (y − 1)/2 = z/1\n```\n\nintersect, and find their point of intersection.\n\n**Q7.** *(3 marks)* Find the shortest distance between the parallel lines\n\n```\n      r = (î + 2ĵ + 3k̂) + λ(2î + 3ĵ + 6k̂)          and          r = (3î + 3ĵ − 5k̂) + μ(2î + 3ĵ + 6k̂)\n```\n\n**Q8.** *(2 marks)* Find the direction cosines of the line joining A(2, −1, 3) and B(4, 3, −1).\n\n**Q9.** *(2 marks)* Find the value of p so that the lines\n\n```\n      (x − 1)/3 = (y − 2)/(2p) = (z − 3)/2          and          (x − 1)/(3p) = (y − 5)/1 = (z − 6)/(−5)\n```\n\nare perpendicular.\n\n**Q10.** *(2 marks)* Find the equation of the line passing through (2, −1, 3) and parallel to the\nline r = (î − 2ĵ + k̂) + λ(2î + 3ĵ − k̂).\n\n**Q11.** *(1 mark, MCQ)* The direction ratios of the line (x − 3)/2 = (2y − 1)/4 = z are\n(a) (2, 4, 1) (b) (2, 2, 1) (c) (3, 1, 0) (d) (2, 4, 0)\n\n---","sol":"### Q1 — shortest distance between two skew lines\n\n**Identify the four ingredients:**\n\n```\n      a₁ = î + 2ĵ + k̂          b₁ = î − ĵ + k̂\n      a₂ = 2î − ĵ − k̂          b₂ = 2î + ĵ + 2k̂\n```\n\n**Check:** are they parallel? (1, −1, 1) and (2, 1, 2) are not proportional, so the lines are **not\nparallel** — use the skew formula.\n\n**Compute a₂ − a₁:**\n\n```\n      a₂ − a₁ = (2 − 1)î + (−1 − 2)ĵ + (−1 − 1)k̂ = î − 3ĵ − 2k̂\n```\n\n**Compute b₁ × b₂:**\n\n```\n                | î   ĵ   k̂ |\n      b₁ × b₂ = | 1  −1   1 |\n                | 2   1   2 |\n\n              = î[(−1)(2) − (1)(1)] − ĵ[(1)(2) − (1)(2)] + k̂[(1)(1) − (−1)(2)]\n              = î(−2 − 1) − ĵ(2 − 2) + k̂(1 + 2)\n              = −3î + 0ĵ + 3k̂\n```\n\n```\n      |b₁ × b₂| = √(9 + 0 + 9) = √18 = 3√2\n```\n\n**Compute the numerator:**\n\n```\n      (b₁ × b₂) · (a₂ − a₁) = (−3)(1) + (0)(−3) + (3)(−2) = −3 + 0 − 6 = −9\n```\n\n**Apply the formula:**\n\n```\n      d = |−9| / (3√2) = 9/(3√2) = 3/√2 = (3√2)/2\n```\n\n```\nShortest distance = 3/√2 = 3√2/2 units          ≈ 2.12 units\n```\n\n*(Since d ≠ 0, the lines are indeed skew — they neither meet nor are parallel.)*\n\n### Q2 — angle between two lines\n\n**Extract the direction ratios** from the Cartesian forms:\n\n```\n      b₁ = (2, 5, −3)          b₂ = (−1, 8, 4)\n```\n\n```\n      b₁ · b₂ = (2)(−1) + (5)(8) + (−3)(4) = −2 + 40 − 12 = 26\n\n      |b₁| = √(4 + 25 + 9) = √38\n      |b₂| = √(1 + 64 + 16) = √81 = 9\n```\n\n```\n      cos θ = |26| / (9√38) = 26/(9√38)\n```\n\n```\nθ = cos⁻¹( 26/(9√38) )          ≈ cos⁻¹(0.469) ≈ 62.0°\n```\n\n### Q3 — line through (−1, 0, 2) and (3, 4, 6)\n\n**Direction vector:**\n\n```\n      b = (3 − (−1))î + (4 − 0)ĵ + (6 − 2)k̂ = 4î + 4ĵ + 4k̂\n```\n\nDivide by 4 (direction ratios are only defined up to a scalar):\n\n```\n      b = î + ĵ + k̂\n```\n\n**Vector equation**, taking a = −î + 0ĵ + 2k̂:\n\n```\n      r = (−î + 2k̂) + λ(î + ĵ + k̂)\n```\n\n**Cartesian equation:**\n\n```\n      (x + 1)/1 = (y − 0)/1 = (z − 2)/1\n```\n\ni.e.\n\n```\n      x + 1 = y = z − 2\n```\n\n### Q4 — foot of the perpendicular from P(1, 6, 3)\n\nThe line is x/1 = (y − 1)/2 = (z − 2)/3, so it passes through (0, 1, 2) with DRs **b** = (1, 2, 3).\n\n**Step 1 — general point Q on the line.** Set each ratio equal to λ:\n\n```\n      Q = (λ, 2λ + 1, 3λ + 2)\n```\n\n**Step 2 — the vector PQ:**\n\n```\n      PQ = Q − P = (λ − 1, 2λ + 1 − 6, 3λ + 2 − 3) = (λ − 1, 2λ − 5, 3λ − 1)\n```\n\n**Step 3 — impose PQ ⊥ b, i.e. PQ · b = 0:**\n\n```\n      (λ − 1)(1) + (2λ − 5)(2) + (3λ − 1)(3) = 0\n⟹     λ − 1 + 4λ − 10 + 9λ − 3 = 0\n⟹     14λ − 14 = 0\n⟹     λ = 1\n```\n\n**Step 4 — substitute back:**\n\n```\n      Q = (1, 2(1) + 1, 3(1) + 2) = (1, 3, 5)\n```\n\n**The foot of the perpendicular is (1, 3, 5).**\n\n**Step 5 — length of the perpendicular:**\n\n```\n      PQ = (1 − 1, 3 − 6, 5 − 3) = (0, −3, 2)\n\n      |PQ| = √(0 + 9 + 4) = √13\n```\n\n**The length of the perpendicular is √13 units.**\n\n### Q5 — image of (1, 6, 3) in the same line\n\nFrom Q4, the foot of the perpendicular is **Q(1, 3, 5)**.\n\nQ is the **midpoint** of P(1, 6, 3) and its image P′(x′, y′, z′). So\n\n```\n      (1 + x′)/2 = 1   ⟹   x′ = 1\n      (6 + y′)/2 = 3   ⟹   y′ = 0\n      (3 + z′)/2 = 5   ⟹   z′ = 7\n```\n\n*(Equivalently P′ = 2Q − P = (2 − 1, 6 − 6, 10 − 3) = (1, 0, 7).)*\n\n**The image of (1, 6, 3) in the line is (1, 0, 7).**\n\n*Check:* the midpoint of (1, 6, 3) and (1, 0, 7) is (1, 3, 5) = Q ✓\n\n### Q6 — show the lines intersect, and find the point\n\n**General point on line 1** (setting each ratio equal to λ):\n\n```\n      P₁ = (2λ + 1, 3λ + 2, 4λ + 3)\n```\n\n**General point on line 2** (setting each ratio equal to μ):\n\n```\n      P₂ = (5μ + 4, 2μ + 1, μ)\n```\n\n**If the lines intersect, some λ and μ make P₁ = P₂.** Equating coordinates:\n\n```\n      2λ + 1 = 5μ + 4          …(i)\n      3λ + 2 = 2μ + 1          …(ii)\n      4λ + 3 = μ               …(iii)\n```\n\n**Solve (ii) and (iii).** Substitute μ from (iii) into (ii):\n\n```\n      3λ + 2 = 2(4λ + 3) + 1\n⟹     3λ + 2 = 8λ + 7\n⟹     −5λ = 5\n⟹     λ = −1\n```\n\nThen from (iii): μ = 4(−1) + 3 = **−1**.\n\n**Verify in (i)** — this step is essential:\n\n```\n      LHS = 2(−1) + 1 = −1\n      RHS = 5(−1) + 4 = −1          ✓\n```\n\nAll three equations are satisfied, so **the lines intersect**.\n\n**Point of intersection** (substituting λ = −1 into P₁):\n\n```\n      (2(−1) + 1, 3(−1) + 2, 4(−1) + 3) = (−1, −1, −1)\n```\n\n**The lines intersect at (−1, −1, −1).**\n\n*Check with P₂ at μ = −1: (5(−1) + 4, 2(−1) + 1, −1) = (−1, −1, −1) ✓*\n\n### Q7 — shortest distance between parallel lines\n\n**Check they are parallel:** both have direction vector **b** = 2î + 3ĵ + 6k̂. **Parallel.** So use\nthe parallel-lines formula.\n\n```\n      a₁ = î + 2ĵ + 3k̂          a₂ = 3î + 3ĵ − 5k̂\n\n      a₂ − a₁ = 2î + ĵ − 8k̂\n```\n\n```\n                      | î   ĵ   k̂ |\n      b × (a₂ − a₁) = | 2   3   6 |\n                      | 2   1  −8 |\n\n                    = î[(3)(−8) − (6)(1)] − ĵ[(2)(−8) − (6)(2)] + k̂[(2)(1) − (3)(2)]\n                    = î(−24 − 6) − ĵ(−16 − 12) + k̂(2 − 6)\n                    = −30î + 28ĵ − 4k̂\n```\n\n```\n      |b × (a₂ − a₁)| = √(900 + 784 + 16) = √1700 = 10√17\n\n      |b| = √(4 + 9 + 36) = √49 = 7\n```\n\n```\n      d = 10√17 / 7\n```\n\n```\nShortest distance = 10√17/7 units          ≈ 5.89 units\n```\n\n### Q8 — direction cosines of AB, A(2, −1, 3), B(4, 3, −1)\n\n```\n      AB = (4 − 2, 3 − (−1), −1 − 3) = (2, 4, −4)\n\n      |AB| = √(4 + 16 + 16) = √36 = 6\n```\n\n```\n      Direction cosines = (2/6, 4/6, −4/6) = (1/3, 2/3, −2/3)\n```\n\n*Check:* 1/9 + 4/9 + 4/9 = 9/9 = 1 ✓\n\n### Q9 — find p for perpendicularity\n\nDRs: **b₁** = (3, 2p, 2) and **b₂** = (3p, 1, −5).\n\nPerpendicular ⟺ **b₁**·**b₂** = 0:\n\n```\n      (3)(3p) + (2p)(1) + (2)(−5) = 0\n⟹     9p + 2p − 10 = 0\n⟹     11p = 10\n⟹     p = 10/11\n```\n\n### Q10 — line through (2, −1, 3) parallel to a given line\n\nA parallel line has the **same direction vector**, **b** = 2î + 3ĵ − k̂. The position vector of the\ngiven point is **a** = 2î − ĵ + 3k̂.\n\n**Vector form:**\n\n```\n      r = (2î − ĵ + 3k̂) + λ(2î + 3ĵ − k̂)\n```\n\n**Cartesian form:**\n\n```\n      (x − 2)/2 = (y + 1)/3 = (z − 3)/(−1)\n```\n\n### Q11 — direction ratios of (x − 3)/2 = (2y − 1)/4 = z\n\nThe middle term is not in standard form — the coefficient of y must be 1. Rewrite:\n\n```\n      (2y − 1)/4 = 2(y − ½)/4 = (y − ½)/2\n```\n\nSo the line is\n\n```\n      (x − 3)/2 = (y − ½)/2 = (z − 0)/1\n```\n\ngiving direction ratios **(2, 2, 1)**.\n\n**Answer: (b) (2, 2, 1)**\n\n> This is a favourite trap. Always normalise so that the coefficient of x, y and z inside each\n> bracket is 1 before reading off the direction ratios.\n\n---","test":"Time: 50 minutes. Answers below.\n\n1. *(1)* The direction ratios of the line (x + 1)/3 = (y − 2)/(−1) = (z + 4)/2 are\n   (a) (−1, 2, −4) (b) (3, −1, 2) (c) (1, −2, 4) (d) (3, 1, 2)\n2. *(1)* Two lines with direction ratios (1, 2, 3) and (−2, 1, 0) are\n   (a) parallel (b) perpendicular (c) neither (d) coincident\n3. *(1)* If the direction cosines of a line are (1/√3, 1/√3, k), then k is\n   (a) 1/√3 (b) ±1/√3 (c) 1/3 (d) 0\n4. *(2)* Find the direction cosines of the line joining (1, 0, 0) and (0, 1, 1).\n5. *(2)* Find the Cartesian equation of the line r = (2î − ĵ + 4k̂) + λ(î + 2ĵ − k̂).\n6. *(2)* Find the vector equation of the line through (1, 2, 3) and (4, 5, 6).\n7. *(3)* Find the angle between the lines with direction ratios (2, 2, 1) and (4, 1, 8).\n8. *(3)* Find k so that the lines (x − 1)/(−3) = (y − 2)/(2k) = (z − 3)/2 and\n   (x − 1)/(3k) = (y − 1)/1 = (z − 6)/(−5) are perpendicular.\n9. *(5)* Find the shortest distance between the lines\n   r = (î + ĵ) + λ(2î − ĵ + k̂) and r = (2î + ĵ − k̂) + μ(3î − 5ĵ + 2k̂).\n10. *(5)* Find the foot of the perpendicular and the perpendicular distance from P(2, 3, 4) to the\n    line (x + 3)/3 = (y − 2)/6 = z/2.\n11. *(5)* Show that the lines (x + 1)/3 = (y + 3)/5 = (z + 5)/7 and (x − 2)/1 = (y − 4)/3 = (z − 6)/5\n    intersect, and find the point.\n12. *(3)* Find the shortest distance between the parallel lines\n    r = (î + ĵ − k̂) + λ(î − ĵ + k̂) and r = (2î − ĵ + k̂) + μ(î − ĵ + k̂).\n13. *(2)* Find the point on the line (x − 1)/2 = (y + 1)/3 = z/1 corresponding to the parameter\n    value λ = 2.\n\n### Answer key\n\n**1. (b) (3, −1, 2).**\n\n**2. (b) perpendicular.** Dot product = (1)(−2) + (2)(1) + (3)(0) = −2 + 2 + 0 = 0.\n*(Always compute the dot product before choosing — \"neither\" is the distractor here.)*\n\n**3. (b) ±1/√3.** l² + m² + n² = 1 ⟹ 1/3 + 1/3 + k² = 1 ⟹ k² = 1/3 ⟹ k = ±1/√3.\n\n**4. (−1/√3, 1/√3, 1/√3).** AB = (−1, 1, 1), |AB| = √3.\n\n**5. (x − 2)/1 = (y + 1)/2 = (z − 4)/(−1).**\n\n**6. r = (î + 2ĵ + 3k̂) + λ(3î + 3ĵ + 3k̂), or with b simplified to î + ĵ + k̂.**\n\n**7. cos⁻¹(2/3).** DRs (2, 2, 1) and (4, 1, 8): dot = 8 + 2 + 8 = 18; magnitudes 3 and 9.\ncos θ = 18/27 = 2/3. θ = cos⁻¹(2/3) ≈ 48.2°.\n\n**8. k = −10/7.** Dot = (−3)(3k) + (2k)(1) + (2)(−5) = −9k + 2k − 10 = −7k − 10 = 0 ⟹ k = −10/7.\n\n**9. 10/√59.** a₂ − a₁ = î + 0ĵ − k̂. b₁ = (2, −1, 1), b₂ = (3, −5, 2).\nb₁ × b₂ = î((−1)(2) − (1)(−5)) − ĵ((2)(2) − (1)(3)) + k̂((2)(−5) − (−1)(3))\n= î(−2 + 5) − ĵ(4 − 3) + k̂(−10 + 3) = 3î − ĵ − 7k̂. |b₁ × b₂| = √(9 + 1 + 49) = √59.\n(b₁ × b₂)·(a₂ − a₁) = 3(1) + (−1)(0) + (−7)(−1) = 3 + 7 = 10.\n**d = 10/√59 ≈ 1.30 units.**\n\n**10. Foot = (−60/49, 272/49, 58/49); distance ≈ 4.98 units.**\nGeneral point Q = (3λ − 3, 6λ + 2, 2λ).\nPQ = (3λ − 5, 6λ − 1, 2λ − 4). PQ·(3, 6, 2) = 9λ − 15 + 36λ − 6 + 4λ − 8 = 49λ − 29 = 0 ⟹ λ = 29/49.\nQ = (3(29/49) − 3, 6(29/49) + 2, 2(29/49)) = (87/49 − 147/49, 174/49 + 98/49, 58/49)\n= (−60/49, 272/49, 58/49).\nPQ = (−60/49 − 98/49, 272/49 − 147/49, 58/49 − 196/49) = (−158/49, 125/49, −138/49).\n|PQ| = (1/49)√(24964 + 15625 + 19044) = (1/49)√59633 ≈ 244.2/49 ≈ 4.98 units.\n*(Not every such problem gives whole numbers — do not assume a slip when the answer is fractional.)*\n\n**11. They intersect at (½, −½, −3/2).**\nGeneral points: (3λ − 1, 5λ − 3, 7λ − 5) and (μ + 2, 3μ + 4, 5μ + 6).\n3λ − 1 = μ + 2 …(i);  5λ − 3 = 3μ + 4 …(ii);  7λ − 5 = 5μ + 6 …(iii).\nFrom (i): μ = 3λ − 3. Into (ii): 5λ − 3 = 3(3λ − 3) + 4 = 9λ − 5 ⟹ −4λ = −2 ⟹ λ = ½, μ = −3/2.\nCheck (iii): LHS = 7(½) − 5 = −3/2; RHS = 5(−3/2) + 6 = −15/2 + 12/2 = −3/2 ✓\n**Point of intersection = (3(½) − 1, 5(½) − 3, 7(½) − 5) = (½, −½, −3/2).**\n\n**12. √(2/3) = √6/3.** b = (1, −1, 1), |b| = √3. a₂ − a₁ = (1, −2, 2).\nb × (a₂ − a₁) = î((−1)(2) − (1)(−2)) − ĵ((1)(2) − (1)(1)) + k̂((1)(−2) − (−1)(1))\n= î(−2 + 2) − ĵ(2 − 1) + k̂(−2 + 1) = 0î − ĵ − k̂. |·| = √2.\n**d = √2/√3 = √6/3 ≈ 0.82 units.**\n\n**13. (5, 5, 2).** General point (2λ + 1, 3λ − 1, λ); at λ = 2 this is (5, 5, 2).\n\n**Scoring.** Out of 34. Below 24 → almost always the cross-product sign pattern or mis-reading DRs\nfrom the Cartesian form. Redo §3 Q1, Q4, Q11.\n\n---","tips":"1. **Write down a₁, b₁, a₂, b₂ as a labelled list before doing anything.** Four lines. Every\n   shortest-distance question is lost by mixing up which vector is which, and this prevents it\n   entirely.\n\n2. **Check parallel-vs-skew explicitly, and say which formula you are using.** \"The direction ratios\n   (1, −1, 1) and (2, 1, 2) are not proportional, so the lines are skew; using\n   d = |(b₁×b₂)·(a₂−a₁)|/|b₁×b₂| …\". That sentence is a mark and it stops you applying the wrong\n   formula.\n\n3. **Normalise the Cartesian form before reading direction ratios.** (2y − 1)/4 must become\n   (y − ½)/2. Anything with a coefficient on x, y or z inside the numerator needs this step.\n\n4. **Watch the signs when reading the point.** (y + 3)/5 means y₁ = **−3**, not +3.\n\n5. **Take the modulus in the angle formula.** cos θ = |**b₁**·**b₂**|/(|**b₁**||**b₂**|). Without it\n   you may report an obtuse angle where the convention wants the acute one.\n\n6. **For intersection questions, verify the third equation and say you are doing so.** Solving two of\n   three and stopping is worth about half the marks; the verification is what proves intersection\n   rather than skewness.\n\n7. **For foot-of-perpendicular questions, write the general point with a stated parameter.** \"Let\n   Q = (λ, 2λ + 1, 3λ + 2) be a general point on the line.\" Then PQ, then PQ·b = 0. Four visible\n   steps, four marks.\n\n8. **For the image, state that the foot is the midpoint.** \"Since Q is the midpoint of PP′, we have\n   P′ = 2Q − P.\" One line, and it is the mark that distinguishes this question from the previous one.\n\n9. **The cross product's middle term is negative.** Write −ĵ(…) explicitly. In this chapter that\n   error costs a full 5-mark question, since everything downstream depends on it.\n\n10. **Give the answer with units** — \"units\" for a distance, and put it in a final boxed line.\n\n11. **Do the arithmetic check when the answer is a point.** Substituting your intersection point or\n    your foot of perpendicular back into the line's equation takes twenty seconds and confirms the\n    whole question.\n\n12. **Do not be alarmed by fractional answers.** Feet of perpendiculars often come out as\n    thirds or forty-ninths. A messy fraction is not evidence of an error — recheck once, then trust\n    your working."}},{"id":"m12","subj":"maths","num":12,"title":"Linear Programming","unit":"Unit V · Linear Programming","unitMarks":5,"prio":1,"appear":"Unit V (5 marks) · Typical appearance: one 4- or 5-mark graphical question, plus sometimes a 1-mark corner-point MCQ. Completely templated — there is no excuse for losing marks here.","deleted":"- The named **problem types** as separate categories: diet problems, manufacturing problems,\n  transportation problems\n- Problems with **more than three** non-trivial constraints\n\n> **What \"three non-trivial constraints\" means for you.** Beyond x ≥ 0 and y ≥ 0 (the trivial ones),\n> you will never face more than three inequalities. That caps the feasible region at a small polygon\n> with at most five corner points. There is a hard ceiling on how difficult this question can be.","recall":"```\nZ = ax + by  is the objective function; the inequalities are the constraints.\n\nCORNER-POINT METHOD:\n  1. list constraints (incl. x ≥ 0, y ≥ 0)\n  2. boundary lines + intercepts\n  3. graph on graph paper, state scale, label lines\n  4. shade feasible region (test the origin for each inequality)\n  5. find corner points by SOLVING SIMULTANEOUS EQUATIONS (not by reading the graph)\n  6. table of Z at each corner\n  7. state optimum: value, point, max/min\n  8. if UNBOUNDED: check whether ax+by > M (or < m) meets the region\n\nBounded region  → max AND min both exist, at corners\nUnbounded region → may not exist; must check\nEqual Z at two corners → infinitely many optima, all along that segment\nContradictory constraints → empty feasible region → no feasible solution\n```","s":{"scope":"### In the syllabus\n\n- Introduction and related **terminology**: constraints, objective function, optimisation\n- **Graphical method** of solution for problems in **two variables**\n- **Feasible and infeasible regions** (bounded or unbounded)\n- Feasible and infeasible solutions; **optimal feasible solutions**\n- Restricted to **up to three non-trivial constraints**\n\n### Deleted — do not study\n\n- The named **problem types** as separate categories: diet problems, manufacturing problems,\n  transportation problems\n- Problems with **more than three** non-trivial constraints\n\n> **What \"three non-trivial constraints\" means for you.** Beyond x ≥ 0 and y ≥ 0 (the trivial ones),\n> you will never face more than three inequalities. That caps the feasible region at a small polygon\n> with at most five corner points. There is a hard ceiling on how difficult this question can be.\n\n---","brief":"### Terminology — know these words, they get asked directly\n\n| Term | Meaning |\n| --- | --- |\n| **Decision variables** | The quantities you are solving for, usually x and y |\n| **Objective function** | The linear expression Z = ax + by to be maximised or minimised |\n| **Constraints** | The linear inequalities the variables must satisfy |\n| **Non-negative constraints** | x ≥ 0, y ≥ 0 (the \"trivial\" constraints) |\n| **Feasible region** | The set of all points satisfying *all* the constraints simultaneously |\n| **Feasible solution** | Any point in the feasible region |\n| **Infeasible solution** | Any point outside it |\n| **Optimal (feasible) solution** | A feasible point at which Z attains its required maximum or minimum |\n| **Bounded region** | The feasible region can be enclosed in a circle |\n| **Unbounded region** | It cannot — it extends indefinitely |\n\n### The two theorems that make the method work\n\n**Theorem 1.** If the feasible region R is non-empty and Z = ax + by has an optimal value there, then\nthat optimal value occurs at a **corner point (vertex)** of R.\n\n**Theorem 2.**\n- If R is **bounded**, then Z has **both** a maximum and a minimum on R, and each occurs at a corner\n  point.\n- If R is **unbounded**, a maximum or minimum **may not exist**. If it does, it occurs at a corner\n  point — but you must **verify** it exists.\n\nThis pair is why the method is just \"check the corners\".\n\n### The corner-point method — the fixed procedure\n\nFollow this order exactly. Each step is a mark.\n\n1. **Write all the constraints as inequalities**, including x ≥ 0 and y ≥ 0. If the question is a word\n   problem, tabulate the data first and then translate.\n\n2. **Convert each inequality to its boundary line** (replace ≤ or ≥ with =) and find two points on\n   each line — usually the axis intercepts.\n\n3. **Draw the graph on graph paper.** State the scale. Label each line with its equation.\n\n4. **Shade the feasible region.** For each inequality, test the origin (0, 0): if it satisfies the\n   inequality, shade the side containing the origin; if not, shade the other side. The feasible\n   region is the intersection of all shaded regions.\n\n5. **Find every corner point exactly**, by solving the relevant pair of simultaneous equations. Do\n   **not** read coordinates off the graph — the grid will lie to you and the marking scheme wants the\n   algebra.\n\n6. **Tabulate Z at each corner point.**\n\n| Corner point | Z = ax + by |\n| --- | --- |\n| … | … |\n\n7. **State the optimum**: the value, the point at which it occurs, and whether it is a maximum or\n   minimum.\n\n8. **If the region is unbounded, do the existence check** (next section). This is the mark most\n   students drop.\n\n### The unbounded-region check\n\nSuppose the region is unbounded and M is the largest value of Z at the corner points.\n\n```\nM is the MAXIMUM  ⟺  the open half-plane  ax + by > M  has NO point in common with the feasible region.\n```\n\nSimilarly, if m is the smallest corner value:\n\n```\nm is the MINIMUM  ⟺  the open half-plane  ax + by < m  has NO point in common with the feasible region.\n```\n\n**How to do the check in practice.** Sketch the line ax + by = M (or = m). If the feasible region\nlies entirely on one side of it, the optimum exists. If the region pokes through to the other side,\nno optimum exists in that direction.\n\n**The rule of thumb** (state the check anyway, but this tells you what to expect): if the feasible\nregion is unbounded \"upwards and to the right\" (typical of ≥ constraints), and a, b > 0, then Z has a\n**minimum** but **no maximum**.\n\n**Write the check as a sentence**, e.g.: \"Since the feasible region is unbounded, we check whether\n3x + 5y < 7 has any point in common with it. It does not, so the minimum value of Z is 7.\"\n\n### Two special outcomes\n\n**Multiple optimal solutions.** If Z takes the same optimal value at **two** corner points, then it\ntakes that value at **every point on the line segment joining them**, so there are infinitely many\noptimal solutions. Say so explicitly.\n\n**No feasible solution.** If the constraints are mutually contradictory, the feasible region is\nempty and the LPP has **no solution**. For example x − y ≤ −1 (i.e. y ≥ x + 1) together with\n−x + y ≤ 0 (i.e. y ≤ x) cannot both hold. State: \"The feasible region is empty, hence the problem\nhas no feasible solution.\"\n\n### Quick recall box\n\n```\nZ = ax + by  is the objective function; the inequalities are the constraints.\n\nCORNER-POINT METHOD:\n  1. list constraints (incl. x ≥ 0, y ≥ 0)\n  2. boundary lines + intercepts\n  3. graph on graph paper, state scale, label lines\n  4. shade feasible region (test the origin for each inequality)\n  5. find corner points by SOLVING SIMULTANEOUS EQUATIONS (not by reading the graph)\n  6. table of Z at each corner\n  7. state optimum: value, point, max/min\n  8. if UNBOUNDED: check whether ax+by > M (or < m) meets the region\n\nBounded region  → max AND min both exist, at corners\nUnbounded region → may not exist; must check\nEqual Z at two corners → infinitely many optima, all along that segment\nContradictory constraints → empty feasible region → no feasible solution\n```\n\n---","pyq":"**Q1.** *(5 marks)* Maximise Z = 4x + y subject to\nx + y ≤ 50, 3x + y ≤ 90, x ≥ 0, y ≥ 0.\n\n**Q2.** *(5 marks)* Minimise Z = 3x + 5y subject to\nx + 3y ≥ 3, x + y ≥ 2, x ≥ 0, y ≥ 0.\n\n**Q3.** *(5 marks)* Minimise **and** maximise Z = 5x + 10y subject to\nx + 2y ≤ 120, x + y ≥ 60, x − 2y ≥ 0, x ≥ 0, y ≥ 0.\n\n**Q4.** *(2 marks)* Show that the LPP \"Maximise Z = x + y subject to x − y ≤ −1, −x + y ≤ 0,\nx ≥ 0, y ≥ 0\" has no feasible solution.\n\n**Q5.** *(3 marks)* The corner points of the feasible region of an LPP are (0, 3), (1, 1) and (3, 0).\nIf Z = px + qy with p, q > 0, and the minimum of Z occurs at **both** (3, 0) and (1, 1), find the\nrelation between p and q.\n\n**Q6.** *(1 mark, MCQ)* The corner points of a bounded feasible region are (0, 0), (4, 0), (2, 4)\nand (0, 5). The maximum of Z = 3x + 2y is\n(a) 12 (b) 14 (c) 10 (d) 22\n\n**Q7.** *(4 marks)* Maximise Z = 3x + 4y subject to x + y ≤ 4, x ≥ 0, y ≥ 0.\n\n**Q8.** *(4 marks, case study)* A manufacturer produces two products, A and B. Each unit of A\nrequires 2 hours on machine M₁ and 1 hour on M₂; each unit of B requires 1 hour on M₁ and 2 hours on\nM₂. M₁ is available for 10 hours and M₂ for 8 hours per day. The profit is ₹5 per unit of A and ₹3\nper unit of B.\n(i) Formulate this as an LPP.\n(ii) Find the corner points of the feasible region.\n(iii) Find the maximum profit and the production plan that achieves it.\n\n---","sol":"### Q1 — Maximise Z = 4x + y\n\n**Constraints:**\n\n```\n      x + y ≤ 50            …(i)\n      3x + y ≤ 90           …(ii)\n      x ≥ 0, y ≥ 0\n```\n\n**Boundary lines and intercepts:**\n\n```\n      x + y = 50    →  (50, 0) and (0, 50)\n      3x + y = 90   →  (30, 0) and (0, 90)\n```\n\n**Origin test.** (0, 0) satisfies both (i) and (ii) (0 ≤ 50 ✓, 0 ≤ 90 ✓), so shade the side\ncontaining the origin for each. With x, y ≥ 0 the feasible region is a **bounded** quadrilateral in\nthe first quadrant.\n\n**Corner points.**\n\n- **(0, 0)** — the origin\n- **(30, 0)** — where 3x + y = 90 meets the x-axis (note x + y = 50 meets it at (50,0), which is\n  outside (ii) since 3(50) = 150 > 90, so (30,0) is the binding one)\n- **(0, 50)** — where x + y = 50 meets the y-axis (the point (0,90) violates (i))\n- **Intersection of (i) and (ii):**\n\n```\n      x + y = 50\n      3x + y = 90\n```\n\nSubtracting: 2x = 40 ⟹ **x = 20**, and then y = 30. So the point is **(20, 30)**.\n\n**Table of Z = 4x + y:**\n\n| Corner point | Z = 4x + y |\n| --- | --- |\n| (0, 0) | 0 |\n| (30, 0) | 120 + 0 = **120** |\n| (20, 30) | 80 + 30 = 110 |\n| (0, 50) | 0 + 50 = 50 |\n\nSince the feasible region is **bounded**, the maximum exists and occurs at a corner point.\n\n```\nMaximum Z = 120, at the point (30, 0)\n```\n\n### Q2 — Minimise Z = 3x + 5y\n\n**Constraints:**\n\n```\n      x + 3y ≥ 3            …(i)\n      x + y ≥ 2             …(ii)\n      x ≥ 0, y ≥ 0\n```\n\n**Boundary lines:**\n\n```\n      x + 3y = 3   →  (3, 0) and (0, 1)\n      x + y = 2    →  (2, 0) and (0, 2)\n```\n\n**Origin test.** (0, 0) gives 0 ≥ 3 ✗ and 0 ≥ 2 ✗, so shade **away** from the origin for both. The\nfeasible region is therefore **unbounded** (it extends up and to the right).\n\n**Corner points.**\n\n- **(3, 0)** — where x + 3y = 3 meets the x-axis (and (2,0) fails (i): 2 ≥ 3 ✗)\n- **(0, 2)** — where x + y = 2 meets the y-axis (and (0,1) fails (ii): 1 ≥ 2 ✗)\n- **Intersection of (i) and (ii):**\n\n```\n      x + 3y = 3\n      x +  y = 2\n```\n\nSubtracting: 2y = 1 ⟹ **y = 1/2**, and then x = 3/2. So the point is **(3/2, 1/2)**.\n\n**Table of Z = 3x + 5y:**\n\n| Corner point | Z = 3x + 5y |\n| --- | --- |\n| (3, 0) | 9 + 0 = 9 |\n| (3/2, 1/2) | 4.5 + 2.5 = **7** |\n| (0, 2) | 0 + 10 = 10 |\n\nThe smallest corner value is 7. **But the region is unbounded, so we must check.**\n\n**The unbounded check.** Consider the open half-plane 3x + 5y < 7. The line 3x + 5y = 7 passes\nthrough (7/3, 0) ≈ (2.33, 0) and (0, 7/5) = (0, 1.4). Every point of the feasible region lies on or\nabove this line — the feasible region has **no point in common** with 3x + 5y < 7.\n\nHence 7 is genuinely the minimum.\n\n```\nMinimum Z = 7, at the point (3/2, 1/2)\n```\n\n*(Note that Z has **no maximum** here: the region is unbounded upwards and both coefficients are\npositive, so Z can be made arbitrarily large.)*\n\n### Q3 — Minimise and maximise Z = 5x + 10y\n\n**Constraints:**\n\n```\n      x + 2y ≤ 120          …(i)\n      x + y ≥ 60            …(ii)\n      x − 2y ≥ 0            …(iii)\n      x ≥ 0, y ≥ 0\n```\n\n**Boundary lines:**\n\n```\n      x + 2y = 120  →  (120, 0) and (0, 60)\n      x + y = 60    →  (60, 0) and (0, 60)\n      x − 2y = 0    →  passes through (0, 0) and (40, 20)\n```\n\n**Corner points.** The feasible region is a **bounded** quadrilateral. Its vertices:\n\n- **(60, 0)** — where x + y = 60 meets the x-axis; check (i): 60 ≤ 120 ✓, (iii): 60 ≥ 0 ✓\n- **(120, 0)** — where x + 2y = 120 meets the x-axis; check (ii): 120 ≥ 60 ✓, (iii): 120 ≥ 0 ✓\n- **Intersection of (i) and (iii):**\n\n```\n      x + 2y = 120\n      x − 2y = 0\n```\n\nAdding: 2x = 120 ⟹ x = 60, y = 30. Point **(60, 30)**. Check (ii): 90 ≥ 60 ✓\n\n- **Intersection of (ii) and (iii):**\n\n```\n      x +  y = 60\n      x − 2y = 0     ⟹  x = 2y\n```\n\nSo 2y + y = 60 ⟹ y = 20, x = 40. Point **(40, 20)**. Check (i): 40 + 40 = 80 ≤ 120 ✓\n\n**Table of Z = 5x + 10y:**\n\n| Corner point | Z = 5x + 10y |\n| --- | --- |\n| (60, 0) | 300 + 0 = **300** |\n| (120, 0) | 600 + 0 = **600** |\n| (60, 30) | 300 + 300 = **600** |\n| (40, 20) | 200 + 200 = 400 |\n\n```\nMinimum Z = 300, at (60, 0)\n\nMaximum Z = 600, attained at BOTH (120, 0) and (60, 30)\n```\n\nSince the maximum occurs at two corner points, **it occurs at every point on the line segment\njoining (120, 0) and (60, 30)** — there are infinitely many optimal solutions.\n\n### Q4 — no feasible solution\n\n**Rewrite the constraints:**\n\n```\n      x − y ≤ −1     ⟹     y ≥ x + 1          …(i)\n      −x + y ≤ 0     ⟹     y ≤ x              …(ii)\n```\n\nFrom (i), y ≥ x + 1; from (ii), y ≤ x. Combining:\n\n```\n      x + 1 ≤ y ≤ x\n⟹     x + 1 ≤ x\n⟹     1 ≤ 0,   which is impossible\n```\n\nSo no point (x, y) satisfies both constraints. **The feasible region is empty**, and the LPP has\n**no feasible solution**.\n\n*(Graphically: the half-plane above the line y = x + 1 and the half-plane below y = x are disjoint,\nsince those two lines are parallel and distinct.)*\n\n### Q5 — relation between p and q\n\nZ = px + qy, and the **minimum** occurs at both (3, 0) and (1, 1). Equal Z values at those points:\n\n```\n      Z(3, 0) = 3p + 0 = 3p\n      Z(1, 1) = p + q\n```\n\n```\n      3p = p + q\n⟹     2p = q\n```\n\n```\nq = 2p          (equivalently p = q/2)\n```\n\n*(Check the third corner is not lower: Z(0, 3) = 3q = 6p, which exceeds 3p since p > 0 ✓ — so the\nminimum really is at those two points, and hence along the segment joining them.)*\n\n### Q6 — maximum of Z = 3x + 2y at given corners\n\n| Corner point | Z = 3x + 2y |\n| --- | --- |\n| (0, 0) | 0 |\n| (4, 0) | 12 |\n| (2, 4) | 6 + 8 = **14** |\n| (0, 5) | 0 + 10 = 10 |\n\n**Answer: (b) 14**\n\n### Q7 — Maximise Z = 3x + 4y subject to x + y ≤ 4\n\n**Constraints:** x + y ≤ 4, x ≥ 0, y ≥ 0.\n\n**Boundary line:** x + y = 4 → (4, 0) and (0, 4).\n\n**Origin test:** (0, 0) gives 0 ≤ 4 ✓, so shade towards the origin. The feasible region is the\n**bounded** triangle with vertices (0, 0), (4, 0), (0, 4).\n\n| Corner point | Z = 3x + 4y |\n| --- | --- |\n| (0, 0) | 0 |\n| (4, 0) | 12 |\n| (0, 4) | **16** |\n\n```\nMaximum Z = 16, at the point (0, 4)\n```\n\n### Q8 — case study: manufacturer\n\n**(i) Formulation.**\n\nLet x = number of units of A produced per day, y = number of units of B.\n\nTabulating the data:\n\n| | Machine M₁ (hours) | Machine M₂ (hours) | Profit (₹) |\n| --- | --- | --- | --- |\n| Product A (x units) | 2 | 1 | 5 |\n| Product B (y units) | 1 | 2 | 3 |\n| **Available / total** | 10 | 8 | maximise |\n\n```\nMaximise    Z = 5x + 3y                (profit in ₹)\n\nsubject to  2x + y ≤ 10                (machine M₁ time)\n            x + 2y ≤ 8                 (machine M₂ time)\n            x ≥ 0,  y ≥ 0\n```\n\n**(ii) Corner points.**\n\nBoundary lines: 2x + y = 10 → (5, 0) and (0, 10); x + 2y = 8 → (8, 0) and (0, 4).\n\n- **(0, 0)**\n- **(5, 0)** — where 2x + y = 10 meets the x-axis; check x + 2y ≤ 8: 5 ≤ 8 ✓\n- **(0, 4)** — where x + 2y = 8 meets the y-axis; check 2x + y ≤ 10: 4 ≤ 10 ✓\n- **Intersection:**\n\n```\n      2x + y = 10          …multiply by 2:  4x + 2y = 20\n      x + 2y = 8\n```\n\nSubtracting: 3x = 12 ⟹ **x = 4**, then y = 10 − 8 = **2**. Point **(4, 2)**.\n\n**Corner points: (0, 0), (5, 0), (4, 2), (0, 4).**\n\n**(iii) Maximum profit.**\n\n| Corner point | Z = 5x + 3y |\n| --- | --- |\n| (0, 0) | 0 |\n| (5, 0) | 25 |\n| (4, 2) | 20 + 6 = **26** |\n| (0, 4) | 12 |\n\n```\nMaximum profit = ₹26, by producing 4 units of A and 2 units of B per day.\n```\n\n*(Check both machine constraints at (4, 2): M₁ uses 2(4) + 2 = 10 hours ✓ exactly available;\nM₂ uses 4 + 2(2) = 8 hours ✓ exactly available. Both machines are fully utilised — a good sign that\nthe optimum is at the intersection.)*\n\n---","test":"Time: 45 minutes. Answers below. **Draw the graph for every question** — it is part of the marks.\n\n1. *(1)* The optimal value of the objective function of an LPP is attained at\n   (a) any point of the feasible region (b) a corner point of the feasible region\n   (c) the origin only (d) the centre of the feasible region\n2. *(1)* If the feasible region of an LPP is unbounded, then\n   (a) both max and min always exist (b) neither exists\n   (c) max or min may not exist (d) only the max exists\n3. *(1)* The corner points of a feasible region are (0, 0), (3, 0), (2, 2), (0, 4). The minimum of\n   Z = 4x + 6y is\n   (a) 0 (b) 12 (c) 20 (d) 24\n4. *(4)* Maximise Z = 5x + 3y subject to 3x + 5y ≤ 15, 5x + 2y ≤ 10, x ≥ 0, y ≥ 0.\n5. *(4)* Minimise Z = −3x + 4y subject to x + 2y ≤ 8, 3x + 2y ≤ 12, x ≥ 0, y ≥ 0.\n6. *(4)* Maximise Z = 3x + 2y subject to x + 2y ≤ 10, 3x + y ≤ 15, x ≥ 0, y ≥ 0.\n7. *(5)* Minimise Z = 200x + 500y subject to x + 2y ≥ 10, 3x + 4y ≤ 24, x ≥ 0, y ≥ 0.\n8. *(5)* Maximise Z = x + y subject to x + 4y ≤ 8, 2x + 3y ≤ 12, 3x + y ≤ 9, x ≥ 0, y ≥ 0.\n9. *(3)* The corner points of the feasible region are (0, 4), (2, 2) and (6, 0). If\n   Z = ax + by (a, b > 0) has the same minimum at (2, 2) and (6, 0), find a relation between a and b.\n10. *(2)* Show that the constraints x + y ≤ 2, x + y ≥ 5, x ≥ 0, y ≥ 0 give an infeasible LPP.\n\n### Answer key\n\n**1. (b) a corner point of the feasible region.**\n\n**2. (c) max or min may not exist.**\n\n**3. (a) 0.** Z at (0,0) = 0; (3,0) = 12; (2,2) = 8 + 12 = 20; (0,4) = 24. Minimum is 0.\n\n**4. Maximum Z = 235/19 at (20/19, 45/19).**\nCorners: (0, 0), (2, 0), (0, 3), and the intersection of 3x + 5y = 15 with 5x + 2y = 10.\nSolving: multiply first by 2, second by 5 → 6x + 10y = 30 and 25x + 10y = 50; subtract: 19x = 20,\nx = 20/19, then y = (15 − 3(20/19))/5 = (285/19 − 60/19)/5 = (225/19)/5 = 45/19.\nZ: (0,0) = 0; (2,0) = 10; (0,3) = 9; (20/19, 45/19) = 100/19 + 135/19 = 235/19 ≈ 12.37.\n**Maximum = 235/19 ≈ 12.37 at (20/19, 45/19).**\n\n**5. Minimum Z = −12 at (4, 0).**\nCorners: (0, 0), (4, 0), (2, 3), (0, 4).\n*(Intersection of x + 2y = 8 and 3x + 2y = 12: subtract → 2x = 4, x = 2, y = 3.)*\nZ = −3x + 4y: (0,0) = 0; (4,0) = −12; (2,3) = −6 + 12 = 6; (0,4) = 16. **Minimum = −12 at (4, 0).**\n\n**6. Maximum Z = 18 at (4, 3).**\nCorners: (0, 0), (5, 0), (4, 3), (0, 5).\n*(Intersection of x + 2y = 10 and 3x + y = 15: from the second y = 15 − 3x; substituting,\nx + 30 − 6x = 10 ⟹ −5x = −20 ⟹ x = 4, y = 3.)*\nZ: 0; 15; 12 + 6 = 18; 10. **Maximum = 18 at (4, 3).**\n\n**7. Minimum Z = 2300 at (4, 3).**\nConstraints x + 2y ≥ 10 and 3x + 4y ≤ 24 with x, y ≥ 0 give a **bounded** region.\nCorners: (0, 5), (0, 6), and the intersection of x + 2y = 10 with 3x + 4y = 24.\nSolving: multiply the first by 2 → 2x + 4y = 20; subtract from the second: x = 4, then y = 3.\nZ = 200x + 500y: (0, 5) = 2500; (0, 6) = 3000; (4, 3) = 800 + 1500 = 2300.\n**Minimum = 2300 at (4, 3).**\n\n**8. Maximum Z = 43/11 ≈ 3.91 at (28/11, 15/11).**\nThe binding constraints are x + 4y ≤ 8 and 3x + y ≤ 9. Their intersection: from the second\ny = 9 − 3x; substituting,\nx + 36 − 12x = 8 ⟹ −11x = −28 ⟹ x = 28/11, y = 9 − 84/11 = 15/11.\nCheck 2x + 3y = 56/11 + 45/11 = 101/11 ≈ 9.18 ≤ 12 ✓\nCorners: (0, 0), (3, 0), (28/11, 15/11), (0, 2).\nZ = x + y: 0; 3; 43/11 ≈ 3.91; 2. **Maximum = 43/11 ≈ 3.91 at (28/11, 15/11).**\n\n**9. b = 2a.** Z(2, 2) = 2a + 2b and Z(6, 0) = 6a. Equal ⟹ 2a + 2b = 6a ⟹ 2b = 4a ⟹ **b = 2a**.\n\n**10. Infeasible.** x + y ≤ 2 and x + y ≥ 5 require 5 ≤ x + y ≤ 2, i.e. 5 ≤ 2, which is impossible.\nThe feasible region is empty, so the LPP has no feasible solution.\n\n**Scoring.** Out of 30. Below 22 → the loss is almost certainly corner points read off the graph\ninstead of solved for, or the unbounded check omitted. Redo §3 Q2 and Q3.\n\n---","tips":"1. **Use graph paper, and state the scale.** \"Scale: 1 cm = 10 units on both axes.\" A freehand sketch\n   loses the graph mark.\n\n2. **Label every line with its equation** on the graph, and mark the axis intercepts with their\n   coordinates.\n\n3. **Shade the feasible region and label it** (write \"feasible region\" with an arrow, or hatch it).\n   The examiner must be able to see which region you mean.\n\n4. **Find corner points by solving simultaneous equations, and show that algebra.** Reading (20, 30)\n   off a graph earns nothing; deriving it from x + y = 50 and 3x + y = 90 earns the mark. This is the\n   single most common way marks are lost in this chapter.\n\n5. **Present Z in a table**, one row per corner point, with the arithmetic shown. Not prose.\n\n6. **Say whether the region is bounded or unbounded**, in words, before concluding.\n\n7. **Do the unbounded check and write it as a sentence.** \"Since the region is unbounded, we check\n   whether 3x + 5y < 7 has a point in common with the feasible region. It does not, so the minimum\n   is 7.\" Omitting this is a routine 1-mark loss on every unbounded question.\n\n8. **State the answer completely:** the optimal value of Z, the point where it occurs, and whether it\n   is a maximum or a minimum. \"Maximum Z = 120 at (30, 0)\" — all three parts.\n\n9. **When two corners tie, say there are infinitely many optimal solutions** along the segment\n   joining them. That sentence is a mark, and CBSE sets this case deliberately.\n\n10. **For word problems, tabulate the data before writing the constraints.** A three-row table\n    (resource, product A requirement, product B requirement, availability) makes the constraints\n    write themselves and is worth a mark on its own.\n\n11. **Define your variables in words.** \"Let x be the number of units of A produced per day.\" Then\n    the answer can be stated meaningfully: \"Produce 4 units of A and 2 units of B for a maximum\n    profit of ₹26.\"\n\n12. **Check the optimal point satisfies every constraint.** Twenty seconds, and it catches a wrongly\n    identified corner point."}},{"id":"m13","subj":"maths","num":13,"title":"Probability","unit":"Unit VI · Probability","unitMarks":8,"prio":1,"appear":"Unit VI (8 marks) · Typical appearance: one Bayes' theorem question worth 4–5 marks (essentially guaranteed) + one 2/3-mark conditional-probability question + an MCQ.","deleted":"- **Variance** and standard deviation of a random variable\n- **Bernoulli trials** and the **Binomial distribution** (no ⁿCᵣ pᵣ qⁿ⁻ᵣ)\n\n> **This is the deletion students miss most often.** The Binomial distribution used to be a\n> guaranteed question — \"find the probability of exactly 3 heads in 5 tosses\" — and it is now out of\n> syllabus, along with variance. Almost every second-hand note and old question bank still features\n> both prominently. The entire 8 marks now comes from the conditional-probability family plus the\n> mean of a random variable.","recall":"```\nCONDITIONAL:  P(A|B) = P(A∩B)/P(B),  P(B) ≠ 0        ← \"given\" goes in the DENOMINATOR\n              P(A′|B) = 1 − P(A|B)\n\nMULTIPLICATION: P(A∩B) = P(A)P(B|A) = P(B)P(A|B)\n                P(A∩B∩C) = P(A)P(B|A)P(C|A∩B)\n\nINDEPENDENT: P(A∩B) = P(A)P(B)  ⟺  P(A|B) = P(A)\n             P(at least one) = 1 − (1−P(A))(1−P(B))\n             independent ≠ mutually exclusive\n\nTOTAL PROBABILITY:  P(A) = Σ P(Eᵢ) P(A|Eᵢ)\n\nBAYES:  P(Eᵢ|A) = P(Eᵢ)P(A|Eᵢ) / Σⱼ P(Eⱼ)P(A|Eⱼ)\n        LAYOUT: define events → all priors → all likelihoods → formula → substitute\n\nRANDOM VARIABLE: Σpᵢ = 1 ;  Mean = E(X) = Σ xᵢpᵢ\n```","s":{"scope":"### In the syllabus\n\n- **Conditional probability**\n- **Multiplication theorem** on probability\n- **Independent events**\n- **Theorem of total probability**\n- **Bayes' theorem**\n- **Random variable** and its **probability distribution**\n- **Mean** of a random variable\n\n### Deleted — do not study\n\n- **Variance** and standard deviation of a random variable\n- **Bernoulli trials** and the **Binomial distribution** (no ⁿCᵣ pᵣ qⁿ⁻ᵣ)\n\n> **This is the deletion students miss most often.** The Binomial distribution used to be a\n> guaranteed question — \"find the probability of exactly 3 heads in 5 tosses\" — and it is now out of\n> syllabus, along with variance. Almost every second-hand note and old question bank still features\n> both prominently. The entire 8 marks now comes from the conditional-probability family plus the\n> mean of a random variable.\n\n---","brief":"### Conditional probability\n\nThe probability of A **given that** B has already occurred:\n\n```\n      P(A|B) = P(A ∩ B) / P(B)              provided P(B) ≠ 0\n```\n\nRead it as: restrict the sample space to B, and ask what fraction of B is also A.\n\n**Properties:**\n\n```\n      P(S|B) = P(B|B) = 1\n      P(A′|B) = 1 − P(A|B)\n      P((A ∪ C)|B) = P(A|B) + P(C|B) − P((A ∩ C)|B)\n```\n\n> **The one thing to keep straight:** P(A|B) and P(B|A) are different numbers. The **denominator is\n> whatever is given**. \"Given it is defective, find the probability it came from machine C\" has\n> \"defective\" in the denominator.\n\n### Multiplication theorem\n\nRearranging the definition:\n\n```\n      P(A ∩ B) = P(B) · P(A|B) = P(A) · P(B|A)\n```\n\nFor three events:\n\n```\n      P(A ∩ B ∩ C) = P(A) · P(B|A) · P(C|A ∩ B)\n```\n\nThis is what you use for \"drawing without replacement\": the probability changes at each draw, and\nyou multiply the conditional probabilities.\n\n### Independent events\n\nA and B are **independent** if the occurrence of one does not affect the other:\n\n```\n      P(A ∩ B) = P(A) · P(B)\n```\n\nEquivalently, P(A|B) = P(A) and P(B|A) = P(B).\n\n**If A and B are independent, so are:** A′ and B, A and B′, A′ and B′.\n\n**Independent ≠ mutually exclusive.** These are completely different ideas and the distinction is\nexamined:\n\n| | Mutually exclusive | Independent |\n| --- | --- | --- |\n| Definition | A ∩ B = ∅, so P(A ∩ B) = 0 | P(A ∩ B) = P(A)P(B) |\n| Meaning | they cannot both happen | one happening tells you nothing about the other |\n| Can both hold? | Only if P(A) = 0 or P(B) = 0 | |\n\nSo two events with non-zero probabilities that are mutually exclusive are **necessarily dependent** —\nif you know A happened, you know B did not. That is the standard MCQ.\n\n**Useful:** for independent A, B:\n\n```\n      P(A ∪ B) = P(A) + P(B) − P(A)P(B)\n      P(neither) = P(A′ ∩ B′) = (1 − P(A))(1 − P(B))\n      P(at least one) = 1 − P(neither)\n```\n\n### Theorem of total probability\n\nLet E₁, E₂, …, Eₙ be a **partition** of the sample space (mutually exclusive, exhaustive, each with\nnon-zero probability). Then for any event A:\n\n```\n      P(A) = P(E₁)P(A|E₁) + P(E₂)P(A|E₂) + … + P(Eₙ)P(A|Eₙ)\n           = Σ P(Eᵢ) P(A|Eᵢ)\n```\n\nIn words: to find the overall probability of A, go through each way the world could be, and weight\nthe conditional probability by how likely that way is.\n\n### Bayes' theorem\n\nSame setup. Then\n\n```\n                  P(Eᵢ) · P(A|Eᵢ)\n      P(Eᵢ|A) = ─────────────────────────\n                  Σⱼ P(Eⱼ) · P(A|Eⱼ)\n```\n\nThe denominator is exactly P(A) from the total probability theorem. So Bayes' theorem is:\n\n```\n      P(Eᵢ|A) = (that one term) / (sum of all the terms)\n```\n\n**Vocabulary that appears in questions:** P(Eᵢ) are the **prior** probabilities (before you observe\nA); P(Eᵢ|A) are the **posterior** probabilities (after).\n\n### The Bayes layout — use it every time\n\nThe reason students lose this question is disorganisation, not ignorance. Impose this structure:\n\n**Step 1 — Define the events**, with letters.\n\n```\n      E₁ : the item came from machine A\n      E₂ : the item came from machine B\n      E₃ : the item came from machine C\n      D  : the item is defective\n```\n\n**Step 2 — Write all the priors** P(E₁), P(E₂), P(E₃).\n\n**Step 3 — Write all the likelihoods** P(D|E₁), P(D|E₂), P(D|E₃).\n\n**Step 4 — Write the formula** with the required index.\n\n**Step 5 — Substitute and simplify.**\n\nLaid out this way it is structurally impossible to invert the conditional or to drop a term from the\ndenominator — the two ways this question is actually lost.\n\n### Random variables\n\nA **random variable** X is a real-valued function on the sample space of a random experiment.\n\nIts **probability distribution** is the table of values and their probabilities:\n\n| X = xᵢ | x₁ | x₂ | … | xₙ |\n| --- | --- | --- | --- | --- |\n| P(X = xᵢ) = pᵢ | p₁ | p₂ | … | pₙ |\n\n**The two conditions** every probability distribution must satisfy:\n\n```\n      pᵢ ≥ 0 for all i          and          Σ pᵢ = 1\n```\n\nChecking Σpᵢ = 1 is both a mark and your own error check. Do it.\n\n**Mean (expectation):**\n\n```\n      Mean = E(X) = μ = Σ xᵢ pᵢ\n```\n\nThe mean is also called the **expected value** or the **expectation** of X.\n\n> Variance is deleted, so you will not be asked for Σxᵢ²pᵢ − μ². If a practice question asks for it,\n> it is from an old paper.\n\n### Quick recall box\n\n```\nCONDITIONAL:  P(A|B) = P(A∩B)/P(B),  P(B) ≠ 0        ← \"given\" goes in the DENOMINATOR\n              P(A′|B) = 1 − P(A|B)\n\nMULTIPLICATION: P(A∩B) = P(A)P(B|A) = P(B)P(A|B)\n                P(A∩B∩C) = P(A)P(B|A)P(C|A∩B)\n\nINDEPENDENT: P(A∩B) = P(A)P(B)  ⟺  P(A|B) = P(A)\n             P(at least one) = 1 − (1−P(A))(1−P(B))\n             independent ≠ mutually exclusive\n\nTOTAL PROBABILITY:  P(A) = Σ P(Eᵢ) P(A|Eᵢ)\n\nBAYES:  P(Eᵢ|A) = P(Eᵢ)P(A|Eᵢ) / Σⱼ P(Eⱼ)P(A|Eⱼ)\n        LAYOUT: define events → all priors → all likelihoods → formula → substitute\n\nRANDOM VARIABLE: Σpᵢ = 1 ;  Mean = E(X) = Σ xᵢpᵢ\n```\n\n---","pyq":"**Q1.** *(4 marks — the archetypal Bayes question)*\nBag I contains 3 red and 4 black balls; Bag II contains 5 red and 6 black balls. One ball is drawn\nat random from one of the bags, and it is found to be red. Find the probability that it was drawn\nfrom Bag II.\n\n**Q2.** *(5 marks)* A factory has three machines A, B and C, producing 25%, 35% and 40% of the total\noutput respectively. Of their outputs, 5%, 4% and 2% are defective. An item is drawn at random from\nthe total output and found to be defective. Find the probability that it was produced by machine C.\n\n**Q3.** *(3 marks)* A die is thrown twice and the sum of the numbers appearing is observed to be 6.\nWhat is the conditional probability that the number 4 has appeared at least once?\n\n**Q4.** *(2 marks)* A and B are independent events with P(A) = 0.3 and P(B) = 0.4. Find P(A ∪ B).\n\n**Q5.** *(4 marks)* Two cards are drawn successively **with replacement** from a well-shuffled deck\nof 52 cards. Find the probability distribution of the number of aces, and hence find its mean.\n\n**Q6.** *(3 marks)* An urn contains 5 red and 5 black balls. A ball is drawn at random, its colour\nis noted, and it is returned to the urn. Moreover, 2 additional balls of the colour drawn are put\ninto the urn, and then a ball is drawn at random. What is the probability that the second ball is\nred?\n\n**Q7.** *(2 marks)* If P(A) = 6/11, P(B) = 5/11 and P(A ∪ B) = 7/11, find P(A|B).\n\n**Q8.** *(1 mark, MCQ)* If A and B are two events such that P(A) ≠ 0 and P(B|A) = 1, then\n(a) A ⊂ B (b) B ⊂ A (c) B = ∅ (d) A = ∅\n\n**Q9.** *(3 marks)* Three cards are drawn successively **without replacement** from a pack of 52\ncards. Find the probability that all three are kings.\n\n**Q10.** *(4 marks, case study)* In a school, 40% of the students are girls and 60% are boys. It is\nknown that 5% of the girls and 8% of the boys are left-handed.\n(i) Find the probability that a randomly chosen student is left-handed.\n(ii) Given that a randomly chosen student is left-handed, find the probability that the student is a\ngirl.\n(iii) State which theorem you used in each part.\n\n**Q11.** *(2 marks)* A random variable X has the following probability distribution. Find k, and\nthen the mean of X.\n\n| X | 0 | 1 | 2 | 3 |\n| --- | --- | --- | --- | --- |\n| P(X) | k | 2k | 3k | 4k |\n\n**Q12.** *(1 mark, Assertion–Reason)*\n**A:** If two events are mutually exclusive with non-zero probabilities, they cannot be independent.\n**R:** For mutually exclusive events, P(A ∩ B) = 0.\n\n---","sol":"### Q1 — two bags, red ball drawn, which bag?\n\n**Step 1 — define events.**\n\n```\n      E₁ : the ball is drawn from Bag I\n      E₂ : the ball is drawn from Bag II\n      R  : the ball drawn is red\n```\n\n**Step 2 — priors.** One of the two bags is chosen at random, so\n\n```\n      P(E₁) = 1/2          P(E₂) = 1/2\n```\n\n**Step 3 — likelihoods.**\n\n```\n      Bag I  : 3 red out of (3 + 4) = 7 balls    ⟹   P(R|E₁) = 3/7\n      Bag II : 5 red out of (5 + 6) = 11 balls   ⟹   P(R|E₂) = 5/11\n```\n\n**Step 4 — Bayes' theorem.**\n\n```\n                        P(E₂) P(R|E₂)\n      P(E₂|R) = ───────────────────────────────\n                 P(E₁)P(R|E₁) + P(E₂)P(R|E₂)\n```\n\n**Step 5 — substitute.**\n\n```\n                     (1/2)(5/11)\n      P(E₂|R) = ──────────────────────────\n                 (1/2)(3/7) + (1/2)(5/11)\n```\n\nThe (1/2) cancels throughout:\n\n```\n                    5/11\n      P(E₂|R) = ─────────────\n                 3/7 + 5/11\n```\n\n```\n      3/7 + 5/11 = (33 + 35)/77 = 68/77\n```\n\n```\n      P(E₂|R) = (5/11) × (77/68) = (5 × 7)/68 = 35/68\n```\n\n```\nP(the ball came from Bag II | it is red) = 35/68          ≈ 0.515\n```\n\n*(Sanity check: Bag II's red fraction (5/11 ≈ 0.455) is slightly higher than Bag I's (3/7 ≈ 0.429),\nand the two bags were equally likely to start with, so the posterior for Bag II should come out a\nlittle above ½. It does: 35/68 ≈ 0.515 ✓)*\n\n### Q2 — three machines, defective item, which machine?\n\n**Step 1 — define events.**\n\n```\n      E₁ : item produced by machine A\n      E₂ : item produced by machine B\n      E₃ : item produced by machine C\n      D  : item is defective\n```\n\n**Step 2 — priors.**\n\n```\n      P(E₁) = 0.25          P(E₂) = 0.35          P(E₃) = 0.40\n```\n\n**Step 3 — likelihoods.**\n\n```\n      P(D|E₁) = 0.05        P(D|E₂) = 0.04        P(D|E₃) = 0.02\n```\n\n**Step 4 — Bayes' theorem.**\n\n```\n                            P(E₃) P(D|E₃)\n      P(E₃|D) = ───────────────────────────────────────────\n                 P(E₁)P(D|E₁) + P(E₂)P(D|E₂) + P(E₃)P(D|E₃)\n```\n\n**Step 5 — substitute.**\n\n```\n      P(E₁)P(D|E₁) = 0.25 × 0.05 = 0.0125\n      P(E₂)P(D|E₂) = 0.35 × 0.04 = 0.0140\n      P(E₃)P(D|E₃) = 0.40 × 0.02 = 0.0080\n                                   ────────\n      Denominator  =               0.0345\n```\n\n*(Note in passing: 0.0345 is P(D), the overall defective rate — that is the total probability\ntheorem, and it is often asked as a separate part.)*\n\n```\n      P(E₃|D) = 0.0080 / 0.0345 = 80/345 = 16/69\n```\n\n```\nP(machine C | defective) = 16/69          ≈ 0.232\n```\n\n### Q3 — die thrown twice, sum is 6, was a 4 shown?\n\n**Define events.**\n\n```\n      A : the number 4 appears at least once\n      B : the sum of the two numbers is 6\n```\n\n**List B.** The outcomes with sum 6:\n\n```\n      (1,5), (2,4), (3,3), (4,2), (5,1)          →  n(B) = 5\n```\n\n**List A ∩ B.** Which of those contain a 4?\n\n```\n      (2,4), (4,2)                                →  n(A ∩ B) = 2\n```\n\n**Compute.** All 36 outcomes are equally likely, so\n\n```\n      P(B) = 5/36          P(A ∩ B) = 2/36\n```\n\n```\n      P(A|B) = P(A ∩ B)/P(B) = (2/36)/(5/36) = 2/5\n```\n\n```\nP(a 4 appeared at least once | the sum is 6) = 2/5\n```\n\n> Once you have restricted to the five outcomes with sum 6, the answer is just \"2 out of 5\". Listing\n> the reduced sample space explicitly is the fastest and safest method for this question type.\n\n### Q4 — independent events, P(A ∪ B)\n\n```\n      P(A ∪ B) = P(A) + P(B) − P(A ∩ B)\n```\n\nSince A and B are **independent**, P(A ∩ B) = P(A)·P(B) = (0.3)(0.4) = 0.12.\n\n```\n      P(A ∪ B) = 0.3 + 0.4 − 0.12 = 0.58\n```\n\n### Q5 — probability distribution of the number of aces (with replacement)\n\nLet X = the number of aces drawn. Since the draws are **with replacement**, the two draws are\nindependent, and on each draw\n\n```\n      P(ace) = 4/52 = 1/13          P(not ace) = 12/13\n```\n\nX can be 0, 1 or 2.\n\n```\n      P(X = 0) = (12/13)(12/13) = 144/169\n\n      P(X = 1) = (1/13)(12/13) + (12/13)(1/13) = 24/169      [ace first, or ace second]\n\n      P(X = 2) = (1/13)(1/13) = 1/169\n```\n\n**Probability distribution:**\n\n| X | 0 | 1 | 2 |\n| --- | --- | --- | --- |\n| P(X) | 144/169 | 24/169 | 1/169 |\n\n**Check:** (144 + 24 + 1)/169 = 169/169 = 1 ✓\n\n**Mean:**\n\n```\n      E(X) = Σ xᵢ pᵢ = 0(144/169) + 1(24/169) + 2(1/169)\n           = (0 + 24 + 2)/169\n           = 26/169\n           = 2/13\n```\n\n```\nMean = 2/13          ≈ 0.154\n```\n\n*(Sensible: each draw gives an ace with probability 1/13, and there are two draws, so on average\n2/13 aces.)*\n\n### Q6 — urn with balls added\n\n**Define events.**\n\n```\n      R₁ : the first ball drawn is red          B₁ : the first ball drawn is black\n      R₂ : the second ball drawn is red\n```\n\n**Priors.** The urn starts with 5 red and 5 black, so 10 balls:\n\n```\n      P(R₁) = 5/10 = 1/2          P(B₁) = 5/10 = 1/2\n```\n\n**Likelihoods.** The ball drawn is returned, **and 2 more of the same colour are added**, so the urn\nthen has 12 balls.\n\n```\n      If R₁ occurred: 5 + 2 = 7 red and 5 black    ⟹   P(R₂|R₁) = 7/12\n      If B₁ occurred: 5 red and 5 + 2 = 7 black    ⟹   P(R₂|B₁) = 5/12\n```\n\n**Apply the total probability theorem:**\n\n```\n      P(R₂) = P(R₁)P(R₂|R₁) + P(B₁)P(R₂|B₁)\n            = (1/2)(7/12) + (1/2)(5/12)\n            = (7 + 5)/24\n            = 12/24\n```\n\n```\nP(the second ball is red) = 1/2\n```\n\n> A pleasing result: adding balls of the colour drawn does not change the probability that the next\n> ball is red, because the urn started symmetric. Worth stating as a remark — it shows understanding.\n\n### Q7 — find P(A|B)\n\n```\n      P(A ∪ B) = P(A) + P(B) − P(A ∩ B)\n⟹     7/11 = 6/11 + 5/11 − P(A ∩ B)\n⟹     P(A ∩ B) = 11/11 − 7/11 = 4/11\n```\n\n```\n      P(A|B) = P(A ∩ B)/P(B) = (4/11)/(5/11) = 4/5\n```\n\n### Q8 — P(B|A) = 1\n\n```\n      P(B|A) = P(A ∩ B)/P(A) = 1     ⟹     P(A ∩ B) = P(A)\n```\n\nIf the probability of A ∩ B equals the probability of A, then A contributes nothing outside B — i.e.\n**A ⊂ B**.\n\n**Answer: (a) A ⊂ B**\n\n*(Interpretation: whenever A happens, B is certain to happen. That means A is contained in B.)*\n\n### Q9 — three kings without replacement\n\n**Define events.**\n\n```\n      K₁ : the first card is a king\n      K₂ : the second card is a king\n      K₃ : the third card is a king\n```\n\nSince the draws are **without replacement**, use the multiplication theorem for three events:\n\n```\n      P(K₁ ∩ K₂ ∩ K₃) = P(K₁) · P(K₂|K₁) · P(K₃|K₁ ∩ K₂)\n```\n\n```\n      P(K₁) = 4/52                        [4 kings in 52 cards]\n      P(K₂|K₁) = 3/51                     [3 kings left in 51 cards]\n      P(K₃|K₁ ∩ K₂) = 2/50                [2 kings left in 50 cards]\n```\n\n```\n      P = (4/52)(3/51)(2/50) = 24/132600 = 1/5525\n```\n\n```\nP(all three cards are kings) = 1/5525          ≈ 0.000181\n```\n\n### Q10 — case study: left-handed students\n\n**Define events.**\n\n```\n      G : the student is a girl          B : the student is a boy\n      L : the student is left-handed\n```\n\n```\n      P(G) = 0.40          P(B) = 0.60\n      P(L|G) = 0.05        P(L|B) = 0.08\n```\n\n**(i) P(L) — by the theorem of total probability:**\n\n```\n      P(L) = P(G)P(L|G) + P(B)P(L|B)\n           = (0.40)(0.05) + (0.60)(0.08)\n           = 0.020 + 0.048\n           = 0.068\n```\n\n**P(a student is left-handed) = 0.068 = 17/250**\n\n**(ii) P(G|L) — by Bayes' theorem:**\n\n```\n                  P(G)P(L|G)          0.020\n      P(G|L) = ──────────────── = ───────────── = 20/68 = 5/17\n                     P(L)              0.068\n```\n\n**P(the student is a girl | left-handed) = 5/17 ≈ 0.294**\n\n**(iii)** Part (i) uses the **theorem of total probability**; part (ii) uses **Bayes' theorem**.\n\n*(Notice that 5/17 ≈ 0.294 is well below P(G) = 0.40 — knowing the student is left-handed makes\n\"girl\" less likely, because boys are left-handed at a higher rate. Sanity checks like this one are\nworth doing.)*\n\n### Q11 — find k and the mean\n\n**Use Σpᵢ = 1:**\n\n```\n      k + 2k + 3k + 4k = 1\n⟹     10k = 1\n⟹     k = 1/10\n```\n\n**Distribution:**\n\n| X | 0 | 1 | 2 | 3 |\n| --- | --- | --- | --- | --- |\n| P(X) | 1/10 | 2/10 | 3/10 | 4/10 |\n\n**Mean:**\n\n```\n      E(X) = 0(1/10) + 1(2/10) + 2(3/10) + 3(4/10)\n           = (0 + 2 + 6 + 12)/10\n           = 20/10\n           = 2\n```\n\n```\nk = 1/10 and Mean = 2\n```\n\n### Q12 — Assertion–Reason\n\n**A:** \"Mutually exclusive events with non-zero probabilities cannot be independent.\" **True.**\nIf mutually exclusive, P(A ∩ B) = 0. If also independent, P(A ∩ B) = P(A)P(B), which would force\nP(A)P(B) = 0, contradicting both being non-zero.\n\n**R:** \"For mutually exclusive events, P(A ∩ B) = 0.\" **True** — that is the definition.\n\n**Does R explain A?** Yes — A follows directly from R combined with the independence condition.\n\n**Answer: (a) Both A and R are true, and R is the correct explanation of A.**\n\n---","test":"Time: 50 minutes. Answers below.\n\n1. *(1)* If P(A) = 0.5, P(B) = 0.4 and P(A ∩ B) = 0.2, then P(A|B) is\n   (a) 0.4 (b) 0.5 (c) 0.2 (d) 0.8\n2. *(1)* If A and B are independent, P(A) = 1/2, P(B) = 1/3, then P(A ∩ B) is\n   (a) 5/6 (b) 1/6 (c) 2/3 (d) 1/5\n3. *(1)* For a probability distribution, Σpᵢ must equal\n   (a) 0 (b) 1 (c) n (d) any positive number\n4. *(2)* A coin is tossed three times. Find the probability of getting at least two heads.\n5. *(2)* If P(A) = 0.6, P(B) = 0.3 and A, B are independent, find P(neither A nor B).\n6. *(3)* Two dice are thrown. Given that the sum is 8, find the probability that one die shows a 2.\n7. *(3)* A bag contains 4 red and 6 white balls. Two balls are drawn without replacement. Find the\n   probability that both are red.\n8. *(4)* A random variable X has the distribution below. Find c and E(X).\n\n   | X | 1 | 2 | 3 | 4 | 5 |\n   | --- | --- | --- | --- | --- | --- |\n   | P(X) | c | 2c | 2c | 3c | c |\n\n9. *(5)* Of the students in a college, 60% reside in a hostel and 40% do not. Past records show that\n   30% of the hostellers and 20% of the day-scholars attain an A grade. One student is chosen at\n   random and has an A grade. What is the probability that the student is a hosteller?\n10. *(5)* Two groups are competing for the board positions of a corporation. The probabilities that\n    the first and second groups will win are 0.6 and 0.4. Further, if the first group wins, the\n    probability of introducing a new product is 0.7, and the corresponding probability if the second\n    group wins is 0.3. Find the probability that the new product was introduced by the second group.\n11. *(3)* A die is tossed twice. Find the probability distribution of the number of times a number\n    greater than 4 appears, and find its mean.\n12. *(2)* Three coins are tossed. Let A be \"at least two heads\" and B \"the first coin shows a head\".\n    Find P(A|B).\n13. *(2)* If A and B are events with P(A) = 0.4, P(B) = 0.8 and P(B|A) = 0.6, find P(A|B).\n\n### Answer key\n\n**1. (b) 0.5.** P(A|B) = 0.2/0.4 = 0.5.\n\n**2. (b) 1/6.** (1/2)(1/3).\n\n**3. (b) 1.**\n\n**4. 1/2.** Sample space has 8 outcomes. At least two heads: HHH, HHT, HTH, THH → 4/8 = 1/2.\n\n**5. 0.28.** P(A′ ∩ B′) = (1 − 0.6)(1 − 0.3) = (0.4)(0.7) = 0.28.\n\n**6. 2/5.** Outcomes with sum 8: (2,6), (3,5), (4,4), (5,3), (6,2) → 5 outcomes. Of these, those\ncontaining a 2: (2,6) and (6,2) → 2. So P = 2/5.\n\n**7. 2/15.** (4/10)(3/9) = 12/90 = 2/15.\n\n**8. c = 1/9, E(X) = 3.** Σp = c + 2c + 2c + 3c + c = 9c = 1 ⟹ c = 1/9.\nE(X) = [1(1) + 2(2) + 3(2) + 4(3) + 5(1)]/9 = (1 + 4 + 6 + 12 + 5)/9 = 27/9 = 3.\n\n**9. 9/13.** Let H = hosteller, D = day-scholar, A = A grade.\nP(H) = 0.6, P(D) = 0.4, P(A|H) = 0.3, P(A|D) = 0.2.\nP(A) = (0.6)(0.3) + (0.4)(0.2) = 0.18 + 0.08 = 0.26.\nP(H|A) = 0.18/0.26 = 18/26 = **9/13** ≈ 0.692.\n\n**10. 2/9.** Let E₁ = first group wins, E₂ = second group wins, N = new product introduced.\nP(E₁) = 0.6, P(E₂) = 0.4, P(N|E₁) = 0.7, P(N|E₂) = 0.3.\nP(N) = (0.6)(0.7) + (0.4)(0.3) = 0.42 + 0.12 = 0.54.\nP(E₂|N) = 0.12/0.54 = 12/54 = **2/9** ≈ 0.222.\n\n**11.** \"Greater than 4\" means 5 or 6, so p = 2/6 = 1/3 per throw, and the throws are independent.\nX = 0, 1, 2.\nP(X = 0) = (2/3)² = 4/9; P(X = 1) = 2(1/3)(2/3) = 4/9; P(X = 2) = (1/3)² = 1/9.\nCheck: 4/9 + 4/9 + 1/9 = 1 ✓\nE(X) = 0(4/9) + 1(4/9) + 2(1/9) = 6/9 = **2/3**.\n\n**12. 3/4.** B = {HHH, HHT, HTH, HTT}, so P(B) = 4/8. A ∩ B = {HHH, HHT, HTH}, so P(A ∩ B) = 3/8.\nP(A|B) = (3/8)/(4/8) = 3/4.\n\n**13. 0.3.** P(A ∩ B) = P(A)·P(B|A) = (0.4)(0.6) = 0.24. P(A|B) = 0.24/0.8 = 0.3.\n\n**Scoring.** Out of 34. Below 24 → the loss is almost certainly conditional-probability *direction*.\nRedo §3 Q1, Q2 and Q10, writing out the five-step Bayes layout each time even when it feels\nunnecessary.\n\n---","tips":"**On Bayes' theorem — the 4/5-mark question**\n\n1. **Define the events with letters, in words, before any arithmetic.** \"Let E₁ be the event that the\n   item came from machine A; let D be the event that the item is defective.\" This is a mark, and it\n   is the step that prevents the inversion error.\n\n2. **List all the priors, then all the likelihoods, as two separate groups.** Do not mix them. If you\n   have three machines you should have exactly three priors and three likelihoods before you write\n   the formula.\n\n3. **Write the formula out in full before substituting**, with the whole denominator shown. Dropping\n   a term from the denominator is the second-most-common error.\n\n4. **The word \"given\" tells you the denominator.** \"Given that it is defective\" → the conditioning\n   event is D, so you want P(machine|D), and P(D) is the denominator.\n\n5. **The denominator is P(A) by the total probability theorem — say so.** Many questions ask for P(A)\n   as a separate part, and pointing out the connection is good practice and sometimes a mark.\n\n6. **Do a sanity check on the answer.** Posterior probabilities must lie between 0 and 1, and they\n   should move in the sensible direction relative to the prior. If a machine makes 40% of output but\n   only 2% defectives, its posterior share of defectives must be *below* 40% — 16/69 ≈ 23% ✓.\n\n7. **Leave the answer as a fraction in lowest terms**, and add the decimal in brackets. 16/69 rather\n   than 0.2318…\n\n**On conditional probability**\n\n8. **For dice and coin problems, list the reduced sample space explicitly.** Writing out the five\n   outcomes with sum 6 is faster and far safer than manipulating formulas, and it shows your method.\n\n9. **State which of P(A|B) and P(B|A) you are computing.** Write it symbolically before substituting.\n\n10. **For \"without replacement\", the denominators decrease.** 4/52, then 3/51, then 2/50. For \"with\n    replacement\" they do not. Read the question for which it is — this single word changes the whole\n    answer.\n\n**On independence**\n\n11. **Never assume independence.** Use P(A ∩ B) = P(A)P(B) **only** when the question says the events\n    are independent, or you have verified it. Conversely, when a question asks you to *check*\n    independence, compute both P(A ∩ B) and P(A)P(B) and compare.\n\n12. **\"At least one\" means 1 − P(none).** For independent events, P(at least one) =\n    1 − (1 − P(A))(1 − P(B)). This is almost always faster than adding cases.\n\n**On random variables**\n\n13. **Use Σpᵢ = 1 to find the unknown constant**, and show that equation. It is the first mark.\n\n14. **Present the distribution as a table**, then compute the mean underneath it. Do not compute the\n    mean inline.\n\n15. **Do not compute variance.** It is out of syllabus, and time spent on it is wasted."}},{"id":"p1","subj":"physics","num":1,"title":"Electric Charges and Fields","unit":"Units I+II · Electrostatics & Current","unitMarks":16,"prio":1,"appear":"Units I + II (16 marks, shared with Ch 2 and Ch 3) · Typical appearance: 1–2 MCQs + a 2-mark flux or dipole question, and often the 5-mark Gauss's law derivation-plus-application.","deleted":"Nothing substantial was removed from this chapter beyond what was already out of the\nsenior-secondary course. (The Van de Graaff generator, sometimes taught alongside, belongs to Ch 2\nand **is** deleted.)","recall":"```\nq = ne,  e = 1.6 × 10⁻¹⁹ C          k = 1/4πε₀ = 9 × 10⁹ N m² C⁻²\nε₀ = 8.854 × 10⁻¹² C² N⁻¹ m⁻²\n\nCoulomb :  F = k q₁q₂/r²      F_medium = F_vacuum/K\nField   :  E = F/q₀ = k q/r²          unit N C⁻¹ = V m⁻¹\n\nDIPOLE :  p = q(2a), directed from −q to +q\n  axial      (r >> a) : E = 2kp/r³        along p\n  equatorial (r >> a) : E = kp/r³         antiparallel to p\n  axial = 2 × equatorial ;  dipole field ∝ 1/r³\n  torque τ = pE sin θ = p × E ;  net force in a uniform field = 0\n  stable at θ = 0°, unstable at θ = 180°\n\nFLUX :  φ = ∮E·dA = EA cos θ            unit N m² C⁻¹\nGAUSS:  φ = q_enclosed/ε₀               (independent of surface shape; outside charges give 0)\n\n  infinite wire  :  E = λ/(2πε₀ r)          ∝ 1/r\n  infinite sheet :  E = σ/(2ε₀)             independent of distance\n  spherical shell:  outside E = kq/r² ;  INSIDE E = 0 ;  surface E = σ/ε₀\n\nCONDUCTOR: E = 0 inside ; charge on outer surface ; E ⊥ surface, magnitude σ/ε₀\n```","s":{"scope":"### In the syllabus\n\n- Electric charges; **conservation of charge**\n- **Coulomb's law** — force between two point charges; forces between multiple charges;\n  **superposition principle**; continuous charge distribution\n- **Electric field**; field due to a point charge; **electric field lines**\n- **Electric dipole**; field due to a dipole; **torque** on a dipole in a uniform field\n- **Electric flux**; statement of **Gauss's theorem** and its applications to find the field due to\n  - an infinitely long straight **wire**\n  - a uniformly charged infinite plane **sheet**\n  - a uniformly charged thin **spherical shell** (field inside and outside)\n\n### Deleted\n\nNothing substantial was removed from this chapter beyond what was already out of the\nsenior-secondary course. (The Van de Graaff generator, sometimes taught alongside, belongs to Ch 2\nand **is** deleted.)\n\n---","brief":"### Properties of electric charge\n\n| Property | Statement |\n| --- | --- |\n| **Quantisation** | q = ne, where n is an integer and e = 1.6 × 10⁻¹⁹ C |\n| **Conservation** | The total charge of an isolated system is constant |\n| **Additivity** | Charge is a scalar and adds algebraically |\n\n### Coulomb's law\n\nThe force between two point charges q₁ and q₂ separated by r, in vacuum:\n\n```\n      F = (1/4πε₀) · q₁q₂/r²  =  k q₁q₂/r²\n```\n\n```\n      k = 1/4πε₀ = 9 × 10⁹ N m² C⁻²          ε₀ = 8.854 × 10⁻¹² C² N⁻¹ m⁻²\n```\n\n**Vector form** (force on charge 2 due to charge 1):\n\n```\n      F₂₁ = (1/4πε₀) (q₁q₂/r²) r̂₂₁\n```\n\n**In a medium** of dielectric constant (relative permittivity) K:\n\n```\n      F_medium = F_vacuum / K\n```\n\nso the force is always **reduced** in a medium.\n\n**Superposition principle.** The force on a charge due to several others is the **vector sum** of the\nforces due to each one taken separately, each computed as if the others were absent.\n\n### Electric field\n\n```\n      E = F/q₀                      (force per unit positive test charge)\n      E = (1/4πε₀) q/r²             (due to a point charge q, at distance r)\n```\n\n**E is a vector**, with SI unit N C⁻¹ (equivalently V m⁻¹).\n\n**Properties of electric field lines** (a standard 2-mark question):\n\n1. They start on **positive** charges and end on **negative** charges.\n2. They are **continuous** curves without breaks in a charge-free region.\n3. **Two field lines never intersect** — if they did, there would be two directions of E at that\n   point, which is impossible.\n4. They do not form **closed loops** (a consequence of the electrostatic field being conservative).\n5. The **tangent** at any point gives the direction of E there; the **density** of lines gives the\n   magnitude.\n6. They are always **perpendicular to the surface of a conductor** in electrostatics.\n7. **Equidistant parallel lines** represent a uniform field.\n\n### Electric dipole\n\nTwo equal and opposite charges +q and −q separated by 2a.\n\n```\n      Dipole moment  p
