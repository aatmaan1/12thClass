 / + − +\n\nMinor M_ij : delete row i, col j\nCofactor A_ij = (−1)^(i+j) M_ij\n\nadj A = TRANSPOSE of the cofactor matrix\nA(adj A) = (adj A)A = |A| I\nA⁻¹ = (1/|A|) adj A          (needs |A| ≠ 0)\n\n|AB| = |A||B|      |Aᵀ| = |A|      |kA| = kⁿ|A|      |Aⁿ| = |A|ⁿ\n|A⁻¹| = 1/|A|      |adj A| = |A|^(n−1)      adj(AB) = (adj B)(adj A)\n\nArea of triangle = ½ |det[[x₁,y₁,1],[x₂,y₂,1],[x₃,y₃,1]]|\nCollinear ⟺ that determinant = 0\n\nAX = B → X = A⁻¹B if |A| ≠ 0 (unique solution)\n|A| = 0, (adj A)B ≠ O → inconsistent\n|A| = 0, (adj A)B = O → infinitely many, or none\n```","s":{"scope":"### In the syllabus\n\n- Determinant of a square matrix, **up to 3 × 3**\n- **Minors** and **cofactors**\n- Application of determinants to the **area of a triangle**\n- **Adjoint** and **inverse** of a square matrix\n- **Consistency, inconsistency** and number of solutions of a system of linear equations\n- **Solving a system of linear equations in two or three variables (unique solution) using the\n  inverse of a matrix**\n\n### Deleted — do not study\n\n- **Properties of determinants** — the whole \"evaluate this determinant using row/column operations\n  and prove it equals (a−b)(b−c)(c−a)\" family\n\n> **Consequence.** Determinants are now something you *compute*, not something you *manipulate*.\n> The long property-based proofs that used to be a guaranteed 5-marker are gone, and their weight\n> moved to the matrix method for solving equations. Don't spend time on `R₁ → R₁ + R₂` gymnastics.\n\n---","brief":"### Determinant of a 2 × 2\n\n```\n        | a  b |\n|A| =   | c  d |  =  ad − bc\n```\n\n### Determinant of a 3 × 3 — expansion along a row or column\n\n```\n        | a₁  b₁  c₁ |\n|A| =   | a₂  b₂  c₂ |\n        | a₃  b₃  c₃ |\n\n    = a₁ (b₂c₃ − b₃c₂)  −  b₁ (a₂c₃ − a₃c₂)  +  c₁ (a₂b₃ − a₃b₂)\n```\n\nEach bracket is the 2 × 2 determinant left after deleting the row and column of the leading element.\nThe **signs alternate** in the pattern\n\n```\n+  −  +\n−  +  −\n+  −  +\n```\n\nYou may expand along **any row or column** — the answer is the same. **Choose the row or column with\nthe most zeros.** If a row has two zeros, that expansion is one term instead of three. This single\nhabit saves more time in the exam than any other trick in this chapter.\n\n### Minors and cofactors\n\n- **Minor** M_ij = the determinant of the 2 × 2 matrix left after deleting row i and column j\n- **Cofactor** A_ij = (−1)^(i+j) · M_ij\n\nSo the cofactor is the minor with the sign from the checkerboard above. The distinction matters:\nquestions ask for one or the other specifically.\n\n**Expansion in cofactor form:** |A| = a₁₁A₁₁ + a₁₂A₁₂ + a₁₃A₁₃ (along row 1), or along any other row\nor column.\n\n> **A result that gets asked:** the sum of the products of the elements of any row with the cofactors\n> of a **different** row is **zero**. E.g. a₁₁A₂₁ + a₁₂A₂₂ + a₁₃A₂₃ = 0.\n\n### Area of a triangle\n\nFor vertices (x₁, y₁), (x₂, y₂), (x₃, y₃):\n\n```\n              | x₁  y₁  1 |\nArea = ½ | ·  | x₂  y₂  1 | |         (the outer bars are absolute value)\n              | x₃  y₃  1 |\n```\n\n**Collinearity:** three points are collinear ⟺ the area is zero ⟺ that determinant is 0. This is how\n\"find k so that the points are collinear\" is set.\n\n> Always take the **absolute value** — area cannot be negative. And write the units as \"square units\".\n\n### Singular and non-singular\n\n- **Singular matrix:** |A| = 0. Has **no** inverse.\n- **Non-singular matrix:** |A| ≠ 0. Has an inverse.\n\n### Adjoint\n\nThe **adjoint** of A is the **transpose of the matrix of cofactors**:\n\n```\nadj A = [A_ij]ᵀ      i.e.      adj A = [ A₁₁  A₂₁  A₃₁ ]\n                                       [ A₁₂  A₂₂  A₃₂ ]\n                                       [ A₁₃  A₂₃  A₃₃ ]\n```\n\n**The transpose step is where most marks are lost in this chapter.** Compute all nine cofactors,\nwrite them in their natural positions, *then transpose*.\n\n**Key identity:**\n\n```\nA (adj A) = (adj A) A = |A| · I\n```\n\n### Inverse\n\n```\nA⁻¹ = (1/|A|) · adj A          provided |A| ≠ 0\n```\n\nProperties:\n\n| Result | For a matrix of order n |\n| --- | --- |\n| \\|AB\\| = \\|A\\|\\|B\\| | |\n| \\|Aᵀ\\| = \\|A\\| | |\n| \\|kA\\| = kⁿ\\|A\\| | **n = 3 for a 3 × 3, so \\|kA\\| = k³\\|A\\|** |\n| \\|Aⁿ\\| = \\|A\\|ⁿ | |\n| \\|A⁻¹\\| = 1/\\|A\\| | |\n| \\|adj A\\| = \\|A\\|^(n−1) | **= \\|A\\|² for a 3 × 3** |\n| adj(AB) = (adj B)(adj A) | order reverses, like transpose |\n| (AB)⁻¹ = B⁻¹A⁻¹ | order reverses |\n| (A⁻¹)⁻¹ = A | |\n| Determinant of a skew-symmetric matrix of **odd** order | = 0 |\n\nThe two most-asked of these are **|kA| = kⁿ|A|** and **|adj A| = |A|^(n−1)**. Learn the exponents:\nfor a 3 × 3, k³ and |A|².\n\n### Solving a system of linear equations — the matrix method\n\nWrite the system\n\n```\na₁x + b₁y + c₁z = d₁\na₂x + b₂y + c₂z = d₂\na₃x + b₃y + c₃z = d₃\n```\n\nas **AX = B**, where\n\n```\nA = [ a₁  b₁  c₁ ]      X = [ x ]      B = [ d₁ ]\n    [ a₂  b₂  c₂ ]          [ y ]          [ d₂ ]\n    [ a₃  b₃  c₃ ]          [ z ]          [ d₃ ]\n```\n\nIf |A| ≠ 0, then **X = A⁻¹B**.\n\n**The five-step procedure** — write it in exactly this order every time:\n\n1. Write AX = B and identify A, X, B.\n2. Compute **|A|**. Say explicitly whether it is ≠ 0, and conclude the system has a **unique\n   solution**.\n3. Compute **all nine cofactors**.\n4. Write **adj A** (the transpose of the cofactor matrix), then **A⁻¹ = (1/|A|) adj A**.\n5. Compute **X = A⁻¹B** and read off x, y, z.\n\n### Consistency\n\n| Case | Conclusion |\n| --- | --- |\n| \\|A\\| ≠ 0 | **Consistent**, with a **unique** solution: X = A⁻¹B |\n| \\|A\\| = 0 and (adj A)B ≠ O | **Inconsistent** — no solution |\n| \\|A\\| = 0 and (adj A)B = O | Either **infinitely many** solutions or **no** solution — must check further |\n\nFor the special case of a **homogeneous** system (B = O): x = y = z = 0 is always a solution, so it is\nalways consistent. If |A| ≠ 0 that trivial solution is the only one; if |A| = 0 there are infinitely\nmany non-trivial solutions.\n\n### Quick recall box\n\n```\n2×2:  |A| = ad − bc\n3×3:  expand along the row/column with most zeros; signs  + − + / − + − / + − +\n\nMinor M_ij : delete row i, col j\nCofactor A_ij = (−1)^(i+j) M_ij\n\nadj A = TRANSPOSE of the cofactor matrix\nA(adj A) = (adj A)A = |A| I\nA⁻¹ = (1/|A|) adj A          (needs |A| ≠ 0)\n\n|AB| = |A||B|      |Aᵀ| = |A|      |kA| = kⁿ|A|      |Aⁿ| = |A|ⁿ\n|A⁻¹| = 1/|A|      |adj A| = |A|^(n−1)      adj(AB) = (adj B)(adj A)\n\nArea of triangle = ½ |det[[x₁,y₁,1],[x₂,y₂,1],[x₃,y₃,1]]|\nCollinear ⟺ that determinant = 0\n\nAX = B → X = A⁻¹B if |A| ≠ 0 (unique solution)\n|A| = 0, (adj A)B ≠ O → inconsistent\n|A| = 0, (adj A)B = O → infinitely many, or none\n```\n\n---","pyq":"**Q1.** *(5 marks — the flagship question of this unit)*\nSolve the following system of equations by the matrix method:\n\n```\n2x + 3y + 3z = 5\n x − 2y +  z = −4\n3x −  y − 2z = 3\n```\n\n**Q2.** *(5 marks)* If A = [[1, −1, 2], [0, 2, −3], [3, −2, 4]], find A⁻¹.\n\n**Q3.** *(1 mark, MCQ)* If A is a 3 × 3 matrix with |A| = 4, then |2A| equals\n(a) 8 (b) 16 (c) 32 (d) 64\n\n**Q4.** *(2 marks)* If A is a 3 × 3 matrix with |A| = 5, find |adj A| and |A⁻¹|.\n\n**Q5.** *(2 marks)* Find the area of the triangle whose vertices are (1, 0), (6, 0) and (4, 3).\n\n**Q6.** *(3 marks)* Find the value(s) of k for which the points (k, 2 − 2k), (1 − k, 2k) and\n(−4 − k, 6 − 2k) are collinear.\n\n**Q7.** *(5 marks, word problem — a recurring dressing of Q1)*\nThe sum of three numbers is 6. If we multiply the third number by 3 and add the second number to it,\nwe get 11. By adding the first and third numbers we get double the second number. Represent this\nalgebraically and find the numbers using the matrix method.\n\n**Q8.** *(3 marks)* For A = [[2, 3], [1, −4]], verify that A(adj A) = |A| I.\n\n**Q9.** *(1 mark, MCQ)* If A is a square matrix of order 3 and |A| = −2, then |adj A| is\n(a) −2 (b) 2 (c) 4 (d) −4\n\n**Q10.** *(2 marks)* Examine the consistency of the system\nx + 2y = 2, 2x + 3y = 3.\n\n**Q11.** *(1 mark)* Write the minor and the cofactor of the element a₂₃ in\n\n```\n[ 1  −2   3 ]\n[ 4   5  −6 ]\n[ 7   8   9 ]\n```\n\n**Q12.** *(1 mark, Assertion–Reason)*\n**A:** If A is a singular matrix, then A⁻¹ does not exist.\n**R:** A⁻¹ = (1/|A|) adj A.\n\n---","sol":"### Q1 — solve by the matrix method\n\n**Step 1. Write AX = B.**\n\n```\nA = [ 2   3   3 ]      X = [ x ]      B = [  5 ]\n    [ 1  −2   1 ]          [ y ]          [ −4 ]\n    [ 3  −1  −2 ]          [ z ]          [  3 ]\n```\n\n**Step 2. Compute |A|,** expanding along row 1:\n\n```\n|A| = 2[(−2)(−2) − (1)(−1)] − 3[(1)(−2) − (1)(3)] + 3[(1)(−1) − (−2)(3)]\n    = 2[4 + 1] − 3[−2 − 3] + 3[−1 + 6]\n    = 2(5) − 3(−5) + 3(5)\n    = 10 + 15 + 15\n    = 40\n```\n\nSince **|A| = 40 ≠ 0**, A⁻¹ exists and the system has a **unique solution**.\n\n**Step 3. Cofactors.**\n\n```\nA₁₁ = +[(−2)(−2) − (1)(−1)]  = 4 + 1   =  5\nA₁₂ = −[(1)(−2)  − (1)(3)]   = −(−5)   =  5\nA₁₃ = +[(1)(−1)  − (−2)(3)]  = −1 + 6  =  5\n\nA₂₁ = −[(3)(−2)  − (3)(−1)]  = −(−3)   =  3\nA₂₂ = +[(2)(−2)  − (3)(3)]   = −4 − 9  = −13\nA₂₃ = −[(2)(−1)  − (3)(3)]   = −(−11)  =  11\n\nA₃₁ = +[(3)(1)   − (3)(−2)]  = 3 + 6   =  9\nA₃₂ = −[(2)(1)   − (3)(1)]   = −(−1)   =  1\nA₃₃ = +[(2)(−2)  − (3)(1)]   = −4 − 3  = −7\n```\n\n**Step 4. adj A** = transpose of the cofactor matrix:\n\n```\ncofactor matrix = [  5    5    5 ]\n                  [  3  −13   11 ]\n                  [  9    1   −7 ]\n```\n\nTransposing it (rows become columns):\n\n```\nadj A = [  5   3   9 ]\n        [  5 −13   1 ]\n        [  5  11  −7 ]\n```\n\nSo\n\n```\nA⁻¹ = (1/40) [  5   3   9 ]\n             [  5 −13   1 ]\n             [  5  11  −7 ]\n```\n\n**Step 5. X = A⁻¹B.**\n\n```\nX = (1/40) [  5   3   9 ] [  5 ]\n           [  5 −13   1 ] [ −4 ]\n           [  5  11  −7 ] [  3 ]\n\n  = (1/40) [ 5(5) + 3(−4) + 9(3)   ]   = (1/40) [  25 − 12 + 27 ]   = (1/40) [  40 ]\n           [ 5(5) − 13(−4) + 1(3)  ]            [  25 + 52 +  3 ]            [  80 ]\n           [ 5(5) + 11(−4) − 7(3)  ]            [  25 − 44 − 21 ]            [ −40 ]\n\n  = [  1 ]\n    [  2 ]\n    [ −1 ]\n```\n\n**Hence x = 1, y = 2, z = −1.**\n\n*Verification (always do this — it costs 20 seconds):*\n2(1) + 3(2) + 3(−1) = 2 + 6 − 3 = 5 ✓\n1 − 2(2) + (−1) = 1 − 4 − 1 = −4 ✓\n3(1) − 2 − 2(−1) = 3 − 2 + 2 = 3 ✓\n\n### Q2 — find A⁻¹\n\n```\nA = [ 1  −1   2 ]\n    [ 0   2  −3 ]\n    [ 3  −2   4 ]\n```\n\n**|A|**, expanding along row 1:\n\n```\n|A| = 1[(2)(4) − (−3)(−2)] − (−1)[(0)(4) − (−3)(3)] + 2[(0)(−2) − (2)(3)]\n    = 1[8 − 6] + 1[0 + 9] + 2[0 − 6]\n    = 2 + 9 − 12\n    = −1\n```\n\n|A| = −1 ≠ 0, so A⁻¹ exists.\n\n**Cofactors:**\n\n```\nA₁₁ = +[(2)(4)  − (−3)(−2)] = 8 − 6  =  2\nA₁₂ = −[(0)(4)  − (−3)(3)]  = −(9)   = −9\nA₁₃ = +[(0)(−2) − (2)(3)]   = −6     = −6\n\nA₂₁ = −[(−1)(4) − (2)(−2)]  = −(0)   =  0\nA₂₂ = +[(1)(4)  − (2)(3)]   = −2     = −2\nA₂₃ = −[(1)(−2) − (−1)(3)]  = −(1)   = −1\n\nA₃₁ = +[(−1)(−3) − (2)(2)]  = 3 − 4  = −1\nA₃₂ = −[(1)(−3)  − (2)(0)]  = 3      =  3\nA₃₃ = +[(1)(2)   − (−1)(0)] = 2      =  2\n```\n\n**adj A** (transpose of the above):\n\n```\nadj A = [  2    0   −1 ]\n        [ −9   −2    3 ]\n        [ −6   −1    2 ]\n```\n\n**A⁻¹ = (1/|A|) adj A = (1/−1) adj A = −adj A:**\n\n```\nA⁻¹ = [ −2   0   1 ]\n      [  9   2  −3 ]\n      [  6   1  −2 ]\n```\n\n*Verification — first row of A times first column of A⁻¹:*\n(1)(−2) + (−1)(9) + (2)(6) = −2 − 9 + 12 = 1 ✓ (the (1,1) entry of I)\n*First row of A times second column:* (1)(0) + (−1)(2) + (2)(1) = 0 − 2 + 2 = 0 ✓\n\n### Q3 — |2A| for a 3 × 3 with |A| = 4\n\n|kA| = kⁿ|A| with n = 3:\n\n```\n|2A| = 2³ |A| = 8 × 4 = 32\n```\n\n**Answer: (c) 32**\n\n*(The trap is (a) 8, from |2A| = 2|A|. The scalar multiplies **every** row, so it comes out n times.)*\n\n### Q4 — |adj A| and |A⁻¹| for a 3 × 3 with |A| = 5\n\n```\n|adj A| = |A|^(n−1) = |A|² = 5² = 25\n|A⁻¹|  = 1/|A| = 1/5\n```\n\n### Q5 — area of the triangle (1,0), (6,0), (4,3)\n\n```\n             | 1  0  1 |\nArea = ½  |  | 6  0  1 |  |\n             | 4  3  1 |\n```\n\nExpand along row 1:\n\n```\ndet = 1[(0)(1) − (1)(3)] − 0[(6)(1) − (1)(4)] + 1[(6)(3) − (0)(4)]\n    = 1(−3) − 0 + 1(18)\n    = 15\n```\n\n```\nArea = ½ |15| = 15/2 = 7.5 square units\n```\n\n*(Sanity check: the base from (1,0) to (6,0) is 5 units along the x-axis, and the height to (4,3) is\n3. Area = ½ × 5 × 3 = 7.5 ✓)*\n\n### Q6 — find k for collinearity\n\nThe three points are collinear iff\n\n```\n| k       2−2k    1 |\n| 1−k     2k      1 |  = 0\n| −4−k    6−2k    1 |\n```\n\nExpanding along column 3 is tidiest, but let us expand along row 1 to keep it mechanical:\n\n```\ndet = k[ 2k − (6 − 2k) ] − (2 − 2k)[ (1 − k) − (−4 − k) ] + 1[ (1−k)(6−2k) − 2k(−4−k) ]\n```\n\nTerm by term:\n\n```\nTerm 1 = k(2k − 6 + 2k) = k(4k − 6) = 4k² − 6k\n\nTerm 2 = −(2 − 2k)(1 − k + 4 + k) = −(2 − 2k)(5) = −10 + 10k\n\nTerm 3 = (6 − 2k − 6k + 2k²) − (−8k − 2k²)\n       = (6 − 8k + 2k²) + 8k + 2k²\n       = 6 + 4k²\n```\n\nAdding:\n\n```\ndet = 4k² − 6k − 10 + 10k + 6 + 4k²\n    = 8k² + 4k − 4\n```\n\nSet det = 0:\n\n```\n      8k² + 4k − 4 = 0\n⟹     2k² + k − 1 = 0\n⟹     (2k − 1)(k + 1) = 0\n⟹     k = 1/2   or   k = −1\n```\n\n**k = 1/2 or k = −1**\n\n### Q7 — word problem by the matrix method\n\n**Setting up.** Let the numbers be x, y, z.\n\n- \"The sum of three numbers is 6\" → x + y + z = 6\n- \"Multiply the third by 3 and add the second, we get 11\" → y + 3z = 11\n- \"First plus third is double the second\" → x + z = 2y ⟹ x − 2y + z = 0\n\n```\nA = [ 1   1   1 ]      X = [ x ]      B = [  6 ]\n    [ 0   1   3 ]          [ y ]          [ 11 ]\n    [ 1  −2   1 ]          [ z ]          [  0 ]\n```\n\n**|A|**, expanding along row 1:\n\n```\n|A| = 1[(1)(1) − (3)(−2)] − 1[(0)(1) − (3)(1)] + 1[(0)(−2) − (1)(1)]\n    = 1[1 + 6] − 1[−3] + 1[−1]\n    = 7 + 3 − 1 = 9      ≠ 0, so a unique solution exists\n```\n\n**Cofactors:**\n\n```\nA₁₁ = +[(1)(1)  − (3)(−2)] =  7        A₂₁ = −[(1)(1)  − (1)(−2)] = −3\nA₁₂ = −[(0)(1)  − (3)(1)]  =  3        A₂₂ = +[(1)(1)  − (1)(1)]  =  0\nA₁₃ = +[(0)(−2) − (1)(1)]  = −1        A₂₃ = −[(1)(−2) − (1)(1)]  =  3\n\nA₃₁ = +[(1)(3)  − (1)(1)]  =  2\nA₃₂ = −[(1)(3)  − (1)(0)]  = −3\nA₃₃ = +[(1)(1)  − (1)(0)]  =  1\n```\n\n**adj A** (transpose of the cofactor matrix):\n\n```\nadj A = [  7  −3   2 ]\n        [  3   0  −3 ]\n        [ −1   3   1 ]\n```\n\n**X = A⁻¹B = (1/9)(adj A)B:**\n\n```\nX = (1/9) [  7  −3   2 ] [  6 ]   = (1/9) [ 42 − 33 + 0 ]  = (1/9) [  9 ]  = [ 1 ]\n          [  3   0  −3 ] [ 11 ]            [ 18 +  0 − 0 ]           [ 18 ]    [ 2 ]\n          [ −1   3   1 ] [  0 ]            [ −6 + 33 + 0 ]           [ 27 ]    [ 3 ]\n```\n\n**The numbers are 1, 2 and 3.**\n\n*Verification:* 1 + 2 + 3 = 6 ✓; 2 + 3(3) = 11 ✓; 1 + 3 = 4 = 2(2) ✓\n\n### Q8 — verify A(adj A) = |A| I for A = [[2, 3], [1, −4]]\n\n```\n|A| = (2)(−4) − (3)(1) = −8 − 3 = −11\n```\n\nFor a 2 × 2 matrix [[a, b], [c, d]], adj A = [[d, −b], [−c, a]]. So\n\n```\nadj A = [ −4  −3 ]\n        [ −1   2 ]\n```\n\n```\nA(adj A) = [ 2   3 ][ −4  −3 ] = [ 2(−4)+3(−1)    2(−3)+3(2)  ]\n           [ 1  −4 ][ −1   2 ]   [ 1(−4)+(−4)(−1) 1(−3)+(−4)(2) ]\n\n         = [ −8 − 3    −6 + 6  ] = [ −11    0  ]\n           [ −4 + 4    −3 − 8  ]   [   0  −11  ]\n\n         = −11 [ 1  0 ] = |A| · I ✓\n                [ 0  1 ]\n```\n\n**Hence A(adj A) = |A| I, verified.**\n\n> The 2 × 2 shortcut `adj [[a,b],[c,d]] = [[d,−b],[−c,a]]` — swap the diagonal, negate the\n> off-diagonal — is worth memorising. It saves a full minute whenever a 2 × 2 inverse appears.\n\n### Q9 — |adj A| for a 3 × 3 with |A| = −2\n\n```\n|adj A| = |A|^(n−1) = |A|² = (−2)² = 4\n```\n\n**Answer: (c) 4**\n\n*(Note the answer is positive even though |A| is negative — the exponent is even. Option (d) −4 is\nthe trap.)*\n\n### Q10 — consistency of x + 2y = 2, 2x + 3y = 3\n\n```\nA = [ 1  2 ]      |A| = (1)(3) − (2)(2) = 3 − 4 = −1\n    [ 2  3 ]\n```\n\nSince **|A| = −1 ≠ 0**, the system is **consistent** and has a **unique solution**.\n\n*(Finding it, for completeness: adj A = [[3, −2], [−2, 1]], so\nA⁻¹ = (1/−1)[[3,−2],[−2,1]] = [[−3, 2], [2, −1]], and\nX = A⁻¹B = [[−3,2],[2,−1]]·[2,3]ᵀ = [−6 + 6, 4 − 3]ᵀ = [0, 1]ᵀ, i.e. x = 0, y = 1.\nCheck: 0 + 2(1) = 2 ✓ and 2(0) + 3(1) = 3 ✓)*\n\n### Q11 — minor and cofactor of a₂₃\n\na₂₃ = −6 (row 2, column 3). Delete row 2 and column 3:\n\n```\nM₂₃ = | 1  −2 |  = (1)(8) − (−2)(7) = 8 + 14 = 22\n      | 7   8 |\n```\n\n```\nA₂₃ = (−1)^(2+3) M₂₃ = (−1)⁵ (22) = −22\n```\n\n**Minor M₂₃ = 22; cofactor A₂₃ = −22**\n\n### Q12 — Assertion–Reason\n\n**A:** True. Singular means |A| = 0, and the inverse formula requires division by |A|, so A⁻¹ does\nnot exist.\n\n**R:** True. That is the correct formula for the inverse.\n\n**Does R explain A?** Yes — it is precisely because A⁻¹ = (1/|A|) adj A that |A| = 0 makes the\ninverse undefined.\n\n**Answer: (a) Both A and R are true, and R is the correct explanation of A.**\n\n---","test":"Time: 45 minutes. Answers below.\n\n1. *(1)* If A is a 2 × 2 matrix with |A| = 3, then |3A| is\n   (a) 9 (b) 27 (c) 3 (d) 6\n2. *(1)* If A is a 3 × 3 matrix and |adj A| = 16, then |A| is\n   (a) ±4 (b) 4 (c) 16 (d) ±2\n3. *(1)* The determinant of a skew-symmetric matrix of order 3 is\n   (a) 1 (b) 0 (c) −1 (d) cannot be determined\n4. *(2)* Evaluate the determinant of [[2, −1, 3], [0, 4, 0], [1, 5, −2]].\n5. *(2)* If A = [[3, −2], [4, −2]], find A⁻¹.\n6. *(2)* Find the area of the triangle with vertices (2, 7), (1, 1) and (10, 8).\n7. *(2)* Find k if the points (3, −2), (k, 2) and (8, 8) are collinear.\n8. *(3)* Write the minor and the cofactor of a₃₂ in [[2, −3, 5], [6, 0, 4], [1, 5, −7]].\n9. *(3)* If A = [[1, 2], [3, 4]] and B = [[2, 0], [1, 3]], verify |AB| = |A||B|.\n10. *(5)* Solve by the matrix method: x + y + z = 4, 2x + y − 3z = −9, 2x − y + z = −1.\n11. *(5)* If A = [[2, −3, 5], [3, 2, −4], [1, 1, −2]], find A⁻¹ and hence solve\n    2x − 3y + 5z = 11, 3x + 2y − 4z = −5, x + y − 2z = −3.\n12. *(2)* Show that the system 2x + 3y = 5, 4x + 6y = 10 does not have a unique solution.\n13. *(1)* For a square matrix A of order n, A(adj A) equals\n    (a) I (b) |A| (c) |A| I (d) adj A\n\n### Answer key\n\n**1. (b) 27.** n = 2, so |3A| = 3²|A| = 9 × 3 = 27.\n\n**2. (a) ±4.** |adj A| = |A|² = 16 ⟹ |A| = ±4.\n\n**3. (b) 0.** For odd order n, |A| = |Aᵀ| = |−A| = (−1)ⁿ|A| = −|A|, so 2|A| = 0.\n\n**4. −28.** Expand along **row 2**, where only a₂₂ = 4 is non-zero:\ndet = 4 · A₂₂, and A₂₂ = +|[[2, 3], [1, −2]]| = (2)(−2) − (3)(1) = −7.\nSo det = 4(−7) = **−28**. *(Choosing row 2 turns three 2 × 2 determinants into one.)*\n\n**5. A⁻¹ = [[−1, 1], [−2, 3/2]].** |A| = 3(−2) − (−2)(4) = −6 + 8 = 2.\nadj A = [[−2, 2], [−4, 3]]. A⁻¹ = ½[[−2, 2], [−4, 3]] = [[−1, 1], [−2, 3/2]].\n*Check:* A·A⁻¹ = [[3,−2],[4,−2]]·[[−1,1],[−2,3/2]] = [[−3+4, 3−3], [−4+4, 4−3]] = [[1,0],[0,1]] ✓\n\n**6. 47/2 square units.** det[[2,7,1],[1,1,1],[10,8,1]]\n= 2(1 − 8) − 7(1 − 10) + 1(8 − 10) = −14 + 63 − 2 = 47. Area = 47/2.\n\n**7. k = 5.** det[[3,−2,1],[k,2,1],[8,8,1]] = 0.\n3(2 − 8) + 2(k − 8) + 1(8k − 16) = −18 + 2k − 16 + 8k − 16 = 10k − 50 = 0 ⟹ k = 5.\n\n**8. Minor M₃₂ = −22, cofactor A₃₂ = 22.**\nDelete row 3, col 2: M₃₂ = |[[2, 5], [6, 4]]| = 8 − 30 = −22.\nA₃₂ = (−1)^(3+2)(−22) = −(−22) = 22.\n\n**9.** |A| = 4 − 6 = −2. |B| = 6 − 0 = 6. AB = [[1,2],[3,4]]·[[2,0],[1,3]] = [[4, 6], [10, 12]].\n|AB| = 48 − 60 = −12 = (−2)(6) ✓\n\n**10. x = −1, y = 2, z = 3.**\nA = [[1,1,1],[2,1,−3],[2,−1,1]]. |A| = 1(1 − 3) − 1(2 + 6) + 1(−2 − 2) = −2 − 8 − 4 = −14 ≠ 0.\nCofactors: A₁₁ = −2, A₁₂ = −8, A₁₃ = −4; A₂₁ = −2, A₂₂ = −1, A₂₃ = 3; A₃₁ = −4, A₃₂ = 5, A₃₃ = −1.\nadj A = [[−2, −2, −4], [−8, −1, 5], [−4, 3, −1]].\nX = (1/−14)(adj A)[4, −9, −1]ᵀ\n= (1/−14)[(−8 + 18 + 4), (−32 + 9 − 5), (−16 − 27 + 1)]ᵀ = (1/−14)[14, −28, −42]ᵀ = [−1, 2, 3]ᵀ.\n*Check:* −1 + 2 + 3 = 4 ✓; −2 + 2 − 9 = −9 ✓; −2 − 2 + 3 = −1 ✓\n\n**11. A⁻¹ = [[0, 1, −2], [−2, 9, −23], [−1, 5, −13]]; x = 1, y = 2, z = 3.**\n|A| = 2(−4 + 4) + 3(−6 + 4) + 5(3 − 2) = 0 − 6 + 5 = −1.\nCofactors: A₁₁ = 0, A₁₂ = 2, A₁₃ = 1; A₂₁ = −1, A₂₂ = −9, A₂₃ = −5; A₃₁ = 2, A₃₂ = 23, A₃₃ = 13.\nadj A = [[0, −1, 2], [2, −9, 23], [1, −5, 13]] (the transpose of the cofactor matrix), so\nA⁻¹ = (1/−1) adj A = [[0, 1, −2], [−2, 9, −23], [−1, 5, −13]].\nX = A⁻¹[11, −5, −3]ᵀ = [(0 − 5 + 6), (−22 − 45 + 69), (−11 − 25 + 39)]ᵀ = [1, 2, 3]ᵀ.\n*Check:* 2 − 6 + 15 = 11 ✓; 3 + 4 − 12 = −5 ✓; 1 + 2 − 6 = −3 ✓\n\n**12.** A = [[2, 3], [4, 6]], |A| = 12 − 12 = 0, so A⁻¹ does not exist and there is no unique solution.\n(adj A)B = [[6, −3], [−4, 2]]·[5, 10]ᵀ = [30 − 30, −20 + 20]ᵀ = [0, 0]ᵀ = O, so the system has\n**infinitely many solutions** — indeed the second equation is just twice the first.\n\n**13. (c) |A| I.**\n\n**Scoring.** Out of 30. Below 21 → the loss is almost certainly in cofactor signs or the adjoint\ntranspose. Redo §3 Q1 and Q7 from scratch without looking.\n\n---","tips":"**On the 5-mark matrix-method question**\n\n1. **Follow the five steps in order, with each labelled.** The marking scheme is essentially those\n   five steps. Even a student who makes an arithmetic slip in step 3 scores 3 of 5 if steps 1, 2, 4\n   and 5 are visibly present and correctly structured.\n\n2. **State \"|A| ≠ 0, therefore A⁻¹ exists and the system has a unique solution.\"** That sentence is a\n   mark. Do not skip it as obvious.\n\n3. **Write out all nine cofactors as a labelled list**, A₁₁ through A₃₃, with the sign shown. Do not\n   compute them mentally into a matrix — the examiner cannot award partial credit for arithmetic they\n   cannot see, and you cannot check your own work.\n\n4. **The transpose is a separate, visible step.** Write the cofactor matrix, then write \"adj A = \"\n   and the transpose. Every year, a large fraction of students write the cofactor matrix and label\n   it adj A. That error propagates and costs the whole question.\n\n5. **Always verify** by substituting x, y, z back into the original equations, and write \"Verified\"\n   or show the substitution. It costs 20 seconds, catches most slips, and reads well.\n\n6. **For word problems, write the three equations first as a clearly labelled system**, before any\n   matrices. Translating the words is typically 1 of the 5 marks and is marked separately from the\n   matrix work. \"By adding the first and third numbers we get double the second\" → x + z = 2y →\n   x − 2y + z = 0: show that rearrangement.\n\n**On determinants generally**\n\n7. **Expand along the row or column with the most zeros.** State which one you chose\n   (\"expanding along R₂\"). If a row has two zeros, this turns three 2 × 2 determinants into one.\n\n8. **Write the sign of each cofactor explicitly** as +[…] or −[…] before the bracket. The alternating\n   sign is the commonest single error in this chapter, and writing it first prevents it.\n\n9. **For area questions: absolute value, and \"square units\".** Both are marks. And if the area comes\n   out zero, say so and conclude the points are collinear rather than reporting \"area = 0\" alone.\n\n10. **For collinearity questions**, set the determinant equal to zero *first*, as a displayed\n    equation, before expanding. It shows the examiner you know why you are computing.\n\n**On the property MCQs**\n\n11. **Memorise the two exponents:** |kA| = kⁿ|A| and |adj A| = |A|^(n−1). For 3 × 3 that is k³ and\n    |A|². These two account for most 1-markers in this chapter.\n\n12. **Watch for signs in |adj A|.** Since the exponent n − 1 = 2 for a 3 × 3, the answer is always\n    non-negative — a negative option can be eliminated instantly.\n\n13. **The 2 × 2 adjoint shortcut:** adj [[a, b], [c, d]] = [[d, −b], [−c, a]]. Swap the diagonal\n    entries, negate the other two. Use it; do not compute four cofactors for a 2 × 2."}},{"id":"m5","subj":"maths","num":5,"title":"Continuity and Differentiability","unit":"Unit III · Calculus","unitMarks":35,"prio":1,"appear":"Unit III Calculus (35 marks) · Typical appearance: 1–2 MCQs + a 2-mark continuity question + a 3-mark differentiation question, and often a 5-mark second-order-derivative relation. Expect 6–9 marks from this chapter alone.","deleted":"- **Rolle's theorem** and **Lagrange's Mean Value Theorem**, and their geometric interpretation\n\n> **Consequence.** This chapter is now purely mechanical. There is no theorem to state, no\n> hypothesis to verify — only procedures to execute correctly. That makes it one of the most\n> completely learnable chapters in the paper: every question is a technique, and there are only\n> seven techniques.","recall":"```\nCONTINUOUS at a  :  LHL = RHL = f(a)        (three things, check all three)\n   LHL = lim f(a−h),  RHL = lim f(a+h),  h→0⁺\n\nDIFFERENTIABLE at a : LHD = RHD (both finite)\n   differentiable ⟹ continuous;  continuous ⇏ differentiable   (|x| at 0)\n\nChain    : dy/dx = f′(g(x))·g′(x)\nProduct  : (uv)′ = u′v + uv′\nQuotient : (u/v)′ = (u′v − uv′)/v²\nImplicit : differentiate both sides; every y gives a dy/dx\nLog diff : variable in base AND exponent → take log first\nParametric: dy/dx = (dy/dt)/(dx/dt)\n           d²y/dx² = [d/dt(dy/dx)] / (dx/dt)      ← divide AGAIN\n\n\"Prove a relation\": differentiate → clear radical → SQUARE → differentiate → ÷ 2y′\n```","s":{"scope":"### In the syllabus\n\n- **Continuity** and **differentiability**\n- **Chain rule**\n- Derivatives of **inverse trigonometric functions** — sin⁻¹x, cos⁻¹x, tan⁻¹x\n- Derivatives of **implicit functions**\n- Concept of exponential and logarithmic functions; derivatives of **log and exponential** functions\n- **Logarithmic differentiation**\n- Derivatives of functions in **parametric form**\n- **Second-order derivatives**\n\n### Deleted — do not study\n\n- **Rolle's theorem** and **Lagrange's Mean Value Theorem**, and their geometric interpretation\n\n> **Consequence.** This chapter is now purely mechanical. There is no theorem to state, no\n> hypothesis to verify — only procedures to execute correctly. That makes it one of the most\n> completely learnable chapters in the paper: every question is a technique, and there are only\n> seven techniques.\n\n---","brief":"### Continuity at a point\n\nf is **continuous at x = a** if all three exist and are equal:\n\n```\nlim f(x)  =  lim f(x)  =  f(a)\nx→a⁻         x→a⁺\n\n  LHL          RHL        value at the point\n```\n\nSo there are three things to check, and the question is almost always set so that one of them\ndiffers. Write all three separately.\n\n**Computing LHL and RHL.** Substitute x = a − h for the LHL and x = a + h for the RHL, then take\nh → 0 with h > 0. This substitution is the standard method and is what the marking scheme expects.\n\n```\nLHL = lim f(a − h)          RHL = lim f(a + h)\n      h→0⁺                        h→0⁺\n```\n\n**Discontinuity** at a means one of the three fails: LHL ≠ RHL, or the limit exists but ≠ f(a), or\nf(a) is not defined.\n\n### Continuity on an interval, and algebra of continuous functions\n\nf is continuous on (a, b) if it is continuous at every point of (a, b).\n\nIf f and g are continuous at a, then so are f + g, f − g, f·g, cf, and f/g **provided g(a) ≠ 0**.\nComposites of continuous functions are continuous.\n\n**Functions continuous everywhere on their domain** (safe to assert without proof):\npolynomials, sin x, cos x, eˣ, |x|, and log x on (0, ∞).\n\n**Functions with known discontinuities:** tan x (at odd multiples of π/2), the greatest integer\nfunction [x] (at every integer), 1/x (at 0).\n\n### Differentiability\n\nf is **differentiable at a** if the limit\n\n```\nf′(a) = lim  [ f(a + h) − f(a) ] / h\n        h→0\n```\n\nexists. Equivalently, **LHD = RHD**:\n\n```\nLHD = lim [f(a − h) − f(a)] / (−h)          RHD = lim [f(a + h) − f(a)] / h\n      h→0⁺                                        h→0⁺\n```\n\n### The one-way implication\n\n```\ndifferentiable at a   ⟹   continuous at a\ncontinuous at a       ⟹̸   differentiable at a\n```\n\n**The standard counterexample: f(x) = |x| at x = 0.** It is continuous there (LHL = RHL = 0 = f(0))\nbut not differentiable: LHD = −1 and RHD = +1.\n\nMore generally, |x − c| is continuous but not differentiable at x = c. This appears every other year\nas an MCQ or Assertion–Reason.\n\n**Corollary that gets asked:** if a function is *not* continuous at a point, it is certainly not\ndifferentiable there. So for a piecewise function, check continuity first — if it fails, you are done.\n\n### Standard derivatives — the table\n\n| f(x) | f′(x) | | f(x) | f′(x) |\n| --- | --- | --- | --- | --- |\n| xⁿ | n x^(n−1) | | sin⁻¹x | 1/√(1 − x²) |\n| sin x | cos x | | cos⁻¹x | −1/√(1 − x²) |\n| cos x | −sin x | | tan⁻¹x | 1/(1 + x²) |\n| tan x | sec²x | | cot⁻¹x | −1/(1 + x²) |\n| cot x | −cosec²x | | sec⁻¹x | 1/(\\|x\\|√(x² − 1)) |\n| sec x | sec x tan x | | cosec⁻¹x | −1/(\\|x\\|√(x² − 1)) |\n| cosec x | −cosec x cot x | | eˣ | eˣ |\n| log x | 1/x | | aˣ | aˣ log a |\n| log_a x | 1/(x log a) | | constant | 0 |\n\nNote the pattern: each **co-** function's derivative is the negative of its partner's. Learn six, get\ntwelve.\n\n### The seven techniques\n\n**1. Chain rule.** For y = f(g(x)): dy/dx = f′(g(x)) · g′(x). Work outside-in, and write each layer.\n\nFor y = sin(cos(x²)):\n```\ndy/dx = cos(cos(x²)) · (−sin(x²)) · 2x = −2x sin(x²) cos(cos(x²))\n```\n\n**2. Product rule.** (uv)′ = u′v + uv′\n**3. Quotient rule.** (u/v)′ = (u′v − uv′)/v²\n\n**4. Implicit differentiation.** When y is not isolated (e.g. x³ + y³ = 3axy), differentiate **both\nsides with respect to x**, treating y as a function of x — so every y-term picks up a factor dy/dx by\nthe chain rule. Then collect dy/dx terms and solve.\n\n```\nd/dx (y²) = 2y · dy/dx          d/dx (xy) = y + x · dy/dx\nd/dx (sin y) = cos y · dy/dx    d/dx (y³) = 3y² · dy/dx\n```\n\n**5. Logarithmic differentiation.** Use it when the variable appears in **both** the base and the\nexponent (y = xˣ, y = x^(sin x)), or when y is a long product/quotient of powers.\n\nMethod: take log of both sides, simplify using log rules, then differentiate implicitly.\n\nFor y = xˣ:\n```\n      log y = x log x\n⟹     (1/y) dy/dx = log x + x·(1/x) = log x + 1\n⟹     dy/dx = y(1 + log x) = xˣ (1 + log x)\n```\n\n> **Why you cannot just use the power rule.** d/dx(xⁿ) = nx^(n−1) requires n constant, and\n> d/dx(aˣ) = aˣ log a requires a constant. In xˣ neither is constant, so neither rule applies. That\n> is the whole reason logarithmic differentiation exists, and it is worth being able to say in one\n> line if asked.\n\n**6. Parametric differentiation.** If x = f(t) and y = g(t), then\n\n```\ndy/dx = (dy/dt) / (dx/dt)          provided dx/dt ≠ 0\n```\n\nNever try to eliminate the parameter — it is almost always harder.\n\n**7. Second-order derivatives.** d²y/dx² = d/dx (dy/dx). Differentiate the first derivative again.\n\n**For parametric functions, be careful:**\n\n```\nd²y/dx² = d/dx (dy/dx) = [ d/dt (dy/dx) ] / (dx/dt)\n```\n\nYou must divide by dx/dt again. Forgetting this is the standard error.\n\n### The \"prove a relation\" family — the 5-mark question\n\nQuestions like \"if y = (sin⁻¹x)², prove (1 − x²)y″ − xy′ − 2 = 0\" all yield to the same three moves:\n\n1. Differentiate once, and **clear the radical** by multiplying up: get √(1 − x²)·y′ = (something in y).\n2. **Square both sides** to remove the radical entirely: (1 − x²)(y′)² = (something in y).\n3. **Differentiate again**, then divide the whole equation by 2y′.\n\nStep 2 is the one students miss. Squaring before differentiating a second time is what makes the\nalgebra collapse into the required form.\n\n### Quick recall box\n\n```\nCONTINUOUS at a  :  LHL = RHL = f(a)        (three things, check all three)\n   LHL = lim f(a−h),  RHL = lim f(a+h),  h→0⁺\n\nDIFFERENTIABLE at a : LHD = RHD (both finite)\n   differentiable ⟹ continuous;  continuous ⇏ differentiable   (|x| at 0)\n\nChain    : dy/dx = f′(g(x))·g′(x)\nProduct  : (uv)′ = u′v + uv′\nQuotient : (u/v)′ = (u′v − uv′)/v²\nImplicit : differentiate both sides; every y gives a dy/dx\nLog diff : variable in base AND exponent → take log first\nParametric: dy/dx = (dy/dt)/(dx/dt)\n           d²y/dx² = [d/dt(dy/dx)] / (dx/dt)      ← divide AGAIN\n\n\"Prove a relation\": differentiate → clear radical → SQUARE → differentiate → ÷ 2y′\n```\n\n---","pyq":"**Q1.** *(2 marks)* Find the value of k for which\n\n```\nf(x) = { kx²,   x ≤ 2\n       { 3,     x > 2\n```\n\nis continuous at x = 2.\n\n**Q2.** *(3 marks)* Find the value of k so that the function\n\n```\nf(x) = { (k cos x)/(π − 2x),   x ≠ π/2\n       { 3,                     x = π/2\n```\n\nis continuous at x = π/2.\n\n**Q3.** *(3 marks)* Differentiate y = xˣ with respect to x.\n\n**Q4.** *(3 marks)* If xʸ = yˣ, find dy/dx.\n\n**Q5.** *(5 marks)* If y = (sin⁻¹x)², prove that (1 − x²) d²y/dx² − x dy/dx − 2 = 0.\n\n**Q6.** *(5 marks)* If y = e^(a cos⁻¹x), −1 ≤ x ≤ 1, show that\n(1 − x²) d²y/dx² − x dy/dx − a²y = 0.\n\n**Q7.** *(3 marks)* If x = a(θ − sin θ) and y = a(1 − cos θ), find dy/dx.\n\n**Q8.** *(3 marks)* If sin y = x sin(a + y), prove that dy/dx = sin²(a + y)/sin a.\n\n**Q9.** *(3 marks)* Differentiate tan⁻¹((1 − x)/(1 + x)) with respect to x.\n\n**Q10.** *(2 marks)* Show that f(x) = |x − 1| is continuous but not differentiable at x = 1.\n\n**Q11.** *(2 marks)* If y = x³ log x, find d²y/dx².\n\n**Q12.** *(2 marks)* Examine the continuity of\n\n```\nf(x) = { (x² − 9)/(x − 3),   x ≠ 3\n       { 6,                   x = 3\n```\n\nat x = 3.\n\n**Q13.** *(1 mark, Assertion–Reason)*\n**A:** f(x) = |x| is differentiable at x = 0.\n**R:** Every continuous function is differentiable.\n\n**Q14.** *(2 marks)* Find dy/dx if y = sin(cos(x²)).\n\n---","sol":"### Q1 — find k for continuity at x = 2\n\nFor continuity at x = 2 we need LHL = RHL = f(2).\n\n```\nf(2) = k(2)² = 4k          [using the x ≤ 2 branch]\n\nLHL = lim  f(2 − h) = lim  k(2 − h)² = 4k\n      h→0⁺              h→0⁺\n\nRHL = lim  f(2 + h) = lim  3 = 3\n      h→0⁺              h→0⁺\n```\n\nSetting LHL = RHL:\n\n```\n      4k = 3\n⟹     k = 3/4\n```\n\n**k = 3/4** (and then f(2) = 4(3/4) = 3, so all three agree ✓).\n\n### Q2 — find k for continuity at x = π/2\n\n```\nf(π/2) = 3\n```\n\nFor the limit, substitute **x = π/2 + h**, so that h → 0 as x → π/2:\n\n```\ncos x = cos(π/2 + h) = −sin h\nπ − 2x = π − 2(π/2 + h) = π − π − 2h = −2h\n```\n\nTherefore\n\n```\nlim f(x) = lim  [ k(−sin h) ] / (−2h)\nx→π/2      h→0\n\n         = lim  (k/2) · (sin h / h)\n           h→0\n\n         = (k/2) · 1                 [since lim (sin h)/h = 1]\n         = k/2\n```\n\nFor continuity, this limit must equal f(π/2) = 3:\n\n```\n      k/2 = 3\n⟹     k = 6\n```\n\n**k = 6**\n\n> The substitution x = π/2 + h is the whole trick. Trying to evaluate the limit directly gives 0/0\n> and goes nowhere.\n\n### Q3 — differentiate y = xˣ\n\nNeither the power rule nor the exponential rule applies, since the variable occurs in both the base\nand the exponent. Use **logarithmic differentiation**.\n\n```\n      y = xˣ\n⟹     log y = x log x\n```\n\nDifferentiate both sides with respect to x:\n\n```\n      (1/y) (dy/dx) = (1)(log x) + x(1/x)          [product rule on the right]\n⟹     (1/y) (dy/dx) = log x + 1\n⟹     dy/dx = y (1 + log x)\n```\n\n**dy/dx = xˣ (1 + log x)**\n\n### Q4 — if xʸ = yˣ, find dy/dx\n\nTake log of both sides:\n\n```\n      y log x = x log y\n```\n\nDifferentiate both sides with respect to x (product rule on each side, chain rule on log y):\n\n```\n      (dy/dx) log x + y·(1/x)  =  (1) log y + x·(1/y)(dy/dx)\n```\n\nCollect the dy/dx terms on the left:\n\n```\n      (dy/dx) log x − (x/y)(dy/dx)  =  log y − y/x\n⟹     (dy/dx) [ log x − x/y ]  =  log y − y/x\n```\n\nCombine each bracket over a common denominator:\n\n```\n      log x − x/y = (y log x − x)/y\n      log y − y/x = (x log y − y)/x\n```\n\nHence\n\n```\n      dy/dx = [ (x log y − y)/x ] × [ y/(y log x − x) ]\n```\n\n```\ndy/dx = y (x log y − y) / [ x (y log x − x) ]\n```\n\n### Q5 — y = (sin⁻¹x)² ⟹ (1 − x²)y″ − xy′ − 2 = 0\n\n**Differentiate once:**\n\n```\n      y = (sin⁻¹x)²\n⟹     dy/dx = 2 sin⁻¹x · 1/√(1 − x²)\n```\n\n**Clear the radical:**\n\n```\n      √(1 − x²) · dy/dx = 2 sin⁻¹x\n```\n\n**Square both sides** (this is the key move — it eliminates sin⁻¹x in favour of y):\n\n```\n      (1 − x²) (dy/dx)² = 4 (sin⁻¹x)² = 4y\n```\n\n**Differentiate again** with respect to x, using the product rule on the left:\n\n```\n      (1 − x²) · 2 (dy/dx)(d²y/dx²)  +  (dy/dx)² · (−2x)  =  4 (dy/dx)\n```\n\n**Divide throughout by 2(dy/dx)** (valid since dy/dx ≠ 0 in general):\n\n```\n      (1 − x²) (d²y/dx²) − x (dy/dx) = 2\n⟹     (1 − x²) (d²y/dx²) − x (dy/dx) − 2 = 0\n```\n\n**Hence proved.** ∎\n\n### Q6 — y = e^(a cos⁻¹x) ⟹ (1 − x²)y″ − xy′ − a²y = 0\n\n**Differentiate once:**\n\n```\n      dy/dx = e^(a cos⁻¹x) · a · ( −1/√(1 − x²) )\n            = −a y / √(1 − x²)                       [since e^(a cos⁻¹x) = y]\n```\n\n**Clear the radical:**\n\n```\n      √(1 − x²) · dy/dx = −a y\n```\n\n**Square both sides:**\n\n```\n      (1 − x²) (dy/dx)² = a² y²\n```\n\n**Differentiate again:**\n\n```\n      (1 − x²) · 2 (dy/dx)(d²y/dx²)  +  (dy/dx)² (−2x)  =  a² · 2y (dy/dx)\n```\n\n**Divide throughout by 2(dy/dx):**\n\n```\n      (1 − x²)(d²y/dx²) − x (dy/dx) = a² y\n⟹     (1 − x²)(d²y/dx²) − x (dy/dx) − a² y = 0\n```\n\n**Hence proved.** ∎\n\n> Q5 and Q6 are the *same* question with a different outer function. Recognise the shape — inverse\n> trig inside, then differentiate/clear/square/differentiate/divide — and this whole family becomes\n> one method. Other members: y = (tan⁻¹x)², y = e^(m sin⁻¹x), y = (log(x + √(1+x²)))².\n\n### Q7 — parametric: x = a(θ − sin θ), y = a(1 − cos θ)\n\n```\ndx/dθ = a(1 − cos θ)\ndy/dθ = a(0 + sin θ) = a sin θ\n```\n\n```\ndy/dx = (dy/dθ) / (dx/dθ) = a sin θ / [ a(1 − cos θ) ] = sin θ / (1 − cos θ)\n```\n\nSimplify using the half-angle identities sin θ = 2 sin(θ/2) cos(θ/2) and 1 − cos θ = 2 sin²(θ/2):\n\n```\ndy/dx = [ 2 sin(θ/2) cos(θ/2) ] / [ 2 sin²(θ/2) ] = cos(θ/2)/sin(θ/2)\n```\n\n**dy/dx = cot(θ/2)**\n\n### Q8 — sin y = x sin(a + y) ⟹ dy/dx = sin²(a + y)/sin a\n\nFrom the given relation, first isolate x:\n\n```\n      x = sin y / sin(a + y)\n```\n\nDifferentiate **x with respect to y** (easier than the other way round here), using the quotient\nrule:\n\n```\ndx/dy = [ cos y · sin(a + y)  −  sin y · cos(a + y) ] / sin²(a + y)\n```\n\nThe numerator is the sine subtraction formula, sin(A − B) = sin A cos B − cos A sin B, with\nA = a + y and B = y:\n\n```\n      cos y sin(a + y) − sin y cos(a + y) = sin((a + y) − y) = sin a\n```\n\nSo\n\n```\n      dx/dy = sin a / sin²(a + y)\n```\n\nTherefore\n\n```\n      dy/dx = 1 / (dx/dy) = sin²(a + y) / sin a\n```\n\n**Hence proved.** ∎\n\n> Choosing to differentiate x with respect to y, then reciprocating, avoids implicit differentiation\n> entirely. Whenever a relation gives x cleanly in terms of y, this is the faster route.\n\n### Q9 — differentiate tan⁻¹((1 − x)/(1 + x))\n\nLet u = (1 − x)/(1 + x), so y = tan⁻¹u.\n\n**Step 1 — du/dx**, by the quotient rule:\n\n```\ndu/dx = [ (−1)(1 + x) − (1 − x)(1) ] / (1 + x)²\n      = [ −1 − x − 1 + x ] / (1 + x)²\n      = −2 / (1 + x)²\n```\n\n**Step 2 — simplify 1 + u²:**\n\n```\n1 + u² = 1 + (1 − x)²/(1 + x)²\n       = [ (1 + x)² + (1 − x)² ] / (1 + x)²\n       = [ (1 + 2x + x²) + (1 − 2x + x²) ] / (1 + x)²\n       = (2 + 2x²) / (1 + x)²\n       = 2(1 + x²) / (1 + x)²\n```\n\n**Step 3 — chain rule:**\n\n```\ndy/dx = (1/(1 + u²)) · du/dx\n      = [ (1 + x)² / (2(1 + x²)) ] · [ −2/(1 + x)² ]\n      = −1/(1 + x²)\n```\n\n**dy/dx = −1/(1 + x²)**\n\n### Q10 — f(x) = |x − 1| at x = 1\n\nWrite f piecewise:\n\n```\nf(x) = { 1 − x,   x < 1\n       { x − 1,   x ≥ 1\n```\n\n**Continuity at x = 1:**\n\n```\nf(1) = 0\nLHL = lim (1 − (1 − h)) = lim h = 0\n      h→0⁺                 h→0⁺\nRHL = lim ((1 + h) − 1) = lim h = 0\n      h→0⁺                 h→0⁺\n```\n\nAll three equal 0, so f is **continuous at x = 1**. ✓\n\n**Differentiability at x = 1:**\n\n```\nLHD = lim  [ f(1 − h) − f(1) ] / (−h) = lim  [ h − 0 ] / (−h) = −1\n      h→0⁺                                h→0⁺\n\nRHD = lim  [ f(1 + h) − f(1) ] / h    = lim  [ h − 0 ] / h    = +1\n      h→0⁺                                h→0⁺\n```\n\nSince LHD = −1 ≠ +1 = RHD, f is **not differentiable at x = 1**.\n\n**Hence f is continuous but not differentiable at x = 1** — which shows continuity does not imply\ndifferentiability.\n\n### Q11 — y = x³ log x, find d²y/dx²\n\n**First derivative** (product rule):\n\n```\ndy/dx = 3x² log x + x³ · (1/x) = 3x² log x + x²\n```\n\n**Second derivative** (product rule on the first term):\n\n```\nd²y/dx² = [ 6x log x + 3x² · (1/x) ] + 2x\n        = 6x log x + 3x + 2x\n```\n\n**d²y/dx² = 6x log x + 5x = x(6 log x + 5)**\n\n### Q12 — continuity of (x² − 9)/(x − 3) at x = 3\n\n```\nf(3) = 6                     [given]\n\nlim  f(x) = lim  (x² − 9)/(x − 3)\nx→3          x→3\n\n          = lim  (x − 3)(x + 3)/(x − 3)\n            x→3\n\n          = lim  (x + 3)               [cancelling, valid since x ≠ 3 in the limit]\n            x→3\n\n          = 6\n```\n\nSince lim f(x) = 6 = f(3), **f is continuous at x = 3**.\n\n### Q13 — Assertion–Reason\n\n**A:** \"f(x) = |x| is differentiable at x = 0.\" **False** — LHD = −1, RHD = +1.\n\n**R:** \"Every continuous function is differentiable.\" **False** — the implication runs the other way;\n|x| at 0 is the counterexample.\n\n**Answer: A is false and R is false.**\n\n*(The true statement is the converse: every differentiable function is continuous.)*\n\n### Q14 — y = sin(cos(x²))\n\nThree layers, so chain rule twice. Work outside-in:\n\n```\ndy/dx = cos(cos(x²)) · d/dx[cos(x²)]\n      = cos(cos(x²)) · (−sin(x²)) · d/dx[x²]\n      = cos(cos(x²)) · (−sin(x²)) · 2x\n```\n\n**dy/dx = −2x sin(x²) cos(cos(x²))**\n\n---","test":"Time: 50 minutes. Answers below.\n\n1. *(1)* The function f(x) = [x] (greatest integer function) is\n   (a) continuous everywhere (b) continuous only at integers (c) discontinuous at every integer\n   (d) differentiable everywhere\n2. *(1)* d/dx (sec⁻¹x) equals\n   (a) 1/√(1 − x²) (b) 1/(1 + x²) (c) 1/(|x|√(x² − 1)) (d) −1/(x√(x² − 1))\n3. *(1)* If y = log(log x), then dy/dx is\n   (a) 1/(x log x) (b) 1/log x (c) log x/x (d) 1/x\n4. *(2)* Find a if f(x) = { ax + 1, x ≤ 3 ; bx + 3, x > 3 } is continuous at x = 3, given b = 2.\n5. *(2)* Find dy/dx if y = (log x)^(cos x).\n6. *(2)* If y = tan⁻¹(x²), find dy/dx.\n7. *(3)* If x = a cos³θ, y = a sin³θ, find dy/dx.\n8. *(3)* If y = eˣ sin x, prove that d²y/dx² − 2 dy/dx + 2y = 0.\n9. *(3)* Find dy/dx if x² + xy + y² = 100.\n10. *(3)* Differentiate y = x^(sin x) with respect to x.\n11. *(2)* Show that f(x) = { (sin 3x)/x, x ≠ 0 ; 3, x = 0 } is continuous at x = 0.\n12. *(5)* If y = (tan⁻¹x)², show that (1 + x²)² d²y/dx² + 2x(1 + x²) dy/dx − 2 = 0.\n13. *(2)* Find d²y/dx² if y = x sin x.\n14. *(2)* For what value of k is f(x) = { (x² − 25)/(x − 5), x ≠ 5 ; k, x = 5 } continuous at x = 5?\n\n### Answer key\n\n**1. (c) discontinuous at every integer.** At an integer n, LHL = n − 1 and RHL = n.\n\n**2. (c) 1/(|x|√(x² − 1)).**\n\n**3. (a) 1/(x log x).** Chain rule: (1/log x)·(1/x).\n\n**4. a = 8/3.** f(3) = 3a + 1 (from the x ≤ 3 branch). RHL = 2(3) + 3 = 9. So 3a + 1 = 9 ⟹ a = 8/3.\n\n**5.** Take logs: log y = cos x · log(log x). Then\n(1/y)y′ = −sin x · log(log x) + cos x · 1/(x log x).\ny′ = (log x)^(cos x) [ cos x/(x log x) − sin x · log(log x) ].\n\n**6.** dy/dx = (1/(1 + x⁴)) · 2x = **2x/(1 + x⁴)**.\n\n**7.** dx/dθ = −3a cos²θ sin θ; dy/dθ = 3a sin²θ cos θ.\ndy/dx = (3a sin²θ cos θ)/(−3a cos²θ sin θ) = −sin θ/cos θ = **−tan θ**.\n\n**8.** y′ = eˣ sin x + eˣ cos x = eˣ(sin x + cos x).\ny″ = eˣ(sin x + cos x) + eˣ(cos x − sin x) = 2eˣ cos x.\ny″ − 2y′ + 2y = 2eˣcos x − 2eˣ(sin x + cos x) + 2eˣ sin x = 0 ✓\n\n**9.** Differentiate implicitly: 2x + (y + x·dy/dx) + 2y·dy/dx = 0\n⟹ dy/dx (x + 2y) = −(2x + y) ⟹ **dy/dx = −(2x + y)/(x + 2y)**.\n\n**10.** log y = sin x · log x. (1/y)y′ = cos x · log x + sin x/x.\n**y′ = x^(sin x) [ cos x · log x + (sin x)/x ]**.\n\n**11.** f(0) = 3. lim (sin 3x)/x = lim 3·(sin 3x)/(3x) = 3(1) = 3. Since the limit equals f(0),\nf is continuous at 0. ✓\n\n**12.** y′ = 2 tan⁻¹x · 1/(1 + x²), so (1 + x²)y′ = 2 tan⁻¹x.\nDifferentiate: (1 + x²)y″ + 2x y′ = 2/(1 + x²).\nMultiply through by (1 + x²): **(1 + x²)²y″ + 2x(1 + x²)y′ − 2 = 0** ✓\n*(Note this one does not need the squaring step — the radical never appears, because tan⁻¹ has a\nrational derivative. Recognise which family you are in.)*\n\n**13.** y′ = sin x + x cos x. y″ = cos x + (cos x − x sin x) = **2 cos x − x sin x**.\n\n**14. k = 10.** lim (x² − 25)/(x − 5) = lim (x + 5) = 10, so k must be 10.\n\n**Scoring.** Out of 32. Below 22 → identify whether you are losing marks on *continuity* (redo Q1,\nQ2, Q12 of §3) or on *differentiation technique* (redo Q3–Q9). They need different fixes.\n\n---","tips":"**On continuity questions**\n\n1. **Write all three quantities separately and label them**: f(a), LHL, RHL. Three lines. The\n   marking scheme has a mark for the LHL, a mark for the RHL, and a mark for equating them.\n\n2. **Use the h-substitution explicitly.** Write \"Put x = a − h, h → 0⁺\". Do not compute limits\n   mentally — the substitution line is marked.\n\n3. **State the conclusion in the language of the definition:** \"Since LHL = RHL = f(2), f is\n   continuous at x = 2.\" Not just \"k = 3/4\".\n\n4. **Use the correct branch for f(a).** If the definition says x ≤ 2 for one branch, then f(2) comes\n   from *that* branch. Reading the inequality wrongly is a common and expensive slip.\n\n5. **When the limit is 0/0, look for the standard limits:** lim (sin x)/x = 1, lim (tan x)/x = 1,\n   lim (eˣ − 1)/x = 1, lim (1 + x)^(1/x) = e, and factorisation for polynomial quotients.\n\n**On differentiation questions**\n\n6. **Name the method before starting.** Write \"Using logarithmic differentiation\" or \"Differentiating\n   implicitly w.r.t. x\". It costs one line and reads as competence.\n\n7. **For logarithmic differentiation, the log step is a mark.** Show `log y = …` on its own line\n   before differentiating.\n\n8. **When to use log differentiation:** variable in the base *and* exponent, or a product/quotient\n   of three or more factors. If it is just aˣ or xⁿ, use the standard rule instead — using logs\n   there is not wrong but wastes time.\n\n9. **Express the answer in terms of x where possible**, or substitute y back. dy/dx = y(1 + log x) is\n   incomplete; dy/dx = xˣ(1 + log x) is the answer.\n\n10. **For parametric second derivatives, do not forget the second division by dx/dt.** Write the\n    formula d²y/dx² = [d/dt(dy/dx)]/(dx/dt) down before substituting; that prevents the error.\n\n11. **For \"prove the relation\" questions, the squaring step must be visible.** Write\n    √(1 − x²)·y′ = … on its own line, then the squared version on the next. Those two lines are\n    typically 2 of the 5 marks.\n\n12. **Simplify with half-angle identities when a parametric answer looks ugly.**\n    sin θ/(1 − cos θ) = cot(θ/2) is expected, not optional — the marking scheme gives the simplified\n    form.\n\n**On MCQs**\n\n13. **Learn the derivative table cold.** Roughly half the 1-markers from this chapter are a single\n    table lookup plus one chain-rule step. There is no faster marks-per-minute in the paper.\n\n14. **For Assertion–Reason on continuity/differentiability, the direction of the implication is\n    almost always the trap.** Differentiable ⟹ continuous. Never the reverse."}},{"id":"m6","subj":"maths","num":6,"title":"Application of Derivatives","unit":"Unit III · Calculus","unitMarks":35,"prio":1,"appear":"Unit III Calculus (35 marks) · Typical appearance: one 3-mark monotonicity question + one 4- or 5-mark optimisation problem (very often the Section-E case study). Expect 6–9 marks.","deleted":"- **Tangents and normals** — equations of tangent/normal, angle between curves\n- **Approximations** — using dy to estimate small changes\n\n> **Consequence.** The chapter reduced to exactly **two** question types: *find where the function\n> increases/decreases*, and *optimise something*. That concentration makes it very high-return.\n> Two techniques, ~7 marks.","recall":"```\nRATES:  dy/dt = (dy/dx)(dx/dt).   Always state units.\n\nMONOTONIC:  f′ > 0 ⟹ strictly increasing;  f′ < 0 ⟹ strictly decreasing\n   Method: f′ → factorise → critical points → sign table → state intervals\n\nCRITICAL POINT: f′(c) = 0 or f′(c) undefined\n\nFIRST DERIVATIVE TEST : f′ goes + → −  ⟹ max ;  − → +  ⟹ min ;  no change ⟹ inflection\nSECOND DERIVATIVE TEST: f′(c) = 0 and f″(c) < 0 ⟹ MAX ;  f″(c) > 0 ⟹ MIN ; = 0 ⟹ test fails\n\nABSOLUTE MAX/MIN on [a,b]: compare f at critical points AND at a and b\n\nOPTIMISATION: diagram → objective → constraint → eliminate → f′ = 0 → f″ test → answer asked\n```","s":{"scope":"### In the syllabus\n\n- **Rate of change** of quantities\n- **Increasing and decreasing** functions\n- **Maxima and minima** — first derivative test (motivated geometrically) and second derivative test\n- Simple problems illustrating basic principles and real-life situations\n\n### Deleted — do not study\n\n- **Tangents and normals** — equations of tangent/normal, angle between curves\n- **Approximations** — using dy to estimate small changes\n\n> **Consequence.** The chapter reduced to exactly **two** question types: *find where the function\n> increases/decreases*, and *optimise something*. That concentration makes it very high-return.\n> Two techniques, ~7 marks.\n\n---","brief":"### Rate of change\n\ndy/dx is the rate of change of y with respect to x. When both vary with time, use the chain rule:\n\n```\ndy/dt = (dy/dx) · (dx/dt)\n```\n\n**Standard set-ups:**\n\n| Quantity | Relation | Differentiated |\n| --- | --- | --- |\n| Circle | A = πr² | dA/dt = 2πr · dr/dt |\n| Circle | C = 2πr | dC/dt = 2π · dr/dt |\n| Sphere | V = (4/3)πr³ | dV/dt = 4πr² · dr/dt |\n| Sphere | S = 4πr² | dS/dt = 8πr · dr/dt |\n| Cube | V = x³ | dV/dt = 3x² · dx/dt |\n| Cube | S = 6x² | dS/dt = 12x · dx/dt |\n| Cylinder | V = πr²h | product rule if both vary |\n\nA rate is \"increasing\" if positive and \"decreasing\" if negative — and the **units** must be stated\n(cm²/s, m³/min, and so on).\n\n### Increasing and decreasing functions\n\nLet f be differentiable on an interval I.\n\n| Condition on I | Conclusion |\n| --- | --- |\n| f′(x) > 0 for all x ∈ I | f is **strictly increasing** on I |\n| f′(x) < 0 for all x ∈ I | f is **strictly decreasing** on I |\n| f′(x) = 0 for all x ∈ I | f is **constant** on I |\n| f′(x) ≥ 0 on I | f is increasing (non-decreasing) on I |\n\n**The procedure — four steps:**\n\n1. Compute f′(x).\n2. **Factorise** f′(x) completely.\n3. Set f′(x) = 0 to find the **critical points**; these divide the real line (or the given domain)\n   into intervals.\n4. Test the **sign** of f′ in each interval — pick a convenient test point in each — and state the\n   conclusion.\n\nA sign table is the clearest way to present step 4 and is what the marking scheme expects.\n\n> **Watch the domain.** If the question restricts to [0, 2π] or (0, ∞), your intervals must lie inside\n> it. And note the difference between \"increasing **on**\" (an interval) and \"increasing **at**\" (a\n> point) — the question always asks for intervals.\n\n### Maxima and minima — the vocabulary\n\n- **Local (relative) maximum** at c: f(c) ≥ f(x) for all x near c\n- **Local minimum** at c: f(c) ≤ f(x) for all x near c\n- **Absolute (global) maximum/minimum** on an interval: the largest/smallest value taken anywhere on it\n- **Critical point:** a point where f′(c) = 0, or where f′ does not exist\n\nEvery local extremum of a differentiable function occurs at a critical point — but not every\ncritical point is an extremum (f(x) = x³ at 0 is the standard example: f′(0) = 0 but there is no\nextremum; it is a point of inflection).\n\n### First derivative test\n\nAt a critical point c, look at the **sign change** of f′:\n\n| f′ changes | at c there is a |\n| --- | --- |\n| + → − | **local maximum** |\n| − → + | **local minimum** |\n| no change | **point of inflection** (neither) |\n\n### Second derivative test\n\nIf f′(c) = 0, then:\n\n| | |\n| --- | --- |\n| f″(c) < 0 | **local maximum** at c |\n| f″(c) > 0 | **local minimum** at c |\n| f″(c) = 0 | **test fails** — fall back on the first derivative test |\n\nThe second derivative test is usually faster for optimisation word problems, and it is what CBSE\nexpects there. **You must state it explicitly** — writing \"f″(3) = −72 < 0, hence a maximum\" is a\nmark on its own.\n\n> Memory hook: f″ < 0 means the curve is concave down, i.e. shaped like a hill ⟹ maximum. The\n> negative sign and the \"max\" go together.\n\n### Absolute maximum and minimum on a closed interval [a, b]\n\nBecause the interval is closed, the extremes may occur at an endpoint rather than a critical point.\nSo:\n\n1. Find the critical points inside (a, b).\n2. Evaluate f at **all** critical points **and at both endpoints** a and b.\n3. The largest of those values is the absolute maximum; the smallest, the absolute minimum.\n\nNo derivative test is needed — you are simply comparing a finite list. Forgetting the endpoints is\nthe standard error here.\n\n### Optimisation word problems — the fixed procedure\n\nThis is the 5-mark question, and it has an invariable shape:\n\n1. **Draw and label a diagram.** (Worth a mark. Always.)\n2. **Name the variables**, and write the quantity to be optimised (the *objective*).\n3. **Write the constraint** given in the problem (fixed perimeter, fixed volume, inscribed in a\n   sphere, …).\n4. **Use the constraint to eliminate one variable**, so the objective is a function of one variable\n   only. State the domain of that variable.\n5. **Differentiate**, set = 0, solve for the critical value.\n6. **Apply the second derivative test** and state the conclusion.\n7. **Answer the question actually asked** — if it asked for the maximum *volume*, give the volume,\n   not just the value of x.\n\n### The seven problems that keep coming back\n\nLearn these and you have effectively seen the question:\n\n| Problem | Answer to remember |\n| --- | --- |\n| Open box from a square sheet of side a, corners of side x cut | x = a/6 |\n| Rectangle of maximum area inscribed in a circle | It is a **square** |\n| Cylinder of maximum volume inscribed in a sphere of radius R | h = 2R/√3 |\n| Cone of maximum volume inscribed in a sphere of radius R | h = 4R/3 |\n| Window = rectangle + semicircle, fixed perimeter P | height = radius = P/(4 + π) |\n| Wire of length L cut into a square and a circle, minimum total area | circle piece = Lπ/(π + 4) |\n| Two positive numbers with fixed sum, minimum sum of cubes/squares | they are **equal** |\n\n### Quick recall box\n\n```\nRATES:  dy/dt = (dy/dx)(dx/dt).   Always state units.\n\nMONOTONIC:  f′ > 0 ⟹ strictly increasing;  f′ < 0 ⟹ strictly decreasing\n   Method: f′ → factorise → critical points → sign table → state intervals\n\nCRITICAL POINT: f′(c) = 0 or f′(c) undefined\n\nFIRST DERIVATIVE TEST : f′ goes + → −  ⟹ max ;  − → +  ⟹ min ;  no change ⟹ inflection\nSECOND DERIVATIVE TEST: f′(c) = 0 and f″(c) < 0 ⟹ MAX ;  f″(c) > 0 ⟹ MIN ; = 0 ⟹ test fails\n\nABSOLUTE MAX/MIN on [a,b]: compare f at critical points AND at a and b\n\nOPTIMISATION: diagram → objective → constraint → eliminate → f′ = 0 → f″ test → answer asked\n```\n\n---","pyq":"**Q1.** *(3 marks)* Find the intervals in which f(x) = 2x³ − 3x² − 36x + 7 is\n(a) strictly increasing, (b) strictly decreasing.\n\n**Q2.** *(3 marks)* Find the intervals in which f(x) = sin x + cos x, 0 ≤ x ≤ 2π, is increasing or\ndecreasing.\n\n**Q3.** *(5 marks)* Show that the height of a cylinder of maximum volume that can be inscribed in a\nsphere of radius R is 2R/√3.\n\n**Q4.** *(5 marks)* A square piece of tin of side 18 cm is to be made into a box without a top by\ncutting a square from each corner and folding up the flaps. What should be the side of the square to\nbe cut off so that the volume of the box is maximum? Find that maximum volume.\n\n**Q5.** *(5 marks)* Find the absolute maximum and minimum values of f(x) = 2x³ − 24x + 107 on the\ninterval [1, 3], and also on [−3, −1].\n\n**Q6.** *(5 marks)* A wire of length 28 m is to be cut into two pieces. One piece is bent into a\nsquare and the other into a circle. What should be the lengths of the two pieces so that the\ncombined area is minimum?\n\n**Q7.** *(2 marks)* The radius of a circle is increasing at the rate of 3 cm/s. Find the rate at\nwhich the area of the circle is increasing when the radius is 10 cm.\n\n**Q8.** *(2 marks)* Show that f(x) = x³ − 3x² + 3x − 100 is increasing on **R**.\n\n**Q9.** *(4 marks, case study)* A window is in the form of a rectangle surmounted by a semicircular\nopening. The total perimeter of the window is 10 m.\n(i) If the radius of the semicircle is r and the height of the rectangular part is h, express the\narea A of the window in terms of r alone.\n(ii) Find the value of r for which the area is maximum.\n(iii) Find the maximum area.\n\n**Q10.** *(3 marks)* Find two positive numbers whose sum is 16 and the sum of whose cubes is minimum.\n\n**Q11.** *(1 mark, MCQ)* The function f(x) = x² − 4x + 6 is strictly decreasing on\n(a) (−∞, 2) (b) (2, ∞) (c) **R** (d) (−∞, ∞) − {2}\n\n**Q12.** *(2 marks)* Show that of all rectangles inscribed in a given fixed circle, the square has\nthe maximum area.\n\n---","sol":"### Q1 — intervals of monotonicity for 2x³ − 3x² − 36x + 7\n\n```\nf(x)  = 2x³ − 3x² − 36x + 7\nf′(x) = 6x² − 6x − 36\n      = 6(x² − x − 6)\n      = 6(x − 3)(x + 2)\n```\n\nCritical points: f′(x) = 0 at **x = −2 and x = 3**. These split **R** into three intervals.\n\n**Sign table:**\n\n| Interval | test point | (x − 3) | (x + 2) | f′(x) | f is |\n| --- | --- | --- | --- | --- | --- |\n| (−∞, −2) | x = −3 | − | − | **+** | increasing |\n| (−2, 3) | x = 0 | − | + | **−** | decreasing |\n| (3, ∞) | x = 4 | + | + | **+** | increasing |\n\n**(a) Strictly increasing on (−∞, −2) ∪ (3, ∞)**\n**(b) Strictly decreasing on (−2, 3)**\n\n### Q2 — intervals for sin x + cos x on [0, 2π]\n\n```\nf′(x) = cos x − sin x\n```\n\nSet f′(x) = 0:\n\n```\n      cos x = sin x\n⟹     tan x = 1\n⟹     x = π/4  or  x = 5π/4        (within [0, 2π])\n```\n\n**Sign table** on [0, 2π]:\n\n| Interval | test point | f′(x) = cos x − sin x | f is |\n| --- | --- | --- | --- |\n| (0, π/4) | x = 0 | 1 − 0 = **+** | increasing |\n| (π/4, 5π/4) | x = π/2 | 0 − 1 = **−** | decreasing |\n| (5π/4, 2π) | x = 3π/2 | 0 − (−1) = **+** | increasing |\n\n**Increasing on [0, π/4) ∪ (5π/4, 2π]; decreasing on (π/4, 5π/4).**\n\n### Q3 — cylinder of maximum volume in a sphere of radius R\n\n**Set-up.** Let the cylinder have base radius r and height h. Inscribed in the sphere, the diagonal\nof the axial cross-section is a diameter, so by Pythagoras on the right triangle formed by r, h/2 and R:\n\n```\n      r² + (h/2)² = R²\n⟹     r² = R² − h²/4                    …(constraint)\n```\n\n**Objective.**\n\n```\n      V = π r² h\n```\n\n**Eliminate r using the constraint:**\n\n```\n      V(h) = π (R² − h²/4) h = π R² h − (π/4) h³\n```\n\nwith 0 < h < 2R.\n\n**Differentiate:**\n\n```\n      dV/dh = π R² − (3π/4) h²\n```\n\nSet dV/dh = 0:\n\n```\n      π R² = (3π/4) h²\n⟹     h² = 4R²/3\n⟹     h = 2R/√3                          (taking the positive root, since h > 0)\n```\n\n**Second derivative test:**\n\n```\n      d²V/dh² = −(3π/2) h\n```\n\nAt h = 2R/√3 > 0, d²V/dh² = −(3π/2)(2R/√3) < 0.\n\nHence V is **maximum** at h = 2R/√3.\n\n**Therefore the height of the cylinder of maximum volume inscribed in a sphere of radius R is\nh = 2R/√3.** ∎\n\n*(For interest: then r² = R² − R²/3 = 2R²/3, and V_max = π(2R²/3)(2R/√3) = 4πR³/(3√3).)*\n\n### Q4 — open box from an 18 cm square sheet\n\n**Set-up.** Let x cm be the side of each square cut from the corners. After folding, the box has\n\n```\nbase = (18 − 2x) by (18 − 2x)          height = x\n```\n\nwith 0 < x < 9 (so the base has positive side length).\n\n**Objective.**\n\n```\n      V(x) = x (18 − 2x)²\n           = x (324 − 72x + 4x²)\n           = 324x − 72x² + 4x³\n```\n\n**Differentiate:**\n\n```\n      V′(x) = 324 − 144x + 12x²\n            = 12(x² − 12x + 27)\n            = 12(x − 3)(x − 9)\n```\n\nSet V′(x) = 0: x = 3 or x = 9. But x = 9 is outside the domain (it gives a base of zero), so\n\n```\n      x = 3\n```\n\n**Second derivative test:**\n\n```\n      V″(x) = −144 + 24x\n      V″(3) = −144 + 72 = −72 < 0\n```\n\nHence V is **maximum** at x = 3.\n\n**Maximum volume:**\n\n```\n      V(3) = 3(18 − 6)² = 3(12)² = 3(144) = 432 cm³\n```\n\n**The side of the square to be cut off is 3 cm, and the maximum volume is 432 cm³.**\n\n### Q5 — absolute extrema of 2x³ − 24x + 107\n\n```\nf′(x) = 6x² − 24 = 6(x² − 4) = 6(x − 2)(x + 2)\n```\n\nCritical points: x = 2 and x = −2.\n\n**On [1, 3]:** the critical point x = 2 lies inside; x = −2 does not. Evaluate f at x = 1, 2, 3:\n\n```\nf(1) = 2 − 24 + 107 = 85\nf(2) = 16 − 48 + 107 = 75\nf(3) = 54 − 72 + 107 = 89\n```\n\n**Absolute maximum = 89 at x = 3; absolute minimum = 75 at x = 2.**\n\n**On [−3, −1]:** the critical point x = −2 lies inside. Evaluate f at x = −3, −2, −1:\n\n```\nf(−3) = 2(−27) − 24(−3) + 107 = −54 + 72 + 107 = 125\nf(−2) = 2(−8) − 24(−2) + 107 = −16 + 48 + 107 = 139\nf(−1) = 2(−1) − 24(−1) + 107 = −2 + 24 + 107 = 129\n```\n\n**Absolute maximum = 139 at x = −2; absolute minimum = 125 at x = −3.**\n\n> Note that on [1, 3] the maximum occurred at an **endpoint** and the minimum at the critical point,\n> while on [−3, −1] the maximum was at the critical point and the minimum at an endpoint. This is\n> exactly why you must evaluate at the endpoints too.\n\n### Q6 — wire of 28 m cut into a square and a circle\n\n**Set-up.** Let x metres be the length used for the **circle**; then (28 − x) metres goes to the\nsquare, with 0 < x < 28.\n\n**Circle:** circumference 2πr = x ⟹ r = x/(2π), so\n\n```\narea of circle = πr² = π · x²/(4π²) = x²/(4π)\n```\n\n**Square:** perimeter 4a = 28 − x ⟹ a = (28 − x)/4, so\n\n```\narea of square = a² = (28 − x)²/16\n```\n\n**Objective — total area:**\n\n```\n      A(x) = x²/(4π) + (28 − x)²/16\n```\n\n**Differentiate:**\n\n```\n      A′(x) = 2x/(4π) + 2(28 − x)(−1)/16\n            = x/(2π) − (28 − x)/8\n```\n\nSet A′(x) = 0:\n\n```\n      x/(2π) = (28 − x)/8\n⟹     8x = 2π(28 − x)\n⟹     8x = 56π − 2πx\n⟹     x(8 + 2π) = 56π\n⟹     x = 56π/(8 + 2π) = 28π/(4 + π)\n```\n\n**Second derivative test:**\n\n```\n      A″(x) = 1/(2π) + 1/8 > 0\n```\n\nwhich is positive for all x, so A is **minimum** at this value.\n\n**Lengths:**\n\n```\ncircle piece  = 28π/(π + 4) m\nsquare piece  = 28 − 28π/(π + 4) = 28[(π + 4) − π]/(π + 4) = 112/(π + 4) m\n```\n\n**The wire should be cut into pieces of length 28π/(π + 4) m (for the circle) and 112/(π + 4) m (for\nthe square).**\n\n*(Numerically, about 12.32 m and 15.68 m.)*\n\n### Q7 — rate of change of area of a circle\n\n```\nA = πr²        ⟹     dA/dt = 2πr · dr/dt\n```\n\nGiven dr/dt = 3 cm/s and r = 10 cm:\n\n```\n      dA/dt = 2π(10)(3) = 60π cm²/s\n```\n\n**The area is increasing at the rate of 60π cm²/s** (≈ 188.5 cm²/s).\n\n### Q8 — show x³ − 3x² + 3x − 100 is increasing on R\n\n```\nf′(x) = 3x² − 6x + 3\n      = 3(x² − 2x + 1)\n      = 3(x − 1)²\n```\n\nSince (x − 1)² ≥ 0 for all real x, we have **f′(x) ≥ 0 for all x ∈ R**, with equality only at the\nsingle point x = 1.\n\nHence f is **increasing on R**. ∎\n\n> A function whose derivative vanishes at isolated points but is otherwise positive is still\n> increasing on the whole interval. If the question says \"strictly increasing\", note that f′(x) > 0\n> for all x ≠ 1 and f′ = 0 only at one point, which is enough for strict increase — say so.\n\n### Q9 — window: rectangle + semicircle, perimeter 10 m\n\n**(i) Express A in terms of r.**\n\nThe rectangle's width equals the diameter of the semicircle, so width = 2r. Let its height be h.\n\n**Perimeter** (note: the top of the rectangle is *not* part of the boundary — it is the diameter of\nthe semicircle, which is interior):\n\n```\n      perimeter = 2h + 2r + πr = 10\n⟹     h = (10 − 2r − πr)/2                …(constraint)\n```\n\n**Area:**\n\n```\n      A = (rectangle) + (semicircle)\n        = 2rh + ½πr²\n```\n\nSubstituting h:\n\n```\n      A = 2r · (10 − 2r − πr)/2 + ½πr²\n        = r(10 − 2r − πr) + ½πr²\n        = 10r − 2r² − πr² + ½πr²\n```\n\n```\nA(r) = 10r − 2r² − (π/2) r²\n```\n\n**(ii) Maximise.**\n\n```\n      dA/dr = 10 − 4r − πr = 10 − r(4 + π)\n```\n\nSet dA/dr = 0:\n\n```\n      r = 10/(4 + π)\n```\n\nSecond derivative test:\n\n```\n      d²A/dr² = −4 − π < 0\n```\n\nSo the area is **maximum** at **r = 10/(4 + π) m** (≈ 1.40 m).\n\n*(Worth noting: substituting back gives h = 20/(4 + π) ÷ 2 = 10/(4 + π) = r. So the maximum-area\nwindow has rectangle height equal to the semicircle radius.)*\n\n**(iii) Maximum area.**\n\n```\n      A = 10r − r²(2 + π/2)      with r = 10/(4 + π)\n\nNote 2 + π/2 = (4 + π)/2, so\n\n      A = 10 · 10/(4 + π)  −  [100/(4 + π)²] · (4 + π)/2\n        = 100/(4 + π) − 50/(4 + π)\n        = 50/(4 + π)\n```\n\n**Maximum area = 50/(4 + π) m²** (≈ 7.00 m²).\n\n### Q10 — two positive numbers, sum 16, minimum sum of cubes\n\nLet the numbers be x and 16 − x, with 0 < x < 16.\n\n```\n      S(x) = x³ + (16 − x)³\n```\n\n```\n      S′(x) = 3x² − 3(16 − x)²\n            = 3[ x² − (16 − x)² ]\n            = 3[ x − (16 − x) ][ x + (16 − x) ]        [difference of squares]\n            = 3(2x − 16)(16)\n            = 48(2x − 16)\n```\n\nSet S′(x) = 0: 2x − 16 = 0 ⟹ **x = 8**.\n\n**Second derivative test:**\n\n```\n      S″(x) = 6x + 6(16 − x) = 96 > 0\n```\n\nPositive, so S is **minimum** at x = 8.\n\n**The two numbers are 8 and 8**, giving the minimum sum of cubes 8³ + 8³ = 1024.\n\n### Q11 — where is x² − 4x + 6 strictly decreasing?\n\n```\nf′(x) = 2x − 4 = 2(x − 2)\n```\n\nf′(x) < 0 ⟺ x < 2.\n\n**Answer: (a) (−∞, 2)**\n\n### Q12 — the square is the rectangle of maximum area in a circle\n\nLet the circle have fixed radius a. A rectangle inscribed in it has its diagonal as a diameter, so if\nthe sides are x and y:\n\n```\n      x² + y² = (2a)² = 4a²\n⟹     y = √(4a² − x²)\n```\n\n**Objective:**\n\n```\n      A = xy = x√(4a² − x²)\n```\n\nIt is easier to maximise A² (a maximum of A² occurs at the same x, since A > 0):\n\n```\n      A² = x²(4a² − x²) = 4a²x² − x⁴\n```\n\nLet S = A². Then\n\n```\n      dS/dx = 8a²x − 4x³ = 4x(2a² − x²)\n```\n\nSet dS/dx = 0 (with x > 0):\n\n```\n      x² = 2a²   ⟹   x = a√2\n```\n\n**Second derivative test:**\n\n```\n      d²S/dx² = 8a² − 12x²\n      at x² = 2a² :  8a² − 24a² = −16a² < 0\n```\n\nSo S, and hence A, is **maximum** at x = a√2.\n\nThen\n\n```\n      y = √(4a² − 2a²) = √(2a²) = a√2 = x\n```\n\nSince x = y, the rectangle of maximum area is a **square**. ∎\n\n> The trick of maximising A² instead of A avoids differentiating a square root, and it is fully\n> accepted. State the reason (\"since A > 0, A is maximum when A² is maximum\") — that sentence is a\n> mark.\n\n---","test":"Time: 55 minutes. Answers below.\n\n1. *(1)* The function f(x) = x³ is\n   (a) increasing on **R** (b) decreasing on **R** (c) increasing on (0, ∞) only (d) constant\n2. *(1)* If f′(c) = 0 and f″(c) > 0, then at x = c the function has a\n   (a) local maximum (b) local minimum (c) point of inflection (d) cannot say\n3. *(1)* The maximum value of sin x + cos x is\n   (a) 1 (b) 2 (c) √2 (d) 1/√2\n4. *(2)* The side of a cube is increasing at 3 cm/s. Find the rate of increase of its volume when the\n   side is 10 cm.\n5. *(3)* Find the intervals in which f(x) = x³ − 12x² + 36x + 17 is increasing or decreasing.\n6. *(3)* Find the intervals in which f(x) = −2x³ − 9x² − 12x + 1 is increasing or decreasing.\n7. *(3)* Find the local maximum and local minimum values of f(x) = x³ − 6x² + 9x + 15.\n8. *(3)* Find the absolute maximum and minimum values of f(x) = x⁴ − 8x² + 3 on [0, 3].\n9. *(5)* Show that the right circular cone of maximum volume that can be inscribed in a sphere of\n   radius R has height 4R/3.\n10. *(5)* Find the point on the curve y² = 4x which is nearest to the point (2, 1).\n11. *(4)* An open cylindrical tank of given volume V is to be made. Show that the material used is\n    least when the height equals the radius of the base.\n12. *(2)* Prove that f(x) = eˣ is strictly increasing on **R**.\n13. *(3)* Find two positive numbers whose product is 100 and whose sum is minimum.\n\n### Answer key\n\n**1. (a) increasing on R.** f′(x) = 3x² ≥ 0, zero only at x = 0.\n\n**2. (b) local minimum.**\n\n**3. (c) √2.** f′ = cos x − sin x = 0 at x = π/4, and f(π/4) = 1/√2 + 1/√2 = √2. f″ = −sin x − cos x,\nwhich is negative at π/4, so it is a maximum.\n\n**4. 900 cm³/s.** V = x³, dV/dt = 3x²(dx/dt) = 3(100)(3) = 900 cm³/s.\n\n**5.** f′ = 3x² − 24x + 36 = 3(x² − 8x + 12) = 3(x − 2)(x − 6).\nIncreasing on (−∞, 2) ∪ (6, ∞); decreasing on (2, 6).\n\n**6.** f′ = −6x² − 18x − 12 = −6(x² + 3x + 2) = −6(x + 1)(x + 2).\nf′ > 0 when (x+1)(x+2) < 0, i.e. −2 < x < −1.\nIncreasing on (−2, −1); decreasing on (−∞, −2) ∪ (−1, ∞).\n\n**7.** f′ = 3x² − 12x + 9 = 3(x − 1)(x − 3). Critical points x = 1, 3.\nf″ = 6x − 12. f″(1) = −6 < 0 ⟹ local **max** at x = 1, value f(1) = 1 − 6 + 9 + 15 = 19.\nf″(3) = 6 > 0 ⟹ local **min** at x = 3, value f(3) = 27 − 54 + 27 + 15 = 15.\n\n**8.** f′ = 4x³ − 16x = 4x(x² − 4) = 4x(x − 2)(x + 2). In [0, 3] the critical points are x = 0 and\nx = 2. Evaluate: f(0) = 3, f(2) = 16 − 32 + 3 = −13, f(3) = 81 − 72 + 3 = 12.\n**Absolute max = 12 at x = 3; absolute min = −13 at x = 2.**\n\n**9.** Let the cone have base radius r and height h. With the sphere's centre at distance (h − R)\nfrom the base, r² = R² − (h − R)² = 2Rh − h².\nV = (1/3)πr²h = (1/3)π(2Rh − h²)h = (1/3)π(2Rh² − h³).\ndV/dh = (1/3)π(4Rh − 3h²) = (π/3)h(4R − 3h) = 0 ⟹ h = 4R/3 (rejecting h = 0).\nd²V/dh² = (1/3)π(4R − 6h); at h = 4R/3 this is (π/3)(4R − 8R) = −4πR/3 < 0 ⟹ maximum. ∎\n\n**10. (1, 2).** Minimise the squared distance from (2, 1) to a point (x, y) on y² = 4x, i.e.\nx = y²/4. D² = (y²/4 − 2)² + (y − 1)².\nd(D²)/dy = 2(y²/4 − 2)(y/2) + 2(y − 1) = y³/4 − 2y + 2y − 2 = y³/4 − 2.\nSetting = 0: y³ = 8 ⟹ y = 2, so x = 4/4 = 1.\nd²(D²)/dy² = 3y²/4 > 0 ⟹ minimum. **Nearest point (1, 2).**\n\n**11.** Open cylinder: V = πr²h (fixed), material S = πr² + 2πrh (base + curved surface, no lid).\nFrom the constraint h = V/(πr²), so S = πr² + 2V/r.\ndS/dr = 2πr − 2V/r² = 0 ⟹ πr³ = V ⟹ r³ = V/π.\nd²S/dr² = 2π + 4V/r³ > 0 ⟹ minimum.\nThen h = V/(πr²) = πr³/(πr²) = r. Hence **h = r** at minimum material. ∎\n\n**12.** f′(x) = eˣ > 0 for all x ∈ **R**. Hence f is strictly increasing on **R**. ∎\n\n**13. 10 and 10.** Let the numbers be x and 100/x. S = x + 100/x.\nS′ = 1 − 100/x² = 0 ⟹ x² = 100 ⟹ x = 10 (positive).\nS″ = 200/x³ > 0 for x > 0 ⟹ minimum. Numbers are 10 and 10, minimum sum 20.\n\n**Scoring.** Out of 36. Below 25 → the failure is almost always at step 4 of the optimisation\nprocedure (eliminating a variable using the constraint). Redo §3 Q3, Q4, Q6 and write out the\nconstraint as a separate labelled line each time.\n\n---","tips":"**On monotonicity questions**\n\n1. **Factorise f′(x) completely** before finding critical points. An unfactorised quadratic invites\n   sign errors; a factorised one makes the sign table trivial.\n\n2. **Present a sign table.** Interval, test point, sign of each factor, sign of f′, conclusion. It is\n   the clearest presentation and the marking scheme follows it.\n\n3. **Use union notation for disjoint intervals:** \"(−∞, −2) ∪ (3, ∞)\", not \"(−∞, −2) and (3, ∞)\" and\n   certainly not \"(−∞, −2) ∩ (3, ∞)\".\n\n4. **Respect the given domain.** If the question restricts to [0, 2π], do not report intervals\n   outside it, and include the endpoints as the question's notation suggests.\n\n**On maxima and minima**\n\n5. **State the second derivative test explicitly with its value and sign:** \"f″(3) = −72 < 0, hence\n   f has a local maximum at x = 3.\" Both the value and the conclusion are marked.\n\n6. **If f″(c) = 0, say the test fails and switch to the first derivative test.** Do not conclude\n   \"point of inflection\" automatically — it might still be an extremum (x⁴ at 0 is a minimum with\n   f″(0) = 0).\n\n7. **On a closed interval, evaluate at the endpoints.** Write the three or four values as a short\n   list and then pick the largest and smallest. This is one of the highest-frequency dropped marks\n   in the chapter.\n\n8. **Answer the question that was asked.** If it asks for the maximum volume, the answer is 432 cm³,\n   not x = 3. Many students find x correctly and stop, losing the final mark.\n\n**On optimisation word problems**\n\n9. **Draw the diagram first, and label every variable on it.** It is worth a mark, and it is also\n   how you find the constraint.\n\n10. **Write the constraint as its own labelled line**, then the objective, then the substitution.\n    Three separate lines. Mixing them is where errors enter.\n\n11. **State the domain of your variable** (0 < x < 9, 0 < h < 2R). Then when a critical point falls\n    outside it, you can reject it with a reason — which is itself a mark.\n\n12. **Reject invalid roots explicitly.** \"x = 9 is rejected since it gives a base of zero side\" is\n    better than silently ignoring it.\n\n13. **To avoid differentiating a square root, maximise the square.** For distance and area problems,\n    say \"since D > 0, D is minimum when D² is minimum\" and work with D². This is standard and saves\n    time.\n\n14. **Keep π symbolic.** Answers like 28π/(π + 4) and 50/(4 + π) are the expected form. You may add\n    the decimal in brackets, but do not replace the exact form with it."}},{"id":"m7","subj":"maths","num":7,"title":"Integrals","unit":"Unit III · Calculus","unitMarks":35,"prio":1,"appear":"Unit III Calculus (35 marks) · The single largest source of marks in the paper: typically 8–12 marks across one 5-marker, one or two 3-markers and 1–2 MCQs. Give this chapter more time than any other in Mathematics.","deleted":"- **Definite integral as a limit of a sum** (the Σ-with-limits definition and its problems)\n- ∫√(ax² + bx + c) dx and ∫(px + q)√(ax² + bx + c) dx\n\n> **Good news.** The limit-of-a-sum questions were the most unpleasant thing in this chapter and they\n> are gone. What remains is a set of techniques, each with a clear trigger.","recall":"```\nCLASSIFY FIRST (15 seconds):\n  f(g)·g′ → substitution   |  product → by parts (ILATE)  |  rational → partial fractions\n  1/quadratic → complete square  |  linear/quadratic → split numerator\n  even trig powers → double angle  |  symmetric limits → odd/even  |  [0,a] → P4\n\n∫eˣ[f + f′]dx = eˣ f + C          ∫log x dx = x log x − x + C\n∫u v dx = u∫v − ∫(u′)(∫v)         ILATE: Inverse, Log, Algebraic, Trig, Exponential\n\nP4: ∫[0,a] f(x)dx = ∫[0,a] f(a−x)dx      →  write I twice, ADD, then halve\nP7: odd on [−a,a] → 0 ;  even on [−a,a] → 2∫[0,a]\n\nDefinite integral: NO +C.  After substituting, CHANGE THE LIMITS.\nIndefinite integral: ALWAYS +C.\n```","s":{"scope":"### In the syllabus\n\n- Integration as the **inverse process of differentiation**\n- Integration by **substitution**, by **partial fractions**, by **parts**\n- Evaluation of integrals of these standard types:\n\n```\n∫ dx/(x² ± a²)          ∫ dx/√(x² ± a²)          ∫ dx/√(a² − x²)\n∫ dx/(ax² + bx + c)     ∫ dx/√(ax² + bx + c)\n∫ (px + q)dx/(ax² + bx + c)      ∫ (px + q)dx/√(ax² + bx + c)\n∫ √(a² ± x²) dx         ∫ √(x² − a²) dx\n```\n\n- **Fundamental Theorem of Calculus** (without proof)\n- **Properties of definite integrals** and their use in evaluation\n\n### Deleted — do not study\n\n- **Definite integral as a limit of a sum** (the Σ-with-limits definition and its problems)\n- ∫√(ax² + bx + c) dx and ∫(px + q)√(ax² + bx + c) dx\n\n> **Good news.** The limit-of-a-sum questions were the most unpleasant thing in this chapter and they\n> are gone. What remains is a set of techniques, each with a clear trigger.\n\n---","brief":"### The 15-second classification\n\nBefore writing anything, decide which method applies. This decision is the whole skill.\n\n| The integrand looks like | Use |\n| --- | --- |\n| f(g(x)) · g′(x) — a function and (a multiple of) its own derivative | **substitution** |\n| a product of two unrelated functions (x·eˣ, x·log x, x·sin x) | **by parts**, ILATE |\n| a rational function whose denominator factorises | **partial fractions** |\n| 1/(quadratic) or 1/√(quadratic) | **complete the square**, then a standard form |\n| (linear)/(quadratic) or (linear)/√(quadratic) | **split the numerator**: linear = k(derivative of denominator) + m |\n| √(a² − x²), √(a² + x²), √(x² − a²) | **standard formula** (or the trig substitution) |\n| even powers of sin/cos | **double-angle identities** to reduce the power |\n| definite, limits symmetric about 0 | check **odd/even** first |\n| definite over [0, a] or [a, b] with an awkward integrand | try **f(x) → f(a − x)** or **f(a + b − x)** |\n| definite with a modulus or [x] | **split the interval** at the breakpoints |\n\n### Standard integrals — memorise this table\n\n```\n∫ xⁿ dx = x^(n+1)/(n+1) + C        (n ≠ −1)\n∫ dx/x = log|x| + C\n∫ eˣ dx = eˣ + C\n∫ aˣ dx = aˣ/log a + C\n\n∫ sin x dx = −cos x + C            ∫ cos x dx = sin x + C\n∫ sec²x dx = tan x + C             ∫ cosec²x dx = −cot x + C\n∫ sec x tan x dx = sec x + C       ∫ cosec x cot x dx = −cosec x + C\n\n∫ tan x dx = log|sec x| + C        ∫ cot x dx = log|sin x| + C\n∫ sec x dx = log|sec x + tan x| + C\n∫ cosec x dx = log|cosec x − cot x| + C\n\n∫ dx/√(1 − x²) = sin⁻¹x + C        ∫ dx/(1 + x²) = tan⁻¹x + C\n```\n\n### The special forms — the nine that are named in the syllabus\n\n```\n(1)  ∫ dx/(x² − a²)   = (1/2a) log |(x − a)/(x + a)| + C\n(2)  ∫ dx/(a² − x²)   = (1/2a) log |(a + x)/(a − x)| + C\n(3)  ∫ dx/(x² + a²)   = (1/a) tan⁻¹(x/a) + C\n\n(4)  ∫ dx/√(x² − a²)  = log |x + √(x² − a²)| + C\n(5)  ∫ dx/√(x² + a²)  = log |x + √(x² + a²)| + C\n(6)  ∫ dx/√(a² − x²)  = sin⁻¹(x/a) + C\n\n(7)  ∫ √(a² − x²) dx  = (x/2)√(a² − x²) + (a²/2) sin⁻¹(x/a) + C\n(8)  ∫ √(x² + a²) dx  = (x/2)√(x² + a²) + (a²/2) log|x + √(x² + a²)| + C\n(9)  ∫ √(x² − a²) dx  = (x/2)√(x² − a²) − (a²/2) log|x + √(x² − a²)| + C\n```\n\n**How to remember the pattern.** Forms (1)–(3): denominator is a quadratic without a root sign → the\nanswer is a **log** if the quadratic factorises as a difference of squares, and a **tan⁻¹** if it is\na sum. Forms (4)–(6): with a root sign → **log** for x² ± a², **sin⁻¹** for a² − x². Forms (7)–(9):\nthe √ integrated gives \"half of x times the root, plus half of a² times the corresponding form from\n(4)–(6)\" — and note (9) alone has a **minus** before the a²/2 term.\n\n### Method 1 — Substitution\n\nPut t = the inner function, so that dt = g′(x)dx, and the integral becomes one in t.\n\n```\n∫ 2x/(1 + x²) dx        put t = 1 + x², dt = 2x dx  →  ∫ dt/t = log|t| = log(1 + x²) + C\n∫ sin(log x)/x dx       put t = log x, dt = dx/x     →  ∫ sin t dt = −cos(log x) + C\n∫ (tan⁻¹x)/(1 + x²) dx  put t = tan⁻¹x, dt = dx/(1+x²) →  ∫ t dt = (tan⁻¹x)²/2 + C\n```\n\n**In a definite integral, when you substitute you must either change the limits to the new variable,\nor back-substitute before evaluating.** Pick one and be consistent. Changing the limits is safer and\nfaster — and it is where a mark is routinely lost.\n\n### Method 2 — By parts\n\n```\n∫ u · v dx = u ∫v dx − ∫ (du/dx) (∫v dx) dx\n```\n\n**Choosing u** — the **ILATE** order. Take as u (the function to be differentiated) whichever comes\n**first** in:\n\n```\nI  — Inverse trigonometric  (sin⁻¹x, tan⁻¹x)\nL  — Logarithmic            (log x)\nA  — Algebraic              (x, x², polynomials)\nT  — Trigonometric          (sin x, cos x)\nE  — Exponential            (eˣ)\n```\n\nSo in ∫ x log x dx, \"L\" beats \"A\": take u = log x. In ∫ x eˣ dx, \"A\" beats \"E\": take u = x.\n\n**Two s
