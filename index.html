 on the calibration of\nthe meter.\n\n### Q3 — temperature dependence of resistivity, explained via ρ = m/(ne²τ)\n\n```\n      ρ = m / (n e² τ)\n```\n\nso ρ depends on the temperature only through **n** (number density of free charge carriers) and **τ**\n(relaxation time).\n\n**Metals.** The number density n of free electrons is essentially **fixed** — it is set by the number\nof atoms and does not change appreciably with temperature. As T rises, the lattice ions vibrate more\nvigorously, so electrons collide **more frequently**, and **τ decreases**. With n constant and τ\nfalling, ρ = m/(ne²τ) **increases**. Hence α > 0 for metals.\n\n**Semiconductors.** Here n is small at low temperature, because electrons must be thermally excited\nacross an energy gap to become free. As T rises, **n increases very rapidly** (roughly\nexponentially). τ still decreases, as in a metal, but the **increase in n dominates by far**.\nTherefore ρ = m/(ne²τ) **decreases** sharply. Hence α < 0 for semiconductors.\n\n**Graphs:**\n\n```\n   ρ │        METAL                      ρ │  SEMICONDUCTOR\n     │       ╱                             │╲\n     │      ╱                              │ ╲\n     │     ╱     ρ increases,              │  ╲\n     │    ╱      nearly linearly           │   ╲___   ρ decreases sharply\n     │   ╱                                 │       ‾‾‾───────\n   ρ₀●──                                   │\n     └────────────────── T                 └────────────────── T\n```\n\n*(Label both axes, and mark ρ₀ on the metal graph.)*\n\n### Q4 — two cells in parallel\n\n*Diagram:* two cells (ε₁, r₁) and (ε₂, r₂) connected between the same two points A and B, with a\ntotal current I leaving at B.\n\nLet the two cells be connected between points A and B, with currents I₁ and I₂ through them, and let\nthe terminal potential difference between A and B be V.\n\n**For each cell** (both discharging, driving current from A to B):\n\n```\n      V = ε₁ − I₁ r₁          ⟹     I₁ = (ε₁ − V)/r₁\n      V = ε₂ − I₂ r₂          ⟹     I₂ = (ε₂ − V)/r₂\n```\n\n**By the junction rule**, the total current is\n\n```\n      I = I₁ + I₂\n        = (ε₁ − V)/r₁ + (ε₂ − V)/r₂\n        = (ε₁/r₁ + ε₂/r₂) − V(1/r₁ + 1/r₂)\n```\n\nRearranging for V:\n\n```\n      V (1/r₁ + 1/r₂) = (ε₁/r₁ + ε₂/r₂) − I\n```\n\n```\n      V = (ε₁/r₁ + ε₂/r₂)/(1/r₁ + 1/r₂)  −  I · 1/(1/r₁ + 1/r₂)\n```\n\n```\n      V = (ε₁r₂ + ε₂r₁)/(r₁ + r₂)  −  I · [ r₁r₂/(r₁ + r₂) ]\n```\n\nComparing with the standard single-cell form V = ε_eq − I r_eq:\n\n```\n      ε_eq = (ε₁r₂ + ε₂r₁)/(r₁ + r₂)\n\n      r_eq = r₁r₂/(r₁ + r₂)          i.e.     1/r_eq = 1/r₁ + 1/r₂\n```\n\n∎\n\n*(Sanity check: if the two cells are identical, ε₁ = ε₂ = ε and r₁ = r₂ = r, then ε_eq = ε and\nr_eq = r/2 — the emf is unchanged but the internal resistance is halved, which is exactly why cells\nare put in parallel.)*\n\n### Q5 — current and terminal PD\n\n```\n      ε = 2 V          r = 0.5 Ω          R = 4.5 Ω\n```\n\n```\n      I = ε/(R + r) = 2/(4.5 + 0.5) = 2/5 = 0.4 A\n```\n\n```\n      V = ε − I r = 2 − (0.4)(0.5) = 2 − 0.2 = 1.8 V\n```\n\n**I = 0.4 A and V = 1.8 V.**\n\n*(Check: V = IR = (0.4)(4.5) = 1.8 V ✓ — the terminal PD equals the drop across the external\nresistance.)*\n\n### Q6 — mobility\n\n**Definition.** The **mobility** of a charge carrier is the magnitude of its drift velocity per unit\napplied electric field:\n\n```\n      μ = v_d / E\n```\n\n**SI unit:** m² V⁻¹ s⁻¹.\n\n**Dependence on relaxation time.** Since v_d = eEτ/m,\n\n```\n      μ = (eEτ/m)/E = e τ / m\n```\n\nso **mobility is directly proportional to the relaxation time τ** (and inversely proportional to the\nmass of the carrier). A longer average time between collisions means a carrier can be accelerated\nfor longer, giving a greater drift velocity for the same field.\n\n### Q7 — metre bridge\n\n*Circuit:* a 1 m uniform wire AC, unknown R in the left gap, S = 6 Ω in the right gap, jockey at B\nwith a galvanometer.\n\n```\n      R/S = l/(100 − l)\n```\n\nwith l = 40 cm and S = 6 Ω:\n\n```\n      R = S · l/(100 − l)\n        = 6 × 40/(100 − 40)\n        = 6 × 40/60\n        = 4 Ω\n```\n\n**R = 4 Ω**\n\n**Why the balance point should be near the middle.** The bridge is **most sensitive** when the four\nresistances are of comparable magnitude, which corresponds to a balance point near the mid-point of\nthe wire. Near the ends, a small change in the jockey position produces only a very small change in\nthe ratio l/(100 − l), so the null point is hard to locate precisely and the error in R is large.\nWorking near the middle also minimises the effect of the **end resistances** of the wire and the\nconnecting strips.\n\n### Q8 — wire stretched to double its length\n\n*(Given: original resistance R.)*\n\nWhen a wire is stretched, its **volume remains constant** (the material is conserved). Let the\noriginal length and area be l and A; after stretching, the length is 2l and the new area is A′.\n\n```\n      Volume constant:   l A = (2l) A′\n⟹     A′ = A/2\n```\n\nNew resistance:\n\n```\n      R′ = ρ (2l)/(A/2) = 4 · (ρ l/A) = 4R\n```\n\n**The new resistance is 4R.**\n\n**Explanation.** Resistance rises for **two** reasons acting together: the length doubles (R ∝ l), and\nthe cross-sectional area halves (R ∝ 1/A). The two effects multiply, giving a factor of 4.\n\n*(In general, stretching to n times the length gives **n²R**.)*\n\n### Q9 — V–I graphs\n\n```\n  (i) OHMIC CONDUCTOR              (ii) SEMICONDUCTOR DIODE\n   I │        ╱                     I │              ╱\n     │      ╱                         │             │\n     │    ╱   straight line           │            ╱   forward bias:\n     │  ╱     through origin          │        ___╱    sharp rise after\n     │╱       slope = 1/R             │  ─────╯        the knee voltage\n  ───●────────── V              ──────●────────────── V\n     │╱                          reverse│  (tiny, almost\n     │                            bias  │   constant current)\n```\n\n**One difference:** for an ohmic conductor the graph is a **straight line through the origin**, so\nthe ratio V/I — the resistance — is **constant**. For a diode the graph is **non-linear** and\ndifferent in forward and reverse bias, so the resistance is **not constant**; it also conducts\nappreciably in only one direction.\n\n### Q10 — resistance of a metal on heating\n\n**Answer: (a) increases**\n\nFor a metal, n is essentially constant and τ decreases with temperature, so ρ = m/(ne²τ) increases,\nand hence so does R = ρl/A.\n\n### Q11 — case study: V–I graph of a cell\n\nThe relation between terminal potential difference and current is\n\n```\n      V = ε − I r\n```\n\nwhich is a straight line in V against I.\n\n**(i) The V-axis intercept** is the value of V when I = 0, which is the **emf of the cell**.\n\n```\n      ε = 1.5 V\n```\n\n**(ii) The magnitude of the slope** is r, the **internal resistance of the cell**.\n\n```\n      r = 0.4 Ω\n```\n\n*(The slope is negative, since V falls as I rises; the magnitude is r.)*\n\n**(iii) Equation of the line:**\n\n```\n      V = 1.5 − 0.4 I\n```\n\n**(iv) Short circuit** means the external resistance is zero, so V = 0:\n\n```\n      0 = 1.5 − 0.4 I\n⟹     I = 1.5/0.4 = 3.75 A\n```\n\n**The short-circuit current is 3.75 A** — which is also just ε/r, as expected.\n\n### Q12 — Kirchhoff's rules on a series–parallel circuit\n\n*Circuit:* a 10 V cell (negligible internal resistance), then a 2 Ω resistor, then a parallel pair\nof 4 Ω and 6 Ω, back to the cell.\n\n**Step 1 — the parallel combination.**\n\n```\n      1/R_p = 1/4 + 1/6 = 3/12 + 2/12 = 5/12\n⟹     R_p = 12/5 = 2.4 Ω\n```\n\n**Step 2 — total resistance and main current.**\n\n```\n      R_total = 2 + 2.4 = 4.4 Ω\n      I = ε/R_total = 10/4.4 = 2.27 A\n```\n\n**Step 3 — potential difference across the parallel section.**\n\n```\n      V_p = I R_p = (2.27)(2.4) = 5.45 V\n```\n\n*(Equivalently, the drop across the 2 Ω resistor is (2.27)(2) = 4.55 V, and 10 − 4.55 = 5.45 V ✓ —\nthis is Kirchhoff's loop rule.)*\n\n**Step 4 — branch currents** (each branch has the full 5.45 V across it, since they are in parallel):\n\n```\n      I₄ = 5.45/4 = 1.36 A\n      I₆ = 5.45/6 = 0.91 A\n```\n\n*Check with the junction rule:* I₄ + I₆ = 1.36 + 0.91 = 2.27 A = I ✓\n\n**Currents: 2.27 A through the 2 Ω resistor, 1.36 A through the 4 Ω, and 0.91 A through the 6 Ω.**\n\n*(Note that the smaller resistance carries the larger current — in parallel, I ∝ 1/R.)*\n\n---","test":"Time: 50 minutes. Answers below.\n\n1. *(1)* The SI unit of current density is\n   (a) A (b) A m⁻² (c) A m² (d) A m⁻¹\n2. *(1)* The drift velocity of electrons in a copper wire carrying a normal current is of the order of\n   (a) 10⁵ m s⁻¹ (b) 10⁻⁴ m s⁻¹ (c) 10⁸ m s⁻¹ (d) 1 m s⁻¹\n3. *(1)* Kirchhoff's junction rule is a statement of the conservation of\n   (a) energy (b) charge (c) momentum (d) mass\n4. *(2)* Define resistivity and write its SI unit. On what factors does it depend?\n5. *(2)* A cell of emf 1.5 V has an internal resistance of 0.2 Ω. Find the current when it is\n   short-circuited.\n6. *(2)* Two resistors of 4 Ω and 6 Ω are connected (i) in series and (ii) in parallel. Find the\n   equivalent resistance in each case.\n7. *(3)* Derive the relation J = σE from I = neAv_d.\n8. *(3)* A 100 W, 220 V bulb is connected to a 110 V supply. What power does it consume?\n9. *(3)* Three cells of emf 2 V and internal resistance 0.5 Ω each are connected in series across an\n   external resistance of 4.5 Ω. Find the current and the terminal PD across the combination.\n10. *(5)* State Kirchhoff's rules. Apply them to find the currents in a circuit where a 6 V cell\n    (r = 1 Ω) and a 4 V cell (r = 1 Ω) are connected in parallel (both driving current the same way)\n    across a 5 Ω external resistance.\n11. *(2)* Why is manganin used for making standard resistors?\n12. *(2)* A wire of resistance 10 Ω is drawn out so that its length becomes three times. Find the new\n    resistance.\n13. *(3)* Explain why the terminal potential difference of a cell is less than its emf when a current\n    is drawn from it, and equal to it when no current is drawn.\n\n### Answer key\n\n**1. (b) A m⁻².**\n\n**2. (b) 10⁻⁴ m s⁻¹.**\n\n**3. (b) charge.**\n\n**4.** Resistivity is the resistance of a conductor of **unit length and unit cross-sectional area**:\nρ = RA/l. SI unit **Ω m**. It depends on the **nature of the material** and on the **temperature** —\nbut **not** on the dimensions of the conductor.\n\n**5. 7.5 A.** Short circuit means R = 0, so I = ε/r = 1.5/0.2 = 7.5 A.\n\n**6.** (i) Series: 4 + 6 = **10 Ω**. (ii) Parallel: 1/R = 1/4 + 1/6 = 5/12, R = **2.4 Ω**.\n\n**7.** From I = neAv_d, current density J = I/A = nev_d. Substituting v_d = eEτ/m:\nJ = ne(eEτ/m) = (ne²τ/m)E. Since ρ = m/(ne²τ), the bracket is 1/ρ = σ. Hence **J = σE**. ∎\n\n**8. 25 W.** The bulb's resistance R = V²/P = (220)²/100 = 484 Ω. At 110 V,\nP′ = V′²/R = (110)²/484 = 12100/484 = **25 W**. *(Halving the voltage quarters the power, since\nP ∝ V² at constant R.)*\n\n**9. I = 1 A, V = 4.5 V.** Series: ε_eq = 3(2) = 6 V, r_eq = 3(0.5) = 1.5 Ω.\nI = 6/(4.5 + 1.5) = 6/6 = 1 A. Terminal PD across the combination = ε_eq − I r_eq = 6 − 1.5 = **4.5 V**\n(= IR ✓).\n\n**10. I = 0.909 A through the 5 Ω; the 6 V cell supplies 1.455 A and the 4 V cell is charged at\n0.545 A.**\nTwo cells in parallel: ε_eq = (ε₁r₂ + ε₂r₁)/(r₁ + r₂) = (6·1 + 4·1)/2 = 5 V;\nr_eq = r₁r₂/(r₁ + r₂) = 1/2 = 0.5 Ω.\nTotal current I = 5/(5 + 0.5) = 5/5.5 = **0.909 A**.\nTerminal PD V = 5 − (0.909)(0.5) = 4.545 V.\nBranch currents: I₁ = (6 − 4.545)/1 = **1.455 A**; I₂ = (4 − 4.545)/1 = **−0.545 A** — negative, so the\n4 V cell is actually being **charged** by the 6 V cell.\n*Check:* 1.455 − 0.545 = 0.909 A ✓\n\n**11.** Manganin has a **very small temperature coefficient of resistivity**, so its resistance stays\nalmost constant as it warms up during use. It also has a fairly **high resistivity**, so a compact\ncoil gives a usefully large resistance. Both properties are needed for a standard resistor.\n\n**12. 90 Ω.** Stretching to n = 3 times the length gives R′ = n²R = 9(10) = 90 Ω.\n\n**13.** When a current I is drawn, the current must also flow **through the cell's own internal\nresistance r**, and this causes a potential drop Ir inside the cell. The terminal potential\ndifference is therefore V = ε − Ir, which is **less than ε**. When no current is drawn (I = 0), there\nis no internal drop, so V = ε. This is why the emf of a cell is defined as its open-circuit terminal\npotential difference.\n\n**Scoring.** Out of 32. Below 22 → the drift-velocity chain (I = neAv_d → Ohm's law → ρ) is the\npriority. Write it out from memory, in full, three times.\n\n---","tips":"**On the drift-velocity derivation (the 5-marker)**\n\n1. **Define drift velocity in words first**, then give v_d = eEτ/m. The definition is a separate mark.\n\n2. **Show the volume-and-count argument** for I = neAv_d: the volume Av_dΔt, the number nAv_dΔt, the\n   charge, then divide by Δt. Four visible steps.\n\n3. **Do not stop at I = neAv_d.** The question always continues to Ohm's law and usually to\n   resistivity. Substitute v_d and E = V/l, and finish with **R = ml/(ne²Aτ)** and **ρ = m/(ne²τ)**.\n   Those last two expressions are typically 2 of the 5 marks.\n\n4. **Define τ when you first use it** — \"the relaxation time, the average time between successive\n   collisions of an electron with the lattice ions\".\n\n**On Kirchhoff and Wheatstone**\n\n5. **Name the conservation law for each rule.** Junction → charge; loop → energy. This is an explicit\n   mark and takes one line.\n\n6. **Draw the labelled circuit** with the four resistances, the galvanometer and the cell. Label the\n   vertices A, B, C, D and mark the currents I₁, I₂ with arrows. It is worth a mark on its own.\n\n7. **State \"at balance, I_g = 0\"** before writing the loop equations. Everything follows from it.\n\n8. **Say why the null method is accurate:** the balance condition contains neither the emf nor the\n   galvanometer resistance, so the result depends only on detecting zero deflection.\n\n**On temperature dependence**\n\n9. **Reason through ρ = m/(ne²τ), naming which of n and τ changes.** Metals: n constant, τ falls.\n   Semiconductors: n rises sharply, dominating the fall in τ. Simply saying \"metals' resistance\n   increases\" without the mechanism gets about half the marks.\n\n10. **Draw both graphs with labelled axes**, and mark ρ₀ on the metal graph. Two graphs, two marks.\n\n**On cells and circuits**\n\n11. **Distinguish ε from V explicitly.** ε is the open-circuit value; V = ε − Ir when current flows.\n    Questions are set specifically to test whether you conflate them.\n\n12. **For a V–I graph of a cell, the intercept is ε and the slope magnitude is r.** Memorise this\n    pairing — it is one of the most reliable 2-markers in the chapter, and it recurs in case studies.\n\n13. **Check circuit answers with the junction rule.** Branch currents must add to the main current.\n    Twenty seconds, and it catches most arithmetic slips.\n\n14. **A negative branch current is a real answer, not an error** — it means you assumed the wrong\n    direction, and physically that cell is being charged. Say so.\n\n**On numericals**\n\n15. **Choose the right power formula.** I²R when the current is common (series); V²/R when the voltage\n    is common (parallel). And for a bulb operated at the wrong voltage, first find R = V_rated²/P_rated,\n    then use the actual voltage.\n\n16. **Units:** A for current, Ω for resistance, Ω m for resistivity, S m⁻¹ for conductivity,\n    A m⁻² for current density, m² V⁻¹ s⁻¹ for mobility, W for power."}},{"id":"p4","subj":"physics","num":4,"title":"Moving Charges and Magnetism","unit":"Units III+IV · Magnetism, EMI & AC","unitMarks":17,"prio":1,"appear":"Units III + IV (17 marks, shared with Ch 5, 6, 7) · Typical appearance: 1–2 MCQs + a 2/3-mark force or field question, and often a 5-marker on the circular-loop field or the moving-coil galvanometer.","deleted":"- **Cyclotron** — construction, working, and the resonance-frequency derivation\n- **Toroid** — the Ampere's-law application to a toroidal solenoid\n\n> **Two notes on scope.** (i) The cyclotron was a standard 3-mark derivation for years and is now\n> fully out. (ii) The solenoid is listed as **qualitative treatment only** — so know the field\n> pattern and the result B = μ₀nI, but the marks are in describing and using it rather than in a\n> full Ampere's-law derivation. The **long straight wire** is the application that is explicitly\n> named for derivation.","recall":"```\nμ₀ = 4π × 10⁻⁷ T m A⁻¹ ;  μ₀/4π = 10⁻⁷\n\nBIOT–SAVART : dB = (μ₀/4π) I dl sin θ/r² ;  vector (μ₀/4π) I (dl × r̂)/r²\n  circular loop, on axis : B = μ₀IR²/[2(R²+x²)^(3/2)]\n  at centre (N turns)    : B = μ₀NI/(2R)\n  arc of angle θ (rad)   : B = μ₀Iθ/(4πR)\n\nAMPERE : ∮B·dl = μ₀ I_enclosed\n  long straight wire : B = μ₀I/(2πr)      B ∝ 1/r, circular field lines\n  long solenoid      : B = μ₀nI inside (μ₀nI/2 at an end), ≈ 0 outside\n\nMOVING CHARGE : F = q(v × B) = qvB sin θ\n  F ⊥ v always ⟹ NO work done, speed and KE unchanged\n  v ⊥ B : r = mv/(qB) ;  T = 2πm/(qB) ;  f = qB/(2πm)     — T independent of v\n  v at angle θ to B : helical path\n  Lorentz : F = q(E + v × B) ;  velocity selector v = E/B\n\nCONDUCTOR : F = I(l × B) = BIl sin θ      (Fleming's left-hand rule)\n\nPARALLEL WIRES : F/l = μ₀I₁I₂/(2πd)\n  same direction → ATTRACT ;  opposite → REPEL\n  ampere: 2 × 10⁻⁷ N m⁻¹ between wires 1 m apart carrying 1 A each\n\nCURRENT LOOP : m = NIA (A m²) ;  τ = NIAB sin θ = m × B ;  net force = 0\n  τ max when the PLANE of the coil is parallel to B\n\nGALVANOMETER : NIAB = kφ ⟹ φ ∝ I ;  radial field keeps sin θ = 1 (uniform scale)\n  current sensitivity I_s = NAB/k ;  voltage sensitivity V_s = NAB/(kG) = I_s/G\n  → AMMETER  : shunt in PARALLEL,  S = I_g G/(I − I_g) ;  ideal R = 0, in series\n  → VOLTMETER: resistance in SERIES, R = V/I_g − G ;      ideal R = ∞, in parallel\n```","s":{"scope":"### In the syllabus\n\n- Concept of magnetic field; **Oersted's experiment**\n- **Biot–Savart law** and its application to a current-carrying **circular loop**\n- **Ampere's law** and its application to an **infinitely long straight wire**\n- **Straight solenoid** — *qualitative treatment only*\n- **Force on a moving charge** in uniform magnetic and electric fields\n- **Force on a current-carrying conductor** in a uniform magnetic field\n- **Force between two parallel current-carrying conductors** — definition of the **ampere**\n- **Torque** on a current loop in a uniform magnetic field\n- **Moving-coil galvanometer** — current sensitivity, and conversion to an **ammeter** and a\n  **voltmeter**\n\n### Deleted — do not study\n\n- **Cyclotron** — construction, working, and the resonance-frequency derivation\n- **Toroid** — the Ampere's-law application to a toroidal solenoid\n\n> **Two notes on scope.** (i) The cyclotron was a standard 3-mark derivation for years and is now\n> fully out. (ii) The solenoid is listed as **qualitative treatment only** — so know the field\n> pattern and the result B = μ₀nI, but the marks are in describing and using it rather than in a\n> full Ampere's-law derivation. The **long straight wire** is the application that is explicitly\n> named for derivation.\n\n---","brief":"### Oersted's experiment\n\nA compass needle placed near a straight wire deflects when a current flows through the wire, and\nreverses when the current reverses. **Conclusion: a current produces a magnetic field around\nitself** — electricity and magnetism are linked.\n\n### Biot–Savart law\n\nThe magnetic field d**B** at a point due to a small current element I d**l** at distance r:\n\n```\n      dB = (μ₀/4π) · (I dl sin θ)/r²\n```\n\n**Vector form:**\n\n```\n      dB = (μ₀/4π) · I (dl × r̂)/r²\n```\n\nwhere θ is the angle between d**l** and **r**.\n\n```\n      μ₀ = 4π × 10⁻⁷ T m A⁻¹              μ₀/4π = 10⁻⁷ T m A⁻¹\n```\n\n**Direction:** d**B** is perpendicular to the plane containing d**l** and **r**, given by the\nright-hand rule.\n\n**Note:** dB = 0 when θ = 0° or 180° (i.e. at points along the line of the current element), and is\nmaximum when θ = 90°.\n\n**Comparison with Coulomb's law** (a 2-mark \"compare\" question):\n\n| Similarity | Difference |\n| --- | --- |\n| Both are inverse-square laws | Coulomb's field is along the line joining; Biot–Savart's is perpendicular to it |\n| Both obey superposition | Electrostatic field is produced by a scalar (charge); magnetic field by a vector (current element) |\n| Both have a 1/4π constant | A current element cannot exist in isolation; a point charge can |\n\n### Field on the axis of a circular current loop\n\n**This derivation is one of the most-asked 5-markers in the chapter.**\n\nFor a circular loop of radius R carrying current I, at a point on the axis at distance x from the\ncentre:\n\n```\n      B = μ₀ I R² / [ 2 (R² + x²)^(3/2) ]\n```\n\nFor N turns, multiply by N.\n\n**At the centre (x = 0):**\n\n```\n      B = μ₀ N I / (2R)\n```\n\n**Far from the loop (x >> R):**\n\n```\n      B ≈ μ₀ I R²/(2x³) = μ₀ (I A)/(2π x³)          — the field of a magnetic dipole\n```\n\n**Field due to a circular arc** subtending angle θ (in radians) at the centre:\n\n```\n      B = μ₀ I θ / (4π R)\n```\n\n*(Check: for a full circle θ = 2π, giving μ₀I/2R ✓; for a semicircle θ = π, giving μ₀I/4R.)*\n\n### Ampere's circuital law\n\n**Statement.** The line integral of the magnetic field around any closed loop equals μ₀ times the\ntotal current threading that loop.\n\n```\n      ∮ B · dl = μ₀ I_enclosed\n```\n\n**Application — infinitely long straight wire.**\n\n*Amperian loop:* a **circle** of radius r, concentric with the wire and in a plane perpendicular to\nit.\n*Symmetry:* B is tangential to this circle and has the same magnitude everywhere on it, so\n**B**·d**l** = B dl throughout.\n\n```\n      ∮ B · dl = B (2πr)          and          I_enclosed = I\n\n      B (2πr) = μ₀ I\n⟹     B = μ₀ I / (2π r)\n```\n\nSo **B ∝ 1/r**, and the field lines are concentric circles around the wire, with direction given by\nthe **right-hand thumb rule** (thumb along the current, fingers curl in the direction of **B**).\n\n### Solenoid (qualitative)\n\nA long solenoid with n turns per unit length carrying current I has a **uniform** field inside,\nparallel to its axis:\n\n```\n      B = μ₀ n I                    (well inside a long solenoid)\n      B = μ₀ n I / 2                (at either end)\n```\n\nThe field **outside** a long solenoid is very nearly **zero**. The field pattern inside resembles\nthat of a bar magnet, with one end acting as a north pole and the other as a south pole.\n\n### Force on a moving charge — the magnetic Lorentz force\n\n```\n      F = q (v × B)                 magnitude:  F = q v B sin θ\n```\n\n**Key properties (each asked as a 1- or 2-marker):**\n\n- **F = 0** when the charge is at rest (v = 0), or when **v** is **parallel** or antiparallel to **B**\n  (θ = 0° or 180°).\n- **F is maximum** (= qvB) when **v** ⊥ **B**.\n- **F is always perpendicular to v**, so the magnetic force **does no work** on the charge and the\n  **speed (and kinetic energy) never changes**. Only the direction changes.\n\n**Circular motion when v ⊥ B.** The force provides the centripetal force:\n\n```\n      q v B = m v²/r\n⟹     r = m v/(q B)  =  p/(qB)\n\n      Time period  T = 2πm/(qB)                — independent of v and of r\n      Frequency    f = qB/(2πm)\n```\n\nThe independence of T from the speed is the asked fact.\n\n**If v is at an angle θ to B**, the component v cos θ along **B** is unaffected and the component\nv sin θ perpendicular to it produces circular motion — so the path is a **helix**.\n\n**The full Lorentz force** (electric plus magnetic):\n\n```\n      F = q (E + v × B)\n```\n\n**Velocity selector.** With **E** and **B** mutually perpendicular and both perpendicular to **v**,\nthe electric and magnetic forces can be made to balance:\n\n```\n      qE = qvB\n⟹     v = E/B\n```\n\nOnly particles with exactly this speed pass through undeflected, whatever their charge or mass.\n\n### Force on a current-carrying conductor\n\n```\n      F = I (l × B)                 magnitude:  F = B I l sin θ\n```\n\nDirection by **Fleming's left-hand rule** (forefinger = field, middle finger = current, thumb =\nforce) or by the cross product.\n\nF = 0 when the conductor is **parallel** to the field; maximum when perpendicular.\n\n### Force between two parallel current-carrying conductors, and the ampere\n\nTwo long parallel wires a distance d apart, carrying currents I₁ and I₂.\n\nWire 1 produces at wire 2 a field B₁ = μ₀I₁/(2πd). The force on a length l of wire 2 is\n\n```\n      F = B₁ I₂ l = μ₀ I₁ I₂ l/(2π d)\n```\n\nso the **force per unit length** is\n\n```\n      F/l = μ₀ I₁ I₂ / (2π d)\n```\n\n**Direction:** the wires **attract** when the currents are in the **same** direction, and **repel**\nwhen they are in **opposite** directions. (Note this is the reverse of the electrostatic case for\nlike charges — worth remembering as a contrast.)\n\n**Definition of the ampere.** One ampere is that current which, flowing in each of two infinitely\nlong, straight, parallel conductors of negligible cross-section placed 1 m apart in vacuum, produces\na force of **2 × 10⁻⁷ N per metre** of length on each conductor.\n\n*(Check with the formula: F/l = (4π × 10⁻⁷)(1)(1)/(2π × 1) = 2 × 10⁻⁷ N m⁻¹ ✓)*\n\n### Torque on a current loop\n\nA rectangular loop of N turns, area A, carrying current I, in a uniform field B, with its normal at\nangle θ to **B**:\n\n```\n      τ = N I A B sin θ\n```\n\nDefining the **magnetic dipole moment**\n\n```\n      m = N I A                     (a vector along the normal to the loop, unit A m²)\n```\n\nwe can write\n\n```\n      τ = m × B\n```\n\n- τ is **maximum** (= NIAB) when the **plane of the coil is parallel to B** (i.e. the normal is\n  perpendicular to B, θ = 90°).\n- τ is **zero** when the **plane of the coil is perpendicular to B** (normal parallel to B, θ = 0°).\n- The **net force** on the loop in a uniform field is **zero**.\n\n> **The commonest error here** is confusing the angle with the *plane* of the coil and the angle with\n> the *normal*. Read carefully which the question gives, and state which you are using.\n\n### Moving-coil galvanometer\n\n*Construction:* a coil of many turns wound on a soft-iron core, suspended (or pivoted) in a\n**radial magnetic field** produced by concave pole pieces, with a phosphor-bronze suspension\nproviding a restoring torque, and a pointer over a scale.\n\n**Principle.** A current-carrying coil placed in a magnetic field experiences a torque.\n\n**Working.** The deflecting torque on the coil is NIAB. Because the field is **radial**, the plane of\nthe coil is always parallel to **B**, so sin θ = 1 at all deflections and the torque is NIAB\nregardless of the deflection.\n\nThe suspension provides a restoring torque kφ, where k is the torsional constant and φ the\ndeflection. At equilibrium:\n\n```\n      N I A B = k φ\n⟹     φ = (N A B/k) I\n```\n\nSo **φ ∝ I** — the deflection is directly proportional to the current, which is why the scale is\nlinear.\n\n**Why the field must be radial:** so that the coil's plane stays parallel to **B** at all angles,\nmaking the torque independent of the deflection and hence the scale uniform.\n\n**Why a soft-iron core:** it increases the magnetic flux through the coil, and hence the sensitivity;\nit also makes the field more radial.\n\n**Current sensitivity:**\n\n```\n      I_s = φ/I = N A B/k                     unit: div A⁻¹ (or rad A⁻¹)\n```\n\n**Voltage sensitivity:**\n\n```\n      V_s = φ/V = φ/(I G) = N A B/(k G)       where G is the galvanometer resistance\n```\n\nso\n\n```\n      V_s = I_s/G\n```\n\n> **A favourite conceptual question:** \"Increasing the current sensitivity of a galvanometer does not\n> necessarily increase its voltage sensitivity. Why?\" Because increasing N increases I_s = NAB/k, but\n> it also increases the length of wire and hence the coil resistance G — and V_s = I_s/G. If G rises\n> in the same proportion, V_s is unchanged.\n\n### Conversion of a galvanometer\n\n**To an ammeter** — connect a **low resistance (shunt) S in parallel**:\n\n```\n      S = I_g G / (I − I_g)\n```\n\nwhere I_g is the full-scale-deflection current of the galvanometer, G its resistance, and I the\ncurrent the ammeter is to read at full scale.\n\nAn **ideal ammeter has zero resistance**, and is connected in **series** in a circuit.\n\n**To a voltmeter** — connect a **high resistance R in series**:\n\n```\n      R = V/I_g − G\n```\n\nwhere V is the voltage the voltmeter is to read at full scale.\n\nAn **ideal voltmeter has infinite resistance**, and is connected in **parallel** across the component.\n\n### Quick recall box\n\n```\nμ₀ = 4π × 10⁻⁷ T m A⁻¹ ;  μ₀/4π = 10⁻⁷\n\nBIOT–SAVART : dB = (μ₀/4π) I dl sin θ/r² ;  vector (μ₀/4π) I (dl × r̂)/r²\n  circular loop, on axis : B = μ₀IR²/[2(R²+x²)^(3/2)]\n  at centre (N turns)    : B = μ₀NI/(2R)\n  arc of angle θ (rad)   : B = μ₀Iθ/(4πR)\n\nAMPERE : ∮B·dl = μ₀ I_enclosed\n  long straight wire : B = μ₀I/(2πr)      B ∝ 1/r, circular field lines\n  long solenoid      : B = μ₀nI inside (μ₀nI/2 at an end), ≈ 0 outside\n\nMOVING CHARGE : F = q(v × B) = qvB sin θ\n  F ⊥ v always ⟹ NO work done, speed and KE unchanged\n  v ⊥ B : r = mv/(qB) ;  T = 2πm/(qB) ;  f = qB/(2πm)     — T independent of v\n  v at angle θ to B : helical path\n  Lorentz : F = q(E + v × B) ;  velocity selector v = E/B\n\nCONDUCTOR : F = I(l × B) = BIl sin θ      (Fleming's left-hand rule)\n\nPARALLEL WIRES : F/l = μ₀I₁I₂/(2πd)\n  same direction → ATTRACT ;  opposite → REPEL\n  ampere: 2 × 10⁻⁷ N m⁻¹ between wires 1 m apart carrying 1 A each\n\nCURRENT LOOP : m = NIA (A m²) ;  τ = NIAB sin θ = m × B ;  net force = 0\n  τ max when the PLANE of the coil is parallel to B\n\nGALVANOMETER : NIAB = kφ ⟹ φ ∝ I ;  radial field keeps sin θ = 1 (uniform scale)\n  current sensitivity I_s = NAB/k ;  voltage sensitivity V_s = NAB/(kG) = I_s/G\n  → AMMETER  : shunt in PARALLEL,  S = I_g G/(I − I_g) ;  ideal R = 0, in series\n  → VOLTMETER: resistance in SERIES, R = V/I_g − G ;      ideal R = ∞, in parallel\n```\n\n---","pyq":"**Q1.** *(5 marks)* State the Biot–Savart law. Using it, derive an expression for the magnetic field\nat a point on the axis of a circular current-carrying loop. Hence find the field at the centre.\n\n**Q2.** *(3 marks)* State Ampere's circuital law. Use it to derive an expression for the magnetic\nfield due to a long straight current-carrying wire.\n\n**Q3.** *(5 marks)* Draw a labelled diagram of a moving-coil galvanometer. State its principle and\nworking, and derive the relation between the deflection and the current. Why is a radial magnetic\nfield used?\n\n**Q4.** *(3 marks)* Derive an expression for the force per unit length between two long parallel\ncurrent-carrying conductors. Hence define the ampere.\n\n**Q5.** *(3 marks)* Derive an expression for the torque on a current-carrying rectangular loop in a\nuniform magnetic field. When is it maximum and when zero?\n\n**Q6.** *(2 marks)* A charged particle enters a uniform magnetic field perpendicular to it. Show that\nits path is circular, and that the time period is independent of its speed.\n\n**Q7.** *(3 marks)* How is a galvanometer converted into (i) an ammeter and (ii) a voltmeter? Derive\nthe required resistance in each case.\n\n**Q8.** *(2 marks)* Why does the magnetic force do no work on a moving charged particle?\n\n**Q9.** *(2 marks)* Two long parallel wires 20 cm apart carry currents of 5 A and 10 A in the same\ndirection. Find the force per unit length between them, and state whether it is attractive or\nrepulsive.\n\n**Q10.** *(2 marks)* A circular coil of 50 turns and radius 5 cm carries a current of 2 A. Find the\nmagnetic field at its centre.\n\n**Q11.** *(1 mark, MCQ)* The magnetic force on a charge moving parallel to a magnetic field is\n(a) qvB (b) zero (c) qvB sin θ (d) maximum\n\n**Q12.** *(4 marks, case study)* A galvanometer has a resistance of 60 Ω and gives a full-scale\ndeflection for a current of 1 mA.\n(i) How would you convert it into an ammeter reading up to 1 A?\n(ii) How would you convert it into a voltmeter reading up to 5 V?\n(iii) What is the resistance of the ammeter so formed?\n(iv) Why must an ammeter have a low resistance?\n\n**Q13.** *(2 marks)* Increasing the current sensitivity of a galvanometer does not necessarily\nincrease its voltage sensitivity. Explain.\n\n---","sol":"### Q1 — Biot–Savart law and the field on the axis of a circular loop\n\n**Statement of the Biot–Savart law.** The magnitude of the magnetic field d**B** produced at a point\nP by a small current element I d**l** is\n\n- directly proportional to the current I and to the length dl of the element,\n- directly proportional to sin θ, where θ is the angle between d**l** and the line joining the\n  element to P,\n- inversely proportional to the square of the distance r of P from the element.\n\n```\n      dB = (μ₀/4π) · I dl sin θ / r²                 vector form:  dB = (μ₀/4π) I (dl × r̂)/r²\n```\n\nd**B** is directed perpendicular to the plane containing d**l** and **r**.\n\n**Derivation for a circular loop.**\n\n*Diagram:* a circular loop of radius R in the plane of the page seen edge-on, carrying current I.\nP is on the axis at distance x from the centre O. Take two diametrically opposite elements d**l** at\nthe top and bottom. Draw the d**B** vectors from each, and resolve them into components along the\naxis and perpendicular to it.\n\nConsider a current element I d**l** on the loop. Its distance from P is\n\n```\n      r = √(R² + x²)\n```\n\nFor every element on the loop, d**l** is perpendicular to **r** (the element is tangential, **r**\nlies in the plane containing the axis), so θ = 90° and sin θ = 1. Hence\n\n```\n      dB = (μ₀/4π) · I dl / (R² + x²)\n```\n\n**Resolve d**B**.** d**B** is perpendicular to the plane containing d**l** and **r**, so it has:\n\n- a component **along the axis**: dB cos α\n- a component **perpendicular to the axis**: dB sin α\n\nwhere α is the angle between d**B** and the axis, and from the geometry\n\n```\n      cos α = R/√(R² + x²)\n```\n\n**Now use symmetry.** For the diametrically opposite element, the perpendicular component points the\nopposite way. Summing over the whole loop, **all the perpendicular components cancel in pairs**, and\nonly the axial components survive and add.\n\n```\n      B = ∮ dB cos α\n        = ∮ (μ₀/4π) · I dl/(R² + x²) · R/√(R² + x²)\n\n        = (μ₀ I R)/(4π (R² + x²)^(3/2)) ∮ dl\n```\n\nThe integral ∮dl around the loop is its circumference, 2πR:\n\n```\n      B = (μ₀ I R)/(4π (R² + x²)^(3/2)) × 2πR\n```\n\n```\n      B = μ₀ I R² / [ 2 (R² + x²)^(3/2) ]\n```\n\nFor a coil of **N turns**, multiply by N:\n\n```\n      B = μ₀ N I R² / [ 2 (R² + x²)^(3/2) ]\n```\n\n**At the centre**, put x = 0:\n\n```\n      B = μ₀ N I R²/(2R³)  =  μ₀ N I/(2R)\n```\n\nThe direction is along the axis, given by the **right-hand rule** (curl the fingers along the current;\nthe thumb gives **B**). ∎\n\n### Q2 — Ampere's circuital law and the long straight wire\n\n**Statement.** The line integral of the magnetic field **B** around any closed path equals μ₀ times\nthe total current passing through the area enclosed by that path:\n\n```\n      ∮ B · dl = μ₀ I_enclosed\n```\n\n**Derivation for a long straight wire.**\n\n*Diagram:* a long straight vertical wire carrying current I upward, with a circle of radius r drawn\naround it in a horizontal plane, and **B** shown tangential to the circle.\n\n**Choice of Amperian loop, with justification.** Take a circle of radius r centred on the wire, lying\nin a plane perpendicular to it. By the cylindrical symmetry of the problem:\n\n- **B** has the same magnitude at every point of this circle;\n- **B** is **tangential** to the circle at every point, so **B** is parallel to d**l** and\n  **B**·d**l** = B dl.\n\nHence\n\n```\n      ∮ B · dl = B ∮ dl = B (2πr)\n```\n\nThe current enclosed by the loop is I. Applying Ampere's law:\n\n```\n      B (2πr) = μ₀ I\n⟹     B = μ₀ I / (2π r)\n```\n\nSo **B ∝ 1/r**. The field lines are **concentric circles** around the wire, with the sense given by\nthe right-hand thumb rule. ∎\n\n### Q3 — moving-coil galvanometer\n\n*Diagram (label all of these):* a rectangular coil PQRS of N turns wound on a soft-iron core;\nconcave pole pieces N and S of a permanent magnet producing a radial field; a phosphor-bronze strip\nsuspension at the top carrying a mirror or pointer; a spring at the bottom; the scale.\n\n**Principle.** A current-carrying coil placed in a magnetic field experiences a **torque**.\n\n**Working.** Let the coil have N turns, area A, and carry current I in a radial field of magnitude B.\n\nThe **deflecting torque** on the coil is\n\n```\n      τ_deflecting = N I A B sin θ\n```\n\nBecause the field produced by the concave pole pieces is **radial**, the plane of the coil is always\n**parallel to B** whatever the deflection, so θ = 90° and sin θ = 1 throughout. Hence\n\n```\n      τ_deflecting = N I A B\n```\n\nThe suspension provides a **restoring torque** proportional to the deflection φ:\n\n```\n      τ_restoring = k φ\n```\n\nwhere k is the torsional constant of the suspension.\n\nAt equilibrium the two torques balance:\n\n```\n      N I A B = k φ\n```\n\n```\n      φ = (N A B / k) I                    i.e.     φ ∝ I\n```\n\n**The deflection is directly proportional to the current**, which is why the galvanometer has a\n**uniform (linear) scale**.\n\n**Why a radial magnetic field?** So that the plane of the coil remains parallel to **B** at every\ndeflection. This keeps sin θ = 1, making the deflecting torque independent of the deflection, and\nhence making φ strictly proportional to I — giving a **linear scale**. Without a radial field the\nscale would be non-uniform.\n\n**Why a soft-iron core?** It concentrates the magnetic flux through the coil, increasing B and hence\nthe sensitivity, and it also helps make the field radial. ∎\n\n### Q4 — force between parallel currents, and the ampere\n\n*Diagram:* two long parallel vertical wires a distance d apart, carrying currents I₁ and I₂ in the\nsame direction, with the field of wire 1 at wire 2 shown into the page and the resulting force on\nwire 2 shown pointing towards wire 1.\n\nLet two long parallel straight conductors, a distance d apart, carry currents I₁ and I₂.\n\n**Field of wire 1 at the location of wire 2** (using the long-straight-wire result):\n\n```\n      B₁ = μ₀ I₁/(2π d)\n```\n\ndirected perpendicular to wire 2.\n\n**Force on a length l of wire 2**, which carries current I₂ perpendicular to B₁:\n\n```\n      F = B₁ I₂ l sin 90° = B₁ I₂ l\n        = [μ₀ I₁/(2π d)] I₂ l\n```\n\n**Force per unit length:**\n\n```\n      F/l = μ₀ I₁ I₂ / (2π d)\n```\n\nBy Newton's third law, wire 1 experiences an equal and opposite force.\n\n**Direction.** Applying Fleming's left-hand rule: the wires **attract** each other when the currents\nflow in the **same** direction, and **repel** when the currents are in **opposite** directions.\n\n**Definition of the ampere.** Putting I₁ = I₂ = 1 A and d = 1 m:\n\n```\n      F/l = (4π × 10⁻⁷)(1)(1)/(2π × 1) = 2 × 10⁻⁷ N m⁻¹\n```\n\n**One ampere is that steady current which, when flowing in each of two infinitely long, straight,\nparallel conductors of negligible circular cross-section placed 1 metre apart in vacuum, produces a\nforce of 2 × 10⁻⁷ newton per metre of length on each conductor.** ∎\n\n### Q5 — torque on a current loop\n\n*Diagram:* a rectangular loop PQRS of sides l and b in a uniform field **B**, with the normal to the\nloop at angle θ to **B**. Show the forces BIl on the two sides of length l, acting in opposite\ndirections out of and into the plane.\n\nConsider a rectangular loop PQRS with sides of length l and b, carrying current I, placed in a\nuniform field **B**, with the normal to its plane at angle θ to **B**.\n\n**Forces on the sides of length l** (PQ and RS): these sides are perpendicular to **B**, so each\nexperiences a force\n\n```\n      F = B I l\n```\n\nThese two forces are **equal in magnitude and opposite in direction**, but they act along **different\nlines**, so they constitute a **couple**.\n\n**Forces on the sides of length b:** these are equal, opposite, and act along the **same line**, so\nthey cancel completely and produce no torque.\n\n**Torque of the couple** = (force) × (perpendicular distance between the lines of action). From the\ngeometry, that perpendicular distance is b sin θ:\n\n```\n      τ = (B I l)(b sin θ)\n        = B I (l b) sin θ\n        = B I A sin θ                        where A = lb is the area of the loop\n```\n\nFor **N turns:**\n\n```\n      τ = N I A B sin θ\n```\n\nDefining the **magnetic dipole moment m = N I A** (directed along the normal to the loop):\n\n```\n      τ = m × B\n```\n\n**Maximum torque:** when sin θ = 1, i.e. θ = 90° — the normal perpendicular to **B**, which means the\n**plane of the coil is parallel to B**. Then τ_max = NIAB.\n\n**Zero torque:** when θ = 0°, i.e. the normal parallel to **B**, so the **plane of the coil is\nperpendicular to B**. This is the position of stable equilibrium.\n\n**Note:** the **net force** on the loop in a uniform field is **zero** — it experiences a pure couple\nand so rotates without translating. ∎\n\n### Q6 — circular path and speed-independent period\n\nA charge q of mass m enters a uniform field **B** with velocity **v** perpendicular to **B**.\n\n**The force.** F = qvB sin 90° = qvB, and by **F** = q(**v** × **B**) it is **perpendicular to v**.\n\nSince the force is always perpendicular to the velocity, it **changes the direction but never the\nmagnitude** of **v**. A constant-magnitude force always perpendicular to the velocity is exactly a\n**centripetal** force, so the particle moves in a **circle** at constant speed.\n\n**Radius.** Equating the magnetic force to the required centripetal force:\n\n```\n      q v B = m v²/r\n⟹     r = m v/(q B)\n```\n\n**Time period.**\n\n```\n      T = 2πr/v = 2π [m v/(qB)]/v\n⟹     T = 2π m/(q B)\n```\n\n**The speed v has cancelled.** So the time period (and hence the frequency f = qB/2πm) depends only\non the charge-to-mass ratio and the field — **not on the speed**, and not on the radius. A faster\nparticle travels a proportionately larger circle in the same time. ∎\n\n### Q7 — conversion of a galvanometer\n\n*Diagrams:* (i) galvanometer G with a shunt S connected in parallel across it, the pair in series in\nthe circuit; (ii) galvanometer G with a resistance R in series, the pair connected in parallel across\nthe component.\n\n**(i) To an ammeter — connect a low resistance (shunt) in parallel.**\n\nLet the galvanometer have resistance G and give full-scale deflection for current I_g. To make it\nread up to a current I, connect a shunt S in parallel, so that only I_g passes through G and the\nremaining (I − I_g) passes through S.\n\nSince G and S are in parallel, the potential difference across them is the same:\n\n```\n      I_g G = (I − I_g) S\n```\n\n```\n      S = I_g G / (I − I_g)\n```\n\nSince I >> I_g in practice, **S is very small**. The resistance of the ammeter so formed is the\nparallel combination GS/(G + S), which is smaller than S — hence very small, as required.\n\n**(ii) To a voltmeter — connect a high resistance in series.**\n\nTo make the galvanometer read up to a potential difference V, connect a resistance R in series, so\nthat when V is applied across the combination the current through the galvanometer is exactly I_g:\n\n```\n      V = I_g (G + R)\n```\n\n```\n      R = V/I_g − G\n```\n\nSince I_g is very small, **R is very large**. The resistance of the voltmeter so formed is (G + R),\nwhich is very large, as required.\n\n### Q8 — why the magnetic force does no work\n\nThe magnetic force on a moving charge is\n\n```\n      F = q (v × B)\n```\n\nBy the definition of the cross product, **F** is **always perpendicular to v**.\n\nThe work done by a force over a displacement d**s** = **v** dt is\n\n```\n      dW = F · ds = F · v dt\n```\n\nSince **F** ⊥ **v**, the dot product **F**·**v** = 0, so\n\n```\n      dW = 0\n```\n\nHence the magnetic force does **no work** on the charge. Consequently the **kinetic energy and speed\nof the particle remain unchanged** — the magnetic field can change only the **direction** of motion.\n\n### Q9 — force between two parallel wires\n\n```\n      I₁ = 5 A          I₂ = 10 A          d = 20 cm = 0.2 m\n```\n\n```\n      F/l = μ₀ I₁ I₂/(2π d)\n          = (4π × 10⁻⁷)(5)(10)/(2π × 0.2)\n          = (2 × 10⁻⁷)(50)/(0.2)                    [using μ₀/2π = 2 × 10⁻⁷]\n          = (10⁻⁵)/(0.2)\n          = 5 × 10⁻⁵ N m⁻¹\n```\n\n**F/l = 5 × 10⁻⁵ N m⁻¹**, and since the currents are in the **same direction**, the force is\n**attractive**.\n\n### Q10 — field at the centre of a circular coil\n\n```\n      N = 50          R = 5 cm = 0.05 m          I = 2 A\n```\n\n```\n      B = μ₀ N I/(2R)\n        = (4π × 10⁻⁷)(50)(2)/(2 × 0.05)\n        = (4π × 10⁻⁷)(100)/(0.1)\n        = (4π × 10⁻⁵)/(0.1)\n        = 4π × 10⁻⁴\n        = 1.256 × 10⁻³ T\n```\n\n**B ≈ 1.26 × 10⁻³ T** (about 1.26 mT), directed along the axis of the coil.\n\n### Q11 — force on a charge moving parallel to B\n\nF = qvB sin θ with θ = 0°, so sin θ = 0.\n\n**Answer: (b) zero**\n\n### Q12 — case study: galvanometer conversion\n\n```\n      G = 60 Ω          I_g = 1 mA = 10⁻³ A\n```\n\n**(i) Ammeter reading up to I = 1 A** — connect a shunt S in parallel:\n\n```\n      S = I_g G/(I − I_g)\n        = (10⁻³)(60)/(1 − 10⁻³)\n        = 0.06/0.999\n        = 0.06006 Ω\n```\n\n**S ≈ 0.06 Ω, connected in parallel with the galvanometer.**\n\n**(ii) Voltmeter reading up to V = 5 V** — connect a resistance R in series:\n\n```\n      R = V/I_g − G\n        = 5/(10⁻³) − 60\n        = 5000 − 60\n        = 4940 Ω\n```\n\n**R = 4940 Ω, connected in series with the galvanometer.**\n\n**(iii) Resistance of the ammeter** = the parallel combination of G and S:\n\n```\n      R_A = GS/(G + S) = (60)(0.06006)/(60.06006) = 3.6036/60.06 ≈ 0.06 Ω\n```\n\n**R_A ≈ 0.06 Ω** — essentially equal to the shunt, since S << G.\n\n**(iv) Why an ammeter must have low resistance.** An ammeter is connected **in series** in the\ncircuit whose current is being measured. If its resistance were appreciable, it would **increase the\ntotal resistance of the circuit and so reduce the current** — the very quantity it is meant to\nmeasure. A low resistance ensures the ammeter disturbs the circuit as little as possible. (Ideally,\nan ammeter has zero resistance.)\n\n### Q13 — current sensitivity vs voltage sensitivity\n\n```\n      Current sensitivity   I_s = φ/I = N A B/k\n      Voltage sensitivity   V_s = φ/V = N A B/(k G)  =  I_s/G\n```\n\nThe current sensitivity can be increased by increasing the number of turns N. But increasing N also\nincreases the **length of wire in the coil**, and hence the **galvanometer's resistance G**.\n\nSince V_s = I_s/G, if G increases in the **same proportion** as I_s, the voltage sensitivity is\n**unchanged**. So increasing the current sensitivity does **not** necessarily increase the voltage\nsensitivity.\n\n*(To increase V_s specifically, one must increase N, A or B, or reduce k, **without** a proportionate\nincrease in G.)*\n\n---","test":"Time: 55 minutes. Answers below.\n\n1. *(1)* The SI unit of magnetic dipole moment is\n   (a) A m (b) A m² (c) A m⁻² (d) T m²\n2. *(1)* The magnetic field at the centre of a circular coil of radius R with N turns carrying\n   current I is\n   (a) μ₀NI/(2R) (b) μ₀NI/(4πR) (c) μ₀NI/R (d) μ₀I/(2πR)\n3. *(1)* Two parallel wires carrying currents in opposite directions\n   (a) attract (b) repel (c) exert no force (d) rotate\n4. *(2)* A proton moves with speed 2 × 10⁶ m s⁻¹ perpendicular to a field of 0.5 T. Find the force on\n   it. (q = 1.6 × 10⁻¹⁹ C)\n5. *(2)* State the right-hand thumb rule and use it to give the direction of the field around a\n   straight wire.\n6. *(2)* An electron moving with velocity **v** enters a magnetic field **B** parallel to **v**. What\n   is its path?\n7. *(3)* Derive an expression for the radius and time period of a charged particle moving in a\n   circular path in a uniform magnetic field.\n8. *(3)* A wire of length 20 cm carrying 5 A is placed at 30° to a magnetic field of 0.4 T. Find the\n   force on it.\n9. *(3)* State and explain the principle of a velocity selector. Derive the condition for a particle\n   to pass through undeflected.\n10. *(5)* State the Biot–Savart law and use it to find the magnetic field at the centre of a circular\n    coil of radius R carrying current I. A coil of 100 turns and radius 10 cm carries 1 A; find B at\n    the centre.\n11. *(3)* A galvanometer of resistance 40 Ω gives full-scale deflection for 5 mA. Convert it into\n    (i) an ammeter of range 2 A and (ii) a voltmeter of range 10 V.\n12. *(2)* Why is the magnetic field inside a long solenoid uniform, and what is its value?\n13. *(2)* A current loop of area 0.02 m² carrying 3 A is placed in a field of 0.5 T with its plane\n    parallel to the field. Find the torque on it.\n\n### Answer key\n\n**1. (b) A m².**\n\n**2. (a) μ₀NI/(2R).**\n\n**3. (b) repel.**\n\n**4. 1.6 × 10⁻¹³ N.** F = qvB sin 90° = (1.6 × 10⁻¹⁹)(2 × 10⁶)(0.5) = 1.6 × 10⁻¹³ N.\n\n**5.** **Right-hand thumb rule:** if the wire is grasped in the right hand with the **thumb pointing\nalong the direction of the current**, then the **curled fingers give the direction of the magnetic\nfield lines**, which are concentric circles around the wire.\n\n**6. A straight line** — the force is F = qvB sin 0° = 0, so the electron continues undeflected with\nunchanged velocity.\n\n**7.** Since **v** ⊥ **B**, the force qvB is perpendicular to **v** and provides the centripetal\nforce: qvB = mv²/r, giving **r = mv/(qB)**. Then T = 2πr/v = 2πm/(qB), so **T = 2πm/(qB)** —\nindependent of the speed. ∎\n\n**8. 0.2 N.** F = BIl sin θ = (0.4)(5)(0.2)(sin 30°) = (0.4)(5)(0.2)(0.5) = 0.2 N.\n\n**9.** A velocity selector has mutually perpendicular electric and magnetic fields, both\nperpendicular to the beam, arranged so that the electric force qE and the magnetic force qvB act in\n**opposite** directions. A particle passes undeflected when the two balance:\nqE = qvB, so **v = E/B**. Only particles with this speed pass through undeflected — and the condition\nis independent of the particle's charge and mass, so it selects by **speed** alone.\n\n**10.** Statement and derivation as in §3 Q1, giving B = μ₀NI/(2R).\nNumerically: B = (4π × 10⁻⁷)(100)(1)/(2 × 0.1) = (4π × 10⁻⁵)/(0.2) = 2π × 10⁻⁴ ≈\n**6.28 × 10⁻⁴ T**.\n\n**11.** (i) S = I_gG/(I − I_g) = (5 × 10⁻³)(40)/(2 − 5 × 10⁻³) = 0.2/1.995 ≈ **0.1003 Ω** in parallel.\n(ii) R = V/I_g − G = 10/(5 × 10⁻³) − 40 = 2000 − 40 = **1960 Ω** in series.\n\n**12.** In a long solenoid the fields of the individual closely-wound turns **add** along the axis and\nlargely **cancel** outside, and away from the ends the contributions from turns on either side make\nthe axial field the same at all interior points — so **B** is uniform, parallel to the axis, with\nmagnitude **B = μ₀nI** (n = turns per unit length). The field outside is nearly zero.\n\n**13. 0.03 N m.** With the plane parallel to **B**, the normal is perpendicular to **B**, so θ = 90°\nand the torque is maximum: τ = NIAB sin 90° = (1)(3)(0.02)(0.5) = 0.03 N m.\n\n**Scoring.** Out of 30. Below 21 → the circular-loop derivation and the galvanometer are where the\n5-marks are. Write both out with diagrams from memory before moving to Ch 5.\n\n---","tips":"**On the circular-loop derivation**\n\n1. **Draw the loop, the axial point P, and a pair of diametrically opposite current elements**, with\n   their d**B** vectors resolved into axial and perpendicular components. Without this diagram the\n   symmetry argument cannot be followed, and the diagram is a mark in its own right.\n\n2. **State that θ = 90° for every element** (d**l** is always perpendicular to **r**). This is what\n   lets you drop sin θ, and it is a mark.\n\n3. **State the symmetry cancellation explicitly:** \"the components perpendicular to the axis cancel\n   in pairs for diametrically opposite elements, so only the axial components add.\" This sentence is\n   the heart of the derivation.\n\n4. **Show ∮dl = 2πR** as its own step.\n\n5. **Finish with the x = 0 special case** — the question almost always asks for the field at the\n   centre as well.\n\n**On Ampere's law**\n\n6. **Choose and justify the Amperian loop.** \"By symmetry, B is tangential and constant in magnitude\n   on a circle of radius r centred on the wire.\" That justification is a mark.\n\n7. **State the direction and the field pattern** — concentric circles, right-hand thumb rule.\n\n**On the galvanometer**\n\n8. **The diagram must be labelled**: coil, soft-iron core, concave pole pieces, suspension, pointer,\n   scale. It carries 1–2 marks of the 5.\n\n9. **Explain the radial field.** \"The field is radial, so the plane of the coil is always parallel to\n   B and sin θ = 1, making the torque independent of deflection and the scale uniform.\" This is the\n   most-asked sub-part in the chapter.\n\n10. **For conversions, write the physical arrangement in words as well as the formula.** \"A low\n    resistance (shunt) is connected in **parallel** with the galvanometer.\" Both the arrangement and\n    the derivation are marked.\n\n11. **Give the reason for low/high resistance.** Ammeter in series, so it must have low resistance to\n    avoid changing the circuit current. Voltmeter in parallel, so it must have high resistance to\n    avoid drawing appreciable current.\n\n**On force questions**\n\n12. **Say which rule you used for direction** — Fleming's left-hand rule, or the cross product. And\n    state the direction in words (\"attractive\", \"into the page\", \"along the axis\").\n\n13. **Watch the angle.** For a current loop, τ = NIAB sin θ where θ is between the **normal** and\n    **B**. If the question gives the angle with the **plane**, convert. State which you are using.\n\n14. **For F = qvB sin θ, check the θ = 0 case first.** If the velocity is parallel to the field, the\n    answer is zero and there is nothing else to do — that is an entire 1-mark question.\n\n**On numericals**\n\n15. **Use μ₀/4π = 10⁻⁷ and μ₀/2π = 2 × 10⁻⁷.** Much faster than carrying 4π × 10⁻⁷ through the\n    arithmetic.\n\n16. **Convert cm to m before substituting**, and note that radius, not diameter, goes into the loop\n    formulas. Units: T for field, N for force, N m⁻¹ for force per length, A m² for dipole moment,\n    N m for torque."}},{"id":"p5","subj":"physics","num":5,"title":"Magnetism and Matter","unit":"Units III+IV · Magnetism, EMI & AC","unitMarks":17,"prio":3,"appear":"Units III + IV (17 marks, shared with Ch 4, 6, 7) · Typical appearance: one 1-mark MCQ, sometimes a 2-mark question on Earth's magnetic elements or material types. Rarely more.","deleted":"- **Magnetic susceptibility** (χ) and **permeability** (μ, μ_r), and the relations between them\n- **Magnetisation** M and magnetic intensity H, and the relation B = μ₀(H + M)\n- **Hysteresis** loops, retentivity, coercivity\n- **Electromagnets**, the factors affecting their strength, and **permanent magnets**\n- **Magnetic dipole moment of a revolving electron**\n- Magnetic field of a **bar magnet** along its **axial** and **equatorial** lines (the analogue of the\n  electric dipole formulas)\n- Tangent galvanometer; oscillation-of-a-magnet timing experiments\n\n> **A note on scope, honestly stated.** This chapter's syllabus line has been trimmed more than once,\n> and different publishers disagree about exactly what survived. What is certain: the whole\n> **quantitative magnetic-materials** block (χ, μ_r, M, H, hysteresis, electromagnets) is out, and\n> so are the bar-magnet axial/equatorial field formulas. What is certain to *stay*: bar magnet as an\n> equivalent solenoid, field lines, and Earth's magnetism.\n>\n> **Practical advice:** learn the short retained list properly, know τ = **m** × **B** and the\n> qualitative material table, and do **not** invest time in χ, μ_r or hysteresis. Then check the\n> current year's CBSE syllabus PDF to confirm. Given the chapter is worth roughly 1–3 marks, this is\n> not a place to spend more effort than that.","recall":"```\nFIELD LINES: continuous CLOSED loops ; N→S outside, S→N inside ; never intersect\n∮B·dA = 0  ⟹  no magnetic monopoles exist        (contrast: ∮E·dA = q/ε₀)\n\nBAR MAGNET ≡ SOLENOID\n  m = NIA for a solenoid ;  m = q_m × 2l for a bar magnet, directed S → N inside\n  cutting a magnet gives TWO complete magnets — an isolated pole is impossible\n\nDIPOLE IN A FIELD: τ = mB sin θ = m × B ;  net force = 0 in a uniform field\n  U = −mB cos θ = −m·B ;  stable at θ = 0°, unstable at 180°\n  W(θ₁ → θ₂) = mB(cos θ₁ − cos θ₂)\n\nEARTH'S MAGNETIC ELEMENTS: declination, dip (δ), horizontal component (B_H)\n  B_H = B cos δ        B_V = B sin δ\n  tan δ = B_V/B_H      B = √(B_H² + B_V²)\n  magnetic equator: δ = 0°, B = B_H     magnetic poles: δ = 90°, B = B_V\n  Earth's magnetic SOUTH pole is near the geographic NORTH\n\nMATERIALS: dia — weakly REPELLED, no net atomic moment\n           para — weakly ATTRACTED, random permanent moments, T-dependent\n           ferro — STRONGLY attracted, domains, loses it above the Curie temperature\n```","s":{"scope":"### In the syllabus\n\nThe official CBSE line for this chapter is short:\n\n- **Bar magnet as an equivalent solenoid**; **magnetic field lines**\n- **Earth's magnetic field and magnetic elements**\n\nAlongside these, two things are routinely examined at 1–2 mark level and cost almost nothing to\nlearn, so they are included below:\n\n- **Torque on a magnetic dipole**, τ = **m** × **B** — this is the same physics as *torque on a\n  current loop*, which is explicitly in [Ch 4](04-moving-charges-and-magnetism.md)\n- The **qualitative** comparison of **para-, dia- and ferromagnetic** substances\n\n### Deleted — do not study\n\n- **Magnetic susceptibility** (χ) and **permeability** (μ, μ_r), and the relations between them\n- **Magnetisation** M and magnetic intensity H, and the relation B = μ₀(H + M)\n- **Hysteresis** loops, retentivity, coercivity\n- **Electromagnets**, the factors affecting their strength, and **permanent magnets**\n- **Magnetic dipole moment of a revolving electron**\n- Magnetic field of a **bar magnet** along its **axial** and **equatorial** lines (the analogue of the\n  electric dipole formulas)\n- Tangent galvanometer; oscillation-of-a-magnet timing experiments\n\n> **A note on scope, honestly stated.** This chapter's syllabus line has been trimmed more than once,\n> and different publishers disagree about exactly what survived. What is certain: the whole\n> **quantitative magnetic-materials** block (χ, μ_r, M, H, hysteresis, electromagnets) is out, and\n> so are the bar-magnet axial/equatorial field formulas. What is certain to *stay*: bar magnet as an\n> equivalent solenoid, field lines, and Earth's magnetism.\n>\n> **Practical advice:** learn the short retained list properly, know τ = **m** × **B** and the\n> qualitative material table, and do **not** invest time in χ, μ_r or hysteresis. Then check the\n> current year's CBSE syllabus PDF to confirm. Given the chapter is worth roughly 1–3 marks, this is\n> not a place to spend more effort than that.\n\n---","brief":"### Magnetic field lines — properties\n\n1. They form **continuous closed loops** — unlike electric field lines, which start and end on\n   charges.\n2. Outside a magnet they run from the **north pole to the south pole**; **inside** the magnet they run\n   from **south to north**, completing the loop.\n3. The **tangent** at any point gives the direction of **B** there.\n4. **Two field lines never intersect** (otherwise **B** would have two directions at one point).\n5. Their **density** indicates the field strength.\n\n**Gauss's law for magnetism:**\n\n```\n      ∮ B · dA = 0\n```\n\nThe net magnetic flux through any closed surface is **always zero**. Physically: **isolated magnetic\npoles (magnetic monopoles) do not exist** — every field line that enters a closed surface also leaves\nit. This is the fundamental contrast with electrostatics, where ∮**E**·d**A** = q/ε₀ can be non-zero.\n\n### Bar magnet as an equivalent solenoid\n\nA **current-carrying solenoid** and a **bar magnet** produce essentially identical external field\npatterns. This is the basis for treating a bar magnet as a magnetic dipole.\n\n**The argument:** each turn of a solenoid is a small current loop, and a current loop is a magnetic\ndipole of moment m = IA. A solenoid is therefore a stack of such dipoles, giving a net dipole moment\nalong its axis — exactly like a bar magnet, whose atomic current loops (electron orbits and spins)\nalign to give a net moment.\n\nFor a solenoid of N turns, length 2l, radius a, carrying current I, the field at an axial point far\naway (r >> l) is\n\n```\n      B = (μ₀/4π) · 2m/r³               where  m = N I A = N I (πa²)\n```\n\nwhich is identical in form to the axial field of a bar magnet of moment m. Hence a bar magnet\nbehaves as an **equivalent solenoid**.\n\n**Consequences that get asked:**\n\n- A bar magnet's poles are not isolated points; **cutting a bar magnet in two gives two complete\n  magnets**, each with a north and a south pole. You can never obtain an isolated pole.\n- The **magnetic dipole moment** of a bar magnet is m = q_m × 2l (pole strength × length), directed\n  from S to N inside the magnet.\n\n### Torque on a magnetic dipole in a uniform field\n\n```\n      τ = m B sin θ                 vector form:  τ = m × B\n```\n\n- **Net force** on the dipole in a **uniform** field is **zero**; only a torque acts.\n- τ is **maximum** (= mB) at θ = 90°, and **zero** at θ = 0° and 180°.\n- **Potential energy:** U = −mB cos θ = −**m**·**B**.\n  Stable equilibrium at θ = 0° (aligned with the field); unstable at θ = 180°.\n- **Work done in rotating** from θ₁ to θ₂: W = mB(cos θ₁ − cos θ₂).\n\n*(Note this is exactly the electric-dipole result of\n[Ch 2](02-electrostatic-potential-and-capacitance.md) with p → m and E → B. Learn one, get both.)*\n\n### Earth's magnetic field and magnetic elements\n\nThe Earth behaves approximately as a giant **magnetic dipole** whose axis is tilted about 11° to its\nrotational axis. Its **magnetic south pole** lies near the **geographic north** — which is why a\ncompass needle's north pole points north.\n\nThe Earth's field at a place is specified by **three magnetic elements**:\n\n**1. Declination (θ or D).** The angle between the **geographic meridian** (the vertical plane\ncontaining the geographic north–south line) and the **magnetic meridian** (the vertical plane\ncontaining the magnetic field direction).\n\n**2. Dip / inclination (δ or I).** The angle that the Earth's total field **B** makes with the\n**horizontal** at that place.\n\n**3. Horizontal component (B_H).** The horizontal component of the Earth's field, i.e. the component\nalong the magnetic meridian.\n\n**The relations — this is the examinable content:**\n\n```\n      B_H = B cos δ\n      B_V = B sin δ\n      tan δ = B_V/B_H\n      B = √(B_H² + B_V²)\n```\n\n**Special values:**\n\n| Place | Dip δ | Notes |\n| --- | --- | --- |\n| **Magnetic equator** | 0° | B_V = 0, so B = B_H — the field is entirely horizontal; a dip needle stays horizontal |\n| **Magnetic poles** | 90° | B_H = 0, so B = B_V — the field is entirely vertical; a compass needle is useless |\n| Intermediate latitudes | 0° < δ < 90° | both components present |\n\n> **The standard question** is \"at a place the dip is 30° and the horizontal component is\n> 0.34 × 10⁻⁴ T; find the total field and the vertical component.\" It is one line each from the\n> relations above.\n\n### Para-, dia- and ferromagnetic substances (qualitative)\n\n| | **Diamagnetic** | **Paramagnetic** | **Ferromagnetic** |\n| --- | --- | --- | --- |\n| Behaviour in a field | **weakly repelled** | **weakly attracted** | **strongly attracted** |\n| Net atomic dipole moment | **zero** | small, non-zero, randomly oriented | non-zero, aligned in domains |\n| In a non-uniform field | moves from strong to **weak** field | moves from weak to **strong** field | moves strongly to the **strong** field |\n| Field lines | tend to be **expelled** from the material | slightly **concentrated** in it | strongly **concentrated** in it |\n| Effect of temperature | almost none | magnetisation decreases as T rises | loses ferromagnetism above the **Curie temperature** |\n| Examples | bismuth, copper, water, gold, mercury | aluminium, sodium, oxygen, platinum | iron, cobalt, nickel, gadolinium |\n\n**The mechanism, in one line each:**\n- **Diamagnetic:** atoms have no net moment; an applied field *induces* a moment that **opposes** it\n  (Lenz's law at the atomic level), so the substance is repelled.\n- **Paramagnetic:** atoms have permanent moments that are randomly oriented; an applied field\n  **partially aligns** them, so the substance is weakly attracted. Thermal agitation opposes this\n  alignment, hence the temperature dependence.\n- **Ferromagnetic:** atomic moments are already aligned within **domains**; an applied field aligns\n  whole domains, giving a very strong effect.\n\n### Quick recall box\n\n```\nFIELD LINES: continuous CLOSED loops ; N→S outside, S→N inside ; never intersect\n∮B·dA = 0  ⟹  no magnetic monopoles exist        (contrast: ∮E·dA = q/ε₀)\n\nBAR MAGNET ≡ SOLENOID\n  m = NIA for a solenoid ;  m = q_m × 2l for a bar magnet, directed S → N inside\n  cutting a magnet gives TWO complete magnets — an isolated pole is impossible\n\nDIPOLE IN A FIELD: τ = mB sin θ = m × B ;  net force = 0 in a uniform field\n  U = −mB cos θ = −m·B ;  stable at θ = 0°, unstable at 180°\n  W(θ₁ → θ₂) = mB(cos θ₁ − cos θ₂)\n\nEARTH'S MAGNETIC ELEMENTS: declination, dip (δ), horizontal component (B_H)\n  B_H = B cos δ        B_V = B sin δ\n  tan δ = B_V/B_H      B = √(B_H² + B_V²)\n  magnetic equator: δ = 0°, B = B_H     magnetic poles: δ = 90°, B = B_V\n  Earth's magnetic SOUTH pole is near the geographic NORTH\n\nMATERIALS: dia — weakly REPELLED, no net atomic moment\n           para — weakly ATTRACTED, random permanent moments, T-dependent\n           ferro — STRONGLY attracted, domains, loses it above the Curie temperature\n```\n\n---","pyq":"**Q1.** *(2 marks)* Define the magnetic elements of the Earth at a place. Write the relation between\nthe dip, the horizontal component and the total field.\n\n**Q2.** *(2 marks)* At a certain place the horizontal component of the Earth's magnetic field is\n0.34 × 10⁻⁴ T and the angle of dip is 30°. Find the total intensity of the Earth's field and its\nvertical component.\n\n**Q3.** *(3 marks)* Explain why a bar magnet may be regarded as an equivalent solenoid. What does\nthis imply about isolated magnetic poles?\n\n**Q4.** *(2 marks)* State any three properties of magnetic field lines. How do they differ from\nelectric field lines?\n\n**Q5.** *(2 marks)* Write Gauss's law for magnetism and state its physical significance.\n\n**Q6.** *(3 marks)* Distinguish between diamagnetic, paramagnetic and ferromagnetic substances,\ngiving one example of each.\n\n**Q7.** *(2 marks)* A bar magnet of magnetic moment 0.5 A m² is placed at 60° to a uniform field of\n0.2 T. Find the torque acting on it.\n\n**Q8.** *(2 marks)* What is the angle of dip at the magnetic equator and at the magnetic poles?\nJustify.\n\n**Q9.** *(1 mark, MCQ)* The net magnetic flux through any closed surface is\n(a) q/ε₀ (b) μ₀I (c) zero (d) BA\n\n**Q10.** *(2 marks)* A bar magnet is cut into two equal halves perpendicular to its length. What\nhappens to its magnetic dipole moment? Explain.\n\n**Q11.** *(1 mark, Assertion–Reason)*\n**A:** A ferromagnetic substance loses its ferromagnetic properties above a certain temperature.\n**R:** Thermal agitation destroys the alignment of domains above the Curie temperature.\n\n**Q12.** *(2 marks)* Find the work done in rotating a magnet of dipole moment 2 A m² from a position\nparallel to a field of 0.5 T to a position antiparallel to it.\n\n---","sol":"### Q1 — magnetic elements of the Earth\n\nThe Earth's magnetic field at a place is completely specified by three quantities, the **magnetic\nelements**:\n\n**1. Magnetic declination** — the angle between the **geographic meridian** and the **magnetic\nmeridian** at that place. (Equivalently, the angle by which a compass needle deviates from the true\ngeographic north–south direction.)\n\n**2. Angle of dip (inclination)** — the angle δ that the Earth's total magnetic field **B** makes\nwith the **horizontal direction** at that place.\n\n**3. Horizontal component** B_H — the component of the Earth's total field in the horizontal\ndirection, along the magnetic meridian.\n\n**Relations:**\n\n```\n      B_H = B cos δ                 B_V = B sin δ\n\n      tan δ = B_V/B_H               B = √(B_H² + B_V²)\n```\n\n### Q2 — total field and vertical component\n\n```\n      B_H = 0.34 × 10⁻⁴ T           δ = 30°\n```\n\n**Total field:**\n\n```\n      B_H = B cos δ\n⟹     B = B_H/cos δ = (0.34 × 10⁻⁴)/cos 30°\n        = (0.34 × 10⁻⁴)/(0.866)\n        = 3.93 × 10⁻⁵ T\n```\n\n**B ≈ 3.93 × 10⁻⁵ T = 0.393 × 10⁻⁴ T**\n\n**Vertical component:**\n\n```\n      B_V = B sin δ = (3.93 × 10⁻⁵)(0.5) = 1.96 × 10⁻⁵ T\n```\n\n**B_V ≈ 1.96 × 10⁻⁵ T = 0.196 × 10⁻⁴ T**\n\n*(Check with tan δ = B_V/B_H: (1.96 × 10⁻⁵)/(3.4 × 10⁻⁵) = 0.577 = tan 30° ✓)*\n\n*(Alternatively and more directly: B_V = B_H tan δ = (0.34 × 10⁻⁴)(0.577) = 1.96 × 10⁻⁵ T.)*\n\n### Q3 — bar magnet as an equivalent solenoid\n\n*Diagram:* draw a bar magnet with its external field lines, and beside it a current-carrying solenoid\nwith its external field lines — showing that the two patterns are identical, with one end of the\nsolenoid behaving as a north pole and the other as a south pole.\n\n**The reasoning.**\n\nA **single current loop** is a magnetic dipole, of moment m = IA directed along its normal.\n\nA **solenoid** is a stack of many such closely-wound loops, all carrying the same current in the same\nsense. Their dipole moments therefore all point the same way, along the solenoid's axis, and add to\ngive a net moment\n\n```\n      m = N I A\n```\n\nfor N turns of area A. The **external field pattern** of a solenoid is found experimentally — and\ncan be shown by calculation — to be identical in form to that of a bar magnet: field lines emerge\nfrom one end (behaving as a **north pole**) and re-enter at the other (a **south pole**).\n\nQuantitatively, for a solenoid of N turns and half-length l, at an axial point far away (r >> l):\n\n```\n      B = (μ₀/4π) · 2m/r³\n```\n\nwhich has **exactly the same form** as the axial field of a magnetic dipole of moment m. Hence a bar\nmagnet can be regarded as an equivalent solenoid.\n\n**Physical basis.** In a bar magnet, the magnetism arises from the **atomic current loops** — the\norbital motion and spin of electrons — each of which is a tiny magnetic dipole. When these align, as\nthey do in a ferromagnet, their combined effect is that of a solenoid.\n\n**Implication for isolated poles.** Since a magnet's magnetism arises from **current loops**, and a\ncurrent loop has no isolated poles, **an isolated magnetic pole cannot exist**. Cutting a bar magnet\nin two does not separate a north pole from a south pole — it simply produces **two complete magnets**,\neach with its own north and south pole. This is consistent with Gauss's law for magnetism,\n∮**B**·d**A** = 0.\n\n### Q4 — properties of magnetic field lines, and the contrast with electric\n\n**Properties (any three):**\n\n1. Magnetic field lines form **continuous closed loops**.\n2. Outside a magnet they run from the **north pole to the south pole**; **inside** the magnet, from\n   **south to north**.\n3. **Two field lines never intersect** — otherwise the field would have two directions at one point.\n4. The **tangent** at any point gives the direction of **B**; the **density** of lines indicates its\n   magnitude.\n\n**Difference from electric field lines.**\n\n| Magnetic field lines | Electric field lines |\n| --- | --- |\n| Form **closed loops** | **Start** on positive charges and **end** on negative charges — they are not closed |\n| ∮**B**·d**A** = 0 always — no monopoles | ∮**E**·d**A** = q/ε₀ — isolated charges exist |\n\n### Q5 — Gauss's law for magnetism\n\n```\n      ∮ B · dA = 0\n```\n\n**Statement:** the net magnetic flux through any **closed** surface is always **zero**.\n\n**Physical significance:** it expresses the fact that **isolated magnetic poles (magnetic monopoles)\ndo not exist**. Because magnetic field lines are closed loops, every line that enters a closed\nsurface must also leave it, so the inward and outward fluxes cancel exactly.\n\nThis is the fundamental difference from electrostatics: there, ∮**E**·d**A** = q_enclosed/ε₀ can be\nnon-zero, because isolated electric charges do exist.\n\n### Q6 — distinguishing the three types of magnetic substance\n\n| Property | Diamagnetic | Paramagnetic | Ferromagnetic |\n| --- | --- | --- | --- |\n| **Behaviour in a magnetic field** | weakly **repelled** | weakly **attracted** | **strongly attracted** |\n| **Net atomic magnetic moment** | **zero** | small and non-zero, but randomly oriented | non-zero and aligned within domains |\n| **Effect of temperature** | essentially none | magnetisation falls as temperature rises | loses ferromagnetism above the **Curie temperature** |\n| **Example** | bismuth (also copper, water) | aluminium (also sodium, oxygen) | iron (also cobalt, nickel) |\n\n*(Note the table compares the **same** property on each row — that is what the marking scheme wants.\nThree properly parallel rows plus examples is a full 3-mark answer.)*\n\n### Q7 — torque on a bar magnet\n\n```\n      m = 0.5 A m²          B = 0.2 T          θ = 60°\n```\n\n```\n      τ = m B sin θ\n        = (0.5)(0.2)(sin 60°)\n        = (0.1)(0.866)\n        = 0.0866 N m\n```\n\n**τ ≈ 8.66 × 10⁻² N m**, directed perpendicular to the plane containing **m** and **B**.\n\n### Q8 — dip at the equator and at the poles\n\n**At the magnetic equator, δ = 0°.**\n\nThe Earth's field there is entirely **horizontal**, so the vertical component B_V = 0. Since\ntan δ = B_V/B_H = 0, we get δ = 0°. A dip needle placed at the magnetic equator therefore rests\n**horizontally**, and B = B_H.\n\n**At the magnetic poles, δ = 90°.**\n\nThere the field is entirely **vertical**, so the horizontal component B_H = 0. Since\ntan δ = B_V/B_H → ∞, we get δ = 90°. A dip needle at a magnetic pole stands **vertically**, and\nB = B_V. (This is also why an ordinary compass, which relies on B_H, is useless near the magnetic\npoles.)\n\n### Q9 — net magnetic flux through a closed surface\n\n**Answer: (c) zero**\n\nThis is Gauss's law for magnetism, and it reflects the non-existence of magnetic monopoles.\n\n### Q10 — bar magnet cut in half perpendicular to its length\n\n*(Cut perpendicular to the length, i.e. across the magnet, halving its length.)*\n\nThe pole strength q_m depends on the **cross-sectional area**, which is **unchanged** by this cut. The\nlength, however, is **halved**: 2l → l.\n\nSince m = q_m × (length),\n\n```\n      m′ = q_m × l = m/2\n```\n\n**The magnetic dipole moment of each half is halved.**\n\nEach piece is still a **complete magnet**, with its own north and south pole — you do not obtain\nisolated poles.\n\n*(Contrast: if the magnet were cut **along** its length instead, the length would be unchanged but\nthe cross-sectional area would be halved, so the pole strength — and hence the moment — would also\nbe halved. Both cuts halve m, but for different reasons; read which cut the question specifies.)*\n\n### Q11 — Assertion–Reason\n\n**A:** \"A ferromagnetic substance loses its ferromagnetic properties above a certain temperature.\"\n**True** — above the **Curie temperature** a ferromagnet becomes paramagnetic.\n\n**R:** \"Thermal agitation destroys the alignment of domains above the Curie temperature.\" **True** —\nthat is the mechanism.\n\n**Does R explain A?** Yes. Ferromagnetism depends on the alignment of magnetic domains; when thermal\nenergy exceeds the energy holding the domains aligned, the alignment is destroyed and the strong\nmagnetism disappears.\n\n**Answer: (a) Both A and R are true, and R is the correct explanation of A.**\n\n### Q12 — work done in rotating a magnet from parallel to antiparallel\n\n```\n      m = 2 A m²          B = 0.5 T          θ₁ = 0°          θ₂ = 180°\n```\n\n```\n      W = m B (cos θ₁ − cos θ₂)\n        = (2)(0.5)(cos 0° − cos 180°)\n        = (1)(1 − (−1))\n        = 2 J\n```\n\n**W = 2 J**\n\n*(This is the maximum possible work for this magnet and field — it takes the dipole from stable\nequilibrium, U = −mB = −1 J, to unstable equilibrium, U = +mB = +1 J, a change of 2 J ✓)*\n\n---","test":"Time: 25 minutes. Answers below.\n\n1. *(1)* The angle of dip at the magnetic equator is\n   (a) 0° (b) 45° (c) 90° (d) 11°\n2. *(1)* Which of the following is diamagnetic?\n   (a) iron (b) aluminium (c) bismuth (d) nickel\n3. *(1)* The SI unit of magnetic dipole moment is\n   (a) A m (b) A m² (c) T (d) Wb\n4. *(2)* Write two properties in which magnetic field lines differ from electric field lines.\n5. *(2)* At a place the vertical and horizontal components of the Earth's field are equal. Find the\n   angle of dip.\n6. *(2)* Why does a compass needle fail to work near the magnetic poles of the Earth?\n7. *(2)* A magnet of moment 1.5 A m² is held at 90° to a field of 0.4 T. Find the torque, and the work\n   done in bringing it to the aligned position.\n8. *(3)* Explain, in terms of atomic magnetic moments, why a diamagnetic substance is repelled and a\n   paramagnetic substance is attracted by a magnetic field.\n9. *(2)* State Gauss's law for magnetism and explain what it implies.\n10. *(2)* The horizontal component of the Earth's field at a place is 0.3 × 10⁻⁴ T and the dip is 60°.\n    Find the total field.\n11. *(2)* A bar magnet is cut into three equal pieces perpendicular to its length. What is the dipole\n    moment of each piece, in terms of the original m?\n\n### Answer key\n\n**1. (a) 0°.**\n\n**2. (c) bismuth.**\n\n**3. (b) A m².**\n\n**4.** (i) Magnetic field lines form **closed loops**, whereas electric field lines **begin and end on\ncharges**. (ii) The net magnetic flux through any closed surface is always **zero** (no monopoles),\nwhereas the net electric flux equals q_enclosed/ε₀ and can be non-zero.\n\n**5. 45°.** tan δ = B_V/B_H = 1, so δ = 45°.\n\n**6.** A compass needle aligns with the **horizontal component** B_H of the Earth's field. At the\nmagnetic poles the field is entirely vertical, so **B_H = 0** and there is no horizontal component to\nalign with — the needle has no preferred horizontal direction and the compass is useless.\n\n**7. τ = 0.6 N m; W = −0.6 J (i.e. 0.6 J is released).**\nτ = mB sin 90° = (1.5)(0.4)(1) = 0.6 N m.\nW = mB(cos θ₁ − cos θ₂) = (0.6)(cos 90° − cos 0°) = (0.6)(0 − 1) = −0.6 J.\nThe negative sign means the field does the work — the magnet moves *towards* stable equilibrium\nspontaneously, releasing 0.6 J.\n\n**8.** **Diamagnetic:** the atoms have **no net magnetic moment**. When an external field is applied,\nit induces a moment in each atom that **opposes** the applied field (an atomic-scale expression of\nLenz's law). The induced moments therefore experience a force pushing the material towards the\n**weaker** part of the field — the substance is **repelled**.\n**Paramagnetic:** the atoms have **permanent** magnetic moments, but these are **randomly oriented**\nby therm
