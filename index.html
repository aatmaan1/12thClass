3D question is therefore out of syllabus. If your\npractice source asks for a plane, it is stale.\n\nWhat replaced that weight is more questions on lines: skew-line distance, foot of perpendicular, and\nimage of a point are now the standard 5-mark candidates.\n\n---\n\n## Unit V — Linear Programming (5 marks)\n\n### Ch 12. Linear Programming\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Graphical solution: maximise/minimise Z, corner-point method | 4–5 | Every year | **P1** |\n| Identify the feasible region / corner points from a given graph | 1–2 | 8/10 | **P1** |\n| Unbounded feasible region — does max/min exist? | 2–5 | 6/10 | P2 |\n| Formulate an LPP from a word problem | 2–3 | 5/10 | P2 |\n| Max/min of Z given the corner points (MCQ) | 1 | 8/10 | **P1** |\n| Feasible region has no common point → no solution | 1–2 | 4/10 | P3 |\n\n**Pattern note.** Five marks for one completely templated question. Named problem *types* (diet,\ntransportation, manufacturing) are deleted as categories, and problems are limited to two variables\nwith at most three non-trivial constraints — which caps how hard this can get. There is no excuse\nfor losing marks here.\n\n**The trap.** Reading corner points off the graph instead of solving the pair of equations. And, for\nan unbounded region, not doing the existence check. Both are single marks that most students drop.\n\n---\n\n## Unit VI — Probability (8 marks)\n\n### Ch 13. Probability\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Bayes' theorem word problem | 4–5 | Every year | **P1** |\n| Conditional probability P(A\\|B) from given data or a table | 2–3 | Every year | **P1** |\n| Theorem of total probability | 3–4 | 9/10 | **P1** |\n| Independent events — test independence, or compute with it | 2–3 | 9/10 | **P1** |\n| Multiplication theorem; drawing without replacement | 2–3 | 8/10 | **P1** |\n| Probability distribution of a random variable, and its mean | 3–4 | 7/10 | **P1** |\n| At-least / at-most phrasing on two or three trials | 2 | 6/10 | P2 |\n| Odds in favour / against, complement | 1 | 5/10 | P2 |\n\n**Pattern note.** **Variance and the Binomial distribution are deleted.** This is the deletion\nstudents most often miss, because the Binomial distribution used to be a guaranteed question. What\nsurvives — and now absorbs the whole 8 marks — is the conditional-probability family: conditional,\nmultiplication, independence, total probability, Bayes, plus the mean of a random variable.\n\nBayes is the closest thing to a guaranteed 4- or 5-marker in the paper, and it recurs in a small\nnumber of costumes: two or three machines/factories with different defect rates; two or three bags\nwith different ball compositions; a diagnostic test with false positives; students from different\nsections; a coin chosen from a set of biased coins.\n\n**The trap.** Mixing up P(A|B) and P(B|A). The layout fix in\n[`../docs/how-to-answer.md`](../docs/how-to-answer.md) — define events, list all priors, list all\nlikelihoods, then write the formula — makes this error structurally hard to commit.\n\n---\n\n## Putting it together: a 30-day Maths triage list\n\nEvery **P1** row above, and nothing else. That is:\n\n- Matrix method for 3 equations, and A⁻¹ via adjoint\n- Integrals: partial fractions, by parts, substitution, complete-the-square, the f(a−x) property\n- Linear and variable-separable and homogeneous differential equations\n- Maxima–minima word problems, and increasing/decreasing intervals\n- Continuity at a point; logarithmic, implicit, parametric and second-order differentiation\n- Vectors: unit vector, angle, projection, cross-product area, perpendicularity\n- 3D lines: equation through two points, angle between lines, shortest distance, foot of perpendicular\n- LP: graphical corner-point method\n- Probability: conditional, total probability, Bayes, mean of a random variable\n- Relations: equivalence relations; functions: one-one and onto\n- Inverse trig: principal values, and sin⁻¹(sin θ) outside the branch\n- Area between a line and a circle/parabola\n\nThat list is about 60 of 80 marks, and it is genuinely coverable in 30 days."},{"id":"pyqp","title":"What Repeats · Physics","blurb":"Topic-by-topic frequency and P1/P2/P3 priorities","body":"Read [`README.md`](README.md) in this folder for how the Freq and Priority bands are defined and what\nthey are and are not.\n\nOnly **current-syllabus** topics appear here. Deleted topics (potentiometer, cyclotron, LC\noscillations, radioactivity and half-life, resolving power, Zener diode, transistors, logic gates,\noptoelectronic devices, hysteresis) are listed in\n[`../docs/00-exam-blueprint.md`](../docs/00-exam-blueprint.md) §3.\n\n---\n\n## The 45-mark core\n\nFifteen question types. Historically these have covered around 45 of 70 marks.\n\n| # | Question type | Chapter | Marks | Freq |\n| --- | --- | --- | --- | --- |\n| 1 | Series LCR circuit: phasor diagram, impedance, resonance | 7 | 5 | Every year |\n| 2 | Young's double slit: fringe-width derivation | 10 | 3–5 | Every year |\n| 3 | Refraction through a prism: μ = sin((A+δm)/2)/sin(A/2) | 9 | 3–5 | 9/10 |\n| 4 | Gauss's law applied to a wire / sheet / shell | 1 | 3–5 | Every year |\n| 5 | Drift velocity → Ohm's law, and resistivity | 3 | 3–5 | Every year |\n| 6 | Parallel-plate capacitor with a dielectric; energy stored | 2 | 3–5 | Every year |\n| 7 | Compound microscope or astronomical telescope: ray diagram + magnification | 9 | 5 | 9/10 |\n| 8 | Photoelectric effect: Einstein's equation + graphs | 11 | 3–4 | Every year |\n| 9 | Bohr model: radius and energy of the nᵗʰ orbit; spectral series | 12 | 3–5 | 9/10 |\n| 10 | Diode as a half-wave / full-wave rectifier: circuit + waveform | 14 | 3–5 | 9/10 |\n| 11 | Biot–Savart applied to a circular loop's axis | 4 | 3–5 | 8/10 |\n| 12 | Ampere's circuital law → long straight wire (and the solenoid field) | 4 | 3 | 8/10 |\n| 13 | Binding energy per nucleon curve, and what it implies | 13 | 3 | 9/10 |\n| 14 | Transformer: principle, working, losses | 7 | 3–5 | 8/10 |\n| 15 | Moving-coil galvanometer → ammeter / voltmeter conversion | 4 | 3–5 | 8/10 |\n\n---\n\n## Units I + II — Electrostatics and Current Electricity (16 marks)\n\n### Ch 1. Electric Charges and Fields\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Gauss's law: statement, then apply to infinite wire / infinite sheet / spherical shell | 3–5 | Every year | **P1** |\n| Electric field on the axial and equatorial line of a dipole | 3–5 | 8/10 | **P1** |\n| Torque on a dipole in a uniform field; τ = p × E | 2–3 | 8/10 | **P1** |\n| Electric flux through a surface / through a cube face | 1–2 | 9/10 | **P1** |\n| Coulomb's law, and force on a charge from two or three others | 2–3 | 7/10 | P2 |\n| Electric field lines: properties, and sketching for given charges | 2 | 7/10 | P2 |\n| Superposition — net field at a point | 2–3 | 7/10 | P2 |\n| Field inside a conductor is zero; charge resides on the surface | 1–2 | 6/10 | P2 |\n| Continuous charge distribution, linear/surface/volume charge density | 1 | 5/10 | P2 |\n\n**Pattern note.** Gauss's law is the anchor of this chapter and reappears in three costumes: a long\nstraight wire (E = λ/2πε₀r), an infinite plane sheet (E = σ/2ε₀), and a uniformly charged thin\nspherical shell (E = q/4πε₀r² outside, **zero inside**). The shell's \"zero inside\" result is asked\nas an MCQ or Assertion–Reason almost every year on its own.\n\n**The trap.** Writing the Gaussian surface without justifying *why* that surface (symmetry, and E\nparallel/perpendicular to the area vector). That justification is a mark.\n\n### Ch 2. Electrostatic Potential and Capacitance\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Capacitance of a parallel-plate capacitor, with and without a dielectric slab | 3–5 | Every year | **P1** |\n| Energy stored in a capacitor; energy density | 2–3 | Every year | **P1** |\n| Capacitors in series and parallel; equivalent capacitance of a network | 2–3 | 9/10 | **P1** |\n| Potential due to a point charge; due to a dipole | 2–3 | 8/10 | **P1** |\n| Equipotential surfaces: properties, and why work along one is zero | 2 | 8/10 | **P1** |\n| Two charged conductors connected: common potential and loss of energy | 3 | 7/10 | P2 |\n| Potential energy of a system of charges | 2–3 | 7/10 | P2 |\n| Potential energy of a dipole in a uniform field | 2 | 6/10 | P2 |\n| Relation E = −dV/dr | 1–2 | 7/10 | P2 |\n| Effect on C, V, Q, E and U when a dielectric is inserted (battery connected vs disconnected) | 3 | 7/10 | **P1** |\n| Dielectric polarisation, dielectric constant | 1–2 | 5/10 | P2 |\n\n**Pattern note.** The \"insert a dielectric\" question is worth singling out. There are two cases and\nCBSE asks them interchangeably: **battery still connected** (V constant, so C↑, Q↑, U↑) versus\n**battery disconnected** (Q constant, so C↑, V↓, U↓). Students memorise one case and answer the\nother. Build a small table for both and learn it as a table.\n\nVan de Graaff generator is deleted.\n\n### Ch 3. Current Electricity\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Drift velocity; derive I = neAv_d and hence Ohm's law | 3–5 | Every year | **P1** |\n| Resistivity, and its dependence on temperature (conductor vs semiconductor) | 2–3 | 9/10 | **P1** |\n| Cells in series and parallel; equivalent emf and internal resistance | 3 | 8/10 | **P1** |\n| Kirchhoff's rules: statement, and apply to a two-loop circuit | 3–5 | 9/10 | **P1** |\n| Wheatstone bridge: balance condition, derived by Kirchhoff | 3–5 | 8/10 | **P1** |\n| Metre bridge: circuit, working, finding unknown R | 3 | 6/10 | P2 |\n| Internal resistance from a V–I graph, or terminal potential difference | 2–3 | 8/10 | **P1** |\n| Mobility; relation between current density, conductivity and E | 1–2 | 7/10 | P2 |\n| Relaxation time; effect on resistance of stretching a wire | 2 | 6/10 | P2 |\n| Power dissipated; maximum power transfer | 2 | 5/10 | P2 |\n| Non-ohmic conductors and V–I graphs | 1–2 | 5/10 | P2 |\n\n**Pattern note.** The **potentiometer is fully deleted**, theory and practical. That removed a\nguaranteed 3–5 mark question and its weight went to Kirchhoff/Wheatstone and to drift velocity. If a\npractice paper asks you to compare two cells' emf with a potentiometer, it is an old paper.\n\n**The trap.** In the drift-velocity derivation, students write I = neAv_d and stop. The question asks\nyou to *hence* obtain Ohm's law — you must substitute v_d = (eE/m)τ and E = V/l to reach\nR = ml/(ne²Aτ). The last step is where the marks are.\n\n---\n\n## Units III + IV — Magnetism and EMI/AC (17 marks)\n\n### Ch 4. Moving Charges and Magnetism\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Biot–Savart law; field on the axis of a circular current loop | 3–5 | 8/10 | **P1** |\n| Ampere's circuital law; apply to a long straight wire; solenoid field B = μ₀nI | 3 | 8/10 | **P1** |\n| Moving-coil galvanometer: principle, construction, and conversion to ammeter/voltmeter | 3–5 | 8/10 | **P1** |\n| Force on a current-carrying conductor in a magnetic field; F = I(l × B) | 2–3 | 8/10 | **P1** |\n| Force between two parallel current-carrying conductors; definition of the ampere | 3 | 7/10 | P2 |\n| Force on a moving charge; F = q(v × B); circular motion, radius r = mv/qB | 2–3 | 8/10 | **P1** |\n| Torque on a current loop; magnetic dipole moment m = NIA | 2–3 | 7/10 | P2 |\n| Velocity selector (crossed E and B fields) | 2 | 5/10 | P2 |\n| Current sensitivity and voltage sensitivity of a galvanometer | 2 | 6/10 | P2 |\n| Field at the centre of a circular arc | 1–2 | 6/10 | P2 |\n\n**Pattern note.** **Cyclotron is deleted** — that was a standard 3-mark derivation for years, so\nagain, old papers overstate it. The galvanometer-conversion question absorbed much of its weight and\nnow appears very reliably; know both shunt (ammeter) and series-resistance (voltmeter) formulas.\n\n### Ch 5. Magnetism and Matter\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Earth's magnetism: declination, dip, horizontal component, and their relation | 2–3 | 8/10 | **P1** |\n| Bar magnet as an equivalent solenoid; magnetic dipole moment | 2–3 | 7/10 | P2 |\n| Torque on a magnetic dipole in a uniform field; τ = m × B | 2 | 7/10 | P2 |\n| Magnetic field lines: properties (closed loops, no monopole) | 1–2 | 7/10 | P2 |\n| Para-, dia- and ferromagnetic materials: qualitative comparison | 2–3 | 6/10 | P2 |\n| Potential energy of a magnetic dipole; work to rotate it | 2 | 5/10 | P2 |\n| Gauss's law for magnetism (∮B·dA = 0) and its meaning | 1–2 | 5/10 | P2 |\n| Time period of oscillation of a magnet in a field | 1–2 | 3/10 | P3 |\n\n**Pattern note.** Heavily thinned by deletions — magnetic susceptibility and permeability, hysteresis,\nand electromagnets/permanent magnets are all out. This is now largely a 1–2 mark chapter, which\nmakes it a poor place to spend long hours. Learn the Earth's-magnetism triangle\n(B_H = B cos δ, B_V = B sin δ, tan δ = B_V/B_H) and the qualitative material comparison, and move on.\n\n### Ch 6. Electromagnetic Induction\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Faraday's laws; Lenz's law and its link to energy conservation | 2–3 | Every year | **P1** |\n| Motional emf: ε = Blv, derived and applied | 2–3 | 9/10 | **P1** |\n| Self-inductance; L of a long solenoid; energy stored ½LI² | 3 | 8/10 | **P1** |\n| Mutual inductance of two coaxial solenoids | 3 | 7/10 | P2 |\n| AC generator: principle, construction, working, ε = ε₀ sin ωt | 5 | 7/10 | **P1** |\n| Eddy currents: cause, harmful effects, and applications | 2 | 7/10 | P2 |\n| Induced emf and current from a flux–time graph | 2–3 | 6/10 | P2 |\n| Direction of induced current in a given configuration | 1–2 | 8/10 | **P1** |\n\n**Pattern note.** Lenz's law questions are as much conceptual as computational — \"a magnet falls\nthrough a copper ring, explain\", \"a coil moves out of a field, which way does the current flow\". The\nmarking scheme wants the *reason* (opposition to change of flux), not just the direction.\n\n### Ch 7. Alternating Current\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Series LCR: phasor diagram, impedance Z = √(R² + (X_L − X_C)²), phase angle | 5 | Every year | **P1** |\n| Resonance: condition, resonant frequency, and the sharpness/Q factor | 3–5 | 9/10 | **P1** |\n| Transformer: principle, working, turns ratio, energy losses and their remedies | 3–5 | 8/10 | **P1** |\n| Power in an AC circuit; power factor; wattless current | 2–3 | 8/10 | **P1** |\n| AC through a pure inductor / pure capacitor: phase relation, reactance | 2–3 | 8/10 | **P1** |\n| RMS and average value of current/voltage; why RMS is used | 2 | 7/10 | P2 |\n| Impedance vs frequency, or current vs frequency graph | 2 | 6/10 | P2 |\n| AC through a resistor only | 1–2 | 6/10 | P2 |\n\n**Pattern note.** LC oscillations are deleted. The series LCR question is close to guaranteed and is\nusually the 5-marker for this block — phasor diagram, impedance expression, then a numerical or the\nresonance condition. Draw the phasor diagram even when it is not explicitly asked; it is worth a\nmark on its own.\n\n**The trap.** Writing average power as V_rms I_rms and omitting cos φ. And, for a purely inductive or\ncapacitive circuit, not stating that the average power over a cycle is **zero**.\n\n---\n\n## Units V + VI — Electromagnetic Waves and Optics (18 marks) — the largest block\n\n### Ch 8. Electromagnetic Waves\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Displacement current: what it is, why Ampere's law needed modification | 2–3 | 8/10 | **P1** |\n| EM spectrum: order, wavelength ranges, sources and uses | 2–3 | 8/10 | **P1** |\n| Properties of EM waves (transverse, E ⊥ B ⊥ direction, speed c = 1/√(μ₀ε₀)) | 2–3 | 8/10 | **P1** |\n| c = E₀/B₀; energy carried equally by E and B fields | 1–2 | 6/10 | P2 |\n| Maxwell's equations, qualitatively / their significance | 1–2 | 5/10 | P2 |\n| Identify a wave/radiation given its wavelength or use | 1 | 8/10 | **P1** |\n| Energy density of an EM wave | 1–2 | 4/10 | P3 |\n\n**Pattern note.** A small chapter that reliably supplies 2–4 marks, mostly in Sections A and B. It is\nthe best marks-per-page ratio in the book. Make a one-page EM-spectrum table (radio → microwave →\nIR → visible → UV → X-ray → gamma, with wavelength range, source, detector, use) and learn it cold —\nthat table alone answers most of what is asked here.\n\n### Ch 9. Ray Optics and Optical Instruments — the biggest single chapter\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Compound microscope: ray diagram + magnifying power | 5 | 8/10 | **P1** |\n| Astronomical telescope: ray diagram + magnifying power (normal adjustment) | 5 | 8/10 | **P1** |\n| Refraction through a prism; derive A + δ = i + e and μ = sin((A+δm)/2)/sin(A/2) | 3–5 | 9/10 | **P1** |\n| Lens maker's formula: derivation and use | 3–5 | 8/10 | **P1** |\n| Mirror formula / refraction at a spherical surface: derivation | 3–5 | 7/10 | **P1** |\n| Total internal reflection: condition, critical angle, optical fibre, prism uses | 2–3 | 9/10 | **P1** |\n| Power of a lens; combination of thin lenses in contact | 2–3 | 9/10 | **P1** |\n| Numerical on 1/v − 1/u = 1/f, with sign convention | 2–3 | Every year | **P1** |\n| Refractive index, Snell's law, apparent depth | 2–3 | 8/10 | **P1** |\n| Image formation by a convex/concave mirror or lens; nature of image | 2–3 | 8/10 | **P1** |\n| Angle of minimum deviation; i–δ graph | 2 | 6/10 | P2 |\n| Magnification, and why a convex lens can act as a magnifier | 2 | 6/10 | P2 |\n| Dispersion by a prism; why a rainbow forms | 1–2 | 5/10 | P2 |\n\n**Pattern note.** Ray Optics alone typically carries **8–10 marks**, and it is the one chapter that\nappears in every section of the paper — MCQ, 2-mark, 3-mark derivation, case study, and 5-mark\ninstrument question. It is the highest-priority chapter in Physics, full stop.\n\n**The trap — sign convention.** More marks are lost to sign convention in this chapter than to\nanything else in the paper. Fix the rule once: distances measured from the pole/optical centre, in\nthe direction of incident light positive, against it negative; heights above the axis positive. Write\n`u = −30 cm` explicitly rather than substituting 30 and hoping.\n\n**The trap — ray diagrams.** They must show at least two rays, arrowheads on every ray, the image\nclearly located, and all of F, 2F, O and C labelled. The diagram is worth 1–2 of the 5 marks on the\ninstrument questions and is marked independently of the algebra.\n\n### Ch 10. Wave Optics\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Young's double slit: derive fringe width β = Dλ/d | 3–5 | Every year | **P1** |\n| Conditions for sustained interference; what coherence means | 2–3 | 8/10 | **P1** |\n| Single-slit diffraction: central maximum, minima positions, angular width | 3 | 8/10 | **P1** |\n| Interference vs diffraction: distinguish | 2–3 | 7/10 | P2 |\n| Huygens' principle; use it to explain reflection or refraction | 3 | 7/10 | P2 |\n| Effect on fringe width of changing λ, D, d, or immersing in a liquid | 2–3 | 8/10 | **P1** |\n| Polarisation; Polaroids; Brewster's law — **scope has been trimmed; verify for your year** | 2–3 | falling | P3 |\n| Intensity distribution graph for interference and for diffraction | 2 | 6/10 | P2 |\n| Path difference and phase difference; conditions for maxima/minima | 2 | 7/10 | P2 |\n\n**Pattern note.** Resolving power of a microscope and telescope, validity of ray optics, and\npolarisation by scattering are deleted. The chapter is now essentially **Huygens + YDSE +\nsingle-slit diffraction**, and YDSE fringe width is one of the two or three most reliably asked\nresults in the whole paper.\n\nTwo syllabus qualifiers matter here. The fringe width is listed as \"**no derivation, final expression\nonly**\", and the width of the central maximum as \"**qualitative treatment only**\" — so the formulas\nand their consequences (what happens when λ, D, d or the slit width changes) are worth far more of\nyour time than the derivations. The **polarisation block has been trimmed** across recent revisions\nand sources disagree on what survives; treat it as low priority and check the current syllabus PDF.\nSee [`../physics/10-wave-optics.md`](../physics/10-wave-optics.md) §1.\n\n---\n\n## Units VII + VIII — Dual Nature, Atoms and Nuclei (12 marks)\n\n### Ch 11. Dual Nature of Radiation and Matter\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Einstein's photoelectric equation; explain the observed laws with it | 3–4 | Every year | **P1** |\n| Graphs: stopping potential vs frequency; photocurrent vs potential for different intensities | 2–3 | 9/10 | **P1** |\n| Work function, threshold frequency/wavelength; numericals | 2–3 | 9/10 | **P1** |\n| de Broglie wavelength; λ = h/p, and λ = h/√(2meV) for an accelerated electron | 2–3 | 9/10 | **P1** |\n| Laws of photoelectric emission | 2–3 | 8/10 | **P1** |\n| Why the wave theory fails to explain the photoelectric effect | 2 | 6/10 | P2 |\n| Photon: energy, momentum, and its properties | 1–2 | 7/10 | P2 |\n| Davisson–Germer experiment (qualitative) | 1–2 | 4/10 | P3 |\n\n**Pattern note.** Highly formulaic and therefore high-return — one equation\n(hν = φ₀ + ½mv²_max = φ₀ + eV₀) plus two graphs generates nearly every question. Case-study\nquestions in Section D draw on this chapter often, using the graphs as the \"source\".\n\n**What the graph question actually wants:** for stopping potential V₀ vs frequency ν, the slope is\n**h/e** and the x-intercept is the **threshold frequency**; the line's slope is the *same* for all\nmetals and only the intercept changes. That is the asked fact.\n\n### Ch 12. Atoms\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Bohr's postulates; radius and energy of the nᵗʰ orbit | 3–5 | 9/10 | **P1** |\n| Hydrogen spectrum: Lyman, Balmer, Paschen series; wavelength calculations | 3 | 8/10 | **P1** |\n| Rutherford's α-scattering experiment: observations and conclusions | 2–3 | 7/10 | P2 |\n| Energy level diagram; excitation and ionisation energy | 2–3 | 8/10 | **P1** |\n| de Broglie's explanation of Bohr's quantisation condition | 2–3 | 6/10 | P2 |\n| Limitations of Rutherford's and Bohr's models | 2 | 6/10 | P2 |\n| Impact parameter; distance of closest approach | 2 | 5/10 | P2 |\n\n**Pattern note.** The number to have memorised is **E_n = −13.6/n² eV**. Almost every numerical here\nis one line of arithmetic from it. Similarly r_n = 0.53 n² Å. Two constants, most of a chapter.\n\n### Ch 13. Nuclei\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Binding energy per nucleon vs mass number curve: draw it and read conclusions off it | 3 | 9/10 | **P1** |\n| Mass defect and binding energy; numerical calculation in MeV | 2–3 | 9/10 | **P1** |\n| Nuclear fission and fusion; energy released; why each releases energy | 3 | 8/10 | **P1** |\n| Nuclear size R = R₀A^(1/3); nuclear density is independent of A | 2–3 | 8/10 | **P1** |\n| Characteristics of nuclear forces | 2 | 7/10 | P2 |\n| Mass–energy equivalence, E = mc²; 1 u = 931.5 MeV | 1–2 | 8/10 | **P1** |\n| Isotopes / isobars / isotones | 1 | 5/10 | P2 |\n| Why heavy nuclei are unstable; the role of the BE/nucleon curve in fission | 2–3 | 6/10 | P2 |\n\n**Pattern note.** **Radioactivity is fully deleted** — no alpha/beta/gamma decay, no decay law, no\nhalf-life or mean life. That is a large slice of every pre-2023 Nuclei question gone, and it makes\nthis chapter both smaller and more predictable. What remains centres almost entirely on the\nBE/nucleon curve; be able to draw it with Fe-56 at the peak (~8.8 MeV) and explain why both fission\nof heavy nuclei and fusion of light nuclei release energy.\n\n---\n\n## Unit IX — Electronic Devices (7 marks)\n\n### Ch 14. Semiconductor Electronics\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Diode as a half-wave and full-wave rectifier: circuit + input/output waveforms | 3–5 | 9/10 | **P1** |\n| p-n junction formation: depletion region and barrier potential | 2–3 | 9/10 | **P1** |\n| Diode I–V characteristics in forward and reverse bias; how to obtain them | 2–3 | 9/10 | **P1** |\n| Intrinsic vs extrinsic semiconductors; p-type and n-type doping | 2–3 | 9/10 | **P1** |\n| Energy bands in conductors, semiconductors and insulators | 2–3 | 8/10 | **P1** |\n| Effect of temperature on semiconductor conductivity | 1–2 | 7/10 | P2 |\n| Forward vs reverse bias: depletion width and resistance | 2 | 7/10 | P2 |\n| Majority and minority carriers; donor and acceptor impurities | 1–2 | 7/10 | P2 |\n| Knee/threshold voltage; breakdown voltage | 1 | 5/10 | P2 |\n\n**Pattern note.** **Read this even if you read nothing else on this page.** Zener diode, LED,\nphotodiode, solar cell, transistors and logic gates are all deleted. What is left is five topics —\nand it still carries **7 marks**, a full 10% of the paper.\n\nThat makes Ch 14 the highest marks-per-hour chapter in Physics by a wide margin. Students skip it\nbecause it is the last chapter in the book and because they remember it as \"the hard transistor\nchapter\" from seniors. It no longer is. Two focused days here is worth more than two weeks on\nMagnetism and Matter.\n\n**The rectifier question specifics.** You need: the circuit diagram (with the transformer and load\nresistance shown), the input waveform, and the output waveform, correctly aligned. For the full-wave\nrectifier, show that output pulses appear for **both** half-cycles. The three diagrams are the bulk\nof the marks; the explanation is one or two lines.\n\n---\n\n## Putting it together: a 30-day Physics triage list\n\nEvery **P1** row above. In chapter order:\n\n- **Ch 1:** Gauss's law + three applications; dipole field; flux\n- **Ch 2:** parallel-plate capacitor ± dielectric; energy stored; series/parallel; potential; equipotentials\n- **Ch 3:** drift velocity → Ohm's law; resistivity vs temperature; Kirchhoff; Wheatstone; cells; internal resistance\n- **Ch 4:** Biot–Savart for a loop; Ampere's law → long straight wire; galvanometer conversion; F = I(l×B); F = q(v×B)\n- **Ch 5:** Earth's magnetic elements only\n- **Ch 6:** Faraday and Lenz; motional emf; self-inductance; AC generator; direction of induced current\n- **Ch 7:** series LCR + phasor; resonance and Q; transformer; power factor; pure L and pure C\n- **Ch 8:** displacement current; EM spectrum table; properties of EM waves\n- **Ch 9 (do this first):** prism formula; lens maker's formula; mirror formula; TIR; power and combination; microscope; telescope; sign-convention numericals\n- **Ch 10:** YDSE fringe width; single-slit diffraction; conditions for interference; effect of changing λ/D/d\n- **Ch 11:** Einstein's equation; the two graphs; work function numericals; de Broglie\n- **Ch 12:** Bohr's postulates; E_n = −13.6/n²; spectral series; energy level diagram\n- **Ch 13:** BE/nucleon curve; mass defect numericals; fission and fusion; R = R₀A^(1/3)\n- **Ch 14:** the whole chapter\n\nThat is roughly 45–50 of 70 marks, and Ch 9 + Ch 14 + Ch 7 alone are about 25 of them."},{"id":"pyqi","title":"Reading the Frequency Tables","blurb":"What the frequency bands mean, and the caveats","body":"## What was analysed\n\nThe frequency tables in this folder describe recurring **question types** in the CBSE Class 12\nboard papers for Mathematics (041) and Physics (042) across roughly the last decade — the\n2015 → 2025 window, including the multiple sets (Delhi / Outside Delhi / Compartment) that CBSE\nissues each year, and the official sample paper for each session.\n\n## How to read the frequency column\n\nEvery table has a **Freq** column with one of four bands:\n\n| Band | Meaning | What to do |\n| --- | --- | --- |\n| **Every year** | Appeared in essentially every session, usually in every set | Must be automatic. Practise until you don't think. |\n| **8–9/10** | Appeared in 8 or 9 of the last 10 sessions | Treat as compulsory. |\n| **5–7/10** | Appeared about every other year | Learn it properly; don't drill it to death. |\n| **2–4/10** | Occasional — often as an MCQ or a sub-part | Know the formula and the idea. Don't spend a week on it. |\n\nThe **Marks** column gives where the question type normally sits (1 / 2 / 3 / 4 / 5), which tells you\nhow deep to go. A \"2–4/10, 1 mark\" topic needs a formula and nothing more. A \"every year, 5 marks\"\ntopic needs the full derivation on demand.\n\n## Caveats — read these\n\n1. **These bands are pattern estimates, not a machine count.** They are built from the recurring\n   structure of CBSE papers and marking schemes, not from an automated parse of PDF papers in this\n   repo. Treat them as a well-informed prioritisation, not as a published statistic. If you want\n   hard counts, download the last 10 years of papers from cbseacademic.nic.in and tally them\n   yourself against these tables — that exercise is itself excellent revision, and any correction\n   you find should be edited straight into these files.\n\n2. **The syllabus was rationalised in 2023-24.** Papers from 2015–2022 contain questions on topics\n   that are now deleted — planes in 3D Geometry, the Binomial distribution, potentiometer,\n   transistors and logic gates, radioactivity, tangents and normals, and more. These tables cover\n   only what is **still in the syllabus**; a deleted topic that used to appear every year is simply\n   absent here. When you practise from an old paper, cross out the deleted questions first. The full\n   deletion list is in [`../docs/00-exam-blueprint.md`](../docs/00-exam-blueprint.md) §3.\n\n3. **Frequency is not the same as importance-per-hour.** A topic asked every year for 1 mark\n   deserves less of your time than a topic asked every other year for 5. Read the Freq and Marks\n   columns together. The \"Priority\" column in each table already combines them.\n\n4. **High frequency is a floor, not a ceiling.** CBSE deliberately includes unfamiliar\n   application-style questions each year, and the shift to competency-based questions has increased\n   that. Never study *only* the high-frequency list — it gets you to about 65–70%, not beyond.\n\n## Priority column\n\n**P1** — highest return. Do these first, and do them completely.\n**P2** — core. Needed for a good score.\n**P3** — do after P1 and P2 are solid.\n\nIf you are on the 30-day plan, do P1 across both subjects and stop.\n\n## Files\n\n- [`pyq-frequency-maths.md`](pyq-frequency-maths.md)\n- [`pyq-frequency-physics.md`](pyq-frequency-physics.md)"},{"id":"fsm","title":"Formula Sheet · Maths","blurb":"Every in-syllabus formula, all 13 chapters","body":"Everything in the current syllabus, on one page. **Deleted topics are not here** — if a formula you\nhalf-remember is missing, check [`../docs/00-exam-blueprint.md`](../docs/00-exam-blueprint.md) §3\nbefore hunting for it; it is probably out of syllabus.\n\nUse this for the daily 20-minute revision in February, and read it once on the morning of the exam.\n\n---\n\n## Ch 1 — Relations and Functions\n\n```\nReflexive    : (a, a) ∈ R for every a ∈ A\nSymmetric    : (a, b) ∈ R ⟹ (b, a) ∈ R\nTransitive   : (a, b), (b, c) ∈ R ⟹ (a, c) ∈ R\nEquivalence  : all three\n\nOne-one (injective) : f(x₁) = f(x₂) ⟹ x₁ = x₂       [or f′ of one sign throughout]\nOnto (surjective)   : range = codomain\nBijective           : both\n\nEquivalence class  [a] = { x ∈ A : (a, x) ∈ R };  classes partition A\n\n|A| = m, |B| = n :\n  relations A→B     = 2^(mn)          relations on A (|A| = n) = 2^(n²)\n  reflexive on A    = 2^(n² − n)      symmetric on A           = 2^(n(n+1)/2)\n  functions A→B     = n^m             one-one A→B (m ≤ n)      = n!/(n − m)!\n  bijections A→A    = n!\n```\n\n## Ch 2 — Inverse Trigonometric Functions\n\n```\n              DOMAIN            RANGE (principal value branch)\nsin⁻¹ x      [−1, 1]           [−π/2, π/2]\ncos⁻¹ x      [−1, 1]           [0, π]\ntan⁻¹ x      R                 (−π/2, π/2)\ncot⁻¹ x      R                 (0, π)\nsec⁻¹ x      |x| ≥ 1           [0, π] − {π/2}\ncosec⁻¹ x    |x| ≥ 1           [−π/2, π/2] − {0}\n\nFamily A (sin⁻¹, tan⁻¹, cosec⁻¹) : f(−x) = −f(x)\nFamily B (cos⁻¹, cot⁻¹, sec⁻¹)   : f(−x) = π − f(x)      ← never negative\n\nsin⁻¹(sin θ) = θ  ONLY if θ ∈ [−π/2, π/2] ;  else reduce\ncos⁻¹(cos θ) = θ  ONLY if θ ∈ [0, π]      ;  else reduce\ntan⁻¹(tan θ) = θ  ONLY if θ ∈ (−π/2, π/2) ;  else reduce\n\nsin⁻¹x + cos⁻¹x = π/2\n\nsin(cos⁻¹x) = √(1 − x²)      tan(sin⁻¹x) = x/√(1 − x²)      sec(tan⁻¹x) = √(1 + x²)\n```\n\n## Ch 3 — Matrices\n\n```\nOrder m × n → mn elements ;  a_ij = row i, column j\nNumber of possible orders for k elements = number of divisors of k\nNumber of m × n matrices with entries from a set of size s = s^(mn)\n\nAB defined iff cols(A) = rows(B) ;  A(m×n) B(n×p) = AB(m×p)\n\n(A′)′ = A      (kA)′ = kA′      (A + B)′ = A′ + B′      (AB)′ = B′A′\n\nSymmetric      : A′ = A\nSkew-symmetric : A′ = −A  ⟹  all diagonal entries = 0  ⟹  trace = 0\nA = ½(A + A′) + ½(A − A′)                [symmetric + skew-symmetric]\n\nA + A′, AA′, A′A are symmetric ;  A − A′ is skew-symmetric\nA, B symmetric ⟹ AB + BA symmetric, AB − BA skew-symmetric\n\nAB ≠ BA in general ;  AB = O does NOT imply A = O or B = O\n(A + B)² = A² + AB + BA + B²             [NOT A² + 2AB + B²]\n\nFor 2 × 2 :  A² − (trace A)·A + (det A)·I = O\n```\n\n## Ch 4 — Determinants\n\n```\n2 × 2 :  |A| = ad − bc\n\n3 × 3 :  expand along the row/column with the most zeros\n         signs :   + − +\n                   − + −\n                   + − +\n\nMinor M_ij    : delete row i, column j\nCofactor A_ij = (−1)^(i+j) M_ij\n\nadj A = TRANSPOSE of the cofactor matrix\nA (adj A) = (adj A) A = |A| I\nA⁻¹ = (1/|A|) adj A                      (requires |A| ≠ 0)\n\n2 × 2 shortcut : adj [[a, b], [c, d]] = [[d, −b], [−c, a]]\n\n|AB| = |A||B|        |Aᵀ| = |A|          |kA| = kⁿ|A|        |Aⁿ| = |A|ⁿ\n|A⁻¹| = 1/|A|        |adj A| = |A|^(n−1)\nadj(AB) = (adj B)(adj A)                 (AB)⁻¹ = B⁻¹A⁻¹\ndet of a skew-symmetric matrix of ODD order = 0\n\nArea of triangle = ½ | det [[x₁,y₁,1],[x₂,y₂,1],[x₃,y₃,1]] |\nCollinear ⟺ that determinant = 0\n\nAX = B → X = A⁻¹B if |A| ≠ 0                      (unique solution, consistent)\n|A| = 0 and (adj A)B ≠ O  → inconsistent, no solution\n|A| = 0 and (adj A)B = O  → infinitely many, or none\n```\n\n## Ch 5 — Continuity and Differentiability\n\n```\nCONTINUOUS at a  : LHL = RHL = f(a)\n   LHL = lim f(a − h),  RHL = lim f(a + h),  h → 0⁺\n\nDIFFERENTIABLE at a : LHD = RHD, both finite\n   differentiable ⟹ continuous ;  continuous ⇏ differentiable  (|x| at 0)\n\nDERIVATIVES\n  xⁿ → n x^(n−1)          log x → 1/x            log_a x → 1/(x log a)\n  eˣ → eˣ                 aˣ → aˣ log a          constant → 0\n\n  sin x → cos x            cos x → −sin x\n  tan x → sec²x            cot x → −cosec²x\n  sec x → sec x tan x      cosec x → −cosec x cot x\n\n  sin⁻¹x → 1/√(1 − x²)     cos⁻¹x → −1/√(1 − x²)\n  tan⁻¹x → 1/(1 + x²)      cot⁻¹x → −1/(1 + x²)\n  sec⁻¹x → 1/(|x|√(x²−1))  cosec⁻¹x → −1/(|x|√(x²−1))\n\nRULES\n  Chain    : dy/dx = f′(g(x)) · g′(x)\n  Product  : (uv)′ = u′v + uv′\n  Quotient : (u/v)′ = (u′v − uv′)/v²\n  Implicit : differentiate both sides; every y term gains a dy/dx\n  Log diff : variable in base AND exponent → take log first\n  Parametric : dy/dx = (dy/dt)/(dx/dt)\n               d²y/dx² = [ d/dt (dy/dx) ] / (dx/dt)     ← divide AGAIN\n\nSTANDARD LIMITS\n  lim (sin x)/x = 1     lim (tan x)/x = 1     lim (eˣ − 1)/x = 1     lim (1+x)^(1/x) = e\n  x→0                   x→0                    x→0                    x→0\n\n\"PROVE A RELATION\" METHOD\n  differentiate → clear the radical → SQUARE both sides → differentiate → divide by 2y′\n```\n\n## Ch 6 — Application of Derivatives\n\n```\nRATES : dy/dt = (dy/dx)(dx/dt).  Always state units.\n\n  Circle   A = πr² → dA/dt = 2πr dr/dt      C = 2πr → dC/dt = 2π dr/dt\n  Sphere   V = (4/3)πr³ → dV/dt = 4πr² dr/dt    S = 4πr² → dS/dt = 8πr dr/dt\n  Cube     V = x³ → dV/dt = 3x² dx/dt       S = 6x² → dS/dt = 12x dx/dt\n\nMONOTONICITY\n  f′(x) > 0 on I ⟹ strictly increasing        f′(x) < 0 on I ⟹ strictly decreasing\n  Method: f′ → factorise → critical points → sign table → state intervals\n\nEXTREMA\n  Critical point : f′(c) = 0 or f′(c) undefined\n  1st derivative test : f′ goes + → − ⟹ MAX ;  − → + ⟹ MIN ;  no change ⟹ inflection\n  2nd derivative test : f′(c) = 0 and f″(c) < 0 ⟹ MAX ;  f″(c) > 0 ⟹ MIN ;  = 0 ⟹ test fails\n  Absolute extrema on [a, b] : compare f at critical points AND at both endpoints\n\nSTANDARD OPTIMISATION RESULTS\n  Open box from square sheet of side a, corners x cut  →  x = a/6\n  Max-area rectangle in a circle                       →  a SQUARE\n  Max-volume cylinder in a sphere of radius R          →  h = 2R/√3\n  Max-volume cone in a sphere of radius R              →  h = 4R/3\n  Window (rectangle + semicircle), perimeter P         →  height = radius = P/(4 + π)\n  Wire length L cut into square + circle, min area     →  circle piece = Lπ/(π + 4)\n  Fixed sum, min sum of squares/cubes                  →  the numbers are EQUAL\n```\n\n## Ch 7 — Integrals\n\n```\nSTANDARD\n  ∫ xⁿ dx = x^(n+1)/(n+1) + C   (n ≠ −1)      ∫ dx/x = log|x| + C\n  ∫ eˣ dx = eˣ + C                            ∫ aˣ dx = aˣ/log a + C\n\n  ∫ sin x dx = −cos x + C                     ∫ cos x dx = sin x + C\n  ∫ sec²x dx = tan x + C                      ∫ cosec²x dx = −cot x + C\n  ∫ sec x tan x dx = sec x + C                ∫ cosec x cot x dx = −cosec x + C\n  ∫ tan x dx = log|sec x| + C                 ∫ cot x dx = log|sin x| + C\n  ∫ sec x dx = log|sec x + tan x| + C         ∫ cosec x dx = log|cosec x − cot x| + C\n  ∫ dx/√(1 − x²) = sin⁻¹x + C                 ∫ dx/(1 + x²) = tan⁻¹x + C\n\nTHE NINE SPECIAL FORMS\n  ∫ dx/(x² − a²)  = (1/2a) log|(x − a)/(x + a)| + C\n  ∫ dx/(a² − x²)  = (1/2a) log|(a + x)/(a − x)| + C\n  ∫ dx/(x² + a²)  = (1/a) tan⁻¹(x/a) + C\n\n  ∫ dx/√(x² − a²) = log|x + √(x² − a²)| + C\n  ∫ dx/√(x² + a²) = log|x + √(x² + a²)| + C\n  ∫ dx/√(a² − x²) = sin⁻¹(x/a) + C\n\n  ∫ √(a² − x²) dx = (x/2)√(a² − x²) + (a²/2) sin⁻¹(x/a) + C\n  ∫ √(x² + a²) dx = (x/2)√(x² + a²) + (a²/2) log|x + √(x² + a²)| + C\n  ∫ √(x² − a²) dx = (x/2)√(x² − a²) − (a²/2) log|x + √(x² − a²)| + C     ← MINUS\n\nBY PARTS\n  ∫ u v dx = u ∫v dx − ∫ (du/dx)(∫v dx) dx\n  ILATE : Inverse, Log, Algebraic, Trig, Exponential   (choose u = the earlier one)\n  ∫ log x dx = x log x − x + C\n  ∫ eˣ [ f(x) + f′(x) ] dx = eˣ f(x) + C\n\nPARTIAL FRACTIONS (numerator degree < denominator degree; else divide first)\n  (x−a)(x−b)              → A/(x−a) + B/(x−b)\n  (x−a)²                  → A/(x−a) + B/(x−a)²\n  (x−a)(x−b)(x−c)         → A/(x−a) + B/(x−b) + C/(x−c)\n  (x−a)²(x−b)             → A/(x−a) + B/(x−a)² + C/(x−b)\n  (x−a)(x²+bx+c) irred.   → A/(x−a) + (Bx + C)/(x²+bx+c)\n\nTRIG REDUCTION\n  sin²x = (1 − cos 2x)/2        cos²x = (1 + cos 2x)/2\n  sin 2x = 2 sin x cos x        cos 2x = 1 − 2sin²x = 2cos²x − 1\n  2 sin A cos B = sin(A+B) + sin(A−B)\n  2 cos A cos B = cos(A+B) + cos(A−B)\n  2 sin A sin B = cos(A−B) − cos(A+B)\n\nDEFINITE INTEGRAL PROPERTIES\n  ∫[a,b] f = −∫[b,a] f  ;  ∫[a,a] f = 0\n  ∫[a,b] f = ∫[a,c] f + ∫[c,b] f\n  ∫[a,b] f(x)dx = ∫[a,b] f(a + b − x)dx\n  ∫[0,a] f(x)dx = ∫[0,a] f(a − x)dx                        ← the workhorse\n  ∫[0,2a] f = ∫[0,a] f(x)dx + ∫[0,a] f(2a − x)dx\n  ∫[0,2a] f = 2∫[0,a] f  if f(2a − x) = f(x) ;  = 0 if f(2a − x) = −f(x)\n  ∫[−a,a] f = 2∫[0,a] f  if f EVEN ;  = 0 if f ODD\n\n  NO +C in a definite integral.  Change the limits when you substitute.\n```\n\n## Ch 8 — Application of Integrals\n\n```\nArea (strips ∥ y-axis) = ∫[a,b] y dx\nArea (strips ∥ x-axis) = ∫[c,d] x dy\n\nBelow the axis → split at the crossing point and take |absolute value| of each piece\n\nCircle  x² + y² = a²          area = πa²  ;  quadrant = πa²/4\nEllipse x²/a² + y²/b² = 1     area = πab  ;  quadrant = πab/4\nParabola y² = 4ax             symmetric about the x-axis (double the upper half)\nParabola x² = 4ay             symmetric about the y-axis\n\n∫[0,a] √(a² − x²) dx = πa²/4\n\nSector of a circle, angle θ (radians) = (θ/2π) πa² = ½a²θ\n\nPROCEDURE: sketch → intersections → shade → choose variable → limits → evaluate → \"square units\"\n```\n\n## Ch 9 — Differential Equations\n\n```\nORDER  = order of the highest derivative\nDEGREE = power of the highest-order derivative, after clearing radicals and fractions\n         NOT DEFINED if the equation is not polynomial in its derivatives\n         (contains sin(dy/dx), log(dy/dx), e^(dy/dx))\n\nVARIABLES SEPARABLE : f(y)dy = g(x)dx  → integrate both sides, one +C\n\nHOMOGENEOUS : dy/dx = F(y/x)\n  put y = vx  and  dy/dx = v + x dv/dx     ← the \"+v\" is essential\n  separate in v and x, integrate, then substitute v = y/x back\n  (if naturally dx/dy = F(x/y), put x = vy instead)\n\nLINEAR : dy/dx + P(x)y = Q(x)\n  I.F. = e^(∫P dx)\n  y · (I.F.) = ∫ Q · (I.F.) dx + C          ← Q TIMES the I.F.\n\n  y-version : dx/dy + P(y)x = Q(y),  I.F. = e^(∫P dy),  x·(I.F.) = ∫Q·(I.F.)dy + C\n\nI.F. SHORTCUTS\n  P = k      → e^(kx)        P = 1/x   → x         P = n/x   → xⁿ\n  P = −1/x   → 1/x           P = tan x → sec x     P = cot x → sin x\n  P = −tan x → cos x\n\nGROWTH/DECAY : dN/dt = kN  →  N = N₀ e^(kt)\n```\n\n## Ch 10 — Vector Algebra\n\n```\n|a| = √(a₁² + a₂² + a₃²)          â = a/|a|\nAB = b − a                        (head minus tail)\n\nSection formula (A(a), B(b), ratio m : n)\n  internal : r = (mb + na)/(m + n)      external : r = (mb − na)/(m − n)\n  midpoint : r = (a + b)/2\n\nDirection cosines : l = a₁/|a|, m = a₂/|a|, n = a₃/|a| ;   l² + m² + n² = 1\n\nDOT (scalar)\n  a·b = |a||b| cos θ = a₁b₁ + a₂b₂ + a₃b₃           a·a = |a|²\n  cos θ = a·b / (|a||b|)\n  perpendicular ⟺ a·b = 0\n  projection of a on b = a·b/|b|                    (a SCALAR, may be negative)\n  vector projection of a on b = [ (a·b)/|b|² ] b\n  î·î = ĵ·ĵ = k̂·k̂ = 1 ;  î·ĵ = ĵ·k̂ = k̂·î = 0\n\nCROSS (vector)\n  a × b = determinant with rows  î ĵ k̂ / a₁ a₂ a₃ / b₁ b₂ b₃\n        = î(a₂b₃ − a₃b₂) − ĵ(a₁b₃ − a₃b₁) + k̂(a₁b₂ − a₂b₁)    ← middle term MINUS\n  |a × b| = |a||b| sin θ           a × b = −(b × a)          a × a = 0\n  parallel ⟺ a × b = 0\n  î×ĵ = k̂,  ĵ×k̂ = î,  k̂×î = ĵ\n\n  area of parallelogram (adjacent sides a, b) = |a × b|\n  area of parallelogram (diagonals d₁, d₂)    = ½ |d₁ × d₂|\n  area of triangle (two sides a, b)           = ½ |a × b|\n  unit vector ⊥ to both a and b               = (a × b)/|a × b|\n\n|a × b|² + (a·b)² = |a|² |b|²\n|a + b| = |a − b|  ⟺  a ⊥ b\na, b, c unit with a + b + c = 0  ⟹  a·b + b·c + c·a = −3/2\n```\n\n## Ch 11 — Three Dimensional Geometry (lines only)\n\n```\nDRs of AB = (x₂ − x₁, y₂ − y₁, z₂ − z₁) ;  divide by |AB| for direction cosines\n\nLINE through A(a) with direction b :\n  vector    : r = a + λb\n  Cartesian : (x − x₁)/a₁ = (y − y₁)/a₂ = (z − z₁)/a₃\n  general point : (a₁λ + x₁, a₂λ + y₁, a₃λ + z₁)\n\nLINE through A(a) and B(b) : r = a + λ(b − a)\n  Cartesian : (x − x₁)/(x₂ − x₁) = (y − y₁)/(y₂ − y₁) = (z − z₁)/(z₂ − z₁)\n\nANGLE between two lines : cos θ = |b₁·b₂| / (|b₁||b₂|)          ← MODULUS\n  perpendicular : a₁a₂ + b₁b₂ + c₁c₂ = 0\n  parallel      : a₁/a₂ = b₁/b₂ = c₁/c₂\n\nSKEW LINES : neither parallel nor intersecting\n\nSHORTEST DISTANCE\n  skew     : d = | (b₁ × b₂) · (a₂ − a₁) | / | b₁ × b₂ |\n  parallel : d = | b × (a₂ − a₁) | / | b |\n  d = 0 ⟹ the lines intersect\n\nFOOT OF PERPENDICULAR from P : general point Q(λ) → PQ·b = 0 → solve λ → Q\nIMAGE of P in the line        : P′ = 2Q − P\n\nBefore reading DRs, normalise so the coefficient of x, y, z inside each bracket is 1:\n  (2y − 1)/4 = (y − ½)/2\n```\n\n## Ch 12 — Linear Programming\n\n```\nZ = ax + by  (objective function) ;  inequalities are the constraints\n\nCORNER-POINT METHOD\n  1. all constraints, including x ≥ 0, y ≥ 0\n  2. boundary lines and their intercepts\n  3. graph on graph paper, scale stated, lines labelled\n  4. shade the feasible region (test the origin in each inequality)\n  5. corner points by SOLVING SIMULTANEOUS EQUATIONS — not by reading the graph\n  6. table of Z at each corner point\n  7. state the optimum: value, point, and max/min\n\nBOUNDED region   → both max and min exist, at corner points\nUNBOUNDED region → may not exist; CHECK:\n  M is the max ⟺ ax + by > M has no point in common with the feasible region\n  m is the min ⟺ ax + by < m has no point in common with the feasible region\n\nEqual Z at two corner points → infinitely many optima, all along that segment\nContradictory constraints     → empty feasible region → no feasible solution\n```\n\n## Ch 13 — Probability\n\n```\nCONDITIONAL : P(A|B) = P(A ∩ B)/P(B),  P(B) ≠ 0        ← \"given\" is the DENOMINATOR\n  P(A′|B) = 1 − P(A|B)\n  P((A ∪ C)|B) = P(A|B) + P(C|B) − P((A ∩ C)|B)\n\nMULTIPLICATION : P(A ∩ B) = P(A)P(B|A) = P(B)P(A|B)\n  P(A ∩ B ∩ C) = P(A) P(B|A) P(C|A ∩ B)               ← \"without replacement\"\n\nINDEPENDENT : P(A ∩ B) = P(A)P(B)  ⟺  P(A|B) = P(A)\n  P(A ∪ B) = P(A) + P(B) − P(A)P(B)\n  P(neither) = (1 − P(A))(1 − P(B))\n  P(at least one) = 1 − P(neither)\n  independent ≠ mutually exclusive\n  mutually exclusive with non-zero probabilities ⟹ NOT independent\n\nADDITION : P(A ∪ B) = P(A) + P(B) − P(A ∩ B)\n\nTOTAL PROBABILITY : P(A) = Σᵢ P(Eᵢ) P(A|Eᵢ)          (E₁…Eₙ a partition)\n\nBAYES : P(Eᵢ|A) = P(Eᵢ)P(A|Eᵢ) / Σⱼ P(Eⱼ)P(A|Eⱼ)\n  LAYOUT: define events → all priors → all likelihoods → formula → substitute\n  P(Eᵢ) are PRIORS ; P(Eᵢ|A) are POSTERIORS\n\nRANDOM VARIABLE\n  Σ pᵢ = 1  and  pᵢ ≥ 0                               ← use this to find an unknown constant\n  Mean = E(X) = Σ xᵢ pᵢ\n  (Variance and the Binomial distribution are OUT of syllabus)\n```\n\n---\n\n## The last-page checklist, for the exam hall\n\nBefore you hand the paper in:\n\n1. `+ C` on every indefinite integral; **no** `+ C` on any definite integral.\n2. Every vector answer written with î ĵ k̂ or an arrow.\n3. Every area answered in \"square units\"; every rate with its unit.\n4. Every graph: axes labelled, scale stated, region shaded, corner points named.\n5. Every \"prove\" ended with an explicit concluding line.\n6. Abandoned internal-choice attempts crossed out.\n7. Question numbers matching the paper.\n8. Modulus signs present in log answers, and in the angle-between-lines formula."},{"id":"fsp","title":"Formula Sheet · Physics","blurb":"Every in-syllabus formula, all 14 chapters, plus constants","body":"Everything in the current syllabus, chapter by chapter. **Deleted topics are not here** — if a\nformula you half-remember is missing, check\n[`../docs/00-exam-blueprint.md`](../docs/00-exam-blueprint.md) §3 before hunting for it; it is\nprobably out of syllabus.\n\nUse this for the daily 20-minute revision in February, and read it once on the morning of the exam.\n\n---\n\n## Constants\n\n```\nc   = 3 × 10⁸ m s⁻¹                     speed of light in vacuum\ne   = 1.6 × 10⁻¹⁹ C                     elementary charge\nh   = 6.63 × 10⁻³⁴ J s                  Planck's constant\nm_e = 9.1 × 10⁻³¹ kg                    electron mass\nε₀  = 8.854 × 10⁻¹² C² N⁻¹ m⁻²          permittivity of vacuum\nμ₀  = 4π × 10⁻⁷ T m A⁻¹                 permeability of vacuum\nR   = 1.097 × 10⁷ m⁻¹                   Rydberg constant\nR₀  = 1.2 × 10⁻¹⁵ m                     nuclear radius constant\n1 u = 1.66 × 10⁻²⁷ kg  ≡  931.5 MeV\nD   = 25 cm                             least distance of distinct vision\n\nWORKING SHORTCUTS — memorise these, they save real time\n  k = 1/4πε₀   = 9 × 10⁹ N m² C⁻²\n  1/2πε₀       = 1.8 × 10¹⁰\n  μ₀/4π        = 10⁻⁷ ;   μ₀/2π = 2 × 10⁻⁷\n  hc           = 1240 eV nm         →  E(eV) = 1240/λ(nm)\n  h/e          = 4.14 × 10⁻¹⁵ V s\n  λ(electron)  = 12.27/√V  Å        (V in volts)\n  E_n(hydrogen) = −13.6/n² eV ;  r_n = 0.53 n² Å\n```\n\n---\n\n## Ch 1 — Electric Charges and Fields\n\n```\nq = ne ;  e = 1.6 × 10⁻¹⁹ C\n\nCOULOMB : F = k q₁q₂/r²           F_medium = F_vacuum/K\nFIELD   : E = F/q₀ = k q/r²       unit N C⁻¹ = V m⁻¹\n\nDIPOLE  : p = q(2a), directed from −q to +q      unit C m\n  axial      : E = 2kpr/(r² − a²)²      → r >> a :  E = 2kp/r³   (along p)\n  equatorial : E = kp/(r² + a²)^(3/2)   → r >> a :  E = kp/r³    (antiparallel to p)\n  axial = 2 × equatorial ;  dipole field ∝ 1/r³\n  torque τ = pE sin θ = p × E ;  NET FORCE = 0 in a uniform field\n  τ max at θ = 90° ;  stable at θ = 0°, unstable at 180°\n\nFLUX  : φ = ∮E·dA = EA cos θ      unit N m² C⁻¹ = V m\nGAUSS : φ = q_enclosed/ε₀\n  independent of the surface's shape and size; external charges give ZERO net flux\n\n  infinite straight wire  : E = λ/(2πε₀ r)        ∝ 1/r\n  infinite plane sheet    : E = σ/(2ε₀)           independent of distance\n  charged spherical shell : outside E = kq/r² ;  INSIDE E = 0 ;  at surface σ/ε₀\n  charge at the centre of a cube: total flux q/ε₀ ;  through one face q/6ε₀\n\nCONDUCTOR (electrostatic equilibrium): E = 0 inside ; charge on the outer surface ;\n  E ⊥ to the surface just outside, magnitude σ/ε₀ ; whole conductor at one potential\n```\n\n## Ch 2 — Electrostatic Potential and Capacitance\n\n```\nV = W/q  (volt = J C⁻¹) ;  V = kq/r  — a SCALAR, sign carried ;  V ∝ 1/r\nSystem of charges : V = Σ kqᵢ/rᵢ                (algebraic sum)\nDipole : V = kp cos θ/r² ;  axial ±kp/r² ;  EQUATORIAL V = 0 ;  V ∝ 1/r²\nE = −dV/dr ;  uniform field between plates E = V/d\n\nEQUIPOTENTIAL SURFACE: no work done along it ; E ⊥ to it everywhere ;\n  never intersect ; closer together where E is stronger ;\n  spheres for a point charge, parallel planes for a uniform field\n\nPOTENTIAL ENERGY\n  two charges   : U = k q₁q₂/r                  (sign carried; negative ⟹ bound)\n  three charges : U = k[q₁q₂/r₁₂ + q₂q₃/r₂₃ + q₁q₃/r₁₃]\n  dipole in E   : U = −pE cos θ = −p·E ;  min −pE at θ = 0° (stable)\n  work to rotate: W = pE(cos θ₁ − cos θ₂)\n\nCAPACITANCE  C = Q/V   (farad = C V⁻¹)\n  parallel plate      : C = ε₀A/d ;  with dielectric C = Kε₀A/d\n  slab of thickness t : C = ε₀A/(d − t + t/K)\n  series   : 1/C = Σ 1/Cᵢ      (C smaller than the smallest)\n  parallel : C = Σ Cᵢ          (C larger than the largest)\n  — the OPPOSITE way round from resistors\n\n  U = ½CV² = ½QV = Q²/2C ;   energy density u = ½ε₀E²\n  net field in a dielectric : E = E₀/K\n\nDIELECTRIC INSERTED\n  battery CONNECTED    (V fixed): C ↑K ,  Q ↑K ,  E same ,  U ↑K\n  battery DISCONNECTED (Q fixed): C ↑K ,  V ↓K ,  E ↓K   ,  U ↓K\n\nTwo capacitors joined : V = (C₁V₁ + C₂V₂)/(C₁ + C₂)\n  energy lost ΔU = C₁C₂(V₁ − V₂)²/[2(C₁ + C₂)]   ≥ 0 always\n```\n\n## Ch 3 — Current Electricity\n\n```\nI = q/t = dq/dt  (ampere) ;  conventional current opposite to the electron drift\n\nv_d = eEτ/m  (~10⁻⁴ m s⁻¹) ;   I = n e A v_d\n  R = ml/(ne²Aτ) ;   ρ = m/(ne²τ)\nJ = I/A = n e v_d = σE   (a VECTOR) ;  μ = v_d/E = eτ/m ;  σ = neμ = 1/ρ\n\nR = ρl/A ;  wire stretched to n times its length → R becomes n²R\nρ_T = ρ₀[1 + α(T − T₀)]\n  metals: α > 0, ρ ↑ (τ falls, n fixed)\n  semiconductors: α < 0, ρ ↓ (n rises sharply)\n\nCELL : ε = I(R + r) ;  V = ε − Ir (discharging) ;  V = ε + Ir (charging) ;  V = ε at I = 0\n  V–I graph of a cell: intercept = ε , |slope| = r ;  short-circuit I = ε/r\n  series   : ε_eq = Σεᵢ ,  r_eq = Σrᵢ\n  parallel : ε_eq = (ε₁r₂ + ε₂r₁)/(r₁ + r₂) ,  r_eq = r₁r₂/(r₁ + r₂)\n\nKIRCHHOFF : junction rule ΣI = 0  → conservation of CHARGE\n            loop rule ΣΔV = 0     → conservation of ENERGY\n\nWHEATSTONE (balanced, I_g = 0) : P/Q = R/S           — a NULL method\nMETRE BRIDGE : R = S · l/(100 − l)\n\nP = VI = I²R = V²/R ;  maximum power to an external R when R = r\n1 kWh = 3.6 × 10⁶ J\n```\n\n## Ch 4 — Moving Charges and Magnetism\n\n```\nBIOT–SAVART : dB = (μ₀/4π) I dl sin θ/r² ;   vector (μ₀/4π) I (dl × r̂)/r²\n  circular loop, on the axis : B = μ₀NIR²/[2(R² + x²)^(3/2)]\n  at the centre              : B = μ₀NI/(2R)\n  arc subtending θ (radians) : B = μ₀Iθ/(4πR)\n\nAMPERE : ∮B·dl = μ₀ I_enclosed\n  long straight wire : B = μ₀I/(2πr)   ∝ 1/r, concentric circular field lines\n  long solenoid      : B = μ₀nI inside ;  μ₀nI/2 at an end ;  ≈ 0 outside\n\nMOVING CHARGE : F = q(v × B) = qvB sin θ\n  F ⊥ v always ⟹ NO WORK done ; speed and kinetic energy unchanged\n  v ⊥ B : r = mv/(qB) ;  T = 2πm/(qB) ;  f = qB/(2πm)   — T independent of v\n  v at an angle to B → HELICAL path\n  Lorentz : F = q(E + v × B) ;  velocity selector v = E/B\n\nCONDUCTOR : F = I(l × B) = BIl sin θ            (Fleming's left-hand rule)\n\nPARALLEL WIRES : F/l = μ₀I₁I₂/(2πd)\n  same direction → ATTRACT ;  opposite → REPEL\n  ampere: 2 × 10⁻⁷ N m⁻¹ between wires 1 m apart each carrying 1 A\n\nCURRENT LOOP : m = NIA  (A m²) ;  τ = NIAB sin θ = m × B ;  net force = 0\n  τ maximum when the PLANE of the coil is PARALLEL to B\n\nGALVANOMETER : NIAB = kφ ⟹ φ ∝ I ;  radial field keeps sin θ = 1 (uniform scale)\n  current sensitivity I_s = NAB/k\n  voltage sensitivity V_s = NAB/(kG) = I_s/G\n  → AMMETER   : shunt in PARALLEL,  S = I_g G/(I − I_g) ;  ideal R = 0, in series\n  → VOLTMETER : resistance in SERIES, R = V/I_g − G ;      ideal R = ∞, in parallel\n```\n\n## Ch 5 — Magnetism and Matter\n\n```\nFIELD LINES: continuous CLOSED loops ; N→S outside, S→N inside ; never intersect\n∮B·dA = 0  ⟹  NO MAGNETIC MONOPOLES      (contrast ∮E·dA = q/ε₀)\n\nBAR MAGNET ≡ SOLENOID :  m = NIA (solenoid) ;  m = q_m × 2l (bar magnet), S → N inside\n  cutting a magnet gives TWO complete magnets — an isolated pole is impossible\n  cut ⊥ to the length: q_m unchanged, length halved ⟹ m halved\n\nDIPOLE IN A FIELD : τ = mB sin θ = m × B ;  net force = 0 in a uniform field\n  U = −mB cos θ = −m·B ;  stable at θ = 0°, unstable at 180°\n  W(θ₁ → θ₂) = mB(cos θ₁ − cos θ₂)\n\nEARTH'S MAGNETIC ELEMENTS : declination, dip (δ), horizontal component B_H\n  B_H = B cos δ        B_V = B sin δ        B_V = B_H tan δ\n  tan δ = B_V/B_H      B = √(B_H² + B_V²)\n  magnetic equator: δ = 0°, B = B_H     magnetic poles: δ = 90°, B = B_V\n  Earth's magnetic SOUTH pole is near the geographic NORTH\n\nMATERIALS (qualitative only)\n  dia   — weakly REPELLED ; no net atomic moment ; e.g. bismuth, copper\n  para  — weakly ATTRACTED ; random permanent moments ; T-dependent ; e.g. aluminium\n  ferro — STRONGLY attracted ; domains ; lost above the CURIE temperature ; e.g. iron\n\n(χ, μ_r, M, H and hysteresis are OUT of syllabus — do not use them in answers)\n```\n\n## Ch 6 — Electromagnetic Induction\n\n```\nFLUX : φ = BA cos θ  (weber = T m²) ;  flux linkage = Nφ\nFARADAY : ε = −N dφ/dt ;  I = ε/R\n  charge q = NΔφ/R      — depends only on the TOTAL flux change, not on the time taken\n\nLENZ : the induced current OPPOSES the change in flux\n  — the minus sign in Faraday's law\n  — a consequence of CONSERVATION OF ENERGY\n\nMOTIONAL EMF : ε = Blv\n  I = Blv/R ;  F = B²l²v/R ;  P_mech = P_elec = B²l²v²/R\n  rod rotating about one end : ε = ½Bωl²\n\nEDDY CURRENTS : induced loops within the bulk of a conductor\n  minimised by a LAMINATED core\n  uses: electromagnetic braking, induction furnace, induction motor, energy meters\n\nSELF-INDUCTANCE : φ = LI ;  ε = −L dI/dt ;  unit HENRY\n  long solenoid : L = μ₀n²Al = μ₀N²A/l   (× μ_r with a core)\n  energy stored : U = ½LI²\n  L ∝ N² ;  independent of the current\n\nMUTUAL INDUCTANCE : φ₂ = MI₁ ;  ε₂ = −M dI₁/dt ;  M₁₂ = M₂₁ (reciprocity)\n  two coaxial solenoids : M = μ₀n₁n₂Al = μ₀N₁N₂A/l\n  M = k√(L₁L₂) ;  maximum when coaxial and close ;  ZERO when the axes are ⊥\n\nAC GENERATOR : Nφ = NBA cos ωt  ⟹  ε = NBAω sin ωt = ε₀ sin ωt ,  ε₀ = NBAω\n  emf MAXIMUM when the coil's PLANE is PARALLEL to B ;  zero when perpendicular\n  SLIP RINGS (not a commutator) give the alternating output\n```\n\n## Ch 7 — Alternating Current\n\n```\ni = i₀ sin ωt ;  ω = 2πf\nmean over a full cycle = 0 ;  over a half cycle = 2i₀/π = 0.637 i₀\nRMS : i_rms = i₀/√2 = 0.707 i₀ ;  v_rms = v₀/√2\n  — the DC that gives the SAME HEATING ; AC meters read rms\n  220 V mains → peak = 220√2 ≈ 311 V\n\nSINGLE ELEMENTS\n  R : V and I IN PHASE\n  L : I LAGS V by π/2 ;  X_L = ωL = 2πfL      ∝ f    (blocks high f, passes DC)\n  C : I LEADS V by π/2 ;  X_C = 1/ωC = 1/2πfC ∝ 1/f  (passes high f, BLOCKS DC)\n  \"CIVIL\": in C, I leads V ;  V leads I in L\n  average power in a pure L or a pure C = ZERO\n\nSERIES LCR (phasors)\n  Z = √(R² + (X_L − X_C)²)      tan φ = (X_L − X_C)/R      cos φ = R/Z\n  X_L > X_C → inductive, V leads I ;  X_L < X_C → capacitive, V lags I\n\nRESONANCE : X_L = X_C\n  ω₀ = 1/√(LC) ;  f₀ = 1/(2π√(LC))\n  Z MINIMUM = R ;  I MAXIMUM = V/R ;  φ = 0 ;  power factor = 1\n  Q = ω₀L/R = 1/(ω₀CR) = (1/R)√(L/C) = ω₀/Δω ,  bandwidth Δω = R/L\n  small R → sharp resonance, high Q, more selective   (an \"acceptor\" circuit)\n\nPOWER : P_avg = V_rms I_rms cos φ ;   power factor cos φ = R/Z\n  wattless current = i_rms sin φ  (consumes no average power)\n\nTRANSFORMER (mutual induction)\n  V_s/V_p = N_s/N_p = I_p/I_s\n  step-up: N_s > N_p, V↑ I↓ ;  step-down: N_s < N_p, V↓ I↑ ;  power (ideally) unchanged\n  losses → remedies: copper → thick wire ; eddy → laminated core ;\n    hysteresis → soft iron ; flux leakage → closed core, coils wound over each other\n  will NOT work on DC (dφ/dt = 0)\n  transmission at high V and low I, because the line loss is I²R\n```\n\n## Ch 8 — Electromagnetic Waves\n\n```\nDISPLACEMENT CURRENT : I_d = ε₀ dφ_E/dt\n  needed because Ampere's law is INCONSISTENT for a charging capacitor\n  Ampere–Maxwell : ∮B·dl = μ₀(I_c + ε₀ dφ_E/dt)\n  ⟹ a CHANGING ELECTRIC FIELD produces a MAGNETIC FIELD\n\nEM WAVE PROPERTIES\n  transverse ;  E ⊥ B ⊥ direction of propagation (direction along E × B)\n  need NO medium ;  c = 1/√(μ₀ε₀) = 3 × 10⁸ m s⁻¹ ;  c = E₀/B₀\n  E and B oscillate IN PHASE ;  not deflected by E or B fields (no charge)\n  carry energy AND momentum → radiation pressure\n  energy shared EQUALLY between the E and B fields:  u_E = ½ε₀E² , u_B = B²/2μ₀\n  produced by ACCELERATING charges\n  in a medium : v = c/n ,  λ → λ/n ,  FREQUENCY UNCHANGED\n\nc = νλ ;   E_photon = hν = hc/λ ;   ω = 2πν ,  k = 2π/λ ,  c = ω/k\n\nSPECTRUM (increasing frequency, decreasing wavelength):\n  RADIO → MICROWAVE → INFRARED → VISIBLE → ULTRAVIOLET → X-RAY → GAMMA\n  \"Roman Men Invented Very Unusual X-ray Guns\"\n  visible: violet ≈ 400 nm (highest f)  …  red ≈ 700 nm (lowest f)\n  radar → microwaves | remote controls → infrared | sterilising → UV\n  bone imaging → X-rays | radiotherapy → gamma\n```\n\n## Ch 9 — Ray Optics and Optical Instruments\n\n```\nSIGN CONVENTION: distances from the pole/optical centre; incident light left→right positive\n  u always negative for a real object\n  MIRROR : concave f = − , convex f = +      LENS : convex f = + , concave f = −\n\nMIRROR : 1/v + 1/u = 1/f ,  f = R/2 ,  m = −v/u\nLENS   : 1/v − 1/u = 1/f ,               m = +v/u      ← note the sign difference\n  lens maker's : 1/f = (n − 1)(1/R₁ − 1/R₂)\n  in a medium  : 1/f = (n/n_m − 1)(1/R₁ − 1/R₂)\n    n_m = n → f = ∞, the lens disappears ;  n_m > n → a convex lens DIVERGES\n  refraction at a spherical surface : n₂/v − n₁/u = (n₂ − n₁)/R\n  P = 1/f (m) = 100/f (cm) , in dioptres ; convex P > 0, concave P < 0\n  in contact : 1/F = 1/f₁ + 1/f₂ ,  P = P₁ + P₂ ,  m = m₁m₂\n\nSNELL : n₂₁ = sin i/sin r = n₂/n₁ = v₁/v₂ = λ₁/λ₂ ;   n = c/v\n  frequency UNCHANGED on refraction\n  apparent depth : n = real depth/apparent depth ;  normal shift = h(1 − 1/n)\n\nTIR : denser → rarer, AND i > C ;   sin C = 1/n\n  larger n → smaller C  (diamond n = 2.42, C ≈ 24° ;  glass n = 1.5, C ≈ 42°)\n  uses: optical fibre, totally reflecting prism, mirage, diamond's sparkle\n\nPRISM : r₁ + r₂ = A ;   i + e = A + δ\n  at minimum deviation: i = e , r₁ = r₂ = A/2 , i = (A + δm)/2\n  n = sin[(A + δm)/2] / sin(A/2)\n  thin prism : δ = (n − 1)A\n\nCOMPOUND MICROSCOPE (both f short, f_o the shorter)\n  near point : m = (v_o/u_o)(1 + D/f_e)     infinity : m = (v_o/u_o)(D/f_e)\n  long tube  : m ≈ (L/f_o)(D/f_e)\n\nASTRONOMICAL TELESCOPE (f_o large, f_e small, large aperture)\n  normal adjustment : m = f_o/f_e ,  tube length L = f_o + f_e\n  near point        : m = (f_o/f_e)(1 + f_e/D)\n  reflecting telescope advantages: no chromatic aberration, less spherical\n    aberration, brighter and higher resolution, mechanically stable, cheaper\n\nD = 25 cm (least distance of distinct vision)\n```\n\n## Ch 10 — Wave Optics\n\n```\nWAVEFRONT: locus of points in the SAME PHASE ;  a ray is ⊥ to the wavefront\n  spherical (point source) | cylindrical (slit) | plane (distant source)\n\nHUYGENS: every point on a wavefront is a source of secondary wavelets ;\n  the new wavefront is the FORWARD ENVELOPE of those wavelets\n  reflection : BC = AD = ct , triangles congruent (RHS) ⟹ i = r\n  refraction : BC = v₁t , AD = v₂t ⟹ sin i/sin r = v₁/v₂ = n₂/n₁\n\nINTERFERENCE\n  constructive : path diff = nλ        , phase diff = 2nπ\n  destructive  : path diff = (2n−1)λ/2 , phase diff = (2n−1)π\n  phase difference = (2π/λ) × path difference\n  I = I₁ + I₂ + 2√(I₁I₂) cos φ\n  I_max = (√I₁ + √I₂)² ;  I_min = (√I₁ − √I₂)²\n  I_max/I_min = (a₁ + a₂)²/(a₁ − a₂)²\n\nCOHERENT SOURCES: same frequency, CONSTANT phase difference\n  two independent lamps cannot interfere — their phase difference varies randomly\n  hence YDSE derives both beams from ONE source\n\nYDSE : path difference = yd/D\n  bright : y = nλD/d          dark : y = (2n − 1)λD/2d\n  FRINGE WIDTH  β = λD/d ;   angular width = λ/d\n  λ↑ → β↑ ;  D↑ → β↑ ;  d↑ → β↓ ;  immersed in a liquid of index n → β/n\n  one slit covered → interference disappears, only diffraction remains\n  white light → central fringe WHITE, then a few coloured fringes (violet innermost)\n\nSINGLE-SLIT DIFFRACTION\n  minima : a sin θ = nλ   (n = ±1, ±2, … ;  n ≠ 0)\n  secondary maxima : a sin θ = (2n + 1)λ/2\n  central maximum: angular half-width λ/a ;  FULL angular width 2λ/a\n  linear width on a screen at distance D = 2λD/a\n  narrower slit or longer λ → WIDER central maximum\n\nINTERFERENCE vs DIFFRACTION\n  two sources vs one wavefront | equal vs unequal fringe widths |\n  equal vs rapidly falling intensity | perfectly dark vs not perfectly dark minima\n\nPOLARISATION (low priority — verify the scope for your year)\n  proves light is TRANSVERSE ; crossed Polaroids transmit nothing\n  Malus : I = I₀ cos²θ ;   Brewster : tan θ_p = n\n```\n\n## Ch 11 — Dual Nature of Radiation and Matter\n\n```\nφ₀ = work function = hν₀ = hc/λ₀        (a property of the METAL)\nV₀ = stopping potential ;   eV₀ = K_max\nsaturation current depends on the INTENSITY\n\nEINSTEIN : hν = φ₀ + K_max = φ₀ + eV₀\n           K_max = h(ν − ν₀)\n           V₀ = (h/e)ν − φ₀/e\n\nFOUR LAWS: current ∝ intensity | K_max depends only on ν |\n           a threshold ν₀ exists | emission is instantaneous (<10⁻⁹ s)\n\nWAVE THEORY FAILS on all three: K_max should depend on intensity (it doesn't) ;\n  there should be no threshold (there is) ; there should be a time lag (there isn't)\n\nGRAPHS\n  I vs V, different INTENSITIES (same ν): different saturation currents, SAME V₀\n  I vs V, different FREQUENCIES (same I): same saturation current, DIFFERENT V₀\n  V₀ vs ν : straight line ; slope = h/e (SAME for every metal) ;\n            x-intercept = ν₀ ; y-intercept = −φ₀/e ; lines for two metals are PARALLEL\n\nPHOTON : E = hν = hc/λ ;  p = E/c = h/λ ;  rest mass 0 ;  charge 0 (undeflected)\n  intensity = (photons per unit area per second) × hν\n\nde BROGLIE : λ = h/p = h/mv ;   λ = h/√(2mK)\n  accelerated electron : λ = h/√(2meV) = 12.27/√V Å\n  λ ∝ 1/√V ;  same K → heavier particle has SHORTER λ (λ ∝ 1/√m)\n  same accelerating V → λ ∝ 1/√(mq)\n```\n\n## Ch 12 — Atoms\n\n```\nRUTHERFORD SCATTERING\n  observations: most pass through | a few small deflections | very few large (>90°)\n  conclusions : the atom is mostly EMPTY | a small dense positive NUCLEUS |\n                nucleus ~10⁻¹⁵ m vs atom ~10⁻¹⁰ m | nearly all the mass in the nucleus\n  impact parameter b: smaller b → larger scattering angle ; b = 0 → 180°\n  distance of closest approach : ½mv² = (1/4πε₀)(2e)(Ze)/r₀\n\n  RUTHERFORD FAILS: (1) an accelerating electron must radiate → the atom would\n    collapse in ~10⁻⁸ s ;  (2) it predicts a CONTINUOUS spectrum, not LINE spectra\n\nBOHR'S POSTULATES\n  1. stationary orbits — the electron revolves without radiating\n  2. angular momentum quantised : m v r = n h/2π\n  3. radiation only on a jump : hν = E_i − E_f\n\n  r_n = n²h²ε₀/(πmZe²)     → hydrogen : r_n = 0.53 n² Å        r ∝ n²\n  v_n = Ze²/(2ε₀nh)                                             v ∝ 1/n\n  E_n = −mZ²e⁴/(8ε₀²n²h²)  → hydrogen : E_n = −13.6/n² eV\n  K = −E ;   U = 2E = −2K\n\n  ground state n = 1 : E = −13.6 eV\n  ionisation energy = 13.6 eV ;   first excitation energy = 10.2 eV\n\nSERIES : Lyman (n_f = 1, UV) | BALMER (n_f = 2, VISIBLE) | Paschen (n_f = 3, IR)\n         Brackett (4) | Pfund (5)\n  1/λ = R(1/n_f² − 1/n_i²) ,  R = 1.097 × 10⁷ m⁻¹\n  (faster: ΔE from E_n = −13.6/n², then λ(nm) = 1240/ΔE(eV))\n  longest λ in a series : n_i = n_f + 1 ;  shortest (series limit) : n_i = ∞\n  number of lines from level n = n(n − 1)/2\n\nBOHR FAILS for: multi-electron atoms | line intensities | fine structure |\n                Zeeman and Stark effects | and the quantisation is unjustified\n```\n\n## Ch 13 — Nuclei\n\n```\nA = Z + N ;  ᴬ_Z X\nisotopes: same Z | isobars: same A | isotones: same N\n1 u = 1.66 × 10⁻²⁷ kg ≡ 931.5 MeV\nm_p = 1.00728 u ; m_n = 1.00867 u ; m_H atom = 1.00783 u\n\nSIZE : R = R₀ A^(1/3) ,  R₀ = 1.2 fm      ⟹  volume ∝ A ,  A ∝ R³\nDENSITY ρ ≈ 2.3 × 10¹⁷ kg m⁻³ — INDEPENDENT of A\n  (mass ∝ A and volume ∝ A, so the A cancels ⟹ nuclear matter is incompressible)\n\nNUCLEAR FORCE : strongest at nuclear range | SHORT range (~2–3 fm) |\n  CHARGE INDEPENDENT | attractive, but repulsive below ~0.8 fm |\n  SATURATED (nearest neighbours only) | spin dependent | non-central\n\nMASS DEFECT  Δm = [Z m_p + (A − Z) m_n] − M\n  (use Z m_H instead of Z m_p when ATOMIC masses are given)\nBINDING ENERGY  BE = Δm c² ;   BE(MeV) = Δm(u) × 931.5\nBE/A : larger ⟹ more stable\n\nBE/A CURVE : rises steeply to ~8 MeV by A ≈ 20 ; ~constant 8 MeV for 30 < A < 170 ;\n  PEAK ≈ 8.8 MeV at A = 56 (Fe — the most stable) ; falls to ≈ 7.6 MeV at A = 238\n  conclusions: (a) the nuclear force is short range and SATURATED\n               (b) FISSION of heavy nuclei releases energy\n               (c) FUSION of light nuclei releases energy\n  — in both cases the products have a HIGHER BE/A, i.e. lie closer to A ≈ 56\n\nFISSION : ²³⁵U + n → ¹⁴¹Ba + ⁹²Kr + 3n + ~200 MeV  (~0.9 MeV per nucleon)\n  releases 2–3 neutrons ⟹ a CHAIN REACTION is possible\nFUSION  : ²H + ³H → ⁴He + n + 17.6 MeV ;  4 ¹H → ⁴He + 26.7 MeV (the Sun)\n  needs ~10⁷ K to overcome the COULOMB BARRIER — hence \"thermonuclear\"\n  fusion gives MORE energy PER NUCLEON ; fission more per reaction\n\nQ = (mass of reactants − mass of products) c² ;   Q > 0 ⟹ energy released\nZ and A are conserved in every nuclear reaction\n\n(radioactivity, the decay law, half-life and mean life are OUT of syllabus)\n```\n\n## Ch 14 — Semiconductor Electronics\n\n```\nENERGY BANDS  (E_g = forbidden gap between the valence and conduction bands)\n  CONDUCTOR     : E_g = 0, bands overlap ;  conductivity ↓ with T\n  SEMICONDUCTOR : E_g ≈ 1 eV (Si 1.1 , Ge 0.7) ;  conductivity ↑ with T\n  INSULATOR     : E_g > 3 eV (diamond ≈ 6 eV)\n\nINTRINSIC : pure ;  n_e = n_h = n_i ;  conduction by BOTH electrons and holes\n  pairs created thermally ;  n_i rises rapidly with T ;  a perfect insulator at 0 K\n\nEXTRINSIC (doping ≈ 1 impurity atom per 10⁶ host atoms)\n  n-TYPE : PENTAVALENT dopant (P, As, Sb, Bi) = DONOR\n           majority ELECTRONS, minority holes ;  n_e >> n_h\n  p-TYPE : TRIVALENT dopant (B, Al, In, Ga) = ACCEPTOR\n           majority HOLES, minority electrons ;  n_h >> n_e\n  BOTH ARE ELECTRICALLY NEUTRAL       n_e n_h = n_i²\n\np-n JUNCTION\n  diffusion of majority carriers → immobile ions exposed → DEPLETION REGION\n    (negative acceptor ions on the p-side, positive donor ions on the n-side)\n  internal field n → p ;  BARRIER POTENTIAL V_B ≈ 0.3 V (Ge) , 0.7 V (Si)\n  equilibrium: diffusion current = drift current, net current zero\n\nFORWARD BIAS (p to +) : barrier ↓ , depletion width ↓ , current LARGE (mA) ,\n  MAJORITY carriers , resistance LOW ;  knee voltage 0.3 V Ge / 0.7 V Si\nREVERSE BIAS (p to −) : barrier ↑ , depletion width ↑ , current TINY (µA) ,\n  MINORITY carriers , resistance HIGH\n  reverse saturation current is nearly independent of voltage (limited by the number\n  of thermally generated minority carriers) but rises with temperature ;\n  breakdown at a large reverse voltage\n\nI–V CHARACTERISTIC : non-linear ⟹ the diode is NON-OHMIC\n  label the current axis mA for forward and µA for reverse\n  dynamic resistance r_d = ΔV/ΔI\n\nRECTIFIER : AC → unidirectional DC (the diode conducts one way only)\n  HALF-WAVE : 1 diode ; alternate half-cycles ; output frequency = input ;\n              efficiency ≈ 40.6%\n  FULL-WAVE : 2 diodes + CENTRE-TAPPED transformer ; both half-cycles ;\n              output frequency = 2 × input ; efficiency ≈ 81.2% ; less ripple\n  a capacitor in PARALLEL with the load acts as a FILTER, smoothing the ripple\n\n(Zener diode, LED, photodiode, solar cell, transistors and logic gates are OUT)\n```\n\n---\n\n## The last-page checklist, for the exam hall\n\nBefore you hand the paper in:\n\n1. **Every numerical has a unit.** N, C, V, A, Ω, T, F, H, W, J, eV, m, Hz.\n2. **Every graph has both axes labelled**, with quantity **and** unit — and the diode I–V has\n   **mA forward, µA reverse**.\n3. **Every ray diagram has arrowheads**, at least two rays, and F, 2F, O (and C for a mirror) marked.\n4. **Every circuit diagram is labelled** — and the full-wave rectifier's transformer is\n   **centre-tapped**.\n5. **The phasor diagram is drawn** for any LCR question, asked for or not.\n6. **Sign convention checked** on every optics numerical: u negative, concave mirror f negative,\n   concave lens f negative.\n7. **cos φ included** in every AC power calculation.\n8. **Abandoned internal-choice attempts crossed out.**\n9. **Question numbers match the paper.**\n10. **\"Distinguish between\" answers are in a two-column table**, comparing the same attribute on each\n    row."},{"id":"deriv","title":"The 30 Derivations","blurb":"Ranked in tiers, with the step people miss, plus the 14 examinable graphs","body":"**Almost every 3- and 5-mark question in the Physics paper is one of the derivations below.** There\nare 30 of them. If you can reproduce all 30 on blank paper, with diagrams, you can answer nearly\nevery long question the board can set.\n\n## How to use this list\n\n**Do not read it.** Reading a derivation is not the same as writing one under time pressure.\n\n1. Keep a **separate derivations notebook** — one derivation per page.\n2. Work through the chapter note first, then close it and write the derivation **from memory**, with\n   the diagram, on a fresh page. Date it.\n3. Revisit each one at **day 7** and **day 30**. Twenty minutes, from memory, no notes.\n4. Tick the boxes below as you get each one right **from memory**. Three ticks means you own it.\n\nThe **Tier** column tells you what to do first.\n\n| Tier | Meaning |\n| --- | --- |\n| **1** | Asked essentially every year. Non-negotiable. Do these first. |\n| **2** | Asked most years. Needed for a good score. |\n| **3** | Occasional. Do after Tiers 1 and 2 are solid. |\n\nThe **Diagram** column matters: where it says **yes**, the diagram carries its own mark and is\nawarded independently of the algebra. Draw it even when you cannot finish the derivation.\n\n---\n\n## Tier 1 — the fifteen you must own\n\n| # | Derivation | Ch | Marks | Diagram | Key step people miss | ☐☐☐ |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | **Series LCR: phasor diagram → impedance and phase angle** | 7 | 5 | **yes** | Take the current as the reference phasor; V_L up, V_C down | ☐☐☐ |\n| 2 | **Young's double slit: fringe width β = λD/d** | 10 | 3–5 | **yes** | Syllabus says \"final expression only\" — but know why β = y_(n+1) − y_n | ☐☐☐ |\n| 3 | **Prism: r₁ + r₂ = A and i + e = A + δ, then μ = sin[(A+δm)/2]/sin(A/2)** | 9 | 3–5 | **yes** | At minimum deviation i = e ⟹ r₁ = r₂ = A/2 | ☐☐☐ |\n| 4 | **Gauss's law → field of an infinite plane sheet, E = σ/2ε₀** | 1 | 3–5 | **yes** | Flux through *both* faces: φ = 2EA, not EA | ☐☐☐ |\n| 5 | **Gauss's law → field of a charged spherical shell (inside and outside)** | 1 | 5 | **yes** | Inside, q_enclosed = 0 ⟹ E = 0. Draw the E-vs-r graph | ☐☐☐ |\n| 6 | **Drift velocity → I = neAv_d → Ohm's law → ρ = m/ne²τ** | 3 | 5 | **yes** | Do **not** stop at I = neAv_d; substitute v_d = eEτ/m and E = V/l | ☐☐☐ |\n| 7 | **Capacitance of a parallel-plate capacitor with a dielectric slab** | 2 | 5 | **yes** | Split V into the air path (d − t) and the slab t | ☐☐☐ |\n| 8 | **Energy stored in a capacitor, U = ½CV², and energy density ½ε₀E²** | 2 | 3 | no | Show the integration ∫(q/C)dq — don't just state ½CV² | ☐☐☐ |\n| 9 | **Biot–Savart → field on the axis of a circular loop** | 4 | 5 | **yes** | The perpendicular components cancel in pairs; ∮dl = 2πR | ☐☐☐ |\n| 10 | **Moving-coil galvanometer: NIAB = kφ, so φ ∝ I** | 4 | 5 | **yes** | Explain *why* the field must be radial (uniform scale) | ☐☐☐ |\n| 11 | **Astronomical telescope: ray diagram + m = f_o/f_e** | 9 | 5 | **yes** | Emergent rays must be **parallel** in normal adjustment | ☐☐☐ |\n| 12 | **Compound microscope: ray diagram + m = (v_o/u_o)(1 + D/f_e)** | 9 | 5 | **yes** | The intermediate image must lie **inside** the eyepiece's focal length | ☐☐☐ |\n| 13 | **Lens maker's formula, 1/f = (n−1)(1/R₁ − 1/R₂)** | 9 | 3–5 | **yes** | Two surfaces as two labelled steps; the first image is the second object | ☐☐☐ |\n| 14 | **Einstein's photoelectric equation and the explanation of the four laws** | 11 | 3–4 | graphs | Say \"one photon, one electron\" — it carries the whole argument | ☐☐☐ |\n| 15 | **Bohr model: r_n and E_n for hydrogen** | 12 | 5 | **yes** | Eliminate v between the force balance and mvr = nh/2π | ☐☐☐ |\n\n---\n\n## Tier 2 — the twelve you should own\n\n| # | Derivation | Ch | Marks | Diagram | Key step people miss | ☐☐☐ |\n| --- | --- | --- | --- | --- | --- | --- |\n| 16 | **Gauss's law → field of an infinite straight wire, E = λ/2πε₀r** | 1 | 3 | **yes** | Justify the coaxial cylinder; the flat ends give zero flux | ☐☐☐ |\n| 17 | **Electric field on the axial line of a dipole** | 1 | 3 | **yes** | Near charge is at (r − a); do the r >> a step explicitly | ☐☐☐ |\n| 18 | **Torque on a dipole in a uniform field, τ = pE sin θ** | 1 | 3 | **yes** | State that the **net force is zero** before deriving the torque | ☐☐☐ |\n| 19 | **Potential due to a dipole, V = kp cos θ/r²; equatorial V = 0** | 2 | 3 | **yes** | Potential is a **scalar**, so it adds algebraically | ☐☐☐ |\n| 20 | **Kirchhoff's rules → Wheatstone bridge balance, P/Q = R/S** | 3 | 3–5 | **yes** | State I_g = 0 at balance first; name the conservation laws | ☐☐☐ |\n| 21 | **Two cells in parallel: ε_eq and r_eq** | 3 | 3 | **yes** | Write V = ε − Ir for each cell, then apply the junction rule | ☐☐☐ |\n| 22 | **Ampere's law → field of a long straight wire, B = μ₀I/2πr** | 4 | 3 | **yes** | Justify the circular Amperian loop by symmetry | ☐☐☐ |\n| 23 | **Force between two parallel currents, and the definition of the ampere** | 4 | 3 | **yes** | Same direction → attract. Then put I = 1 A, d = 1 m | ☐☐☐ |\n| 24 | **Motional emf, ε = Blv** | 6 | 2–3 | **yes** | φ = Blx, then differentiate. Know the Lorentz-force route too | ☐☐☐ |\n| 25 | **Self-inductance of a long solenoid, L = μ₀N²A/l** | 6 | 3 | **yes** | Substitute N = nl to convert μ₀n²Al into μ₀N²A/l | ☐☐☐ |\n| 26 | **AC generator: ε = NBAω sin ωt** | 6 | 5 | **yes** | Start from the flux linkage NBA cos ωt; label slip rings and brushes | ☐☐☐ |\n| 27 | **Transformer: V_s/V_p = N_s/N_p = I_p/I_s, with losses and remedies** | 7 | 5 | **yes** | Two Faraday equations, then divide. Pair each loss with its remedy | ☐☐☐ |\n\n---\n\n## Tier 3 — the rest\n\n| # | Derivation | Ch | Marks | Diagram | Key step people miss | ☐☐☐ |\n| --- | --- | --- | --- | --- | --- | --- |\n| 28 | **Huygens' principle → laws of reflection, and → Snell's law** | 10 | 5 | **yes** | Name the RHS congruence for reflection; BC = v₁t, AD = v₂t for refraction | ☐☐☐ |\n| 29 | **Mirror formula, 1/v + 1/u = 1/f** | 9 | 3–5 | **yes** | Name your similar triangles before writing the ratios | ☐☐☐ |\n| 30 | **Nuclear density is independent of A** | 13 | 3 | no | Mass ∝ A and volume ∝ A, so the A cancels | ☐☐☐ |\n\n---\n\n## Derivations that are NO LONGER in the syllabus\n\n**Cross these out of any old paper or question bank.** Several were guaranteed questions for a decade\nand are now worth nothing.\n\n| Deleted derivation | Was in |\n| --- | --- |\n| **Potentiometer** — principle, comparing emfs, internal resistance | Ch 3 |\n| **Cyclotron** — construction, working, resonance frequency | Ch 4 |\n| **LC oscillations** — the charge/current oscillation and the SHM analogy | Ch 7 |\n| **Resolving power** of a microscope and of a telescope | Ch 10 |\n| **Radioactive decay law** N = N₀e^(−λt); half-life; mean life | Ch 13 |\n| **Zener diode** as a voltage regulator | Ch 14 |\n| **Transistor** as an amplifier / oscillator; logic gates | Ch 14 |\n| **Human eye** defects and their correction by lenses | Ch 9 |\n| **Scattering of light** — blue sky, red sunset | Ch 9 |\n| Bar magnet's **axial and equatorial** field; **hysteresis**; susceptibility and permeability | Ch 5 |\n| **de Broglie's explanation** of Bohr's quantisation condition | Ch 12 |\n| **Davisson–Germer** experiment | Ch 11 |\n\nFull deletion list: [`../docs/00-exam-blueprint.md`](../docs/00-exam-blueprint.md) §3.\n\n---\n\n## The graphs you must be able to draw\n\nSeparate from the derivations, and worth 1–2 marks apiece. For each one, know the **shape**, the\nmeaning of the **slope**, and the meaning of the **intercepts** — because that is exactly what gets\nasked.\n\n| # | Graph | Ch | What the slope / intercepts mean | ☐☐☐ |\n| --- | --- | --- | --- | --- |\n| 1 | **Stopping potential V₀ vs frequency ν** | 11 | slope = **h/e** (same for every metal); x-intercept = ν₀; y-intercept = −φ₀/e | ☐☐☐ |\n| 2 | **Photocurrent vs collector potential**, different **intensities** | 11 | different saturation currents, **same** stopping potential | ☐☐☐ |\n| 3 | **Photocurrent vs collector potential**, different **frequencies** | 11 | **same** saturation current, different stopping potentials | ☐☐☐ |\n| 4 | **Binding energy per nucleon vs mass number** | 13 | peak ≈ 8.8 MeV at A ≈ 56 (Fe); ~7.6 MeV at A = 238 | ☐☐☐ |\n| 5 | **Diode I–V characteristic** | 14 | mA scale forward, **µA** scale reverse; mark the knee and breakdown | ☐☐☐ |\n| 6 | **Current vs frequency for a series LCR** (two values of R) | 7 | both peak at the **same** f₀; smaller R → sharper peak, higher Q | ☐☐☐ |\n| 7 | **Resistivity vs temperature** for a conductor and for a semiconductor | 3 | conductor rises (τ falls); semiconductor falls sharply (n rises) | ☐☐☐ |\n| 8 | **E vs r for a charged spherical shell** | 1 | zero inside; jumps to σ/ε₀ at r = R; then ∝ 1/r² | ☐☐☐ |\n| 9 | **Single-slit diffraction intensity distribution** | 10 | broad central maximum; minima at a sin θ = nλ | ☐☐☐ |\n| 10 | **i–δ graph for a prism** | 9 | a single minimum, at i = e | ☐☐☐ |\n| 11 | **Terminal potential difference V vs current I for a cell** | 3 | intercept = **ε**; magnitude of slope = **r** | ☐☐☐ |\n| 12 | **Energy level diagram for hydrogen** | 12 | levels at −13.6/n² eV, converging on 0; mark Lyman and Balmer | ☐☐☐ |\n| 13 | **Energy band diagrams** — conductor, semiconductor, insulator | 1
