 p-side of diode **D₂**; the n-sides of both diodes joined and connected\nthrough the **load resistance R_L** back to the **centre tap**. Mark the output across R_L.\n\n**Principle.** A p-n junction diode conducts appreciably only when it is **forward biased**. By\narranging two diodes so that one conducts on each half-cycle, current can be made to flow through the\nload in the **same direction** throughout the AC cycle.\n\n**Working.**\n\n**During the first half-cycle**, suppose the **upper end** of the secondary is positive with respect\nto the centre tap. Then:\n- **D₁ is forward biased** (its p-side is at the positive end) and **conducts**;\n- **D₂ is reverse biased** and does not conduct.\n\nCurrent flows from the upper end of the secondary, through D₁, down through R_L, and back to the\ncentre tap.\n\n**During the second half-cycle**, the polarity reverses, so the **lower end** is positive. Then:\n- **D₂ is forward biased** and **conducts**;\n- **D₁ is reverse biased** and does not conduct.\n\nCurrent now flows from the lower end of the secondary, through D₂, and **down through R_L in the same\ndirection as before**, back to the centre tap.\n\nSo current flows through the load **during both half-cycles**, and always in the **same direction** —\nthe AC input has been rectified.\n\n**Waveforms:**\n\n```\n  INPUT (AC across the whole secondary)\n                        ╱‾╲       ╱‾╲       ╱‾╲\n                       ╱   ╲     ╱   ╲     ╱   ╲\n                   ───┴─────┴───┴─────┴───┴─────┴────→ t\n                            ╲   ╱     ╲   ╱\n                             ╲_╱       ╲_╱\n\n  OUTPUT (across R_L)\n                        ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲ ╱‾╲\n                       ╱   V   V   V   V   V   ╲\n                   ───┴─────────────────────────────→ t\n                       D₁   D₂   D₁   D₂   D₁   D₂\n```\n\n*(Align the output pulses under the corresponding input half-cycles, and mark which diode conducts\nfor each pulse.)*\n\n**Output frequency.** Since one output pulse is produced for **each half-cycle** of the input, there\nare **two** output pulses per input cycle. Therefore\n\n```\n      output frequency = 2 × input frequency\n```\n\nFor a 50 Hz mains input, the ripple frequency of the output is **100 Hz**.\n\n*(A half-wave rectifier, by contrast, gives one pulse per input cycle, so its output frequency equals\nthe input frequency.)*\n\n**Note.** The output is unidirectional but still **pulsating**. A **capacitor in parallel with the\nload** acts as a filter, charging at the peaks and discharging through the load between them, and so\nsmooths the output towards steady DC. ∎\n\n### Q2 — energy band diagrams\n\n```\n      CONDUCTOR                SEMICONDUCTOR              INSULATOR\n\n  ┌──────────────┐          ┌──────────────┐          ┌──────────────┐\n  │  conduction  │          │  conduction  │          │  conduction  │\n  │     band     │          │     band     │          │     band     │\n  ├──────────────┤          └──────────────┘          └──────────────┘\n  │   OVERLAP    │              ↕ E_g ≈ 1 eV\n  │   E_g = 0    │          ┌──────────────┐              ↕ E_g > 3 eV\n  ├──────────────┤          │   valence    │\n  │   valence    │          │  band (full) │          ┌──────────────┐\n  │     band     │          └──────────────┘          │   valence    │\n  └──────────────┘                                    │  band (full) │\n                                                      └──────────────┘\n```\n\n**Distinction on the basis of the forbidden energy gap:**\n\n| | **Conductor** | **Semiconductor** | **Insulator** |\n| --- | --- | --- | --- |\n| Forbidden gap E_g | **zero** — the valence and conduction bands **overlap** (or the valence band is only partly filled) | **small**, about **1 eV** (Si 1.1 eV, Ge 0.7 eV) | **large**, more than **3 eV** (diamond ≈ 6 eV) |\n| Electrons in the conduction band at room temperature | very large number | a small but appreciable number, thermally excited across the gap | practically none |\n| Conductivity | very high | intermediate | negligible |\n| Examples | copper, silver | silicon, germanium | diamond, glass |\n\n**The essential point.** Conduction requires electrons in the **conduction band**. In a conductor\nthere are always plenty. In a semiconductor E_g ≈ 1 eV is **comparable with the thermal energy\navailable at room temperature**, so some electrons can be excited across the gap, leaving holes\nbehind. In an insulator E_g > 3 eV is **far too large** for thermal excitation at ordinary\ntemperatures, so the conduction band stays empty.\n\n### Q3 — formation of the depletion region and barrier potential\n\n*Diagram:* a bar with a p-region on the left (holes shown as ○, and after diffusion, fixed negative\nacceptor ions ⊖ near the junction) and an n-region on the right (electrons shown as ●, and fixed\npositive donor ions ⊕ near the junction). Label the depletion region, the internal field **E**\npointing from n to p, and the barrier potential V_B.\n\n**Step 1 — diffusion.** In the p-region the hole concentration is very high, and in the n-region the\nelectron concentration is very high. Because of this **concentration gradient**, as soon as the\njunction is formed:\n\n- **holes diffuse from the p-side to the n-side**, and\n- **electrons diffuse from the n-side to the p-side**.\n\nThis constitutes a **diffusion current**, directed from p to n.\n\n**Step 2 — formation of the depletion region.** When an electron diffuses away from the n-side, it\nleaves behind a **fixed (immobile) positive donor ion** in the lattice. When a hole diffuses away from\nthe p-side, it leaves behind a **fixed negative acceptor ion**.\n\nThe narrow region on either side of the junction therefore becomes **depleted of mobile charge\ncarriers** and contains only these **immobile ions** — **negative on the p-side** and **positive on\nthe n-side**. This region is called the **depletion region** (or depletion layer). Its width is\ntypically a fraction of a micrometre.\n\n**Step 3 — barrier potential.** These layers of fixed opposite charges set up an **internal electric\nfield** across the depletion region, directed from the **n-side to the p-side**. The associated\npotential difference is called the **barrier potential V_B**, with the n-side at a higher potential\nthan the p-side:\n\n```\n      V_B ≈ 0.3 V for germanium              V_B ≈ 0.7 V for silicon\n```\n\n**Step 4 — equilibrium.** The internal field **opposes further diffusion** of majority carriers. It\ndoes, however, **assist** the motion of minority carriers (the few electrons on the p-side and holes\non the n-side), sweeping them across the junction — this is the **drift current**, directed from n\nto p.\n\nDiffusion continues until the barrier is large enough that the **diffusion current is exactly\nbalanced by the drift current**. At that point the **net current across the junction is zero**, and\nthe junction is in **equilibrium** with a stable depletion region and barrier potential. ∎\n\n### Q4 — I–V characteristics of a p-n junction diode\n\n*Circuits (draw both):* for the forward characteristic — the diode with its p-side to the positive\nterminal of a battery, in series with a rheostat and a **milliammeter**, with a voltmeter across the\ndiode. For the reverse characteristic — the same circuit with the battery reversed and a\n**microammeter** in place of the milliammeter.\n\n```\n                       I (mA)\n                          │           ╱\n                          │          │\n                          │         ╱\n                          │        │      FORWARD BIAS\n                          │       ╱       (current in mA)\n                          │     ─╯\n                          │   ╱ ↑\n                          │ ╱   knee voltage\n      ────────────────────┼────────────────────→ V (volts)\n      ← reverse V         │\n                          │\n   breakdown ────►   ─────┤   REVERSE BIAS\n        │                 │   (current in µA — note the different scale)\n        ▼                 │\n                       I (µA)\n```\n\n**Forward bias — explanation of the shape.**\n\nAt small applied voltages the current is **almost zero**, because the applied voltage is not yet\nenough to overcome the **barrier potential**. Once the applied voltage exceeds the **knee (threshold)\nvoltage** — about **0.3 V for germanium** and **0.7 V for silicon** — the barrier is effectively\ncancelled, the depletion region becomes very narrow, and the **majority carriers** cross the junction\nfreely. The current then rises **very steeply and non-linearly** with voltage, and is of the order of\n**milliamperes**. The junction resistance is **low**.\n\n**Reverse bias — explanation of the shape.**\n\nThe applied field now **aids** the internal barrier field, so the barrier potential increases and the\ndepletion region widens. The **majority carriers** are therefore prevented from crossing, and the\ndiffusion current stops.\n\nHowever, a very small current does flow, carried by the **thermally generated minority carriers** —\nthe few electrons on the p-side and holes on the n-side — which the field sweeps across the junction.\nThis is the **reverse saturation current**, of the order of **microamperes**, and it is almost\n**independent of the applied voltage** because it is limited by the *number* of minority carriers\navailable rather than by the voltage. The junction resistance is **very high**.\n\nAt a sufficiently large reverse voltage the junction undergoes **breakdown**, and the reverse current\nincreases abruptly.\n\n**Conclusion.** The characteristic is markedly **non-linear** and quite different in the two\ndirections: the diode conducts easily in the **forward** direction and hardly at all in the\n**reverse** direction. It therefore acts as a **one-way valve** for current — the property that makes\nit useful as a rectifier.\n\n### Q5 — n-type vs p-type, and whether they are charged\n\n| | **n-type** | **p-type** |\n| --- | --- | --- |\n| **Dopant** | **pentavalent** (5 valence electrons) | **trivalent** (3 valence electrons) |\n| **Examples of dopant** | phosphorus, arsenic, antimony, bismuth | boron, aluminium, indium, gallium |\n| **Name of the dopant** | **donor** — it donates a free electron | **acceptor** — it accepts an electron, creating a hole |\n| **Majority carriers** | **electrons** | **holes** |\n| **Minority carriers** | holes | electrons |\n| **Carrier concentrations** | n_e >> n_h | n_h >> n_e |\n\n**Are they electrically charged?**\n\n**No — both n-type and p-type semiconductors are electrically NEUTRAL.**\n\n**Explanation.** Doping does not add any net charge to the crystal. Consider an n-type semiconductor:\neach pentavalent donor atom contributes one **free electron** (negative), but the atom itself, having\nlost that electron, becomes a **fixed positive ion** in the lattice. The two charges are equal and\nopposite, so they cancel exactly. The same argument applies to p-type material, where each acceptor\natom that accepts an electron becomes a fixed **negative** ion, balancing the mobile positive hole.\n\nThe terms \"n-type\" and \"p-type\" therefore refer only to the **sign of the majority charge carriers**\n— **not** to any net charge on the material as a whole.\n\n### Q6 — doping\n\n**Doping** is the process of deliberately adding a small, carefully controlled amount of a suitable\nimpurity to a pure (intrinsic) semiconductor in order to **increase its electrical conductivity**.\n\nThe doping level is very small — typically about **1 impurity atom per 10⁶ atoms** of the host — so\nthat the crystal structure is not disturbed.\n\n**Two pentavalent dopants:** **phosphorus (P)** and **arsenic (As)**.\n*(Also antimony, bismuth. These produce n-type material.)*\n\n**Two trivalent dopants:** **boron (B)** and **aluminium (Al)**.\n*(Also indium, gallium. These produce p-type material.)*\n\n### Q7 — half-wave rectifier\n\n*Circuit diagram:* an AC input to the primary of a transformer; the secondary connected in series\nwith a **single diode** and the **load resistance R_L**; the output taken across R_L. Label the AC\ninput, the diode, R_L and the output.\n\n**Principle.** A p-n junction diode conducts appreciably only when it is **forward biased**. So if a\nsingle diode is placed in series with a load and an AC supply, current will flow only during those\nhalf-cycles in which the diode happens to be forward biased.\n\n**Working.**\n\n**During the positive half-cycle** of the input (taking the polarity that makes the diode's p-side\npositive), the diode is **forward biased**. It offers low resistance and **conducts**, so current\nflows through R_L and an output voltage appears across it.\n\n**During the negative half-cycle**, the polarity reverses and the diode becomes **reverse biased**.\nIt offers very high resistance and essentially **does not conduct**, so the output across R_L is\npractically **zero**.\n\nThus current flows through the load in **one direction only**, during **alternate half-cycles** —\nthe AC has been rectified, though only half of each cycle is used.\n\n**Waveforms:**\n\n```\n  INPUT (AC)\n                        ╱‾╲       ╱‾╲       ╱‾╲\n                       ╱   ╲     ╱   ╲     ╱   ╲\n                   ───┴─────┴───┴─────┴───┴─────┴────→ t\n                            ╲   ╱     ╲   ╱\n                             ╲_╱       ╲_╱\n\n  OUTPUT (across R_L)\n                        ╱‾╲             ╱‾╲             ╱‾╲\n                       ╱   ╲           ╱   ╲           ╱   ╲\n                   ───┴─────┴─────────┴─────┴─────────┴─────┴──→ t\n                             (no output during the negative half-cycles)\n```\n\n**Output frequency = input frequency**, since there is one output pulse per input cycle.\n\n**Limitations** (worth a line): only half of each cycle is used, so the efficiency is low\n(about 40.6%) and the output has a large ripple. A full-wave rectifier overcomes both. ∎\n\n### Q8 — temperature dependence of conductivity: semiconductor vs metal\n\n**Semiconductor — conductivity increases with temperature.**\n\nIn a semiconductor the forbidden energy gap is small (≈ 1 eV). At low temperature very few electrons\nhave enough energy to cross it, so there are few charge carriers. As the temperature rises, more\ncovalent bonds are broken and **many more electron–hole pairs are created**, so the **number density\nof charge carriers n increases very rapidly** (roughly exponentially).\n\nSince σ = n e μ, this large increase in n dominates any decrease in the mobility μ, so the\n**conductivity increases** — equivalently, the resistivity **falls**, and the temperature coefficient\nof resistivity is **negative**.\n\n**Metal — conductivity decreases with temperature.**\n\nIn a metal the number density n of free electrons is **essentially fixed** — it is set by the number\nof atoms and does not change appreciably with temperature. But as the temperature rises the lattice\nions **vibrate more vigorously**, so the electrons **collide more frequently**, and the relaxation\ntime τ (and hence the mobility) **decreases**.\n\nWith n constant and τ falling, ρ = m/(ne²τ) **increases**, so the **conductivity decreases** and the\ntemperature coefficient of resistivity is **positive**.\n\n**The essential contrast:** in a semiconductor the dominant effect is the **large increase in the\nnumber of carriers**; in a metal the number of carriers is fixed and the dominant effect is the\n**decrease in relaxation time**.\n\n### Q9 — why the reverse saturation current is nearly voltage-independent\n\nIn reverse bias, the majority carriers are prevented from crossing the junction by the increased\nbarrier. The small reverse current is carried entirely by the **minority carriers** — the few\nelectrons present in the p-region and holes in the n-region, which are produced by **thermal\ngeneration** of electron–hole pairs.\n\nEven a small reverse voltage is enough to sweep **essentially all** of these minority carriers that\nreach the junction across it. So the current is limited not by the voltage but by the **rate at which\nminority carriers are thermally generated** — that is, by the **number available**, not by the force\ndriving them.\n\nIncreasing the reverse voltage therefore does not increase the current appreciably: the current\n**saturates** at a small value, which is why it is called the **reverse saturation current**.\n\n*(It does, however, increase markedly with **temperature**, because the rate of thermal generation of\nminority carriers rises with temperature. And at a sufficiently large reverse voltage, breakdown\noccurs and the current rises abruptly.)*\n\n### Q10 — majority carriers in n-type material\n\nAn n-type semiconductor is doped with a pentavalent (donor) impurity, each atom of which contributes\na free **electron**.\n\n**Answer: (b) electrons**\n\n### Q11 — why the forward resistance is low and the reverse resistance high\n\n**In forward bias** (p-side to the positive terminal), the applied field **opposes** the internal\nbarrier field. The barrier potential is therefore **reduced** and the **depletion region narrows**.\nOnce the applied voltage exceeds the knee voltage, the **majority carriers** — which are present in\nvery large numbers — cross the junction freely. A large current (milliamperes) flows for a small\napplied voltage, so by R = V/I the **forward resistance is low** (a few ohms to a few hundred ohms).\n\n**In reverse bias** (p-side to the negative terminal), the applied field **aids** the internal\nbarrier field. The barrier potential **increases** and the **depletion region widens**, so the\nmajority carriers cannot cross at all. Only the very few thermally generated **minority carriers**\ncontribute, giving a current of only microamperes even for a large applied voltage. Hence the\n**reverse resistance is very high** (of the order of megohms).\n\n**The ratio** of reverse to forward resistance is typically 10⁵ or more — and it is exactly this\nasymmetry that makes the diode useful as a rectifier.\n\n### Q12 — case study: silicon diode in a series circuit\n\n```\n      R = 200 Ω          Battery = 5 V          p-side towards the positive terminal\n```\n\n**(i) Forward or reverse biased?**\n\nThe **p-side is connected towards the positive terminal** of the battery. That is precisely the\ncondition for **forward bias**.\n\n**The diode is forward biased.**\n\n**(ii) Current in the circuit.**\n\nIn forward bias the conducting silicon diode drops a nearly constant **0.7 V** across itself. The\nremaining voltage appears across the resistance:\n\n```\n      Voltage across R = 5 − 0.7 = 4.3 V\n```\n\n```\n      I = 4.3/200 = 0.0215 A = 21.5 mA\n```\n\n**I = 21.5 mA**\n\n**(iii) Current if the battery were reversed.**\n\nThe diode would then be **reverse biased**. Only the tiny **reverse saturation current** would flow —\nof the order of **microamperes**, and for most purposes taken as **essentially zero**.\n\n**I ≈ 0** (a few µA at most).\n\n**(iv) Why a diode is a non-ohmic device.**\n\nAn **ohmic** device obeys Ohm's law: V ∝ I, so the ratio V/I — the resistance — is **constant**, and\nthe I–V graph is a straight line through the origin.\n\nFor a diode, the I–V characteristic is **markedly non-linear**: the current is nearly zero below the\nknee voltage and then rises very steeply, and it is completely different in the reverse direction\nfrom the forward direction. The ratio V/I is therefore **not constant** — it varies with the applied\nvoltage and even with its sign.\n\nSince the diode does not obey Ohm's law, it is called a **non-ohmic** device.\n\n### Q13 — why a semiconductor is an insulator at 0 K\n\nAt **absolute zero** there is no thermal energy available to excite electrons.\n\nIn a semiconductor the **valence band is completely full** and the **conduction band is completely\nempty**, separated by a forbidden gap of about 1 eV. Conduction requires **electrons in the\nconduction band** (and correspondingly holes in the valence band), because electrons in a completely\nfull band cannot change their state and so cannot carry a net current.\n\nAt 0 K, therefore, **no electrons can cross the gap**, the conduction band remains empty, and there\nare **no free charge carriers** at all. The semiconductor consequently behaves as a **perfect\ninsulator**.\n\nAs the temperature rises above 0 K, thermal energy begins to break covalent bonds, creating\nelectron–hole pairs and hence charge carriers — which is why the conductivity of a semiconductor\nincreases with temperature.\n\n---","test":"Time: 40 minutes. Answers below.\n\n1. *(1)* The forbidden energy gap of silicon is about\n   (a) 0.7 eV (b) 1.1 eV (c) 3 eV (d) 6 eV\n2. *(1)* In a p-type semiconductor, the majority carriers are\n   (a) electrons (b) holes (c) donor ions (d) acceptor ions\n3. *(1)* The output frequency of a full-wave rectifier fed with a 50 Hz input is\n   (a) 25 Hz (b) 50 Hz (c) 100 Hz (d) 200 Hz\n4. *(1)* Which of the following is a pentavalent dopant?\n   (a) boron (b) aluminium (c) arsenic (d) indium\n5. *(2)* What is a hole? How does it contribute to conduction?\n6. *(2)* Name the majority and minority carriers in an n-type semiconductor. Is it electrically\n   neutral?\n7. *(2)* What is the barrier potential of a p-n junction? Give its approximate value for silicon and\n   germanium.\n8. *(2)* How does the width of the depletion region change in (i) forward bias and (ii) reverse bias?\n9. *(3)* Draw the I–V characteristic of a p-n junction diode and mark the knee voltage and the\n   breakdown voltage.\n10. *(5)* Explain, with a circuit diagram and waveforms, the working of a half-wave rectifier. Why is\n    a full-wave rectifier preferred?\n11. *(3)* Distinguish between intrinsic and extrinsic semiconductors, giving three points of\n    difference.\n12. *(2)* A germanium diode is connected in series with a 100 Ω resistor and a 3 V battery in forward\n    bias. Taking the diode drop as 0.3 V, find the current.\n13. *(2)* Why is a filter capacitor used at the output of a rectifier?\n14. *(2)* Explain why doping increases the conductivity of a semiconductor so dramatically.\n\n### Answer key\n\n**1. (b) 1.1 eV.** *(Germanium is 0.7 eV; diamond about 6 eV.)*\n\n**2. (b) holes.**\n\n**3. (c) 100 Hz.** The output frequency is twice the input frequency for a full-wave rectifier.\n\n**4. (c) arsenic.** *(Boron, aluminium and indium are trivalent.)*\n\n**5.** A **hole** is the **vacancy left in a covalent bond** when a valence electron is excited into\nthe conduction band. It behaves as a **positive charge carrier** of magnitude +e. It contributes to\nconduction because a valence electron from a neighbouring bond can move into the vacancy, thereby\ncreating a new vacancy where it came from. This successive movement of valence electrons in one\ndirection is equivalent to the **motion of the hole in the opposite direction**, and so constitutes a\ncurrent. Holes move in the direction of the applied electric field; electrons move against it.\n\n**6.** **Majority carriers: electrons. Minority carriers: holes.** It **is** electrically neutral —\neach donor atom contributes one free electron but itself becomes a fixed positive ion, so the charges\ncancel exactly. \"n-type\" refers only to the sign of the majority carriers.\n\n**7.** The **barrier potential** is the potential difference developed across the depletion region of\na p-n junction, due to the layers of immobile ions on either side of the junction; it opposes further\ndiffusion of majority carriers, with the n-side at the higher potential.\n**Si ≈ 0.7 V; Ge ≈ 0.3 V.**\n\n**8.** (i) **Forward bias:** the applied field opposes the internal field, so the barrier is reduced\nand the depletion region **narrows**. (ii) **Reverse bias:** the applied field aids the internal\nfield, so the barrier is increased and the depletion region **widens**.\n\n**9.** Graph as in §4 Q4. Mark the **knee voltage** on the forward branch (0.7 V for Si, 0.3 V for Ge),\nwhere the current starts to rise steeply, and the **breakdown voltage** on the reverse branch, where\nthe reverse current rises abruptly. **Label the current axis in mA for forward and µA for reverse.**\n\n**10.** Circuit, working and waveforms as in §4 Q7.\n**Why full-wave is preferred:** (i) it uses **both** half-cycles, so its **efficiency is about\n81.2%** against 40.6% for half-wave; (ii) the output has a **much smaller ripple**, so it is closer\nto steady DC and easier to filter; (iii) the **output frequency is twice** the input, which makes\nfiltering more effective still.\n\n**11.**\n\n| | **Intrinsic** | **Extrinsic** |\n| --- | --- | --- |\n| Purity | **pure** semiconductor, no added impurity | **doped** with a suitable impurity |\n| Carrier concentrations | n_e = n_h = n_i | n_e ≠ n_h — one type dominates |\n| Conductivity | very **low**, and depends only on temperature | much **higher**, and controlled by the doping level |\n\n**12. 27 mA.** Voltage across R = 3 − 0.3 = 2.7 V. I = 2.7/100 = 0.027 A = **27 mA**.\n\n**13.** The output of a rectifier is unidirectional but **pulsating**, not steady DC. A capacitor\nconnected **in parallel with the load** **charges up** to the peak voltage during each pulse and then\n**discharges slowly through the load** during the gaps between pulses. This maintains the output\nvoltage between pulses and so greatly **reduces the ripple**, producing an output much closer to\nsteady DC.\n\n**14.** In an intrinsic semiconductor the carrier concentration n_i is very small, because an electron\nmust be excited across a gap of about 1 eV to become free — and only a tiny fraction have that much\nthermal energy at room temperature. **Doping supplies charge carriers that need almost no energy to\nbecome free**: a pentavalent donor's fifth electron is only very loosely bound (about 0.01 eV below\nthe conduction band), and a trivalent acceptor creates a hole directly. So even a doping level of one\npart in 10⁶ adds vastly more carriers than thermal excitation provides, and since σ = neμ, the\nconductivity rises by orders of magnitude.\n\n**Scoring.** Out of 29. Below 20 → this is the cheapest chapter in the paper to fix. The p-n junction\nformation, the I–V characteristic and the two rectifiers cover essentially all 7 marks. Redo §3 Q1,\nQ3 and Q4.\n\n---","tips":"**On the rectifier questions (the likely 5-marker)**\n\n1. **Three diagrams, three marks.** The **circuit**, the **input waveform** and the **output\n   waveform**. Draw all three, and **align the output under the input** in time so the correspondence\n   is visible. This is the bulk of the marks; the verbal explanation is short.\n\n2. **For the full-wave rectifier, the transformer must be shown centre-tapped**, with the two diodes'\n   p-sides at the two ends of the secondary and the load returning to the centre tap. A circuit\n   without the centre tap is a different (bridge) rectifier and loses the mark.\n\n3. **Explain both half-cycles separately**, naming which diode conducts in each and stating that the\n   current through the load is in the **same direction** both times. That last clause is the point of\n   the question.\n\n4. **State the output frequency.** Full-wave: twice the input. Half-wave: same as the input. It is\n   almost always an explicit sub-part.\n\n5. **Label every diagram**: AC input, transformer, diode(s) D₁ and D₂, load resistance R_L, output.\n\n**On the p-n junction**\n\n6. **Give the three stages in order:** diffusion → immobile ions forming the depletion region →\n   barrier potential → equilibrium when diffusion and drift currents balance. Four named steps.\n\n7. **Say which ions are on which side** — negative acceptor ions on the p-side, positive donor ions\n   on the n-side — and that the internal field points from **n to p**. These details are marked.\n\n8. **Quote the barrier potentials:** 0.7 V for Si, 0.3 V for Ge. Two numbers, easy marks, asked\n   constantly.\n\n9. **For forward/reverse bias, answer in terms of the barrier and the depletion width first**, then\n   the current, then the carriers, then the resistance. Four consequences, in that causal order.\n\n**On the I–V characteristic**\n\n10. **Label the two current scales differently — mA for forward, µA for reverse.** An I–V graph with\n    the same scale on both halves is wrong, and examiners look for this.\n\n11. **Mark the knee voltage and the breakdown voltage** on the graph.\n\n12. **When explaining the reverse branch, name the minority carriers** and say the current saturates\n    because it is limited by the *number* of thermally generated carriers, not by the voltage.\n\n13. **\"Non-ohmic\" means V/I is not constant** and the graph is not a straight line through the origin.\n    Say both.\n\n**On bands and doping**\n\n14. **Draw all three band diagrams side by side** when asked to distinguish conductors,\n    semiconductors and insulators, and **mark E_g** on each with its approximate value. The comparison\n    is on E_g — say so explicitly.\n\n15. **State that both n-type and p-type materials are electrically neutral**, and give the reason (the\n    fixed ion balances the mobile carrier). This is the single most commonly mis-answered point in the\n    chapter.\n\n16. **For temperature questions, reason through σ = neμ.** Semiconductor: n rises steeply and\n    dominates. Metal: n is fixed and τ (hence μ) falls. Naming which factor dominates is the mark.\n\n**On priorities**\n\n17. **This chapter is 7 marks from five topics.** If you have two days spare anywhere in your\n    schedule, spend them here rather than on Magnetism and Matter or EM Waves. It is the best\n    marks-per-hour trade available in the Physics syllabus."}}],"docs":[{"id":"blueprint","title":"Exam Blueprint","blurb":"Paper design, unit weightage, the full deletion list, and how CBSE marking schemes award marks","body":"Read this once, properly, before opening a single chapter. Almost every avoidable mark lost in the\nboard exam is lost because the student did not know how the paper is built.\n\n---\n\n## 1. Mathematics (Code 041)\n\n**Theory 80 marks · Internal assessment 20 marks · 3 hours**\n\n### Unit-wise weightage (official)\n\n| Unit | Chapters | Marks |\n| --- | --- | --- |\n| I. Relations and Functions | 1. Relations and Functions · 2. Inverse Trigonometric Functions | 8 |\n| II. Algebra | 3. Matrices · 4. Determinants | 10 |\n| III. Calculus | 5. Continuity & Differentiability · 6. Application of Derivatives · 7. Integrals · 8. Application of Integrals · 9. Differential Equations | **35** |\n| IV. Vectors and Three-Dimensional Geometry | 10. Vector Algebra · 11. Three Dimensional Geometry | 14 |\n| V. Linear Programming | 12. Linear Programming | 5 |\n| VI. Probability | 13. Probability | 8 |\n| | **Total** | **80** |\n\nThe CBSE syllabus document carries an explicit line: *\"No chapter-wise weightage. Care to be taken\nto cover all chapters.\"* So the numbers above are **unit** totals, and the split between chapters\ninside a unit shifts year to year. Do not use \"chapter-wise weightage\" tables from coaching sites as\na reason to skip a chapter — Application of Integrals has appeared as a 5-marker in most years\ndespite being \"only 4 marks\" on such tables.\n\n### Paper design\n\n38 questions, five sections, no overall choice (internal choice in Sections B–E).\n\n| Section | Questions | Type | Marks each | Total |\n| --- | --- | --- | --- | --- |\n| A | 1–18 | MCQ, one correct option | 1 | 18 |\n| A | 19–20 | Assertion–Reason | 1 | 2 |\n| B | 21–25 | Very Short Answer (VSA) | 2 | 10 |\n| C | 26–31 | Short Answer (SA) | 3 | 18 |\n| D | 32–35 | Long Answer (LA) | 5 | 20 |\n| E | 36–38 | Case-study / source-based | 4 | 12 |\n| | **38** | | | **80** |\n\n### Internal assessment (20)\n\n| Component | Marks |\n| --- | --- |\n| Periodic tests | 10 |\n| Mathematics activities / lab | 5 |\n| Portfolio (assignments, project work) | 5 |\n\n### Where the 5-markers come from\n\nOver the last decade, the four Section-D questions have almost always been drawn from this pool.\nPrepare **all** of it; you will then be able to pick your best four.\n\n- Matrix method / inverse of a 3×3 matrix to solve a system of three equations\n- Definite or indefinite integral (partial fractions, or a by-parts + substitution combination)\n- Area bounded by curves (line with parabola / circle / ellipse)\n- Differential equation — linear form, or homogeneous\n- Maxima–minima word problem (volume, area, cost, distance)\n- Shortest distance between two skew lines / image of a point in a line\n- Relations and functions: prove one-one and onto\n- Probability: Bayes' theorem (occasionally placed in Section D instead of C)\n\n### Where the 4-mark case studies come from\n\nThree case studies, and historically they cluster hard:\n\n1. **Probability** — a Bayes / total-probability story (factories, machines, students, diseases).\n2. **Application of derivatives** — a maxima–minima story (a box, a window, a wire cut in two, cost).\n3. **Linear programming, 3D geometry, or a differential-equation growth/decay story** — this third\n   slot is the variable one.\n\nEach case study has 2–3 parts, usually `2 + 2` or `1 + 1 + 2`, with an internal choice in the last part.\n\n---\n\n## 2. Physics (Code 042)\n\n**Theory 70 marks · Practical 30 marks · 3 hours**\n\n### Unit-wise weightage (official)\n\nCBSE publishes Physics weightage in **paired units**. That pairing is itself information: it tells\nyou the board balances marks across the pair, not chapter by chapter.\n\n| Units | Chapters | Marks |\n| --- | --- | --- |\n| I. Electrostatics + II. Current Electricity | 1. Electric Charges and Fields · 2. Electrostatic Potential and Capacitance · 3. Current Electricity | 16 |\n| III. Magnetic Effects of Current and Magnetism + IV. Electromagnetic Induction and Alternating Currents | 4. Moving Charges and Magnetism · 5. Magnetism and Matter · 6. Electromagnetic Induction · 7. Alternating Current | 17 |\n| V. Electromagnetic Waves + VI. Optics | 8. Electromagnetic Waves · 9. Ray Optics and Optical Instruments · 10. Wave Optics | **18** |\n| VII. Dual Nature of Radiation and Matter + VIII. Atoms and Nuclei | 11. Dual Nature of Radiation and Matter · 12. Atoms · 13. Nuclei | 12 |\n| IX. Electronic Devices | 14. Semiconductor Electronics | 7 |\n| | **Total** | **70** |\n\nTwo things follow immediately:\n\n- **Optics is the largest single block.** Ray Optics alone typically carries ~10 of those 18 marks.\n  It is the last chapter you should ever leave incomplete.\n- **Semiconductor Electronics is 7 marks from one short chapter with a small syllabus.** It is the\n  highest marks-per-hour chapter in the paper. Students skip it because it is last in the book;\n  that is a free 7 marks handed away.\n\n### Paper design\n\n33 questions, five sections, no overall choice (internal choice in Sections B–E).\n\n| Section | Questions | Type | Marks each | Total |\n| --- | --- | --- | --- | --- |\n| A | 1–12 | MCQ | 1 | 12 |\n| A | 13–16 | Assertion–Reason | 1 | 4 |\n| B | 17–21 | Very Short Answer | 2 | 10 |\n| C | 22–28 | Short Answer | 3 | 21 |\n| D | 29–30 | Case-study based | 4 | 8 |\n| E | 31–33 | Long Answer | 5 | 15 |\n| | **33** | | | **70** |\n\n### Practical / internal assessment (30)\n\n| Component | Marks |\n| --- | --- |\n| Two experiments (one from each section) | 7 + 7 = 14 |\n| Practical record (experiments + activities) | 5 |\n| One activity from any section | 3 |\n| Investigatory project | 3 |\n| Viva on experiments, activities and project | 5 |\n\n### Where the 5-markers come from\n\nSection E is three questions, and CBSE almost always spreads them across three *different* blocks —\ntypically one from Electrostatics/Current Electricity, one from Magnetism/EMI/AC, and one from\nOptics. Each is usually \"derivation + application\" or \"derivation + numerical\".\n\nThe recurring pool:\n\n- Ray optics: lens/mirror formula derivation, refraction through a prism, compound microscope or\n  astronomical telescope (magnification + ray diagram)\n- Wave optics: Young's double slit — fringe width derivation; single-slit diffraction\n- AC: series LCR circuit with phasor diagram, impedance, resonance; transformer\n- EMI: AC generator, self/mutual inductance, motional emf\n- Moving charges: Biot–Savart applications (loop axis), Ampere's law (solenoid/toroid),\n  moving coil galvanometer, force between parallel currents\n- Electrostatics: Gauss's law applications (shell, wire, sheet), capacitor with dielectric, energy stored\n- Current electricity: Wheatstone bridge, metre bridge, drift velocity → Ohm's law\n\n### Where the 4-mark case studies come from\n\nTwo case studies, four sub-parts each carrying 1 mark, or 3 + 1. The reliable sources are Ray\nOptics (a lens/mirror or human-eye passage), Semiconductor Electronics (a diode/rectifier passage),\nCurrent Electricity (cells, internal resistance) and Photoelectric Effect (a graph passage).\n\n---\n\n## 3. Deleted topics — do not study these\n\nThese were removed in the rationalised syllabus and have **not** been asked since. Verify against\nthe current-year CBSE syllabus PDF at the start of the session, but as of the 2025-26 and 2026-27\ndocuments, all of the following are out.\n\n### Mathematics\n\n| Chapter | Deleted |\n| --- | --- |\n| 1. Relations and Functions | Composition of functions, invertible functions, binary operations |\n| 2. Inverse Trigonometric Functions | Graphs of inverse trig functions, elementary properties (the `2 tan⁻¹x` identities etc.) |\n| 3. Matrices | Elementary row/column operations, inverse by elementary operations, existence of non-zero matrices whose product is the zero matrix, proof of uniqueness of inverse |\n| 4. Determinants | Properties of determinants (the evaluate-by-properties questions), minors/cofactors as a standalone topic beyond what is needed for adjoint |\n| 5. Continuity & Differentiability | Rolle's theorem, Lagrange's Mean Value Theorem and their geometric interpretation |\n| 6. Application of Derivatives | Tangents and normals, approximations, rate of change of *bodies* framing beyond simple rates |\n| 7. Integrals | Definite integral as a limit of a sum; some special integral forms |\n| 8. Application of Integrals | Area between two curves (only area under simple curves, and area between a line and a circle/parabola/ellipse, remain) |\n| 9. Differential Equations | Formation of a differential equation whose general solution is given; equations reducible to homogeneous form |\n| 10. Vector Algebra | Scalar triple product |\n| 11. Three Dimensional Geometry | **All plane topics** — equation of a plane, angle between two planes, angle between a line and a plane, distance of a point from a plane, coplanarity of lines |\n| 12. Linear Programming | Diet / transportation / manufacturing problem *types* as named categories; problems with more than three non-trivial constraints |\n| 13. Probability | Variance and standard deviation of a random variable; Bernoulli trials and the Binomial distribution |\n\n> **The two that trip students up most:** planes are gone from 3D Geometry, and the Binomial\n> distribution is gone from Probability. Older question banks, YouTube playlists and second-hand\n> notes are full of both. If a practice paper asks you the equation of a plane or `nCr p^r q^(n-r)`,\n> it is an old paper.\n\n### Physics\n\n| Chapter | Deleted |\n| --- | --- |\n| 2. Electrostatic Potential and Capacitance | Van de Graaff generator |\n| 3. Current Electricity | Potentiometer (theory **and** practical), carbon resistors and colour code |\n| 4. Moving Charges and Magnetism | Cyclotron |\n| 5. Magnetism and Matter | Magnetic susceptibility and permeability, hysteresis, electromagnets and permanent magnets, para/dia/ferro treated quantitatively |\n| 7. Alternating Current | LC oscillations |\n| 10. Wave Optics | Resolving power of microscope and telescope, validity of ray optics, polarisation by scattering |\n| 13. Nuclei | Radioactivity — alpha, beta, gamma decay, decay law, half-life and mean life |\n| 14. Semiconductor Electronics | Zener diode and voltage regulator, optoelectronic devices (LED, photodiode, solar cell), transistors, transistor as amplifier/oscillator, logic gates |\n\n> **Consequence for Ch 14:** what remains is small and highly predictable — energy bands, intrinsic\n> vs extrinsic semiconductors, p-n junction formation, diode I–V characteristics, and diode as a\n> half-wave / full-wave rectifier. Seven marks, five topics. Learn it in a weekend.\n\n---\n\n## 4. The marking scheme, and how marks are actually awarded\n\nThis is the part no textbook tells you.\n\n**CBSE marks answers against a step-list, not against the final answer.** The marking scheme for a\n5-mark derivation might read: diagram ½, statement of the law ½, setting up the expression 1,\nalgebra 2, final result 1. Which means:\n\n1. **A correct final answer with no working scores a fraction of the marks.** Show the steps.\n2. **A wrong final answer with correct method scores most of the marks.** Never leave a numerical\n   blank because you cannot finish it — write the formula, substitute, and go as far as you can.\n3. **Diagrams and labels carry independent marks.** A ray diagram in Optics, a phasor diagram in AC,\n   a circuit diagram, a feasible-region graph in LP, a shaded-area sketch in Application of\n   Integrals — each is worth ½ to 1 mark *on its own*, awarded even if the rest is wrong. Draw it\n   even when the question does not explicitly say \"draw\".\n4. **Units carry marks in Physics.** A numerical answer without a unit typically loses ½ mark. So\n   does an answer with the wrong unit.\n5. **Vector answers must look like vectors.** In Maths, if the answer is a vector and you write it\n   without the arrow/î ĵ k̂ form, expect to lose the last mark.\n6. **\"State\" vs \"Derive\" vs \"Explain\" are different instructions.** *State* wants the statement, one\n   or two lines, no derivation — do not waste eight minutes deriving. *Derive* wants every algebraic\n   step. *Explain* wants reasoning in words plus, usually, a diagram.\n\n**Time budget.** 3 hours for 80 marks (Maths) is ~2 min/mark with 20 minutes spare; 3 hours for 70\nmarks (Physics) is ~2.3 min/mark with 25 minutes spare. Spend the 15-minute reading time marking\nwhich internal-choice option you will attempt, and which order you will attempt sections in.\n\n**Order to attempt.** Not 1 → 38. Do the section you are strongest in first to bank marks and settle\nnerves — for most students that is Section A (MCQs) then Section D/E (the long ones, while you are\nfresh), then B and C. Attempt every numerical you have a formula for, even partially.\n\n---\n\n## 5. Answer-sheet discipline\n\n- Write the question number in the margin, exactly as on the paper. Marks are lost every year to\n  mis-numbered answers.\n- If you attempt a question and then attempt the internal-choice alternative too, **cross out the\n  one you don't want**. Otherwise the examiner marks the first one, whichever that was.\n- Start each answer on a new line, not a new page — but do leave two blank lines between answers.\n- Box or underline every final answer.\n- Never use pencil except for diagrams and graphs.\n- Rough work goes on the last page, marked \"Rough work\" — not in the margins."},{"id":"plan","title":"Study Plans","blurb":"Three plans by time remaining, plus the error-log habit","body":"Two plans. Pick by how much time is left.\n\n- **Plan A — Full session (April → February).** The one to follow if you are starting on time.\n- **Plan B — 100 days.** If you are starting in November/December.\n- **Plan C — 30 days.** Triage. Read the honesty note before using it.\n\nAll plans assume board exams in **late February / March**, with pre-boards in **December/January**.\n\n---\n\n## The two rules that matter more than the plan\n\n**Rule 1 — Learn a chapter, then immediately do its PYQs.** Not \"finish the syllabus, then start\nPYQs in January\". A chapter you learnt in June and first tested in January is a chapter you will\nlearn twice. Every chapter note in this repo has its PYQ set attached for exactly this reason.\n\n**Rule 2 — Revise on a schedule, not on a feeling.** After finishing a chapter, revisit it at\n**day 7** and **day 30** — 20 minutes each time, formula box plus two hard PYQs. Two short revisits\nbeat one long re-read, by a wide margin. Keep a table:\n\n| Chapter | Learnt | Day-7 revisit | Day-30 revisit | Test score |\n| --- | --- | --- | --- | --- |\n| M-05 Continuity & Diff. | 12 Jun | 19 Jun | 12 Jul | 82% |\n\nThat table is your actual study plan. Everything below is just the first column.\n\n---\n\n## Plan A — Full session\n\n### Sequencing logic\n\nMaths and Physics are studied **in parallel**, not one then the other, because school teaches them\nin parallel and because Physics needs calculus you learn in Maths.\n\nTwo ordering choices are deliberate:\n\n- **Maths starts with Matrices/Determinants, not Chapter 1.** Relations & Functions is abstract and\n  is a poor confidence-builder in April. Algebra is mechanical, scores fast, and is only 10 marks —\n  finish it early and it never worries you again.\n- **Physics follows book order (Electrostatics → Semiconductors).** Physics genuinely builds:\n  potential needs field, EMI needs magnetism, AC needs EMI. Don't reorder Physics.\n\n### Term 1: April → September (finish 80% of syllabus)\n\n| Weeks | Maths | Physics |\n| --- | --- | --- |\n| **Apr, wk 1–2** | Ch 3 Matrices · Ch 4 Determinants | Ch 1 Electric Charges and Fields |\n| **Apr, wk 3–4** | Ch 1 Relations and Functions · Ch 2 Inverse Trig | Ch 2 Electrostatic Potential and Capacitance |\n| **May, wk 1–2** | Ch 5 Continuity and Differentiability | Ch 2 (cont.) · Ch 3 Current Electricity |\n| **May, wk 3–4** | Ch 5 (cont.) · Ch 6 Application of Derivatives | Ch 3 (cont.) — **Unit I+II done (16 marks)** |\n| **Jun, wk 1–2** | Ch 6 (cont.) | Ch 4 Moving Charges and Magnetism |\n| **Jun, wk 3–4** | Ch 7 Integrals — start | Ch 4 (cont.) · Ch 5 Magnetism and Matter |\n| **Jul, wk 1–2** | Ch 7 Integrals — indefinite, all methods | Ch 6 Electromagnetic Induction |\n| **Jul, wk 3–4** | Ch 7 Integrals — definite, properties | Ch 7 Alternating Current |\n| **Aug, wk 1–2** | Ch 8 Application of Integrals | Ch 7 (cont.) — **Unit III+IV done (17 marks)** |\n| **Aug, wk 3–4** | Ch 9 Differential Equations | Ch 8 EM Waves · Ch 9 Ray Optics — start |\n| **Sep, wk 1–2** | Ch 10 Vector Algebra | Ch 9 Ray Optics — lenses, prism |\n| **Sep, wk 3–4** | Ch 11 Three Dimensional Geometry | Ch 9 Ray Optics — instruments |\n\n**Milestone, end of September:** Maths Ch 1–11 done (75 of 80 marks covered). Physics Ch 1–9 done\n(about 50 of 70 marks). Half-yearly exams fall here — treat them as a real dress rehearsal.\n\n### Term 2: October → December (finish syllabus + first full revision)\n\n| Weeks | Maths | Physics |\n| --- | --- | --- |\n| **Oct, wk 1–2** | Ch 12 Linear Programming · Ch 13 Probability | Ch 10 Wave Optics — **Unit V+VI done (18 marks)** |\n| **Oct, wk 3–4** | **Syllabus complete.** Revision round 1: Unit III Calculus | Ch 11 Dual Nature · Ch 12 Atoms |\n| **Nov, wk 1–2** | Revision round 1: Algebra, Vectors & 3D | Ch 13 Nuclei · Ch 14 Semiconductor Electronics — **syllabus complete** |\n| **Nov, wk 3–4** | Revision round 1: Relations, LP, Probability | Revision round 1: Electrostatics + Current Electricity |\n| **Dec, wk 1–2** | Full 80-mark mock #1, self-scored against marking scheme | Revision round 1: Magnetism + EMI + AC |\n| **Dec, wk 3–4** | Mock #2 + error log review | Revision round 1: Optics + Modern Physics + Semiconductors, full 70-mark mock #1 |\n\n**Milestone, end of December:** whole syllabus covered once, revised once, two full mocks per subject\nwritten under exam conditions. Pre-boards will now be a formality rather than a shock.\n\n### Term 3: January → February (PYQs and mocks only — no new learning)\n\n| Weeks | Both subjects |\n| --- | --- |\n| **Jan, wk 1** | Last 5 years' board papers, one per day, timed, alternating subjects |\n| **Jan, wk 2** | Years 6–10 of PYQs. Maintain the **error log** (see below) |\n| **Jan, wk 3** | CBSE official sample paper + 3 more mocks each. Re-derive the full [derivations list](../physics/derivations-list.md) on blank paper |\n| **Jan, wk 4** | Revision round 2, driven *entirely* by the error log — only weak topics |\n| **Feb, wk 1–2** | Mocks every alternate day. Formula sheets daily, 20 min each subject |\n| **Feb, wk 3** | Formula sheets, marking-scheme language, error log. **Nothing new.** Sleep normally |\n\n### Weekly rhythm inside Plan A\n\nAssume ~3 hours/day on these two subjects (the rest of the day belongs to your other three subjects).\n\n| Day | Maths | Physics |\n| --- | --- | --- |\n| Mon | 1 h new topic | 1 h new topic + 30 min numericals |\n| Tue | 1 h new topic + 30 min PYQs | 1 h new topic |\n| Wed | 1 h new topic | 1 h new topic + 30 min derivation practice |\n| Thu | 1 h PYQs | 1 h PYQs |\n| Fri | 1 h new topic | 1 h new topic |\n| Sat | 90 min: chapter test from these notes | 90 min: chapter test from these notes |\n| Sun | 60 min: day-7 and day-30 revisits (both subjects). Rest of the day off | — |\n\nSunday off is part of the plan, not a failure of it.\n\n---\n\n## Plan B — 100 days (starting ~mid-November)\n\nYou cannot cover everything at equal depth. Cover everything at *unequal* depth, deliberately.\n\n### Days 1–45: high-weightage core\n\n**Maths (in this order):**\n1. Ch 7 Integrals (the single largest source of marks in the paper)\n2. Ch 5 Continuity and Differentiability\n3. Ch 3 Matrices + Ch 4 Determinants (fast, mechanical, 10 marks)\n4. Ch 6 Application of Derivatives\n5. Ch 10 Vector Algebra + Ch 11 3D Geometry (14 marks, very formula-driven — high return)\n6. Ch 9 Differential Equations\n7. Ch 13 Probability + Ch 12 Linear Programming (13 marks, both small)\n8. Ch 8 Application of Integrals\n9. Ch 1 + Ch 2 (8 marks, mostly MCQ-level after deletions)\n\n**Physics (in this order):**\n1. Ch 9 Ray Optics (largest single chapter)\n2. Ch 3 Current Electricity\n3. Ch 2 Electrostatic Potential and Capacitance\n4. Ch 7 Alternating Current + Ch 6 EMI\n5. Ch 4 Moving Charges and Magnetism\n6. Ch 10 Wave Optics\n7. Ch 14 Semiconductor Electronics (7 marks, tiny syllabus — do not skip)\n8. Ch 11 Dual Nature + Ch 12 Atoms + Ch 13 Nuclei\n9. Ch 1 Electric Charges and Fields\n10. Ch 5 Magnetism and Matter + Ch 8 EM Waves (small after deletions, mostly 1–2 markers)\n\nFor each chapter: *Brief* → formula box → *PYQs with solutions* → *Test yourself*. Skip nothing\ninside a chapter you have decided to do; a half-learnt chapter scores worse than a skipped one\nbecause it eats the same time.\n\n### Days 46–75: PYQs\n\nLast 10 years, chapter-wise first (all Integrals questions together, all Optics questions together —\npattern recognition builds far faster this way), then 6 full papers per subject in chronological order.\n\n### Days 76–100: mocks and the error log\n\nOne full paper every alternate day, alternating subjects. Score it yourself, harshly. Every dropped\nmark goes in the error log. Final week: error log + formula sheets only.\n\n---\n\n## Plan C — 30 days (triage)\n\n**Be honest about what this is.** In 30 days you are playing for a solid pass and a decent\npercentage, not for 95. That is a perfectly reasonable goal, and the way to hit it is ruthless\nprioritisation — not trying to do everything badly.\n\n### The 60% rule\n\nRoughly 60% of both papers comes from a minority of the syllabus. Target that, completely.\n\n**Maths — the 30-day list (~55 of 80 marks):**\n\n| Do completely | Marks reachable |\n| --- | --- |\n| Ch 7 Integrals: standard forms, substitution, by parts, partial fractions, definite-integral properties | ~12 |\n| Ch 3 + Ch 4: inverse of 3×3, solving equations by matrix method, adjoint, properties | ~10 |\n| Ch 10 + Ch 11: dot/cross product, projection, angle, line equations, shortest distance | ~14 |\n| Ch 13 Probability: conditional probability, total probability, Bayes | ~8 |\n| Ch 12 Linear Programming: graphical method, corner-point rule | ~5 |\n| Ch 5: continuity at a point, differentiability, chain rule, implicit, logarithmic | ~6 |\n\n**Physics — the 30-day list (~45 of 70 marks):**\n\n| Do completely | Marks reachable |\n| --- | --- |\n| Ch 9 Ray Optics: mirror/lens formula, refraction, prism, TIR, microscope + telescope | ~10 |\n| Ch 3 Current Electricity: Ohm's law, drift velocity, resistivity, cells in series/parallel, Kirchhoff, Wheatstone | ~7 |\n| Ch 2 Potential & Capacitance: potential due to charge/dipole, equipotentials, capacitance, dielectric, energy | ~6 |\n| Ch 7 AC: LCR series, impedance, resonance, power factor, transformer | ~6 |\n| Ch 14 Semiconductors: whole chapter | ~7 |\n| Ch 10 Wave Optics: YDSE fringe width, single-slit diffraction, polarisation | ~5 |\n| Ch 11 Dual Nature: photoelectric effect, Einstein's equation, de Broglie | ~4 |\n\n### 30-day shape\n\n- **Days 1–18:** the lists above, roughly one chapter per 2 days, brief + formulas + PYQs.\n- **Days 19–25:** last 5 years' PYQs, chapter-wise, restricted to the topics you studied.\n- **Days 26–29:** two full mocks per subject. Attempt *everything*, including topics you skipped —\n  MCQs from unstudied chapters are often guessable, and Assertion–Reason often is too.\n- **Day 30:** formula sheets. Sleep 8 hours.\n\n### What you are giving up\n\nRelations & Functions proofs, Application of Integrals, Differential Equations beyond the linear\nform, Magnetism and Matter, Atoms and Nuclei derivations, EM Waves detail. You will lose marks\nthere. Attempt their MCQs anyway.\n\n---\n\n## The error log — the highest-return habit in this document\n\nOne page per subject, maintained from day one. For every mark you drop in any test:\n\n| Date | Q | Chapter | What went wrong | Category |\n| --- | --- | --- | --- | --- |\n| 14 Jan | 32 | M-07 Integrals | Forgot to change limits after substitution | **Method** |\n| 14 Jan | 28 | P-09 Optics | Sign convention: took u positive | **Concept** |\n| 16 Jan | 21 | M-04 Determinants | Arithmetic slip in cofactor | **Careless** |\n| 16 Jan | 33 | P-07 AC | Didn't draw the phasor diagram | **Presentation** |\n\nFour categories, and each has a different fix:\n\n- **Concept** — go back to the chapter *Brief*. This is the only category that needs re-learning.\n- **Method** — you knew the concept but not the standard procedure. Drill 5 more of the same type.\n- **Careless** — arithmetic, transcription, sign slips. Fix by *slowing down the first line* of every\n  question, not by working more problems.\n- **Presentation** — missing diagram, missing unit, no final statement, unlabelled graph. Free\n  marks. Fix by re-reading section 4 of the [blueprint](00-exam-blueprint.md) once a week.\n\nIn the last two weeks, count your categories. If most entries are *Careless* or *Presentation*, you\ndo not need more study — you need slower, more disciplined writing. Most students in February get\nthis diagnosis exactly backwards and study more when they should be writing more carefully.\n\n---\n\n## Practical / internal assessment — 20 (Maths) + 30 (Physics)\n\nFifty marks, and they are the easiest fifty in the year. Do not treat them as an afterthought.\n\n- **Physics practical file:** write it up as you go, not the week before. Each experiment needs aim,\n  apparatus, theory with formula, diagram, observation table, calculation, result with error, and\n  precautions. The diagram and the observation table are where marks are actually lost.\n- **Physics viva (5 marks):** the examiner asks about the *theory* of your experiments — least count,\n  why zero error matters, the formula's origin. Know the theory of every experiment in your file.\n- **Physics investigatory project (3 marks):** choose something you can explain in two minutes.\n- **Maths portfolio and activities (10 marks):** neatness and completeness are the whole mark. Hand\n  it in on time.\n- **Periodic tests (Maths, 10 marks):** these are averaged. A bad September test costs you board\n  percentage. Take each one seriously."},{"id":"answer","title":"How to Answer","blurb":"Answer templates for every question type in the paper","body":"The blueprint tells you what the paper looks like. This tells you what to *write*.\n\nEach question type below has a fixed template. Learn the template and you stop making decisions\nunder time pressure — which is where marks go.\n\n---\n\n## Universal rules\n\n1. **Formula → substitution → answer.** Three lines, every numerical, both subjects. The middle line\n   is where the method marks live.\n2. **Draw the diagram, always.** Even when unasked. A ray diagram, circuit, phasor diagram,\n   feasible region, or shaded-area sketch carries its own ½–1 mark and is awarded independently.\n3. **Units in Physics, arrows on vectors in Maths.** Both cost ½ mark each time.\n4. **Never leave a question blank.** Write the formula. Write what is given. Partial method marks are\n   real, and Assertion–Reason/MCQs have no negative marking.\n5. **Underline or box the final answer**, and state it as a sentence when the question asked in words\n   (\"Hence the focal length is 20 cm\").\n\n---\n\n## Section A — MCQs (1 mark)\n\n**Time: 45 seconds each. Hard limit.**\n\n- Do not solve fully if you can eliminate. Check units, signs, limiting cases, and order of magnitude.\n- **Physics dimension trick:** if options differ in units or dimensions, dimensional analysis alone\n  usually settles it without any physics.\n- **Maths:** substitute a convenient value (x = 0, 1, or π/2) into the given and the options.\n- Circle the option letter **and** write the option's content. If the letter is ambiguous the\n  examiner reads the content.\n- Anything taking over 90 seconds: mark it, move on, come back. Never sink 5 minutes into 1 mark.\n\n## Section A — Assertion–Reason (1 mark)\n\nThe standard four options:\n\n- (a) Both A and R true, and R **is** the correct explanation of A\n- (b) Both A and R true, but R is **not** the correct explanation of A\n- (c) A true, R false\n- (d) A false, R true\n\n**Method — three separate judgements, in this order.** Do not shortcut it.\n\n1. Is A true, on its own?\n2. Is R true, on its own? (R is often a correct textbook statement that is simply irrelevant.)\n3. Only if both are true: does R *cause/explain* A?\n\nThe trap is almost always at step 3 — two true statements where R explains something else. When both\nare true and you are genuinely unsure whether R explains A, **(a) is more often correct than (b)** in\nCBSE papers. Use that only as a tiebreak, never as a substitute for step 3.\n\n## Section B — Very Short Answer (2 marks)\n\n**Two marks = two scoring points.** Find them before writing.\n\n- \"State X and write its SI unit\" → the statement is 1, the unit is 1. Both, explicitly.\n- \"Define X. Write its dimensional formula.\" → same structure.\n- A 2-mark numerical → formula (1) + substitution and answer with unit (1).\n- A 2-mark \"why/how\" → the reason (1) + the consequence (1).\n\n**Do not over-write.** A 2-mark answer is 2–4 lines. Writing half a page earns nothing extra and\ncosts you time in Section E. This is the single most common time leak in Physics.\n\n## Section C — Short Answer (3 marks)\n\n**Three marks = three scoring points**, and in Physics one of them is very often the diagram.\n\nTypical splits:\n- Physics derivation: diagram (1) + set-up (1) + result (1)\n- Physics numerical: formula (1) + substitution (1) + answer with unit (1)\n- Maths integral: correct method choice/substitution (1) + integration (1) + simplification and `+C` (1)\n- Maths \"prove that\": start from LHS (1) + key manipulation (1) + reach RHS with a concluding line (1)\n\nAlways end a proof with an explicit closing line — \"= RHS, hence proved\". The examiner looks for it.\n\n## Section D (Physics) / Section E (Maths) — Case-study (4 marks)\n\n- **Read the passage last.** Read the sub-questions first, then mine the passage for exactly the\n  numbers you need. Reading the passage first wastes 90 seconds.\n- Sub-parts are independent. Getting (i) wrong does not stop you scoring (ii), (iii), (iv) — unless\n  you carry a wrong number forward, so recompute rather than reuse when it's cheap.\n- The last sub-part usually has an internal choice (OR). Read both, pick fast, **cross out the one\n  you abandoned**.\n- Answers here are short — one or two lines each. Do not write essays.\n\n## Section E (Physics) / Section D (Maths) — Long Answer (5 marks)\n\nThe highest-value questions in the paper, and the most template-driven.\n\n**Physics 5-marker — the fixed order:**\n1. **Labelled diagram** (½–1 mark) — ray diagram, circuit, phasor, field lines. First, before any algebra.\n2. **State the principle or law** you are using, in words (½ mark).\n3. **Set up** the governing equation from that law (1 mark).\n4. **Derive** — every algebraic step, no jumps (1½–2 marks).\n5. **Box the result**, and state what each symbol means if you introduced new ones (½ mark).\n6. **Then** do the numerical or application part, formula → substitution → answer with unit.\n\nIf you are stuck on the algebra, write steps 1, 2 and 5 anyway — the diagram, the law, and the known\nfinal result. That is often 2 of 5 marks recovered from a question you could not do.\n\n**Maths 5-marker — the fixed order:**\n1. Write what is given, in symbols.\n2. Name the method in one line (\"Using integration by parts with u = …, dv = …\", \"By matrix method,\n   AX = B so X = A⁻¹B\").\n3. Full working, one step per line. Never combine two algebraic moves on one line.\n4. For area problems: sketch the region and shade it *before* integrating, and write the limits with\n   a one-line justification of where they came from (the intersection points).\n5. Final answer boxed, with units if the problem had them (cm², cubic units, etc.).\n\n---\n\n## Subject-specific patterns worth memorising\n\n### Physics: the \"derive + numerical\" hybrid\n\nMost 5-markers are `derivation (3) + numerical using that result (2)`. Students derive well and then\nrun out of time on the numerical, or skip the derivation to reach the numerical. Do the derivation\nproperly — it is the bigger half — and give the numerical its three lines.\n\n### Physics: graph questions\n\nEvery graph answer needs **both axes labelled with quantity and unit**, the shape correct, and any\nintercept/slope/asymptote marked. Common ones: photoelectric (stopping potential vs frequency;\ncurrent vs potential for different intensities), V–I for a diode, impedance vs frequency for LCR,\nbinding energy per nucleon vs mass number, resistivity vs temperature for conductor/semiconductor.\nLearn the *intercept meaning* of each — that is what gets asked.\n\n### Physics: \"distinguish between\" questions\n\nAnswer in a **two-column table**, three points minimum, comparing the *same* attribute on each row.\nComparing different attributes on each side scores badly.\n\n### Maths: integration — choose the method in the first 15 seconds\n\n| If the integrand looks like | Try |\n| --- | --- |\n| f(g(x))·g'(x) | substitution |\n| product of unrelated functions | by parts, ILATE order |\n| rational, denominator factorises | partial fractions |\n| 1/(quadratic) or 1/√(quadratic) | complete the square → standard form |\n| involves √(a²−x²), √(a²+x²), √(x²−a²) | trig substitution x = a sinθ, a tanθ, a secθ |\n| definite, limits symmetric about 0 | check odd/even property first |\n| definite, limits 0 to a | try the f(x) → f(a−x) property |\n\nSpending 15 seconds classifying beats 5 minutes of a wrong method.\n\n### Maths: Bayes' theorem — the fixed layout\n\nAlways write it as: define events → write all priors P(Eᵢ) → write all likelihoods P(A|Eᵢ) → write\nthe formula → substitute. Laid out that way, you cannot mix up numerator and denominator, which is\nthe standard way this question is lost.\n\n### Maths: Linear Programming — the fixed layout\n\n1. Tabulate constraints and write them as inequalities, including x ≥ 0, y ≥ 0.\n2. Draw the graph on **graph paper**, scale stated, lines labelled with their equations.\n3. Shade the feasible region and **name every corner point with its coordinates** (solve the\n   simultaneous equations to get them — do not read them off the graph).\n4. Table of Z at each corner point.\n5. State max/min, at which point, and whether the region is bounded. If unbounded, do the extra\n   check (test whether the open half-plane Z > max, or Z < min, has any common point with the\n   feasible region) — this is the mark most students lose.\n\n---\n\n## The last 10 minutes\n\nDo not start a new question. Instead:\n\n1. Check every numerical has a **unit**.\n2. Check every vector answer has an **arrow or î ĵ k̂ form**.\n3. Check every graph has **labelled axes**.\n4. Check you crossed out abandoned internal-choice attempts.\n5. Check question numbers match the paper.\n6. Check every `∫` in an indefinite integral ended with **`+ C`**.\n\nThat checklist is worth 3–5 marks in a typical paper. It is the cheapest revision you will ever do."},{"id":"pyqm","title":"What Repeats · Maths","blurb":"Topic-by-topic frequency and P1/P2/P3 priorities","body":"Read [`README.md`](README.md) in this folder for how the Freq and Priority bands are defined and what\nthey are and are not.\n\nOnly **current-syllabus** topics appear here. Deleted topics (composite/invertible functions, inverse\ntrig identities, tangents & normals, area between two curves, planes in 3D, Binomial distribution,\nand the rest) are listed in [`../docs/00-exam-blueprint.md`](../docs/00-exam-blueprint.md) §3.\n\n---\n\n## The 60-mark core\n\nIf you learn nothing else, learn these fourteen question types. Together they have historically\ncovered around 60 of 80 marks.\n\n| # | Question type | Chapter | Marks | Freq |\n| --- | --- | --- | --- | --- |\n| 1 | Solve 3 linear equations by matrix method (X = A⁻¹B) | 4 | 5 | Every year |\n| 2 | Integration by partial fractions | 7 | 3–5 | Every year |\n| 3 | Bayes' theorem word problem | 13 | 4–5 | Every year |\n| 4 | Linear differential equation, dy/dx + Py = Q | 9 | 3–5 | Every year |\n| 5 | Maxima–minima word problem | 6 | 4–5 | Every year |\n| 6 | Shortest distance between two skew lines | 11 | 3–5 | 9/10 |\n| 7 | Continuity at a point — find k | 5 | 2–3 | Every year |\n| 8 | Definite integral using the f(x) → f(a−x) property | 7 | 3 | 9/10 |\n| 9 | Linear programming, graphical, corner-point | 12 | 4–5 | Every year |\n| 10 | Area bounded by a line and a circle/parabola | 8 | 5 | 8/10 |\n| 11 | Prove a relation is an equivalence relation | 1 | 2–3 | 8/10 |\n| 12 | Projection / angle / area using dot and cross product | 10 | 2–3 | Every year |\n| 13 | Logarithmic or implicit differentiation | 5 | 3 | Every year |\n| 14 | Integration by parts (ILATE) | 7 | 3 | Every year |\n\n---\n\n## Unit I — Relations and Functions (8 marks)\n\n### Ch 1. Relations and Functions\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Check reflexive / symmetric / transitive for a given relation | 2–3 | Every year | **P1** |\n| Prove a relation is an equivalence relation; find an equivalence class | 3–5 | 8/10 | **P1** |\n| Prove a function is one-one and onto (bijective) | 3–5 | 7/10 | **P1** |\n| Counting: number of relations / functions / one-one functions on a small set | 1 | 7/10 | P2 |\n| Identify from a graph or arrow diagram whether a function is injective/surjective | 1 | 5/10 | P2 |\n| Modify domain/codomain to make a function bijective | 1–2 | 4/10 | P3 |\n\n**Pattern note.** After the deletion of composition and invertible functions, this chapter shrank\nsharply. What remains is highly stereotyped: a relation defined by \"a − b is divisible by n\", or\n\"|a − b| is even\", or on a set of triangles/lines, and you must classify it. And a function like\nf(x) = (4x+3)/(6x−4) or f(x) = x² on a restricted domain, to be shown bijective.\n\n**The trap.** For *transitive*, students test one example and declare it transitive. Transitivity\nmust be argued in general — take arbitrary (a,b) and (b,c) in R and show (a,c) ∈ R. For a *counter*\nexample, one concrete pair is enough and that asymmetry is exactly what CBSE tests.\n\n### Ch 2. Inverse Trigonometric Functions\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Principal value of sin⁻¹ / cos⁻¹ / tan⁻¹ of a given number | 1–2 | Every year | **P1** |\n| Domain and range (principal value branch) of an inverse trig function | 1 | Every year | **P1** |\n| Evaluate a composite like sin(cos⁻¹ x), tan(sin⁻¹ x) | 1–2 | 7/10 | P2 |\n| Evaluate sin⁻¹(sin θ) / cos⁻¹(cos θ) where θ is *outside* the principal branch | 1–2 | 8/10 | **P1** |\n| Sum/simplify two inverse trig terms | 2 | 4/10 | P3 |\n\n**Pattern note.** Now almost entirely a Section-A chapter. The single most-asked idea is\nsin⁻¹(sin θ) for θ outside [−π/2, π/2] — e.g. sin⁻¹(sin(3π/4)) = π/4, not 3π/4. It appears as an\nMCQ nearly every year because it separates students who memorised \"they cancel\" from students who\nknow the range.\n\n---\n\n## Unit II — Algebra (10 marks)\n\n### Ch 3. Matrices\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Find unknowns from a matrix equation (equate corresponding elements) | 1–2 | Every year | **P1** |\n| Symmetric / skew-symmetric: identify, or express A as sum of both | 2–3 | 8/10 | **P1** |\n| Compute AB, verify (AB)ᵀ = BᵀAᵀ | 2 | 7/10 | P2 |\n| Order of a matrix / number of elements / number of possible matrices | 1 | 8/10 | P2 |\n| A² = A or A² = I type: find the matrix or a scalar | 2–3 | 6/10 | P2 |\n| Diagonal elements of a skew-symmetric matrix are zero (as MCQ/AR) | 1 | 6/10 | P2 |\n| Transpose and its properties | 1–2 | 6/10 | P2 |\n\n**Pattern note.** With elementary row operations deleted, matrix inversion moved fully into\nDeterminants (via adjoint). What is left in Ch 3 is arithmetic and the symmetric/skew-symmetric\nstructure — quick marks, and often in Section A or B.\n\n### Ch 4. Determinants\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Solve a system of 3 equations by matrix method | 5 | Every year | **P1** |\n| Find A⁻¹ using adj A for a 3×3 matrix | 3–5 | Every year | **P1** |\n| Verify A(adj A) = |A|I | 2–3 | 6/10 | P2 |\n| |kA| = kⁿ|A|, |adj A| = |A|ⁿ⁻¹, |A⁻¹| = 1/|A| | 1 | Every year | **P1** |\n| Area of a triangle / collinearity of three points by determinant | 1–2 | 7/10 | P2 |\n| Value of x from a given determinant equation | 1–2 | 7/10 | P2 |\n| Consistency / inconsistency of a system from |A| and (adj A)B | 1–3 | 5/10 | P2 |\n| Cofactor / minor of a specific element | 1 | 6/10 | P2 |\n\n**Pattern note.** This is the most reliable 5-mark question in the entire paper. The system-of-three-\nequations question has appeared in essentially every session for a decade, sometimes dressed as a\nword problem (three people buying three items; award money split three ways). The dressing changes;\nthe method never does.\n\n**The trap.** Students compute adj A but forget it is the transpose of the cofactor matrix, and skip\nthe transpose step. Also: the sign pattern `+ − + / − + − / + − +` for cofactors. Both cost the whole\nquestion.\n\n---\n\n## Unit III — Calculus (35 marks) — the half of the paper\n\n### Ch 5. Continuity and Differentiability\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Find k / a / b so a piecewise function is continuous at a point | 2–3 | Every year | **P1** |\n| Logarithmic differentiation — y = xˣ, xʸ = yˣ, y = (f)^(g) | 3 | Every year | **P1** |\n| Implicit differentiation | 2–3 | Every year | **P1** |\n| Parametric differentiation (x = f(t), y = g(t)) | 2–3 | 8/10 | **P1** |\n| Second-order derivative; prove a relation like (1−x²)y″ − xy′ − a²y = 0 | 3–5 | 8/10 | **P1** |\n| Differentiability at a point / continuity ⇏ differentiability | 1–2 | 7/10 | P2 |\n| Chain rule on a composite of 3 functions | 2 | Every year | **P1** |\n| Continuity of |x|, [x] (greatest integer), and similar | 1 | 6/10 | P2 |\n| Derivative of inverse trig composites, e.g. d/dx tan⁻¹((1−x)/(1+x)) | 3 | 6/10 | P2 |\n\n**Pattern note.** Rolle's and Mean Value Theorem are deleted, which removed the one \"theory\" question\nfrom this chapter. It is now purely mechanical — and therefore fully learnable. The\n`prove (1−x²)y″ − xy′ = a²y` family (from y = (sin⁻¹x)² or y = e^(a sin⁻¹x)) recurs constantly as a\n5- or 3-marker.\n\n### Ch 6. Application of Derivatives\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Maxima/minima word problem (volume, area, cost, distance, cone in sphere) | 4–5 | Every year | **P1** |\n| Find intervals where f is strictly increasing / decreasing | 3 | Every year | **P1** |\n| Show f is increasing/decreasing on a given interval | 2–3 | 8/10 | **P1** |\n| Absolute maximum and minimum on a closed interval | 3 | 6/10 | P2 |\n| Local maxima/minima by first or second derivative test | 2–3 | 8/10 | **P1** |\n| Simple rate of change (radius, area, volume w.r.t. time) | 2 | 6/10 | P2 |\n| Case-study framed optimisation | 4 | 7/10 | **P1** |\n\n**Pattern note.** With tangents/normals and approximations deleted, this chapter is now *only*\nmonotonicity and optimisation. That concentration makes it very high-return: two question types\ncovering the whole chapter.\n\nThe recurring optimisation problems, almost verbatim across years: largest cone inscribed in a\nsphere; cylinder of maximum volume in a sphere/cone; open box from a square sheet with corners cut;\nwindow as rectangle + semicircle with fixed perimeter; wire of given length cut into a square and a\ncircle; shortest distance from a point to a curve; two posts and a wire. Learn these seven and you\nhave seen the question.\n\n**The trap.** Not verifying it is a maximum. Write the second-derivative test (or a sign table)\nexplicitly — that is a full mark. Also: answering with the *variable* value when the question asked\nfor the maximum *volume*.\n\n### Ch 7. Integrals — the single biggest chapter in the paper\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Partial fractions | 3–5 | Every year | **P1** |\n| Integration by parts (ILATE), incl. ∫eˣ(f + f′)dx | 3 | Every year | **P1** |\n| Substitution | 2–3 | Every year | **P1** |\n| Definite integral via ∫[0,a] f(x)dx = ∫[0,a] f(a−x)dx | 3 | 9/10 | **P1** |\n| 1/(ax²+bx+c) or 1/√(ax²+bx+c) — complete the square | 3 | 9/10 | **P1** |\n| ∫ with modulus, e.g. ∫[−1,2]\\|x\\|dx or \\|x−1\\| | 2–3 | 7/10 | P2 |\n| Odd/even property on symmetric limits | 1–2 | 7/10 | P2 |\n| Trig integrals: sin/cos powers, 1/(a + b sin x) type | 3 | 7/10 | P2 |\n| (px+q)/√(quadratic) type | 3 | 6/10 | P2 |\n| ∫[0,π/2] with the sin↔cos symmetry | 3 | 6/10 | P2 |\n| Standard forms straight from the table | 1 | Every year | **P1** |\n\n**Pattern note.** Integrals typically supplies **8–12 marks** of the paper on its own, spread across\none 5-marker, one or two 3-markers, and 1–2 MCQs. It is the highest-return chapter in Mathematics.\nDefinite-integral-as-a-limit-of-a-sum is deleted, which removed the one genuinely unpleasant topic.\n\n**The trap.** Forgetting `+ C`. Forgetting to change limits after substituting in a *definite*\nintegral (either change them, or back-substitute — pick one and be consistent). Both are routinely\nworth a mark each.\n\n### Ch 8. Application of Integrals\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Area bounded by a line and a circle | 5 | 7/10 | **P1** |\n| Area bounded by a line and a parabola | 5 | 7/10 | **P1** |\n| Area under a simple curve between two ordinates | 3 | 6/10 | P2 |\n| Area of a region of an ellipse | 5 | 4/10 | P2 |\n| Area using symmetry (multiply a quadrant by 4) | 3–5 | 6/10 | P2 |\n| Area bounded by \\|x\\| or \\|y\\| type | 3 | 4/10 | P3 |\n\n**Pattern note.** \"Area between two curves\" in general is deleted; what remains is area under a\nsimple curve, and area between a **line** and a circle/parabola/ellipse. That is a much smaller and\nmore predictable target than the old syllabus, but the question is still usually a full 5-marker —\nso per-mark it is worth real time.\n\n**The trap.** Not sketching the region. The sketch carries a mark, and without it students routinely\nintegrate over the wrong interval or forget to split the integral at the intersection point.\n\n### Ch 9. Differential Equations\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Linear DE: dy/dx + Py = Q, integrating factor | 3–5 | Every year | **P1** |\n| Homogeneous DE of first order and degree (substitute y = vx) | 3–5 | 8/10 | **P1** |\n| Variable separable, with a particular solution from an initial condition | 3 | 9/10 | **P1** |\n| Order and degree of a given DE | 1 | Every year | **P1** |\n| Verify a given function is a solution | 1–2 | 5/10 | P2 |\n| Growth/decay or word-problem framing (case study) | 4 | 4/10 | P2 |\n| General solution of a simple dy/dx = f(x) | 1–2 | 6/10 | P2 |\n\n**Pattern note.** Formation of a DE from a general solution, and equations reducible to homogeneous\nform, are both deleted. So the chapter is now exactly three solving methods. Identify which of the\nthree you are looking at in the first 10 seconds and this chapter becomes free marks.\n\n**The trap.** Writing the integrating factor as e^∫P dx but then integrating Q instead of Q·(I.F.).\nThe solution is y·(I.F.) = ∫Q·(I.F.)dx + C. Write that line down as a template before substituting.\n\n---\n\n## Unit IV — Vectors and Three-Dimensional Geometry (14 marks)\n\n### Ch 10. Vector Algebra\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Unit vector in the direction of a given vector / along a+b | 1–2 | Every year | **P1** |\n| Angle between two vectors using the dot product | 2 | Every year | **P1** |\n| Projection of a on b | 1–2 | Every year | **P1** |\n| Area of a triangle / parallelogram using the cross product | 2–3 | 9/10 | **P1** |\n| Find λ so that two vectors are perpendicular or parallel | 1–2 | 9/10 | **P1** |\n| Direction cosines / direction ratios of a vector | 1–2 | 8/10 | **P1** |\n| Show \\|a+b\\| = \\|a−b\\| ⟺ a ⊥ b, and similar identities | 2–3 | 6/10 | P2 |\n| Section formula / position vector of a dividing point | 2 | 6/10 | P2 |\n| a·b and a×b of î ĵ k̂ combinations (MCQ) | 1 | Every year | **P1** |\n| \\|a×b\\|² + (a·b)² = \\|a\\|²\\|b\\|² | 2 | 4/10 | P3 |\n\n**Pattern note.** Scalar triple product is deleted. What remains is a small, dense formula set that\ngenerates 1- and 2-mark questions in volume — probably the best marks-per-minute in the paper if the\nformula box is genuinely memorised.\n\n### Ch 11. Three Dimensional Geometry — **lines only**\n\n| Topic | Marks | Freq | Priority |\n| --- | --- | --- | --- |\n| Shortest distance between two skew lines | 3–5 | 9/10 | **P1** |\n| Angle between two lines (vector or Cartesian form) | 2–3 | 9/10 | **P1** |\n| Vector and Cartesian equation of a line through two points | 2–3 | Every year | **P1** |\n| Equation of a line through a point, parallel to a given line | 1–2 | 8/10 | **P1** |\n| Foot of the perpendicular from a point to a line | 3–5 | 7/10 | **P1** |\n| Image (reflection) of a point in a line | 5 | 6/10 | P2 |\n| Show two lines intersect; find the point of intersection | 3–5 | 6/10 | P2 |\n| Direction cosines of a line; check perpendicularity/parallelism | 1–2 | Every year | **P1** |\n| Distance between two parallel lines | 3 | 4/10 | P3 |\n\n**Pattern note.** This is the chapter most distorted by old material. **Every plane topic is deleted**\n— no equation of a plane, no angle between planes, no distance of a point from a plane, no\ncoplanarity. Roughly half of every pre-2023
