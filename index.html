= q(2a)              direction: from −q towards +q\n```\n\nSI unit: C m. Note the direction convention — it is asked.\n\n**Field on the axial line** (on the line joining the charges, at distance r from the centre):\n\n```\n      Exact:            E = (1/4πε₀) · 2pr/(r² − a²)²\n      For r >> a:       E = (1/4πε₀) · 2p/r³\n```\n\nDirection: **along p** (parallel to the dipole moment).\n\n**Field on the equatorial line** (perpendicular bisector, at distance r from the centre):\n\n```\n      Exact:            E = (1/4πε₀) · p/(r² + a²)^(3/2)\n      For r >> a:       E = (1/4πε₀) · p/r³\n```\n\nDirection: **antiparallel to p**.\n\n> **Two facts that get asked directly.** (i) The axial field is **twice** the equatorial field at the\n> same distance, for a short dipole. (ii) A dipole field falls off as **1/r³**, faster than the 1/r²\n> of a point charge — because the two opposite charges partly cancel at large distances.\n\n**Torque on a dipole in a uniform field E:**\n\n```\n      τ = pE sin θ                  vector form:  τ = p × E\n```\n\nwhere θ is the angle between **p** and **E**.\n\n- **Net force** on a dipole in a **uniform** field is **zero** (the two forces are equal and\n  opposite) — but the net torque is not, so the dipole rotates without translating.\n- τ is **maximum** (= pE) when θ = 90°, and **zero** when θ = 0° or 180°.\n- **Stable equilibrium** at θ = 0° (p parallel to E); **unstable** at θ = 180°.\n\n### Electric flux\n\n```\n      dφ = E · dA = E dA cos θ                φ = ∮ E · dA\n```\n\nθ is the angle between **E** and the **area vector** (the outward normal to the surface).\n\nSI unit: N m² C⁻¹ (equivalently V m).\n\nFlux is a **scalar**. It is positive for outward field, negative for inward.\n\n### Gauss's theorem\n\n**Statement.** The total electric flux through any **closed** surface equals 1/ε₀ times the total\ncharge **enclosed** by that surface.\n\n```\n      φ = ∮ E · dA = q_enclosed / ε₀\n```\n\n**Key consequences that get asked:**\n\n- The flux depends **only on the enclosed charge** — not on the shape or size of the surface, and\n  not on charges **outside** it (those contribute zero net flux).\n- A closed surface with no charge inside has **zero net flux**, even if there is a field passing\n  through it.\n\n**Choosing the Gaussian surface.** The whole art is picking a surface on which E has constant\nmagnitude and a simple angle to the normal — which means matching the symmetry of the charge\ndistribution. **You must state this choice and its justification** — it is a mark.\n\n### The three Gauss's law applications\n\nThese three derivations are the backbone of the chapter. Learn all three.\n\n**(a) Infinitely long straight charged wire**, linear charge density λ (C m⁻¹).\n\n*Gaussian surface:* a **coaxial cylinder** of radius r and length l.\n*Symmetry:* E is radial and has the same magnitude everywhere on the curved surface; the flux\nthrough the two flat ends is zero because E is parallel to those surfaces.\n\n```\n      φ = E × (2πrl)          and         q_enclosed = λl\n\n      E (2πrl) = λl/ε₀\n⟹     E = λ/(2πε₀ r)          i.e.  E ∝ 1/r\n```\n\n**(b) Uniformly charged infinite plane sheet**, surface charge density σ (C m⁻²).\n\n*Gaussian surface:* a **cylinder (or cuboid) with its flat faces parallel to the sheet**, one on each\nside.\n*Symmetry:* E is perpendicular to the sheet and the same magnitude on both faces; the curved surface\ncontributes no flux.\n\n```\n      φ = E A + E A = 2EA          and         q_enclosed = σA\n\n      2EA = σA/ε₀\n⟹     E = σ/(2ε₀)\n```\n\n**E is independent of the distance from the sheet** — a uniform field. That independence is the\nasked fact.\n\n*(For a charged conducting plate with charge on both surfaces, the field just outside is\nE = σ/ε₀ — twice as large. Read the question for which case is meant.)*\n\n**(c) Uniformly charged thin spherical shell** of radius R with total charge q.\n\n*Gaussian surface:* a **concentric sphere** of radius r.\n\n**Outside (r > R):**\n\n```\n      E (4πr²) = q/ε₀\n⟹     E = (1/4πε₀) q/r²\n```\n\n— identical to the field of a point charge q at the centre.\n\n**Inside (r < R):**\n\n```\n      q_enclosed = 0\n⟹     E = 0\n```\n\n**The field inside a uniformly charged spherical shell is zero.** This appears as an MCQ or\nAssertion–Reason almost every year on its own.\n\n**On the surface (r = R):** E = (1/4πε₀) q/R² = σ/ε₀.\n\n### Conductors in electrostatic equilibrium\n\n- The electric field **inside** a conductor is **zero**.\n- All excess charge resides on the **outer surface**.\n- The field just outside is **perpendicular** to the surface, of magnitude σ/ε₀.\n- The whole conductor (including its surface) is at the **same potential**.\n\n### Quick recall box\n\n```\nq = ne,  e = 1.6 × 10⁻¹⁹ C          k = 1/4πε₀ = 9 × 10⁹ N m² C⁻²\nε₀ = 8.854 × 10⁻¹² C² N⁻¹ m⁻²\n\nCoulomb :  F = k q₁q₂/r²      F_medium = F_vacuum/K\nField   :  E = F/q₀ = k q/r²          unit N C⁻¹ = V m⁻¹\n\nDIPOLE :  p = q(2a), directed from −q to +q\n  axial      (r >> a) : E = 2kp/r³        along p\n  equatorial (r >> a) : E = kp/r³         antiparallel to p\n  axial = 2 × equatorial ;  dipole field ∝ 1/r³\n  torque τ = pE sin θ = p × E ;  net force in a uniform field = 0\n  stable at θ = 0°, unstable at θ = 180°\n\nFLUX :  φ = ∮E·dA = EA cos θ            unit N m² C⁻¹\nGAUSS:  φ = q_enclosed/ε₀               (independent of surface shape; outside charges give 0)\n\n  infinite wire  :  E = λ/(2πε₀ r)          ∝ 1/r\n  infinite sheet :  E = σ/(2ε₀)             independent of distance\n  spherical shell:  outside E = kq/r² ;  INSIDE E = 0 ;  surface E = σ/ε₀\n\nCONDUCTOR: E = 0 inside ; charge on outer surface ; E ⊥ surface, magnitude σ/ε₀\n```\n\n---","pyq":"**Q1.** *(5 marks)* State Gauss's theorem. Using it, derive an expression for the electric field due\nto a uniformly charged infinite plane sheet of surface charge density σ.\n\n**Q2.** *(5 marks)* Using Gauss's law, obtain the electric field due to a uniformly charged thin\nspherical shell of radius R and charge q at a point (i) outside and (ii) inside the shell. Sketch a\ngraph of E against r.\n\n**Q3.** *(3 marks)* Derive an expression for the electric field at a point on the axial line of an\nelectric dipole. Hence write the expression for a short dipole.\n\n**Q4.** *(3 marks)* Derive an expression for the torque acting on an electric dipole placed in a\nuniform electric field. When is it maximum?\n\n**Q5.** *(3 marks)* Using Gauss's law, derive an expression for the electric field due to an\ninfinitely long straight uniformly charged wire.\n\n**Q6.** *(2 marks)* State any three properties of electric field lines. Why can two field lines\nnever intersect?\n\n**Q7.** *(2 marks)* A charge q is placed at the centre of a cube of side a. What is the electric flux\nthrough (i) the whole cube and (ii) one face of the cube?\n\n**Q8.** *(2 marks)* Two point charges of +4 μC and −2 μC are 10 cm apart in air. Find the force\nbetween them. What happens to this force if the space between them is filled with a medium of\ndielectric constant 5?\n\n**Q9.** *(1 mark, MCQ)* The electric field inside a uniformly charged thin spherical shell is\n(a) kq/r² (b) kq/R² (c) zero (d) σ/ε₀\n\n**Q10.** *(4 marks, case study)* A thin spherical shell of radius 10 cm carries a uniformly\ndistributed charge of 5 × 10⁻⁸ C.\n(i) Find the electric field at a point 5 cm from the centre.\n(ii) Find the electric field at a point 20 cm from the centre.\n(iii) Find the surface charge density.\n(iv) What is the total flux through a concentric sphere of radius 15 cm?\n\n**Q11.** *(2 marks)* An electric dipole of dipole moment 4 × 10⁻⁹ C m is placed at 30° to a uniform\nelectric field of 5 × 10⁴ N C⁻¹. Find the torque acting on it.\n\n**Q12.** *(1 mark, Assertion–Reason)*\n**A:** The electric flux through a closed surface enclosing no charge is zero.\n**R:** Charges outside a closed surface contribute no net flux through it.\n\n---","sol":"### Q1 — Gauss's theorem and the infinite plane sheet\n\n**Statement of Gauss's theorem.** The total electric flux through any closed surface is equal to\n1/ε₀ times the total charge enclosed by that surface:\n\n```\n      ∮ E · dA = q_enclosed / ε₀\n```\n\n**Derivation for an infinite plane sheet.**\n\n*Diagram:* draw the sheet, the outward field arrows perpendicular to it on both sides, and a\ncylindrical Gaussian surface pierced through it, with its flat faces of area A parallel to the sheet\non either side.\n\n**Choice of Gaussian surface, with justification.** Take a cylinder of cross-sectional area A with\nits axis perpendicular to the sheet and its two flat faces equidistant on either side. By symmetry:\n\n- **E** is directed perpendicularly away from the sheet (for positive σ) and has the same magnitude\n  at both faces.\n- On the **curved** surface, **E** is parallel to the surface, so **E**·d**A** = 0 there and it\n  contributes **no flux**.\n\n**Compute the flux.**\n\n```\n      φ = (flux through face 1) + (flux through face 2) + (flux through curved surface)\n        = EA + EA + 0\n        = 2EA\n```\n\n**Compute the enclosed charge.** The cylinder cuts out an area A of the sheet, so\n\n```\n      q_enclosed = σA\n```\n\n**Apply Gauss's theorem.**\n\n```\n      2EA = σA/ε₀\n⟹     E = σ/(2ε₀)\n```\n\nIn vector form, **E** = (σ/2ε₀) n̂, where n̂ is the unit vector normal to the sheet pointing away from\nit.\n\n**Note:** E is **independent of the distance** from the sheet — the field of an infinite charged\nsheet is uniform. ∎\n\n### Q2 — spherical shell, inside and outside, plus the graph\n\n*Diagram:* draw the shell of radius R with charge q spread over it, and two concentric spherical\nGaussian surfaces — one of radius r > R and one of radius r < R.\n\n**Choice of Gaussian surface.** By the spherical symmetry of the charge distribution, **E** must be\nradial and must have the same magnitude at every point of a concentric sphere. So on such a sphere\n**E** is parallel to d**A** everywhere, and\n\n```\n      φ = ∮ E · dA = E ∮ dA = E (4πr²)\n```\n\n**(i) Outside the shell (r > R).**\n\nThe whole charge q is enclosed:\n\n```\n      E (4πr²) = q/ε₀\n⟹     E = (1/4πε₀) · q/r²\n```\n\nThis is exactly the field of a **point charge q placed at the centre**. So for external points, a\nuniformly charged shell behaves as though all its charge were concentrated at its centre.\n\n**(ii) Inside the shell (r < R).**\n\nThe Gaussian sphere lies entirely inside the shell, and since all the charge is on the shell's\nsurface, it encloses **no charge**:\n\n```\n      q_enclosed = 0\n⟹     E (4πr²) = 0\n⟹     E = 0\n```\n\n**The electric field everywhere inside a uniformly charged thin spherical shell is zero.**\n\n**On the surface (r = R):** E = (1/4πε₀)q/R² = σ/ε₀, where σ = q/4πR².\n\n**Graph of E against r:**\n\n```\n  E │\n    │                    ← discontinuous jump at r = R\n    │        ●\n    │        │╲\n    │        │ ╲___                    E ∝ 1/r² for r > R\n    │        │     ╲______\n    │        │            ‾‾‾‾‾‾‾‾───────\n  0 ●────────┘\n    └────────┴──────────────────────────── r\n    0        R\n        E = 0 inside\n```\n\nE is zero from 0 to R, jumps to a maximum value σ/ε₀ at r = R, and then falls off as 1/r². ∎\n\n### Q3 — field on the axial line of a dipole\n\n*Diagram:* draw −q at A and +q at B, separated by 2a, with centre O. Mark the point P on the axis at\ndistance r from O, on the +q side.\n\nLet the dipole consist of −q at A and +q at B, with AB = 2a and midpoint O. Let P be a point on the\naxis at distance r from O, beyond B.\n\n**Distance from +q to P:** r − a. **Distance from −q to P:** r + a.\n\n**Field due to +q at P** — directed **away** from B, i.e. along OP:\n\n```\n      E₊ = (1/4πε₀) · q/(r − a)²\n```\n\n**Field due to −q at P** — directed **towards** A, i.e. opposite to OP:\n\n```\n      E₋ = (1/4πε₀) · q/(r + a)²\n```\n\n**Net field**, taking the direction along OP as positive:\n\n```\n      E = E₊ − E₋\n        = (q/4πε₀) [ 1/(r − a)² − 1/(r + a)² ]\n\n        = (q/4πε₀) [ ( (r + a)² − (r − a)² ) / ( (r − a)²(r + a)² ) ]\n\n        = (q/4πε₀) [ 4ar / (r² − a²)² ]\n```\n\nSince p = q(2a), we have q(4a) = 2p, so\n\n```\n      E_axial = (1/4πε₀) · 2pr/(r² − a²)²          directed along p\n```\n\n**For a short dipole (r >> a)**, we may neglect a² compared with r², giving (r² − a²)² ≈ r⁴:\n\n```\n      E_axial = (1/4πε₀) · 2p/r³\n```\n\n∎\n\n### Q4 — torque on a dipole in a uniform field\n\n*Diagram:* draw a uniform field **E** as parallel horizontal lines, and a dipole (−q at A, +q at B,\nlength 2a) inclined at angle θ to **E**. Mark the force qE on +q along **E** and qE on −q opposite to\n**E**, and mark the perpendicular distance between their lines of action.\n\nLet a dipole of moment p = q(2a) be placed in a uniform field **E** at angle θ to it.\n\n**Forces.**\n\n```\n      Force on +q :  qE, along E\n      Force on −q :  qE, opposite to E\n```\n\nThese are equal in magnitude and opposite in direction, so the **net force is zero** — the dipole\ndoes not translate.\n\n**Torque.** The two forces do not act along the same line; they form a couple. The torque of a\ncouple is (magnitude of either force) × (perpendicular distance between their lines of action).\n\nFrom the geometry, the perpendicular distance between the two lines of action is 2a sin θ.\n\n```\n      τ = (qE)(2a sin θ)\n        = (q · 2a) E sin θ\n        = pE sin θ\n```\n\n**In vector form:**\n\n```\n      τ = p × E\n```\n\nwith the torque perpendicular to the plane containing **p** and **E**.\n\n**Maximum torque.** τ = pE sin θ is maximum when sin θ = 1, i.e. **θ = 90°** — when the dipole is\nperpendicular to the field. Then\n\n```\n      τ_max = pE\n```\n\n**Zero torque** when θ = 0° (stable equilibrium) or θ = 180° (unstable equilibrium). ∎\n\n### Q5 — infinitely long charged wire\n\n*Diagram:* draw the wire, radial field arrows perpendicular to it, and a coaxial cylindrical\nGaussian surface of radius r and length l.\n\nLet the wire have uniform linear charge density λ (charge per unit length).\n\n**Choice of Gaussian surface, with justification.** Take a cylinder of radius r and length l,\ncoaxial with the wire. By the cylindrical symmetry of the charge distribution:\n\n- **E** is **radial** (perpendicular to the wire) and has the same magnitude at every point of the\n  curved surface.\n- On the two **flat end faces**, **E** is parallel to the surface, so those contribute **no flux**.\n\n**Flux.**\n\n```\n      φ = E × (area of curved surface) = E (2πrl)\n```\n\n**Enclosed charge.**\n\n```\n      q_enclosed = λl\n```\n\n**Gauss's theorem.**\n\n```\n      E (2πrl) = λl/ε₀\n⟹     E = λ/(2πε₀ r)\n```\n\nSo **E ∝ 1/r** — the field of a long line charge falls off as the inverse *first* power of the\ndistance, not the inverse square. ∎\n\n### Q6 — properties of electric field lines\n\nAny three of:\n\n1. Field lines **start from positive charges and end on negative charges**.\n2. They are **continuous curves** with no breaks in a charge-free region.\n3. **Two field lines can never intersect.**\n4. They **never form closed loops**, because the electrostatic field is conservative.\n5. The **tangent** at any point gives the direction of **E**; the **closeness** of the lines\n   indicates the magnitude.\n6. Field lines are always **perpendicular to the surface of a conductor**.\n\n**Why two field lines can never intersect.** If two lines crossed at a point, then drawing tangents\nat that point would give **two different directions for the electric field at the same point**. But\nthe electric field at a point has a single, unique direction. Hence field lines cannot intersect.\n\n### Q7 — flux through a cube with a charge at its centre\n\n**(i) Through the whole cube.** The cube is a closed surface enclosing the charge q, so by Gauss's\ntheorem:\n\n```\n      φ_total = q/ε₀\n```\n\n**(ii) Through one face.** By symmetry, the charge sits at the centre and the six faces are\nequivalent, so each receives an equal share of the total flux:\n\n```\n      φ_one face = (1/6)(q/ε₀) = q/(6ε₀)\n```\n\n*(Note that the answer does not involve the side a at all — flux depends only on the enclosed\ncharge. That independence is what the question is testing.)*\n\n### Q8 — Coulomb force, and the effect of a medium\n\n```\n      q₁ = +4 μC = 4 × 10⁻⁶ C\n      q₂ = −2 μC = 2 × 10⁻⁶ C  (magnitude)\n      r  = 10 cm = 0.1 m\n```\n\n**In air:**\n\n```\n      F = k q₁q₂/r²\n        = (9 × 10⁹)(4 × 10⁻⁶)(2 × 10⁻⁶) / (0.1)²\n        = (9 × 10⁹)(8 × 10⁻¹²) / (0.01)\n        = (7.2 × 10⁻²) / (0.01)\n        = 7.2 N\n```\n\n**F = 7.2 N**, and since the charges are of opposite sign the force is **attractive**.\n\n**In a medium of dielectric constant K = 5:**\n\n```\n      F′ = F/K = 7.2/5 = 1.44 N\n```\n\n**The force is reduced to 1.44 N** — introducing a dielectric always reduces the electrostatic force,\nby the factor K.\n\n### Q9 — field inside a shell\n\n**Answer: (c) zero**\n\nBy Gauss's law, a concentric spherical surface inside the shell encloses no charge, so the flux\nthrough it — and hence the field on it — is zero.\n\n### Q10 — case study: charged spherical shell\n\n```\n      R = 10 cm = 0.1 m          q = 5 × 10⁻⁸ C\n```\n\n**(i) At r = 5 cm — this is INSIDE the shell (r < R):**\n\n```\n      E = 0\n```\n\n*(No charge is enclosed by a concentric sphere of radius 5 cm.)*\n\n**(ii) At r = 20 cm = 0.2 m — OUTSIDE the shell:**\n\n```\n      E = k q/r²\n        = (9 × 10⁹)(5 × 10⁻⁸)/(0.2)²\n        = (450)/(0.04)\n        = 1.125 × 10⁴ N C⁻¹\n```\n\n**E ≈ 1.13 × 10⁴ N C⁻¹**, directed radially outward.\n\n**(iii) Surface charge density:**\n\n```\n      σ = q/(4πR²)\n        = (5 × 10⁻⁸)/(4π(0.1)²)\n        = (5 × 10⁻⁸)/(4π × 0.01)\n        = (5 × 10⁻⁸)/(0.1257)\n        = 3.98 × 10⁻⁷ C m⁻²\n```\n\n**σ ≈ 4.0 × 10⁻⁷ C m⁻²**\n\n**(iv) Flux through a concentric sphere of radius 15 cm.** This sphere encloses the whole charge, so\nby Gauss's theorem:\n\n```\n      φ = q/ε₀ = (5 × 10⁻⁸)/(8.854 × 10⁻¹²) = 5.65 × 10³ N m² C⁻¹\n```\n\n**φ ≈ 5.6 × 10³ N m² C⁻¹**\n\n*(The radius 15 cm is irrelevant to the answer, as long as it exceeds R — that is the point of the\nsub-question.)*\n\n### Q11 — torque on a dipole\n\n```\n      p = 4 × 10⁻⁹ C m          E = 5 × 10⁴ N C⁻¹          θ = 30°\n```\n\n```\n      τ = pE sin θ\n        = (4 × 10⁻⁹)(5 × 10⁴)(sin 30°)\n        = (2 × 10⁻⁴)(0.5)\n        = 1 × 10⁻⁴ N m\n```\n\n**τ = 1 × 10⁻⁴ N m**\n\n### Q12 — Assertion–Reason\n\n**A:** \"The flux through a closed surface enclosing no charge is zero.\" **True** — by Gauss's law,\nφ = q_enclosed/ε₀ = 0.\n\n**R:** \"Charges outside a closed surface contribute no net flux through it.\" **True** — field lines\nfrom an external charge that enter the surface also leave it, so their contributions cancel.\n\n**Does R explain A?** Yes. It is precisely because external charges contribute nothing that a surface\nwith no charge inside has zero net flux, even when a field is present.\n\n**Answer: (a) Both A and R are true, and R is the correct explanation of A.**\n\n---","test":"Time: 45 minutes. Answers below.\n\n1. *(1)* The SI unit of electric flux is\n   (a) N C⁻¹ (b) N m² C⁻¹ (c) C m (d) N m C⁻¹\n2. *(1)* The electric field due to a short dipole at a distance r on its axis varies as\n   (a) 1/r (b) 1/r² (c) 1/r³ (d) 1/r⁴\n3. *(1)* The net force on an electric dipole placed in a uniform electric field is\n   (a) pE (b) pE sin θ (c) zero (d) 2pE\n4. *(2)* Two charges of 2 μC and 3 μC are 30 cm apart. Find the force between them.\n5. *(2)* Define electric field intensity and write its SI unit. Is it a scalar or a vector?\n6. *(2)* A charge of 8 μC is enclosed by a closed surface. Find the total flux through it.\n7. *(3)* Derive the expression for the electric field on the equatorial line of a short electric\n   dipole.\n8. *(3)* Using Gauss's law, find the electric field just outside a charged conductor of surface\n   charge density σ.\n9. *(3)* Two point charges +q and −q are placed 2a apart. Find the electric field at a point on the\n   perpendicular bisector at distance r from the centre, for r >> a. State its direction.\n10. *(5)* State Gauss's theorem and use it to derive the field due to an infinitely long straight\n    charged wire. A wire carries a linear charge density of 2 × 10⁻⁶ C m⁻¹. Find the field 4 cm from\n    it.\n11. *(2)* Sketch the electric field lines for (i) two equal positive point charges and (ii) an\n    electric dipole.\n12. *(2)* Why must the electric field inside a conductor be zero in electrostatic equilibrium?\n13. *(2)* An electric dipole of moment 2 × 10⁻⁸ C m experiences a maximum torque of 4 × 10⁻⁴ N m in\n    a uniform field. Find the field strength.\n\n### Answer key\n\n**1. (b) N m² C⁻¹** (equivalently V m).\n\n**2. (c) 1/r³.**\n\n**3. (c) zero.** The two forces are equal and opposite; only the torque is non-zero.\n\n**4. 0.6 N.** F = (9 × 10⁹)(2 × 10⁻⁶)(3 × 10⁻⁶)/(0.3)² = (9 × 10⁹)(6 × 10⁻¹²)/0.09\n= (5.4 × 10⁻²)/0.09 = 0.6 N, repulsive.\n\n**5.** Electric field intensity at a point is the **force per unit positive test charge** placed at\nthat point: **E** = **F**/q₀. SI unit: **N C⁻¹** (= V m⁻¹). It is a **vector**.\n\n**6. 9.04 × 10⁵ N m² C⁻¹.** φ = q/ε₀ = (8 × 10⁻⁶)/(8.854 × 10⁻¹²) ≈ 9.0 × 10⁵ N m² C⁻¹.\n*(The shape of the surface is irrelevant.)*\n\n**7.** Let P be on the perpendicular bisector at distance r from the centre O. Each charge is at\ndistance √(r² + a²) from P.\nE₊ = kq/(r² + a²), directed away from +q; E₋ = kq/(r² + a²), directed towards −q.\nThe components perpendicular to the dipole axis cancel; the components **along the axis** (each\nE cos θ, with cos θ = a/√(r² + a²)) add:\nE = 2 · [kq/(r² + a²)] · a/√(r² + a²) = k(2qa)/(r² + a²)^(3/2) = kp/(r² + a²)^(3/2).\nFor r >> a: **E = kp/r³ = p/(4πε₀r³)**, directed **antiparallel to p**.\n\n**8. E = σ/ε₀.** Take a small cylindrical Gaussian surface (\"pillbox\") with one flat face of area A\njust outside the conductor and the other just inside. The field inside a conductor is zero, so the\ninner face contributes no flux; the curved surface contributes none (E is normal to the surface).\nSo φ = EA, and q_enclosed = σA, giving EA = σA/ε₀, i.e. **E = σ/ε₀**.\n\n**9. E = kp/r³ = p/(4πε₀r³)**, directed from +q towards −q, i.e. **antiparallel to p**. (Same as\nQ7.)\n\n**10.** Statement and derivation as in §3 Q5, giving E = λ/(2πε₀r).\nNumerically, with λ = 2 × 10⁻⁶ C m⁻¹ and r = 0.04 m, using 1/(2πε₀) = 2k = 1.8 × 10¹⁰:\nE = (1.8 × 10¹⁰)(2 × 10⁻⁶)/(0.04) = (3.6 × 10⁴)/(0.04) = **9 × 10⁵ N C⁻¹**, radially outward.\n\n**11.** (i) Two equal positive charges: lines radiate outward from each and curve away from one\nanother, with a **neutral point midway** between them where the field is zero; no line joins them.\n(ii) Dipole: lines leave +q and curve round to enter −q, densest along the axis between the charges,\nsymmetric about the perpendicular bisector.\n\n**12.** If the field inside were non-zero, it would exert a force **F** = q**E** on the free\nelectrons, which would keep moving — so the situation would not be static. Charges therefore\nredistribute on the surface until the internal field is exactly cancelled everywhere inside. Hence\nin electrostatic equilibrium E = 0 inside a conductor.\n\n**13. E = 2 × 10⁴ N C⁻¹.** τ_max = pE, so E = τ_max/p = (4 × 10⁻⁴)/(2 × 10⁻⁸) = 2 × 10⁴ N C⁻¹.\n\n**Scoring.** Out of 29. Below 20 → the three Gauss's law derivations are the gap. Write all three\nfrom memory, with diagrams, before moving on.\n\n---","tips":"**On the Gauss's law derivations (the 5-markers)**\n\n1. **State the theorem in words first**, then in symbols. Both are marked, and the statement is\n   typically 1 mark before any derivation begins.\n\n2. **Draw the Gaussian surface on the diagram** and label it. Cylinder for wire and sheet, sphere for\n   shell. The diagram is worth ½–1 mark, marked independently.\n\n3. **Justify the choice of surface.** Write the two sentences: \"By symmetry, E is radial and constant\n   in magnitude on the curved surface\" and \"On the flat end faces, E is parallel to the surface, so\n   they contribute no flux.\" That justification is a mark, and it is what separates a full answer\n   from a formula.\n\n4. **Show φ and q_enclosed as separate labelled steps** before equating them. Three lines: flux,\n   enclosed charge, then Gauss's law.\n\n5. **State the physical conclusion at the end.** \"E ∝ 1/r\" for the wire; \"E is independent of\n   distance\" for the sheet; \"E = 0 inside\" for the shell. That closing observation is often an\n   explicit sub-part.\n\n6. **For the shell, draw the E-vs-r graph** with E = 0 up to r = R, the jump at r = R, and the 1/r²\n   tail. Label both axes and mark R. It is a routine sub-part.\n\n**On dipoles**\n\n7. **State the direction of p** — from −q to +q. It gets asked, and it is required for the direction\n   of the field.\n\n8. **In the axial derivation, be careful with (r − a) and (r + a).** The near charge is at r − a. Get\n   these the wrong way round and the sign of the answer flips.\n\n9. **Do the r >> a approximation as an explicit final step**, with the words \"for a short dipole,\n   a² << r², so\". Do not silently drop the a².\n\n10. **For torque, state that the net force is zero** before deriving the torque. It is a mark and it\n    is often a separate sub-part.\n\n**On flux**\n\n11. **Flux depends only on the enclosed charge.** For \"flux through one face of a cube\", use symmetry\n    (divide by 6). For \"flux when the surface is enlarged\", the answer does not change. For \"flux due\n    to a charge outside\", the answer is zero. These three are the whole flux question set.\n\n12. **Watch the units:** N m² C⁻¹ for flux, N C⁻¹ or V m⁻¹ for field, C m for dipole moment,\n    C m⁻¹ for λ, C m⁻² for σ.\n\n**On numericals**\n\n13. **Convert to SI first, on its own line.** μC → 10⁻⁶ C, cm → 10⁻² m. Most numerical errors in this\n    chapter are unit-conversion errors, especially forgetting to square the metres.\n\n14. **Use k = 9 × 10⁹ rather than 1/4πε₀**, and 1/(2πε₀) = 1.8 × 10¹⁰ for the wire. Faster, and less\n    error-prone.\n\n15. **State the direction of a field or force answer**, not just the magnitude — \"radially outward\",\n    \"attractive\", \"along p\"."}},{"id":"p2","subj":"physics","num":2,"title":"Electrostatic Potential and Capacitance","unit":"Units I+II · Electrostatics & Current","unitMarks":16,"prio":1,"appear":"Units I + II (16 marks, shared with Ch 1 and Ch 3) · Typical appearance: 1–2 MCQs + a 2/3-mark question on equipotentials or energy, and frequently the 5-mark capacitor-with-dielectric derivation.","deleted":"- **Van de Graaff generator**","recall":"```\nV = W/q  (volt = J C⁻¹) ;  V = kq/r  (SCALAR, sign carried) ;  V ∝ 1/r\nSystem of charges : V = Σ kqᵢ/rᵢ           (algebraic sum)\nDipole : V = kp cos θ/r² ;  axial kp/r² ;  EQUATORIAL V = 0 ;  V ∝ 1/r²\n\nE = −dV/dr ;  uniform field E = V/d\n\nEQUIPOTENTIAL : no work done along it ; E ⊥ to it ; never intersect ;\n                closer where E is stronger ; spheres for a point charge\n\nU (two charges)   = k q₁q₂/r                (sign carried)\nU (three charges) = k[q₁q₂/r₁₂ + q₂q₃/r₂₃ + q₁q₃/r₁₃]\nU (dipole in E)   = −pE cos θ = −p·E\n   θ = 0° : U = −pE, STABLE ;  θ = 180° : U = +pE, unstable\nW (rotate θ₁→θ₂)  = pE(cos θ₁ − cos θ₂)\n\nC = Q/V (farad)\nParallel plate : C = ε₀A/d ;  with dielectric C = Kε₀A/d\n   slab of thickness t : C = ε₀A/(d − t + t/K)\nSeries   : 1/C = Σ1/Cᵢ    (C smaller than the smallest)\nParallel : C = ΣCᵢ        (C larger than the largest)\n   — the OPPOSITE way round from resistors\n\nU = ½CV² = ½QV = Q²/2C ;   energy density u = ½ε₀E²\n\nDIELECTRIC INSERTED:\n  battery CONNECTED    (V fixed): C↑K, Q↑K, E same, U↑K\n  battery DISCONNECTED (Q fixed): C↑K, V↓K, E↓K,  U↓K\n\nTwo capacitors joined : V = (C₁V₁+C₂V₂)/(C₁+C₂)\n   energy lost ΔU = C₁C₂(V₁−V₂)²/[2(C₁+C₂)]   ≥ 0 always\n```","s":{"scope":"### In the syllabus\n\n- **Electric potential** and potential difference; potential due to a **point charge**, a **dipole**,\n  and a **system of charges**\n- **Equipotential surfaces**\n- **Electric potential energy** of a system of two point charges, and of an electric **dipole** in an\n  electrostatic field\n- **Conductors and insulators**; free and bound charges inside a conductor\n- **Dielectrics** and electric **polarisation**\n- **Capacitors and capacitance**; combination in **series and parallel**\n- **Capacitance of a parallel-plate capacitor**, with and without a dielectric medium\n- **Energy stored** in a capacitor\n\n### Deleted — do not study\n\n- **Van de Graaff generator**\n\n---","brief":"### Electric potential\n\nThe **electric potential** at a point is the work done per unit positive charge in bringing a test\ncharge from infinity to that point, without acceleration.\n\n```\n      V = W/q                       SI unit: volt (V) = J C⁻¹\n```\n\nPotential is a **scalar** — this is why potential problems are easier than field problems: you add\nnumbers, not vectors.\n\n**Potential difference** between A and B:\n\n```\n      V_B − V_A = W_(A→B)/q\n```\n\n**Due to a point charge q at distance r:**\n\n```\n      V = (1/4πε₀) · q/r  =  kq/r\n```\n\nNote V ∝ 1/r, whereas E ∝ 1/r². And V is **positive** for a positive charge, **negative** for a\nnegative one — the sign is carried, unlike with field magnitudes.\n\n**Due to a system of charges:** the **algebraic sum** of the individual potentials:\n\n```\n      V = k ( q₁/r₁ + q₂/r₂ + q₃/r₃ + … )\n```\n\n### Potential due to a dipole\n\nAt a point at distance r from the centre, making angle θ with the dipole axis (for r >> a):\n\n```\n      V = (1/4πε₀) · p cos θ / r²\n```\n\n**Special cases:**\n\n| Position | θ | V |\n| --- | --- | --- |\n| Axial (on the +q side) | 0° | kp/r² |\n| Axial (on the −q side) | 180° | −kp/r² |\n| **Equatorial** | 90° | **0** |\n\n> **The equatorial potential of a dipole is zero.** This is asked directly, and it is worth\n> understanding why: the two charges are equidistant from any equatorial point, so their equal and\n> opposite potentials cancel exactly. (Their *fields* do not cancel, because fields are vectors and\n> point in different directions.)\n\nNote also that a dipole's potential falls as **1/r²**, faster than a point charge's 1/r.\n\n### Relation between E and V\n\n```\n      E = −dV/dr\n```\n\nThe electric field is the **negative gradient of potential** — it points in the direction of\n**steepest decrease** of V. For a uniform field between plates separated by d:\n\n```\n      E = V/d\n```\n\n### Equipotential surfaces\n\nAn **equipotential surface** is a surface on which the potential is the same at every point.\n\n**Properties (a standard 2/3-mark question):**\n\n1. **No work is done** in moving a charge along an equipotential surface.\n2. The **electric field is always perpendicular** to the equipotential surface at every point.\n3. Two equipotential surfaces **never intersect** (a point cannot have two potentials).\n4. They are **closer together where the field is stronger** (since E = −dV/dr, a large E means V\n   changes rapidly over a short distance).\n5. For a **point charge**, they are concentric spheres. For a **uniform field**, parallel planes\n   perpendicular to the field. For a conductor, its **surface** is an equipotential.\n\n**Why is no work done along an equipotential?** Because W = qΔV, and ΔV = 0 along the surface.\nEquivalently, **E** is perpendicular to the displacement, so **F**·d**s** = 0.\n\n### Potential energy\n\n**Of two point charges** q₁ and q₂ separated by r:\n\n```\n      U = (1/4πε₀) · q₁q₂/r  =  k q₁q₂/r\n```\n\nThe sign is carried: U is **positive** for like charges (work must be done to assemble them) and\n**negative** for unlike charges.\n\n**Of a system of three charges:** add the contributions of each **pair**:\n\n```\n      U = k [ q₁q₂/r₁₂ + q₂q₃/r₂₃ + q₁q₃/r₁₃ ]\n```\n\n**Of a dipole in a uniform field E:**\n\n```\n      U = −pE cos θ  =  −p · E\n```\n\n| θ | U | State |\n| --- | --- | --- |\n| 0° | −pE (minimum) | **stable** equilibrium |\n| 90° | 0 | |\n| 180° | +pE (maximum) | **unstable** equilibrium |\n\n**Work done in rotating a dipole** from θ₁ to θ₂:\n\n```\n      W = U₂ − U₁ = pE (cos θ₁ − cos θ₂)\n```\n\n### Conductors, dielectrics and polarisation\n\n**In a conductor** in electrostatic equilibrium: E = 0 inside, all excess charge on the outer\nsurface, the whole conductor at one potential, and E perpendicular to the surface just outside.\nConductors have **free charges** (mobile electrons).\n\n**In a dielectric** the charges are **bound** — they cannot move freely, but they can be displaced\nslightly. When an external field is applied:\n\n- **Non-polar** molecules (no permanent dipole moment) develop an **induced** dipole moment.\n- **Polar** molecules (with a permanent moment) **align** with the field.\n\nEither way, the dielectric develops a net dipole moment per unit volume — the **polarisation P** —\nwhich produces an **internal field opposing** the applied field. So the net field inside the\ndielectric is reduced:\n\n```\n      E_net = E₀/K\n```\n\nwhere **K** is the **dielectric constant** (relative permittivity), K = ε/ε₀. K > 1 always, and\nK = 1 for vacuum.\n\n### Capacitance\n\nA **capacitor** stores charge; its **capacitance** is\n\n```\n      C = Q/V                       SI unit: farad (F) = C V⁻¹\n```\n\n1 F is very large; practical values are μF (10⁻⁶ F) and pF (10⁻¹² F).\n\nCapacitance depends only on the **geometry** of the conductors and the **medium** between them — not\non the charge or the voltage.\n\n**Parallel-plate capacitor**, plate area A, separation d:\n\n```\n      C = ε₀A/d                            (vacuum or air between the plates)\n      C = K ε₀A/d                          (a dielectric of constant K filling the gap)\n```\n\n**With a dielectric slab of thickness t (t < d) partly filling the gap:**\n\n```\n      C = ε₀A / ( d − t + t/K )\n```\n\n*(Check the limits: t = 0 gives ε₀A/d ✓; t = d gives Kε₀A/d ✓.)*\n\n### Combinations of capacitors\n\n**In series** — the same charge Q on each, and the voltages add:\n\n```\n      1/C_eq = 1/C₁ + 1/C₂ + 1/C₃ + …\n```\n\nC_eq is **smaller** than the smallest individual capacitance.\n\n**In parallel** — the same voltage V across each, and the charges add:\n\n```\n      C_eq = C₁ + C₂ + C₃ + …\n```\n\nC_eq is **larger** than the largest individual capacitance.\n\n> **Note the contrast with resistors:** capacitors add in *parallel* the way resistors add in\n> *series*. Getting this the wrong way round is the standard error in circuit questions.\n\n### Energy stored in a capacitor\n\n```\n      U = ½ CV²  =  ½ QV  =  Q²/(2C)\n```\n\nAll three forms are equivalent by Q = CV. **Which one to use depends on what is held constant** —\nsee below.\n\n**Energy density** (energy per unit volume) in the field between the plates:\n\n```\n      u = ½ ε₀ E²\n```\n\n### The dielectric-insertion table — learn this as a table\n\nInsert a dielectric of constant K into a charged parallel-plate capacitor. There are **two cases**,\nand CBSE asks them interchangeably.\n\n**Case A — battery remains connected (V constant):**\n\n| Quantity | Change |\n| --- | --- |\n| C | **increases** to KC |\n| V | unchanged |\n| Q = CV | **increases** to KQ |\n| E = V/d | unchanged |\n| U = ½CV² | **increases** to KU |\n\nExtra charge flows from the battery, and the battery does work.\n\n**Case B — battery disconnected (Q constant):**\n\n| Quantity | Change |\n| --- | --- |\n| C | **increases** to KC |\n| Q | unchanged |\n| V = Q/C | **decreases** to V/K |\n| E = V/d | **decreases** to E/K |\n| U = Q²/2C | **decreases** to U/K |\n\nThe energy decreases because the dielectric is pulled into the gap, so the field does work on it.\n\n> **The examiner's trick** is to give you one case and see whether you answer for the other. Read the\n> question for the words \"battery is disconnected\" or \"still connected\". If the question does not\n> say, state your assumption.\n\n### Two charged capacitors connected together\n\nWhen capacitors C₁ (at V₁) and C₂ (at V₂) are joined by a wire, charge redistributes until they\nreach a **common potential**:\n\n```\n      V = (C₁V₁ + C₂V₂)/(C₁ + C₂)              (total charge / total capacitance)\n```\n\nThere is always a **loss of energy** (dissipated as heat in the connecting wire and as radiation):\n\n```\n      ΔU = C₁C₂ (V₁ − V₂)² / [ 2(C₁ + C₂) ]\n```\n\nNote ΔU ≥ 0 always, and it is zero only if V₁ = V₂ — so energy is *always* lost unless the\npotentials were already equal. That is a favourite conceptual question.\n\n### Quick recall box\n\n```\nV = W/q  (volt = J C⁻¹) ;  V = kq/r  (SCALAR, sign carried) ;  V ∝ 1/r\nSystem of charges : V = Σ kqᵢ/rᵢ           (algebraic sum)\nDipole : V = kp cos θ/r² ;  axial kp/r² ;  EQUATORIAL V = 0 ;  V ∝ 1/r²\n\nE = −dV/dr ;  uniform field E = V/d\n\nEQUIPOTENTIAL : no work done along it ; E ⊥ to it ; never intersect ;\n                closer where E is stronger ; spheres for a point charge\n\nU (two charges)   = k q₁q₂/r                (sign carried)\nU (three charges) = k[q₁q₂/r₁₂ + q₂q₃/r₂₃ + q₁q₃/r₁₃]\nU (dipole in E)   = −pE cos θ = −p·E\n   θ = 0° : U = −pE, STABLE ;  θ = 180° : U = +pE, unstable\nW (rotate θ₁→θ₂)  = pE(cos θ₁ − cos θ₂)\n\nC = Q/V (farad)\nParallel plate : C = ε₀A/d ;  with dielectric C = Kε₀A/d\n   slab of thickness t : C = ε₀A/(d − t + t/K)\nSeries   : 1/C = Σ1/Cᵢ    (C smaller than the smallest)\nParallel : C = ΣCᵢ        (C larger than the largest)\n   — the OPPOSITE way round from resistors\n\nU = ½CV² = ½QV = Q²/2C ;   energy density u = ½ε₀E²\n\nDIELECTRIC INSERTED:\n  battery CONNECTED    (V fixed): C↑K, Q↑K, E same, U↑K\n  battery DISCONNECTED (Q fixed): C↑K, V↓K, E↓K,  U↓K\n\nTwo capacitors joined : V = (C₁V₁+C₂V₂)/(C₁+C₂)\n   energy lost ΔU = C₁C₂(V₁−V₂)²/[2(C₁+C₂)]   ≥ 0 always\n```\n\n---","pyq":"**Q1.** *(5 marks)* Derive an expression for the capacitance of a parallel-plate capacitor when a\ndielectric slab of thickness t and dielectric constant K is inserted between the plates, which are\nseparated by a distance d.\n\n**Q2.** *(3 marks)* Derive an expression for the energy stored in a parallel-plate capacitor. Hence\nobtain the expression for the energy density of the electric field.\n\n**Q3.** *(3 marks)* Define an equipotential surface. State any three of its properties. Why is no\nwork done in moving a charge along an equipotential surface?\n\n**Q4.** *(3 marks)* Derive an expression for the electric potential at a point due to an electric\ndipole. Hence show that the potential at any point on the equatorial line of a dipole is zero.\n\n**Q5.** *(3 marks)* Two capacitors of capacitance 2 μF and 3 μF are connected in series across a 6 V\nbattery. Find (i) the equivalent capacitance, (ii) the charge on each capacitor, and (iii) the\npotential difference across each.\n\n**Q6.** *(5 marks)* A parallel-plate capacitor is charged by a battery. The battery is then\ndisconnected and a dielectric slab is inserted between the plates. Explain, with reasons, what\nhappens to (i) the capacitance, (ii) the charge, (iii) the potential difference, (iv) the electric\nfield, and (v) the energy stored. How would your answers change if the battery had remained\nconnected?\n\n**Q7.** *(3 marks)* Two capacitors of 4 μF and 6 μF are charged to potentials of 100 V and 50 V\nrespectively and then connected together. Find the common potential and the loss of energy.\n\n**Q8.** *(2 marks)* Derive an expression for the potential energy of an electric dipole placed in a\nuniform electric field. When is it minimum?\n\n**Q9.** *(2 marks)* Three charges of +2 μC, −3 μC and +4 μC are placed at the vertices of an\nequilateral triangle of side 10 cm. Find the electric potential energy of the system.\n\n**Q10.** *(1 mark, MCQ)* The capacitance of a parallel-plate capacitor is doubled if\n(a) the plate separation is doubled (b) the plate area is doubled\n(c) the charge is doubled (d) the voltage is doubled\n\n**Q11.** *(4 marks, case study)* A parallel-plate capacitor has plates of area 100 cm² separated by\n1 mm of air, and is connected to a 100 V supply.\n(i) Find its capacitance.\n(ii) Find the charge stored.\n(iii) Find the energy stored.\n(iv) If a dielectric of K = 5 now fills the gap while the supply remains connected, find the new\nenergy stored.\n\n**Q12.** *(1 mark, Assertion–Reason)*\n**A:** When two charged capacitors at different potentials are connected, energy is always lost.\n**R:** Charge is conserved when capacitors are connected together.\n\n---","sol":"### Q1 — parallel-plate capacitor with a partial dielectric slab\n\n*Diagram:* draw two parallel plates separated by d, with a slab of thickness t (t < d) of dielectric\nconstant K between them, leaving air gaps totalling (d − t).\n\nLet the plates carry surface charge density σ = Q/A.\n\n**The field in the air gaps.** In the region between the plates where there is no dielectric:\n\n```\n      E₀ = σ/ε₀\n```\n\n**The field inside the dielectric.** The polarised dielectric produces an opposing field, reducing\nthe net field by the factor K:\n\n```\n      E = E₀/K = σ/(Kε₀)\n```\n\n**The potential difference** across the plates is the sum of the potential drops across the air gaps\nand the slab. The total air path has thickness (d − t) and the slab has thickness t:\n\n```\n      V = E₀ (d − t)  +  E t\n        = (σ/ε₀)(d − t)  +  (σ/Kε₀) t\n        = (σ/ε₀) [ (d − t) + t/K ]\n```\n\n**Substitute σ = Q/A:**\n\n```\n      V = (Q/Aε₀) [ (d − t) + t/K ]\n```\n\n**Capacitance:**\n\n```\n      C = Q/V = Q / { (Q/Aε₀)[(d − t) + t/K] }\n```\n\n```\n      C = ε₀A / [ d − t + t/K ]\n```\n\n**Check the limiting cases** (worth writing — it demonstrates understanding):\n\n- t = 0 (no slab): C = ε₀A/d ✓ — the ordinary air capacitor.\n- t = d (slab fills the gap): C = ε₀A/(d/K) = **Kε₀A/d** ✓ — the fully dielectric-filled capacitor.\n\nSince K > 1, we have t/K < t, so the denominator is smaller than d — hence **inserting a dielectric\nalways increases the capacitance**. ∎\n\n### Q2 — energy stored in a capacitor, and energy density\n\n**Derivation.** Charging a capacitor means transferring charge from one plate to the other against\nthe potential difference that builds up as you go. Suppose at some instant the charge is q, so the\npotential difference is\n\n```\n      V′ = q/C\n```\n\nThe work needed to move a further small charge dq is\n\n```\n      dW = V′ dq = (q/C) dq\n```\n\nTotal work to charge the capacitor from 0 to Q:\n\n```\n      W = ∫[0,Q] (q/C) dq = (1/C) [ q²/2 ]₀^Q = Q²/(2C)\n```\n\nThis work is stored as electrostatic potential energy:\n\n```\n      U = Q²/(2C)  =  ½ CV²  =  ½ QV                (using Q = CV)\n```\n\n**Energy density.** For a parallel-plate capacitor, C = ε₀A/d and V = Ed. Substituting into\nU = ½CV²:\n\n```\n      U = ½ (ε₀A/d)(Ed)² = ½ ε₀ A d E²\n```\n\nThe volume between the plates is (A d), so the energy per unit volume is\n\n```\n      u = U/(Ad) = ½ ε₀ E²\n```\n\n```\n      Energy density  u = ½ ε₀ E²\n```\n\nThis result is general — it holds for the electrostatic field anywhere, not just in a capacitor. ∎\n\n### Q3 — equipotential surfaces\n\n**Definition.** An equipotential surface is a surface on which the electric potential has the **same\nvalue at every point**.\n\n**Properties (any three):**\n\n1. **No work** is done in moving a charge from one point to another **along** an equipotential\n   surface.\n2. The **electric field is always perpendicular** to the equipotential surface at every point.\n3. Two equipotential surfaces **can never intersect**, since a point cannot have two different\n   potentials.\n4. Equipotential surfaces are **crowded together where the field is strong** and widely spaced where\n   it is weak.\n5. For an isolated point charge they are **concentric spheres**; for a uniform field they are\n   **parallel planes** perpendicular to the field.\n\n**Why no work is done along an equipotential surface.**\n\nThe work done in moving a charge q through a potential difference ΔV is\n\n```\n      W = q ΔV\n```\n\nAlong an equipotential surface, all points have the same potential, so ΔV = 0, and therefore\n**W = 0**.\n\nEquivalently: since **E** is perpendicular to the surface, and the displacement d**s** lies *in* the\nsurface, the force q**E** is perpendicular to the displacement, so\n\n```\n      dW = qE · ds = qE ds cos 90° = 0\n```\n\n### Q4 — potential due to a dipole, and the equatorial case\n\n*Diagram:* draw −q at A and +q at B, separated by 2a with centre O. Mark point P at distance r from\nO, with OP making angle θ with the dipole axis OB. Drop perpendiculars from A and B onto OP.\n\nLet the dipole have charges −q at A and +q at B, with AB = 2a and centre O. Let P be at distance r\nfrom O, with ∠POB = θ.\n\n**Distances.** For r >> a, dropping perpendiculars from A and B onto the line OP gives, to a good\napproximation,\n\n```\n      BP ≈ r − a cos θ                AP ≈ r + a cos θ\n```\n\n**Potential at P** — the algebraic sum of the two contributions (potential is a scalar):\n\n```\n      V = k [ q/BP  +  (−q)/AP ]\n        = kq [ 1/(r − a cos θ)  −  1/(r + a cos θ) ]\n\n        = kq [ ( (r + a cos θ) − (r − a cos θ) ) / ( r² − a² cos²θ ) ]\n\n        = kq [ 2a cos θ / (r² − a² cos²θ) ]\n```\n\nFor r >> a we may neglect a²cos²θ compared with r²:\n\n```\n      V = kq (2a cos θ)/r²\n```\n\nSince p = q(2a),\n\n```\n      V = (1/4πε₀) · p cos θ / r²\n```\n\n**On the equatorial line, θ = 90°**, so cos θ = 0:\n\n```\n      V_equatorial = 0\n```\n\n**Hence the potential at every point on the equatorial line of a dipole is zero.** ∎\n\n*(Physical reason: any equatorial point is **equidistant** from +q and −q, so their potentials — equal\nin magnitude, opposite in sign — cancel exactly. Note that the *field* there is **not** zero, because\nfields are vectors and the two contributions do not cancel.)*\n\n### Q5 — two capacitors in series\n\n```\n      C₁ = 2 μF          C₂ = 3 μF          V = 6 V\n```\n\n**(i) Equivalent capacitance (series):**\n\n```\n      1/C = 1/C₁ + 1/C₂ = 1/2 + 1/3 = 5/6\n⟹     C = 6/5 = 1.2 μF\n```\n\n**(ii) Charge.** In series the **same charge** flows onto each capacitor:\n\n```\n      Q = C V = (1.2 × 10⁻⁶)(6) = 7.2 × 10⁻⁶ C = 7.2 μC\n```\n\n**Both capacitors carry 7.2 μC.**\n\n**(iii) Potential differences:**\n\n```\n      V₁ = Q/C₁ = 7.2/2 = 3.6 V\n      V₂ = Q/C₂ = 7.2/3 = 2.4 V\n```\n\n*Check:* V₁ + V₂ = 3.6 + 2.4 = 6 V ✓ — equal to the supply, as it must be in series.\n\n*(Note the smaller capacitor takes the larger share of the voltage — in series, V ∝ 1/C.)*\n\n### Q6 — dielectric inserted, battery disconnected then connected\n\n**Case B: battery DISCONNECTED before insertion — so Q is constant.**\n\n**(i) Capacitance:** C′ = KC. **Increases** by the factor K, because the polarised dielectric reduces\nthe field for the same charge, so more charge can be held per volt.\n\n**(ii) Charge:** **unchanged**, Q′ = Q. The capacitor is isolated — there is no path for charge to\nenter or leave.\n\n**(iii) Potential difference:** V′ = Q/C′ = Q/(KC) = **V/K**. **Decreases** by the factor K.\n\n**(iv) Electric field:** E′ = V′/d = **E/K**. **Decreases** by the factor K, because the induced\npolarisation field opposes the applied field.\n\n**(v) Energy stored:** using the form with Q constant,\n\n```\n      U′ = Q²/(2C′) = Q²/(2KC) = U/K\n```\n\n**Decreases** by the factor K. The lost energy is accounted for by the work done by the capacitor in\n**pulling the dielectric slab into** the gap.\n\n**If the battery had remained CONNECTED — so V is constant:**\n\n| Quantity | Battery disconnected (Q fixed) | Battery connected (V fixed) |\n| --- | --- | --- |\n| C | increases to KC | increases to KC |\n| Q | unchanged | **increases to KQ** |\n| V | decreases to V/K | **unchanged** |\n| E | decreases to E/K | **unchanged** (E = V/d) |\n| U | decreases to U/K | **increases to KU** (U = ½CV²) |\n\nWith the battery connected, the extra charge KQ − Q is supplied by the battery, which does work; so\nthe stored energy increases rather than decreasing.\n\n> Note that the *same* physical action produces opposite changes in U depending on whether the\n> battery is attached. That contrast is the whole point of the question.\n\n### Q7 — two charged capacitors connected together\n\n```\n      C₁ = 4 μF at V₁ = 100 V          C₂ = 6 μF at V₂ = 50 V\n```\n\n**Common potential:**\n\n```\n      V = (C₁V₁ + C₂V₂)/(C₁ + C₂)\n        = (4 × 100 + 6 × 50)/(4 + 6)              [in μF and volts]\n        = (400 + 300)/10\n        = 700/10\n        = 70 V\n```\n\n**Loss of energy:**\n\n```\n      ΔU = C₁C₂ (V₁ − V₂)² / [ 2(C₁ + C₂) ]\n         = (4 × 10⁻⁶)(6 × 10⁻⁶)(100 − 50)² / [ 2(10 × 10⁻⁶) ]\n         = (24 × 10⁻¹²)(2500) / (20 × 10⁻⁶)\n         = (6 × 10⁻⁸)/(2 × 10⁻⁵)\n         = 3 × 10⁻³ J\n```\n\n**Common potential = 70 V; energy lost = 3 × 10⁻³ J = 3 mJ.**\n\n*(Cross-check by direct computation: initial energy = ½(4μ)(100)² + ½(6μ)(50)² = 20 mJ + 7.5 mJ\n= 27.5 mJ. Final energy = ½(10μ)(70)² = 24.5 mJ. Loss = 3 mJ ✓)*\n\nThis energy is dissipated as **heat in the connecting wires** (and a little as electromagnetic\nradiation).\n\n### Q8 — potential energy of a dipole in a uniform field\n\nThe potential energy of the dipole equals the work done in rotating it from a reference orientation\nto the angle θ.\n\nFrom [Ch 1](01-electric-charges-and-fields.md), the torque needed to hold the dipole at angle θ is\nτ = pE sin θ. The small work done in rotating it through dθ against the field is\n\n```\n      dW = τ dθ = pE sin θ dθ\n```\n\nTaking the reference position as θ = 90° (where U is conventionally zero), the work done in rotating\nfrom 90° to θ is\n\n```\n      W = ∫[90°, θ] pE sin θ′ dθ′\n        = pE [ −cos θ′ ]₉₀°^θ\n        = pE ( −cos θ + cos 90° )\n        = −pE cos θ\n```\n\nSo\n\n```\n      U = −pE cos θ  =  −p · E\n```\n\n**U is minimum** when cos θ = 1, i.e. **θ = 0°** — the dipole aligned **parallel** to the field. Then\n\n```\n      U_min = −pE\n```\n\nThis is the position of **stable equilibrium**. (At θ = 180°, U = +pE is a maximum — unstable\nequilibrium.) ∎\n\n### Q9 — potential energy of three charges\n\n*Diagram:* an equilateral triangle of side 10 cm with q₁ = +2 μC, q₂ = −3 μC, q₃ = +4 μC at the\nvertices.\n\nAll three pairwise separations are equal: r = 10 cm = 0.1 m.\n\n```\n      U = k [ q₁q₂/r + q₂q₃/r + q₁q₃/r ]\n        = (k/r) [ q₁q₂ + q₂q₃ + q₁q₃ ]\n```\n\n```\n      q₁q₂ = (2 × 10⁻⁶)(−3 × 10⁻⁶) = −6 × 10⁻¹²\n      q₂q₃ = (−3 × 10⁻⁶)(4 × 10⁻⁶) = −12 × 10⁻¹²\n      q₁q₃ = (2 × 10⁻⁶)(4 × 10⁻⁶)  = +8 × 10⁻¹²\n                                     ─────────────\n      Sum                          = −10 × 10⁻¹² = −1 × 10⁻¹¹\n```\n\n```\n      U = (9 × 10⁹/0.1)(−1 × 10⁻¹¹)\n        = (9 × 10¹⁰)(−1 × 10⁻¹¹)\n        = −0.9 J\n```\n\n**U = −0.9 J**\n\nThe negative sign means the system is **bound** — external work of 0.9 J would be needed to separate\nthe three charges to infinity.\n\n### Q10 — when is C doubled?\n\nC = ε₀A/d depends only on the geometry and the medium.\n\n- Doubling d **halves** C — not (a).\n- Doubling A **doubles** C ✓\n- C does not depend on Q or V at all — not (c) or (d).\n\n**Answer: (b) the plate area is doubled**\n\n### Q11 — case study: parallel-plate capacitor\n\n```\n      A = 100 cm² = 100 × 10⁻⁴ m² = 1 × 10⁻² m²\n      d = 1 mm = 1 × 10⁻³ m\n      V = 100 V\n```\n\n**(i) Capacitance:**\n\n```\n      C = ε₀A/d = (8.854 × 10⁻¹²)(1 × 10⁻²)/(1 × 10⁻³)\n        = (8.854 × 10⁻¹⁴)/(10⁻³)\n        = 8.854 × 10⁻¹¹ F\n```\n\n**C ≈ 8.85 × 10⁻¹¹ F = 88.5 pF**\n\n**(ii) Charge stored:**\n\n```\n      Q = CV = (8.854 × 10⁻¹¹)(100) = 8.854 × 10⁻⁹ C\n```\n\n**Q ≈ 8.85 × 10⁻⁹ C = 8.85 nC**\n\n**(iii) Energy stored:**\n\n```\n      U = ½ CV² = ½ (8.854 × 10⁻¹¹)(100)²\n        = ½ (8.854 × 10⁻¹¹)(10⁴)\n        = ½ (8.854 × 10⁻⁷)\n        = 4.43 × 10⁻⁷ J\n```\n\n**U ≈ 4.43 × 10⁻⁷ J**\n\n**(iv) With K = 5 and the supply still connected.** V is constant, so C increases to KC and\n\n```\n      U′ = ½ (KC) V² = K × U = 5 × 4.43 × 10⁻⁷\n```\n\n**U′ ≈ 2.21 × 10⁻⁶ J** — five times the original energy, the extra energy being supplied by the\nbattery.\n\n### Q12 — Assertion–Reason\n\n**A:** \"When two charged capacitors at different potentials are connected, energy is always lost.\"\n**True** — the loss is ΔU = C₁C₂(V₁ − V₂)²/[2(C₁ + C₂)], which is strictly positive whenever\nV₁ ≠ V₂.\n\n**R:** \"Charge is conserved when capacitors are connected together.\" **True** — the total charge\nbefore and after redistribution is the same.\n\n**Does R explain A?** **No.** Charge conservation is what lets you *calculate* the common potential,\nbut it is not the reason energy is lost. The energy is lost because charge flows through the\nconnecting wire's resistance and is dissipated as heat. Conservation of charge, on its own, does not\nimply any energy loss.\n\n**Answer: (b) Both A and R are true, but R is not the correct explanation of A.**\n\n> This is a good example of the classic Assertion–Reason trap: two true statements, where the second\n> is relevant-sounding but explains something else.\n\n---","test":"Time: 50 minutes. Answers below.\n\n1. *(1)* The SI unit of capacitance is\n   (a) volt (b) coulomb (c) farad (d) joule\n2. *(1)* The potential at a point on the equatorial line of a short dipole is\n   (a) kp/r² (b) 2kp/r² (c) zero (d) kp/r³\n3. *(1)* Three capacitors each of 3 μF are connected in series. The equivalent capacitance is\n   (a) 9 μF (b) 1 μF (c) 3 μF (d) 1/9 μF\n4. *(2)* Define electric potential and write its SI unit. Is it a scalar or a vector?\n5. *(2)* A 10 μF capacitor is charged to 50 V. Find the charge and the energy stored.\n6. *(2)* Why does the capacitance of a parallel-plate capacitor increase when a dielectric is\n   inserted?\n7. *(3)* Two capacitors of 3 μF and 6 μF are connected in parallel across a 12 V battery. Find the\n   equivalent capacitance, the total charge, and the charge on each.\n8. *(3)* Derive the expression for the equivalent capacitance of three capacitors connected in\n   series.\n9. *(3)* A dipole of moment 3 × 10⁻⁸ C m is placed in a uniform field of 2 × 10⁴ N C⁻¹. Find the work\n   done in rotating it from 0° to 90°, and from 0° to 180°.\n10. *(5)* Derive the expression for the capacitance of a parallel-plate capacitor with air between\n    the plates. A capacitor of 200 pF is charged to 200 V; the battery is then disconnected and a\n    slab of K = 4 is inserted. Find the new capacitance, voltage and energy.\n11. *(2)* Two charges of +q and −q are placed 2a apart. Find the potential at the midpoint of the\n    line joining them, and at a point on the perpendicular bisector.\n12. *(2)* Sketch equipotential surfaces for (i) a single positive point charge and (ii) a uniform\n    electric field.\n13. *(3)* Find the work done in bringing a charge of 2 μC from infinity to a point 30 cm from a\n    charge of 5 μC.\n\n### Answer key\n\n**1. (c) farad.**\n\n**2. (c) zero.**\n\n**3. (b) 1 μF.** 1/C = 1/3 + 1/3 + 1/3 = 1, so C = 1 μF.\n\n**4.** The electric potential at a point is the **work done per unit positive charge** in bringing a\ntest charge from infinity to that point without acceleration: V = W/q. SI unit **volt (V) = J C⁻¹**.\nIt is a **scalar**.\n\n**5. Q = 5 × 10⁻⁴ C, U = 1.25 × 10⁻² J.** Q = CV = (10 × 10⁻⁶)(50) = 5 × 10⁻⁴ C.\nU = ½CV² = ½(10 × 10⁻⁶)(2500) = 1.25 × 10⁻² J = 12.5 mJ.\n\n**6.** The dielectric becomes **polarised**, developing an internal field that **opposes** the applied\nfield. The net field, and hence the potential difference V = Ed, is reduced by the factor K for the\nsame charge Q. Since C = Q/V, a smaller V for the same Q means a **larger C** — specifically K times\nlarger.\n\n**7. C = 9 μF, Q_total = 108 μC, Q₁ = 36 μC, Q₂ = 72 μC.**\nParallel: C = 3 + 6 = 9 μF. Q_total = CV = 9 × 12 = 108 μC.\nEach has the full 12 V across it: Q₁ = 3 × 12 = 36 μC; Q₂ = 6 × 12 = 72 μC. *(Sum = 108 ✓)*\n\n**8.** In series, the same charge Q appears on each capacitor, and the applied voltage divides:\nV = V₁ + V₂ + V₃. Since Vᵢ = Q/Cᵢ and V = Q/C,\nQ/C = Q/C₁ + Q/C₂ + Q/C₃, and dividing by Q gives **1/C = 1/C₁ + 1/C₂ + 1/C₃**. ∎\n\n**9. W(0°→90°) = 6 × 10⁻⁴ J; W(0°→180°) = 1.2 × 10⁻³ J.**\nW = pE(cos θ₁ − cos θ₂), with pE = (3 × 10⁻⁸)(2 × 10⁴) = 6 × 10⁻⁴ J.\n0° → 90°: W = 6 × 10⁻⁴(1 − 0) = 6 × 10⁻⁴ J.\n0° → 180°: W = 6 × 10⁻⁴(1 − (−1)) = 1.2 × 10⁻³ J.\n\n**10.** Derivation: for plates of area A separated by d, E = σ/ε₀ = Q/(Aε₀), and V = Ed = Qd/(Aε₀),\nso **C = Q/V = ε₀A/d**.\nNumerically, with the battery **disconnected** (Q constant):\nC′ = KC = 4 × 200 pF = **800 pF**.\nV′ = V/K = 200/4 = **50 V**.\nU′ = ½C′V′² = ½(800 × 10⁻¹²)(50)² = ½(800 × 10⁻¹²)(2500) = **1 × 10⁻⁶ J**.\n*(Check: U = ½(200 × 10⁻¹²)(200)² = 4 × 10⁻⁶ J, and U′ = U/K = 1 × 10⁻⁶ J ✓)*\n\n**11. At the midpoint: V = 0. On the perpendicular bisector: V = 0.**\nMidpoint: V = kq/a + k(−q)/a = 0. Perpendicular bisector: both charges are equidistant, so again the\nequal and opposite potentials cancel, giving V = 0 everywhere on it.\n\n**12.** (i) Point charge: **concentric spheres** centred on the charge, more widely spaced further\nout (since V ∝ 1/r). (ii) Uniform field: **parallel planes perpendicular to the field**, equally\nspaced.\n\n**13. 0.3 J.** W = qV where V is the potential at that point due to the 5 μC charge:\nV = kq/r = (9 × 10⁹)(5 × 10⁻⁶)/(0.3) = 1.5 × 10⁵ V.\nW = (2 × 10⁻⁶)(1.5 × 10⁵) = 0.3 J.\n\n**Scoring.** Out of 30. Below 21 → the two weak points are almost always (a) the dielectric-insertion\ntable, and (b) series-vs-parallel for capacitors. Rewrite both from memory before continuing.\n\n---","tips":"**On the derivations**\n\n1. **For the capacitor-with-slab derivation, split V into two parts explicitly:** the drop across the\n   air path (d − t) and the drop across the slab t. That splitting line is the key mark.\n\n2. **State the limiting checks** (t = 0 and t = d) at the end. It costs two lines and demonstrates\n   the result is right — examiners reward it and it protects you if you made an algebra slip.\n\n3. **For the energy derivation, show the integration.** dW = (q/C)dq, then integrate from 0 to Q.\n   Writing U = ½CV² without deriving it scores only the final mark.\n\n4. **For the dipole potential, state that potential is a scalar and therefore adds algebraically.**\n   That is why you can write V = kq/BP − kq/AP directly without resolving components — it is the\n   conceptual mark.\n\n5. **Do the \"for r >> a\" approximation explicitly**, and say what you are neglecting.\n\n**On the dielectric question**\n\n6. **Identify which case you are in, in the first line:** \"Since the battery is disconnected, the\n   charge Q remains constant.\" Everything else follows from that sentence, and it is the mark the\n   question is really testing.\n\n7. **Choose the energy formula that holds the constant quantity:** U = Q²/2C when Q is fixed;\n   U = ½CV² when V is fixed. Using the wrong one gives the wrong direction of change.\n\n8. **Give a reason for each change, not just the direction.** \"V decreases because Q is unchanged\n   while C has increased by K\" earns the mark; \"V decreases\" alone often does not.\n\n9. **Present it as a table when both cases are asked.** Faster to write and easier to mark.\n\n**On circuits**\n\n10. **In series: same charge, voltages add. In parallel: same voltage, charges add.** Write whichever\n    applies as your first line — it structures the whole answer.\n\n11. **Check your answer adds up.** In series, V₁ + V₂ must equal the supply. In parallel,\n    Q₁ + Q₂ must equal Q_total. Twenty seconds, and it catches most slips.\n\n12. **Capacitors combine the opposite way from resistors.** If you catch yourself adding capacitances\n    in series, stop.\n\n**On numericals**\n\n13. **Convert μF, pF, nC, cm² and mm to SI on their own line** before substituting. Note\n    100 cm² = 10⁻² m², **not** 1 m² — the factor is 10⁻⁴ per cm².\n\n14. **Keep the sign of charges in potential and potential-energy calculations.** Unlike field\n    magnitudes, V and U carry signs, and the sign is part of the answer — a negative U means a bound\n    system, and saying so earns the mark.\n\n15. **Units:** F for capacitance, V for potential, J for energy, C m for dipole moment, J m⁻³ for\n    energy density."}},{"id":"p3","subj":"physics","num":3,"title":"Current Electricity","unit":"Units I+II · Electrostatics & Current","unitMarks":16,"prio":1,"appear":"Units I + II (16 marks, shared with Ch 1 and Ch 2) · Typical appearance: 1–2 MCQs + one or two 2/3-mark questions + often the 5-mark drift-velocity or Wheatstone-bridge derivation. Also the single most likely source of a Section-D case study.","deleted":"- **Potentiometer** — theory **and** the practical experiments (comparing emfs of two cells;\n  measuring internal resistance)\n- **Carbon resistors** and the resistor **colour code**\n\n> **This is one of the biggest deletions in the syllabus.** The potentiometer was a guaranteed\n> 3–5 mark question for a decade. Its weight has gone to Kirchhoff's rules, the Wheatstone bridge and\n> the drift-velocity derivation. If a practice paper asks you to compare the emfs of two cells with a\n> potentiometer, or to read a resistor colour code, it is an old paper.","recall":"```\nI = q/t = dq/dt (ampere) ;  conventional current opposite to electron drift\n\nDRIFT:  v_d = eEτ/m  (~10⁻⁴ m s⁻¹) ;  I = n e A v_d\n        Ohm's law: R = ml/(ne²Aτ)  and  ρ = m/(ne²τ)\nJ = I/A = n e v_d = σE  (VECTOR) ;  μ = v_d/E = eτ/m ;  σ = neμ = 1/ρ\n\nR = ρl/A  ;  wire stretched to n times its length → R becomes n²R\n\nρ_T = ρ₀[1 + α(T − T₀)]\n  metals: α > 0, ρ↑ (τ falls) ;  semiconductors: α < 0, ρ↓ (n rises sharply)\n\nCELL:  ε = I(R + r) ;  V = ε − Ir  (discharging) ;  V = ε when I = 0\n  V–I graph of a cell: intercept = ε, |slope| = r\n  series   : ε_eq = Σεᵢ , r_eq = Σrᵢ\n  parallel : ε_eq = (ε₁r₂+ε₂r₁)/(r₁+r₂) , 1/r_eq = 1/r₁+1/r₂\n\nKIRCHHOFF: junction rule ΣI = 0  → conservation of CHARGE\n           loop rule ΣΔV = 0     → conservation of ENERGY\n\nWHEATSTONE (balanced, I_g = 0): P/Q = R/S       — a null method\nMETRE BRIDGE: R = S·l/(100 − l)\n\nP = VI = I²R = V²/R ;  max power to external R when R = r\n1 kWh = 3.6 × 10⁶ J\n```","s":{"scope":"### In the syllabus\n\n- Mechanism of the flow of current in conductors\n- **Mobility**, **drift velocity** and its relation with electric current\n- **Ohm's law**; V–I characteristics (linear and non-linear)\n- Electrical **energy and power**\n- Electrical **resistivity and conductivity**; **temperature dependence** of resistance\n- **Internal resistance** of a cell; potential difference and **emf**\n- **Combination of cells** in series and in parallel\n- **Kirchhoff's rules** and their applications\n- **Wheatstone bridge**\n\n### Deleted — do not study\n\n- **Potentiometer** — theory **and** the practical experiments (comparing emfs of two cells;\n  measuring internal resistance)\n- **Carbon resistors** and the resistor **colour code**\n\n> **This is one of the biggest deletions in the syllabus.** The potentiometer was a guaranteed\n> 3–5 mark question for a decade. Its weight has gone to Kirchhoff's rules, the Wheatstone bridge and\n> the drift-velocity derivation. If a practice paper asks you to compare the emfs of two cells with a\n> potentiometer, or to read a resistor colour code, it is an old paper.\n\n---","brief":"### Electric current\n\n```\n      I = q/t          (steady)              I = dq/dt          (instantaneous)\n```\n\nSI unit: **ampere (A)** = C s⁻¹. Current is a **scalar** despite having a direction associated with\nit. Conventional current flows from + to −, i.e. **opposite** to the electron drift.\n\n### Drift velocity\n\nIn a metal, free electrons move randomly at high speed (~10⁵ m s⁻¹) but with **zero average\nvelocity**. When a field **E** is applied, they acquire a small **additional** average velocity\nopposite to **E** — the **drift velocity**.\n\n```\n      v_d = (eE/m) τ\n```\n\nwhere τ is the **relaxation time** — the average time between successive collisions of an electron\nwith the lattice ions.\n\n**Drift velocity is tiny** — typically of the order of 10⁻⁴ m s⁻¹, i.e. a fraction of a millimetre\nper second. (The reason a lamp lights instantly is that the *field* is established through the wire\nat nearly the speed of light, not that electrons travel from the switch to the lamp.)\n\n### The current–drift velocity relation, and Ohm's law\n\n**This derivation is asked almost every year. Learn it as one continuous chain.**\n\nConsider a conductor of length l and cross-sectional area A, with n free electrons per unit volume,\neach of charge e, drifting with velocity v_d.\n\nIn a time Δt, every electron travels a distance v_d Δt, so all the electrons in a volume\n(A v_d Δt) cross a given cross-section. The number of such electrons is n(A v_d Δt), carrying charge\n\n```\n      Δq = n A v_d Δt · e\n```\n\nTherefore\n\n```\n      I = Δq/Δt  =  n e A v_d\n```\n\n**Now substitute the drift velocity.** With v_d = eEτ/m and E = V/l:\n\n```\n      I = n e A (eEτ/m)\n        = n e A (e τ/m)(V/l)\n        = ( n e² A τ / (m l) ) V\n```\n\nSo\n\n```\n      V = [ m l / (n e² A τ) ] I\n```\n\nwhich is **Ohm's law, V = IR**, with\n\n```\n      R = m l / (n e² A τ)\n```\n\nComparing with R = ρl/A gives the **resistivity**:\n\n```\n      ρ = m / (n e² τ)\n```\n\n> **This last step is the one students omit.** The question usually says \"…and hence deduce Ohm's\n> law\" or \"…hence obtain an expression for resistivity\". Stopping at I = neAv_d loses most of the\n> marks.\n\n### Resistance, resistivity, conductivity\n\n```\n      R = ρ l / A                   ρ = resistivity, unit Ω m\n      σ = 1/ρ                       conductivity, unit S m⁻¹ (or Ω⁻¹ m⁻¹)\n```\n\n**R depends on** the material (ρ), the length, the area, and the temperature.\n**ρ depends on** the material and the temperature **only** — not on the dimensions. That distinction\ngets asked.\n\n**Stretching a wire.** If a wire is stretched so its length becomes n times, the volume is unchanged,\nso A becomes A/n, and\n\n```\n      R′ = ρ(nl)/(A/n) = n² R\n```\n\nResistance becomes **n² times** — a favourite MCQ.\n\n**Current density and the microscopic Ohm's law:**\n\n```\n      J = I/A = n e v_d                       unit A m⁻²  (J is a VECTOR)\n      J = σ E                                 (microscopic form of Ohm's law)\n```\n\n**Mobility** — drift velocity per unit field:\n\n```\n      μ = v_d/E = eτ/m                        unit m² V⁻¹ s⁻¹\n```\n\nand then σ = neμ.\n\n### Temperature dependence\n\n```\n      ρ_T = ρ₀ [ 1 + α (T − T₀) ]\n```\n\nα is the **temperature coefficient of resistivity**, unit K⁻¹ (or °C⁻¹).\n\n| Material | α | Behaviour as T increases | Reason |\n| --- | --- | --- | --- |\n| **Metals / conductors** | positive | ρ **increases** | n is essentially constant, but τ decreases (more vigorous lattice vibrations ⟹ more frequent collisions) |\n| **Semiconductors** | negative | ρ **decreases** sharply | n increases rapidly (more electrons are thermally excited across the gap), which outweighs the fall in τ |\n| **Alloys** (nichrome, manganin) | small positive | ρ nearly constant | useful for standard resistors |\n\n**Graph — resistivity vs temperature:**\n\n```\n  ρ │           metal                       ρ │\n    │          ╱                              │╲\n    │        ╱                                │ ╲\n    │      ╱   (nearly linear, ρ ↑)           │  ╲___     semiconductor (ρ ↓ sharply)\n    │    ╱                                    │      ‾‾‾───────\n    └──────────────── T                       └──────────────── T\n```\n\nBeing able to draw and *explain* both curves via ρ = m/(ne²τ) is a reliable 2–3 mark question.\n\n### V–I characteristics\n\n- **Ohmic (linear):** a metallic conductor at constant temperature — a straight line through the\n  origin, slope 1/R.\n- **Non-ohmic (non-linear):** a semiconductor diode, a filament lamp (R rises with temperature), an\n  electrolyte. The graph is curved, and R is not constant.\n\n### emf, terminal potential difference and internal resistance\n\nThe **emf ε** of a cell is the potential difference across its terminals when **no current** is drawn\n(the open-circuit voltage). Its **internal resistance r** is the resistance of its electrolyte.\n\nWhen the cell drives a current I through an external resistance R:\n\n```\n      ε = I(R + r)                            I = ε/(R + r)\n```\n\nThe **terminal potential difference** is\n\n```\n      V = ε − I r                             (discharging)\n      V = ε + I r                             (while being charged)\n```\n\nSo V < ε whenever current is drawn, and V = ε only when I = 0.\n\n**From a V–I graph** of a cell: the **intercept on the V-axis is ε**, and the **magnitude of the\nslope is r**. That reading is a standard 2-mark question.\n\n### Combination of cells\n\n**In series** (n cells, emfs εᵢ, internal resistances rᵢ):\n\n```\n      ε_eq = ε₁ + ε₂ + … + εₙ                 r_eq = r₁ + r₂ + … + rₙ\n```\n\n*(If a cell is connected with reversed polarity, its emf enters with a minus sign.)*\n\n**In parallel** (two cells):\n\n```\n      ε_eq = (ε₁r₂ + ε₂r₁)/(r₁ + r₂)          1/r_eq = 1/r₁ + 1/r₂\n```\n\n**Which combination to use.** Series when the external resistance is **large** compared with r\n(you gain voltage); parallel when the external resistance is **small** compared with r (you reduce\nthe total internal resistance and so can draw more current).\n\n### Kirchhoff's rules\n\n**Rule 1 — the junction (or current) rule.** The algebraic sum of the currents meeting at any\njunction is zero: the total current entering equals the total current leaving.\n\n```\n      Σ I = 0                       — a statement of CONSERVATION OF CHARGE\n```\n\n**Rule 2 — the loop (or voltage) rule.** The algebraic sum of the changes in potential around any\nclosed loop is zero.\n\n```\n      Σ ΔV = 0                      — a statement of CONSERVATION OF ENERGY\n```\n\n> **Always name the conservation law each rule expresses.** \"Junction rule — conservation of charge;\n> loop rule — conservation of energy.\" That is a full mark and it is asked explicitly.\n\n**Sign conventions for the loop rule** (fix one and use it consistently):\n- Traversing a resistor **in the direction of the current**: potential change = −IR.\n- Traversing a resistor **against the current**: +IR.\n- Traversing a cell from **− to +**: +ε. From **+ to −**: −ε.\n\n### Wheatstone bridge\n\n*Circuit:* four resistances P, Q, R, S forming a quadrilateral ABCD; a galvanometer between B and D;\na cell between A and C.\n\nThe bridge is **balanced** when no current flows through the galvanometer. The balance condition is\n\n```\n      P/Q = R/S\n```\n\n**Derivation (using Kirchhoff's rules).** At balance, I_g = 0, so the current I₁ flows through P and\nthen Q, while I₂ flows through R and then S.\n\nApplying the loop rule to loop ABDA (with no galvanometer current):\n\n```\n      I₁ P − I₂ R = 0          ⟹     I₁ P = I₂ R          …(i)\n```\n\nApplying the loop rule to loop BCDB:\n\n```\n      I₁ Q − I₂ S = 0          ⟹     I₁ Q = I₂ S          …(ii)\n```\n\nDividing (i) by (ii):\n\n```\n      P/Q = R/S\n```\n\n**Why the bridge is useful:** at balance the result does not involve the emf of the cell or the\ngalvanometer's resistance, so an unknown resistance can be found very accurately from three known\nones. This is a **null method** — its accuracy does not depend on the sensitivity of the meter\nreading, only on detecting zero.\n\n### Metre bridge\n\nA practical Wheatstone bridge in which two arms are replaced by a uniform 1 m resistance wire.\n\nWith the unknown R in one gap, a known resistance S in the other, and the balance point at length l\ncm from one end:\n\n```\n      R/S = l/(100 − l)              ⟹     R = S · l/(100 − l)\n```\n\n**Precautions/notes that get asked:** the balance point should be near the middle of the wire (that\nis where the bridge is most sensitive); the jockey should be pressed gently and briefly to avoid\naltering the wire.\n\n### Electrical power and energy\n\n```\n      P = VI = I²R = V²/R                     unit watt (W)\n      Energy = Pt                             unit joule; commercially kWh (1 kWh = 3.6 × 10⁶ J)\n```\n\n**Which form to use:** I²R when the current is common (series); V²/R when the voltage is common\n(parallel).\n\n**Maximum power transfer.** The power delivered to an external resistance R by a cell of emf ε and\ninternal resistance r is maximum when **R = r**.\n\n### Quick recall box\n\n```\nI = q/t = dq/dt (ampere) ;  conventional current opposite to electron drift\n\nDRIFT:  v_d = eEτ/m  (~10⁻⁴ m s⁻¹) ;  I = n e A v_d\n        Ohm's law: R = ml/(ne²Aτ)  and  ρ = m/(ne²τ)\nJ = I/A = n e v_d = σE  (VECTOR) ;  μ = v_d/E = eτ/m ;  σ = neμ = 1/ρ\n\nR = ρl/A  ;  wire stretched to n times its length → R becomes n²R\n\nρ_T = ρ₀[1 + α(T − T₀)]\n  metals: α > 0, ρ↑ (τ falls) ;  semiconductors: α < 0, ρ↓ (n rises sharply)\n\nCELL:  ε = I(R + r) ;  V = ε − Ir  (discharging) ;  V = ε when I = 0\n  V–I graph of a cell: intercept = ε, |slope| = r\n  series   : ε_eq = Σεᵢ , r_eq = Σrᵢ\n  parallel : ε_eq = (ε₁r₂+ε₂r₁)/(r₁+r₂) , 1/r_eq = 1/r₁+1/r₂\n\nKIRCHHOFF: junction rule ΣI = 0  → conservation of CHARGE\n           loop rule ΣΔV = 0     → conservation of ENERGY\n\nWHEATSTONE (balanced, I_g = 0): P/Q = R/S       — a null method\nMETRE BRIDGE: R = S·l/(100 − l)\n\nP = VI = I²R = V²/R ;  max power to external R when R = r\n1 kWh = 3.6 × 10⁶ J\n```\n\n---","pyq":"**Q1.** *(5 marks)* Define drift velocity. Derive the relation I = neAv_d for a metallic conductor,\nand hence deduce Ohm's law. Obtain an expression for the resistivity of the conductor in terms of\nthe relaxation time.\n\n**Q2.** *(3 marks)* State Kirchhoff's rules and name the conservation law each one expresses. Using\nthem, derive the balance condition of a Wheatstone bridge.\n\n**Q3.** *(3 marks)* Explain, using ρ = m/(ne²τ), why the resistivity of a metal increases while that\nof a semiconductor decreases with rising temperature. Draw both graphs.\n\n**Q4.** *(3 marks)* Two cells of emfs ε₁ and ε₂ and internal resistances r₁ and r₂ are connected in\nparallel. Derive expressions for the equivalent emf and equivalent internal resistance.\n\n**Q5.** *(2 marks)* A cell of emf 2 V and internal resistance 0.5 Ω is connected across a 4.5 Ω\nresistor. Find the current and the terminal potential difference.\n\n**Q6.** *(2 marks)* Define mobility of a charge carrier and write its SI unit. How does it depend on\nthe relaxation time?\n\n**Q7.** *(3 marks)* In a metre bridge, the balance point is found at 40 cm from the left end when a\nresistance of 6 Ω is in the right gap. Find the unknown resistance in the left gap. Why is the\nbalance point best kept near the middle of the wire?\n\n**Q8.** *(3 marks)* A wire of resistance R is stretched until its length is doubled. What is its new\nresistance? Explain.\n\n**Q9.** *(2 marks)* Draw the V–I graph for (i) an ohmic conductor and (ii) a semiconductor diode.\nState one difference.\n\n**Q10.** *(1 mark, MCQ)* When the temperature of a metallic conductor is increased, its resistance\n(a) increases (b) decreases (c) remains the same (d) first decreases then increases\n\n**Q11.** *(4 marks, case study)* A student measures the terminal potential difference V across a cell\nfor different currents I, and plots V against I. The graph is a straight line with a V-axis intercept\nof 1.5 V and a slope of magnitude 0.4 V A⁻¹.\n(i) What does the intercept represent?\n(ii) What does the slope represent?\n(iii) Write the equation of the line.\n(iv) Find the current when the cell is short-circuited.\n\n**Q12.** *(3 marks)* Using Kirchhoff's rules, find the current in each branch of the circuit below: a\n10 V cell (negligible internal resistance) in series with a 2 Ω resistor feeds two parallel\nresistors of 4 Ω and 6 Ω.\n\n---","sol":"### Q1 — drift velocity, I = neAv_d, Ohm's law and resistivity\n\n*Diagram:* a cylindrical conductor of length l and area A, with a battery across it, an arrow showing\n**E** inside, and electrons drifting opposite to **E**.\n\n**Definition of drift velocity.** When a potential difference is applied across a conductor, the free\nelectrons acquire, in addition to their random thermal motion, a small **average velocity in the\ndirection opposite to the applied field**. This average velocity is called the **drift velocity**.\n\n```\n      v_d = (eE/m) τ\n```\n\nwhere τ is the relaxation time (the average time between two successive collisions).\n\n**Derivation of I = neAv_d.**\n\nLet the conductor have cross-sectional area A and n free electrons per unit volume, each of charge e,\ndrifting with speed v_d.\n\nIn a small time Δt, each electron covers a distance v_d Δt. Hence **all** the electrons contained in\na cylinder of length v_d Δt and cross-section A will cross a given plane in that time.\n\n```\n      Volume of that cylinder = A v_d Δt\n      Number of electrons in it = n A v_d Δt\n      Charge crossing the plane, Δq = (n A v_d Δt) e\n```\n\nTherefore\n\n```\n      I = Δq/Δt = n e A v_d\n```\n\n**Hence Ohm's law.** Substituting v_d = eEτ/m, and E = V/l for a uniform conductor:\n\n```\n      I = n e A · (eτ/m) · (V/l)\n        = ( n e² A τ / m l ) V\n```\n\nRearranging,\n\n```\n      V = [ m l / (n e² A τ) ] I\n```\n\nThe bracket is a constant for a given conductor at a given temperature. So\n\n```\n      V ∝ I,     i.e.     V = I R          — Ohm's law\n```\n\nwith\n\n```\n      R = m l / (n e² A τ)\n```\n\n**Resistivity.** Comparing with R = ρ l/A:\n\n```\n      ρ l/A = m l/(n e² A τ)\n⟹     ρ = m / (n e² τ)\n```\n\n∎\n\n*(Note what this expression tells you: ρ depends only on the material properties n and τ, and on\ntemperature through τ and n — not on the dimensions of the conductor. That is why ρ is a material\nconstant while R is not.)*\n\n### Q2 — Kirchhoff's rules and the Wheatstone bridge\n\n**Kirchhoff's rules.**\n\n**1. Junction rule.** The algebraic sum of the currents at any junction in a circuit is zero — the\ntotal current entering a junction equals the total current leaving it.\n\n```\n      Σ I = 0\n```\n\nThis expresses the **conservation of electric charge** (charge cannot accumulate at a junction).\n\n**2. Loop rule.** The algebraic sum of the changes in potential around any closed loop of a circuit\nis zero.\n\n```\n      Σ ΔV = 0\n```\n\nThis expresses the **conservation of energy** (a charge returning to its starting point must have no\nnet change in potential energy).\n\n**Wheatstone bridge — balance condition.**\n\n*Circuit:* draw the quadrilateral ABCD with P in AB, Q in BC, R in AD, S in DC; a galvanometer G\nbetween B and D; a cell with a key between A and C.\n\nAt balance, **no current flows through the galvanometer** (I_g = 0). Hence the current I₁ entering at\nA through P continues through Q, and the current I₂ through R continues through S.\n\n**Loop ABDA** (traversing A → B → D → A). With I_g = 0 the galvanometer branch contributes nothing,\nso the potential drop across P must equal that across R:\n\n```\n      I₁ P − I₂ R = 0\n⟹     I₁ P = I₂ R                    …(i)\n```\n\n**Loop BCDB** (traversing B → C → D → B):\n\n```\n      I₁ Q − I₂ S = 0\n⟹     I₁ Q = I₂ S                    …(ii)\n```\n\n**Dividing (i) by (ii):**\n\n```\n      (I₁ P)/(I₁ Q) = (I₂ R)/(I₂ S)\n⟹     P/Q = R/S\n```\n\nThis is the **balance condition of the Wheatstone bridge**. ∎\n\n**Why it is useful.** The condition does not contain the emf of the cell or the resistance of the\ngalvanometer, so an unknown resistance can be determined accurately from three known ones. Being a\n**null method**, its accuracy depends only on detecting zero deflection, not
